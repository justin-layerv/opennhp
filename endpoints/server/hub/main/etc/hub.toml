# Example only. Deployment must replace every <required-...> value before the
# process starts; strict validation fails closed on these placeholders.
environment = "sandbox"

# Customer/application assignment traffic is UDP only. The separate TCP
# listener accepts and closes NLB health checks without reading a payload; the
# later infrastructure slice must restrict it to the private health-check path.
udp_listen_addr = "0.0.0.0:62206"
health_listen_addr = "0.0.0.0:62207"

private_key = "<required-canonical-32-byte-base64>"
active_cookie_key = "<required-canonical-32-byte-base64>"
previous_cookie_key = ""

aws_region = "us-east-2"
aws_account_id = "<required-12-digit-account-id>"
issue_assignment_alias_arn = "<required-issue-assignment-blue-or-green-alias-arn>"
refresh_assignment_alias_arn = "<required-refresh-assignment-blue-or-green-alias-arn>"
issue_credential_recovery_alias_arn = "<required-issue-credential-recovery-blue-or-green-alias-arn>"

# Required receipt-anchored measurement/ready ladder. Deployment renders these
# from one reviewed runtime contract; this source file intentionally contains no
# experimental or final values.
# Validation requires 3s <= authority_lambda_timeout < handler_budget <
# packet_budget < 30s and 0 < write_budget <= response_reserve <=
# packet_budget - handler_budget.
authority_lambda_timeout = "<required-integral-seconds-duration>"
handler_budget = "<required-duration>"
packet_budget = "<required-duration>"
response_reserve = "<required-duration>"
write_budget = "<required-duration>"

max_concurrent_packets = 64
packets_per_second = 128
packet_burst = 256
max_concurrent_per_peer = 4
response_queue_capacity = 64
