# Pass: representative shape of build-and-push.yml — every inner pattern covered.
on:
  push:
    branches: [main]
    paths:
      - 'nhp/**'
      - 'docker/**'
      - 'terraform/**'
      - 'tests/**'
      - 'packer/**'
      - '.trivyignore'
jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            app:
              - 'nhp/**'
              - 'docker/**'
              - '.trivyignore'
            infra:
              - 'terraform/**'
            packer:
              - 'packer/**'
            lambdas:
              - 'terraform/lambda/**'
