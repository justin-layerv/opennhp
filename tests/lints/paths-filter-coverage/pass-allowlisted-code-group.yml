# Pass: previous-line `# lint-allow:` annotation exempts the group from coverage.
on:
  push:
    branches: [main]
    paths:
      - 'nhp/**'
      - '.github/workflows/build-and-push.yml'
jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            # lint-allow: paths-filter-coverage
            code:
              - 'nhp/**'
              - '.github/workflows/**'
            app:
              - 'nhp/**'
