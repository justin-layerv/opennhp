# Bad input: a filter value that's not a string (e.g., dorny supports
# per-change-type mappings like `{added|modified: 'src/**'}`). covers()
# reasons in path strings — the lint refuses (exit 2) rather than
# pretending to handle a structure it can't compare. Pin the contract.
on:
  push:
    branches: [main]
    paths:
      - 'nhp/**'
jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            app:
              - added|modified: 'nhp/**'
