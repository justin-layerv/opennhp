# Pass: omitted `on.push.paths` means universal coverage (workflow fires on every push).
on:
  push:
    branches: [main]
jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            app:
              - 'nhp/**'
              - '.trivyignore'
            packer:
              - 'packer/**'
