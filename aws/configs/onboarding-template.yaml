# LayerV NHP Customer Onboarding Template
#
# Complete this form and return to your LayerV representative
# or upload via the LayerV Console at https://console.layerv.ai/onboarding
#
# Version: 1.0
# Last Updated: 2024-12

# ============================================================================
# SECTION 1: COMPANY INFORMATION
# ============================================================================
company:
  name: ""                           # Required: Legal company name
  billing_email: ""                  # Required: For invoices
  technical_email: ""                # Required: For technical alerts
  website: ""                        # Optional

  # Primary technical contact
  primary_contact:
    name: ""                         # Required
    email: ""                        # Required
    phone: ""                        # Optional

  # Backup contact (recommended)
  secondary_contact:
    name: ""
    email: ""
    phone: ""

# ============================================================================
# SECTION 2: AWS ACCOUNT INFORMATION
# ============================================================================
aws:
  account_id: ""                     # Required: 12-digit AWS Account ID
  region: "us-east-1"                # Required: Primary deployment region

  # VPC where AC will be deployed
  vpc:
    vpc_id: ""                       # Required: e.g., vpc-0123456789abcdef0
    subnet_ids:                      # Required: At least one subnet
      - ""                           # e.g., subnet-0123456789abcdef0

  # Optional: Additional regions for HA
  additional_regions: []

# ============================================================================
# SECTION 3: IDENTITY PROVIDER (IDP) CONFIGURATION
# ============================================================================
identity_provider:
  # Supported types: okta, azure_ad, auth0, google_workspace, ping, custom_oidc
  type: "okta"                       # Required

  # OIDC Configuration (for okta, auth0, google_workspace, custom_oidc)
  oidc:
    domain: ""                       # Required: e.g., company.okta.com
    client_id: ""                    # Required: OAuth Client ID
    # client_secret: ""              # Only if using server-side flow
    issuer_url: ""                   # Required: e.g., https://company.okta.com
    jwks_url: ""                     # Required: e.g., https://company.okta.com/.well-known/jwks.json
    scopes:                          # Optional: defaults shown
      - openid
      - profile
      - email

  # Azure AD specific (if type: azure_ad)
  azure_ad:
    tenant_id: ""
    client_id: ""

  # Custom claims to extract (optional)
  custom_claims:
    - groups                         # For group-based access control
    - department                     # Optional

# ============================================================================
# SECTION 4: PROTECTED RESOURCES
# ============================================================================
# Define the resources you want to protect with NHP
# Each resource gets a unique ID and access policy

resources:
  # Example: Production Database
  - name: "Production Database"
    id: "prod-db"                    # Unique identifier (lowercase, alphanumeric, hyphens)
    description: "PostgreSQL production database"

    destinations:
      - ip: "10.0.1.50"              # Internal IP address
        port: 5432                   # Port number
        protocol: "tcp"              # tcp or udp
        hostname: ""                 # Optional: DNS hostname

    access:
      allowed_groups:                # IdP groups that can access
        - "db-admins"
        - "backend-developers"
      allowed_users: []              # Optional: specific user emails
      mfa_required: true             # Require MFA for access
      access_duration: 3600          # Seconds (default: 1 hour)

    schedule:                        # Optional: time-based restrictions
      enabled: false
      timezone: "America/New_York"
      allowed_days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
      allowed_hours: "09:00-18:00"

  # Example: SSH Bastion
  - name: "SSH Bastion"
    id: "ssh-bastion"
    description: "SSH access to jump host"

    destinations:
      - ip: "10.0.2.10"
        port: 22
        protocol: "tcp"

    access:
      allowed_groups:
        - "devops"
        - "sre"
      mfa_required: true
      access_duration: 1800          # 30 minutes for SSH

  # Add more resources as needed...

# ============================================================================
# SECTION 5: AGENT DEPLOYMENT
# ============================================================================
agents:
  # Platforms your users need
  platforms:
    windows: true
    macos: true
    linux: false
    ios: false
    android: false

  # MDM Integration (optional)
  mdm:
    enabled: false
    provider: ""                     # jamf, intune, workspace_one, etc.

  # Device requirements (optional)
  device_posture:
    require_managed_device: false
    require_disk_encryption: false
    require_antivirus: false
    require_os_updates: false

# ============================================================================
# SECTION 6: LOGGING & COMPLIANCE
# ============================================================================
logging:
  retention_days: 90                 # 30, 90, 180, 365

  # SIEM Integration (optional)
  siem:
    enabled: false
    type: ""                         # splunk, datadog, sumo_logic, etc.
    webhook_url: ""

  # Export to customer S3 bucket (optional)
  s3_export:
    enabled: false
    bucket_arn: ""

compliance:
  requirements: []                   # SOC2, HIPAA, PCI_DSS, GDPR, etc.
  require_privatelink: false         # Enterprise feature

# ============================================================================
# SECTION 7: SUBSCRIPTION & BILLING
# ============================================================================
subscription:
  tier: "team"                       # starter, team, business, enterprise
  estimated_users: 100               # For capacity planning
  billing_cycle: "annual"            # monthly, annual

  # Billing address
  billing_address:
    street: ""
    city: ""
    state: ""
    postal_code: ""
    country: ""

# ============================================================================
# INTERNAL USE ONLY (LayerV fills this out)
