AWSTemplateFormatVersion: '2010-09-09'
Description: |
  LayerV NHP Access Controller (AC) Deployment
  Deploys the NHP-AC component into your VPC to protect internal resources.
  For more information, visit https://layerv.ai

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: LayerV Configuration
        Parameters:
          - OrganizationId
          - ACApiKey
          - LayerVServerEndpoint
          - LayerVServerPublicKey
      - Label:
          default: Network Configuration
        Parameters:
          - VpcId
          - SubnetId
          - AssociatePublicIp
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceType
          - KeyPairName
      - Label:
          default: Protected Resources
        Parameters:
          - ProtectedCIDRs
          - ProtectedPorts

Parameters:
  # LayerV Configuration
  OrganizationId:
    Type: String
    Description: Your LayerV Organization ID (provided after subscription)
    AllowedPattern: ^[a-zA-Z0-9._-]+$
    ConstraintDescription: Must be a valid organization ID

  ACApiKey:
    Type: String
    Description: Your LayerV API Key (provided after subscription)
    NoEcho: true
    MinLength: 16

  LayerVServerEndpoint:
    Type: String
    Description: LayerV NHP Server endpoint
    Default: nhp.layerv.ai

  LayerVServerPublicKey:
    Type: String
    Description: LayerV NHP Server public key (base64)
    Default: ""

  # Network Configuration
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the AC will be deployed

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the AC instance (private subnet recommended)

  AssociatePublicIp:
    Type: String
    Description: Associate a public IP (required if in public subnet without NAT)
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  # Instance Configuration
  InstanceType:
    Type: String
    Description: EC2 instance type for the AC
    Default: t3.medium
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - c6i.large
      - c6i.xlarge

  KeyPairName:
    Type: String
    Description: EC2 Key Pair for SSH access (optional, leave empty to skip)
    Default: ""

  # Protected Resources
  ProtectedCIDRs:
    Type: String
    Description: CIDR blocks of protected resources (comma-separated)
    Default: 10.0.0.0/8
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}(,\s*(\d{1,3}\.){3}\d{1,3}/\d{1,2})*$

  ProtectedPorts:
    Type: String
    Description: Ports to protect (comma-separated, e.g., 22,443,5432)
    Default: "22,443,3306,5432,6379"

Mappings:
  RegionAMI:
    us-east-1:
      AMI: ami-0c7217cdde317cfec  # Ubuntu 22.04 LTS
    us-east-2:
      AMI: ami-05fb0b8c1424f266b
    us-west-1:
      AMI: ami-0ce2cb35386fc22e9
    us-west-2:
      AMI: ami-008fe2fc65df48dac
    eu-west-1:
      AMI: ami-0905a3c97561e0b69
    eu-central-1:
      AMI: ami-0faab6bdbac9486fb
    ap-northeast-1:
      AMI: ami-07c589821f2b353aa
    ap-southeast-1:
      AMI: ami-078c1149d8ad719a7
    ap-southeast-2:
      AMI: ami-04f5097681773b989

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]
  UsePublicIp: !Equals [!Ref AssociatePublicIp, "true"]

Resources:
  # Security Group for AC
  ACSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub layerv-nhp-ac-${AWS::StackName}
      GroupDescription: Security group for LayerV NHP Access Controller
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # NHP Protocol (UDP) - the ONLY exposed port (NHP-compliant)
        - IpProtocol: udp
          FromPort: 62206
          ToPort: 62206
          CidrIp: 0.0.0.0/0
          Description: NHP Protocol from LayerV Server - only exposed port
      SecurityGroupEgress:
        # NHP Protocol to LayerV Server
        - IpProtocol: udp
          FromPort: 62206
          ToPort: 62206
          CidrIp: 0.0.0.0/0
          Description: NHP Protocol to LayerV Server
        # HTTPS for updates and IdP (if needed)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound
        # Access to protected resources (internal)
        - IpProtocol: -1
          CidrIp: !Select [0, !Split [",", !Ref ProtectedCIDRs]]
          Description: Access to protected resources
      Tags:
        - Key: Name
          Value: !Sub layerv-nhp-ac-${AWS::StackName}
        - Key: layerv:organization
          Value: !Ref OrganizationId

  # IAM Role for AC Instance
  ACInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub layerv-nhp-ac-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ACSecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Ref ACSecret
        - PolicyName: ACCustomMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: LayerV/NHP
        - PolicyName: ECRPull
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:*:repository/layerv/*
      Tags:
        - Key: layerv:organization
          Value: !Ref OrganizationId

  ACInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub layerv-nhp-ac-profile-${AWS::StackName}
      Roles:
        - !Ref ACInstanceRole

  # Secrets Manager for API Key and generated keys
  ACSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub layerv-nhp-ac-${AWS::StackName}
      Description: LayerV NHP AC credentials and keys
      SecretString: !Sub |
        {
          "organization_id": "${OrganizationId}",
          "api_key": "${ACApiKey}",
          "server_endpoint": "${LayerVServerEndpoint}",
          "server_public_key": "${LayerVServerPublicKey}",
          "ac_private_key": "",
          "ac_public_key": ""
        }
      Tags:
        - Key: layerv:organization
          Value: !Ref OrganizationId

  # CloudWatch Log Group
  ACLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /layerv/nhp-ac/${AWS::StackName}
      RetentionInDays: 30
      Tags:
        - Key: layerv:organization
          Value: !Ref OrganizationId

  # EC2 Instance for AC
  ACInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - ACSecret
    Properties:
      ImageId: !FindInMap [RegionAMI, !Ref AWS::Region, AMI]
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ACInstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref AWS::NoValue]
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref ACSecurityGroup
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref ACSecurityGroup
          AssociatePublicIpAddress: !If [UsePublicIp, true, false]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ex

          # Log everything to file and console
          exec > >(tee /var/log/user-data.log | logger -t user-data) 2>&1
          echo "Starting LayerV NHP-AC installation at $(date)"

          # Install dependencies
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y awscli jq docker.io iptables ipset curl python3-pip

          # Install CloudWatch agent for NHP-compliant health monitoring (no HTTP)
          wget -q https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
          dpkg -i amazon-cloudwatch-agent.deb || apt-get install -f -y

          # Enable and start Docker
          systemctl enable docker
          systemctl start docker

          # Wait for Docker to be ready
          for i in {1..30}; do docker info && break || sleep 2; done

          # Get secrets from Secrets Manager
          SECRET_ARN="${ACSecret}"
          REGION="${AWS::Region}"
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --region "$REGION" \
            --query SecretString \
            --output text)

          ORG_ID=$(echo "$SECRET" | jq -r '.organization_id')
          API_KEY=$(echo "$SECRET" | jq -r '.api_key')
          SERVER_ENDPOINT=$(echo "$SECRET" | jq -r '.server_endpoint')
          SERVER_PUBKEY=$(echo "$SECRET" | jq -r '.server_public_key')
          EXISTING_PRIVKEY=$(echo "$SECRET" | jq -r '.ac_private_key // empty')

          # Get instance metadata using IMDSv2
          TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
          LOCAL_IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)
          AZ=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/availability-zone)

          # Create config directory
          mkdir -p /opt/layerv/nhp-ac/etc
          mkdir -p /opt/layerv/nhp-ac/log

          # Generate Curve25519 keypair (only if not already generated)
          if [ -z "$EXISTING_PRIVKEY" ] || [ "$EXISTING_PRIVKEY" = "null" ]; then
            echo "Generating new Curve25519 keypair..."
            # Generate 32 random bytes with proper clamping for Curve25519
            AC_PRIVKEY=$(python3 -c '
          import os, base64
          key = bytearray(os.urandom(32))
          # Apply Curve25519 clamping
          key[0] &= 248
          key[31] = (key[31] & 127) | 64
          print(base64.b64encode(bytes(key)).decode())
          ')

            # Update secret with generated key
            UPDATED_SECRET=$(echo "$SECRET" | jq --arg pk "$AC_PRIVKEY" '.ac_private_key = $pk')
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_ARN" \
              --secret-string "$UPDATED_SECRET" \
              --region "$REGION"

            echo "Generated and stored new private key"
          else
            AC_PRIVKEY="$EXISTING_PRIVKEY"
            echo "Using existing private key from secrets"
          fi

          # Create config.toml
          cat > /opt/layerv/nhp-ac/etc/config.toml << CONFIGEOF
          # LayerV NHP-AC Configuration
          # Auto-generated by CloudFormation

          ACId = "$INSTANCE_ID"
          DefaultIp = "$LOCAL_IP"
          PrivateKeyBase64 = "$AC_PRIVKEY"
          DefaultCipherScheme = 1
          IpPassMode = 0
          LogLevel = 3
          AuthServiceId = "$ORG_ID"
          ResourceIds = ["default"]
          FilterMode = 0
          CONFIGEOF

          # Create server.toml
          cat > /opt/layerv/nhp-ac/etc/server.toml << SERVEREOF
          # LayerV NHP Server Connection

          [[Servers]]
          Hostname = "$SERVER_ENDPOINT"
          Ip = ""
          Port = 62206
          PubKeyBase64 = "$SERVER_PUBKEY"
          ExpireTime = 1924991999
          SERVEREOF

          # Create resource.toml
          cat > /opt/layerv/nhp-ac/etc/resource.toml << RESOURCEEOF
          # Protected Resources

          [[Resources]]
          AuthServiceId = "$ORG_ID"
          ResourceId = "default"
          ServerAddr = "$SERVER_ENDPOINT"
          RESOURCEEOF

          # Set up iptables
          cat > /opt/layerv/nhp-ac/iptables_setup.sh << 'IPTABLES_EOF'
          #!/bin/bash
          # LayerV NHP-AC iptables setup

          # Create ipsets for dynamic rules
          ipset create nhp_allowed hash:ip,port timeout 3600 -exist
          ipset create nhp_blocked hash:ip timeout 86400 -exist

          # Default DROP policy for protected resources
          iptables -N NHP_FILTER 2>/dev/null || iptables -F NHP_FILTER
          iptables -A NHP_FILTER -m set --match-set nhp_allowed src,dst -j ACCEPT
          iptables -A NHP_FILTER -m set --match-set nhp_blocked src -j DROP
          iptables -A NHP_FILTER -j DROP

          # Apply to protected ports
          PROTECTED_PORTS="${ProtectedPorts}"
          for port in $(echo $PROTECTED_PORTS | tr ',' ' '); do
            iptables -C INPUT -p tcp --dport $port -j NHP_FILTER 2>/dev/null || \
            iptables -I INPUT -p tcp --dport $port -j NHP_FILTER
          done

          echo "iptables configured for NHP filtering"
          IPTABLES_EOF
          chmod +x /opt/layerv/nhp-ac/iptables_setup.sh

          # Run iptables setup
          /opt/layerv/nhp-ac/iptables_setup.sh

          # Configure CloudWatch agent for NHP-compliant health monitoring (no HTTP endpoints)
          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'CWEOF'
          {
            "agent": {
              "metrics_collection_interval": 60,
              "run_as_user": "root"
            },
            "metrics": {
              "namespace": "LayerV/NHP",
              "append_dimensions": {
                "InstanceId": "${!aws:InstanceId}"
              },
              "metrics_collected": {
                "procstat": [
                  {
                    "pattern": "nhp-ac",
                    "measurement": ["pid_count", "cpu_usage", "memory_rss"]
                  }
                ],
                "mem": {
                  "measurement": ["mem_used_percent"]
                }
              }
            }
          }
          CWEOF

          # Start CloudWatch agent
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json

          # Create health monitoring script (CloudWatch only, no HTTP)
          cat > /opt/layerv/nhp-ac/health-monitor.sh << 'HEALTHEOF'
          #!/bin/bash
          # NHP-compliant health monitoring - publishes to CloudWatch only, no exposed ports
          REGION=$(curl -s -H "X-aws-ec2-metadata-token: $(curl -s -X PUT http://169.254.169.254/latest/api/token -H X-aws-ec2-metadata-token-ttl-seconds:21600)" http://169.254.169.254/latest/meta-data/placement/region)
          INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $(curl -s -X PUT http://169.254.169.254/latest/api/token -H X-aws-ec2-metadata-token-ttl-seconds:21600)" http://169.254.169.254/latest/meta-data/instance-id)

          while true; do
            if docker ps | grep -q nhp-ac; then
              HEALTH=1
            else
              HEALTH=0
            fi

            aws cloudwatch put-metric-data \
              --namespace "LayerV/NHP" \
              --metric-name "ACHealth" \
              --value $HEALTH \
              --dimensions "InstanceId=$INSTANCE_ID" \
              --region "$REGION"

            sleep 60
          done
          HEALTHEOF
          chmod +x /opt/layerv/nhp-ac/health-monitor.sh

          # Create systemd service for health monitor (CloudWatch-based)
          cat > /etc/systemd/system/nhp-health-monitor.service << 'SVCEOF'
          [Unit]
          Description=NHP Health Monitor (CloudWatch)
          After=network.target docker.service

          [Service]
          Type=simple
          ExecStart=/opt/layerv/nhp-ac/health-monitor.sh
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          # Create systemd service for NHP-AC container
          cat > /etc/systemd/system/nhp-ac.service << 'SVCEOF'
          [Unit]
          Description=LayerV NHP Access Controller
          After=network.target docker.service
          Requires=docker.service

          [Service]
          Type=simple
          Restart=always
          RestartSec=10
          ExecStartPre=-/usr/bin/docker stop nhp-ac
          ExecStartPre=-/usr/bin/docker rm nhp-ac
          # Try ECR first, fall back to public registry
          ExecStartPre=/bin/bash -c 'aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin 084375564552.dkr.ecr.${AWS::Region}.amazonaws.com || true'
          ExecStartPre=/bin/bash -c 'docker pull 084375564552.dkr.ecr.${AWS::Region}.amazonaws.com/layerv/nhp-ac:latest || docker pull layerv/nhp-ac:latest || true'
          ExecStart=/usr/bin/docker run --rm --name nhp-ac \
            --net=host \
            --cap-add=NET_ADMIN \
            -v /opt/layerv/nhp-ac/etc:/etc/nhp:ro \
            -v /opt/layerv/nhp-ac/log:/var/log/nhp \
            layerv/nhp-ac:latest
          ExecStop=/usr/bin/docker stop nhp-ac

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          # Start services
          systemctl daemon-reload
          systemctl enable nhp-health-monitor nhp-ac
          systemctl start nhp-health-monitor

          # Try to start NHP-AC (may fail if image not available)
          systemctl start nhp-ac || echo "NHP-AC start deferred - image may not be available"

          # Send custom metric for successful boot
          aws cloudwatch put-metric-data \
            --namespace "LayerV/NHP" \
            --metric-name "ACInstanceBoot" \
            --value 1 \
            --dimensions "OrganizationId=$ORG_ID,InstanceId=$INSTANCE_ID" \
            --region "$REGION"

          # Signal CloudFormation
          /opt/aws/bin/cfn-signal -e $? \
            --stack ${AWS::StackName} \
            --resource ACInstance \
            --region ${AWS::Region}

          echo "LayerV NHP-AC installation complete at $(date)"
          echo "Instance ID: $INSTANCE_ID"
          echo "Organization: $ORG_ID"

      Tags:
        - Key: Name
          Value: !Sub layerv-nhp-ac-${AWS::StackName}
        - Key: layerv:organization
          Value: !Ref OrganizationId
        - Key: layerv:component
          Value: nhp-ac

    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M

  # CloudWatch Alarm for AC health
  ACHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub layerv-nhp-ac-health-${AWS::StackName}
      AlarmDescription: Alert if NHP-AC instance becomes unhealthy
      MetricName: StatusCheckFailed
      Namespace: AWS/EC2
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref ACInstance
      TreatMissingData: breaching

Outputs:
  ACInstanceId:
    Description: EC2 Instance ID of the NHP-AC
    Value: !Ref ACInstance
    Export:
      Name: !Sub ${AWS::StackName}-ACInstanceId

  ACPrivateIp:
    Description: Private IP address of the NHP-AC
    Value: !GetAtt ACInstance.PrivateIp
    Export:
      Name: !Sub ${AWS::StackName}-ACPrivateIp

  ACSecurityGroupId:
    Description: Security Group ID for the NHP-AC
    Value: !Ref ACSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-ACSecurityGroupId

  ACLogGroupName:
    Description: CloudWatch Log Group for AC logs
    Value: !Ref ACLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-ACLogGroupName

  ACSecretArn:
    Description: ARN of the secret containing AC credentials
    Value: !Ref ACSecret
    Export:
      Name: !Sub ${AWS::StackName}-ACSecretArn

  NextSteps:
    Description: Next steps after deployment
    Value: |
      1. The AC has been deployed and configured
      2. Check /var/log/user-data.log for setup details
      3. The AC's private key is stored in Secrets Manager
      4. Deploy the NHP-AC container image to complete setup
      5. Monitor health via CloudWatch alarm
