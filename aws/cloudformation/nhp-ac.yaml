AWSTemplateFormatVersion: '2010-09-09'
Description: |
  LayerV NHP Access Controller (AC) Deployment
  Deploys the NHP-AC component into your VPC to protect internal resources.
  For more information, visit https://layerv.ai

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: LayerV Configuration
        Parameters:
          - OrganizationId
          - ACApiKey
          - LayerVServerEndpoint
          - LayerVServerPublicKey
      - Label:
          default: Network Configuration
        Parameters:
          - VpcId
          - SubnetId
          - AssociatePublicIp
      - Label:
          default: Instance Configuration
        Parameters:
          - InstanceType
          - KeyPairName
      - Label:
          default: Protected Resources
        Parameters:
          - ProtectedCIDRs
          - ProtectedPorts

Parameters:
  # LayerV Configuration
  OrganizationId:
    Type: String
    Description: Your LayerV Organization ID (provided after subscription)
    AllowedPattern: ^[a-zA-Z0-9._-]+$
    ConstraintDescription: Must be a valid organization ID

  ACApiKey:
    Type: String
    Description: Your LayerV API Key (provided after subscription)
    NoEcho: true
    MinLength: 16

  LayerVServerEndpoint:
    Type: String
    Description: LayerV NHP Server endpoint
    Default: nhp.layerv.ai

  LayerVServerPublicKey:
    Type: String
    Description: LayerV NHP Server public key (base64)
    Default: ""

  # Network Configuration
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the AC will be deployed

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the AC instance (private subnet recommended)

  AssociatePublicIp:
    Type: String
    Description: Associate a public IP (required if in public subnet without NAT)
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  # Instance Configuration
  InstanceType:
    Type: String
    Description: EC2 instance type for the AC
    Default: t3.medium
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - c6i.large
      - c6i.xlarge

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair for SSH access (optional)
    Default: ""

  # Protected Resources
  ProtectedCIDRs:
    Type: String
    Description: CIDR blocks of protected resources (comma-separated)
    Default: 10.0.0.0/8
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}(,\s*(\d{1,3}\.){3}\d{1,3}/\d{1,2})*$

  ProtectedPorts:
    Type: String
    Description: Ports to protect (comma-separated, e.g., 22,443,5432)
    Default: "22,443,3306,5432,6379"

Mappings:
  RegionAMI:
    us-east-1:
      AMI: ami-0c7217cdde317cfec  # Ubuntu 22.04 LTS
    us-east-2:
      AMI: ami-05fb0b8c1424f266b
    us-west-1:
      AMI: ami-0ce2cb35386fc22e9
    us-west-2:
      AMI: ami-008fe2fc65df48dac
    eu-west-1:
      AMI: ami-0905a3c97561e0b69
    eu-central-1:
      AMI: ami-0faab6bdbac9486fb
    ap-northeast-1:
      AMI: ami-07c589821f2b353aa
    ap-southeast-1:
      AMI: ami-078c1149d8ad719a7
    ap-southeast-2:
      AMI: ami-04f5097681773b989

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]
  UsePublicIp: !Equals [!Ref AssociatePublicIp, "true"]

Resources:
  # Security Group for AC
  ACSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub layerv-nhp-ac-${AWS::StackName}
      GroupDescription: Security group for LayerV NHP Access Controller
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # NHP Protocol (UDP) - from LayerV servers
        - IpProtocol: udp
          FromPort: 62206
          ToPort: 62206
          CidrIp: 0.0.0.0/0
          Description: NHP Protocol from LayerV Server
        # SSH for management (optional, restrict in production)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/8
          Description: SSH from internal network
      SecurityGroupEgress:
        # NHP Protocol to LayerV Server
        - IpProtocol: udp
          FromPort: 62206
          ToPort: 62206
          CidrIp: 0.0.0.0/0
          Description: NHP Protocol to LayerV Server
        # HTTPS for updates and IdP (if needed)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound
        # Access to protected resources (internal)
        - IpProtocol: -1
          CidrIp: !Select [0, !Split [",", !Ref ProtectedCIDRs]]
          Description: Access to protected resources
      Tags:
        - Key: Name
          Value: !Sub layerv-nhp-ac-${AWS::StackName}
        - Key: layerv:organization
          Value: !Ref OrganizationId

  # IAM Role for AC Instance
  ACInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub layerv-nhp-ac-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ACSecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref ACSecret
      Tags:
        - Key: layerv:organization
          Value: !Ref OrganizationId

  ACInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub layerv-nhp-ac-profile-${AWS::StackName}
      Roles:
        - !Ref ACInstanceRole

  # Secrets Manager for API Key
  ACSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub layerv-nhp-ac-${AWS::StackName}
      Description: LayerV NHP AC credentials
      SecretString: !Sub |
        {
          "organization_id": "${OrganizationId}",
          "api_key": "${ACApiKey}",
          "server_endpoint": "${LayerVServerEndpoint}",
          "server_public_key": "${LayerVServerPublicKey}"
        }
      Tags:
        - Key: layerv:organization
          Value: !Ref OrganizationId

  # CloudWatch Log Group
  ACLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /layerv/nhp-ac/${AWS::StackName}
      RetentionInDays: 30
      Tags:
        - Key: layerv:organization
          Value: !Ref OrganizationId

  # EC2 Instance for AC
  ACInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - ACSecret
    Properties:
      ImageId: !FindInMap [RegionAMI, !Ref AWS::Region, AMI]
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ACInstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref AWS::NoValue]
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref ACSecurityGroup
      NetworkInterfaces:
        - DeviceIndex: 0
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref ACSecurityGroup
          AssociatePublicIpAddress: !If [UsePublicIp, true, false]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Log everything
          exec > >(tee /var/log/user-data.log) 2>&1
          echo "Starting LayerV NHP-AC installation..."

          # Update system
          apt-get update
          apt-get install -y awscli jq docker.io iptables ipset

          # Enable Docker
          systemctl enable docker
          systemctl start docker

          # Get secrets from Secrets Manager
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id ${ACSecret} \
            --region ${AWS::Region} \
            --query SecretString \
            --output text)

          ORG_ID=$(echo $SECRET | jq -r '.organization_id')
          API_KEY=$(echo $SECRET | jq -r '.api_key')
          SERVER_ENDPOINT=$(echo $SECRET | jq -r '.server_endpoint')
          SERVER_PUBKEY=$(echo $SECRET | jq -r '.server_public_key')

          # Create config directory
          mkdir -p /opt/layerv/nhp-ac/etc

          # Generate AC keypair (using openssl for ed25519)
          AC_PRIVKEY=$(openssl genpkey -algorithm ED25519 2>/dev/null | openssl pkey -outform DER 2>/dev/null | tail -c 32 | base64)
          AC_PUBKEY=$(openssl pkey -pubout -outform DER 2>/dev/null | tail -c 32 | base64)

          # Get instance metadata
          INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
          LOCAL_IP=$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)

          # Create config.toml
          cat > /opt/layerv/nhp-ac/etc/config.toml << EOF
          # LayerV NHP-AC Configuration
          # Auto-generated by CloudFormation

          ACId = "$INSTANCE_ID"
          DefaultIp = "$LOCAL_IP"
          PrivateKeyBase64 = "$AC_PRIVKEY"
          DefaultCipherScheme = 1
          IpPassMode = 0
          LogLevel = 3
          AuthServiceId = "$ORG_ID"
          ResourceIds = ["default"]
          FilterMode = 0
          EOF

          # Create server.toml
          cat > /opt/layerv/nhp-ac/etc/server.toml << EOF
          # LayerV NHP Server Connection

          [[Servers]]
          Hostname = "$SERVER_ENDPOINT"
          Ip = ""
          Port = 62206
          PubKeyBase64 = "$SERVER_PUBKEY"
          ExpireTime = 1924991999
          EOF

          # Create resource.toml
          cat > /opt/layerv/nhp-ac/etc/resource.toml << EOF
          # Protected Resources

          [[Resources]]
          AuthServiceId = "$ORG_ID"
          ResourceId = "default"
          ServerAddr = "$SERVER_ENDPOINT"
          EOF

          # Set up iptables defaults
          cat > /opt/layerv/nhp-ac/iptables_setup.sh << 'IPTABLES_EOF'
          #!/bin/bash
          # LayerV NHP-AC iptables setup

          # Create ipsets for dynamic rules
          ipset create nhp_allowed hash:ip,port timeout 3600 -exist
          ipset create nhp_blocked hash:ip timeout 86400 -exist

          # Default DROP policy for protected resources
          iptables -N NHP_FILTER 2>/dev/null || iptables -F NHP_FILTER
          iptables -A NHP_FILTER -m set --match-set nhp_allowed src,dst -j ACCEPT
          iptables -A NHP_FILTER -m set --match-set nhp_blocked src -j DROP
          iptables -A NHP_FILTER -j DROP

          # Apply to protected ports
          for port in ${ProtectedPorts}; do
            iptables -C INPUT -p tcp --dport $port -j NHP_FILTER 2>/dev/null || \
            iptables -I INPUT -p tcp --dport $port -j NHP_FILTER
          done

          echo "iptables configured for NHP filtering"
          IPTABLES_EOF
          chmod +x /opt/layerv/nhp-ac/iptables_setup.sh

          # Run iptables setup
          /opt/layerv/nhp-ac/iptables_setup.sh

          # Pull and run NHP-AC container
          # TODO: Replace with actual LayerV container registry
          # docker pull layerv/nhp-ac:latest
          # docker run -d \
          #   --name nhp-ac \
          #   --net=host \
          #   --cap-add=NET_ADMIN \
          #   -v /opt/layerv/nhp-ac/etc:/nhp-ac/etc \
          #   layerv/nhp-ac:latest

          # For now, create systemd service for binary
          cat > /etc/systemd/system/nhp-ac.service << 'SERVICE_EOF'
          [Unit]
          Description=LayerV NHP Access Controller
          After=network.target

          [Service]
          Type=simple
          ExecStart=/opt/layerv/nhp-ac/nhp-acd run
          Restart=always
          RestartSec=5
          WorkingDirectory=/opt/layerv/nhp-ac
          Environment=NHP_CONFIG_PATH=/opt/layerv/nhp-ac/etc

          [Install]
          WantedBy=multi-user.target
          SERVICE_EOF

          # Enable service (will start when binary is deployed)
          systemctl daemon-reload
          systemctl enable nhp-ac

          # Signal CloudFormation
          /opt/aws/bin/cfn-signal -e $? \
            --stack ${AWS::StackName} \
            --resource ACInstance \
            --region ${AWS::Region}

          echo "LayerV NHP-AC installation complete"
          echo "AC Public Key: $AC_PUBKEY"
          echo "Please register this AC with LayerV using the public key above"

      Tags:
        - Key: Name
          Value: !Sub layerv-nhp-ac-${AWS::StackName}
        - Key: layerv:organization
          Value: !Ref OrganizationId
        - Key: layerv:component
          Value: nhp-ac

    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M

  # CloudWatch Alarm for AC health
  ACHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub layerv-nhp-ac-health-${AWS::StackName}
      AlarmDescription: Alert if NHP-AC instance becomes unhealthy
      MetricName: StatusCheckFailed
      Namespace: AWS/EC2
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref ACInstance
      TreatMissingData: breaching

Outputs:
  ACInstanceId:
    Description: EC2 Instance ID of the NHP-AC
    Value: !Ref ACInstance
    Export:
      Name: !Sub ${AWS::StackName}-ACInstanceId

  ACPrivateIp:
    Description: Private IP address of the NHP-AC
    Value: !GetAtt ACInstance.PrivateIp
    Export:
      Name: !Sub ${AWS::StackName}-ACPrivateIp

  ACSecurityGroupId:
    Description: Security Group ID for the NHP-AC
    Value: !Ref ACSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-ACSecurityGroupId

  ACLogGroupName:
    Description: CloudWatch Log Group for AC logs
    Value: !Ref ACLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-ACLogGroupName

  NextSteps:
    Description: Next steps after deployment
    Value: |
      1. Note the AC Instance ID and Private IP from outputs above
      2. The AC will auto-register with LayerV using your Organization ID
      3. Configure protected resources in the LayerV console
      4. Deploy agents to your users
      5. Check /var/log/user-data.log on the instance for setup details
