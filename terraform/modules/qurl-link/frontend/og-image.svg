<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png. The PNG composites layerv-wordmark.svg on top;
    see README.md for the ImageMagick command. -->
  <defs>
    <radialGradient id="washA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 130) rotate(126) scale(560 420)">
      <stop offset="0" stop-color="#f5f5f0" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#f5f5f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 560) rotate(-24) scale(460 320)">
      <stop offset="0" stop-color="#07dcef" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#07dcef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07dcef" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#07dcef"/>
      <stop offset="1" stop-color="#07dcef" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#washA)"/>
  <rect width="1200" height="630" fill="url(#washB)"/>

  <g opacity="0.36" stroke="#f5f5f0" stroke-opacity="0.055" stroke-width="1">
    <path d="M0 104H1200M0 208H1200M0 312H1200M0 416H1200M0 520H1200"/>
    <path d="M104 0V630M208 0V630M312 0V630M416 0V630M520 0V630M624 0V630M728 0V630M832 0V630M936 0V630M1040 0V630M1144 0V630"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="82" y="190" fill="#07dcef" font-size="26" font-weight="700">Private access links</text>
    <text x="78" y="338" fill="#f5f5f0" font-family="Helvetica, Arial, sans-serif" font-size="134" font-weight="400">qURL™</text>
    <text x="86" y="404" fill="#f5f5f0" font-size="42" font-weight="800">Share the link.</text>
    <text x="86" y="454" fill="#f5f5f0" font-size="42" font-weight="800">Not the exposure.</text>
    <text x="86" y="510" fill="#c9c9c4" font-size="28" font-weight="500">One-time, time-limited links for sensitive pages,</text>
    <text x="86" y="548" fill="#c9c9c4" font-size="28" font-weight="500">files, portals, previews, and dashboards.</text>
  </g>

  <g transform="translate(720 170)">
    <rect x="0" y="0" width="360" height="260" rx="8" fill="#16161a" fill-opacity="0.92" stroke="#f5f5f0" stroke-opacity="0.14"/>
    <path d="M52 130H308" stroke="url(#cyanPath)" stroke-width="4" stroke-linecap="round"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">
      <rect x="32" y="66" width="118" height="78" rx="8" fill="#0a0a0a" stroke="#f5f5f0" stroke-opacity="0.16"/>
      <text x="56" y="101" fill="#f5f5f0">qurl.link</text>
      <text x="56" y="126" fill="#939390" font-size="14" font-weight="500">shared access</text>

      <rect x="122" y="152" width="118" height="78" rx="8" fill="#0a0a0a" stroke="#07dcef" stroke-opacity="0.35"/>
      <text x="148" y="187" fill="#f5f5f0">Verify</text>
      <text x="148" y="212" fill="#939390" font-size="14" font-weight="500">token gate</text>

      <rect x="210" y="66" width="118" height="78" rx="8" fill="#0a0a0a" stroke="#f5f5f0" stroke-opacity="0.16"/>
      <text x="236" y="101" fill="#f5f5f0">Resource</text>
      <text x="236" y="126" fill="#939390" font-size="14" font-weight="500">opens briefly</text>
    </g>
    <circle cx="92" cy="130" r="9" fill="#07dcef"/>
    <circle cx="181" cy="130" r="9" fill="#07dcef"/>
    <circle cx="270" cy="130" r="9" fill="#10b981"/>
  </g>
</svg>
