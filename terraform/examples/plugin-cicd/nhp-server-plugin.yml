# Example GitHub Actions workflow for NHP Server plugins (passcode, oidc)
# Copy this to .github/workflows/build-and-deploy.yml in your plugin repo
#
# Prerequisites:
# 1. Terraform must have deployed the plugins module (creates S3 bucket)
# 2. The plugin repo must be listed in the plugin_repos variable
# 3. GitHub OIDC must be configured (ecr module creates the role)
#
# S3 Structure:
# s3://layerv-nhp-{env}-plugins/
# └── nhp-server/
#     └── {plugin-name}/
#         ├── v1.0.0/main.so
#         └── latest/main.so

name: Build and Deploy Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - sandbox
          - prod

env:
  # Update these for your plugin
  PLUGIN_NAME: passcode  # or 'oidc'
  GO_VERSION: '1.22'     # Must match NHP server Go version
  AWS_REGION: us-east-2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build plugin
        run: |
          # Build as Go plugin (shared library)
          go build -buildmode=plugin -o main.so .

          # Verify the plugin was built
          file main.so
          ls -la main.so

      - name: Run tests
        run: go test -v ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ env.PLUGIN_NAME }}
          path: main.so
          retention-days: 7

  deploy-sandbox:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-${{ env.PLUGIN_NAME }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/nhp-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Upload to S3 (sandbox)
        run: |
          BUCKET="layerv-nhp-sandbox-plugins"
          VERSION="${{ steps.version.outputs.version }}"

          # Upload versioned copy
          aws s3 cp main.so "s3://$BUCKET/nhp-server/${{ env.PLUGIN_NAME }}/$VERSION/main.so"

          # Also update 'latest' pointer
          aws s3 cp main.so "s3://$BUCKET/nhp-server/${{ env.PLUGIN_NAME }}/latest/main.so"

          echo "Uploaded to s3://$BUCKET/nhp-server/${{ env.PLUGIN_NAME }}/$VERSION/main.so"

      - name: Trigger instance refresh (optional)
        if: false  # Enable if you want automatic deployment
        run: |
          # Get ASG name from Terraform output
          ASG_NAME="layerv-nhp-sandbox-server"

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 300}'

  deploy-prod:
    needs: deploy-sandbox
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-${{ env.PLUGIN_NAME }}

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/nhp-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3 (prod)
        run: |
          BUCKET="layerv-nhp-prod-plugins"
          VERSION="${GITHUB_REF#refs/tags/}"

          aws s3 cp main.so "s3://$BUCKET/nhp-server/${{ env.PLUGIN_NAME }}/$VERSION/main.so"
          aws s3 cp main.so "s3://$BUCKET/nhp-server/${{ env.PLUGIN_NAME }}/latest/main.so"

          echo "Uploaded to s3://$BUCKET/nhp-server/${{ env.PLUGIN_NAME }}/$VERSION/main.so"
