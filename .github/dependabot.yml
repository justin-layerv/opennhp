version: 2
updates:
  # Go modules - nhp
  - package-ecosystem: "gomod"
    directory: "/nhp"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # Go modules - internalauth
  # Pure-stdlib today (zero non-stdlib deps), but kept here for the
  # five-module symmetry: the moment a non-stdlib dep lands, supply-
  # chain CVEs on anything transitively pulled in surface as a PR
  # instead of landing silently. Same rationale as tests/local below.
  - package-ecosystem: "gomod"
    directory: "/internalauth"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # Go modules - endpoints
  - package-ecosystem: "gomod"
    directory: "/endpoints"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # Go modules - examples
  - package-ecosystem: "gomod"
    directory: "/examples/server_plugin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # Go modules - tests/local
  # Separate module (testcontainers-go + etcd client) with its own indirect
  # graph. Without coverage here, supply-chain CVEs on anything transitively
  # pulled in by testcontainers-go land silently — which is how docker/docker
  # CVE-2026-34040 / -33997 got here without a PR.
  - package-ecosystem: "gomod"
    directory: "/tests/local"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # Go modules - docker/web-app
  # Runtime app container (the nhp-app image), not a test helper: pulls
  # gin-gonic/gin plus golang.org/x/crypto and x/net transitively. A CVE
  # in that web stack ships straight into a deployed image, so it gets the
  # same silent-supply-chain coverage as the modules above. Outside the
  # `make init` auto-tidy set (#1290), so nothing else watches it.
  - package-ecosystem: "gomod"
    directory: "/docker/web-app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # Go modules - remaining test modules (e2e, integration, smoke)
  # Each is a separate module with its own indirect graph (AWS SDK v2
  # family, etcd client). Same rationale as tests/local: without coverage a
  # supply-chain CVE in anything they transitively pull lands silently.
  # tests/e2e has no non-stdlib deps today but is listed for symmetry so the
  # moment one lands it is already watched. Outside the `make init` auto-tidy
  # set (#1290) — the dependabot exposure is independent of that tracking.
  - package-ecosystem: "gomod"
    directories:
      - "/tests/e2e"
      - "/tests/integration"
      - "/tests/smoke"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # npm - endpoints/js-agent
  # Browser crypto agent deps are exact-pinned so the committed qurl-link bundle
  # and SRI sidecar remain byte-reproducible. Dependabot is still required to
  # surface security and version bumps instead of letting those exact pins rot.
  - package-ecosystem: "npm"
    directory: "/endpoints/js-agent"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "js-agent"
    ignore:
      # typescript-eslint hard-caps its typescript peer (>=4.8.4 <6.1.0 as of
      # 8.64.0 — every published line, alphas included). It lints through the TS
      # compiler API, so a TS major it hasn't validated is a real break, not a
      # conservative pin. A typescript major bump therefore ERESOLVEs `npm ci`
      # and reds every js-agent job (quality, test, parity) before any of them
      # run — see PR #3298 (TS 6->7). Held until typescript-eslint ships TS-major
      # support; then bump both together in one coordinated PR and drop this
      # ignore. Minor/patch TS updates still flow. Security updates are exempt
      # from ignore, so a TS CVE still surfaces a PR.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Keep multi-path actions from the same source repo bumping in one PR.
    # github/codeql-action is referenced as two steps — /init and /analyze —
    # and CodeQL hard-requires every step on the SAME version: a split bump
    # (only one of the two) fails init/analyze with "Loaded a configuration
    # file for version X, but running version Y" (a configuration error, not
    # a warning). Dependabot otherwise opens a separate PR per sub-path, each
    # of which red-lines CI on its own. Grouping guarantees they move in
    # lockstep, restoring the single "bump github/codeql-action" PR shape.
    #
    # Two groups on purpose: a group defaults to `applies-to: version-updates`,
    # so a codeql-action *security* advisory would still open ungrouped
    # per-sub-path PRs and re-introduce the same split-bump break. The
    # security-updates group (same pattern) closes that path too.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # anthropics/claude-code-action is a tamper-fenced pin: both Claude
      # workflows depend on undocumented internals of the action tree, so the
      # SHA only moves after a human re-proves those properties (see
      # "Updating the Claude workflow contract" in .github/workflows/README.md).
      # v1.0.187 added replaceCheckoutCredentials() and calls it from the
      # use_commit_signing:true branch that previously did nothing. It runs
      # `git remote set-url origin` at a github.com URL, overwriting the
      # local-origin shim both workflows install, and — since neither sets
      # allowed_non_write_users — embeds the token in .git/config inside the
      # tree Claude runs in. That breaks two invariants the workflows assert.
      # Held until the action can leave `origin` alone under API signing (or
      # the shim is redesigned to survive it); then bump and drop this ignore.
      # Security updates are exempt from ignore, so an action CVE still
      # surfaces a PR.
      - dependency-name: "anthropics/claude-code-action"
        versions: [">=1.0.187"]

  # Docker
  # Scoped to /docker, so an ubuntu base-image digest bump here CANNOT touch
  # tests/smoke/local-stack/Dockerfile, which pins the same ubuntu base.
  # scripts/check-ubuntu-base-digest-drift.sh enforces that lockstep (#2800), so
  # an ubuntu-bump PR goes red until the smoke Dockerfile's digest is hand-bumped
  # to match in the same PR — commit that follow-up rather than merging the bump
  # alone. (The golang builder tag has the same lockstep via check-go-version-drift.sh.)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "terraform"

  # Python — terraform-prod-drift lint dependencies (#1324). Tracks
  # python-hcl2 so the exact-pin in the lint requirements doesn't rot
  # silently (cr round 10). Patch + minor only — major bumps need a
  # human read of the changelog because hcl2 grammar regressions would
  # break the lint silently.
  #
  # Verification (cr round 17): after the first scheduled scan, confirm
  # Dependabot discovered the file via Insights → Dependency graph →
  # Dependabot tab. The pip ecosystem auto-discovers any `*.txt` file
  # whose contents look like pip requirements, but the custom name
  # (`terraform-prod-drift-requirements.txt`) is uncommon enough that
  # silent non-discovery would let the pin rot — the exact silent-miss
  # class this PR exists to prevent.
  - package-ecosystem: "pip"
    directory: "/.github/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python — Lambda function dependencies under terraform/modules/*/lambda.
  # The acme-cert and custom-domain-cert requirements.txt are DEPLOYED runtime
  # deps (cryptography, pyOpenSSL, requests, urllib3, certifi) that ship into
  # the prod cert-management Lambdas — exactly the security-sensitive packages
  # that get CVEs regularly. The glob also sweeps the developer-portal and
  # status-page dev/test requirements in the same modules. Patch + minor only;
  # a major cryptography/urllib3 bump needs a human read of the changelog, same
  # policy as the .github/scripts block above.
  - package-ecosystem: "pip"
    directories:
      - "/terraform/modules/*/lambda"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    # boto3 and botocore MUST move in lockstep: boto3 X.Y.Z requires
    # botocore>=X.Y.Z, and CI installs all three lambda test requirement sets
    # into one env, so a split bump (only one of the pair reaches main first)
    # fails the "Test Lambdas" install with pip ResolutionImpossible. Grouping
    # keeps the pair in a single PR. Two groups for the same reason as the
    # codeql-action block above: a group defaults to `applies-to:
    # version-updates`, so a botocore security advisory would otherwise open an
    # ungrouped PR and re-introduce the split-bump break.
    groups:
      aws-sdk:
        patterns:
          - "boto3"
          - "botocore"
      aws-sdk-security:
        applies-to: security-updates
        patterns:
          - "boto3"
          - "botocore"
    labels:
      - "dependencies"
      - "terraform"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
