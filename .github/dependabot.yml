version: 2
updates:
  # Go modules - nhp
  - package-ecosystem: "gomod"
    directory: "/nhp"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # Go modules - endpoints
  - package-ecosystem: "gomod"
    directory: "/endpoints"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # Go modules - examples
  - package-ecosystem: "gomod"
    directory: "/examples/server_plugin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # Go modules - tests/local
  # Separate module (testcontainers-go + etcd client) with its own indirect
  # graph. Without coverage here, supply-chain CVEs on anything transitively
  # pulled in by testcontainers-go land silently — which is how docker/docker
  # CVE-2026-34040 / -33997 got here without a PR.
  - package-ecosystem: "gomod"
    directory: "/tests/local"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # Docker
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "terraform"
