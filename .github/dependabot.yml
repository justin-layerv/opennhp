version: 2
updates:
  # Go modules - nhp
  - package-ecosystem: "gomod"
    directory: "/nhp"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # Go modules - internalauth
  # Pure-stdlib today (zero non-stdlib deps), but kept here for the
  # five-module symmetry: the moment a non-stdlib dep lands, supply-
  # chain CVEs on anything transitively pulled in surface as a PR
  # instead of landing silently. Same rationale as tests/local below.
  - package-ecosystem: "gomod"
    directory: "/internalauth"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # Go modules - endpoints
  - package-ecosystem: "gomod"
    directory: "/endpoints"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # Go modules - examples
  - package-ecosystem: "gomod"
    directory: "/examples/server_plugin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # Go modules - tests/local
  # Separate module (testcontainers-go + etcd client) with its own indirect
  # graph. Without coverage here, supply-chain CVEs on anything transitively
  # pulled in by testcontainers-go land silently — which is how docker/docker
  # CVE-2026-34040 / -33997 got here without a PR.
  - package-ecosystem: "gomod"
    directory: "/tests/local"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # Go modules - docker/web-app
  # Runtime app container (the nhp-app image), not a test helper: pulls
  # gin-gonic/gin plus golang.org/x/crypto and x/net transitively. A CVE
  # in that web stack ships straight into a deployed image, so it gets the
  # same silent-supply-chain coverage as the modules above. Outside the
  # `make init` auto-tidy set (#1290), so nothing else watches it.
  - package-ecosystem: "gomod"
    directory: "/docker/web-app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # Go modules - remaining test modules (e2e, integration, smoke)
  # Each is a separate module with its own indirect graph (AWS SDK v2
  # family, etcd client). Same rationale as tests/local: without coverage a
  # supply-chain CVE in anything they transitively pull lands silently.
  # tests/e2e has no non-stdlib deps today but is listed for symmetry so the
  # moment one lands it is already watched. Outside the `make init` auto-tidy
  # set (#1290) — the dependabot exposure is independent of that tracking.
  - package-ecosystem: "gomod"
    directories:
      - "/tests/e2e"
      - "/tests/integration"
      - "/tests/smoke"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "go"

  # npm - endpoints/js-agent
  # Browser crypto agent deps are exact-pinned so the committed qurl-link bundle
  # and SRI sidecar remain byte-reproducible. Dependabot is still required to
  # surface security and version bumps instead of letting those exact pins rot.
  - package-ecosystem: "npm"
    directory: "/endpoints/js-agent"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "js-agent"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  # Docker
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "terraform"

  # Python — terraform-prod-drift lint dependencies (#1324). Tracks
  # python-hcl2 so the exact-pin in the lint requirements doesn't rot
  # silently (cr round 10). Patch + minor only — major bumps need a
  # human read of the changelog because hcl2 grammar regressions would
  # break the lint silently.
  #
  # Verification (cr round 17): after the first scheduled scan, confirm
  # Dependabot discovered the file via Insights → Dependency graph →
  # Dependabot tab. The pip ecosystem auto-discovers any `*.txt` file
  # whose contents look like pip requirements, but the custom name
  # (`terraform-prod-drift-requirements.txt`) is uncommon enough that
  # silent non-discovery would let the pin rot — the exact silent-miss
  # class this PR exists to prevent.
  - package-ecosystem: "pip"
    directory: "/.github/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python — Lambda function dependencies under terraform/modules/*/lambda.
  # The acme-cert and custom-domain-cert requirements.txt are DEPLOYED runtime
  # deps (cryptography, pyOpenSSL, requests, urllib3, certifi) that ship into
  # the prod cert-management Lambdas — exactly the security-sensitive packages
  # that get CVEs regularly. The glob also sweeps the developer-portal and
  # status-page dev/test requirements in the same modules. Patch + minor only;
  # a major cryptography/urllib3 bump needs a human read of the changelog, same
  # policy as the .github/scripts block above.
  - package-ecosystem: "pip"
    directories:
      - "/terraform/modules/*/lambda"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "terraform"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
