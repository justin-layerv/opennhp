name: prod-rollout-tasks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: prod-rollout-tasks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  check-pr-body:
    name: Check PR body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exactly one Prod Rollout Tasks choice
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Draft PRs report success so required-check branch protection does
          # not block work-in-progress changes before they are ready for review.
          if [ "$PR_DRAFT" = "true" ]; then
            echo "Draft PR; the prod rollout tasks body check will run when the PR is ready for review."
            exit 0
          fi

          if ! printf '%s\n' "$PR_BODY" | grep -Eq '^##[[:space:]]+Prod Rollout Tasks[[:space:]]*$'; then
            echo "::error::Missing exact '## Prod Rollout Tasks' section in the PR body. Check spelling and capitalization. See docs/runbooks/prod-rollout-ledger/README.md."
            exit 1
          fi

          tasks_section=$(printf '%s\n' "$PR_BODY" | awk '
            /^##[[:space:]]+Prod Rollout Tasks[[:space:]]*$/ { in_section=1; next }
            /^##[[:space:]]+/ && in_section { exit }
            in_section { print }
          ')

          # Keep these checkbox labels in sync with .github/PULL_REQUEST_TEMPLATE.md
          # and docs/runbooks/prod-rollout-ledger/README.md.
          # The [[:space:]]*$ anchors intentionally absorb GitHub's CRLF body lines.
          # Labels must stay regex-safe; metacharacters silently change matching semantics.
          count_checked() {
            local label="$1"
            printf '%s\n' "$tasks_section" | grep -Ec "^[[:space:]]*[-*+][[:space:]]+\[[xX]\][[:space:]]+${label}[[:space:]]*$" || true
          }

          added_count=$(count_checked 'Added a prod rollout ledger entry')
          notasks_count=$(count_checked 'Confirmed this PR has no prod rollout tasks')
          total=$((added_count + notasks_count))

          if [ "$total" -ne 1 ]; then
            echo "::error::Choose exactly one Prod Rollout Tasks checkbox in the PR body."
            echo "Found added=$added_count no-tasks=$notasks_count."
            echo "Expected exactly one of these checked lines, with the exact label text; put context elsewhere in the PR body or the ledger entry:"
            echo "- [x] Added a prod rollout ledger entry"
            echo "- [x] Confirmed this PR has no prod rollout tasks"
            exit 1
          fi

          if [ "$added_count" -eq 1 ]; then
            # Fail closed if the PR files API is unavailable: keep this as its
            # own assignment so a non-zero `gh` exit aborts the job under set -e
            # (do not fold it into the `|| true` pipeline below, which would mask
            # an API failure). `status != "removed"` excludes pure deletions, so
            # a PR that only completes (deletes) an entry does not satisfy the
            # "Added" choice — it should select "no prod rollout tasks" instead.
            changed_files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
              --jq '.[] | select(.status != "removed") | .filename')
            # Pass when the PR adds, modifies, or renames any ledger entry file:
            # any path under the ledger dir other than its README. `|| true`
            # keeps a no-match grep from tripping `set -o pipefail`, and avoiding
            # `grep -q` keeps the pipe open so the upstream grep never takes
            # SIGPIPE regardless of the changed-file count.
            entry_files=$(printf '%s\n' "$changed_files" \
              | grep -E '^docs/runbooks/prod-rollout-ledger/.+' \
              | grep -vE '^docs/runbooks/prod-rollout-ledger/README\.md$' || true)
            if [ -z "$entry_files" ]; then
              echo "::error::The PR body says a prod rollout ledger entry was added, but no added/modified file under docs/runbooks/prod-rollout-ledger/ (other than README.md) is in the PR diff."
              exit 1
            fi
          fi
