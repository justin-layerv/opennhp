name: prod-rollout-tasks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: prod-rollout-tasks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read # checkout of the gate scripts
  pull-requests: read # gh api pulls/<n>/files for the ledger-entry check

jobs:
  check-pr-body:
    name: Check PR body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Run the gate SCRIPTS from the BASE ref, not the PR head. Every input
      # comes from the trusted event payload / gh api (PR_BODY, PR_DRAFT,
      # PR_AUTHOR, PR_NUMBER) and never from the checked-out tree, so pinning to
      # base.sha is behaviour-identical for legitimate PRs while a PR can no
      # longer rewrite the check-prod-rollout-*.sh logic that judges it.
      #
      # This NARROWS, not closes, the fork-trust gap: on a `pull_request` event
      # GitHub runs the workflow YAML from the PR's merge ref, so this file's
      # invoking step is still PR-editable. Acceptable for an advisory check
      # (read-only token, no secrets, reviewer-visible diff); fully protecting
      # the gate (the workflow file too, e.g. via CODEOWNERS or a reusable
      # workflow) is tracked for any promotion to a required check in #2907.
      # Sparse + shallow + no credentials keeps the checkout minimal.
      - name: Check out the gate scripts (base ref — trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Require exactly one Prod Rollout Tasks choice
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          body_check=.github/scripts/check-prod-rollout-tasks-body.sh
          ledger_check=.github/scripts/check-prod-rollout-ledger-entry.sh

          # The base ref lacks the gate scripts only while bootstrapping — the PR
          # that first adds them — when there is no trusted copy to enforce yet
          # (the PR-head copies are still unit-tested by the validate-workflows
          # fence). Pass so the introducing PR is not blocked by its own absence.
          # Check both scripts so the `select:added` path below can't later hit a
          # raw "No such file" if one were removed from base independently.
          # Emit a ::warning:: rather than a silent pass: once the scripts live on
          # the base branch this path never runs, so if it ever does (scripts
          # renamed/removed on base) it surfaces loudly instead of the gate
          # quietly going green — "missing" must not look like "compliant".
          if [ ! -f "$body_check" ] || [ ! -f "$ledger_check" ]; then
            echo "::warning::prod-rollout-tasks gate scripts are absent on the base ref; skipping the body check (expected only on the PR that first introduces them)."
            exit 0
          fi

          # The body-structure decision — Dependabot/draft exemptions and the
          # exactly-one-box parsing — lives in this script so it is unit-tested
          # by tests/scripts/check-prod-rollout-tasks-body_test.sh (fenced in
          # validate-workflows.yml). It prints a decision token and emits its own
          # ::error:: on failure; set -e propagates a non-zero exit.
          decision=$("$body_check")
          echo "Prod rollout tasks decision: $decision"

          # Only the "Added a ledger entry" choice needs the PR diff; every other
          # decision (exempt, draft, or the "no prod rollout tasks" box) is final.
          if [ "$decision" != "select:added" ]; then
            exit 0
          fi

          # The PR body claims a ledger entry was added; confirm the diff backs
          # that up. Fail closed if the PR files API is unavailable: keep this as
          # its own assignment so a non-zero `gh` exit aborts the job under set -e
          # (do not fold it into the helper pipeline below, which would mask an
          # API failure). `status != "removed"` excludes pure deletions, so a PR
          # that only completes (deletes) an entry does not satisfy the "Added"
          # choice — it should select "no prod rollout tasks" instead.
          changed_files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename')
          # The ledger-entry match is pure, so it lives in its own script that is
          # unit-tested by tests/scripts/check-prod-rollout-ledger-entry_test.sh.
          printf '%s\n' "$changed_files" | "$ledger_check"
