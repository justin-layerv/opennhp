# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and Test Code on Ubuntu

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'

concurrency:
  group: "ubuntu-build-${{ github.ref }}"
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'

# Restrict default permissions for security
permissions:
  contents: read

jobs:

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install shellcheck
      run: sudo apt-get install -y shellcheck

    - name: Run shellcheck on scripts
      run: |
        # Find all .sh files and run shellcheck
        find . -name "*.sh" -type f \
          ! -path "./vendor/*" \
          ! -path "./node_modules/*" \
          -print0 | xargs -0 shellcheck --severity=warning

    # ErrorCodeToError caller fence (#3643). common.ErrorCodeToError returns a
    # bare nil *Error for any code it doesn't recognize — every extension code an
    # auth service or AC can emit. Assigned into an error-typed variable that is
    # the Go typed-nil trap: `err != nil` is true, and the `err.Error()` after it
    # dereferences a nil receiver and panics. Five agent call sites did exactly
    # that before #3643 moved them to common.ErrorFromResponse. The lint is what
    # MAKES the "reachable only from inside ErrorFromResponse" invariant true
    # rather than merely documenting it in docs/UPSTREAM_SYNC.md.
    #
    # It lives in this job, not validate-workflows.yml, because it scans Go
    # source: this workflow runs on every PR (paths-ignore only skips docs), while
    # validate-workflows.yml fires off an explicit path list that no Go file
    # outside a handful of named ones would match — so a new caller in
    # endpoints/agent/ would never have triggered it there. The lint is a shell
    # script rather than a Go test on purpose (its own header explains why: Go
    # test caching keyed on the package's inputs made it silently stale). The
    # fixture suite runs first so an extractor regression surfaces against
    # synthetic inputs before the real tree does; both scripts are already covered
    # by the repo-wide shellcheck above.
    - name: Test + check ErrorCodeToError caller fence
      run: |
        bash tests/lints/errorcode-to-error-callers/run-fixtures.sh
        bash scripts/check-errorcode-to-error-callers.sh

    - name: Run shellcheck on FRPS user data scripts
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        template="terraform/modules/qurl-reverse-tunnel-server/user_data.sh.tpl"

        # Keep the heredoc delimiters unique so the extraction cannot stop on a
        # body line that happens to equal the delimiter. The sed step only
        # reverses Terraform's `$${...}` escaping; bare `${...}` templatefile
        # interpolations intentionally remain literal in the extracted files.
        expected_openers=(
          "cat > /opt/layerv/qurl-reverse-tunnel-server/cloudmap-common.sh << 'CLOUDMAP_COMMON_EOF'"
          "cat > /opt/layerv/qurl-reverse-tunnel-server/cloudmap-register.sh << 'CLOUDMAP_REGISTER_EOF'"
          "cat > /opt/layerv/qurl-reverse-tunnel-server/cloudmap-deregister.sh << 'CLOUDMAP_DEREGISTER_EOF'"
        )
        for opener in "${expected_openers[@]}"; do
          grep -Fqx "$opener" "$template" || {
            echo "ERROR: expected heredoc opener missing or reformatted: $opener"
            exit 1
          }
        done

        awk '$0 == "cat > /opt/layerv/qurl-reverse-tunnel-server/cloudmap-common.sh << '\''CLOUDMAP_COMMON_EOF'\''" {flag=1; next} $0 == "CLOUDMAP_COMMON_EOF" {flag=0} flag' "$template" \
          | sed 's/\$${/${/g' > "$tmp/cloudmap-common.sh"
        awk '$0 == "cat > /opt/layerv/qurl-reverse-tunnel-server/cloudmap-register.sh << '\''CLOUDMAP_REGISTER_EOF'\''" {flag=1; next} $0 == "CLOUDMAP_REGISTER_EOF" {flag=0} flag' "$template" \
          | sed 's/\$${/${/g' > "$tmp/cloudmap-register.sh"
        awk '$0 == "cat > /opt/layerv/qurl-reverse-tunnel-server/cloudmap-deregister.sh << '\''CLOUDMAP_DEREGISTER_EOF'\''" {flag=1; next} $0 == "CLOUDMAP_DEREGISTER_EOF" {flag=0} flag' "$template" \
          | sed 's/\$${/${/g' > "$tmp/cloudmap-deregister.sh"

        for f in cloudmap-common.sh cloudmap-register.sh cloudmap-deregister.sh; do
          [ -s "$tmp/$f" ] || { echo "ERROR: extraction produced empty $f"; exit 1; }
        done

        # SC2016 is expected for Terraform template placeholders like
        # '${namespace_id}' that are single-quoted until template rendering.
        shellcheck -e SC2016 "$tmp"/cloudmap-common.sh "$tmp"/cloudmap-register.sh "$tmp"/cloudmap-deregister.sh

        mockbin="$tmp/mockbin"
        mkdir -p "$mockbin"
        printf '%s\n' \
          "#!/usr/bin/env bash" \
          "set -euo pipefail" \
          "printf 'call\n' >> \"\$MOCK_AWS_CALLS\"" \
          "case \"\${MOCK_AWS_MODE:-}\" in" \
          '  none)' \
          '    printf '\''None\n'\''' \
          '    ;;' \
          '  success)' \
          '    printf '\''srv-123456\n'\''' \
          '    ;;' \
          '  fail)' \
          '    printf '\''mock Cloud Map failure\n'\'' >&2' \
          '    exit 255' \
          '    ;;' \
          '  *)' \
          "    printf 'unexpected MOCK_AWS_MODE=%s\n' \"\${MOCK_AWS_MODE:-}\" >&2" \
          '    exit 2' \
          '    ;;' \
          'esac' \
          > "$mockbin/aws"
        chmod +x "$mockbin/aws"

        (
          PATH="$mockbin:$PATH"
          # Keep retry-path tests instant; lookup_cloudmap_service_id calls the
          # shell function from the sourced helper, so this overrides sleep.
          # shellcheck disable=SC2317,SC2329
          sleep() { :; }
          # shellcheck source=/dev/null
          . "$tmp/cloudmap-common.sh"

          calls="$tmp/aws-calls"
          export MOCK_AWS_CALLS="$calls"

          : > "$calls"
          export MOCK_AWS_MODE=none
          output=$(lookup_cloudmap_service_id frps-a us-east-2 ns-123456)
          [ -z "$output" ] || { echo "ERROR: None sentinel was not normalized to empty output"; exit 1; }
          [ "$(wc -l < "$calls" | tr -d ' ')" = "1" ] || { echo "ERROR: expected one AWS call for no-match lookup"; exit 1; }

          : > "$calls"
          export MOCK_AWS_MODE=success
          output=$(lookup_cloudmap_service_id frps-a us-east-2 ns-123456)
          [ "$output" = "srv-123456" ] || { echo "ERROR: expected service ID output, got '$output'"; exit 1; }

          : > "$calls"
          if lookup_cloudmap_service_id "" us-east-2 ns-123456; then
            echo "ERROR: empty service name passed validation"
            exit 1
          fi
          [ ! -s "$calls" ] || { echo "ERROR: empty service name reached aws mock"; exit 1; }

          : > "$calls"
          if lookup_cloudmap_service_id "frps-a';bad" us-east-2 ns-123456; then
            echo "ERROR: invalid service name passed validation"
            exit 1
          fi
          [ ! -s "$calls" ] || { echo "ERROR: invalid service name reached aws mock"; exit 1; }

          : > "$calls"
          export MOCK_AWS_MODE=fail
          if lookup_cloudmap_service_id frps-a us-east-2 ns-123456; then
            echo "ERROR: repeated AWS failures returned success"
            exit 1
          fi
          [ "$(wc -l < "$calls" | tr -d ' ')" = "5" ] || { echo "ERROR: expected five retry attempts"; exit 1; }
        )

    - name: Check status page public surface
      run: python3 .github/scripts/check-status-page-public-surface.py

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [nhp, internalauth, endpoints, tests/e2e]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run golangci-lint (${{ matrix.module }})
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.11.4
        # The action's built-in `config verify` fetches its JSON schema from
        # golangci-lint.run on every run. All four legs verify the same shared
        # .golangci.yml, so one timeout reds the whole matrix in 7-15s against
        # normal runtimes of 31s-3m30s — a third-party host on the critical
        # path. Verification is NOT dropped: `golangci-lint run` silently
        # ignores unknown top-level and nested config keys (only a misspelled
        # linter name errors), so a typo'd key would read as an enabled setting
        # that does nothing. scripts/check-golangci-config-schema.py validates
        # the config against a vendored schema instead, offline, and fails if
        # this line is flipped back to true or the vendored copy falls behind
        # the version pin above.
        verify: false
        working-directory: ${{ matrix.module }}
        # Keep the tests/e2e tag set in lockstep with the Makefile lint target.
        args: ${{ matrix.module == 'tests/e2e' && '--build-tags=e2e' || '' }}

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: make

    - name: Run Unit Tests
      run: make test

  test-e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install test dependencies
      run: cd tests/local && go mod tidy

    - name: Run Local E2E Tests
      run: make test-local
      # testcontainers-go automatically manages the etcd container lifecycle

  fuzz-quick:
    # Runs every fuzz target under `make fuzz-quick` for ~15s each
    # (default FUZZTIME_QUICK=15s in Makefile; overridable via env). The
    # fuzzer list lives in the FUZZ_TARGETS variable in the Makefile —
    # adding a new fuzzer is one line there, and this job picks it up
    # automatically with no workflow change. Catches panics and assertion
    # regressions on the parser / gate / validator surfaces.
    runs-on: ubuntu-latest
    # 10 min cap = ~6× headroom over the nominal 6 targets × 15s budget,
    # defensive against a pathological input that wedges one iteration.
    # Revisit if the fuzzer list grows past ~15.
    timeout-minutes: 10
    env:
      # Avoid the private-key-dir creation path; see CLAUDE.md ("Test panic
      # 'private key'").
      KBS_SKIP_INIT: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: nhp/go.sum

    # Fence the wrapper before trusting it. scripts/run-fuzz.sh is the only thing
    # telling a real Go-fuzz crasher apart from the upstream coordinator's
    # deadline-race flake, and it decides that from the shape of `go test` output.
    # A regression either way is silent: false-red on every PR once the deadline
    # race stops being soft-passed, or false-green that swallows a real crasher.
    # These fixtures drive each branch of that decision tree with a fake `go` on
    # PATH, so they cost seconds and need no toolchain. Running them here rather
    # than in validate-workflows.yml keeps them next to the one job whose verdict
    # depends on the wrapper — and it was reachable only via `make lint-run-fuzz`,
    # which no CI workflow runs. After a Go toolchain bump, a red here is the
    # expected signal that the deadline-race signature needs re-validating
    # (CLAUDE.md says as much).
    - name: Test run-fuzz wrapper decision tree
      run: bash tests/lints/run-fuzz/run-fixtures.sh

    - name: Run quick fuzz pass
      run: make fuzz-quick

    # When go test -fuzz finds a crasher it writes the reproducer to
    # <pkg>/testdata/fuzz/<FuzzName>/<hash>. That file would be destroyed
    # with the runner; upload it as an artifact so whoever investigates
    # the failure has the input without re-running fuzz. Glob covers any
    # future fuzz target that lands in a package outside nhp/test/.
    # overwrite: true so a rerun-failed-jobs attempt doesn't swallow the
    # reproducer on the collision with the first attempt's artifact.
    - name: Upload fuzz failure corpus
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: fuzz-failure-corpus
        path: nhp/**/testdata/fuzz/
        if-no-files-found: ignore
        retention-days: 14
        overwrite: true
