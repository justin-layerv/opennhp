# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and Test Code on Ubuntu

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GO_VERSION: '1.25.7'

# Restrict default permissions for security
permissions:
  contents: read

jobs:

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Install shellcheck
      run: sudo apt-get install -y shellcheck

    - name: Run shellcheck on scripts
      run: |
        # Find all .sh files and run shellcheck
        find . -name "*.sh" -type f \
          ! -path "./vendor/*" \
          ! -path "./node_modules/*" \
          -print0 | xargs -0 shellcheck --severity=warning

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: make

    - name: Run Unit Tests
      run: make test

  test-e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install test dependencies
      run: cd tests/local && go mod tidy

    - name: Run Local E2E Tests
      run: make test-local
      # testcontainers-go automatically manages the etcd container lifecycle
