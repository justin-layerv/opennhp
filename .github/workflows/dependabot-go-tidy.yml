name: Dependabot Go Mod Tidy

# Runs go mod tidy across all Go modules when dependabot updates dependencies.
#
# Uses `pull_request_target` because dependabot bumps run from a fork-context
# branch and the `pull_request` event doesn't expose secrets there — and we
# need secrets to mint the GitHub App token below.
#
# The push back is performed with a GitHub App token (NOT GITHUB_TOKEN) — per
# GitHub's anti-loop policy, events created by GITHUB_TOKEN don't trigger
# further workflow runs. Using the App token (ops-routines-reader, installed
# org-wide and selected to this repo) means the resulting commit re-fires
# `pull_request` workflows on the new head SHA, so required checks report
# status against the SHA dependabot will actually merge (PR #1300).
#
# Commits are still created via the GitHub Git Data API (not `git push`) so
# GitHub signs them — satisfying the repository's "Require signed commits"
# ruleset.
#
# Security: The job-level `if: github.actor == 'dependabot[bot]'` check
# ensures the PR branch checkout only happens for dependabot PRs, not
# arbitrary forks. The app token is scoped to this repository only.
#
# Loop prevention (the math is non-obvious — three pieces interact):
#   - Dependabot pushes head SHA A → this workflow fires (actor == dependabot[bot]).
#   - This workflow's App-attributed push lands SHA B → re-fires
#     `pull_request_target` (synchronize), but `github.actor` is now
#     `ops-routines-reader[bot]`, which the job-level `if` filters out.
#   - The same App-attributed push DOES re-fire ordinary `pull_request`
#     workflows on SHA B (the goal — fixes PR #1300's auto-merge gate).
# Don't refactor any of those three (actor gate, App-token push, pull_request
# vs pull_request_target distinction) without re-deriving the loop-prevention.
#
# App-installation prereqs (ops-routines-reader on layervai/nhp):
# `contents: write` (Git Data API push) and `metadata: read` (mandatory
# baseline). If either is missing the trap-emitted error points at App
# installation / permissions — start there before suspecting auth flow.
#
# Bot-identity invariant uses the action's `app-slug` output (computed
# from the resolved App ID), NOT `gh api /user`. The /user endpoint is
# unsupported on App installation tokens (returns 403 "Resource not
# accessible by integration") — see PR #1777.

on:
  pull_request_target:
    paths:
      - "**/go.mod"
      - "**/go.sum"

concurrency:
  group: go-mod-tidy-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-mod-tidy:
    name: Sync Go Modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]'
    env:
      # Single source of truth for the bot-attribution invariant
      # asserted before pushing. If the App is renamed or swapped,
      # update here and the header comment in lockstep.
      EXPECTED_BOT_USER: ops-routines-reader[bot]

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: nhp/go.mod
          # Reference internalauth/go.mod (which exists today as a
          # pure-stdlib module) rather than internalauth/go.sum
          # (which is empty until a non-stdlib dep is added).
          # actions/setup-go can fail with "Some specified paths were
          # not resolved" when a literal cache path doesn't exist, so
          # pointing at go.mod keeps the cache key live for the
          # pure-stdlib state. CAVEAT: this catches direct-dep
          # changes (a `go get foo@v1.2.4` updates go.mod's require
          # line so the cache busts), but misses indirect/transitive-
          # only churn — a `go mod tidy` that promotes/demotes an
          # indirect dep updates only go.sum. The PR that adds the
          # first non-stdlib dep MUST flip both lines below from
          # go.mod to go.sum so indirect-dep churn busts the cache
          # too. Mirrors the same caveat in the codeql.yml block.
          cache-dependency-path: |
            nhp/go.sum
            internalauth/go.mod
            endpoints/go.sum
            examples/server_plugin/go.sum
            tests/local/go.sum

      - name: Run go mod tidy on all modules
        # Explicit `set -euo pipefail` rather than relying on GH Actions'
        # default `bash -eo pipefail` — defends against a future `shell:`
        # override silently dropping `-e` and letting a partial-failure
        # tidy (one module errors, the next succeeds) land in the commit.
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/nhp" && go mod tidy
          cd "$GITHUB_WORKSPACE/internalauth" && go mod tidy
          cd "$GITHUB_WORKSPACE/endpoints" && go mod tidy
          cd "$GITHUB_WORKSPACE/examples/server_plugin" && go mod tidy
          cd "$GITHUB_WORKSPACE/tests/local" && go mod tidy

      - name: Check for changes
        id: changes
        run: |
          # Capture the file list at detection time and pass it to the
          # commit step via $GITHUB_OUTPUT, so the commit step doesn't
          # have to re-run `git diff` and risk picking up anything an
          # intervening step might have written into the workspace.
          FILES=$(git diff --name-only)
          if [ -z "$FILES" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            echo "$FILES"
          fi

      # Mint AFTER tidy so no-op runs (most dependabot Go bumps) don't
      # consume an installation token. Auto-revoked at job end.
      #
      # Load-bearing output for the bot-identity preflight: the
      # `app-slug` output is consumed by the `APP_SLUG` env binding
      # in the next step's `env:` block, which feeds AUTH_USER. If a
      # future SHA bump drops `app-slug` (the action has emitted it
      # since v1.x, so this is unlikely — the planned `app-id` →
      # `client-id` deprecation doesn't affect outputs), the runtime
      # push will fail loud against `EXPECTED_BOT_USER`.
      - name: Mint GitHub App token (scoped to this repo)
        id: app_token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.OPS_ROUTINES_APP_ID }}
          private-key: ${{ secrets.OPS_ROUTINES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Commit via GitHub API (signed, App-attributed)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          # See header comment for why this replaces `gh api /user`.
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          FILES: ${{ steps.changes.outputs.files }}
        run: |
          # Push via the GitHub Git Data API so commits are signed by GitHub.
          # Regular git push produces unsigned commits → GH013 ruleset rejection.
          # `trap` registered before `set -e` so a failure on `set` itself still surfaces.
          trap 'echo "::error::Failed to create signed commit via GitHub API. Check App installation status, API rate limits, or permissions. Concurrent branch advance after preflight is also possible (non-fast-forward PATCH)."' ERR
          set -euo pipefail

          # GitHub App login convention: <slug>[bot].
          AUTH_USER="${APP_SLUG}[bot]"
          echo "Authenticated as: $AUTH_USER"
          if [ "$AUTH_USER" != "$EXPECTED_BOT_USER" ]; then
            echo "::error::Token resolved to '$AUTH_USER', expected '$EXPECTED_BOT_USER'. Bot identity invariant broken — refusing to push so the audit trail stays consistent."
            exit 1
          fi

          # 1. Get current branch HEAD
          REMOTE_HEAD_SHA=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/$REPO/git/commits/$REMOTE_HEAD_SHA" --jq '.tree.sha')
          echo "HEAD: $REMOTE_HEAD_SHA  Tree: $BASE_TREE"

          # If the remote branch advanced during our run (dependabot rebase,
          # maintainer fixup, etc.), our `go mod tidy` produced blobs against
          # the OLD tree but we'd now be PATCHing onto the NEW tree's parent —
          # silently overwriting whatever the new commits changed in the
          # tidied paths. The non-fast-forward defense doesn't catch this
          # because we always parent on the freshly-read HEAD. Refuse to push
          # so a human (or the next dependabot rebase) can resolve.
          LOCAL_HEAD_SHA=$(git rev-parse HEAD)
          if [ "$LOCAL_HEAD_SHA" != "$REMOTE_HEAD_SHA" ]; then
            echo "::error::Local checkout ($LOCAL_HEAD_SHA) does not match remote HEAD ($REMOTE_HEAD_SHA). Branch advanced during run — refusing to push to avoid silently overwriting upstream changes."
            exit 1
          fi

          # 2. Create blobs for each changed file and build tree entries.
          # Iterate the captured file list (not a fresh git diff) so the
          # commit matches what change-detection saw.
          TREE_ENTRIES="[]"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            BLOB_SHA=$(gh api "repos/$REPO/git/blobs" \
              -f content="$(base64 -w 0 "$file")" \
              -f encoding="base64" \
              --jq '.sha')
            TREE_ENTRIES=$(echo "$TREE_ENTRIES" | jq -c \
              --arg path "$file" --arg sha "$BLOB_SHA" \
              '. + [{"path":$path,"mode":"100644","type":"blob","sha":$sha}]')
            echo "  blob $file → $BLOB_SHA"
          done <<< "$FILES"

          # 3. Create new tree
          NEW_TREE=$(jq -n --arg base "$BASE_TREE" --argjson tree "$TREE_ENTRIES" \
            '{base_tree:$base, tree:$tree}' \
            | gh api "repos/$REPO/git/trees" --input - --jq '.sha')
          echo "Tree: $NEW_TREE"

          # 4. Create commit (GitHub signs it automatically)
          NEW_COMMIT=$(jq -n \
            --arg msg "chore(deps): sync go.mod/go.sum files [automated]" \
            --arg tree "$NEW_TREE" \
            --arg parent "$REMOTE_HEAD_SHA" \
            '{message:$msg, tree:$tree, parents:[$parent]}' \
            | gh api "repos/$REPO/git/commits" --input - --jq '.sha')
          echo "Commit: $NEW_COMMIT"

          # 5. Update branch ref
          gh api "repos/$REPO/git/refs/heads/$BRANCH" \
            --method PATCH -f sha="$NEW_COMMIT" > /dev/null
          echo "Pushed signed commit $NEW_COMMIT to $BRANCH"
