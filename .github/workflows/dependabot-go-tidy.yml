name: Dependabot Go Mod Tidy

# Runs go mod tidy across all Go modules when dependabot updates dependencies.
#
# Uses pull_request_target (not pull_request) so the GITHUB_TOKEN has write
# permissions to the repo. Commits are pushed via the GitHub Git Data API
# (not git push) so they are signed by GitHub — satisfying the repository's
# "Require signed commits" ruleset.
#
# Security: The job-level `if: github.actor == 'dependabot[bot]'` check ensures
# the PR branch checkout only happens for dependabot PRs, not arbitrary forks.

on:
  pull_request_target:
    paths:
      - "**/go.mod"
      - "**/go.sum"

concurrency:
  group: go-mod-tidy-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  go-mod-tidy:
    name: Sync Go Modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: nhp/go.mod
          cache-dependency-path: |
            nhp/go.sum
            endpoints/go.sum
            examples/server_plugin/go.sum

      - name: Run go mod tidy on all modules
        run: |
          cd $GITHUB_WORKSPACE/nhp && go mod tidy
          cd $GITHUB_WORKSPACE/endpoints && go mod tidy
          cd $GITHUB_WORKSPACE/examples/server_plugin && go mod tidy

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git diff --name-only
          fi

      - name: Commit via GitHub API (signed)
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          # Push via the GitHub Git Data API so commits are signed by GitHub.
          # Regular git push produces unsigned commits → GH013 ruleset rejection.
          set -euo pipefail
          trap 'echo "::error::Failed to create signed commit via GitHub API. Check API rate limits and permissions."' ERR

          # 1. Get current branch HEAD
          HEAD_SHA=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq '.tree.sha')
          echo "HEAD: $HEAD_SHA  Tree: $BASE_TREE"

          # 2. Create blobs for each changed file and build tree entries
          TREE_ENTRIES="[]"
          while IFS= read -r file; do
            BLOB_SHA=$(gh api "repos/$REPO/git/blobs" \
              -f content="$(base64 -w 0 "$file")" \
              -f encoding="base64" \
              --jq '.sha')
            TREE_ENTRIES=$(echo "$TREE_ENTRIES" | jq -c \
              --arg path "$file" --arg sha "$BLOB_SHA" \
              '. + [{"path":$path,"mode":"100644","type":"blob","sha":$sha}]')
            echo "  blob $file → $BLOB_SHA"
          done < <(git diff --name-only)

          # 3. Create new tree
          NEW_TREE=$(jq -n --arg base "$BASE_TREE" --argjson tree "$TREE_ENTRIES" \
            '{base_tree:$base, tree:$tree}' \
            | gh api "repos/$REPO/git/trees" --input - --jq '.sha')
          echo "Tree: $NEW_TREE"

          # 4. Create commit (GitHub signs it automatically)
          NEW_COMMIT=$(jq -n \
            --arg msg "chore(deps): sync go.mod/go.sum files [automated]" \
            --arg tree "$NEW_TREE" \
            --arg parent "$HEAD_SHA" \
            '{message:$msg, tree:$tree, parents:[$parent]}' \
            | gh api "repos/$REPO/git/commits" --input - --jq '.sha')
          echo "Commit: $NEW_COMMIT"

          # 5. Update branch ref
          gh api "repos/$REPO/git/refs/heads/$BRANCH" \
            --method PATCH -f sha="$NEW_COMMIT" > /dev/null
          echo "Pushed signed commit $NEW_COMMIT to $BRANCH"
