name: Build and Deploy NHP

on:
  push:
    branches:
      - main
    paths:
      - 'nhp/**'
      - 'endpoints/**'
      - 'docker/**'
      - 'terraform/**'
      - 'scripts/**'
      - 'tests/**'
      # PR #252 introduced the packer-build job in this workflow but never
      # added packer/** to the path filter. Result: a PR that only touches
      # packer/* (e.g. #980's shebang fix) merges to main without triggering
      # this workflow at all, and the new packer-build job is silently
      # skipped. Adding the path here so packer-only changes still run.
      - 'packer/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches:
      - main
    # No path filters - workflow must run for all PRs so required checks report status
    # Path filtering happens at job level via the 'changes' job
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - sandbox
          # prod removed — prod deploys MUST go through promote-to-prod.yml
          # via ./scripts/trigger-prod-deploy.sh (prevents accidental terraform apply in prod)
      deploy:
        description: 'Deploy after build?'
        required: true
        default: true
        type: boolean
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        default: false
        type: boolean
      force_build:
        description: 'Force image build even without app code changes'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Push events get a unique group per run so rapid-fire merges (e.g. Dependabot batches)
# never cancel each other — deploy jobs have their own concurrency groups to serialize.
# Without this, pending push runs get cancelled by newer ones, silently skipping deploys.
concurrency:
  group: ${{ github.event_name == 'push' && format('nhp-push-{0}', github.run_id) || format('nhp-{0}-{1}-{2}', github.event.inputs.environment || 'sandbox', github.ref_name, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.14.3'
  GO_VERSION: '1.25.9'

jobs:
  # ============================================================================
  # CHANGES - Granular change detection for conditional job execution
  # Enables:
  # - App-only changes: Build + SSM update + instance refresh (skip TF apply)
  # - Infra-only changes: TF apply (skip build if no app changes)
  # - Both: Full pipeline
  # - Docs-only: Skip all but report success for branch protection
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.override.outputs.app || steps.filter.outputs.code }}
      app: ${{ steps.override.outputs.app || steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
      tests: ${{ steps.filter.outputs.tests }}
      lambdas: ${{ steps.filter.outputs.lambdas }}
      packer: ${{ steps.filter.outputs.packer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0  # Full history needed for paths-filter to compare commits

      - name: Detect code changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'nhp/**'
              - 'endpoints/**'
              - 'docker/**'
              - 'terraform/**'
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/**'
            app:
              - 'nhp/**'
              - 'endpoints/**'
              - 'docker/**'
            infra:
              - 'terraform/**'
            tests:
              - 'tests/**'
              - 'nhp/**'
              - 'endpoints/**'
            lambdas:
              - 'terraform/modules/**/lambda/**'
            packer:
              - 'packer/**'

      - name: Change Detection Summary
        run: |
          {
            echo "## Change Detection Results"
            echo "| Category | Changed |"
            echo "|----------|---------|"
            echo "| Any code | ${{ steps.filter.outputs.code }} |"
            echo "| App (nhp, endpoints, docker) | ${{ steps.filter.outputs.app }} |"
            echo "| Infrastructure (terraform) | ${{ steps.filter.outputs.infra }} |"
            echo "| Tests | ${{ steps.filter.outputs.tests }} |"
            echo "| Lambdas | ${{ steps.filter.outputs.lambdas }} |"
            echo "| Packer | ${{ steps.filter.outputs.packer }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Force build override
        id: override
        if: github.event.inputs.force_build == 'true'
        run: |
          echo "app=true" >> "$GITHUB_OUTPUT"
          echo "::notice::force_build=true — overriding app change detection to force image build"

      - name: Annotate skipped jobs
        if: steps.filter.outputs.code == 'false' && github.event.inputs.force_build != 'true'
        run: |
          echo "::notice title=Jobs Skipped::No code changes detected (only docs/changelog). Test and Build jobs will be skipped but report success for branch protection."

  # ============================================================================
  # SETUP - Quick metadata job (runs first, enables parallelism)
  # ============================================================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      environment: ${{ steps.meta.outputs.environment }}
      start_time: ${{ steps.meta.outputs.start_time }}
    steps:
      - name: Set metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=sandbox" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "image_tag=${{ github.sha }}"
            echo "start_time=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

  # ============================================================================
  # PACKER - Build Docker-optimized AMI if missing or packer files changed
  # ============================================================================
  # The AMI is required for Terraform — there is no fallback to vanilla Ubuntu.
  # This job builds the AMI and publishes its ID to SSM Parameter Store.
  # Terraform reads from SSM, so once built, subsequent deploys reuse it.
  #
  # This job always runs on pushes to main and workflow_dispatch (so that
  # terraform-plan has a deterministic dependency). Internally it decides
  # whether to actually build by checking two things:
  #   1. Did packer/** files change on this commit?
  #   2. Is the SSM parameter missing (fresh env bootstrap)?
  # If either is true, we build. Otherwise the job is a no-op that succeeds
  # immediately and terraform-plan continues.
  # ============================================================================
  packer-build:
    name: Packer Build AMI (${{ matrix.environment }})
    needs: [changes, setup]
    runs-on: ubuntu-latest
    # 30 minutes (was 20) gives headroom for the rare slow run: an
    # apt mirror flap, ECR auth backoff, or a multi-region copy can each
    # add a few minutes. The happy path is ~10 minutes; the extra 10 minute
    # buffer is cheap insurance against an occasional flake forcing a
    # full re-run. Bump again only if we observe sustained run times >25m.
    timeout-minutes: 30
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    # Serialize concurrent runs against the same env to prevent two builds
    # racing to overwrite the SSM parameter (the "winning" AMI is then
    # consumed by the next instance refresh, leaving the loser as garbage).
    concurrency:
      group: packer-build-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      matrix:
        environment: [sandbox, prod]
      # Don't cancel one environment if the other fails — sandbox and prod
      # builds are independent and a sandbox failure shouldn't block prod
      # bootstrap on the first merge.
      fail-fast: false
      #
      # IAM role prerequisites (one per environment):
      #
      #   AWS_PACKER_SANDBOX_ROLE_ARN — sandbox account, dedicated to this job
      #   AWS_PACKER_PROD_ROLE_ARN    — prod account, dedicated to this job
      #
      # These roles are intentionally separate from the broader
      # AWS_ROLE_ARN / AWS_PROD_ROLE_ARN that the rest of the workflow
      # uses. They have only the amazon-ebs builder permissions plus a
      # scoped ssm:PutParameter on /{env}/nhp/server/ami-id, defined in
      # terraform/modules/ecr/packer.tf. See that file for the rationale
      # on why packer-build is granted a separate role from the
      # terraform-apply role.
      #
      # The Terraform output `github_actions_packer_role_arn` (in both
      # terraform/environments/sandbox and terraform/environments/prod)
      # exposes the ARN to put in the corresponding GitHub Actions secret.
    # AWS_REGION is inherited from the workflow-level `env:` block at the top
    # of this file (currently us-east-2). All AWS-touching steps in this job
    # — Configure AWS credentials, the Packer build itself, and the SSM
    # publish post-processor — read from that single source of truth so
    # changing the region is a one-line edit at the top of the workflow.
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ matrix.environment == 'prod' && secrets.AWS_PACKER_PROD_ROLE_ARN || secrets.AWS_PACKER_SANDBOX_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if AMI already exists
        id: check-ami
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          SSM_PARAM="/${ENVIRONMENT}/nhp/server/ami-id"

          # Distinguish "ParameterNotFound" (expected fresh-env case) from
          # other errors (creds, region, network) so a transient failure
          # doesn't silently force a rebuild on every run.
          if PARAM_VALUE=$(aws ssm get-parameter --name "$SSM_PARAM" --query 'Parameter.Value' --output text 2>/tmp/ssm-err); then
            echo "AMI exists in SSM: $PARAM_VALUE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -q "ParameterNotFound" /tmp/ssm-err; then
            echo "No AMI found in SSM (ParameterNotFound) — will build"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Unexpected SSM error checking $SSM_PARAM:"
          cat /tmp/ssm-err
          exit 1

      - name: Decide whether to build
        id: should-build
        env:
          PACKER_CHANGED: ${{ needs.changes.outputs.packer }}
          AMI_EXISTS: ${{ steps.check-ami.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "$PACKER_CHANGED" == "true" || "$AMI_EXISTS" == "false" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Will build AMI (packer_changed=$PACKER_CHANGED, ami_exists=$AMI_EXISTS)"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping build — AMI exists and packer files unchanged"
          fi

      # Verify Packer pin integrity BEFORE Setup Packer runs. This step
      # catches three classes of pin breakage at the earliest possible moment:
      #   1. Workflow setup-packer `version:` drifted to "latest"
      #   2. Pkr.hcl plugin constraint drifted to floating
      #   3. The setup-packer action SHA pin no longer resolves on GitHub
      #      (the third class is what broke the first post-#252 main run —
      #      a bad SHA was latent for 2.5 months because packer-build had
      #      never actually run before the merge to main)
      #
      # Placement matters: this step MUST run before Setup Packer. If it
      # ran after, a bad action SHA would fail Setup Packer first and the
      # verifier would never get a chance to surface the cleaner error.
      - name: Verify Packer pin integrity
        if: steps.should-build.outputs.build == 'true'
        env:
          # gh CLI needs auth to call repos/.../git/commits/{sha}. The
          # default GITHUB_TOKEN has read access to public repos which is
          # sufficient for this check.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # IMPORTANT: every grep/awk below must anchor to start-of-line
          # (^[[:space:]]*uses:) to avoid matching the literal strings in
          # this very script — earlier drafts of this verifier matched
          # their own error messages before the real `uses:` directive.

          # Check 1 — workflow setup-packer version pin is explicit (not
          # "latest"). This is a structural check, not a numeric-equality
          # check; the runner Packer version (e.g. 1.14.4) and the plugin
          # constraint (e.g. amazon ~> 1.3) live in different version
          # spaces and don't have to numerically agree, they just have to
          # both be pinned-not-floating.
          WORKFLOW_PIN=$(awk '/^[[:space:]]*uses:[[:space:]]*hashicorp\/setup-packer@/{f=1; next} f && /^[[:space:]]*version:/{print $2; exit}' .github/workflows/build-and-push.yml)
          if [ -z "$WORKFLOW_PIN" ] || [ "$WORKFLOW_PIN" = "latest" ]; then
            echo "::error::Workflow setup-packer version is missing or set to 'latest'. Pin it to a specific version (current: 1.14.4)."
            exit 1
          fi

          # Check 2 — packer/*.pkr.hcl plugin constraint is pinned to a
          # constrained range, not floating to whatever the latest plugin
          # release happens to be at build time.
          if ! grep -q 'version *= *"~> *[0-9]' packer/nhp-server-docker.pkr.hcl; then
            echo "::error::packer/nhp-server-docker.pkr.hcl required_plugins.amazon.version is missing or floating. Pin it to a constrained range (current: \"~> 1.3\")."
            exit 1
          fi

          # Check 3 — the setup-packer action SHA pin actually resolves
          # on GitHub. This is the check that would have caught the bad
          # SHA the original PR shipped. Parses the `uses:` line to
          # extract owner/repo and the SHA, then queries the GitHub API
          # to confirm the commit exists. Catches typos, copy-paste
          # errors, and force-pushed/garbage-collected SHAs.
          ACTION_LINE=$(grep -E '^[[:space:]]*uses:[[:space:]]*hashicorp/setup-packer@' .github/workflows/build-and-push.yml | head -1)
          if [ -z "$ACTION_LINE" ]; then
            echo "::error::Could not find a 'uses: hashicorp/setup-packer@<sha>' line in the workflow."
            exit 1
          fi
          ACTION_REF=$(echo "$ACTION_LINE" | sed -E 's/.*uses:[[:space:]]*([^[:space:]]+).*/\1/')
          ACTION_REPO="${ACTION_REF%@*}"
          ACTION_SHA="${ACTION_REF##*@}"
          if [[ ! "$ACTION_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::setup-packer is pinned to '$ACTION_SHA' which does not look like a 40-char commit SHA. Pin to a full SHA (not a tag or branch) for supply-chain integrity."
            exit 1
          fi
          if ! gh api "repos/${ACTION_REPO}/git/commits/${ACTION_SHA}" --silent 2>/tmp/gh-err; then
            echo "::error::Pinned action SHA '${ACTION_REPO}@${ACTION_SHA}' does not resolve on GitHub. The pin is invalid (typo, force-push, or commit not in the repo). Look up the correct SHA via:"
            echo "::error::  gh api repos/${ACTION_REPO}/git/ref/tags/v3 -q .object.sha"
            cat /tmp/gh-err >&2 || true
            exit 1
          fi

          # Check 4 — the Packer runner version (the one setup-packer
          # downloads, e.g. "1.14.4") actually exists as a release on
          # hashicorp/packer. The previous round shipped a pin to "1.14.4"
          # which doesn't exist; setup-packer accepted the version string
          # at config time and only failed at install time with
          # "No matching version found". This check catches that failure
          # mode at the verifier step instead.
          if ! gh api "repos/hashicorp/packer/releases/tags/v${WORKFLOW_PIN}" --silent 2>/tmp/gh-err-pkv; then
            echo "::error::Pinned Packer runner version 'v${WORKFLOW_PIN}' does not exist as a release on hashicorp/packer. Look up valid versions via:"
            echo "::error::  gh api repos/hashicorp/packer/releases --paginate -q '.[] | select(.draft == false and .prerelease == false) | .tag_name' | head"
            cat /tmp/gh-err-pkv >&2 || true
            exit 1
          fi

          # Check 5 — the actual download binary at releases.hashicorp.com
          # is reachable. Check 4 confirms the GitHub release exists, but
          # setup-packer downloads from releases.hashicorp.com, NOT from
          # GitHub. The two are usually atomic in HashiCorp's release
          # process but they could diverge — a GitHub release tag could
          # be created before the binary upload finishes, or the binary
          # URL pattern could change. This probe closes that gap by
          # actually HEAD-ing the download URL setup-packer will use.
          # `curl -fsI` returns non-zero on any HTTP error (curl exit 22
          # for 4xx, exit 56 for 404 specifically).
          PACKER_URL="https://releases.hashicorp.com/packer/${WORKFLOW_PIN}/packer_${WORKFLOW_PIN}_linux_amd64.zip"
          if ! curl -fsI "$PACKER_URL" >/dev/null 2>&1; then
            echo "::error::Packer release v${WORKFLOW_PIN} is not downloadable from $PACKER_URL"
            echo "::error::The release exists on GitHub (Check 4 passed) but the binary is missing from releases.hashicorp.com. This is rare but happens if a release tag is created before the binary upload completes. Wait a few minutes and retry, or pick a different version."
            exit 1
          fi

          echo "Packer pin integrity OK:"
          echo "  workflow pin = $WORKFLOW_PIN (release exists, binary downloadable)"
          echo "  plugin constraint pinned in pkr.hcl"
          echo "  setup-packer SHA $ACTION_SHA resolves on $ACTION_REPO"

      - name: Setup Packer
        if: steps.should-build.outputs.build == 'true'
        uses: hashicorp/setup-packer@1aa358be5cf73883762b302a3a03abd66e75b232 # v3.1.0
        with:
          # Pin a specific Packer version so a surprise upstream release
          # can't change AMI build behaviour mid-rollout. Bump intentionally
          # when upgrading (coordinate with packer/nhp-server-docker.pkr.hcl
          # required_plugins). The "Verify Packer pin integrity" step
          # above asserts the runner Packer version is still pinned (not
          # "latest"), the version actually exists as a hashicorp/packer
          # release, the template plugin pin is still present, AND the
          # setup-packer action SHA actually resolves on GitHub.
          #
          # When bumping: the bump procedure is documented at
          # packer/nhp-server-docker.pkr.hcl::"Pin the Amazon plugin..."
          # and includes verifying the new release exists via:
          #   gh api repos/hashicorp/packer/releases/tags/v<NEW> -q .tag_name
          version: 1.15.1

      - name: Packer Init
        if: steps.should-build.outputs.build == 'true'
        working-directory: packer
        run: packer init nhp-server-docker.pkr.hcl

      - name: Packer Validate
        if: steps.should-build.outputs.build == 'true'
        working-directory: packer
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          AWS_BUILD_REGION: ${{ env.AWS_REGION }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Run packer validate before packer build so syntax / template errors
          # surface in seconds, not after a 10-minute build attempt that ends
          # with the same syntax error. Same -var set as the build step below
          # so the validation matches the actual invocation.
          packer validate \
            -var "environment=${ENVIRONMENT}" \
            -var "aws_region=${AWS_BUILD_REGION}" \
            -var "git_sha=${GIT_SHA}" \
            nhp-server-docker.pkr.hcl

      - name: Packer Build
        if: steps.should-build.outputs.build == 'true'
        working-directory: packer
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          AWS_BUILD_REGION: ${{ env.AWS_REGION }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # -on-error=cleanup tells Packer to terminate the builder instance
          # and remove any partial artifacts on failure, instead of leaving an
          # orphan EC2 instance running until someone notices it. Without this
          # a transient build failure leaves a billing surprise.
          # git_sha is embedded in the AMI name and tags so an operator can
          # grep an AMI back to the exact packer/* template version.
          packer build \
            -on-error=cleanup \
            -var "environment=${ENVIRONMENT}" \
            -var "aws_region=${AWS_BUILD_REGION}" \
            -var "git_sha=${GIT_SHA}" \
            nhp-server-docker.pkr.hcl

      - name: Verify SSM Parameter
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          DID_BUILD: ${{ steps.should-build.outputs.build }}
        run: |
          set -euo pipefail
          SSM_PARAM="/${ENVIRONMENT}/nhp/server/ami-id"
          AMI_ID=$(aws ssm get-parameter --name "$SSM_PARAM" --query 'Parameter.Value' --output text)

          # Defence in depth: even though the packer post-processor parses
          # the manifest itself, double-check here that the SSM value is a
          # bare ami-* identifier and not a "region:ami-*" string.
          if ! echo "$AMI_ID" | grep -Eq '^ami-[0-9a-f]+$'; then
            echo "::error::SSM parameter $SSM_PARAM contains invalid AMI ID '$AMI_ID' (expected ami-XXXX)"
            exit 1
          fi

          echo "AMI ID: $AMI_ID"
          {
            echo "## Packer Build (${ENVIRONMENT})"
            echo "AMI: \`${AMI_ID}\`"
            echo "Built on this run: ${DID_BUILD}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # TEST - Runs after terraform validation/plan passes (or is skipped)
  # Terraform is fast (~2min) and catches config errors early, saving CI time
  # ============================================================================
  test:
    name: Test
    needs: [changes, terraform-validate, terraform-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run if terraform jobs succeeded or were skipped (dependabot PRs, non-deploy dispatch)
    if: |
      always() &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.terraform-plan.result == 'success' || needs.terraform-plan.result == 'skipped')
    steps:
      # Skip at step level (not job level) so the check name is always created
      # This is required for branch protection to see the check as successful
      - name: Skip notice
        if: needs.changes.outputs.code != 'true' || github.event.inputs.skip_tests == 'true'
        run: |
          echo "::notice::Skipping tests - no code changes detected or skip requested"
          echo "This job reports success to satisfy branch protection requirements."

      - name: Checkout code
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Sets up Go on the runner solely to manage the module/build cache
      # across runs. Tests themselves still execute in the pinned
      # golang:${GO_VERSION}-bookworm container below; we bind-mount the
      # runner's GOMODCACHE and GOCACHE into the container so cache state
      # persists across runs without rebuilding the module graph or
      # recompiling every package from scratch.
      #
      # Cache-dependency-path matches the Integration Tests step's
      # setup-go invocation later in this workflow (both go.sum files),
      # so the cache key and scope are consistent across jobs.
      - name: Setup Go (module + build cache for docker tests)
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            nhp/go.sum
            endpoints/go.sum

      - name: Run tests (privileged container for iptables)
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        run: |
          # Run tests in privileged container to allow iptables access
          # This is required for NHP tests that manipulate firewall rules.
          #
          # GOMODCACHE and GOCACHE are bind-mounted from the runner so
          # subsequent runs (and the Go vet step below) skip module
          # downloads and recompilation of unchanged packages.
          mkdir -p "$HOME/go/pkg/mod" "$HOME/.cache/go-build"
          docker run --rm \
            --privileged \
            --cap-add=NET_ADMIN \
            --cap-add=NET_RAW \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/go/pkg/mod:/root/go/pkg/mod" \
            -v "$HOME/.cache/go-build:/root/.cache/go-build" \
            -w /workspace \
            -e KBS_SKIP_INIT=1 \
            golang:${{ env.GO_VERSION }}-bookworm \
            bash -c "
              set -e
              echo '::group::Installing iptables and ipset'
              apt-get update && apt-get install -y iptables ipset >/dev/null 2>&1
              echo '::endgroup::'

              echo '::group::NHP Core Tests'
              cd nhp && go test ./... -v -timeout 5m -race
              echo '::endgroup::'

              echo '::group::Endpoints Tests'
              cd ../endpoints && go test ./... -v -timeout 5m -race
              echo '::endgroup::'
            "

      - name: Go vet
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        run: |
          # Shares the runner's GOMODCACHE/GOCACHE with the Run tests
          # step, so vet reuses test-compiled packages instead of doing
          # a cold rebuild.
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/go/pkg/mod:/root/go/pkg/mod" \
            -v "$HOME/.cache/go-build:/root/.cache/go-build" \
            -w /workspace \
            golang:${{ env.GO_VERSION }}-bookworm \
            bash -c "cd nhp && go vet ./... && cd ../endpoints && go vet ./..."

  # ============================================================================
  # TEST LAMBDAS - Python unit tests for Lambda functions (billing, etc.)
  # Runs in parallel with Go tests when Lambda code changes
  # ============================================================================
  test-lambdas:
    name: Test Lambdas
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip notice
        if: needs.changes.outputs.lambdas != 'true'
        run: |
          echo "::notice::Skipping Lambda tests - no Lambda code changes detected"

      - name: Checkout code
        if: needs.changes.outputs.lambdas == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        if: needs.changes.outputs.lambdas == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        if: needs.changes.outputs.lambdas == 'true'
        # custom-domain-cert tests need botocore (for ClientError) which
        # isn't a dev tool — install it from the lambda's pinned test
        # requirements file so the CI environment matches what developers
        # use locally and so an upstream botocore release can't break the
        # test job during a merge window.
        run: |
          pip install pytest boto3
          pip install -r terraform/modules/custom-domain-cert/lambda/requirements-test.txt

      - name: Run Lambda unit tests
        if: needs.changes.outputs.lambdas == 'true'
        run: |
          echo '::group::Billing Lambda Tests'
          python -m pytest terraform/modules/billing/lambda/test_*.py -v
          echo '::endgroup::'
          echo '::group::Developer Portal Lambda Tests'
          python -m pytest terraform/modules/developer-portal/lambda/test_*.py -v
          echo '::endgroup::'
          echo '::group::Custom Domain Cert Lambda Tests'
          (cd terraform/modules/custom-domain-cert/lambda && python -m pytest test_cert_manager.py -v)
          echo '::endgroup::'
          echo '::group::Auth0 Rotation Lambda Tests (Node)'
          node --test terraform/modules/auth0/lambda/rotate_secret.test.js
          echo '::endgroup::'

  # ============================================================================
  # BUILD - Parallel matrix builds after terraform validation/plan passes (or is skipped)
  # Terraform is fast (~2min) and catches config errors early, saving CI time
  # ============================================================================
  build:
    name: Build ${{ matrix.image }}
    needs: [changes, setup, terraform-validate, terraform-plan]
    runs-on: ubuntu-latest
    # Run if terraform jobs succeeded or were skipped (dependabot PRs, non-deploy dispatch)
    # Note: We still skip at step level to ensure matrix expands and check names are created
    if: |
      always() &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.terraform-plan.result == 'success' || needs.terraform-plan.result == 'skipped')
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: docker/Dockerfile.server
            repo: layerv/nhp-server
          - image: ac
            dockerfile: docker/Dockerfile.ac.aws
            repo: layerv/nhp-ac
    steps:
      # Skip at step level (not job level) so matrix expands and check names are created
      # Build only when app code changes (nhp/**, endpoints/**, docker/**)
      - name: Skip notice
        if: needs.changes.outputs.app != 'true'
        run: |
          echo "::notice::Skipping build - no app code changes detected (only infra or docs changed)"
          echo "This job reports success to satisfy branch protection requirements."

      - name: Checkout code
        if: needs.changes.outputs.app == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # ECR is hosted in the sandbox account (primary_account). Prod pulls cross-account
      # via ECR repository policy (see terraform/modules/ecr/main.tf). Images are always
      # pushed to sandbox ECR, so we always use the sandbox role here.
      - name: Configure AWS credentials
        if: needs.changes.outputs.app == 'true' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.changes.outputs.app == 'true' && github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78 # v2.1.2

      - name: Set up Docker Buildx
        if: needs.changes.outputs.app == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image
        if: needs.changes.outputs.app == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, matrix.repo, needs.setup.outputs.image_tag) || format('local/{0}:{1}', matrix.repo, needs.setup.outputs.image_tag) }}
            ${{ steps.login-ecr.outputs.registry && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, matrix.repo, needs.setup.outputs.environment) || format('local/{0}:{1}', matrix.repo, needs.setup.outputs.environment) }}
            ${{ steps.login-ecr.outputs.registry && format('{0}/{1}:latest', steps.login-ecr.outputs.registry, matrix.repo) || format('local/{0}:latest', matrix.repo) }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
          secrets: |
            github_token=${{ secrets.PLUGIN_REPO_TOKEN }}
          # Cache strategy:
          # 1. Primary: scope includes dependency hash - ensures fresh build when deps change
          # 2. Fallback: scope without hash - faster builds for code-only changes
          # Only write to the dependency-specific cache to prevent stale layer pollution
          cache-from: |
            type=gha,scope=${{ matrix.image }}-deps-${{ hashFiles('nhp/go.mod', 'nhp/go.sum', 'endpoints/go.mod', 'endpoints/go.sum', 'examples/server_plugin/go.mod', 'examples/server_plugin/go.sum') }}
            type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-deps-${{ hashFiles('nhp/go.mod', 'nhp/go.sum', 'endpoints/go.mod', 'endpoints/go.sum', 'examples/server_plugin/go.mod', 'examples/server_plugin/go.sum') }}

      - name: Set image name for scanning
        if: needs.changes.outputs.app == 'true'
        id: image
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG="${{ needs.setup.outputs.image_tag }}"
          if [[ -n "$ECR_REGISTRY" ]]; then
            echo "name=$ECR_REGISTRY/${{ matrix.repo }}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=local/${{ matrix.repo }}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan image
        id: trivy
        if: needs.changes.outputs.app == 'true'
        # renovate: datasource=github-releases depName=aquasecurity/trivy-action
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.image.outputs.name }}
          format: 'sarif'
          output: '${{ matrix.image }}-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: '.trivyignore'
          # Required: SARIF includes all severities by default, causing exit-code
          # to trigger on LOW findings. This limits SARIF to match severity filter.
          limit-severities-for-sarif: 'true'

      - name: Show scan failures
        if: failure() && steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Trivy found HIGH/CRITICAL vulnerabilities not in .trivyignore"
          echo ""
          SARIF="${{ matrix.image }}-trivy-results.sarif"
          if [[ ! -f "$SARIF" ]]; then
            echo "SARIF file not found"
            exit 0
          fi

          # Count vulnerabilities by severity
          HIGH_COUNT=$(jq -r '[.runs[0].tool.driver.rules[]? | select(.properties.tags[-1]? == "HIGH")] | length' "$SARIF" 2>/dev/null || echo 0)
          CRIT_COUNT=$(jq -r '[.runs[0].tool.driver.rules[]? | select(.properties.tags[-1]? == "CRITICAL")] | length' "$SARIF" 2>/dev/null || echo 0)
          echo "=== Summary: ${CRIT_COUNT} CRITICAL, ${HIGH_COUNT} HIGH ==="
          echo ""

          echo "=== Vulnerabilities Found ==="
          # Extract CVE details: id, severity, package (from help.text), description, and link
          jq -r '.runs[0].tool.driver.rules[]? |
            "• \(.id // "unknown") [\(.properties.tags[-1]? // "?")] (\((.help.text? | capture("Package: (?<pkg>[^\\n]+)").pkg) // "unknown"))
              \(.shortDescription.text? // "No description")
              \(.helpUri? // "")"' "$SARIF" 2>/dev/null || echo "Could not parse SARIF"
          echo ""
          echo "=== To Fix ==="
          echo "Add unpatched CVEs to .trivyignore with a comment:"
          echo "  # package - severity, waiting for patch"
          echo "  # https://avd.aquasec.com/nvd/CVE-XXXX-XXXXX"
          echo "  CVE-XXXX-XXXXX"

      - name: Upload scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.changes.outputs.app == 'true'
        with:
          name: trivy-results-${{ matrix.image }}
          path: '${{ matrix.image }}-trivy-results.sarif'
          retention-days: 7

      - name: Push to ECR
        if: needs.changes.outputs.app == 'true' && github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENV_TAG: ${{ needs.setup.outputs.environment }}
        run: |
          docker push "$ECR_REGISTRY/${{ matrix.repo }}:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/${{ matrix.repo }}:$ENV_TAG"
          docker push "$ECR_REGISTRY/${{ matrix.repo }}:latest"
          echo "::notice::Image pushed: $ECR_REGISTRY/${{ matrix.repo }}:$IMAGE_TAG"

      # Update SSM parameter with the new image tag
      # This enables instance refresh to use the new image without terraform apply
      - name: Update SSM Image Tag
        if: needs.changes.outputs.app == 'true' && github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          # Map matrix.image to SSM parameter path component
          if [[ "${{ matrix.image }}" == "server" ]]; then
            SSM_COMPONENT="server"
          elif [[ "${{ matrix.image }}" == "ac" ]]; then
            SSM_COMPONENT="ac"
          else
            echo "::warning::Unknown image type ${{ matrix.image }}, skipping SSM update"
            exit 0
          fi

          SSM_PARAM="/${ENVIRONMENT}/nhp/${SSM_COMPONENT}/image-tag"
          echo "Updating SSM parameter: $SSM_PARAM with tag: $IMAGE_TAG"

          aws ssm put-parameter \
            --name "$SSM_PARAM" \
            --value "$IMAGE_TAG" \
            --type String \
            --overwrite || {
              echo "::warning::Failed to update SSM parameter $SSM_PARAM - this is expected on first run (parameter created by Terraform)"
            }
          echo "::notice::SSM parameter updated: $SSM_PARAM = $IMAGE_TAG"

  # ============================================================================
  # TERRAFORM VALIDATE (PR only - fast feedback)
  # ============================================================================
  terraform-validate:
    name: Terraform Validate (PR)
    # Skip for Dependabot PRs and when no terraform files changed
    # External PRs (from forks or automated tools) can't assume AWS OIDC role
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check for Terraform changes
        id: changes
        run: |
          # Get the base branch
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Check if any terraform files changed
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^terraform/'; then
            echo "terraform_changed=true" >> "$GITHUB_OUTPUT"
            echo "Terraform files changed - running validation"
          else
            echo "terraform_changed=false" >> "$GITHUB_OUTPUT"
            echo "No terraform files changed - skipping validation"
          fi

      - name: Setup Terraform
        if: steps.changes.outputs.terraform_changed == 'true'
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        if: steps.changes.outputs.terraform_changed == 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure AWS credentials
        if: steps.changes.outputs.terraform_changed == 'true'
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          # Hardcoded for dependabot PRs (secrets not available)
          role-to-assume: arn:aws:iam::767397897469:role/nhp-sandbox-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Check for stale import blocks
        if: steps.changes.outputs.terraform_changed == 'true'
        run: |
          # Import blocks are declarative and re-evaluate on every plan/apply.
          # They should be removed after the initial import succeeds, otherwise
          # they cause state drift and unexpected resource modifications.
          IMPORT_FILES=$(grep -rl '^import {' terraform/environments/ 2>/dev/null || true)
          if [[ -n "$IMPORT_FILES" ]]; then
            echo "::warning::Stale Terraform import blocks detected. Import blocks re-run on every apply and should be removed after successful import."
            echo ""
            echo "Files with import blocks:"
            echo "$IMPORT_FILES"
            echo ""
            echo "If these imports have already been applied, delete the import blocks to prevent state drift."
          fi

      - name: Terraform Format Check
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/environments/sandbox
        run: terraform fmt -check -recursive ../../

      - name: Build Lambda Packages
        if: steps.changes.outputs.terraform_changed == 'true'
        uses: ./.github/actions/build-lambda-packages

      - name: Terraform Init
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/environments/sandbox
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          terraform init

      - name: Terraform Validate
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/environments/sandbox
        run: terraform validate

      - name: Check qurl SLO lockstep (variables.tf vs dashboard JSON)
        if: steps.changes.outputs.terraform_changed == 'true'
        # Asserts that the qurl_alerts_slo_target_percent default in
        # terraform/variables.tf matches the slo_target template variable
        # in terraform/modules/grafana-dashboards/dashboards/qurl-operations.json.
        # The two values feed the same burn-rate computation; a typo in
        # either silently shifts the burn-rate denominator by orders of
        # magnitude. The contract used to be enforced by a comment in
        # alerts.tf — same failure mode as the 2026-03-24 GSI incident.
        run: ./.github/scripts/check-qurl-slo-lockstep.sh

      - name: Fetch Auth0 Token
        id: auth0
        if: steps.changes.outputs.terraform_changed == 'true'
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: ./.github/scripts/fetch-auth0-token.sh terraform/environments/sandbox/terraform.tfvars sandbox

      - name: Terraform Plan
        id: plan
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/environments/sandbox
        env:
          # AC license credentials (from GitHub Secrets)
          TF_VAR_ac_license_key: ${{ secrets.AC_LICENSE_KEY }}
          # Grafana Cloud API token for dashboard provisioning
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
          # Auth0 Terraform provider credentials
          TF_VAR_auth0_tf_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
          TF_VAR_auth0_tf_client_secret: ${{ secrets.AUTH0_CLIENT_SECRET }}
          TF_VAR_auth0_api_token: ${{ steps.auth0.outputs.auth0_token }}
          # PR validation uses a dummy server AMI ID so terraform plan does
          # not depend on the real SSM parameter (which is populated by the
          # packer-build job on main, not in PRs). This lets PRs validate
          # terraform config without requiring packer-built AMIs.
          #
          # This is the ONLY place this dummy value lives. It must NEVER reach
          # apply against a real environment. The structural safeguards that
          # ensure this — and the deliberate absence of a variable validation
          # block (which would self-defeat at plan time) — are documented at
          # terraform/modules/compute/variables.tf::server_ami_id. Read that
          # comment before adding any other path that passes
          # TF_VAR_server_ami_id.
          TF_VAR_server_ami_id: "ami-0000000000000abcd"
        run: |
          set -o pipefail
          # -lock=false: PR plans are informational (posted as PR comment, never
          # applied). Skipping the lock eliminates S3 state-lock contention when
          # multiple PRs plan concurrently. The real plan happens at apply time
          # (deploy-sandbox-infra job) which keeps the lock. See issue #972.
          terraform plan -no-color -lock=false 2>&1 | tee plan.txt
          {
            echo "## Terraform Plan"
            echo '```'
            tail -50 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with Plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: always() && steps.changes.outputs.terraform_changed == 'true'
        with:
          script: |
            const fs = require('fs');
            const planPath = 'terraform/environments/sandbox/plan.txt';
            if (!fs.existsSync(planPath)) {
              console.log('plan.txt not found - terraform plan may have failed before producing output');
              return;
            }
            const plan = fs.readFileSync(planPath, 'utf8');
            const lines = plan.split('\n');
            const summary = lines.slice(-30).join('\n');

            const planFailed = '${{ steps.plan.outcome }}' === 'failure';
            const header = planFailed
              ? '## ❌ Terraform Plan Failed (sandbox)'
              : '## Terraform Plan (sandbox)';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${header}\n\`\`\`\n${summary}\n\`\`\``
            });

      - name: Skip Notice
        if: steps.changes.outputs.terraform_changed != 'true'
        run: |
          echo "## Terraform Validation Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "No terraform files changed in this PR." >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # TERRAFORM VALIDATE (main) - Lightweight validation before deploy
  # No terraform plan here — deploy-sandbox-infra runs plan+apply in one job,
  # saving 1 M2M token per merge (the old plan artifact was never consumed).
  # ============================================================================
  terraform-plan:
    name: Terraform Pre-Deploy Checks (${{ matrix.environment }})
    needs: [setup, terraform-validate, packer-build]  # Validate and Packer must pass (or be skipped) before plan
    if: |
      always() &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.packer-build.result == 'success' || needs.packer-build.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.environment)) || fromJSON('["sandbox"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda Packages
        uses: ./.github/actions/build-lambda-packages

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          terraform init

      - name: Check for stale import blocks
        run: |
          IMPORT_FILES=$(grep -rl '^import {' terraform/environments/ 2>/dev/null || true)
          if [[ -n "$IMPORT_FILES" ]]; then
            echo "::warning::Stale Terraform import blocks detected. Import blocks re-run on every apply and should be removed after successful import."
            echo ""
            echo "Files with import blocks:"
            echo "$IMPORT_FILES"
          fi

      - name: Terraform Format Check
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive ../../

      - name: Terraform Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  # ============================================================================
  # DEPLOY SANDBOX - Split into parallel jobs for faster deploys
  # ============================================================================
  # Job dependency graph:
  #   deploy-sandbox-infra → deploy-sandbox-blue-green → deploy-sandbox-validate
  # ============================================================================

  deploy-sandbox-infra:
    name: Deploy Sandbox - Infrastructure
    needs: [changes, setup, test, test-lambdas, build, terraform-plan]
    if: |
      always() &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.test-lambdas.result == 'success' || needs.test-lambdas.result == 'skipped') &&
      needs.build.result == 'success' &&
      needs.terraform-plan.result == 'success' &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' && github.event.inputs.environment == 'sandbox')
      )
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 30
    concurrency:
      group: deploy-sandbox-infra
      cancel-in-progress: false  # Let current TF apply finish, queue the next
    outputs:
      server_asg: ${{ steps.outputs.outputs.server_asg }}
      ac_asg: ${{ steps.outputs.outputs.ac_asg }}
      nlb_dns: ${{ steps.outputs.outputs.nlb_dns }}
      etcd_endpoint: ${{ steps.outputs.outputs.etcd_endpoint }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda Packages
        uses: ./.github/actions/build-lambda-packages

      - name: Terraform Init
        working-directory: terraform/environments/sandbox
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          terraform init

      - name: Fetch Auth0 Token
        id: auth0
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: ./.github/scripts/fetch-auth0-token.sh terraform/environments/sandbox/terraform.tfvars sandbox

      - name: Handle ASG Attachment Migrations
        working-directory: terraform/environments/sandbox
        env:
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          TF_VAR_ac_license_key: ${{ secrets.AC_LICENSE_KEY }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
          # Auth0 Terraform provider credentials
          TF_VAR_auth0_tf_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
          TF_VAR_auth0_tf_client_secret: ${{ secrets.AUTH0_CLIENT_SECRET }}
          TF_VAR_auth0_api_token: ${{ steps.auth0.outputs.auth0_token }}
          TF_VAR_image_tag: ${{ needs.setup.outputs.image_tag }}
        run: |
          set -euo pipefail

          # Clean up any stale plan files from previous failed runs
          rm -f tfplan plan.txt

          # When migrating from aws_autoscaling_attachment to inline target_group_arns,
          # Terraform's refresh timing can cause a race condition:
          # 1. Refresh sees ASG has TG (from attachment) - matches new inline config
          # 2. No diff detected for ASG
          # 3. Attachment destroyed - removes TG from ASG
          # 4. ASG now missing TG but Terraform thinks it has it
          #
          # Fix: Remove attachments from state before apply so Terraform sees the
          # actual diff and updates the ASG's target_group_arns.
          #
          # Why plan twice? The first plan detects attachments to remove. After state
          # removal, we re-plan to capture the ASG update that Terraform now sees.

          terraform plan -out=tfplan -no-color 2>&1 | tee plan.txt

          # Find any aws_autoscaling_attachment resources being destroyed
          # Pattern matches both indexed (foo[0]) and non-indexed (foo) resources
          ATTACHMENTS=$(grep -E "aws_autoscaling_attachment\.[^ ]+ will be destroyed" plan.txt | \
            sed 's/.*# //' | sed 's/ will be destroyed//' || true)

          # Warn if we found attachment references but failed to parse them (format may have changed)
          if grep -q "aws_autoscaling_attachment" plan.txt && [[ -z "$ATTACHMENTS" ]]; then
            echo "::warning::Found aws_autoscaling_attachment in plan but no destructions detected (this is normal if not migrating)"
          fi

          if [[ -n "$ATTACHMENTS" ]]; then
            echo "::warning::Detected ASG attachment migration - removing from state to prevent race condition"
            for att in $ATTACHMENTS; do
              echo "Removing from state: $att"
              terraform state rm "$att" || true
            done
            # Re-plan after state removal to capture ASG updates
            rm -f tfplan
            if ! terraform plan -out=tfplan -no-color; then
              echo "::error::Re-plan failed after state removal. Manual intervention may be required."
              exit 1
            fi
          fi

      - name: Terraform Apply
        working-directory: terraform/environments/sandbox
        env:
          # Sensitive variables passed via TF_VAR_ environment variables
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          # AC license key (plaintext - stored in Secrets Manager)
          TF_VAR_ac_license_key: ${{ secrets.AC_LICENSE_KEY }}
          # Grafana Cloud API token for dashboard provisioning
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
          # Auth0 Terraform provider credentials
          TF_VAR_auth0_tf_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
          TF_VAR_auth0_tf_client_secret: ${{ secrets.AUTH0_CLIENT_SECRET }}
          TF_VAR_auth0_api_token: ${{ steps.auth0.outputs.auth0_token }}
          # Deployment configuration - use commit SHA for immutable deployments
          TF_VAR_image_tag: ${{ needs.setup.outputs.image_tag }}
        # Apply the plan generated in previous step (or fresh if no migrations)
        run: |
          if [[ -f tfplan ]]; then
            echo "::notice::Applying saved plan from migration step ($(stat -f%z tfplan 2>/dev/null || stat -c%s tfplan) bytes)"
            terraform apply -auto-approve tfplan
          else
            echo "::notice::No saved plan found, running fresh apply"
            terraform apply -auto-approve
          fi

      - name: Get Terraform Outputs
        id: outputs
        working-directory: terraform/environments/sandbox
        run: |
          {
            echo "server_asg=$(terraform output -raw asg_name 2>/dev/null || echo '')"
            echo "ac_asg=$(terraform output -raw ac_asg_name 2>/dev/null || echo '')"
            echo "nlb_dns=$(terraform output -raw nlb_dns_name 2>/dev/null || echo '')"
            echo "etcd_endpoint=$(terraform output -raw etcd_endpoint 2>/dev/null || echo '')"
          } >> "$GITHUB_OUTPUT"

  # Dispatch blue/green deployment instead of doing direct instance refresh.
  # This ensures every CI deploy alternates between blue and green ASGs,
  # includes the knock-readiness gate, and uses instant NLB listener
  # switching instead of rolling replacement. The actual dispatch + poll
  # logic lives in .github/scripts/dispatch-and-poll-blue-green.sh so it
  # is shared with ensure-sandbox-deployed.sh (scheduled-release path).
  deploy-sandbox-blue-green:
    name: Deploy Sandbox - Blue/Green
    needs: [changes, setup, deploy-sandbox-infra]
    if: always() && needs.deploy-sandbox-infra.result == 'success' && needs.deploy-sandbox-infra.outputs.server_asg != ''
    runs-on: ubuntu-latest
    environment: sandbox
    # Job timeout = poll timeout (40m) + 5min buffer so the dispatch script
    # has room to print its final error before GitHub kills the job.
    timeout-minutes: 45
    # Job-level permissions REPLACE the workflow-level block in GitHub
    # Actions, so every scope this job needs has to be re-listed here even
    # if the workflow-level grants it.
    #
    # actions: write   — dispatch-and-poll-blue-green.sh calls the workflow
    #                    dispatch REST API. Workflow-level intentionally
    #                    withholds this for least-privilege; only this job
    #                    needs it.
    # id-token: write  — required to assume the AWS OIDC role so the
    #                    "Resolve Image Tag" step (and any future SSM /
    #                    AWS API call here) can authenticate.
    # contents: read   — checkout.
    permissions:
      id-token: write
      contents: read
      actions: write
    concurrency:
      group: deploy-sandbox-blue-green
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Resolve the image tag to deploy.
      #
      #   - App-changing commits: every CI run on main rebuilds and pushes
      #     layerv/nhp-server:${github.sha} + layerv/nhp-ac:${github.sha}
      #     via the `build` matrix, so github.sha is guaranteed to exist
      #     in ECR and is the right thing to deploy.
      #
      #   - Infra-only commits: `Build server` / `Build ac` step-level-skip
      #     (needs.changes.outputs.app == 'false'), so github.sha is NEVER
      #     pushed to ECR. Dispatching blue/green with that tag explodes in
      #     the downstream "Validate Image Exists in ECR" step. The right
      #     behaviour is to dispatch with the *currently-deployed* tag so
      #     instance refresh still runs — which is the mechanism by which
      #     terraform changes to user_data / systemd env file / launch
      #     template propagate from HCL into running instances. Silently
      #     skipping the blue/green step (as PR #994 did) breaks that
      #     propagation, re-introducing the drift problem PR #820 was
      #     built to avoid.
      #
      # Server and AC have independent active colours in SSM, so we read
      # each one's current active tag separately. If they disagree, bail
      # loudly — blue-green-deploy.yml only accepts a single image_tag
      # input today, and the correct recovery is a manual dispatch with
      # explicit per-component tags.
      - name: Resolve Image Tag
        id: resolve-tag
        env:
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          GITHUB_SHA_INPUT: ${{ needs.setup.outputs.image_tag }}
        run: |
          set -euo pipefail

          resolve_active_tag() {
            local component="$1"
            local base="/sandbox/nhp/${component}"
            local color
            if ! color=$(aws ssm get-parameter \
                --name "${base}/active-color" \
                --query "Parameter.Value" --output text 2>&1); then
              echo "::error::Failed to read ${base}/active-color from SSM: $color" >&2
              return 1
            fi

            # Reject any value other than the two known good colours so a
            # corrupted / partially-written / typo'd active-color cannot
            # silently fall through to the green branch and resolve to the
            # wrong tag. Same shape of defense as the cross-component
            # divergence check below: surface bad state loudly.
            if [[ "$color" != "blue" && "$color" != "green" ]]; then
              echo "::error::Unexpected ${base}/active-color value: '$color' (expected 'blue' or 'green')" >&2
              return 1
            fi

            # Legacy naming: blue tag lives at ${base}/image-tag, green tag
            # at ${base}/green-image-tag. Mirrors the scheme in
            # blue-green-switch.sh and the server-state step of
            # blue-green-deploy.yml.
            local param
            if [[ "$color" == "blue" ]]; then
              param="${base}/image-tag"
            else
              param="${base}/green-image-tag"
            fi

            local tag
            if ! tag=$(aws ssm get-parameter \
                --name "$param" \
                --query "Parameter.Value" --output text 2>&1); then
              echo "::error::Failed to read $param from SSM: $tag" >&2
              return 1
            fi
            printf '%s' "$tag"
          }

          if [[ "$APP_CHANGED" == "true" ]]; then
            IMAGE_TAG="$GITHUB_SHA_INPUT"
            echo "App code changed on this commit — dispatching with freshly-built tag: $IMAGE_TAG"
            echo "source=github-sha" >> "$GITHUB_OUTPUT"
          else
            echo "No app code changes on this commit — resolving current active image tags from SSM so the blue/green refresh picks up any launch-template / user_data / boot-config changes from terraform apply."
            SERVER_TAG=$(resolve_active_tag server)
            AC_TAG=$(resolve_active_tag ac)
            echo "  server active tag: $SERVER_TAG"
            echo "  ac     active tag: $AC_TAG"
            if [[ "$SERVER_TAG" != "$AC_TAG" ]]; then
              echo "::error::Server and AC active image tags differ (server=$SERVER_TAG, ac=$AC_TAG)."
              echo "::error::blue-green-deploy.yml only accepts a single image_tag input today."
              echo "::error::Dispatch blue-green-deploy.yml manually with the correct per-component tag, or bring the two colours back in sync with a component=both deploy."
              exit 1
            fi
            IMAGE_TAG="$SERVER_TAG"
            echo "Dispatching with resolved current tag: $IMAGE_TAG"
            echo "source=ssm-current" >> "$GITHUB_OUTPUT"
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Dispatch Blue/Green Deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.image_tag }}
          IMAGE_TAG_SOURCE: ${{ steps.resolve-tag.outputs.source }}
          # Poll budget MUST be lower than the job timeout above so the
          # script can exit cleanly with an error message before GitHub
          # kills the runner. 2400s (40m) leaves a 5min buffer under
          # timeout-minutes: 45.
          POLL_TIMEOUT: "2400"
        run: |
          echo "============================================"
          echo "DISPATCHING BLUE/GREEN DEPLOYMENT"
          echo "  image_tag: $IMAGE_TAG"
          echo "  source:    $IMAGE_TAG_SOURCE"
          echo "============================================"
          ./.github/scripts/dispatch-and-poll-blue-green.sh sandbox both "$IMAGE_TAG"

  deploy-sandbox-validate:
    name: Deploy Sandbox - Validate
    needs: [setup, deploy-sandbox-infra, deploy-sandbox-blue-green]
    if: |
      always() &&
      needs.deploy-sandbox-infra.result == 'success' &&
      needs.deploy-sandbox-blue-green.result == 'success'
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Post-Deployment Validation
        run: |
          echo "============================================"
          echo "POST-DEPLOYMENT VALIDATION"
          echo "============================================"

          # Make script executable and run
          chmod +x scripts/validate-deployment.sh

          # Run validation (continue on failure to collect all results)
          ./scripts/validate-deployment.sh sandbox || VALIDATION_FAILED=1

          if [ "${VALIDATION_FAILED:-0}" -eq 1 ]; then
            echo "::warning::Some validation checks failed - see output above"
          fi

      - name: Setup Go for Integration Tests
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            nhp/go.sum
            endpoints/go.sum

      - name: Run Integration Tests
        env:
          NHP_SERVER_ENDPOINT: "${{ needs.deploy-sandbox-infra.outputs.nlb_dns }}:62206"
          ETCD_ENDPOINTS: ${{ needs.deploy-sandbox-infra.outputs.etcd_endpoint }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "============================================"
          echo "INTEGRATION TESTS"
          echo "============================================"
          echo "NHP Server: $NHP_SERVER_ENDPOINT"
          echo "etcd: $ETCD_ENDPOINTS"
          echo ""

          # Run integration tests (skip etcd tests if no certs configured)
          cd tests/integration

          # Note: etcd tests will skip via t.Skip() if ETCD_CA_CERT is not set
          # This is expected in CI until we add etcd mTLS cert handling
          go test -v -tags=integration -timeout 5m ./... 2>&1 || {
            echo "::warning::Some integration tests failed or skipped"
          }

      - name: Read QURL domain from SSM
        id: qurl-domain-sandbox
        run: |
          # Read QURL link URL from SSM (Terraform is the source of truth)
          QURL_LINK_URL=$(aws ssm get-parameter \
            --name "/sandbox/nhp/qurl/link-url" \
            --query "Parameter.Value" --output text 2>/dev/null) || true

          if [ -z "$QURL_LINK_URL" ]; then
            echo "::warning::SSM parameter /sandbox/nhp/qurl/link-url not found, falling back to hardcoded value"
            QURL_LINK_URL="https://qurl.link.layerv.xyz"
          fi

          # Extract domain from URL (strip https://)
          LOGIN_PORTAL_DOMAIN="${QURL_LINK_URL#https://}"
          {
            echo "qurl_link_url=$QURL_LINK_URL"
            echo "login_portal_domain=$LOGIN_PORTAL_DOMAIN"
          } >> "$GITHUB_OUTPUT"
          echo "Using QURL link URL: $QURL_LINK_URL"

      - name: Run E2E Tests (Demo Flow)
        env:
          CONSOLE_API_URL: "https://home.secure.layerv.xyz"
          LOGIN_PORTAL_DOMAIN: ${{ steps.qurl-domain-sandbox.outputs.login_portal_domain }}
          APPS_DOMAIN: "qurl.site.layerv.xyz"
        run: |
          echo "============================================"
          echo "E2E TESTS - DEMO FLOW"
          echo "============================================"
          echo "Console API: $CONSOLE_API_URL"
          echo "Login Portal: $LOGIN_PORTAL_DOMAIN"
          echo "Apps Domain: $APPS_DOMAIN"
          echo ""

          # E2E tests verify the actual demo flow works end-to-end
          # These test public endpoints and don't require VPC access
          cd tests/e2e

          # Run E2E tests with verbose output
          go test -v -tags=e2e -timeout 5m ./... 2>&1 || {
            echo "::warning::Some E2E tests failed - see output above"
          }

      - name: Deployment Summary
        run: |
          {
            echo "## Sandbox Deployment Complete"
            echo ""
            echo "### Infrastructure"
            echo "| Component | Strategy | Status |"
            echo "|-----------|----------|--------|"
            echo "| Server + AC | Blue/Green | Deployed ✓ |"
            echo ""
            echo "### Endpoints"
            echo "- **NHP NLB:** \`${{ needs.deploy-sandbox-infra.outputs.nlb_dns }}\`"
            echo "- **etcd:** \`${{ needs.deploy-sandbox-infra.outputs.etcd_endpoint }}\`"
            echo ""
            echo "**Image Tag:** \`${{ needs.setup.outputs.image_tag }}\`"
            echo ""
            echo "### Validation"
            echo "- Post-deployment validation script executed"
            echo "- Integration tests completed (etcd tests skipped without mTLS certs)"
            echo "- E2E demo flow tests executed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Deployment Tracking
        run: |
          aws ssm put-parameter \
            --name "/sandbox/nhp/deploy/deployed-commit" \
            --value "${{ github.sha }}" --type String --overwrite \
            --region "$AWS_REGION" \
            || echo "::warning::Failed to update SSM /sandbox/nhp/deploy/deployed-commit"
          aws ssm put-parameter \
            --name "/sandbox/nhp/deploy/deployed-at" \
            --value "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --type String --overwrite \
            --region "$AWS_REGION" \
            || echo "::warning::Failed to update SSM /sandbox/nhp/deploy/deployed-at"
          echo "::notice::Deployment tracking updated: deployed-commit = ${{ github.sha }}"

  # ============================================================================
  # NHP SMOKE TESTS (Sandbox)
  #
  # Runs the nhp/tests/smoke suite against the freshly-deployed sandbox.
  # Calls the reusable workflow at .github/workflows/nhp-smoke-tests.yml.
  #
  # Rollout posture:
  #   PR1: tier=tier1, continue-on-error=true (report-only, burn-in)
  #   PR2: tier=tier1+tier2, continue-on-error=true
  #   PR3: tier=all,  continue-on-error=false (required check)
  # ============================================================================
  nhp-smoke-sandbox:
    name: NHP Smoke (sandbox)
    needs: [deploy-sandbox-validate]
    if: |
      always() &&
      needs.deploy-sandbox-validate.result == 'success'
    uses: ./.github/workflows/nhp-smoke-tests.yml
    with:
      environment: sandbox
      tier: all
      allow_ssm_probes: true
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # ============================================================================
  # PROD DEPLOY - Handled exclusively by promote-to-prod.yml
  # Use ./scripts/trigger-prod-deploy.sh to deploy to production.
  # ============================================================================

  # ============================================================================
  # NOTIFY
  # ============================================================================
  notify:
    name: Notify
    needs:
      - setup
      - test
      - test-lambdas
      - build
      # Sandbox deploy jobs
      - deploy-sandbox-infra
      - deploy-sandbox-blue-green
      - deploy-sandbox-validate
      - nhp-smoke-sandbox
    # Skip Slack when the waiter was cancelled (concurrency preempt or
    # manual). The dispatched blue/green sub-workflow runs to completion
    # on its own concurrency group and emits its own SNS-routed Slack
    # (see blue-green-deploy.yml:notify) — silence from here is more
    # accurate than a guess. See PR #1082 for the full rationale.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.deploy-sandbox-blue-green.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Build phase
          TEST_RESULT: ${{ needs.test.result }}
          TEST_LAMBDAS_RESULT: ${{ needs.test-lambdas.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          # Sandbox deploy components
          SANDBOX_INFRA: ${{ needs.deploy-sandbox-infra.result }}
          SANDBOX_BLUE_GREEN: ${{ needs.deploy-sandbox-blue-green.result }}
          SANDBOX_VALIDATE: ${{ needs.deploy-sandbox-validate.result }}
          NHP_SMOKE_RESULT: ${{ needs.nhp-smoke-sandbox.result }}
          # Metadata
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          START_TIME: ${{ needs.setup.outputs.start_time }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ -z "$SLACK_WEBHOOK" ]]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi

          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          # Calculate duration with sanity check
          END_TIME=$(date +%s)
          if [[ -n "$START_TIME" ]]; then
            DURATION_SECS=$((END_TIME - START_TIME))
            # Sanity check: negative or > 24 hours indicates clock issues
            if [[ $DURATION_SECS -lt 0 || $DURATION_SECS -gt 86400 ]]; then
              DURATION="unknown"
            else
              DURATION_MINS=$((DURATION_SECS / 60))
              DURATION_REMAINING_SECS=$((DURATION_SECS % 60))
              DURATION="${DURATION_MINS}m ${DURATION_REMAINING_SECS}s"
            fi
          else
            DURATION="unknown"
          fi

          # Determine trigger source
          TRIGGER="${{ github.event_name }}"
          case "$TRIGGER" in
            push)
              # Check first line of commit message for merge indicator
              # (COMMIT_MESSAGE env var handles multi-line safely)
              if echo "$COMMIT_MESSAGE" | head -n1 | grep -q "Merge pull request"; then
                TRIGGER_TEXT="PR merge"
              else
                TRIGGER_TEXT="Push"
              fi
              ;;
            pull_request) TRIGGER_TEXT="PR" ;;
            workflow_dispatch) TRIGGER_TEXT="Manual" ;;
            schedule) TRIGGER_TEXT="Scheduled" ;;
            *) TRIGGER_TEXT="$TRIGGER" ;;
          esac

          # Helper to convert result to emoji
          status_emoji() {
            case "$1" in
              success) echo ":white_check_mark:" ;;
              failure) echo ":x:" ;;
              cancelled) echo ":warning:" ;;
              skipped) echo ":white_circle:" ;;
              *) echo ":grey_question:" ;;
            esac
          }

          # Check if any sandbox deploy ran
          SANDBOX_DEPLOYED="false"
          if [[ "$SANDBOX_INFRA" != "skipped" ]]; then
            SANDBOX_DEPLOYED="true"
          fi

          # Build component status strings with visual pipeline
          SANDBOX_STATUS=""
          if [[ "$SANDBOX_DEPLOYED" == "true" ]]; then
            SANDBOX_STATUS="$(status_emoji "$SANDBOX_INFRA") Infra → $(status_emoji "$SANDBOX_BLUE_GREEN") Blue/Green → $(status_emoji "$SANDBOX_VALIDATE") Validate → $(status_emoji "$NHP_SMOKE_RESULT") Smoke"
          fi

          # Determine overall status and header
          if [[ "$BUILD_RESULT" == "success" ]]; then
            # Check for any deploy or validation failures
            DEPLOY_FAILED="false"
            for result in "$SANDBOX_INFRA" "$SANDBOX_BLUE_GREEN" "$SANDBOX_VALIDATE" "$NHP_SMOKE_RESULT"; do
              if [[ "$result" == "failure" ]]; then
                DEPLOY_FAILED="true"
                break
              fi
            done
            # Smoke is a required signal — a cancelled smoke means we
            # never confirmed post-deploy health. Treat as failure.
            # Other components have dedicated cancelled-handling branches
            # below (infra -> yellow, blue-green -> Notify skipped via
            # job if:), so only smoke needs this here.
            if [[ "$NHP_SMOKE_RESULT" == "cancelled" ]]; then
              DEPLOY_FAILED="true"
            fi

            if [[ "$SANDBOX_VALIDATE" == "success" ]]; then
              COLOR="#36a64f"
              EMOJI="white_check_mark"
              HEADER="NHP Server + AC Sandbox Deploy"
              STATUS_TEXT="successful"
            elif [[ "$DEPLOY_FAILED" == "true" ]]; then
              COLOR="#dc3545"
              EMOJI="x"
              HEADER="NHP Server + AC Sandbox Deploy"
              STATUS_TEXT="failed"
            elif [[ "$SANDBOX_DEPLOYED" == "false" ]]; then
              COLOR="#36a64f"
              EMOJI="white_check_mark"
              HEADER="NHP Build"
              STATUS_TEXT="successful"
            elif [[ "$SANDBOX_INFRA" == "cancelled" ]]; then
              COLOR="#ffc107"
              EMOJI="warning"
              HEADER="NHP Server + AC Deploy"
              STATUS_TEXT="cancelled"
            else
              COLOR="#dc3545"
              EMOJI="x"
              HEADER="NHP Server + AC Deploy"
              STATUS_TEXT="incomplete"
            fi
          elif [[ "$BUILD_RESULT" == "failure" || "$TEST_RESULT" == "failure" ]]; then
            COLOR="#dc3545"
            EMOJI="x"
            HEADER="NHP Build"
            STATUS_TEXT="failed"
          elif [[ "$BUILD_RESULT" == "cancelled" ]]; then
            COLOR="#ffc107"
            EMOJI="warning"
            HEADER="NHP Build"
            STATUS_TEXT="cancelled"
          else
            COLOR="#ffc107"
            EMOJI="warning"
            HEADER="NHP"
            STATUS_TEXT="incomplete"
          fi

          # Build the blocks array with improved layout
          BLOCKS="[
            {
              \"type\": \"section\",
              \"text\": {
                \"type\": \"mrkdwn\",
                \"text\": \":$EMOJI: *$HEADER* $STATUS_TEXT\"
              }
            },
            {
              \"type\": \"section\",
              \"fields\": [
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Branch:*\n\`${{ github.ref_name }}\` ($SHORT_SHA)\"
                },
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Trigger:*\n$TRIGGER_TEXT by ${{ github.actor }}\"
                },
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Tests:*\n$(status_emoji "$TEST_RESULT")\"
                },
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Build (Server + AC):*\n$(status_emoji "$BUILD_RESULT")\"
                }
              ]
            }"

          # Add sandbox component status if deployed
          if [[ "$SANDBOX_DEPLOYED" == "true" ]]; then
            BLOCKS="$BLOCKS,
            {
              \"type\": \"section\",
              \"text\": {
                \"type\": \"mrkdwn\",
                \"text\": \"*Sandbox:* $SANDBOX_STATUS\"
              }
            }"
          fi

          # Add commit message (first line, truncated to 100 chars, backticks escaped)
          COMMIT_FIRST_LINE=$(echo "$COMMIT_MESSAGE" | head -n1 | cut -c1-100 | sed 's/`/'"'"'/g')
          if [[ -n "$COMMIT_FIRST_LINE" ]]; then
            BLOCKS="$BLOCKS,
            {
              \"type\": \"section\",
              \"text\": {
                \"type\": \"mrkdwn\",
                \"text\": \"*Commit:* \`$COMMIT_FIRST_LINE\`\"
              }
            }"
          fi

          # Add footer with duration, commit link, and workflow link
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          BLOCKS="$BLOCKS,
            {
              \"type\": \"context\",
              \"elements\": [
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \":stopwatch: $DURATION  |  <$COMMIT_URL|$SHORT_SHA>  |  <$WORKFLOW_URL|View workflow>\"
                }
              ]
            }
          ]"

          curl -sfS -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"blocks\": $BLOCKS
              }]
            }" || echo "Slack notification failed (non-critical)"
