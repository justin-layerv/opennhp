name: Build and Deploy NHP

on:
  push:
    branches:
      - main
    paths:
      - 'nhp/**'
      - 'endpoints/**'
      - 'docker/**'
      - 'terraform/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches:
      - main
    # No path filters - workflow must run for all PRs so required checks report status
    # Path filtering happens at job level via the 'changes' job
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - sandbox
          - prod
      deploy:
        description: 'Deploy after build?'
        required: true
        default: true
        type: boolean
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: nhp-${{ github.event.inputs.environment || 'sandbox' }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.6'
  GO_VERSION: '1.24'

jobs:
  # ============================================================================
  # CHANGES - Detect what files changed (enables skipping jobs for doc-only PRs)
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'nhp/**'
              - 'endpoints/**'
              - 'docker/**'
              - 'terraform/**'
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/**'

      - name: Annotate skipped jobs
        if: steps.filter.outputs.code == 'false'
        run: |
          echo "::notice title=Jobs Skipped::No code changes detected (only docs/changelog). Test and Build jobs will be skipped but report success for branch protection."

  # ============================================================================
  # SETUP - Quick metadata job (runs first, enables parallelism)
  # ============================================================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - name: Set metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=sandbox" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

  # ============================================================================
  # TEST - Runs in parallel with build and terraform-plan
  # ============================================================================
  test:
    name: Test
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Skip at step level (not job level) so the check name is always created
      # This is required for branch protection to see the check as successful
      - name: Skip notice
        if: needs.changes.outputs.code != 'true' || github.event.inputs.skip_tests == 'true'
        run: |
          echo "::notice::Skipping tests - no code changes detected or skip requested"
          echo "This job reports success to satisfy branch protection requirements."

      - name: Checkout code
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        uses: actions/checkout@v6

      - name: Run tests (privileged container for iptables)
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        run: |
          # Run tests in privileged container to allow iptables access
          # This is required for NHP tests that manipulate firewall rules
          docker run --rm \
            --privileged \
            --cap-add=NET_ADMIN \
            --cap-add=NET_RAW \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e KBS_SKIP_INIT=1 \
            golang:${{ env.GO_VERSION }}-bookworm \
            bash -c "
              set -e
              echo '::group::Installing iptables and ipset'
              apt-get update && apt-get install -y iptables ipset >/dev/null 2>&1
              echo '::endgroup::'

              echo '::group::NHP Core Tests'
              cd nhp && go test ./... -v -timeout 5m -race
              echo '::endgroup::'

              echo '::group::Endpoints Tests'
              cd ../endpoints && go test ./... -v -timeout 5m -race
              echo '::endgroup::'
            "

      - name: Go vet
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            golang:${{ env.GO_VERSION }}-bookworm \
            bash -c "cd nhp && go vet ./... && cd ../endpoints && go vet ./..."

  # ============================================================================
  # BUILD - Parallel matrix builds (runs in parallel with test and terraform-plan)
  # ============================================================================
  build:
    name: Build ${{ matrix.image }}
    needs: [changes, setup]
    runs-on: ubuntu-latest
    # Note: No job-level 'if' - we skip at step level to ensure matrix expands
    # and check names (Build server, Build ac) are created for branch protection
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: docker/Dockerfile.server
            repo: layerv/nhp-server
          - image: ac
            dockerfile: docker/Dockerfile.ac.aws
            repo: layerv/nhp-ac
    steps:
      # Skip at step level (not job level) so matrix expands and check names are created
      - name: Skip notice
        if: needs.changes.outputs.code != 'true'
        run: |
          echo "::notice::Skipping build - no code changes detected"
          echo "This job reports success to satisfy branch protection requirements."

      - name: Checkout code
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: needs.changes.outputs.code == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: needs.changes.outputs.code == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, matrix.repo, needs.setup.outputs.image_tag) || format('local/{0}:{1}', matrix.repo, needs.setup.outputs.image_tag) }}
            ${{ steps.login-ecr.outputs.registry && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, matrix.repo, needs.setup.outputs.environment) || format('local/{0}:{1}', matrix.repo, needs.setup.outputs.environment) }}
            ${{ steps.login-ecr.outputs.registry && format('{0}/{1}:latest', steps.login-ecr.outputs.registry, matrix.repo) || format('local/{0}:latest', matrix.repo) }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
          secrets: |
            github_token=${{ secrets.PLUGIN_REPO_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Set image name for scanning
        if: needs.changes.outputs.code == 'true'
        id: image
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG="${{ needs.setup.outputs.image_tag }}"
          if [[ -n "$ECR_REGISTRY" ]]; then
            echo "name=$ECR_REGISTRY/${{ matrix.repo }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          else
            echo "name=local/${{ matrix.repo }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Scan image
        if: needs.changes.outputs.code == 'true'
        # renovate: datasource=github-releases depName=aquasecurity/trivy-action
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ steps.image.outputs.name }}
          format: 'sarif'
          output: '${{ matrix.image }}-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: '.trivyignore'
          # Required: SARIF includes all severities by default, causing exit-code
          # to trigger on LOW findings. This limits SARIF to match severity filter.
          limit-severities-for-sarif: 'true'

      - name: Upload scan results
        uses: actions/upload-artifact@v6
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: trivy-results-${{ matrix.image }}
          path: '${{ matrix.image }}-trivy-results.sarif'
          retention-days: 30

      - name: Push to ECR
        if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENV_TAG: ${{ needs.setup.outputs.environment }}
        run: |
          docker push $ECR_REGISTRY/${{ matrix.repo }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.repo }}:$ENV_TAG
          docker push $ECR_REGISTRY/${{ matrix.repo }}:latest
          echo "::notice::Image pushed: $ECR_REGISTRY/${{ matrix.repo }}:$IMAGE_TAG"

  # ============================================================================
  # TERRAFORM VALIDATE (PR only - fast feedback)
  # ============================================================================
  terraform-validate:
    name: Terraform Validate (PR)
    # Skip for Dependabot PRs and when no terraform files changed
    # External PRs (from forks or automated tools) can't assume AWS OIDC role
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for Terraform changes
        id: changes
        run: |
          # Get the base branch
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Check if any terraform files changed
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^terraform/'; then
            echo "terraform_changed=true" >> $GITHUB_OUTPUT
            echo "Terraform files changed - running validation"
          else
            echo "terraform_changed=false" >> $GITHUB_OUTPUT
            echo "No terraform files changed - skipping validation"
          fi

      - name: Setup Terraform
        if: steps.changes.outputs.terraform_changed == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        if: steps.changes.outputs.terraform_changed == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure AWS credentials
        if: steps.changes.outputs.terraform_changed == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          # Hardcoded for dependabot PRs (secrets not available)
          role-to-assume: arn:aws:iam::767397897469:role/nhp-sandbox-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/environments/sandbox
        run: terraform fmt -check -recursive ../../

      - name: Terraform Init
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/environments/sandbox
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          terraform init

      - name: Terraform Validate
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/environments/sandbox
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/environments/sandbox
        run: |
          terraform plan -no-color 2>&1 | tee plan.txt
          echo "## Terraform Plan" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with Plan
        uses: actions/github-script@v8
        if: steps.changes.outputs.terraform_changed == 'true'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/sandbox/plan.txt', 'utf8');
            const lines = plan.split('\n');
            const summary = lines.slice(-30).join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan (sandbox)\n\`\`\`\n${summary}\n\`\`\``
            });

      - name: Skip Notice
        if: steps.changes.outputs.terraform_changed != 'true'
        run: |
          echo "## Terraform Validation Skipped" >> $GITHUB_STEP_SUMMARY
          echo "No terraform files changed in this PR." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # TERRAFORM PLAN - Runs in parallel with test and build
  # ============================================================================
  terraform-plan:
    name: Terraform Plan (${{ matrix.environment }})
    needs: [setup]  # Only needs metadata, runs in parallel with test/build
    if: |
      github.event_name != 'pull_request' &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.environment)) || fromJSON('["sandbox"]') }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ matrix.environment == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.environment }}
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          terraform init

      - name: Terraform Format Check
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive ../../

      - name: Terraform Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/${{ matrix.environment }}
        env:
          # Sensitive variables passed via TF_VAR_ environment variables
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          # Deployment configuration - use commit SHA for immutable deployments
          TF_VAR_image_tag: ${{ needs.setup.outputs.image_tag }}
        run: |
          terraform plan -out=tfplan -no-color 2>&1 | tee plan.txt

          if grep -q "No changes" plan.txt; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v6
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.sha }}
          path: |
            terraform/environments/${{ matrix.environment }}/tfplan
            terraform/environments/${{ matrix.environment }}/plan.txt
          retention-days: 5

      - name: Plan Summary
        run: |
          echo "## Terraform Plan (${{ matrix.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          head -100 terraform/environments/${{ matrix.environment }}/plan.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # DEPLOY SANDBOX - Waits for all parallel jobs to complete
  # ============================================================================
  deploy-sandbox:
    name: Deploy to Sandbox
    needs: [setup, test, build, terraform-plan]  # Waits for all parallel jobs
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.build.result == 'success' &&
      needs.terraform-plan.result == 'success' &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' && github.event.inputs.environment == 'sandbox')
      )
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/sandbox
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/sandbox
        env:
          # Sensitive variables passed via TF_VAR_ environment variables
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          # Deployment configuration - use commit SHA for immutable deployments
          TF_VAR_image_tag: ${{ needs.setup.outputs.image_tag }}
        # Run plan+apply together - avoids archive_file artifact issues
        # Plan output is already available in terraform-plan job for review
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: outputs
        working-directory: terraform/environments/sandbox
        run: |
          echo "server_asg=$(terraform output -raw asg_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "ac_asg=$(terraform output -raw ac_asg_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "console_ec2_asg=$(terraform output -raw console_ec2_asg_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "nlb_dns=$(terraform output -raw nlb_dns_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "etcd_endpoint=$(terraform output -raw etcd_endpoint 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Canary Deploy - NHP Server
        if: steps.outputs.outputs.server_asg != ''
        env:
          ASG_NAME: ${{ steps.outputs.outputs.server_asg }}
        run: |
          echo "============================================"
          echo "CANARY DEPLOYMENT - NHP Server"
          echo "============================================"

          # Start instance refresh with canary settings (1 instance at a time)
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 90,
              "InstanceWarmup": 300,
              "MaxHealthyPercentage": 110,
              "SkipMatching": true
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"

          # Wait for first instance to be replaced (canary)
          echo "Waiting for canary instance..."
          for i in {1..60}; do
            sleep 10

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PERCENTAGE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "Status: $STATUS, Progress: ${PERCENTAGE}%"

            case "$STATUS" in
              "Successful")
                echo "Instance refresh completed successfully"
                break
                ;;
              "Failed"|"Cancelled")
                echo "Instance refresh failed: $STATUS"
                exit 1
                ;;
              "InProgress")
                # Check if at least one instance is done (canary)
                if [[ "$PERCENTAGE" -gt 0 ]]; then
                  echo "Canary instance replaced, verifying health..."

                  # Verify via SSM
                  INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
                    --auto-scaling-group-names "$ASG_NAME" \
                    --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId | [0]" \
                    --output text)

                  if [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]]; then
                    echo "Verifying health on instance: $INSTANCE_ID"

                    COMMAND_ID=$(aws ssm send-command \
                      --instance-ids "$INSTANCE_ID" \
                      --document-name "AWS-RunShellScript" \
                      --parameters 'commands=["docker ps | grep nhp-server && systemctl is-active nhp-server"]' \
                      --query "Command.CommandId" \
                      --output text 2>/dev/null || echo "")

                    if [[ -n "$COMMAND_ID" ]]; then
                      sleep 10
                      SSM_STATUS=$(aws ssm get-command-invocation \
                        --command-id "$COMMAND_ID" \
                        --instance-id "$INSTANCE_ID" \
                        --query "Status" \
                        --output text 2>/dev/null || echo "Unknown")

                      if [[ "$SSM_STATUS" == "Success" ]]; then
                        echo "Canary health check passed"
                      else
                        echo "Canary health check: $SSM_STATUS (continuing...)"
                      fi
                    fi
                  fi
                fi
                ;;
            esac
          done

      - name: Canary Deploy - AC
        if: steps.outputs.outputs.ac_asg != ''
        env:
          ASG_NAME: ${{ steps.outputs.outputs.ac_asg }}
        run: |
          echo "============================================"
          echo "CANARY DEPLOYMENT - Access Controller"
          echo "============================================"

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 300,
              "MaxHealthyPercentage": 110,
              "SkipMatching": true
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"

          # Wait for completion
          echo "Waiting for instance refresh..."
          for i in {1..60}; do
            sleep 10

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PERCENTAGE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "Status: $STATUS, Progress: ${PERCENTAGE}%"

            case "$STATUS" in
              "Successful")
                echo "Instance refresh completed successfully"
                break
                ;;
              "Failed"|"Cancelled")
                echo "Instance refresh failed: $STATUS"
                exit 1
                ;;
              "InProgress")
                if [[ "$PERCENTAGE" -gt 0 ]]; then
                  echo "Canary instance replaced, verifying health..."

                  INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
                    --auto-scaling-group-names "$ASG_NAME" \
                    --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId | [0]" \
                    --output text)

                  if [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]]; then
                    echo "Verifying health on instance: $INSTANCE_ID"

                    # SSM health check for AC (check traefik and nhp-acd services)
                    COMMAND_ID=$(aws ssm send-command \
                      --instance-ids "$INSTANCE_ID" \
                      --document-name "AWS-RunShellScript" \
                      --parameters 'commands=["systemctl is-active traefik nhp-acd"]' \
                      --query "Command.CommandId" \
                      --output text 2>/dev/null || echo "")

                    if [[ -n "$COMMAND_ID" ]]; then
                      sleep 10
                      SSM_STATUS=$(aws ssm get-command-invocation \
                        --command-id "$COMMAND_ID" \
                        --instance-id "$INSTANCE_ID" \
                        --query "Status" \
                        --output text 2>/dev/null || echo "Unknown")

                      if [[ "$SSM_STATUS" == "Success" ]]; then
                        echo "Canary health check passed (traefik + nhp-acd active)"
                      else
                        echo "Canary health check: $SSM_STATUS (continuing...)"
                      fi
                    fi
                  fi
                fi
                ;;
            esac
          done

      - name: Canary Deploy - Console EC2
        if: steps.outputs.outputs.console_ec2_asg != ''
        env:
          ASG_NAME: ${{ steps.outputs.outputs.console_ec2_asg }}
        run: |
          echo "============================================"
          echo "CANARY DEPLOYMENT - Console EC2"
          echo "============================================"

          # SkipMatching must be false for Console EC2 because the binary is downloaded
          # at boot via user_data, not baked into the AMI. When code changes, the launch
          # template doesn't change, so SkipMatching would incorrectly skip replacement.
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 300,
              "MaxHealthyPercentage": 110,
              "SkipMatching": false
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"

          # Wait for completion
          echo "Waiting for instance refresh..."
          for i in {1..60}; do
            sleep 10

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PERCENTAGE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "Status: $STATUS, Progress: ${PERCENTAGE}%"

            case "$STATUS" in
              "Successful")
                echo "Instance refresh completed successfully"
                break
                ;;
              "Failed"|"Cancelled")
                echo "Instance refresh failed: $STATUS"
                exit 1
                ;;
            esac
          done

      - name: Post-Deployment Validation
        run: |
          echo "============================================"
          echo "POST-DEPLOYMENT VALIDATION"
          echo "============================================"

          # Make script executable and run
          chmod +x scripts/validate-deployment.sh

          # Run validation (continue on failure to collect all results)
          ./scripts/validate-deployment.sh sandbox || VALIDATION_FAILED=1

          if [ "${VALIDATION_FAILED:-0}" -eq 1 ]; then
            echo "::warning::Some validation checks failed - see output above"
          fi

      - name: Setup Go for Integration Tests
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: |
            nhp/go.sum
            endpoints/go.sum

      - name: Run Integration Tests
        env:
          NHP_SERVER_ENDPOINT: "${{ steps.outputs.outputs.nlb_dns }}:62206"
          ETCD_ENDPOINTS: ${{ steps.outputs.outputs.etcd_endpoint }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "============================================"
          echo "INTEGRATION TESTS"
          echo "============================================"
          echo "NHP Server: $NHP_SERVER_ENDPOINT"
          echo "etcd: $ETCD_ENDPOINTS"
          echo ""

          # Run integration tests (skip etcd tests if no certs configured)
          cd tests/integration

          # Note: etcd tests will skip via t.Skip() if ETCD_CA_CERT is not set
          # This is expected in CI until we add etcd mTLS cert handling
          go test -v -tags=integration -timeout 5m ./... 2>&1 || {
            echo "::warning::Some integration tests failed or skipped"
          }

      - name: Run E2E Tests (Demo Flow)
        env:
          CONSOLE_API_URL: "https://home.secure.layerv.xyz"
          LOGIN_PORTAL_DOMAIN: "qurl.link"
          APPS_DOMAIN: "qurl.site"
        run: |
          echo "============================================"
          echo "E2E TESTS - DEMO FLOW"
          echo "============================================"
          echo "Console API: $CONSOLE_API_URL"
          echo "Login Portal: $LOGIN_PORTAL_DOMAIN"
          echo "Apps Domain: $APPS_DOMAIN"
          echo ""

          # E2E tests verify the actual demo flow works end-to-end
          # These test public endpoints and don't require VPC access
          cd tests/e2e

          # Run E2E tests with verbose output
          go test -v -tags=e2e -timeout 5m ./... 2>&1 || {
            echo "::warning::Some E2E tests failed - see output above"
          }

      - name: Deployment Summary
        run: |
          echo "## Sandbox Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure" >> $GITHUB_STEP_SUMMARY
          echo "| Component | ASG | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NHP Server | ${{ steps.outputs.outputs.server_asg }} | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| AC | ${{ steps.outputs.outputs.ac_asg }} | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| Console EC2 | ${{ steps.outputs.outputs.console_ec2_asg || 'N/A' }} | ${{ steps.outputs.outputs.console_ec2_asg && 'Deployed' || 'Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- **NHP NLB:** \`${{ steps.outputs.outputs.nlb_dns }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **etcd:** \`${{ steps.outputs.outputs.etcd_endpoint }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.setup.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation" >> $GITHUB_STEP_SUMMARY
          echo "- Post-deployment validation script executed" >> $GITHUB_STEP_SUMMARY
          echo "- Integration tests completed (etcd tests skipped without mTLS certs)" >> $GITHUB_STEP_SUMMARY
          echo "- E2E demo flow tests executed" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # DEPLOY PROD
  # ============================================================================
  deploy-prod:
    name: Deploy to Production
    needs: [setup, test, build, terraform-plan]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.build.result == 'success' &&
      needs.terraform-plan.result == 'success' &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' && github.event.inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        env:
          # Sensitive variables passed via TF_VAR_ environment variables
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          # Deployment configuration - use commit SHA for immutable deployments
          TF_VAR_image_tag: ${{ needs.setup.outputs.image_tag }}
        # Run plan+apply together - avoids archive_file artifact issues
        # Manual approval is handled by GitHub environment protection rules
        # Plan output is available in terraform-plan job for review before approval
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: outputs
        working-directory: terraform/environments/prod
        run: |
          echo "server_asg=$(terraform output -raw asg_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "ac_asg=$(terraform output -raw ac_asg_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "nlb_dns=$(terraform output -raw nlb_dns_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "etcd_endpoint=$(terraform output -raw etcd_endpoint 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Canary Deploy - NHP Server (Production)
        if: steps.outputs.outputs.server_asg != ''
        env:
          ASG_NAME: ${{ steps.outputs.outputs.server_asg }}
        run: |
          echo "============================================"
          echo "CANARY DEPLOYMENT - NHP Server (PROD)"
          echo "============================================"

          # Production: more conservative settings
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 90,
              "InstanceWarmup": 300,
              "MaxHealthyPercentage": 105,
              "SkipMatching": true
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"
          echo "Waiting for production instance refresh..."

          for i in {1..90}; do
            sleep 10

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PERCENTAGE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "Status: $STATUS, Progress: ${PERCENTAGE}%"

            if [[ "$STATUS" == "Successful" ]]; then
              echo "Production instance refresh completed"
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "Production instance refresh failed: $STATUS"
              exit 1
            fi
          done

      - name: Canary Deploy - AC (Production)
        if: steps.outputs.outputs.ac_asg != ''
        env:
          ASG_NAME: ${{ steps.outputs.outputs.ac_asg }}
        run: |
          echo "============================================"
          echo "CANARY DEPLOYMENT - AC (PROD)"
          echo "============================================"

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 75,
              "InstanceWarmup": 300,
              "MaxHealthyPercentage": 105,
              "SkipMatching": true
            }' \
            --query "InstanceRefreshId" \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"
          echo "Waiting for production instance refresh..."

          for i in {1..90}; do
            sleep 10

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PERCENTAGE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "Status: $STATUS, Progress: ${PERCENTAGE}%"

            if [[ "$STATUS" == "Successful" ]]; then
              echo "Production instance refresh completed"
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "Production instance refresh failed: $STATUS"
              exit 1
            fi
          done

      - name: Post-Deployment Validation (Production)
        run: |
          echo "============================================"
          echo "POST-DEPLOYMENT VALIDATION (PRODUCTION)"
          echo "============================================"

          chmod +x scripts/validate-deployment.sh
          ./scripts/validate-deployment.sh prod || VALIDATION_FAILED=1

          if [ "${VALIDATION_FAILED:-0}" -eq 1 ]; then
            echo "::warning::Some production validation checks failed - see output above"
          fi

      - name: Setup Go for Integration Tests
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: |
            nhp/go.sum
            endpoints/go.sum

      - name: Run Integration Tests (Production)
        env:
          NHP_SERVER_ENDPOINT: "${{ steps.outputs.outputs.nlb_dns }}:62206"
          ETCD_ENDPOINTS: ${{ steps.outputs.outputs.etcd_endpoint }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "============================================"
          echo "INTEGRATION TESTS (PRODUCTION)"
          echo "============================================"
          echo "NHP Server: $NHP_SERVER_ENDPOINT"
          echo "etcd: $ETCD_ENDPOINTS"
          echo ""

          cd tests/integration
          go test -v -tags=integration -timeout 5m ./... 2>&1 || {
            echo "::warning::Some production integration tests failed or skipped"
          }

      - name: Run E2E Tests (Production Demo Flow)
        env:
          # Production uses different domains
          CONSOLE_API_URL: "https://home.secure.layerv.ai"
          LOGIN_PORTAL_DOMAIN: "qurl.link"
          APPS_DOMAIN: "qurl.site"
        run: |
          echo "============================================"
          echo "E2E TESTS - PRODUCTION DEMO FLOW"
          echo "============================================"
          echo "Console API: $CONSOLE_API_URL"
          echo ""

          cd tests/e2e
          go test -v -tags=e2e -timeout 5m ./... 2>&1 || {
            echo "::warning::Some production E2E tests failed"
          }

      - name: Production Deployment Summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure" >> $GITHUB_STEP_SUMMARY
          echo "| Component | ASG | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| NHP Server | ${{ steps.outputs.outputs.server_asg }} | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| AC | ${{ steps.outputs.outputs.ac_asg }} | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- **NHP NLB:** \`${{ steps.outputs.outputs.nlb_dns }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **etcd:** \`${{ steps.outputs.outputs.etcd_endpoint }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${{ needs.setup.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation" >> $GITHUB_STEP_SUMMARY
          echo "- Post-deployment validation script executed" >> $GITHUB_STEP_SUMMARY
          echo "- Integration tests completed" >> $GITHUB_STEP_SUMMARY
          echo "- E2E demo flow tests executed" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # NOTIFY
  # ============================================================================
  notify:
    name: Notify
    needs: [setup, test, build, deploy-sandbox, deploy-prod]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_SANDBOX_RESULT: ${{ needs.deploy-sandbox.result }}
          DEPLOY_PROD_RESULT: ${{ needs.deploy-prod.result }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
        run: |
          if [[ -z "$SLACK_WEBHOOK" ]]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi

          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          # Determine overall status
          if [[ "$BUILD_RESULT" == "success" ]]; then
            if [[ "$DEPLOY_SANDBOX_RESULT" == "success" || "$DEPLOY_PROD_RESULT" == "success" ]]; then
              COLOR="#36a64f"
              EMOJI="ok"
              STATUS="successful"
              DETAILS="Build and deploy completed"
            elif [[ "$DEPLOY_SANDBOX_RESULT" == "skipped" && "$DEPLOY_PROD_RESULT" == "skipped" ]]; then
              COLOR="#36a64f"
              EMOJI="ok"
              STATUS="successful"
              DETAILS="Build completed (deploy skipped)"
            elif [[ "$DEPLOY_SANDBOX_RESULT" == "cancelled" || "$DEPLOY_PROD_RESULT" == "cancelled" ]]; then
              # Cancelled is not a failure - usually means a newer run superseded this one
              COLOR="#ffc107"
              EMOJI="warning"
              STATUS="cancelled"
              DETAILS="Build succeeded, deploy cancelled (superseded by newer run)"
            else
              COLOR="#dc3545"
              EMOJI="error"
              STATUS="failed"
              DETAILS="Build succeeded but deploy failed"
            fi
          elif [[ "$BUILD_RESULT" == "failure" || "$TEST_RESULT" == "failure" ]]; then
            COLOR="#dc3545"
            EMOJI="error"
            STATUS="failed"
            DETAILS="Build or tests failed"
          elif [[ "$BUILD_RESULT" == "cancelled" ]]; then
            COLOR="#ffc107"
            EMOJI="warning"
            STATUS="cancelled"
            DETAILS="Build was cancelled"
          else
            COLOR="#ffc107"
            EMOJI="warning"
            STATUS="incomplete"
            DETAILS="Check workflow logs"
          fi

          # Determine environment
          if [[ "$DEPLOY_PROD_RESULT" == "success" ]]; then
            DEPLOY_ENV="production"
          elif [[ "$DEPLOY_SANDBOX_RESULT" == "success" ]]; then
            DEPLOY_ENV="sandbox"
          else
            DEPLOY_ENV="build-only"
          fi

          curl -sfS -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"$EMOJI *NHP* build $STATUS\"
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"fields\": [
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Environment:*\n$DEPLOY_ENV\"
                      },
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Branch:*\n${{ github.ref_name }}\"
                      },
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Tests:*\n$TEST_RESULT\"
                      },
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Build:*\n$BUILD_RESULT\"
                      }
                    ]
                  },
                  {
                    \"type\": \"context\",
                    \"elements\": [
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"$DETAILS | <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|$SHORT_SHA> | <$WORKFLOW_URL|View workflow>\"
                      }
                    ]
                  }
                ]
              }]
            }" || echo "Slack notification failed (non-critical)"
