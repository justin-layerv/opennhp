name: Build and Deploy NHP

# run-name embeds an optional correlation_id so parent workflows can
# reliably find the specific build-and-push run they dispatched via
# find-dispatched-run.sh. This avoids timestamp matching races with
# concurrent main pushes or other manual dispatches.
run-name: "Build and Deploy NHP${{ inputs.correlation_id && format(' [corr:{0}]', inputs.correlation_id) || '' }}"

on:
  push:
    branches:
      - main
    paths:
      - 'nhp/**'
      - 'internalauth/**'
      - 'endpoints/**'
      - 'docker/**'
      - 'Makefile'
      - 'terraform/**'
      - 'scripts/**'
      - 'tests/**'
      # PR #252 introduced the packer-build job in this workflow but never
      # added packer/** to the path filter. Result: a PR that only touches
      # packer/* (e.g. #980's shebang fix) merges to main without triggering
      # this workflow at all, and the new packer-build job is silently
      # skipped. Adding the path here so packer-only changes still run.
      - 'packer/**'
      - '.github/workflows/build-and-push.yml'
      # See the matching entry in the changes:app filter — .trivyignore
      # gates the image-scan job, so pushes that edit it must trigger
      # this workflow on main too.
      - '.trivyignore'
  pull_request:
    branches:
      - main
    # No path filters - workflow must run for all PRs so required checks report status
    # Path filtering happens at job level via the 'changes' job
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - sandbox
          # prod removed — prod deploys MUST go through promote-to-prod.yml
          # via ./scripts/trigger-prod-deploy.sh (prevents accidental terraform apply in prod)
      deploy:
        description: 'Deploy after build?'
        required: true
        default: true
        type: boolean
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        required: false
        default: false
        type: boolean
      force_build:
        description: 'Force image build even without app code changes'
        required: false
        default: false
        type: boolean
      correlation_id:
        description: 'Optional unique ID set by the parent dispatcher so it can reliably find this run (see find-dispatched-run.sh).'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

# Push events get a unique group per run so rapid-fire merges (e.g. Dependabot batches)
# never cancel each other — deploy jobs have their own concurrency groups to serialize.
# Without this, pending push runs get cancelled by newer ones, silently skipping deploys.
concurrency:
  group: ${{ github.event_name == 'push' && format('nhp-push-{0}', github.run_id) || format('nhp-{0}-{1}-{2}', github.event.inputs.environment || 'sandbox', github.ref_name, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.14.3'
  # Bumping this requires lockstep updates across:
  #   - env.GO_VERSION in build-and-push.yml, ubuntu-build.yml,
  #     codeql.yml, build-binaries.yml
  #   - ARG GO_VERSION and verified tarball checksums in
  #     docker/Dockerfile.{app,base}
  #   - `go` directives in the CI-touched Go modules
  # GO_TEST_IMAGE and docker/Dockerfile.{server,ac,ac.aws} must share
  # one golang:<version>-bookworm@sha256:<digest> ref (also covers the
  # FROM tags in those three files). Re-resolve via `docker buildx
  # imagetools inspect golang:${GO_VERSION}-bookworm`, then pick an
  # official OCI index digest that satisfies the Docker age gate.
  # `make lint-workflows` runs scripts/check-go-version-drift.sh over
  # these surfaces so a one-sided bump fails before merge.
  GO_VERSION: '1.26.5'
  GO_TEST_IMAGE: 'golang:1.26.5-bookworm@sha256:18aedc16aa19b3fd7ded7245fc14b109e054d65d22ed53c355c899582bbb2113'

jobs:
  # ============================================================================
  # CHANGES - Granular change detection for conditional job execution
  # Enables:
  # - App-only changes: Build + SSM update + instance refresh (skip TF apply)
  # - Infra-only changes: TF apply (skip build if no app changes)
  # - Both: Full pipeline
  # - Docs-only: Skip all but report success for branch protection
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.override.outputs.app || steps.filter.outputs.code }}
      app: ${{ steps.override.outputs.app || steps.filter.outputs.app }}
      infra: ${{ steps.filter.outputs.infra }}
      tests: ${{ steps.filter.outputs.tests }}
      lambdas: ${{ steps.filter.outputs.lambdas }}
      packer: ${{ steps.filter.outputs.packer }}
      packer_server: ${{ steps.filter.outputs.packer_server }}
      packer_ac: ${{ steps.filter.outputs.packer_ac }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Full history needed for paths-filter to compare commits

      - name: Detect code changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            # lint-allow: paths-filter-coverage
            # `code` lists '.github/workflows/**' (broader than
            # push.paths, which has only the single
            # 'build-and-push.yml' entry) so that, *once the
            # workflow has fired*, any workflow change is detected
            # by the Test job's `if: needs.changes.outputs.code`
            # gate. The coverage gap is structurally harmless:
            # changes to other workflow files don't trigger this
            # workflow at all (push.paths gate), so a stale
            # `code=false` output never reaches a job. Remove this
            # allowlist annotation if push.paths ever loses its
            # 'build-and-push.yml' entry — at that point the gap
            # stops being inert and starts skipping tests on
            # workflow-only edits.
            code:
              - 'nhp/**'
              - 'internalauth/**'
              - 'endpoints/**'
              - 'docker/**'
              - 'Makefile'
              - 'terraform/**'
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/**'
            app:
              - 'nhp/**'
              - 'internalauth/**'
              - 'endpoints/**'
              - 'docker/**'
              # Makefile is intentionally broad: it owns the app build entrypoints
              # for server, AC, relay, and image contents.
              - 'Makefile'
              # .trivyignore is consumed by the image-scan job; without it
              # in the path filter, a PR that only edits the ignore file
              # skips the trivy gate entirely and silently "passes."
              - '.trivyignore'
            infra:
              - 'terraform/**'
            tests:
              - 'tests/**'
              - 'nhp/**'
              - 'internalauth/**'
              - 'endpoints/**'
              - 'Makefile'
            lambdas:
              - 'terraform/modules/**/lambda/**'
              - 'terraform/lambda/**'
            packer:
              - 'packer/**'
            packer_server:
              - 'packer/nhp-server-docker.pkr.hcl'
            packer_ac:
              - 'packer/nhp-ac.pkr.hcl'

      - name: Change Detection Summary
        run: |
          {
            echo "## Change Detection Results"
            echo "| Category | Changed |"
            echo "|----------|---------|"
            echo "| Any code | ${{ steps.filter.outputs.code }} |"
            echo "| App (nhp, internalauth, endpoints, docker, Makefile, .trivyignore) | ${{ steps.filter.outputs.app }} |"
            echo "| Infrastructure (terraform) | ${{ steps.filter.outputs.infra }} |"
            echo "| Tests | ${{ steps.filter.outputs.tests }} |"
            echo "| Lambdas | ${{ steps.filter.outputs.lambdas }} |"
            echo "| Packer | ${{ steps.filter.outputs.packer }} |"
            echo "| Packer Server AMI | ${{ steps.filter.outputs.packer_server }} |"
            echo "| Packer AC AMI | ${{ steps.filter.outputs.packer_ac }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Force build override
        id: override
        if: github.event.inputs.force_build == 'true'
        run: |
          echo "app=true" >> "$GITHUB_OUTPUT"
          echo "::notice::force_build=true — overriding app change detection to force image build"

      - name: Annotate skipped jobs
        if: steps.filter.outputs.code == 'false' && github.event.inputs.force_build != 'true'
        run: |
          echo "::notice title=Jobs Skipped::No code changes detected (only docs/changelog). Test and Build jobs will be skipped but report success for branch protection."

  # ============================================================================
  # SETUP - Quick metadata job (runs first, enables parallelism)
  # ============================================================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      environment: ${{ steps.meta.outputs.environment }}
      start_time: ${{ steps.meta.outputs.start_time }}
    steps:
      # Fail fast on workflow_dispatch from a non-main ref. This is
      # UX only: the load-bearing fence is the OIDC trust policy in
      # terraform/modules/ecr/{main,packer}.tf, which rejects
      # feature-branch sub claims (#1121). Without this guard the
      # AWS-using jobs spin for ~2 min on opaque STS retries.
      # Body in scripts/print-dispatch-ref-error.sh — separate file
      # for fixture-testability (see tests/lints/dispatch-ref-error/).
      # The Checkout step is required because the script lives in
      # the repo; both steps share the same `if:` so they fire as
      # one unit on the rare invalid-dispatch path. Job-level `if:`
      # would skip the rest of `setup` (Set metadata, etc.) which
      # we don't want.
      - name: Checkout (guard only)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate dispatch ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GITHUB_REF: ${{ github.ref }}
        run: bash scripts/print-dispatch-ref-error.sh

      - name: Set metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=sandbox" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi
          {
            # Always the workflow commit, including workflow_dispatch. The
            # dispatch ref guard above keeps deployable manual runs on main, so
            # deployed-commit records the same commit whose images were built.
            echo "image_tag=${{ github.sha }}"
            echo "start_time=$(date +%s)"
          } >> "$GITHUB_OUTPUT"

  # ============================================================================
  # SANDBOX APP IMAGE DRIFT - Detect stale live app images before deploy
  # ============================================================================
  # The per-commit paths-filter only answers "did this commit touch app paths?"
  # It does not answer whether sandbox actually runs all app changes through
  # this SHA. If an app-changing deploy fails and a later infra-only commit
  # succeeds, relying only on the later commit's path filter can re-roll the old
  # image and then stamp deployed-commit as current. Compare HEAD against the
  # live active image tags so the next successful deploy heals that drift.
  # On-call runbook for this intentional coupling: while drift is unhealed,
  # even infra-only/CI-only pushes build+scan+roll app images, and a broken app
  # tree blocks sandbox deploys until the app fix lands or the breakage is
  # reverted. That is the safety tradeoff: sandbox must not stamp a SHA deployed
  # while serving older app bytes.
  # This deliberately makes main-push builds depend on SSM: if we cannot prove
  # the configured live tags, the deploy must fail red rather than guess.
  # ============================================================================
  sandbox-environment-guard:
    name: Sandbox Environment Guard
    if: |
      github.event_name == 'pull_request' ||
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' && github.event.inputs.environment == 'sandbox')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - name: Verify sandbox environment has no protection rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ENV_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/environments/sandbox")
          PROTECTION_RULE_COUNT=$(jq '.protection_rules // [] | length' <<< "$ENV_JSON")
          if (( PROTECTION_RULE_COUNT != 0 )); then
            echo "::error::The sandbox GitHub environment has protection rules, but sandbox-app-image-drift runs on the main-push path and must not wait for approval."
            echo "::error::Remove sandbox environment protection rules or move the drift gate off the protected environment before merging main-push workflow changes."
            jq -c '.protection_rules // []' <<< "$ENV_JSON"
            exit 1
          fi

          echo "::notice::sandbox GitHub environment has no protection rules; app-image drift detection can run without approval."

  sandbox-app-image-drift:
    name: Sandbox App Image Drift
    needs: [changes, setup, sandbox-environment-guard]
    if: |
      github.event_name != 'pull_request' &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' && github.event.inputs.environment == 'sandbox')
      )
    runs-on: ubuntu-latest
    # This job is on the main-push path. Keep the `sandbox` environment free of
    # required reviewers/protection while this gate uses sandbox OIDC/SSM access,
    # or every qualifying main push will pause before drift detection. See
    # CLAUDE.md "Sandbox App-Image Drift Gate" for the operational tradeoff.
    environment: sandbox
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    outputs:
      app_image_required: ${{ steps.resolve.outputs.app_image_required }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve app image drift
        id: resolve
        env:
          HEAD_SHA: ${{ needs.setup.outputs.image_tag }}
        run: |
          set -euo pipefail

          ./.github/scripts/resolve-live-app-image-required.sh sandbox "$HEAD_SHA"

  app-image-build-required:
    name: App Image Build Required
    needs: [changes, sandbox-app-image-drift]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      app_image_build_required: ${{ steps.classify.outputs.app_image_build_required }}
    steps:
      - name: Classify app-image build requirement
        id: classify
        env:
          APP_CHANGED_THIS_COMMIT: ${{ needs.changes.outputs.app }}
          LIVE_APP_IMAGE_REQUIRED: ${{ needs.sandbox-app-image-drift.outputs.app_image_required }}
        run: |
          set -euo pipefail

          required=""
          if [[ "$APP_CHANGED_THIS_COMMIT" == "true" || "$LIVE_APP_IMAGE_REQUIRED" == "true" ]]; then
            required="true"
          elif [[ "$APP_CHANGED_THIS_COMMIT" == "false" && "$LIVE_APP_IMAGE_REQUIRED" != "true" ]]; then
            required="false"
          fi

          echo "app_image_build_required=$required" >> "$GITHUB_OUTPUT"
          echo "::notice::app_image_build_required=${required:-unset}"

  # ============================================================================
  # PACKER - Build runtime-baked AMIs if missing or packer files changed
  # ============================================================================
  # The Server and AC AMIs are required for Terraform — there is no fallback to
  # vanilla Ubuntu. This job builds the AMIs and publishes their IDs to SSM
  # Parameter Store. Terraform reads from SSM, so once built, subsequent deploys
  # reuse them.
  #
  # This job always runs on pushes to main and workflow_dispatch (so that
  # terraform-plan has a deterministic dependency). Internally it decides
  # whether to actually build each component by checking two things:
  #   1. Did that component's Packer template change on this commit?
  #   2. Is that component's SSM parameter missing (fresh env bootstrap)?
  # If either is true for a component, we build only that AMI. Otherwise the
  # job is a no-op that succeeds immediately and terraform-plan continues.
  # ============================================================================
  packer-build:
    name: Packer Build AMI (${{ matrix.environment }})
    needs: [changes, setup]
    runs-on: ubuntu-latest
    # 45 minutes gives headroom for building both Server and AC AMIs. A rare
    # apt mirror flap, ECR auth backoff, or multi-region copy can each
    # add a few minutes. Bump again only if we observe sustained run times >40m.
    timeout-minutes: 45
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'
    # NOTE (issue #2252): packer-build is deliberately NOT a required status
    # check on main. It is skipped on the PR path (the if: above only runs it on
    # push-to-main or workflow_dispatch), so requiring it would either block
    # every PR with a never-reported context or be a no-op. The failure we must
    # never miss is the POST-merge bake — that is surfaced via the notify job's
    # Slack alert (packer-build ∈ notify.needs + PACKER_RESULT), and the wiring
    # is fenced by scripts/check-packer-failure-surfaced.sh.
    permissions:
      id-token: write
      contents: read
    # Serialize concurrent runs against the same env to prevent two builds
    # racing to overwrite the SSM parameter (the "winning" AMI is then
    # consumed by the next instance refresh, leaving the loser as garbage).
    concurrency:
      group: packer-build-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      matrix:
        environment: [sandbox, prod]
      # Don't cancel one environment if the other fails — sandbox and prod
      # builds are independent and a sandbox failure shouldn't block prod
      # bootstrap on the first merge.
      fail-fast: false
      #
      # IAM role prerequisites (one per environment):
      #
      #   AWS_PACKER_SANDBOX_ROLE_ARN — sandbox account, dedicated to this job
      #   AWS_PACKER_PROD_ROLE_ARN    — prod account, dedicated to this job
      #
      # These roles are intentionally separate from the broader
      # AWS_ROLE_ARN / AWS_PROD_ROLE_ARN that the rest of the workflow
      # uses. They have the amazon-ebs builder permissions plus scoped
      # ssm:PutParameter on /{env}/nhp/{server,ac}/ami-id, defined in
      # terraform/modules/ecr/packer.tf. Both the Server and AC AMI IDs are
      # published by their Packer shell-local post-processors under this
      # dedicated Packer role; the workflow only reads/verifies the resulting
      # parameters through the environment deploy role. See
      # terraform/modules/ecr/packer.tf for why packer-build is separate from
      # the terraform-apply role.
      #
      # The Terraform output `github_actions_packer_role_arn` (in both
      # terraform/environments/sandbox and terraform/environments/prod)
      # exposes the ARN to put in the corresponding GitHub Actions secret.
    # AWS_REGION is inherited from the workflow-level `env:` block at the top
    # of this file (currently us-east-2). All AWS-touching steps in this job
    # read from that single source of truth so changing the region is a
    # one-line edit at the top of the workflow.
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials (AMI parameter read)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ matrix.environment == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if AMI already exists
        id: check-ami
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          COMPONENTS=(server ac)

          # Distinguish "ParameterNotFound" (expected fresh-env case) from
          # other errors (creds, region, network) so a transient failure
          # doesn't silently force a rebuild on every run.
          for component in "${COMPONENTS[@]}"; do
            SSM_PARAM="/${ENVIRONMENT}/nhp/${component}/ami-id"
            ERR_FILE="/tmp/${component}-ami-ssm-err"

            if PARAM_VALUE=$(aws ssm get-parameter --name "$SSM_PARAM" --query 'Parameter.Value' --output text 2>"$ERR_FILE"); then
              echo "${component} AMI exists in SSM: $PARAM_VALUE"
              echo "${component}_exists=true" >> "$GITHUB_OUTPUT"
              continue
            fi

            if grep -q "ParameterNotFound" "$ERR_FILE"; then
              echo "No ${component} AMI found in SSM (ParameterNotFound) — will build"
              echo "${component}_exists=false" >> "$GITHUB_OUTPUT"
              continue
            fi

            echo "::error::Unexpected SSM error checking $SSM_PARAM:"
            cat "$ERR_FILE"
            exit 1
          done

      - name: Decide whether to build
        id: should-build
        env:
          SERVER_TEMPLATE_CHANGED: ${{ needs.changes.outputs.packer_server }}
          AC_TEMPLATE_CHANGED: ${{ needs.changes.outputs.packer_ac }}
          SERVER_AMI_EXISTS: ${{ steps.check-ami.outputs.server_exists }}
          AC_AMI_EXISTS: ${{ steps.check-ami.outputs.ac_exists }}
        run: |
          set -euo pipefail
          build_server=false
          build_ac=false

          if [[ "$SERVER_TEMPLATE_CHANGED" == "true" || "$SERVER_AMI_EXISTS" == "false" ]]; then
            build_server=true
          fi
          if [[ "$AC_TEMPLATE_CHANGED" == "true" || "$AC_AMI_EXISTS" == "false" ]]; then
            build_ac=true
          fi

          if [[ "$build_server" == "true" || "$build_ac" == "true" ]]; then
            build_any=true
          else
            build_any=false
          fi

          {
            echo "server=$build_server"
            echo "ac=$build_ac"
            echo "any=$build_any"
          } >> "$GITHUB_OUTPUT"

          echo "Packer build decision: server=$build_server (template_changed=$SERVER_TEMPLATE_CHANGED, exists=$SERVER_AMI_EXISTS), ac=$build_ac (template_changed=$AC_TEMPLATE_CHANGED, exists=$AC_AMI_EXISTS)"

      - name: Configure AWS credentials (Packer build)
        if: steps.should-build.outputs.any == 'true'
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ matrix.environment == 'prod' && secrets.AWS_PACKER_PROD_ROLE_ARN || secrets.AWS_PACKER_SANDBOX_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify Packer pin integrity BEFORE Setup Packer runs. This step
      # catches three classes of pin breakage at the earliest possible moment:
      #   1. Workflow setup-packer `version:` drifted to "latest"
      #   2. Pkr.hcl plugin constraint drifted to floating
      #   3. The setup-packer action SHA pin no longer resolves on GitHub
      #      (the third class is what broke the first post-#252 main run —
      #      a bad SHA was latent for 2.5 months because packer-build had
      #      never actually run before the merge to main)
      #
      # Placement matters: this step MUST run before Setup Packer. If it
      # ran after, a bad action SHA would fail Setup Packer first and the
      # verifier would never get a chance to surface the cleaner error.
      - name: Verify Packer pin integrity
        if: steps.should-build.outputs.any == 'true'
        env:
          # gh CLI needs auth to call repos/.../git/commits/{sha}. The
          # default GITHUB_TOKEN has read access to public repos which is
          # sufficient for this check.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # IMPORTANT: every grep/awk below must anchor to start-of-line
          # (^[[:space:]]*uses:) to avoid matching the literal strings in
          # this very script — earlier drafts of this verifier matched
          # their own error messages before the real `uses:` directive.

          # Check 1 — workflow setup-packer version pin is explicit (not
          # "latest"). This is a structural check, not a numeric-equality
          # check; the runner Packer version (e.g. 1.14.4) and the plugin
          # constraint (e.g. amazon ~> 1.3) live in different version
          # spaces and don't have to numerically agree, they just have to
          # both be pinned-not-floating.
          WORKFLOW_PIN=$(awk '/^[[:space:]]*uses:[[:space:]]*hashicorp\/setup-packer@/{f=1; next} f && /^[[:space:]]*version:/{print $2; exit}' .github/workflows/build-and-push.yml)
          if [ -z "$WORKFLOW_PIN" ] || [ "$WORKFLOW_PIN" = "latest" ]; then
            echo "::error::Workflow setup-packer version is missing or set to 'latest'. Pin it to a specific version (current: 1.14.4)."
            exit 1
          fi

          # Check 2 — packer/*.pkr.hcl plugin constraints are pinned to a
          # constrained range, not floating to whatever the latest plugin
          # release happens to be at build time.
          for template in packer/nhp-server-docker.pkr.hcl packer/nhp-ac.pkr.hcl; do
            if ! grep -q 'version *= *"~> *[0-9]' "$template"; then
              echo "::error::${template} required_plugins.amazon.version is missing or floating. Pin it to a constrained range (current: \"~> 1.3\")."
              exit 1
            fi
          done

          # Check 3 — the setup-packer action SHA pin actually resolves
          # on GitHub. This is the check that would have caught the bad
          # SHA the original PR shipped. Parses the `uses:` line to
          # extract owner/repo and the SHA, then queries the GitHub API
          # to confirm the commit exists. Catches typos, copy-paste
          # errors, and force-pushed/garbage-collected SHAs.
          ACTION_LINE=$(grep -E '^[[:space:]]*uses:[[:space:]]*hashicorp/setup-packer@' .github/workflows/build-and-push.yml | head -1)
          if [ -z "$ACTION_LINE" ]; then
            echo "::error::Could not find a 'uses: hashicorp/setup-packer@<sha>' line in the workflow."
            exit 1
          fi
          ACTION_REF=$(echo "$ACTION_LINE" | sed -E 's/.*uses:[[:space:]]*([^[:space:]]+).*/\1/')
          ACTION_REPO="${ACTION_REF%@*}"
          ACTION_SHA="${ACTION_REF##*@}"
          if [[ ! "$ACTION_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::setup-packer is pinned to '$ACTION_SHA' which does not look like a 40-char commit SHA. Pin to a full SHA (not a tag or branch) for supply-chain integrity."
            exit 1
          fi
          if ! gh api "repos/${ACTION_REPO}/git/commits/${ACTION_SHA}" --silent 2>/tmp/gh-err; then
            echo "::error::Pinned action SHA '${ACTION_REPO}@${ACTION_SHA}' does not resolve on GitHub. The pin is invalid (typo, force-push, or commit not in the repo). Look up the correct SHA via:"
            echo "::error::  gh api repos/${ACTION_REPO}/git/ref/tags/v3 -q .object.sha"
            cat /tmp/gh-err >&2 || true
            exit 1
          fi

          # Check 4 — the Packer runner version (the one setup-packer
          # downloads, e.g. "1.14.4") actually exists as a release on
          # hashicorp/packer. The previous round shipped a pin to "1.14.4"
          # which doesn't exist; setup-packer accepted the version string
          # at config time and only failed at install time with
          # "No matching version found". This check catches that failure
          # mode at the verifier step instead.
          if ! gh api "repos/hashicorp/packer/releases/tags/v${WORKFLOW_PIN}" --silent 2>/tmp/gh-err-pkv; then
            echo "::error::Pinned Packer runner version 'v${WORKFLOW_PIN}' does not exist as a release on hashicorp/packer. Look up valid versions via:"
            echo "::error::  gh api repos/hashicorp/packer/releases --paginate -q '.[] | select(.draft == false and .prerelease == false) | .tag_name' | head"
            cat /tmp/gh-err-pkv >&2 || true
            exit 1
          fi

          # Check 5 — the actual download binary at releases.hashicorp.com
          # is reachable. Check 4 confirms the GitHub release exists, but
          # setup-packer downloads from releases.hashicorp.com, NOT from
          # GitHub. The two are usually atomic in HashiCorp's release
          # process but they could diverge — a GitHub release tag could
          # be created before the binary upload finishes, or the binary
          # URL pattern could change. This probe closes that gap by
          # actually HEAD-ing the download URL setup-packer will use.
          # `curl -fsI` returns non-zero on any HTTP error (curl exit 22
          # for 4xx, exit 56 for 404 specifically).
          PACKER_URL="https://releases.hashicorp.com/packer/${WORKFLOW_PIN}/packer_${WORKFLOW_PIN}_linux_amd64.zip"
          if ! curl -fsI "$PACKER_URL" >/dev/null 2>&1; then
            echo "::error::Packer release v${WORKFLOW_PIN} is not downloadable from $PACKER_URL"
            echo "::error::The release exists on GitHub (Check 4 passed) but the binary is missing from releases.hashicorp.com. This is rare but happens if a release tag is created before the binary upload completes. Wait a few minutes and retry, or pick a different version."
            exit 1
          fi

          echo "Packer pin integrity OK:"
          echo "  workflow pin = $WORKFLOW_PIN (release exists, binary downloadable)"
          echo "  plugin constraint pinned in pkr.hcl"
          echo "  setup-packer SHA $ACTION_SHA resolves on $ACTION_REPO"

      - name: Setup Packer
        if: steps.should-build.outputs.any == 'true'
        uses: hashicorp/setup-packer@3286471d6cc6756d056a0b199fea5e0becdbc189 # v3.3.0
        with:
          # Pin a specific Packer version so a surprise upstream release
          # can't change AMI build behaviour mid-rollout. Bump intentionally
          # when upgrading (coordinate with packer/nhp-server-docker.pkr.hcl
          # and packer/nhp-ac.pkr.hcl required_plugins). The
          # "Verify Packer pin integrity" step
          # above asserts the runner Packer version is still pinned (not
          # "latest"), the version actually exists as a hashicorp/packer
          # release, the template plugin pin is still present, AND the
          # setup-packer action SHA actually resolves on GitHub.
          #
          # When bumping: the bump procedure is documented at
          # packer/nhp-server-docker.pkr.hcl::"Pin the Amazon plugin..."
          # (nhp-ac.pkr.hcl uses the same Amazon plugin constraint)
          # and includes verifying the new release exists via:
          #   gh api repos/hashicorp/packer/releases/tags/v<NEW> -q .tag_name
          version: 1.15.1

      - name: Packer Init
        if: steps.should-build.outputs.any == 'true'
        working-directory: packer
        env:
          BUILD_SERVER_AMI: ${{ steps.should-build.outputs.server }}
          BUILD_AC_AMI: ${{ steps.should-build.outputs.ac }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_SERVER_AMI" == "true" ]]; then
            packer init nhp-server-docker.pkr.hcl
          fi
          if [[ "$BUILD_AC_AMI" == "true" ]]; then
            packer init nhp-ac.pkr.hcl
          fi

      - name: Packer Validate
        if: steps.should-build.outputs.any == 'true'
        working-directory: packer
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          AWS_BUILD_REGION: ${{ env.AWS_REGION }}
          GIT_SHA: ${{ github.sha }}
          BUILD_SERVER_AMI: ${{ steps.should-build.outputs.server }}
          BUILD_AC_AMI: ${{ steps.should-build.outputs.ac }}
        run: |
          set -euo pipefail
          # Run packer validate before packer build so syntax / template errors
          # surface in seconds, not after a 10-minute build attempt that ends
          # with the same syntax error. Same -var set as the build step below
          # so the validation matches the actual invocation.
          if [[ "$BUILD_SERVER_AMI" == "true" ]]; then
            packer validate \
              -var "environment=${ENVIRONMENT}" \
              -var "aws_region=${AWS_BUILD_REGION}" \
              -var "git_sha=${GIT_SHA}" \
              nhp-server-docker.pkr.hcl
          fi
          if [[ "$BUILD_AC_AMI" == "true" ]]; then
            # Same -var set as the AC packer build below (which publishes via
            # the post-processor — see that step's comment).
            packer validate \
              -var "environment=${ENVIRONMENT}" \
              -var "aws_region=${AWS_BUILD_REGION}" \
              -var "git_sha=${GIT_SHA}" \
              -var "runtime_packages_only=true" \
              nhp-ac.pkr.hcl
          fi

      - name: Packer Build
        if: steps.should-build.outputs.any == 'true'
        working-directory: packer
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          AWS_BUILD_REGION: ${{ env.AWS_REGION }}
          GIT_SHA: ${{ github.sha }}
          BUILD_SERVER_AMI: ${{ steps.should-build.outputs.server }}
          BUILD_AC_AMI: ${{ steps.should-build.outputs.ac }}
        run: |
          set -euo pipefail
          # -on-error=cleanup tells Packer to terminate the builder instance
          # and remove any partial artifacts on failure, instead of leaving an
          # orphan EC2 instance running until someone notices it. Without this
          # a transient build failure leaves a billing surprise.
          # git_sha is embedded in the AMI name and tags so an operator can
          # grep an AMI back to the exact packer/* template version.
          if [[ "$BUILD_SERVER_AMI" == "true" ]]; then
            packer build \
              -on-error=cleanup \
              -var "environment=${ENVIRONMENT}" \
              -var "aws_region=${AWS_BUILD_REGION}" \
              -var "git_sha=${GIT_SHA}" \
              nhp-server-docker.pkr.hcl
          fi
          if [[ "$BUILD_AC_AMI" == "true" ]]; then
            # AC publishes /<env>/nhp/ac/ami-id from its Packer shell-local
            # post-processor under the dedicated Packer role, same as the
            # Server build above (#2248 collapsed the former workflow-side
            # publish workaround now that the role's ac/ami-id grant is
            # steady-state in every environment).
            packer build \
              -on-error=cleanup \
              -var "environment=${ENVIRONMENT}" \
              -var "aws_region=${AWS_BUILD_REGION}" \
              -var "git_sha=${GIT_SHA}" \
              -var "runtime_packages_only=true" \
              nhp-ac.pkr.hcl
          fi

      - name: Configure AWS credentials (AMI parameter verify)
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ matrix.environment == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify SSM Parameter
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          BUILT_SERVER_AMI: ${{ steps.should-build.outputs.server }}
          BUILT_AC_AMI: ${{ steps.should-build.outputs.ac }}
        run: |
          set -euo pipefail
          COMPONENTS=(server ac)

          {
            echo "## Packer Build (${ENVIRONMENT})"
            echo "Built server AMI on this run: ${BUILT_SERVER_AMI}"
            echo "Built AC AMI on this run: ${BUILT_AC_AMI}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for component in "${COMPONENTS[@]}"; do
            SSM_PARAM="/${ENVIRONMENT}/nhp/${component}/ami-id"
            if ! AMI_ID=$(aws ssm get-parameter --name "$SSM_PARAM" --query 'Parameter.Value' --output text); then
              echo "::error::SSM parameter $SSM_PARAM is missing after the Packer build decision. The component should have been built when its parameter was absent; inspect the Check if AMI already exists and Packer Build steps."
              exit 1
            fi

            # Defence in depth: even though the packer post-processor parses
            # the manifest itself, double-check here that the SSM value is a
            # bare ami-* identifier and not a "region:ami-*" string.
            if ! echo "$AMI_ID" | grep -Eq '^ami-[0-9a-f]+$'; then
              echo "::error::SSM parameter $SSM_PARAM contains invalid AMI ID '$AMI_ID' (expected ami-XXXX)"
              exit 1
            fi

            echo "${component} AMI ID: $AMI_ID"
            echo "- ${component}: \`${AMI_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # ============================================================================
  # TEST - Runs after terraform validation/plan passes (or is skipped)
  # Terraform is fast (~2min) and catches config errors early, saving CI time
  # ============================================================================
  test:
    name: Test
    needs: [changes, terraform-validate, terraform-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run if terraform jobs succeeded or were skipped (dependabot PRs, non-deploy dispatch)
    if: |
      always() &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.terraform-plan.result == 'success' || needs.terraform-plan.result == 'skipped')
    steps:
      # Skip at step level (not job level) so the check name is always created
      # This is required for branch protection to see the check as successful
      - name: Skip notice
        if: needs.changes.outputs.code != 'true' || github.event.inputs.skip_tests == 'true'
        run: |
          echo "::notice::Skipping tests - no code changes detected or skip requested"
          echo "This job reports success to satisfy branch protection requirements."

      - name: Checkout code
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Sets up Go on the runner solely to manage the module/build cache
      # across runs. Tests themselves still execute in the
      # digest-pinned GO_TEST_IMAGE container below; we bind-mount the
      # runner's GOMODCACHE and GOCACHE into the container so cache state
      # persists across runs without rebuilding the module graph or
      # recompiling every package from scratch.
      #
      # Cache-dependency-path matches the Integration Tests step's
      # setup-go invocation later in this workflow (both go.sum files),
      # so the cache key and scope are consistent across jobs.
      - name: Setup Go (module + build cache for docker tests)
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            nhp/go.sum
            endpoints/go.sum

      - name: Run tests (privileged container for iptables)
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        run: |
          # Run tests in privileged container to allow iptables access
          # This is required for NHP tests that manipulate firewall rules.
          #
          # GOMODCACHE and GOCACHE are bind-mounted from the runner so
          # subsequent runs (and the Go vet step below) skip module
          # downloads and recompilation of unchanged packages.
          #
          # UID note: the runner owns $HOME/go/pkg/mod as the runner
          # user, but golang:bookworm runs as root inside the container
          # and writes cache entries as UID 0. Go's on-disk cache format
          # is UID-agnostic so reads / writes interoperate cleanly, and
          # actions/cache's post-save step uses sudo tar to archive
          # root-owned files. If this image ever switches to a non-root
          # user, the `mkdir -p` below plus the bind-mount owner will
          # need to agree on the target UID (chown or --user).
          mkdir -p "$HOME/go/pkg/mod" "$HOME/.cache/go-build"
          # Pinned via GO_TEST_IMAGE; see env block.
          docker run --rm \
            --privileged \
            --cap-add=NET_ADMIN \
            --cap-add=NET_RAW \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/go/pkg/mod:/root/go/pkg/mod" \
            -v "$HOME/.cache/go-build:/root/.cache/go-build" \
            -w /workspace \
            -e KBS_SKIP_INIT=1 \
            "${GO_TEST_IMAGE}" \
            bash -c "
              set -e
              echo '::group::Installing iptables and ipset'
              apt-get update && apt-get install -y iptables ipset >/dev/null 2>&1
              echo '::endgroup::'

              echo '::group::NHP Core Tests'
              cd nhp && go test ./... -v -timeout 5m -race
              echo '::endgroup::'

              echo '::group::Internalauth Tests'
              cd ../internalauth && go test ./... -v -timeout 5m -race
              echo '::endgroup::'

              echo '::group::Endpoints Tests'
              cd ../endpoints && go test ./... -v -timeout 5m -race
              echo '::endgroup::'

              # L3 flush scheduler inFlight-marker tests run repeatedly under
              # -race so the detector has a better chance of catching any
              # ordering regression on the per-key inFlight chan + cleanup
              # defer interleavings these tests exist to fence. Single-pass
              # -count=1 is sufficient for correctness in CI but gives weak
              # statistical confidence on race interleavings; -count=10 keeps
              # CI budget bounded (~10s for the eight tests, weighted by the
              # CleanupDeferFires* polls and the MultipleWaitersBlockOnInFlight
              # per-iteration hold) and is a hard gate before flipping
              # L3FlushDryRun=false. See #2188.
              #
              # Absolute path /workspace/endpoints/ac/... rather than ./ac/...
              # so a future reorder of steps inside this heredoc (e.g. inserting
              # a cd into a different module between this and the Endpoints
              # Tests step) cannot silently retarget the invocation. The
              # Endpoints Tests step leaves cwd at /workspace/endpoints today,
              # but that is a positional assumption we should not rely on.
              echo '::group::L3 Flush InFlightMarker Race Stress (count=10)'
              go test -v -timeout 5m -race -count=10 -run '^TestScheduler_InFlightMarker_' /workspace/endpoints/ac/...
              echo '::endgroup::'

              # #2214 — pointer-uniqueness fence at common.TokenStore.Store.
              # Build tag 'nhp_debug' (namespaced to avoid colliding with
              # any future 'debug' tag a dependency might adopt) swaps the
              # no-op assertUniquePointerLocked in tokenstore_debug_off.go
              # for the panic-on-reuse variant in tokenstore_debug_on.go.
              # Production builds pay zero cost; this CI step is the
              # regression catcher that fires before any future AccessEntry
              # / ACTokenEntry pool/reuse refactor silently breaks
              # latestOtherFirewallDeadline's pointer-equality self-skip on
              # the AC or the analogous server-side invariant.
              # Scoped to the three packages the invariant touches:
              # nhp/common (where the fence is implemented),
              # endpoints/ac (where AccessEntry's pointer-identity invariant
              # load-bears the L3-flush peer-rescheduling math), and
              # endpoints/server (where ACTokenEntry is the other
              # production pointer-typed instantiation — defense-in-depth
              # so a future server-side pool/reuse change is also fenced).
              #
              # cd into each module's root before invoking go test —
              # nhp/ and endpoints/ are separate Go modules in the
              # multi-module workspace, and 'go test <abs-path>' refuses
              # to cross module roots from a foreign cwd (the
              # "directory X is outside module root Y" failure mode).
              # The earlier 'NHP Core Tests' / 'Endpoints Tests' steps
              # in this heredoc use the same cd-then-relative pattern.
              # -race matches sibling 'NHP Core Tests' / 'Endpoints Tests'
              # steps. The fence itself runs under ts.mu so adds no value
              # for the assertion, but the underlying package tests benefit
              # from race detection generally and build-tag-conditional
              # code paths get exercised under TSAN that the !nhp_debug
              # pass wouldn't.
              #
              # KBS_SKIP_INIT=1 is inherited from the docker -e env at
              # line 622, not set per-invocation here. The local Makefile
              # 'make test-debug' target sets it explicitly. If a future
              # restructure removes the container-level env, this step
              # would need an explicit 'KBS_SKIP_INIT=1 ' prefix on the
              # endpoints invocation to keep the AC tests' key-init guard
              # happy.
              echo '::group::Debug-tag pointer-uniqueness assertion (#2214)'
              cd /workspace/nhp && go test -tags=nhp_debug -count=1 -timeout 2m -race -v ./common/...
              cd /workspace/endpoints && go test -tags=nhp_debug -count=1 -timeout 5m -race -v ./ac/... ./server/...
              echo '::endgroup::'
            "

      - name: Go vet
        if: needs.changes.outputs.code == 'true' && github.event.inputs.skip_tests != 'true'
        run: |
          # Shares the runner's GOMODCACHE/GOCACHE with the Run tests
          # step, so vet reuses test-compiled packages instead of doing
          # a cold rebuild.
          # Pinned via GO_TEST_IMAGE; see env block.
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/go/pkg/mod:/root/go/pkg/mod" \
            -v "$HOME/.cache/go-build:/root/.cache/go-build" \
            -w /workspace \
            "${GO_TEST_IMAGE}" \
            bash -c "cd nhp && go vet ./... && cd ../internalauth && go vet ./... && cd ../endpoints && go vet ./..."

  # ============================================================================
  # TEST LAMBDAS - Python unit tests for Lambda functions (billing, etc.)
  # Runs in parallel with Go tests when Lambda code changes
  # ============================================================================
  test-lambdas:
    name: Test Lambdas
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip notice
        if: needs.changes.outputs.lambdas != 'true'
        run: |
          echo "::notice::Skipping Lambda tests - no Lambda code changes detected"

      - name: Checkout code
        if: needs.changes.outputs.lambdas == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        if: needs.changes.outputs.lambdas == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        if: needs.changes.outputs.lambdas == 'true'
        # Install from the Lambda suites' pinned/dev requirements so the
        # standalone Lambda test job exercises the same versions across
        # re-triggers instead of inheriting transitive pins from a sibling suite.
        run: |
          pip install -r terraform/modules/acme-cert/lambda/requirements-dev.txt
          pip install -r terraform/modules/custom-domain-cert/lambda/requirements-test.txt
          pip install -r terraform/modules/status-page/lambda/requirements-dev.txt

      - name: Run Lambda unit tests
        if: needs.changes.outputs.lambdas == 'true'
        env:
          # Match the package-build action's hermetic unit-test backstop:
          # tests must mock AWS side effects, not discover ambient runner
          # credentials or IMDS.
          AWS_ACCESS_KEY_ID: unit-test
          AWS_SECRET_ACCESS_KEY: unit-test
          AWS_SESSION_TOKEN: unit-test
          AWS_DEFAULT_REGION: us-east-2
          AWS_REGION: us-east-2
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          echo '::group::Billing Lambda Tests'
          python -m pytest terraform/modules/billing/lambda/test_*.py -v
          echo '::endgroup::'
          echo '::group::Developer Portal Lambda Tests'
          python -m pytest terraform/modules/developer-portal/lambda/test_*.py -v
          echo '::endgroup::'
          echo '::group::ACME Cert Lambda Tests'
          (cd terraform/modules/acme-cert/lambda && python -m pytest test_acme_cert_manager.py -v)
          echo '::endgroup::'
          echo '::group::Custom Domain Cert Lambda Tests'
          (cd terraform/modules/custom-domain-cert/lambda && python -m pytest test_cert_manager.py -v)
          echo '::endgroup::'
          echo '::group::Security Lambda Tests'
          (cd terraform/modules/security/lambda && python -m pytest test_stale_finding_watchdog.py -v)
          echo '::endgroup::'
          # IAM MFA audit (#1138). Separate pytest invocation from the watchdog
          # above: mfa_audit.py uses the same import-time sys.modules['boto3']
          # swap + `assert 'boto3' not in sys.modules` guard, so globbing both in
          # one process would trip that assert.
          echo '::group::Security MFA Audit Lambda Tests'
          (cd terraform/modules/security/lambda && python -m pytest test_mfa_audit.py -v)
          echo '::endgroup::'
          # qurl-reverse-tunnel-server empty-AZ watchdog (#1542). Same sys.modules-swap
          # pattern as security/test_stale_finding_watchdog.py — runs
          # in its own pytest invocation so a transitive boto3 import
          # from another test file's conftest can't fire the runtime
          # check at the top of the test module.
          echo '::group::qurl-reverse-tunnel-server Empty-AZ Watchdog Lambda Tests'
          (cd terraform/modules/qurl-reverse-tunnel-server/lambda && python -m pytest test_empty_az_watchdog.py -v)
          echo '::endgroup::'
          echo '::group::ECR Replication Check Lambda Tests'
          # Suite is serial-only — module re-imports per test for
          # region-resolution coverage. See `lambda_module` fixture
          # in test_ecr_replication_check.py for the xdist caveat.
          (cd terraform/lambda && python -m pytest test_ecr_replication_check.py -v)
          echo '::endgroup::'
          echo '::group::Status Page Aggregator Lambda Tests'
          (cd terraform/modules/status-page/lambda && python -m pytest test_status_aggregator.py -v)
          echo '::endgroup::'
          echo '::group::Auth0 Rotation Lambda Tests (Node)'
          node --test terraform/modules/auth0/lambda/rotate_secret.test.js
          echo '::endgroup::'

  # ============================================================================
  # BUILD - Parallel matrix builds after terraform validation/plan passes (or is skipped)
  # Terraform is fast (~2min) and catches config errors early, saving CI time
  # ============================================================================
  build:
    name: Build ${{ matrix.image }}
    needs: [changes, setup, sandbox-environment-guard, sandbox-app-image-drift, app-image-build-required, terraform-validate, terraform-plan]
    runs-on: ubuntu-latest
    # attestations: write + id-token: write let the post-push attest steps
    # (SLSA provenance + SBOM) mint keyless Sigstore attestations and push
    # them to ECR as OCI referrers. The top-level block grants id-token but
    # not attestations, so this narrows privilege to the one job that needs it
    # rather than widening the workflow-wide default. See the "Generate SBOM"
    # / "Attest" steps below (#1333, #1335).
    permissions:
      id-token: write
      contents: read
      attestations: write
    # Run if terraform jobs succeeded or were skipped (dependabot PRs, non-deploy dispatch)
    # Note: We still skip at step level to ensure matrix expands and check names are created
    if: |
      always() &&
      (needs.sandbox-environment-guard.result == 'success' || needs.sandbox-environment-guard.result == 'skipped') &&
      (needs.sandbox-app-image-drift.result == 'success' || needs.sandbox-app-image-drift.result == 'skipped') &&
      needs.app-image-build-required.result == 'success' &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.terraform-plan.result == 'success' || needs.terraform-plan.result == 'skipped')
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: docker/Dockerfile.server
            repo: layerv/nhp-server
            platform: linux/amd64
          - image: ac
            dockerfile: docker/Dockerfile.ac.aws
            repo: layerv/nhp-ac
            # Issue #2816: the AC eBPF objects are compiled inside this image
            # build, and prod AC launch templates are x86_64 today. Keep this
            # platform in lockstep with terraform/modules/ac/main.tf until a
            # real non-amd64 BPF load test exists for the flip slice.
            platform: linux/amd64
          # The NHP-Relay (#2208). Build + scan + push, mirroring the server/ac
          # legs. The CD deploy leg (#2624) is the `deploy-sandbox-relay` job
          # below: it puts this freshly-built tag into /sandbox/nhp/relay/image-tag
          # and triggers an instance refresh on the relay ASG. That job is a clean
          # no-op while the relay is dark (deploy_relay=false → the relay module's
          # SSM params don't exist → ParameterNotFound → skip).
          - image: relay
            dockerfile: docker/Dockerfile.relay
            repo: layerv/nhp-relay
            platform: linux/amd64
    steps:
      # Skip at step level (not job level) so matrix expands and check names are created
      # Build only when this commit changed app paths, or the live sandbox app
      # images lag app changes already present in the target SHA.
      - name: Skip notice
        if: needs.app-image-build-required.outputs.app_image_build_required != 'true'
        run: |
          echo "::notice::Skipping build - live app image tags already contain app paths at this SHA"
          echo "This job reports success to satisfy branch protection requirements."

      - name: Checkout code
        if: needs.app-image-build-required.outputs.app_image_build_required == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ECR is hosted in the sandbox account (primary_account). Prod pulls cross-account
      # via ECR repository policy (see terraform/modules/ecr/main.tf). Images are always
      # pushed to sandbox ECR, so we always use the sandbox role here.
      - name: Configure AWS credentials
        if: needs.app-image-build-required.outputs.app_image_build_required == 'true' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.app-image-build-required.outputs.app_image_build_required == 'true' && github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up Docker Buildx
        if: needs.app-image-build-required.outputs.app_image_build_required == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        if: needs.app-image-build-required.outputs.app_image_build_required == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        # Cache hygiene: CACHE_SCOPE is the single source of truth that both
        # cache-from and cache-to consume below, so the read scope can never
        # drift from the write scope. The scope is keyed on a hash of every
        # go.mod/go.sum, so it rotates when a dependency (or the `go` directive)
        # changes and a bump lands on a fresh, empty scope that recompiles from
        # source. Do NOT re-add a bare `scope=<image>` cache-from fallback:
        # cache-to never writes it, so it could only ever serve some other,
        # unrelated scope's layers. Tradeoff: the first build after a dep bump is
        # fully cold (no base-layer reuse) — acceptable for reproducibility.
        env:
          CACHE_SCOPE: ${{ matrix.image }}-deps-${{ hashFiles('nhp/go.mod', 'nhp/go.sum', 'internalauth/go.mod', 'endpoints/go.mod', 'endpoints/go.sum', 'examples/server_plugin/go.mod', 'examples/server_plugin/go.sum') }}
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, matrix.repo, needs.setup.outputs.image_tag) || format('local/{0}:{1}', matrix.repo, needs.setup.outputs.image_tag) }}
            ${{ steps.login-ecr.outputs.registry && format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, matrix.repo, needs.setup.outputs.environment) || format('local/{0}:{1}', matrix.repo, needs.setup.outputs.environment) }}
            ${{ steps.login-ecr.outputs.registry && format('{0}/{1}:latest', steps.login-ecr.outputs.registry, matrix.repo) || format('local/{0}:latest', matrix.repo) }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          secrets: |
            github_token=${{ secrets.PLUGIN_REPO_TOKEN }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Set image name for scanning
        if: needs.app-image-build-required.outputs.app_image_build_required == 'true'
        id: image
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG="${{ needs.setup.outputs.image_tag }}"
          if [[ -n "$ECR_REGISTRY" ]]; then
            echo "name=$ECR_REGISTRY/${{ matrix.repo }}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=local/${{ matrix.repo }}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          fi

      # SBOM (#1333). Generated BEFORE the Trivy scan so it is produced on
      # every build — including a PR whose image has HIGH/CRITICAL findings,
      # where the scan fails the job but the SBOM is exactly what triage needs.
      # Runs off the same local image Trivy scans (steps.image.outputs.name
      # resolves to local/<repo>:<tag> on PRs, ECR registry empty), so the
      # generation path is exercised on every app-code PR — not just post-merge.
      # On main the ref is the ECR tag, but syft still reads it from the local
      # daemon because the build step uses `load: true`; if that ever becomes
      # `push: true`/no-load, syft would pull from the registry instead.
      # continue-on-error keeps it non-blocking: a syft failure must never break
      # build -> scan -> push. The registry attach (by digest) happens post-push.
      - name: Generate SBOM
        id: sbom
        if: needs.app-image-build-required.outputs.app_image_build_required == 'true'
        continue-on-error: true
        # renovate: datasource=github-releases depName=anchore/sbom-action
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.name }}
          format: spdx-json
          output-file: '${{ matrix.image }}-sbom.spdx.json'
          # We upload the artifact ourselves (next step) for a stable,
          # per-matrix-leg name; the action's own uploader is redundant here.
          upload-artifact: false

      # PRIMARY, unconditional retrieval path: the SBOM is always available as
      # a workflow-run artifact (PRs and pushes), independent of whether ECR
      # supports the OCI 1.1 referrers API. always() so a later scan failure
      # (which fails the job) still publishes the SBOM. Retrieval is documented
      # in docs/SECURITY.md.
      - name: Upload SBOM artifact
        if: always() && needs.app-image-build-required.outputs.app_image_build_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: '${{ matrix.image }}-sbom.spdx.json'
          retention-days: 30
          if-no-files-found: warn

      - name: Scan image
        id: trivy
        if: needs.app-image-build-required.outputs.app_image_build_required == 'true'
        # renovate: datasource=github-releases depName=aquasecurity/trivy-action
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}
          format: 'sarif'
          output: '${{ matrix.image }}-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: '.trivyignore'
          # Required: SARIF includes all severities by default, causing exit-code
          # to trigger on LOW findings. This limits SARIF to match severity filter.
          limit-severities-for-sarif: 'true'

      - name: Show scan failures
        if: failure() && steps.trivy.outcome == 'failure'
        run: |
          echo "::error::Trivy found HIGH/CRITICAL vulnerabilities not in .trivyignore"
          echo ""
          SARIF="${{ matrix.image }}-trivy-results.sarif"
          if [[ ! -f "$SARIF" ]]; then
            echo "SARIF file not found"
            exit 0
          fi

          # Count vulnerabilities by severity
          HIGH_COUNT=$(jq -r '[.runs[0].tool.driver.rules[]? | select(.properties.tags[-1]? == "HIGH")] | length' "$SARIF" 2>/dev/null || echo 0)
          CRIT_COUNT=$(jq -r '[.runs[0].tool.driver.rules[]? | select(.properties.tags[-1]? == "CRITICAL")] | length' "$SARIF" 2>/dev/null || echo 0)
          echo "=== Summary: ${CRIT_COUNT} CRITICAL, ${HIGH_COUNT} HIGH ==="
          echo ""

          echo "=== Vulnerabilities Found ==="
          # Extract CVE details: id, severity, package (from help.text), description, and link
          jq -r '.runs[0].tool.driver.rules[]? |
            "• \(.id // "unknown") [\(.properties.tags[-1]? // "?")] (\((.help.text? | capture("Package: (?<pkg>[^\\n]+)").pkg) // "unknown"))
              \(.shortDescription.text? // "No description")
              \(.helpUri? // "")"' "$SARIF" 2>/dev/null || echo "Could not parse SARIF"
          echo ""
          echo "=== To Fix ==="
          echo "Add unpatched CVEs to .trivyignore with a comment:"
          echo "  # package - severity, waiting for patch"
          echo "  # https://avd.aquasec.com/nvd/CVE-XXXX-XXXXX"
          echo "  CVE-XXXX-XXXXX"

      - name: Upload scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.app-image-build-required.outputs.app_image_build_required == 'true'
        with:
          name: trivy-results-${{ matrix.image }}
          path: '${{ matrix.image }}-trivy-results.sarif'
          retention-days: 7

      - name: Push to ECR
        if: needs.app-image-build-required.outputs.app_image_build_required == 'true' && github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENV_TAG: ${{ needs.setup.outputs.environment }}
        run: |
          docker push "$ECR_REGISTRY/${{ matrix.repo }}:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/${{ matrix.repo }}:$ENV_TAG"
          docker push "$ECR_REGISTRY/${{ matrix.repo }}:latest"
          echo "::notice::Image pushed: $ECR_REGISTRY/${{ matrix.repo }}:$IMAGE_TAG"

      # Resolve the manifest digest of the just-pushed image. All three tags
      # (sha, env, latest) push the same content, so they share one digest; we
      # read it from the image's RepoDigests entry and strip everything up to
      # and including '@' to get the bare sha256:... value. The attest steps
      # below are keyed on the digest, not a mutable tag, so the attestation
      # binds to immutable bytes. Main-only (gated like the push).
      # continue-on-error keeps this step from ever reddening the build *after*
      # a successful push. The `{{range .RepoDigests}}` form is out-of-range-safe
      # (empty RepoDigests -> empty output, no index error under the default
      # `bash -e -o pipefail` shell), and grepping for this repo's own
      # registry/repo prefix pins the digest to our image instead of assuming
      # the first RepoDigests entry is ours — so a same-content image the daemon
      # happens to hold under another repo name can't shadow it. `|| true` keeps the pipe graceful on
      # no-match; an empty digest output makes the attest steps below skip via
      # their `steps.digest.outputs.digest != ''` gate.
      - name: Capture pushed image digest
        id: digest
        if: needs.app-image-build-required.outputs.app_image_build_required == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          IMAGE_REPO: ${{ matrix.repo }}
        run: |
          REF="$ECR_REGISTRY/$IMAGE_REPO:$IMAGE_TAG"
          DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$REF" \
            | grep -F -m1 -- "$ECR_REGISTRY/$IMAGE_REPO@" | sed 's/.*@//' || true)
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::warning::Could not resolve a sha256 digest for $REF (got '${DIGEST:-<empty>}'); skipping attestations"
            DIGEST=""
          else
            echo "::notice::Resolved digest for $IMAGE_REPO: $DIGEST"
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # SLSA build provenance (#1335): keyless Sigstore attestation binding
      # image digest -> workflow run -> commit SHA. push-to-registry stores it
      # as an OCI referrer on the ECR image. continue-on-error so a registry
      # that lacks the referrers API (or a transient failure) never blocks the
      # build; the provenance is also retained in the GitHub attestation store
      # regardless. Deploy-time VERIFICATION of this attestation is the
      # follow-up tracked in #1334 (it lands in the deploy/boot path, which
      # needs live sandbox validation).
      # Gated solely on a captured digest: the "Capture pushed image digest"
      # step is the single gate for "an image was actually pushed" (it carries
      # the app-changed + main-only conditions), and a skipped or empty-result
      # digest step leaves this output empty — so this one check subsumes them.
      - name: Attest build provenance (SLSA)
        id: provenance
        if: steps.digest.outputs.digest != ''
        continue-on-error: true
        # renovate: datasource=github-releases depName=actions/attest-build-provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # SBOM attestation (#1333): attach the SPDX SBOM generated above to the
      # pushed image as a signed OCI referrer. Best-effort/non-blocking; the
      # workflow-artifact path above remains the guaranteed retrieval route.
      - name: Attest SBOM
        id: attest-sbom
        if: steps.digest.outputs.digest != '' && steps.sbom.outcome == 'success'
        continue-on-error: true
        # renovate: datasource=github-releases depName=actions/attest-sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: '${{ matrix.image }}-sbom.spdx.json'
          push-to-registry: true

      # Observability for the post-merge-only, continue-on-error attest path.
      # These steps can't be exercised pre-merge (#1334), so a bad action pin,
      # a missing permission, or an ECR referrer rejection would otherwise
      # produce zero attestations behind a green check with no signal. Surface
      # the per-image outcome in the run summary and ::warning:: loudly when an
      # attestation was expected (digest resolved) but did not get produced.
      - name: Attestation summary
        if: always() && needs.app-image-build-required.outputs.app_image_build_required == 'true' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          SBOM_ATTEST_OUTCOME: ${{ steps.attest-sbom.outcome }}
          SBOM_GEN_OUTCOME: ${{ steps.sbom.outcome }}
        run: |
          {
            echo "### Supply-chain attestations — $IMAGE"
            if [[ -z "$DIGEST" ]]; then
              echo "- :warning: image digest unresolved → provenance + SBOM attestation **SKIPPED**"
            else
              echo "- digest: \`$DIGEST\`"
              echo "- SLSA provenance: \`${PROVENANCE_OUTCOME:-skipped}\`"
              echo "- SBOM attestation: \`${SBOM_ATTEST_OUTCOME:-skipped}\` (SBOM generation: \`${SBOM_GEN_OUTCOME:-skipped}\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Loud signal when attestation was expected but failed — continue-on-error
          # on the attest steps would otherwise hide it behind a green check.
          if [[ -z "$DIGEST" ]]; then
            echo "::warning::No image digest resolved for $IMAGE — NO attestations produced for this build (non-blocking; deploy-time enforcement tracked in #1334)."
          else
            if [[ "$PROVENANCE_OUTCOME" == "failure" ]]; then
              echo "::warning::SLSA provenance attestation FAILED for $IMAGE ($DIGEST) — image shipped without provenance (non-blocking; see #1334)."
            fi
            # SBOM generation failing gates off the attestation (which then
            # resolves to 'skipped', not 'failure'), so report the root cause
            # here rather than letting the missing SBOM pass silently.
            if [[ "$SBOM_GEN_OUTCOME" == "failure" ]]; then
              echo "::warning::SBOM generation FAILED for $IMAGE — no SBOM artifact or attestation produced for this build (non-blocking)."
            elif [[ "$SBOM_ATTEST_OUTCOME" == "failure" ]]; then
              echo "::warning::SBOM attestation FAILED for $IMAGE ($DIGEST) — SBOM not attached as an OCI referrer (workflow artifact still uploaded; non-blocking)."
            fi
          fi

      # The builder used to also write /${env}/nhp/<component>/image-tag here.
      # That write was wrong on two independent axes:
      #
      #   1. CROSS-RUN RACE. The two matrix entries (server, ac) write
      #      different slots, but a *concurrent* run's builder writing
      #      its slots while *this* run's dispatcher reads them produced
      #      a torn read — run 26130926188's ac-matrix updated the ac
      #      slot at 23:18:25 between run 26130904414's dispatcher SSM
      #      read at 23:18:21 and the server-matrix update at 23:18:55,
      #      so the dispatcher saw server=old, ac=new and bailed
      #      (see run 26130904414, 2026-05-19).
      #
      #   2. LOGICALLY WRONG WHEN active=blue. It wrote the blue slot
      #      regardless of which colour was active, so a build during
      #      active=blue could overwrite the active tag with a SHA that
      #      had not yet been deployed via blue/green — a blue ASG
      #      scaling up at that moment would pull the new image from
      #      ECR and run code that had not been validated.
      #
      # The deployer (blue-green-deploy.yml's "Update Standby Image Tag")
      # is the sole writer of the {blue,green}-image-tag slots now; the
      # builder's job ends at "image pushed to ECR".

  # ============================================================================
  # TERRAFORM VALIDATE (PR only - fast feedback)
  # ============================================================================
  terraform-validate:
    name: Terraform Validate (PR)
    # Skip for Dependabot PRs and when no terraform files changed.
    #
    # SECURITY (#1121): this job runs WITHOUT AWS credentials. PR authors
    # can run arbitrary code during `terraform plan` (external data sources,
    # provider hooks) — so minting short-lived STS creds on every PR handed
    # any contributor a one-step IAM privesc against the sandbox account.
    # The job now does lint-only checks (fmt, init -backend=false, validate,
    # static lockstep guards) that do not require AWS at all. Plan output
    # with real state is handled by terraform-plan-pr.yml, which intentionally
    # re-opens that PR-time path for same-repo branches only. It uses a
    # dedicated read-only sandbox role instead of the apply role, but that role
    # can still read state/SSM/KMS-decrypted material and the workflow fetches
    # Auth0 Terraform credentials; enabling it requires the rollout-ledger
    # security sign-off for the PR plan gate.
    # No dependabot filter: this job mints no AWS creds, so Dependabot's
    # restricted token scope is sufficient — let dependabot PRs that touch
    # terraform get the same fmt/validate coverage as human-authored PRs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Validate both envs so env-specific config (prod-only overrides,
      # provider version pins in terraform/environments/prod/...) catches
      # a typo at PR time instead of at apply-on-merge.
      matrix:
        environment: [sandbox, prod]
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # fetch-depth: 2 is enough: the "Check for Terraform changes" step
        # below uses `git diff BASE_SHA HEAD_SHA`. For a PR branch, HEAD_SHA
        # is the tip and BASE_SHA is reachable via the merge-base fetched
        # explicitly by the step.
        with:
          fetch-depth: 2

      - name: Check for Terraform changes
        id: changes
        run: |
          # Get the base branch
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Ensure BASE_SHA is present locally (checkout@v6 with fetch-depth: 2
          # only gives us HEAD + parent).
          git fetch --depth 1 origin "$BASE_SHA" >/dev/null 2>&1 || true

          # Check if any terraform files changed
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^terraform/'; then
            echo "terraform_changed=true" >> "$GITHUB_OUTPUT"
            echo "Terraform files changed - running validation"
          else
            echo "terraform_changed=false" >> "$GITHUB_OUTPUT"
            echo "No terraform files changed - skipping validation"
          fi

      - name: Setup Terraform
        if: steps.changes.outputs.terraform_changed == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        if: steps.changes.outputs.terraform_changed == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Check for stale import blocks
        # Run on the sandbox leg only; this check scans the whole
        # terraform/environments/ tree and has no per-env dependency.
        if: steps.changes.outputs.terraform_changed == 'true' && matrix.environment == 'sandbox'
        run: |
          # Import blocks are declarative and re-evaluate on every plan/apply.
          # They should be removed after the initial import succeeds, otherwise
          # they cause state drift and unexpected resource modifications.
          IMPORT_FILES=$(grep -rl '^import {' terraform/environments/ 2>/dev/null || true)
          if [[ -n "$IMPORT_FILES" ]]; then
            echo "::warning::Stale Terraform import blocks detected. Import blocks re-run on every apply and should be removed after successful import."
            echo ""
            echo "Files with import blocks:"
            echo "$IMPORT_FILES"
            echo ""
            echo "If these imports have already been applied, delete the import blocks to prevent state drift."
          fi

      - name: Terraform Format Check
        # fmt is repo-wide; run it once on the sandbox leg to avoid
        # double-failures on the same typo.
        if: steps.changes.outputs.terraform_changed == 'true' && matrix.environment == 'sandbox'
        working-directory: terraform/environments/sandbox
        run: terraform fmt -check -recursive ../../

      - name: Check AC boot heredoc command-substitution guard
        # AC boot-file heredocs are rendered by bash during user-data boot.
        # Unquoted delimiters still evaluate markdown-style backticks / $()
        # in generated comments, which can hang cloud-init before services start.
        if: steps.changes.outputs.terraform_changed == 'true' && matrix.environment == 'sandbox'
        run: |
          bash tests/scripts/check-ac-user-data-heredoc-backticks_test.sh
          bash scripts/check-ac-user-data-heredoc-backticks.sh

      - name: Terraform Init (no backend)
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/environments/${{ matrix.environment }}
        # -backend=false: skip S3/DynamoDB state backend setup (no AWS creds
        # available in this job by design). Providers still download so
        # `terraform validate` can exercise provider-side schema checks.
        # The Cache Terraform plugins step above creates the plugin-cache
        # dir on restore-miss; TF_PLUGIN_CACHE_DIR lets terraform reuse it.
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
        run: terraform init -backend=false

      - name: Terraform Validate
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Terraform Control Init (no backend)
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/control/environments/${{ matrix.environment }}
        run: |
          export TF_PLUGIN_CACHE_DIR="${HOME}/.terraform.d/plugin-cache"
          terraform init -backend=false

      - name: Terraform Control Validate
        if: steps.changes.outputs.terraform_changed == 'true'
        working-directory: terraform/control/environments/${{ matrix.environment }}
        run: terraform validate

      - name: Test dark Connector Authority foundation
        if: steps.changes.outputs.terraform_changed == 'true' && matrix.environment == 'sandbox'
        run: |
          shellcheck \
            scripts/check-connector-authority-foundation.sh \
            scripts/check-control-vpc-cidr-overlap.sh \
            tests/fixtures/control-vpc-cidr-overlap/aws \
            tests/scripts/check-connector-authority-foundation_test.sh \
            tests/scripts/check-control-vpc-cidr-overlap_test.sh
          tests/scripts/check-connector-authority-foundation_test.sh
          tests/scripts/check-control-vpc-cidr-overlap_test.sh
          scripts/check-connector-authority-foundation.sh
          terraform -chdir=terraform/modules/connector-authority-foundation init -backend=false
          terraform -chdir=terraform/modules/connector-authority-foundation test

      - name: Test actual relay TOML Terraform rendering
        if: steps.changes.outputs.terraform_changed == 'true' && matrix.environment == 'sandbox'
        working-directory: tests/terraform/relay-toml-render
        run: |
          terraform init -backend=false
          terraform test

      - name: Test relay DMZ Terraform contract
        if: steps.changes.outputs.terraform_changed == 'true' && matrix.environment == 'sandbox'
        working-directory: terraform/modules/relay-network
        run: |
          terraform init -backend=false
          terraform test

      - name: Check qurl SLO lockstep (variables.tf vs dashboard JSON)
        # Repo-wide invariant check; run once on the sandbox leg so a
        # mismatch fails once, not twice.
        if: steps.changes.outputs.terraform_changed == 'true' && matrix.environment == 'sandbox'
        # Asserts that the qurl_alerts_slo_target_percent default in
        # terraform/variables.tf matches the slo_target template variable
        # in terraform/modules/grafana-dashboards/dashboards/qurl-operations.json.
        # The two values feed the same burn-rate computation; a typo in
        # either silently shifts the burn-rate denominator by orders of
        # magnitude. The contract used to be enforced by a comment in
        # alerts.tf — same failure mode as the 2026-03-24 GSI incident.
        run: ./.github/scripts/check-qurl-slo-lockstep.sh

      - name: Check nhp_server_internal_url validation drift
        # Terraform cannot share this validation across root and module
        # boundaries, so keep the mirrored copies byte-identical at PR time.
        # Intentionally not gated on terraform_changed: this invariant must
        # hold on every PR, and the check is cheap. Content-only check; one
        # matrix entry is enough.
        if: matrix.environment == 'sandbox'
        run: |
          ./tests/lints/nhp-server-internal-url-validation-drift/run-fixtures.sh
          ./scripts/check-nhp-server-internal-url-validation-drift.sh

      - name: Skip Notice
        if: steps.changes.outputs.terraform_changed != 'true'
        run: |
          echo "## Terraform Validation Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "No terraform files changed in this PR." >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # TERRAFORM PROD-DRIFT LINT - Static fences for #1316 / #1323 (#1324)
  #
  # No matrix — the lints walk the same terraform tree in every environment
  # so running once is sufficient. Lifted out of `terraform-validate` so a
  # future change to that job's matrix can't silently disable the fences.
  # No AWS credentials at any point — preserves the #1121 PR-time privesc
  # gate. See docs/design/TERRAFORM_PROD_DRIFT_DETECTOR.md.
  # ============================================================================
  terraform-prod-drift-lint:
    name: Terraform Prod-Drift Lint (PR)
    # PR-only by design: main is branch-protected (CLAUDE.md "never push
    # directly to main") so every code path lands on main reaches a PR
    # first and the lint runs there. Admin force-merges that bypass PR
    # are NOT covered — if that posture changes, drop the `if:` so the
    # lint also runs on push to catch admin-bypass drift. (cr round 10.)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          # Cache the pip wheel between runs — install drops from a few
          # seconds to <1s once the cache is warm.
          cache: pip
          cache-dependency-path: .github/scripts/terraform-prod-drift-requirements.txt

      - name: Install python-hcl2
        run: python3 -m pip install -r .github/scripts/terraform-prod-drift-requirements.txt

      - name: Shellcheck the fixture runners
        # validate-workflows.yml's actionlint -shellcheck only covers
        # .github/workflows/*.yml. The runner scripts live under tests/;
        # cover them explicitly here so a typo lands at PR time, not later.
        run: |
          shellcheck ./tests/lints/ac-apt-guard/run-fixtures.sh
          shellcheck ./tests/lints/terraform-prod-drift/run-fixtures.sh
          shellcheck ./tests/lints/terraform-tag-charset/run-fixtures.sh
          shellcheck ./tests/lints/asg-capacity-deficit-alarms/run-fixtures.sh
          shellcheck ./tests/lints/cis-metric-filter-patterns/run-fixtures.sh

      - name: Run AC apt guard fixture suite
        # Regression fence for the AC user_data no-runtime-apt invariant in
        # terraform/modules/ac/main.tf. Runs unconditionally so regex drift
        # cannot hide until the next AC boot-path incident.
        run: ./tests/lints/ac-apt-guard/run-fixtures.sh

      - name: Run terraform-prod-drift fixture suite
        # Regression fences for #1316 (resource-policy Condition denylist)
        # and #1323 (data-source IAM coverage). Runs unconditionally so a
        # PR that weakens the lint scripts or fixtures without touching
        # terraform/ can't slip past.
        run: ./tests/lints/terraform-prod-drift/run-fixtures.sh

      - name: Check terraform IAM coverage (#1323 regression fence)
        run: python3 ./.github/scripts/check-terraform-iam-coverage.py

      - name: Run terraform IAM coverage unit tests (#2996 resource internals)
        # Covers internals the exit-code fixtures can't reach: the body-aware
        # RESOURCE_ACTIONS callable dispatch, the map-overlap guard, and the
        # canonical role's managed-policy attachment quota calculation.
        run: python3 ./tests/scripts/test_check_terraform_iam_coverage.py

      - name: Check terraform policy-condition denylist (#1316 regression fence)
        run: python3 ./.github/scripts/check-terraform-policy-conditions.py

      - name: Check Connector control table schemas
        # The authority owns global copies of four established qURL identity
        # tables. Compare their exact keys, attributes, GSIs, and TTL shape to
        # the canonical cell module so either side cannot drift silently.
        run: python3 ./.github/scripts/check-connector-control-table-schemas.py

      - name: Run Connector control table schema comparator unit tests
        run: python3 ./tests/scripts/test_check_connector_control_table_schemas.py

      - name: Run Terraform Plan PR read-only policy fixture tests
        run: python3 ./tests/scripts/test_check_terraform_plan_pr_policy_readonly.py

      - name: Check AC TCP target-group transport contract
        run: python3 ./tests/scripts/test_ac_tcp_target_group_contract.py

      - name: Check Terraform Plan PR read-only policy
        run: python3 ./.github/scripts/check-terraform-plan-pr-policy-readonly.py

      - name: Run terraform-tag-charset fixture suite
        # Regression fence for PR #1914 / #1915 — `qurl_agent_keys`
        # shipped a tag value containing chars outside AWS's allowed
        # set, silently passing terraform validate and failing only at
        # CreateTable time on the sandbox apply.
        run: ./tests/lints/terraform-tag-charset/run-fixtures.sh

      - name: Check terraform tag charset (#1915 regression fence)
        run: python3 ./.github/scripts/check-terraform-tag-charset.py terraform

      - name: Run ASG capacity-deficit alarm fixture suite
        # Fixtures first so a checker regression surfaces before it can
        # mask a real drift back to the non-published #2041 metric.
        run: ./tests/lints/asg-capacity-deficit-alarms/run-fixtures.sh

      - name: Check ASG capacity-deficit alarm shape (#2041 regression fence)
        run: python3 ./.github/scripts/check-asg-capacity-deficit-alarms.py

      - name: Run cis-metric-filter-patterns fixture suite
        # Fixtures first (a checker regression surfaces before the real
        # check), then the production freeze check below.
        run: ./tests/lints/cis-metric-filter-patterns/run-fixtures.sh

      - name: Check CIS metric-filter patterns are frozen (#1140)
        # Security Hub matches the CIS v1.4.0 CloudWatch.N filter patterns
        # verbatim; an edit to cloudtrail_metric_filters.tf that diverges
        # from the golden silently FAILS the control ~18h after the prod
        # apply (sandbox has no trail). Catch it on the PR instead.
        run: python3 ./.github/scripts/check-cis-metric-filter-patterns.py

      - name: Run observability parity fixture tests
        # Regression fixtures for #1141's prod-vs-sandbox observability guard.
        # They run before the real tree scan so extractor drift fails against
        # synthetic inputs with known answers. This prod-drift job has no
        # environment matrix, so the env-agnostic scan runs once per PR.
        run: python3 ./tests/scripts/test_observability_parity.py

      - name: Check prod/sandbox observability parity (#1141)
        # Prod and sandbox share the root monitoring module, but env-wrapper
        # pass-through drift can still turn tfvars values into silent no-ops.
        # Keep the stderr log group, ServerPanic filter, restart/registration
        # alarms, AC registration-stale alarm, and alert routing wired in both.
        run: python3 ./scripts/check-observability-parity.py

  # ============================================================================
  # QURL CSP GATE DRIFT LINT (PR)
  # Static fence between the sandbox deploy gate's qurl.link CSP regex and the
  # smoke suite's post-deploy CSP regex. The deploy gate absorbs CloudFront
  # response-header-policy propagation; the smoke suite verifies the same
  # contract on the wire.
  # ============================================================================
  qurl-csp-gate-drift-lint:
    name: qURL CSP Gate Drift Lint (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Fetch legacy qurl.link CSP source
        run: git fetch --no-tags --depth=1 origin e908489ee8d90a16075cd722a81191d7c23a1954

      - name: Shellcheck the CSP drift script and fixture runner
        run: |
          shellcheck ./scripts/check-qurl-csp-gate-drift.sh
          shellcheck ./scripts/parse-qurl-csp-probe-output.sh
          shellcheck ./tests/lints/qurl-csp-gate-drift/run-fixtures.sh

      - name: Run qurl.link CSP gate drift fixture suite
        run: ./tests/lints/qurl-csp-gate-drift/run-fixtures.sh

      - name: Check qurl.link CSP gate drift
        run: ./scripts/check-qurl-csp-gate-drift.sh

  # ============================================================================
  # QURL LINK SOCIAL CARD LINT (PR)
  # Static PR-time fence for the generated qurl.link social preview PNG. The
  # smoke suite verifies the deployed origin; this catches a committed image
  # that lost the LayerV wordmark before it reaches CloudFront.
  # ============================================================================
  qurl-link-og-image-lint:
    name: qURL Link Social Card Lint (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Shellcheck qURL link social card lint
        run: shellcheck ./scripts/check-qurl-link-og-image.sh

      - name: Check qURL link social card PNG
        run: ./scripts/check-qurl-link-og-image.sh

  # ============================================================================
  # TERRAFORM VALIDATE (main) - Lightweight validation before deploy
  # No terraform plan here — deploy-sandbox-infra runs plan+apply in one job,
  # saving 1 M2M token per merge (the old plan artifact was never consumed).
  #
  # Note: this job runs `validate` + `fmt -check` only, so plan-time
  # preconditions (e.g. the `^v0\\.0\\.0-bootstrap` reject at
  # terraform/main.tf:1051) are NOT evaluated here. If anyone ever extends
  # this job to run `terraform plan`, also port the
  # `Resolve qurl-reverse-tunnel-server Image Tag` step from
  # `deploy-sandbox-infra` so the precondition has a real tag to evaluate
  # against. See PR #1551.
  # ============================================================================
  terraform-plan:
    name: Terraform Pre-Deploy Checks (${{ matrix.environment }})
    needs: [setup, terraform-validate, packer-build]  # Validate and Packer must pass (or be skipped) before plan
    if: |
      always() &&
      (needs.terraform-validate.result == 'success' || needs.terraform-validate.result == 'skipped') &&
      (needs.packer-build.result == 'success' || needs.packer-build.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.environment)) || fromJSON('["sandbox"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      # Build Lambda packages before assuming AWS credentials so unit tests
      # cannot publish metrics to the active account if a mock regresses.
      - name: Build Lambda Packages
        uses: ./.github/actions/build-lambda-packages

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          # -reconfigure: backend.tf gained kms_key_id (#1128) — harmless no-op on
          # this fresh CI checkout, required for a local stale .terraform/. State
          # does not move (not -migrate-state). See tfstate-kms-migration runbook.
          terraform init -reconfigure

      - name: Check for stale import blocks
        run: |
          IMPORT_FILES=$(grep -rl '^import {' terraform/environments/ 2>/dev/null || true)
          if [[ -n "$IMPORT_FILES" ]]; then
            echo "::warning::Stale Terraform import blocks detected. Import blocks re-run on every apply and should be removed after successful import."
            echo ""
            echo "Files with import blocks:"
            echo "$IMPORT_FILES"
          fi

      - name: Terraform Format Check
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive ../../

      - name: Terraform Validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  # ============================================================================
  # DEPLOY SANDBOX - Split into parallel jobs for faster deploys
  # ============================================================================
  # Job dependency graph:
  #   deploy-sandbox-infra → deploy-sandbox-blue-green → deploy-sandbox-validate
  # ============================================================================

  deploy-sandbox-infra:
    name: Deploy Sandbox - Infrastructure
    needs: [changes, setup, sandbox-environment-guard, sandbox-app-image-drift, app-image-build-required, test, test-lambdas, build, terraform-plan]
    if: |
      always() &&
      (needs.sandbox-environment-guard.result == 'success' || needs.sandbox-environment-guard.result == 'skipped') &&
      (needs.sandbox-app-image-drift.result == 'success' || needs.sandbox-app-image-drift.result == 'skipped') &&
      needs.app-image-build-required.result == 'success' &&
      (needs.app-image-build-required.outputs.app_image_build_required == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.test-lambdas.result == 'success' || needs.test-lambdas.result == 'skipped') &&
      needs.build.result == 'success' &&
      needs.terraform-plan.result == 'success' &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true' && github.event.inputs.environment == 'sandbox')
      )
    runs-on: ubuntu-latest
    environment: sandbox
    # Includes rare ~15m SG recovery, the bounded 5m structural convergence
    # gate, and a final post-apply DMZ-boundary idempotency proof before outputs
    # unblock.
    timeout-minutes: 55
    concurrency:
      group: deploy-sandbox-infra
      cancel-in-progress: false  # Let current TF apply finish, queue the next
    outputs:
      server_asg: ${{ steps.outputs.outputs.server_asg }}
      ac_asg: ${{ steps.outputs.outputs.ac_asg }}
      nlb_dns: ${{ steps.outputs.outputs.nlb_dns }}
      etcd_endpoint: ${{ steps.outputs.outputs.etcd_endpoint }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 300  # Relay SG recovery scans up to 200 commit tags; keep headroom without a full clone.

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      # Build Lambda packages before assuming AWS credentials so unit tests
      # cannot publish metrics to the active account if a mock regresses.
      - name: Build Lambda Packages
        uses: ./.github/actions/build-lambda-packages

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/sandbox
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          # -reconfigure: backend.tf gained kms_key_id (#1128) — harmless no-op on
          # this fresh CI checkout, required for a local stale .terraform/. State
          # does not move (not -migrate-state). See tfstate-kms-migration runbook.
          terraform init -reconfigure

      - name: Fetch Auth0 Token
        id: auth0
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: ./.github/scripts/fetch-auth0-token.sh terraform/environments/sandbox/terraform.tfvars sandbox

      # Resolve the qurl-reverse-tunnel-server image tag from SSM so terraform
      # plan/apply picks up the live tag the release pipeline (separate repo)
      # most recently published. The SSM parameter is created by Terraform and
      # updated out-of-band by the qurl-reverse-tunnel-server repo's CI
      # (`/sandbox/nhp/reverse-tunnel-server/image-tag`,
      # `lifecycle.ignore_changes = [value]`).
      #
      # Fallback: this step does NOT export `TF_VAR_frps_image_tag` when
      # the parameter does not exist yet (greenfield env, or
      # `deploy_frps = false` and the resource was never created), or when
      # it still holds the bootstrap placeholder. In both cases terraform
      # falls back to the tfvars pin if `terraform/environments/sandbox/
      # terraform.tfvars` sets `frps_image_tag`, or otherwise to the
      # `var.frps_image_tag` default (`v0.0.0-bootstrap`, which the
      # precondition then rejects loudly when `deploy_frps = true`).
      # Setting `TF_VAR_frps_image_tag=""` would override tfvars with an
      # empty string and silently bypass the bootstrap-placeholder
      # precondition.
      #
      # Sandbox-only: this step lives in `deploy-sandbox-infra`. Prod's
      # `TF_VAR_frps_image_tag` always comes from
      # `terraform/environments/prod/terraform.tfvars`; the prod release
      # pipeline does not auto-resolve from SSM (intentional — prod has
      # stricter change-control). Parity tracked in #1561.
      #
      # The plan-time precondition at terraform/main.tf rejects the bootstrap
      # placeholder when `deploy_frps = true`, so pinning a real tag in
      # tfvars is what unblocks first apply; this step just keeps subsequent
      # applies tracking the live SSM value without a code change.
      #
      # First-apply runbook (when an operator flips `deploy_frps = true`):
      # 1. Pin a real `frps_image_tag = "<tag>"` in
      #    `terraform/environments/sandbox/terraform.tfvars`.
      # 2. Apply. Terraform writes the SSM parameter as a side effect.
      # 3. Subsequent applies: this step takes over from tfvars.
      # See #1561 for prod-side parity discussion.
      #
      # Error handling mirrors the AMI-check step earlier in this file: we
      # capture stderr and distinguish `ParameterNotFound` (expected
      # greenfield case) from real failures (IAM denied, expired creds,
      # region misconfigured, throttling). Real failures `exit 1` so a CI
      # misconfiguration cannot silently fall through to "tfvars wins."
      #
      # Blast radius of `exit 1` here: blocks the entire `deploy-sandbox-infra`
      # job, not just the qurl-reverse-tunnel-server module. This is intentional — silent
      # drift on a cross-repo contract surface is worse than a loud failure
      # that pages whoever pushed the bad SSM value. If the
      # qurl-reverse-tunnel-server release pipeline writes a malformed tag,
      # it should fail loudly here, not land in apply.
      - name: Resolve qurl-reverse-tunnel-server Image Tag
        run: |
          set -euo pipefail

          SSM_PARAM="/sandbox/nhp/reverse-tunnel-server/image-tag"
          SSM_ERR_FILE="/tmp/frps-ssm-err"

          # Belts-and-suspenders: bash's `2>"$SSM_ERR_FILE"` already
          # truncates the file on open, so the AWS call itself can't be
          # confused by stale content. This `rm -f` covers the narrower
          # case where someone refactors the script to read or grep the
          # file before the AWS call runs — a no-op today on GitHub-hosted
          # ephemeral runners, cheap insurance otherwise. The AMI-check
          # step earlier in this file does NOT do this pre-clear yet —
          # asymmetry tracked in #1575 (apply same hygiene + tag-shape
          # validation symmetrically across both SSM-read steps).
          rm -f "$SSM_ERR_FILE"

          # Docker/OCI reference grammar restricts tags to
          # `[A-Za-z0-9_][A-Za-z0-9._-]{0,127}` — leading char restricted,
          # 1–128 chars total. Source: distribution/reference/regexp.go in
          # the Docker distribution project (TagRegexp).
          # We require this shape before writing to GITHUB_ENV so a future SSM
          # scribbler (manual edit, malformed release pipeline write) can't smuggle
          # newlines or shell metacharacters into the env file. Bootstrap placeholder
          # is rejected separately by the bootstrap-prefix branch in the
          # conditional below.
          TAG_RE='^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'

          # `--region "$AWS_REGION"` is explicit so the lookup is pinned to
          # the env's region even if a future workflow edit drops the
          # job-level AWS_REGION (the `aws-actions/configure-aws-credentials`
          # action already exports it from the role config; this just
          # belts-and-suspenders the dependency).
          if FRPS_TAG=$(aws ssm get-parameter \
              --region "$AWS_REGION" \
              --name "$SSM_PARAM" \
              --query "Parameter.Value" --output text 2>"$SSM_ERR_FILE"); then
            # `aws ... --output text` can render a missing scalar as "None".
            if [[ -z "$FRPS_TAG" || "$FRPS_TAG" == "None" ]]; then
              echo "::notice::SSM $SSM_PARAM returned empty/None; falling back to tfvars."
            elif [[ "$FRPS_TAG" =~ ^v0\.0\.0-bootstrap ]]; then
              echo "::notice::SSM $SSM_PARAM still holds bootstrap placeholder ($FRPS_TAG); falling back to tfvars."
            elif [[ ! "$FRPS_TAG" =~ $TAG_RE ]]; then
              echo "::error::SSM $SSM_PARAM holds a value that is not a valid Docker tag: $(printf %q "$FRPS_TAG")"
              exit 1
            else
              echo "::notice::Resolved qurl-reverse-tunnel-server image tag from SSM: $FRPS_TAG"
              echo "TF_VAR_frps_image_tag=$FRPS_TAG" >> "$GITHUB_ENV"
            fi
            # Success path complete — the rest of this script is the
            # unexpected-error path. Any future success-path steps must go
            # ABOVE this `exit 0`, not after it.
            exit 0
          fi

          if grep -q "ParameterNotFound" "$SSM_ERR_FILE"; then
            echo "::notice::SSM $SSM_PARAM not found (greenfield or deploy_frps=false); falling back to tfvars."
            exit 0
          fi

          echo "::error::Unexpected SSM error reading $SSM_PARAM:"
          cat "$SSM_ERR_FILE"
          exit 1

      # The `Resolve qurl-reverse-tunnel-server Image Tag` step above conditionally exports
      # TF_VAR_frps_image_tag to GITHUB_ENV; it is inherited by this step
      # automatically. When SSM has the bootstrap placeholder or no value,
      # it stays unset and tfvars wins. See that step for the contract.
      - name: Handle ASG Attachment Migrations and Taint Recovery
        working-directory: terraform/environments/sandbox
        env:
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          TF_VAR_ac_license_key: ${{ secrets.AC_LICENSE_KEY }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
          # Auth0 Terraform provider credentials
          TF_VAR_auth0_tf_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
          TF_VAR_auth0_tf_client_secret: ${{ secrets.AUTH0_CLIENT_SECRET }}
          TF_VAR_auth0_api_token: ${{ steps.auth0.outputs.auth0_token }}
          TF_VAR_image_tag: ${{ needs.setup.outputs.image_tag }}
        run: |
          set -euo pipefail

          # Clean up any stale plan files from previous failed runs
          rm -f tfplan plan.txt plan-show.txt plan-show.json plan-boundary-preflight.json

          preflight_relay_dmz_boundary() {
            # This must run before the recovery helper can call `terraform state
            # rm`, untaint, or refresh a relay ASG. The named final pre-apply
            # step repeats the same gate against the post-recovery artifact.
            terraform show -json tfplan > plan-boundary-preflight.json
            python3 ../../../.github/scripts/check-relay-dmz-plan.py \
              --require-pr0-applied \
              --require-dmz-boundary-noop \
              plan-boundary-preflight.json
          }

          plan_with_attachment_migration_guard() {
            local context="$1"
            local attachments
            local context_suffix=""

            if [[ -n "$context" ]]; then
              context_suffix=" ($context)"
            fi

            # When migrating from aws_autoscaling_attachment to inline
            # target_group_arns, Terraform's refresh timing can race:
            # 1. Refresh sees ASG has TG (from attachment) and matches inline config.
            # 2. No ASG diff is detected.
            # 3. Attachment destroy removes the TG from the ASG.
            # 4. Terraform thinks the ASG still has the TG.
            #
            # Fix: remove attachment resources from state before apply so Terraform
            # sees the actual ASG target_group_arns diff. Why plan twice? The first
            # plan detects attachments to remove; the second captures the ASG update
            # now visible after state removal. Use the same guard on post-recovery
            # re-plans so the rare relay SG recovery path preserves this migration
            # safety net too.
            if ! terraform plan -out=tfplan -no-color 2>&1 | tee plan.txt; then
              echo "::error::Terraform plan failed${context_suffix}. Manual intervention may be required."
              exit 1
            fi

            preflight_relay_dmz_boundary

            # Find any aws_autoscaling_attachment resources being destroyed.
            # Pattern matches both indexed (foo[0]) and non-indexed (foo) resources.
            attachments=$(grep -E "aws_autoscaling_attachment\.[^ ]+ will be destroyed" plan.txt | \
              sed 's/.*# //' | sed 's/ will be destroyed//' || true)

            # Warn if we found attachment references but failed to parse them
            # (format may have changed).
            if grep -q "aws_autoscaling_attachment" plan.txt && [[ -z "$attachments" ]]; then
              echo "::warning::Found aws_autoscaling_attachment in plan${context_suffix} but no destructions detected (this is normal if not migrating)"
            fi

            if [[ -n "$attachments" ]]; then
              echo "::warning::Detected ASG attachment migration${context_suffix} - removing from state to prevent race condition"
              for att in $attachments; do
                echo "Removing from state: $att"
                terraform state rm "$att" || true
              done

              # Re-plan after state removal to capture ASG updates.
              rm -f tfplan plan.txt
              if ! terraform plan -out=tfplan -no-color 2>&1 | tee plan.txt; then
                echo "::error::Re-plan failed after ASG attachment state removal${context_suffix}. Manual intervention may be required."
                exit 1
              fi
            fi
          }

          plan_with_attachment_migration_guard "initial plan"

          guard_internal_relay_migration() {
            # #2645 / #3123 migration gate: if this plan is the first apply that
            # creates the green internal relay TG, applying while server
            # active-color=green would leave the retained internal listener on
            # blue until a switch runs. Block that silent split before apply.
            ../../../.github/scripts/check-internal-relay-migration-active-color.sh sandbox plan-show.json
          }

          show_current_plan() {
            local context="$1"
            if ! terraform show -no-color tfplan > plan-show.txt; then
              echo "::error::terraform show tfplan failed${context}; cannot detect tainted ASGs"
              exit 1
            fi
            if ! terraform show -json tfplan > plan-show.json; then
              echo "::error::terraform show -json tfplan failed${context}; cannot inspect deposed relay SGs"
              exit 1
            fi
            guard_internal_relay_migration
          }

          # Handle ASGs left tainted by a prior partial-create failure.
          # The repo's static-named ASGs (server, AC, FRPS — see
          # `terraform/CLAUDE.md` ASG co-ownership rules) all set
          # `lifecycle.create_before_destroy = true`. Once tainted, the
          # planned replace cannot succeed under plan/apply alone: the
          # create-first step collides with the existing AWS resource's
          # static name (`AlreadyExists`), and `create_before_destroy`
          # blocks the destroy-first ordering that would otherwise work.
          # Untaint to recover the in-place reconciliation path.
          # Hard-fail rather than fall back to plan.txt: a silent fallback would
          # scan the rendered plan format, which is not the durable artifact the
          # tainted-ASG recovery path is meant to consume. The hard-fail is
          # genuinely load-bearing — `terraform show` can fail on corrupt
          # tfplan, disk full mid-write, or plan-format incompatibility
          # after a Terraform version bump.
          show_current_plan ""

          # Recover the partial state left by a relay node SG ForceNew replacement:
          # Terraform can create the replacement SG + launch template, then fail
          # deleting the deposed SG because existing relay instance ENIs still use
          # it. The normal deploy-sandbox-relay job would refresh those instances,
          # but it is downstream of this apply, so it never runs while the deposed
          # DeleteSecurityGroup is blocking apply. If this exact deposed destroy is
          # present and still has attached ENIs, refresh the relay ASG here,
          # wait for it to converge, then re-plan so Terraform retries the
          # delete after the ENIs have moved. If a retry finds the deposed SG is
          # already ENI-clear, skip the refresh and let apply delete it directly.
          # The downstream deploy-sandbox-relay job may then run a second refresh
          # on this rare recovery path; keeping that normal deploy leg intact is
          # preferable to special-casing the job graph during an incident.
          # This hook is intentionally sandbox-only because this job only deploys
          # sandbox; promote-to-prod owns prod, and a future prod relay rollout
          # should add the equivalent prod recovery gate before enabling relay.
          # Keep this job's checkout fetch-depth above RECOVERY_CANDIDATE_LIMIT
          # (default 200 in recover-relay-deposed-sg.sh) so infra-only recovery
          # can inspect its full configured candidate set.
          # Keep this block before the tainted-ASG scan: if one plan contains
          # both a deposed relay SG and a tainted ASG, recovery re-plans first
          # and TAINTED_ASGS is derived from the fresh post-recovery plan.
          # Give the live AWS ENI probe a small retry budget for transient CLI/API
          # failures. In --needs-recovery mode the helper returns immediately once
          # it confirms attached ENIs, so this does not delay real recovery.
          set +e
          RELAY_DEPOSED_SG_CHECK_MAX_ITERATIONS=3 \
          RELAY_DEPOSED_SG_CHECK_INTERVAL_SECS=5 \
            ../../../.github/scripts/check-relay-deposed-sg-clear.sh --needs-recovery plan-show.json
          RELAY_DEPOSED_STATUS=$?
          set -e

          if [[ "$RELAY_DEPOSED_STATUS" -eq 0 ]]; then
            echo "::warning::Detected deposed relay node security group pending destroy; refreshing relay ASG before Terraform retries DeleteSecurityGroup"
            ../../../.github/scripts/recover-relay-deposed-sg.sh \
              sandbox \
              "${{ needs.app-image-build-required.outputs.app_image_build_required == 'true' && 'true' || 'false' }}" \
              "${{ needs.setup.outputs.image_tag }}"

            # Refreshing the ASG changes live instance attachments and may update
            # the relay image-tag SSM param (ignored by Terraform), so discard the
            # old saved plan and re-plan against the post-recovery state.
            rm -f tfplan plan.txt plan-show.txt plan-show.json
            plan_with_attachment_migration_guard "after relay deposed-SG recovery"
            show_current_plan " after relay deposed-SG recovery"

            # EC2 deletes terminated instance ENIs asynchronously after the relay
            # refresh has reached Successful. Give that eventual-consistency tail
            # a rare-path three-minute grace window before failing closed.
            RELAY_DEPOSED_SG_CHECK_MAX_ITERATIONS=18 \
            RELAY_DEPOSED_SG_CHECK_INTERVAL_SECS=10 \
              ../../../.github/scripts/check-relay-deposed-sg-clear.sh plan-show.json
          elif [[ "$RELAY_DEPOSED_STATUS" -ne 1 ]]; then
            exit "$RELAY_DEPOSED_STATUS"
          fi
          TAINTED_ASGS=$(grep -E "aws_autoscaling_group\.[^ ]+ is tainted, so must be replaced" plan-show.txt | \
            sed -E 's/^[[:space:]]*#[[:space:]]+//; s/ is tainted.*$//' || true)

          if [[ -n "$TAINTED_ASGS" ]]; then
            echo "::warning::Detected tainted ASG(s) - untainting to allow in-place reconciliation (static-named ASG + create_before_destroy cannot replace under plan/apply)"
            while IFS= read -r asg; do
              [ -z "$asg" ] && continue
              echo "Untainting: $asg"
              # Fatal on non-zero: the re-plan below succeeds even on a
              # still-tainted resource (Terraform `plan` produces a
              # replace diff, not an error), so the real failure surface
              # is `apply` (AlreadyExists) — exactly the loop this
              # handler exists to prevent. Fail loud here instead.
              if ! terraform untaint "$asg"; then
                echo "::error::terraform untaint $asg failed; aborting to avoid the AlreadyExists loop at apply time"
                exit 1
              fi
            done <<< "$TAINTED_ASGS"
            # Re-plan after untaint so the in-place diff lands in tfplan.
            # Single-pass by design: if the re-plan re-surfaces another
            # tainted ASG (e.g. refresh re-taints due to external state
            # mutation), the next CI run picks it up. Don't add an inner
            # loop — bounded blast radius keeps the failure mode loud.
            # `tee plan.txt` keeps plan.txt consistent with tfplan so a
            # downstream re-scan doesn't read a stale file.
            rm -f tfplan
            if ! terraform plan -out=tfplan -no-color 2>&1 | tee plan.txt; then
              echo "::error::Re-plan failed after untaint. Manual intervention may be required."
              exit 1
            fi
            show_current_plan " after untaint"
            # Fail fast if the re-plan re-tainted something. plan.txt
            # is the fresh post-re-plan output (just tee'd above), while
            # show_current_plan refreshed plan-show.json for the migration
            # guard. If we let a tainted-ASG apply run, it would hit
            # `AlreadyExists` — exactly the loop this handler exists to prevent.
            # The next CI run picks it up; failing here surfaces the recovery
            # story in this run's log instead of as a cryptic apply error.
            if grep -qE "aws_autoscaling_group\.[^ ]+ is tainted, so must be replaced" plan.txt; then
              echo "::error::Re-plan after untaint still shows tainted ASG(s); aborting to avoid the AlreadyExists loop at apply time. Re-run the workflow on the next CI cycle."
              # Name the still-tainted address(es) in the log so the
              # operator doesn't have to scroll the plan to find them.
              grep -E "aws_autoscaling_group\.[^ ]+ is tainted, so must be replaced" plan.txt \
                | sed -E 's/^[[:space:]]*#[[:space:]]+//; s/ is tainted.*$//' >&2
              exit 1
            fi
          fi

      - name: Verify relay DMZ plan contract before apply
        working-directory: terraform/environments/sandbox
        run: |
          set -euo pipefail
          test -s tfplan
          test -s plan-show.json
          # The initial relay DMZ cutover is complete. Every normal deployment
          # must leave all fenced security-boundary resources unchanged.
          python3 ../../../.github/scripts/check-relay-dmz-plan.py \
            --require-pr0-applied \
            --require-dmz-boundary-noop \
            plan-show.json

      # TF_VAR_frps_image_tag (when SSM has a non-bootstrap value) was
      # exported to GITHUB_ENV by the
      # "Resolve qurl-reverse-tunnel-server Image Tag" step earlier in this
      # job, so it is inherited here automatically.
      - name: Terraform Apply
        working-directory: terraform/environments/sandbox
        env:
          # Sensitive variables passed via TF_VAR_ environment variables
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          # AC license key (plaintext - stored in Secrets Manager)
          TF_VAR_ac_license_key: ${{ secrets.AC_LICENSE_KEY }}
          # Grafana Cloud API token for dashboard provisioning
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
          # Auth0 Terraform provider credentials
          TF_VAR_auth0_tf_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
          TF_VAR_auth0_tf_client_secret: ${{ secrets.AUTH0_CLIENT_SECRET }}
          TF_VAR_auth0_api_token: ${{ steps.auth0.outputs.auth0_token }}
          # Deployment configuration - use commit SHA for immutable deployments
          TF_VAR_image_tag: ${{ needs.setup.outputs.image_tag }}
        # Apply exactly the saved plan that passed the DMZ contract above.
        run: |
          set -euo pipefail
          test -s tfplan
          echo "::notice::Applying checked saved plan ($(stat -f%z tfplan 2>/dev/null || stat -c%s tfplan) bytes)"
          terraform apply -auto-approve tfplan

      - name: Verify AWS CLI major for relay DMZ detector
        run: |
          set -euo pipefail
          aws_cli_version=$(aws --version 2>&1)
          if [[ ! "$aws_cli_version" =~ ^aws-cli/2\. ]]; then
            echo "::error::Relay DMZ detector stderr contracts require AWS CLI v2; found: $aws_cli_version"
            exit 1
          fi

      - name: Verify relay DMZ structural boundary
        run: python3 scripts/check-relay-dmz-live.py --mode structural --environment sandbox --wait-seconds 300

      - name: Verify relay DMZ post-apply idempotency
        working-directory: terraform/environments/sandbox
        env:
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          TF_VAR_ac_license_key: ${{ secrets.AC_LICENSE_KEY }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
          TF_VAR_auth0_tf_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
          TF_VAR_auth0_tf_client_secret: ${{ secrets.AUTH0_CLIENT_SECRET }}
          TF_VAR_auth0_api_token: ${{ steps.auth0.outputs.auth0_token }}
          TF_VAR_image_tag: ${{ needs.setup.outputs.image_tag }}
        run: |
          set -euo pipefail
          rm -f relay-dmz-post-apply.tfplan relay-dmz-post-apply.json
          # setup-terraform's wrapper deliberately translates Terraform plan
          # exit 2 (changes present) into process success. Do not use that exit
          # code as an emptiness proof. The full sandbox stack also contains
          # unrelated provider/CI-owned drift; the load-bearing contract here
          # is that every fenced relay-DMZ boundary address remains a no-op.
          # Re-planning re-proves the pre-apply contract after convergence.
          terraform plan -no-color \
            -out=relay-dmz-post-apply.tfplan 2>&1 | tee relay-dmz-post-apply.txt
          test -s relay-dmz-post-apply.tfplan
          terraform show -json relay-dmz-post-apply.tfplan \
            > relay-dmz-post-apply.json
          python3 ../../../.github/scripts/check-relay-dmz-plan.py \
            --require-pr0-applied \
            --require-dmz-boundary-noop \
            relay-dmz-post-apply.json

      - name: Get Terraform Outputs
        id: outputs
        working-directory: terraform/environments/sandbox
        run: |
          set -euo pipefail
          # Read state once as JSON. `terraform output -raw` exits nonzero for
          # a null output, and setup-terraform's wrapper writes its diagnostic
          # to stdout; command substitution previously promoted that diagnostic
          # into ETCD_ENDPOINTS and made integration tests dial it as a host.
          terraform_outputs=$(terraform output -json)
          server_asg=$(jq -er '.asg_name.value | select(type == "string" and length > 0)' <<< "$terraform_outputs")
          ac_asg=$(jq -er '.ac_asg_name.value | select(type == "string" and length > 0)' <<< "$terraform_outputs")
          nlb_dns=$(jq -er '.nlb_dns_name.value | select(type == "string" and length > 0)' <<< "$terraform_outputs")
          etcd_endpoint=$(jq -r '.etcd_endpoint.value // empty' <<< "$terraform_outputs")
          {
            echo "server_asg=$server_asg"
            echo "ac_asg=$ac_asg"
            echo "nlb_dns=$nlb_dns"
            echo "etcd_endpoint=$etcd_endpoint"
          } >> "$GITHUB_OUTPUT"

  # =============================================================================
  # DEPLOY SANDBOX - QURL ECS task-def roll (#1634)
  # =============================================================================
  # deploy-sandbox-infra's TF apply registers a new qurl-service task-def
  # revision whenever a qurl env var changes, but aws_ecs_service.qurl carries
  # lifecycle.ignore_changes = [task_definition] ("managed by CI" — see
  # terraform/modules/qurl-service/main.tf). Until #1634, only prod CI
  # (promote-to-prod.yml deploy-qurl) advanced the service; sandbox never did,
  # so env-var changes silently no-op'd on the running service and only
  # surfaced when a downstream consumer exercised the path (qurl-service #335,
  # which 403'd customer flows for ~30h on a stale sandbox revision).
  #
  # This job mirrors prod's deploy-qurl, reusing deploy-ecs-service.sh (ECS
  # circuit-breaker auto-rollback + post-roll task-def verify). Two deliberate
  # choices:
  #   - Image tag comes from SSM (qurl-service CI's source of truth), NOT the
  #     latest task def: TF's latest revision image can lag SSM because TF only
  #     re-reads it on apply, so deriving the tag from the task def could
  #     downgrade the running image if qurl-CI pushed between apply and roll.
  #   - Parallel to blue-green, gated only on deploy-sandbox-infra — NOT ordered
  #     before server. Prod's deploy-qurl runs AFTER deploy-server, so "qurl
  #     before server" is not a correctness invariant; coupling blue-green's
  #     gating to this job would be unjustified.
  #
  # Idempotency: deploy-sandbox-infra runs TF apply on every push to main, but
  # only a qurl change bumps the revision. The roll is gated on
  # running-task-def != latest-task-def, so the common no-qurl-change deploy is
  # a fast no-op rather than a redundant rolling restart. (The scheduled-release
  # path, ensure-sandbox-deployed.sh, does not run terraform apply and so
  # cannot create qurl revisions — it does not share this gap.)
  deploy-sandbox-qurl:
    name: Deploy Sandbox - QURL Service
    needs: [deploy-sandbox-infra]
    if: always() && needs.deploy-sandbox-infra.result == 'success'
    runs-on: ubuntu-latest
    environment: sandbox
    # Roll budget: deploy-ecs-service.sh waits up to 600s for stability, can add
    # a 30s two-read floor when verifying a concurrent sandbox roll, then waits
    # 30s for ALB settle. 15m leaves headroom over that worst case (matches
    # prod's deploy-qurl) without masking a genuine hang.
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-sandbox-qurl
      cancel-in-progress: false  # Never cancel an in-flight ECS roll.
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Reuses AWS_ROLE_ARN (the sandbox apply role). It already manages the
      # qurl ECS service / task def / SSM params via TF, so it holds the
      # ecs:RegisterTaskDefinition / UpdateService / Describe*, iam:PassRole,
      # and ssm:Get/PutParameter permissions deploy-ecs-service.sh needs.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # SSM prefix = local.name_prefix = "layerv-nhp-${environment}"
      # (terraform/main.tf), the same prefix the qurl module writes its
      # cluster/service/image-tag params under. Mirror of prod's
      # PROD_SSM_PREFIX: 'layerv-nhp-prod'.
      - name: Roll qurl-service to latest task def
        id: roll-qurl
        env:
          SANDBOX_SSM_PREFIX: layerv-nhp-sandbox
          PRESERVE_SSM_IMAGE_TAG: "true"
        run: |
          set -euo pipefail
          # AWS_REGION is always set by the workflow-level env: block.

          # Bounded retry for the LOUD-FAIL read-only AWS calls (the two ECS
          # describes + the image-tag SSM read). 3 attempts, linear backoff
          # (3s, 6s). Non-final attempts swallow stderr (a transient error we'll
          # retry); the FINAL attempt lets stderr through so a genuine exhausted
          # failure is self-explaining (e.g. an IAM-denied describe) rather than
          # dying as a bare non-zero exit — #1634 is about not hiding failures.
          # Callers have no `|| fallback`, so an exhausted failure exits the job
          # red under set -e. (The is-qurl-deployed probe is NOT loud-fail — it
          # uses ssm_probe below, which alone may resolve to a skip.)
          aws_read() {
            local attempt out
            for attempt in 1 2 3; do
              if [[ "$attempt" -eq 3 ]]; then
                # Final attempt: stderr through (self-explaining on exhaustion).
                out=$("$@") || return 1
              else
                # Earlier attempts: swallow the transient error we'll retry.
                out=$("$@" 2>/dev/null) || { sleep "$((attempt * 3))"; continue; }
              fi
              printf '%s' "$out"
              return 0
            done
          }
          SSM_PARAM_NOT_FOUND="__NHP_QURL_SSM_PARAMETER_NOT_FOUND__"

          # Probe an SSM param that MAY be legitimately absent (qurl not
          # deployed). Prints the value (rc 0) on success; prints
          # SSM_PARAM_NOT_FOUND (rc 0) ONLY on a genuine `(ParameterNotFound)`
          # AWS error-code token — the "not deployed" skip signal. ANY OTHER
          # error retries the transient case and then fails loud (rc 1, last
          # stderr shown), so a sustained SSM outage during deploy goes red
          # instead of masquerading as "not deployed" (the #1634 hidden-skip
          # class — a roll that should happen must never be silently skipped).
          # Stderr -> tempfile (not 2>&1) so a CLI warning on a successful read
          # can't contaminate the returned value.
          ssm_probe() {
            local attempt err out
            err=$(mktemp)
            for attempt in 1 2 3; do
              if out=$(aws ssm get-parameter \
                  --name "/${SANDBOX_SSM_PREFIX}/$1" \
                  --query "Parameter.Value" --output text \
                  --region "$AWS_REGION" 2>"$err"); then
                rm -f "$err"; printf '%s' "$out"; return 0
              fi
              if grep -q '(ParameterNotFound)' "$err"; then
                rm -f "$err"; printf '%s' "$SSM_PARAM_NOT_FOUND"; return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then sleep "$((attempt * 3))"; fi
            done
            cat "$err" >&2; rm -f "$err"; return 1  # exhausted, non-not-found -> loud
          }

          # Is qurl deployed in this env? The cluster/service SSM params are
          # created by modules/qurl-service only when deploy_qurl_service=true.
          # ssm_probe returns SSM_PARAM_NOT_FOUND ONLY on a genuine
          # ParameterNotFound (=> not deployed => skip); a sustained SSM error
          # fails the job loud instead of being mistaken for "not deployed".
          # #1634 is about a roll failure being hidden, so never degrade an
          # error into a silent skip.
          ECS_SERVICE=$(ssm_probe qurl-ecs-service)
          ECS_CLUSTER=$(ssm_probe qurl-ecs-cluster)
          if [[ "$ECS_SERVICE" == "$SSM_PARAM_NOT_FOUND" && "$ECS_CLUSTER" == "$SSM_PARAM_NOT_FOUND" ]]; then
            echo "::notice::qurl-service cluster/service SSM params absent under /${SANDBOX_SSM_PREFIX}/ — qurl not deployed in sandbox; skipping roll."
            echo "- QURL roll: **skipped** (qurl not deployed in sandbox)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$ECS_SERVICE" == "$SSM_PARAM_NOT_FOUND" || "$ECS_CLUSTER" == "$SSM_PARAM_NOT_FOUND" ]]; then
            echo "::error::qurl-service SSM params are partially absent under /${SANDBOX_SSM_PREFIX}/; expected both cluster/service params or neither."
            echo "- QURL roll: **failed** — qurl-service cluster/service SSM params are partially absent" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ -z "$ECS_SERVICE" || "$ECS_SERVICE" == "None" \
             || -z "$ECS_CLUSTER" || "$ECS_CLUSTER" == "None" ]]; then
            echo "::error::qurl-service cluster/service SSM params returned empty/None under /${SANDBOX_SSM_PREFIX}/."
            echo "- QURL roll: **failed** — qurl-service cluster/service SSM params returned empty/None" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Idempotency guard. TF env-var changes always bump the task-def
          # revision; compare running vs latest and advance only on a
          # difference, so a no-qurl-change deploy is a fast no-op. (Image-only
          # changes — a new tag with no TF env change, hence no new revision —
          # are rolled by qurl-service CI's own pipeline, not here; this job
          # only advances the service onto revisions Terraform created.)
          #
          # A persistently-broken revision (the circuit breaker rolls back to
          # the prior good one) leaves running != latest, so this re-attempts
          # the roll on every push and stays red until the bad TF change is
          # reverted. That loud re-attempt is intentional — do NOT add a "skip
          # the known-failed revision" short-circuit: it would silently strand
          # the service on the old revision, the exact hidden-staleness #1634
          # exists to prevent.
          RUNNING=$(aws_read aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].taskDefinition" --output text \
            --region "$AWS_REGION")
          if [[ -z "$RUNNING" || "$RUNNING" == "None" ]]; then
            echo "::error::Could not read running task definition for service $ECS_SERVICE."
            exit 1
          fi
          FAMILY="${RUNNING##*task-definition/}"  # strip ARN prefix -> family:rev
          FAMILY="${FAMILY%:*}"                   # strip :rev -> family
          LATEST=$(aws_read aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query "taskDefinition.taskDefinitionArn" --output text \
            --region "$AWS_REGION")
          echo "Running task def: $RUNNING"
          echo "Latest task def:  $LATEST"
          if [[ "$RUNNING" == "$LATEST" ]]; then
            echo "::notice::qurl-service already on latest task-def revision; nothing to advance."
            echo "- QURL roll: **no-op** (already on latest revision \`${LATEST##*/}\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A newer TF-registered revision exists. Roll to it via the shared
          # deploy-ecs-service.sh (rather than a plain `update-service` onto the
          # latest revision) to inherit its ECS circuit-breaker auto-rollback +
          # post-roll task-def verify. PRESERVE_SSM_IMAGE_TAG makes the helper
          # re-read the current SSM image tag and leave qurl-service's own SSM
          # writer authoritative, avoiding a stale overwrite between this
          # workflow's read and the helper's Step 1. It still re-registers a
          # duplicate task-def revision (newest image + newest env vars), which
          # is an acceptable cost for reusing the hardened, prod-shared deployer.
          IMAGE_TAG=$(aws_read aws ssm get-parameter \
            --name "/${SANDBOX_SSM_PREFIX}/qurl-api-image-tag" \
            --query "Parameter.Value" --output text \
            --region "$AWS_REGION")
          if [[ -z "$IMAGE_TAG" || "$IMAGE_TAG" == "None" ]]; then
            echo "::error::/${SANDBOX_SSM_PREFIX}/qurl-api-image-tag is empty; cannot roll qurl-service."
            exit 1
          fi
          echo "Advancing qurl-service (${RUNNING##*/} -> latest; image tag: $IMAGE_TAG)..."
          ./.github/scripts/deploy-ecs-service.sh "$SANDBOX_SSM_PREFIX" "$IMAGE_TAG"
          echo "requested_image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: QURL roll summary
        if: steps.roll-qurl.outcome == 'success' && steps.roll-qurl.outputs.requested_image_tag != ''
        env:
          DEPLOYED_IMAGE: ${{ steps.roll-qurl.outputs.deployed_image }}
          DEPLOYED_TASK_DEF_ARN: ${{ steps.roll-qurl.outputs.deployed_task_def_arn }}
          REQUESTED_IMAGE_TAG: ${{ steps.roll-qurl.outputs.requested_image_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$DEPLOYED_IMAGE" && -n "$DEPLOYED_TASK_DEF_ARN" ]]; then
            echo "- QURL roll: **advanced** (actual image \`$DEPLOYED_IMAGE\`, task def \`${DEPLOYED_TASK_DEF_ARN##*/}\`; requested SSM tag \`$REQUESTED_IMAGE_TAG\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- QURL roll: **advanced** (requested SSM tag \`$REQUESTED_IMAGE_TAG\`; helper did not emit deployed outputs)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # =============================================================================
  # DEPLOY SANDBOX - NHP-Relay CD deploy leg (#2624, part of #2208)
  # =============================================================================
  # The relay's CD deploy leg: on each main build, push the freshly-built image
  # tag into the relay's SSM image-tag param and trigger an ASG instance refresh
  # so the fleet rolls onto it. The relay user_data reads the image tag FROM SSM
  # at boot (modules/relay/user_data.sh.tpl: `aws ssm get-parameter ... ->
  # docker pull $ECR_REPO:$IMAGE_TAG`), so put-parameter + instance-refresh is
  # the whole deploy — no task-def / blue-green machinery (the relay is a plain
  # single ASG, one instance per AZ).
  #
  # Unlike server/ac (blue/green via blue-green-deploy.yml), the relay does a
  # direct instance refresh — the same put-parameter + start-instance-refresh
  # shape the server/ac legs used before they moved to blue/green, and what the
  # relay module's compute.tf comments anticipate ("updated by the CI deploy
  # leg"; "for the CI deploy leg's instance-refresh").
  #
  # NO-OP WHEN DARK (deploy_relay=false): `module "relay"` is count-gated on
  # var.deploy_relay (terraform/main.tf), so when the relay is off the ASG and
  # BOTH SSM params simply don't exist. A single get-parameter on the asg-name
  # param therefore both (a) detects the dark case (ParameterNotFound -> skip
  # cleanly) and (b) yields the refresh target when lit. This mirrors the FRPS
  # ParameterNotFound handling and deploy-sandbox-qurl's ssm_probe: a genuine
  # absence is a clean skip, but a sustained/permission SSM error fails loud
  # (never degrade an error into a silent skip). Prod stays dark and is handled
  # by promote-to-prod.yml regardless; this sandbox leg is a no-op until #6
  # flips deploy_relay=true.
  #
  # IMAGE TAG: written when this commit touched app paths OR the live relay tag
  # lags app changes already present in HEAD (the sandbox-app-image-drift job
  # forces a build in that case). On a truly infra-only commit with no live app
  # drift, github.sha was NOT pushed, so we must NOT write it — the SSM param
  # keeps the currently-running tag and the refresh still propagates any
  # launch-template / user_data / relay.toml change from terraform apply.
  #
  # IAM: reuses AWS_ROLE_ARN (the github_actions role). It already grants
  # ssm:GetParameter (Resource=*), ssm:PutParameter (Resource=*), and
  # autoscaling:StartInstanceRefresh on autoScalingGroupName/layerv-nhp-* — the
  # relay ASG is layerv-nhp-${env}-relay, inside that wildcard. No IAM change.
  deploy-sandbox-relay:
    name: Deploy Sandbox - Relay
    # setup + app-image-build-required: needed for the app-image gate + tag.
    # The private relay/server wire uses a versioned request-ID return envelope,
    # so converge the server blue/green deployment before rolling relay nodes.
    # This ordering prevents a new relay from expecting RelayReturnMsg while an
    # old server still emits the former raw inner reply.
    needs: [setup, app-image-build-required, deploy-sandbox-infra, deploy-sandbox-blue-green]
    if: always() && needs.deploy-sandbox-infra.result == 'success' && needs.deploy-sandbox-blue-green.result == 'success'
    runs-on: ubuntu-latest
    environment: sandbox
    # deploy-relay.sh starts the instance refresh and POLLS it to completion (the
    # #2646 readiness gate) — it is NOT fire-and-forget: SSM calls + the start,
    # then a bounded poll (RELAY_REFRESH_MAX_ITERATIONS × interval, default 15
    # min). This job timeout is therefore load-bearing for the poll ceiling, not
    # just SSM/ASG API headroom: an observed healthy 3-instance roll took ~8m15s,
    # the script caps the refresh poll at 15 min, and the functional boundary
    # gate adds a 10m retry window plus one final uncached collection. The 35m
    # job bound leaves both components room to emit their own terminal errors.
    timeout-minutes: 35
    # Direct AWS calls only (no sub-workflow dispatch), so unlike
    # deploy-sandbox-blue-green this needs id-token + contents, NOT actions:write.
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-sandbox-relay
      cancel-in-progress: false  # Never cancel an in-flight relay roll.
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The probe + put-parameter + instance-refresh body lives in
      # .github/scripts/deploy-relay.sh. It writes /sandbox/nhp/relay/image-tag,
      # which matches the image-tag slot regex policed by
      # scripts/check-image-tag-writer-allowlist.{py,sh}; keeping the write in
      # that single-purpose, allowlisted helper (rather than allowlisting this
      # whole build workflow) preserves the fence's ability to catch a future
      # build-matrix re-introduction of an image-tag write — the original race
      # the fence exists to prevent (run 26130904414). The helper also no-ops
      # cleanly when the relay is dark (deploy_relay=false → asg-name param
      # absent → ParameterNotFound → skip).
      - name: Deploy relay (SSM image-tag + ASG instance refresh)
        env:
          APP_IMAGE_BUILD_REQUIRED: ${{ needs.app-image-build-required.outputs.app_image_build_required }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
        run: |
          set -euo pipefail
          EFFECTIVE_APP_CHANGED=false
          if [[ "$APP_IMAGE_BUILD_REQUIRED" == "true" ]]; then
            EFFECTIVE_APP_CHANGED=true
          fi
          ./.github/scripts/deploy-relay.sh sandbox "$EFFECTIVE_APP_CHANGED" "$IMAGE_TAG"

      - name: Verify AWS CLI major for relay DMZ detector
        run: |
          set -euo pipefail
          aws_cli_version=$(aws --version 2>&1)
          if [[ ! "$aws_cli_version" =~ ^aws-cli/2\. ]]; then
            echo "::error::Relay DMZ detector stderr contracts require AWS CLI v2; found: $aws_cli_version"
            exit 1
          fi

      - name: Verify relay DMZ functional boundary
        run: python3 scripts/check-relay-dmz-live.py --mode functional --environment sandbox --wait-seconds 600

  # Dispatch blue/green deployment instead of doing direct instance refresh.
  # This ensures every CI deploy alternates between blue and green ASGs,
  # includes the knock-readiness gate, and uses instant NLB listener
  # switching instead of rolling replacement. The actual dispatch + poll
  # logic lives in .github/scripts/dispatch-and-poll-blue-green.sh so it
  # is shared with ensure-sandbox-deployed.sh (scheduled-release path).
  deploy-sandbox-blue-green:
    name: Deploy Sandbox - Blue/Green
    needs: [setup, app-image-build-required, build, deploy-sandbox-infra]
    if: always() && needs.build.result == 'success' && needs.deploy-sandbox-infra.result == 'success' && needs.deploy-sandbox-infra.outputs.server_asg != ''
    runs-on: ubuntu-latest
    environment: sandbox
    # Job timeout must cover the dispatch step's worst case plus a buffer for
    # the dispatch script to print its final timeout error before GitHub kills
    # the job. The infra-only path dispatches blue/green twice in sequence when
    # the server and AC active tags have drifted (plan-blue-green-dispatch.sh).
    # Each dispatch-and-poll-blue-green.sh call can take its full find-run
    # window (FIND_RETRIES 24 x 5s = 120s) before polling, plus the poll timeout
    # (POLL_TIMEOUT 2400s = 40m) — ~42m — so two sequential dispatches reach
    # ~84m, ~85m with this job's pre-steps (checkout / AWS / resolve). 90m keeps
    # a ~5min buffer. The common single-dispatch path still finishes in ~10m;
    # this ceiling only bites the rare double-deploy worst case, where a clean
    # timeout error beats a runner kill.
    timeout-minutes: 90
    # Job-level permissions REPLACE the workflow-level block in GitHub
    # Actions, so every scope this job needs has to be re-listed here even
    # if the workflow-level grants it.
    #
    # actions: write   — dispatch-and-poll-blue-green.sh calls the workflow
    #                    dispatch REST API. Workflow-level intentionally
    #                    withholds this for least-privilege; only this job
    #                    needs it.
    # id-token: write  — required to assume the AWS OIDC role so the
    #                    "Resolve Image Tag" step (and any future SSM /
    #                    AWS API call here) can authenticate.
    # contents: read   — checkout.
    permissions:
      id-token: write
      contents: read
      actions: write
    concurrency:
      group: deploy-sandbox-blue-green
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Resolve the image tag to deploy.
      #
      #   - App-image-required commits: every CI run on main rebuilds and pushes
      #     layerv/nhp-server:${github.sha} + layerv/nhp-ac:${github.sha}
      #     via the `build` matrix when either this commit changed app paths OR
      #     the live active tags lag app changes already present in HEAD.
      #
      #   - True infra-only commits: `Build server` / `Build ac` step-level-skip
      #     only when live active tags already contain HEAD's app paths, so
      #     github.sha is NEVER pushed to ECR. Dispatching blue/green with that tag explodes in
      #     the downstream "Validate Image Exists in ECR" step. The right
      #     behaviour is to dispatch with the *currently-deployed* tag so
      #     instance refresh still runs — which is the mechanism by which
      #     terraform changes to user_data / systemd env file / launch
      #     template propagate from HCL into running instances. Silently
      #     skipping the blue/green step (as PR #994 did) breaks that
      #     propagation, re-introducing the drift problem PR #820 was
      #     built to avoid.
      #
      # Server and AC have independent active colours in SSM, so we read
      # each one's current active tag separately. They usually match (an
      # app-changing commit deploys both at one github.sha), but can drift:
      # a per-component manual dispatch, or a `both` deploy where only one
      # colour's SSM tag advanced before the other failed/rolled back, leaves
      # the two on different active tags. When they drift, the dispatch step
      # below fans out to one blue/green dispatch per component at its own tag
      # (plan-blue-green-dispatch.sh) instead of failing the deploy —
      # blue-green-deploy.yml takes a single image_tag per dispatch, so two
      # tags need two dispatches. (Previously this step hard-failed on drift,
      # which wedged every infra-only commit until someone healed it by hand.)
      - name: Resolve Image Tag
        id: resolve-tag
        env:
          APP_IMAGE_BUILD_REQUIRED: ${{ needs.app-image-build-required.outputs.app_image_build_required }}
          GITHUB_SHA_INPUT: ${{ needs.setup.outputs.image_tag }}
        run: |
          set -euo pipefail

          if [[ "$APP_IMAGE_BUILD_REQUIRED" == "true" ]]; then
            # Both components were freshly built and pushed at this github.sha:
            # either this commit changed app paths, or live sandbox images lag
            # app changes already present in HEAD. In both cases this SHA is
            # the only tag that can honestly satisfy deployed-commit.
            SERVER_TAG="$GITHUB_SHA_INPUT"
            AC_TAG="$GITHUB_SHA_INPUT"
            echo "App image required — dispatching both components with freshly-built tag: $GITHUB_SHA_INPUT"
            echo "source=github-sha" >> "$GITHUB_OUTPUT"
          else
            echo "No app code changes on this commit — resolving current active image tags from SSM so the blue/green refresh picks up any launch-template / user_data / boot-config changes from terraform apply."
            SERVER_TAG=$(./.github/scripts/resolve-active-image-tag.sh sandbox server)
            AC_TAG=$(./.github/scripts/resolve-active-image-tag.sh sandbox ac)
            echo "  server active tag: $SERVER_TAG"
            echo "  ac     active tag: $AC_TAG"
            echo "source=ssm-current" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "server_tag=$SERVER_TAG"
            echo "ac_tag=$AC_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch Blue/Green Deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SERVER_TAG: ${{ steps.resolve-tag.outputs.server_tag }}
          AC_TAG: ${{ steps.resolve-tag.outputs.ac_tag }}
          IMAGE_TAG_SOURCE: ${{ steps.resolve-tag.outputs.source }}
          # Per-dispatch poll budget. MUST stay below the job timeout above so
          # the script exits cleanly with an error before GitHub kills the
          # runner. The drift path dispatches twice in sequence, so the 90m job
          # timeout covers 2x this 40m budget (plus each dispatch's find-run
          # window) + buffer (see timeout-minutes).
          POLL_TIMEOUT: "2400"
        run: |
          set -euo pipefail
          echo "============================================"
          echo "DISPATCHING BLUE/GREEN DEPLOYMENT"
          echo "  server tag: $SERVER_TAG"
          echo "  ac tag:     $AC_TAG"
          echo "  source:     $IMAGE_TAG_SOURCE"
          echo "============================================"

          # plan-blue-green-dispatch.sh emits one non-blank "<component> <tag>"
          # line per dispatch (fixture-tested): a single `both <tag>` when the
          # tags match, or `server <s>` + `ac <a>` when they've drifted.
          PLAN=$(./.github/scripts/plan-blue-green-dispatch.sh "$SERVER_TAG" "$AC_TAG")
          echo "Dispatch plan:"
          echo "$PLAN"

          # Each dispatch blocks until its run completes, so the two drift-path
          # dispatches run one at a time — serialised by the loop, not the
          # blue-green-<env> concurrency group (which only guards against *other*
          # triggers overlapping). Under set -e a failed dispatch aborts the loop
          # and fails the step; a re-run re-dispatches an already-refreshed
          # component at its tag — a full blue/green cycle (colour flip + ASG
          # refresh) that is a no-op at the same image but not free. `< /dev/null`
          # stops the called script from consuming the here-string and skipping
          # the second component (gh doesn't read stdin today; the inner script
          # evolves independently).
          while read -r COMPONENT TAG; do
            echo "--- Dispatching component=$COMPONENT tag=$TAG ---"
            ./.github/scripts/dispatch-and-poll-blue-green.sh sandbox "$COMPONENT" "$TAG" </dev/null
          done <<< "$PLAN"

  deploy-sandbox-validate:
    name: Deploy Sandbox - Validate
    # deploy-sandbox-qurl is in needs (#1634) so validation never runs against
    # a stale qurl service: this job's E2E demo flow — and the nhp-smoke-sandbox
    # job that needs it (tier: all, which exercises the qurl resolve path that
    # 403'd in the incident) — must observe the rolled task def, not race it.
    # deploy-sandbox-qurl runs parallel to blue-green (both need only infra), so
    # without this edge a fast blue-green + a slow roll (circuit-breaker retry,
    # up to 600s) could let smoke test the old revision and go red on a healthy
    # deploy — the misattributed-failure class #1634 is about.
    #
    # The `if` ORDERS after the roll but does NOT gate on its success: a roll
    # FAILURE means the ECS circuit breaker rolled back to the previous healthy
    # revision, so validate+smoke still run against a known-good qurl and — more
    # importantly — server/AC smoke coverage (independent of qurl) is preserved
    # instead of being suppressed by an unrelated qurl problem. The roll failure
    # is still loud: deploy-sandbox-qurl goes red and is in notify's
    # DEPLOY_FAILED loop. Only `cancelled` (indeterminate/half-rolled, run being
    # torn down) skips validation.
    # The qurl.link CSP propagation gate below follows the same rule. It is a
    # CloudFront/S3 contract, not a qurl ECS roll contract, and should still
    # pass quickly on skipped or rolled-back qurl-service deploys while keeping
    # the smoke handoff from seeing stale response-header-policy state.
    # A permanent qurl.link CSP/origin break is left to the strict smoke suite
    # as the hard failure so unrelated smoke coverage still runs. This validate
    # job only waits out the common CloudFront policy propagation window before
    # handing off to smoke.
    #
    # #2680 (#6) gives the relay real teeth in this job. The qurl relay
    # bootstrap smoke below imports the deployed qurl.link JS-agent bundle and
    # sends a shaped bogus-token knock through the real relay, expecting an
    # authenticated reResolve ACK back from nhp-server/qurl-service. Validation
    # now ORDERS after deploy-sandbox-relay, but only the relay smoke and
    # deployment tracking gate on relay success. That keeps unrelated
    # integration/E2E/CSP validation visible when the relay leg is already red.
    needs: [setup, deploy-sandbox-infra, deploy-sandbox-blue-green, deploy-sandbox-qurl, deploy-sandbox-relay]
    if: |
      always() &&
      needs.deploy-sandbox-infra.result == 'success' &&
      needs.deploy-sandbox-blue-green.result == 'success' &&
      needs.deploy-sandbox-qurl.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: sandbox
    # Overall budget covers the existing validation/integration/E2E phases, the
    # bounded CSP propagation wait, and the relay bootstrap smoke. Individual
    # long-running run steps also carry step-level timeouts so a hang in
    # pre-existing validation does not inherit the full propagation/probe budget.
    # The remaining headroom is for checkout, AWS setup, SSM reads, and summary
    # steps.
    timeout-minutes: 65
    outputs:
      qurl_link_url: ${{ steps.qurl-domain-sandbox.outputs.qurl_link_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # resolve-live-app-image-required.sh can fetch an active image tag by
          # SHA from this origin when the post-switch gate detects drift.
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Post-Deployment Validation
        timeout-minutes: 6
        run: |
          echo "============================================"
          echo "POST-DEPLOYMENT VALIDATION"
          echo "============================================"

          # Make script executable and run
          chmod +x scripts/validate-deployment.sh

          ./scripts/validate-deployment.sh sandbox

      # Integration tests knock the assigned-cell server over its required
      # public NLB (NHP_SERVER_ENDPOINT) on UDP 62206. Today this proves required
      # endpoint discovery, DNS resolution, and a UDP send attempt; valid SDK
      # protocol round trips under distributed load are enforced by the manual
      # Assigned-cell UDP flood readiness workflow before SDK rollout.
      # Missing endpoint discovery must never silently skip even this basic gate.
      - name: Require assigned-cell public NHP endpoint
        env:
          NLB_DNS: ${{ needs.deploy-sandbox-infra.outputs.nlb_dns }}
        run: |
          if [ -z "$NLB_DNS" ]; then
            echo "::error::Missing required assigned-cell public NHP NLB DNS output"
            exit 1
          fi

      - name: Setup Go for Integration Tests
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            nhp/go.sum
            endpoints/go.sum

      - name: Run Integration Tests
        timeout-minutes: 7
        env:
          NHP_SERVER_ENDPOINT: "${{ needs.deploy-sandbox-infra.outputs.nlb_dns }}:62206"
          ETCD_ENDPOINTS: ${{ needs.deploy-sandbox-infra.outputs.etcd_endpoint }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          echo "============================================"
          echo "INTEGRATION TESTS"
          echo "============================================"
          echo "NHP Server: $NHP_SERVER_ENDPOINT"
          echo "etcd: $ETCD_ENDPOINTS"
          echo ""

          # Run integration tests (skip etcd tests if no certs configured)
          cd tests/integration

          # Note: etcd tests will skip via t.Skip() if ETCD_CA_CERT is not set
          # This is expected in CI until we add etcd mTLS cert handling
          go test -v -tags=integration -timeout 5m ./...

      - name: Read QURL domain from SSM
        id: qurl-domain-sandbox
        run: |
          # Read QURL link URL from SSM (Terraform is the source of truth)
          QURL_LINK_URL=$(aws ssm get-parameter \
            --name "/sandbox/nhp/qurl/link-url" \
            --query "Parameter.Value" --output text 2>/dev/null) || true

          if [ -z "$QURL_LINK_URL" ]; then
            echo "::warning::SSM parameter /sandbox/nhp/qurl/link-url not found, falling back to hardcoded value"
            QURL_LINK_URL="https://qurl.link.layerv.xyz"
          fi

          # Extract domain from URL (strip https://)
          LOGIN_PORTAL_DOMAIN="${QURL_LINK_URL#https://}"
          {
            echo "qurl_link_url=$QURL_LINK_URL"
            echo "login_portal_domain=$LOGIN_PORTAL_DOMAIN"
          } >> "$GITHUB_OUTPUT"
          echo "Using QURL link URL: $QURL_LINK_URL"

      - name: Run E2E Tests (Demo Flow)
        timeout-minutes: 7
        env:
          CONSOLE_API_URL: "https://home.secure.layerv.xyz"
          LOGIN_PORTAL_DOMAIN: ${{ steps.qurl-domain-sandbox.outputs.login_portal_domain }}
          APPS_DOMAIN: "qurl.site.layerv.xyz"
        run: |
          echo "============================================"
          echo "E2E TESTS - DEMO FLOW"
          echo "============================================"
          echo "Console API: $CONSOLE_API_URL"
          echo "Login Portal: $LOGIN_PORTAL_DOMAIN"
          echo "Apps Domain: $APPS_DOMAIN"
          echo ""

          # E2E tests verify the actual demo flow works end-to-end
          # These test public endpoints and don't require VPC access
          cd tests/e2e

          # Run E2E tests with verbose output
          go test -v -tags=e2e -timeout 5m ./... 2>&1 || {
            echo "::warning::Some E2E tests failed - see output above"
          }

      # This stays after the independent E2E step so CloudFront policy
      # propagation gets that E2E runtime to converge before the bounded CSP
      # wait starts. On a permanent qurl.link break, this spends the E2E time
      # before warning, but normal deploys avoid waiting while propagation is
      # already complete.
      - name: Wait for qURL link CSP propagation
        timeout-minutes: 22
        env:
          QURL_LINK_URL: ${{ steps.qurl-domain-sandbox.outputs.qurl_link_url }}
          EXPECTED_SCRIPT_SRC_RE: "(^|;[[:space:]]*)script-src[[:space:]]+'self'([[:space:]]+'sha256-[A-Za-z0-9+/]+={0,2}')+([[:space:]]*;|[[:space:]]*$)"
        run: |
          set -euo pipefail

          echo "Waiting for qurl.link CloudFront script-src propagation at $QURL_LINK_URL"
          echo "Retry budget: 60 attempts, 15 seconds between attempts, 5 seconds max per curl probe."
          echo "Step timeout must stay above the retry budget: 59*15s sleeps plus 60*5s probes is about 20 minutes."
          LAST_CSP="<missing>"
          LAST_CURL_EXIT=0
          LAST_HTTP_STATUS=000
          PROBE_URL="${QURL_LINK_URL%/}/"

          # Keep this directive-level check aligned with
          # tests/smoke/16_qurl_link_frontend_test.go::scriptSrcSandboxHashRE.
          # This validate job is sandbox-only. If sandbox flips
          # qurl_link_js_agent_enabled, update qurlLinkJSAgentEnabledEnvs in the
          # same PR so the smoke connect-src fence stays aligned.
          # QURL_LINK_URL normally comes from SSM, which is the live deploy
          # source of truth. deploy-sandbox-validate exposes that resolved
          # value to nhp-smoke-sandbox as QURL_LINK_ORIGIN so this gate and
          # smoke probe the same origin. Its hardcoded fallback must stay
          # aligned with the smoke sandbox QURLLinkOrigin default for manual
          # smoke runs or missing-SSM fallback paths.
          # scripts/check-qurl-csp-gate-drift.sh fences the static couplings
          # at PR time.
          for attempt in $(seq 1 60); do
            if [[ "$attempt" -gt 1 ]]; then
              sleep 15
            fi

            CURL_EXIT=0
            CURL_OUTPUT=$(curl --connect-timeout 5 --max-time 5 -sS -o /dev/null -D - -w '\n__nhp_http_status__:%{http_code}\n' "$PROBE_URL" 2>&1) || CURL_EXIT=$?
            PARSED_PROBE=$(printf '%s\n' "$CURL_OUTPUT" | ./scripts/parse-qurl-csp-probe-output.sh)
            HTTP_STATUS=$(sed -n 's/^http_status=//p' <<<"$PARSED_PROBE")
            CSP=$(sed -n 's/^csp=//p' <<<"$PARSED_PROBE")
            LAST_CSP="${CSP:-<missing>}"
            LAST_CURL_EXIT="$CURL_EXIT"
            LAST_HTTP_STATUS="$HTTP_STATUS"

            if grep -qiE "$EXPECTED_SCRIPT_SRC_RE" <<<"$CSP"; then
              echo "qurl.link CSP propagated after attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt/60: curl_exit=$LAST_CURL_EXIT http_status=$LAST_HTTP_STATUS CSP is $LAST_CSP; waiting for script-src 'self' plus verifier hashes"
          done

          if [[ "$LAST_CURL_EXIT" -ne 0 ]]; then
            echo "::warning::qurl.link CSP probe could not reach $PROBE_URL after 60 bounded attempts; last curl_exit: $LAST_CURL_EXIT; last http_status: $LAST_HTTP_STATUS; last observed CSP: $LAST_CSP"
          else
            echo "::warning::qurl.link CSP did not propagate to the expected hash-based sandbox script-src posture after 60 bounded attempts; last http_status: $LAST_HTTP_STATUS; last observed CSP: $LAST_CSP"
          fi
          echo "Continuing so the full smoke suite still runs; TestQurlLinkFrontend_CSPOmitsUnsafeInlineScript remains the hard CSP gate."

      # Node setup is only needed when the relay smoke will run; relay failure is
      # already loud on deploy-sandbox-relay and should not spend extra setup time.
      - name: Setup Node for qURL relay smoke
        if: needs.deploy-sandbox-relay.result == 'success'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Smoke qURL JS-agent relay bootstrap
        if: needs.deploy-sandbox-relay.result == 'success'
        # The helper has three bounded legs (HTML fetch, bundle fetch, relay
        # knock), each controlled by QURL_RELAY_SMOKE_TIMEOUT_MS plus short
        # backoffs. Five minutes keeps headroom without hiding true hangs.
        timeout-minutes: 5
        env:
          QURL_LINK_URL: ${{ steps.qurl-domain-sandbox.outputs.qurl_link_url }}
        run: node scripts/qurl-relay-bootstrap-smoke.mjs "$QURL_LINK_URL"

      - name: Deployment Summary
        env:
          RELAY_DEPLOY_RESULT: ${{ needs.deploy-sandbox-relay.result }}
          NLB_DNS: ${{ needs.deploy-sandbox-infra.outputs.nlb_dns }}
        run: |
          NLB_DISPLAY="${NLB_DNS:-missing — assigned-cell public server NLB required}"
          {
            echo "## Sandbox Deployment Complete"
            echo ""
            echo "### Infrastructure"
            echo "| Component | Strategy | Status |"
            echo "|-----------|----------|--------|"
            echo "| Server + AC | Blue/Green | Deployed ✓ |"
            echo ""
            echo "### Endpoints"
            echo "- **NHP NLB:** \`${NLB_DISPLAY}\`"
            echo "- **etcd:** \`${{ needs.deploy-sandbox-infra.outputs.etcd_endpoint }}\`"
            echo ""
            echo "**Image Tag:** \`${{ needs.setup.outputs.image_tag }}\`"
            echo ""
            echo "### Validation"
            echo "- Post-deployment validation script executed"
            echo "- Integration tests completed (etcd tests skipped without mTLS certs)"
            echo "- E2E demo flow tests executed"
            if [[ "$RELAY_DEPLOY_RESULT" == "success" ]]; then
              echo "- qURL JS-agent relay bootstrap smoke passed"
            else
              echo "- qURL JS-agent relay bootstrap smoke skipped because deploy-sandbox-relay was $RELAY_DEPLOY_RESULT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Record the deployed SHA only after the relay cutover smoke path could run;
      # otherwise scheduled deploy should retry the unverified #2680 cutover.
      - name: Update Deployment Tracking
        if: success() && needs.deploy-sandbox-relay.result == 'success'
        env:
          # Keep this expression in lockstep with sandbox-app-image-drift's
          # HEAD_SHA so both gates evaluate the same target app tree.
          NEW_SHA: ${{ needs.setup.outputs.image_tag }}
        run: |
          set -euo pipefail
          # #2680 treats the JS-agent -> relay cutover as part of a complete
          # sandbox deploy. If the relay leg failed/skipped and the smoke could
          # not run, leave deployed-commit on the previous SHA so the scheduled
          # deploy path retries instead of recording an unverified cutover.
          #
          # Also fail closed on stale live app images. A failed app rollout
          # followed by a successful infra-only deploy must not mark the later
          # SHA as deployed while server/AC/relay still run an older app tree.
          # Re-read live tags here instead of trusting the earlier drift job:
          # blue/green may have switched active color, and this is the
          # authoritative post-switch gate before recording deployed-commit.
          # dispatch-and-poll-blue-green.sh returns success only after the
          # dispatched blue-green-deploy.yml run concludes success. That run's
          # switch-traffic job calls blue-green-switch.sh, which writes
          # active-color before the validate job reconciles listener and SSM
          # state, so success means active-color has already flipped before
          # this post-switch re-read.
          # This proves configured active tags, not per-instance runtime bytes;
          # rollout health checks above remain responsible for ASG convergence.
          # If this trips after rollout, leave deployed-commit stale and fail red
          # so the next deploy retries instead of recording unproven live bytes.
          ./.github/scripts/verify-live-app-images-ready.sh sandbox "$NEW_SHA"

          # Save the current deployed-commit as -previous before overwriting,
          # so sandbox rollback tooling can target the actual previous version
          # (not the current — possibly broken — one). Mirrors the prod pattern
          # in promote-to-prod.yml. Closes the gap surfaced by smoke test
          # TestBlueGreen_DeployedCommitPreviousExists.
          # Region is inherited from the job-level configure-aws-credentials
          # step (line 1304), matching the prod pattern in promote-to-prod.yml.
          CURRENT=$(aws ssm get-parameter \
            --name "/sandbox/nhp/deploy/deployed-commit" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [[ -n "$CURRENT" && "$CURRENT" != "initial" && "$CURRENT" != "$NEW_SHA" ]]; then
            aws ssm put-parameter \
              --name "/sandbox/nhp/deploy/deployed-commit-previous" \
              --value "$CURRENT" --type String --overwrite \
              || echo "::warning::Failed to update SSM /sandbox/nhp/deploy/deployed-commit-previous"
            echo "  Previous commit saved: deployed-commit-previous = $CURRENT"
          fi

          aws ssm put-parameter \
            --name "/sandbox/nhp/deploy/deployed-commit" \
            --value "$NEW_SHA" --type String --overwrite \
            || echo "::warning::Failed to update SSM /sandbox/nhp/deploy/deployed-commit"
          aws ssm put-parameter \
            --name "/sandbox/nhp/deploy/deployed-at" \
            --value "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --type String --overwrite \
            || echo "::warning::Failed to update SSM /sandbox/nhp/deploy/deployed-at"
          echo "::notice::Deployment tracking updated: deployed-commit = $NEW_SHA"

  # ============================================================================
  # NHP SMOKE TESTS (Sandbox)
  #
  # Runs the nhp/tests/smoke suite against the freshly-deployed sandbox.
  # Calls the reusable workflow at .github/workflows/nhp-smoke-tests.yml.
  #
  # Rollout posture:
  #   PR1: tier=tier1, continue-on-error=true (report-only, burn-in)
  #   PR2: tier=tier1+tier2, continue-on-error=true
  #   PR3: tier=all,  continue-on-error=false (required check)
  #
  # GATE: `tier:` and `continue-on-error:` here are load-bearing.
  # Changing either (or adding a `continue-on-error: true` override) needs
  # #1694's threshold recalibration in flight or landed — the Tier 1 fence
  # in tests/smoke/09_ac_redispatch_loop_test.go has an acknowledged
  # 75–125 matches/15min false-negative window during burn-in.
  # CODEOWNERS gates the reusable workflow file (.github/CODEOWNERS); a
  # job-level extraction so the call site here is also gated is in #1721.
  # ============================================================================
  nhp-smoke-sandbox:
    name: NHP Smoke (sandbox)
    needs: [deploy-sandbox-validate]
    if: |
      always() &&
      needs.deploy-sandbox-validate.result == 'success'
    uses: ./.github/workflows/nhp-smoke-tests.yml
    with:
      environment: sandbox
      tier: all
      allow_ssm_probes: true
      qurl_link_origin: ${{ needs.deploy-sandbox-validate.outputs.qurl_link_url }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # ============================================================================
  # PROD DEPLOY - Handled exclusively by promote-to-prod.yml
  # Use ./scripts/trigger-prod-deploy.sh to deploy to production.
  # ============================================================================

  # ============================================================================
  # NOTIFY
  # ============================================================================
  notify:
    name: Notify
    needs:
      - setup
      - changes
      - sandbox-environment-guard
      - sandbox-app-image-drift
      # app-image-build-required labels whether a new app image actually
      # shipped vs. a re-roll.
      - app-image-build-required
      - test
      - test-lambdas
      - build
      # Packer AMI bakes run independently of build/deploy; include so a failed
      # bake surfaces in Slack instead of being masked by a green build
      # (issue #2252 / PR #2251). The matrix result aggregates across
      # sandbox+prod — failure on either leg makes needs.packer-build.result
      # 'failure'.
      - packer-build
      # Sandbox deploy jobs
      - deploy-sandbox-infra
      - deploy-sandbox-blue-green
      # qurl ECS roll (#1634). Included so a failed roll surfaces in Slack
      # instead of being masked by a green build/blue-green — the same
      # surface-the-failure rationale as packer-build above.
      - deploy-sandbox-qurl
      # Relay CD deploy leg (#2624). Same surface-the-failure rationale: a
      # failed relay roll should not be masked by a green build/blue-green.
      # Skips (success) cleanly while the relay is dark (deploy_relay=false).
      - deploy-sandbox-relay
      - deploy-sandbox-validate
      - nhp-smoke-sandbox
    # Skip Slack when the waiter was cancelled (concurrency preempt or
    # manual). The dispatched blue/green sub-workflow runs to completion
    # on its own concurrency group and emits its own SNS-routed Slack
    # (see blue-green-deploy.yml:notify) — silence from here is more
    # accurate than a guess. See PR #1082 for the full rationale.
    #
    # Residual gap (acknowledged, #2252): in the narrow race where blue/green is
    # independently 'cancelled' (concurrency preempt) AND a packer leg failed in
    # the same run, this skip also suppresses the bake-failure alert. The
    # superseding run that caused the preempt re-bakes packer and emits its own
    # notify, so the failure resurfaces on the next run rather than being lost.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.deploy-sandbox-blue-green.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Build phase
          TEST_RESULT: ${{ needs.test.result }}
          TEST_LAMBDAS_RESULT: ${{ needs.test-lambdas.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          # Packer AMI bake (matrix-aggregated across sandbox+prod)
          PACKER_RESULT: ${{ needs.packer-build.result }}
          # Sandbox deploy components
          SANDBOX_INFRA: ${{ needs.deploy-sandbox-infra.result }}
          SANDBOX_BLUE_GREEN: ${{ needs.deploy-sandbox-blue-green.result }}
          SANDBOX_QURL: ${{ needs.deploy-sandbox-qurl.result }}
          SANDBOX_RELAY: ${{ needs.deploy-sandbox-relay.result }}
          SANDBOX_VALIDATE: ${{ needs.deploy-sandbox-validate.result }}
          NHP_SMOKE_RESULT: ${{ needs.nhp-smoke-sandbox.result }}
          # true when a new app image was built this run: either this commit
          # changed app paths, or live sandbox images lagged app changes
          # already present in HEAD and the drift gate forced a rebuild.
          APP_REBUILT: ${{ needs.app-image-build-required.outputs.app_image_build_required }}
          # Metadata
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          START_TIME: ${{ needs.setup.outputs.start_time }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ -z "$SLACK_WEBHOOK" ]]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi

          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          # Calculate duration with sanity check
          END_TIME=$(date +%s)
          if [[ -n "$START_TIME" ]]; then
            DURATION_SECS=$((END_TIME - START_TIME))
            # Sanity check: negative or > 24 hours indicates clock issues
            if [[ $DURATION_SECS -lt 0 || $DURATION_SECS -gt 86400 ]]; then
              DURATION="unknown"
            else
              DURATION_MINS=$((DURATION_SECS / 60))
              DURATION_REMAINING_SECS=$((DURATION_SECS % 60))
              DURATION="${DURATION_MINS}m ${DURATION_REMAINING_SECS}s"
            fi
          else
            DURATION="unknown"
          fi

          # Determine trigger source
          TRIGGER="${{ github.event_name }}"
          case "$TRIGGER" in
            push)
              # Check first line of commit message for merge indicator
              # (COMMIT_MESSAGE env var handles multi-line safely)
              if echo "$COMMIT_MESSAGE" | head -n1 | grep -q "Merge pull request"; then
                TRIGGER_TEXT="PR merge"
              else
                TRIGGER_TEXT="Push"
              fi
              ;;
            pull_request) TRIGGER_TEXT="PR" ;;
            workflow_dispatch) TRIGGER_TEXT="Manual" ;;
            schedule) TRIGGER_TEXT="Scheduled" ;;
            *) TRIGGER_TEXT="$TRIGGER" ;;
          esac

          # Helper to convert result to emoji
          status_emoji() {
            case "$1" in
              success) echo ":white_check_mark:" ;;
              failure) echo ":x:" ;;
              cancelled) echo ":warning:" ;;
              skipped) echo ":white_circle:" ;;
              *) echo ":grey_question:" ;;
            esac
          }

          # Check if any sandbox deploy ran
          SANDBOX_DEPLOYED="false"
          if [[ "$SANDBOX_INFRA" != "skipped" ]]; then
            SANDBOX_DEPLOYED="true"
          fi

          # Build component status strings with visual pipeline
          SANDBOX_STATUS=""
          if [[ "$SANDBOX_DEPLOYED" == "true" ]]; then
            SANDBOX_STATUS="$(status_emoji "$SANDBOX_INFRA") Infra → $(status_emoji "$SANDBOX_BLUE_GREEN") Blue/Green → $(status_emoji "$SANDBOX_QURL") QURL → $(status_emoji "$SANDBOX_RELAY") Relay → $(status_emoji "$SANDBOX_VALIDATE") Validate → $(status_emoji "$NHP_SMOKE_RESULT") Smoke"
          fi

          # Determine overall status and header.
          #
          # Packer AMI bakes run independently of the build/deploy pipeline. On a
          # main push a bake failure skips Terraform Pre-Deploy Checks (gated on
          # packer success-or-skip) → deploy-sandbox-infra → SANDBOX_DEPLOYED=false,
          # which would otherwise fall into the "$BUILD_RESULT == success" branch and
          # render a green "NHP Build successful", hiding the failure (issue #2252;
          # this is how the #2239 AC-AMI bug stayed silent for ~12h). Surface it as a
          # top-level failure first. Only 'failure' forces red: 'skipped' (the PR
          # path, where packer-build doesn't run) is ignored, and a no-op bake that
          # finds the AMI already present reports 'success' (not 'skipped'), which
          # falls through harmlessly. build/test failures still land in the elif chain.
          if [[ "$PACKER_RESULT" == "failure" ]]; then
            COLOR="#dc3545"
            EMOJI="x"
            HEADER="NHP Packer AMI Build"
            STATUS_TEXT="failed"
          elif [[ "$BUILD_RESULT" == "success" ]]; then
            # Check for any deploy or validation failures
            DEPLOY_FAILED="false"
            for result in "$SANDBOX_INFRA" "$SANDBOX_BLUE_GREEN" "$SANDBOX_QURL" "$SANDBOX_RELAY" "$SANDBOX_VALIDATE" "$NHP_SMOKE_RESULT"; do
              if [[ "$result" == "failure" ]]; then
                DEPLOY_FAILED="true"
                break
              fi
            done
            # Smoke is a required signal — a cancelled smoke means we
            # never confirmed post-deploy health. Treat as failure.
            # Other components have dedicated cancelled-handling branches
            # below (infra -> yellow, blue-green -> Notify skipped via
            # job if:), so only smoke needs this here.
            if [[ "$NHP_SMOKE_RESULT" == "cancelled" ]]; then
              DEPLOY_FAILED="true"
            fi

            # DEPLOY_FAILED is checked BEFORE validate-success: a green validate
            # must not mask a failed (or cancelled) smoke or blue/green. Reversing
            # these renders a deploy with a red smoke as a green "successful"
            # (the bug this fixes; e.g. #2229/#2230 posted green with :x: Smoke).
            # This ordering is fenced by check-packer-failure-surfaced.sh (A5).
            if [[ "$DEPLOY_FAILED" == "true" ]]; then
              COLOR="#dc3545"
              EMOJI="x"
              HEADER="NHP Server + AC Sandbox Deploy"
              STATUS_TEXT="failed"
            elif [[ "$SANDBOX_VALIDATE" == "success" ]]; then
              COLOR="#36a64f"
              EMOJI="white_check_mark"
              HEADER="NHP Server + AC Sandbox Deploy"
              STATUS_TEXT="successful"
            elif [[ "$SANDBOX_DEPLOYED" == "false" ]]; then
              COLOR="#36a64f"
              EMOJI="white_check_mark"
              HEADER="NHP Build"
              STATUS_TEXT="successful"
            elif [[ "$SANDBOX_INFRA" == "cancelled" ]]; then
              COLOR="#ffc107"
              EMOJI="warning"
              HEADER="NHP Server + AC Deploy"
              STATUS_TEXT="cancelled"
            else
              COLOR="#dc3545"
              EMOJI="x"
              HEADER="NHP Server + AC Deploy"
              STATUS_TEXT="incomplete"
            fi
          elif [[ "$BUILD_RESULT" == "failure" || "$TEST_RESULT" == "failure" ]]; then
            COLOR="#dc3545"
            EMOJI="x"
            HEADER="NHP Build"
            STATUS_TEXT="failed"
          elif [[ "$BUILD_RESULT" == "cancelled" ]]; then
            COLOR="#ffc107"
            EMOJI="warning"
            HEADER="NHP Build"
            STATUS_TEXT="cancelled"
          else
            COLOR="#ffc107"
            EMOJI="warning"
            HEADER="NHP"
            STATUS_TEXT="incomplete"
          fi

          # App-image line: distinguish a real app-image ship from a re-roll of
          # the existing image (terraform/config/CI-only deploys re-deploy the
          # same binary). Without this, a green re-roll is indistinguishable from
          # shipping the commit's code — which is how a stale binary can look
          # "live" for days. Only meaningful when a sandbox deploy ran.
          #
          # "rebuilt" tracks APP_REBUILT, i.e. a new sha-tagged image was
          # built+pushed because this commit touched app paths OR because live
          # sandbox images lagged app changes already present in HEAD. Note the
          # app path filter also includes .trivyignore, so a .trivyignore-only
          # commit reads "rebuilt" even though the Go/Docker bytes are identical
          # — still accurate (a new image is produced and rolled), just not a
          # source-code change.
          APP_IMAGE=""
          if [[ "$SANDBOX_DEPLOYED" == "true" ]]; then
            if [[ "$APP_REBUILT" == "true" ]]; then
              APP_IMAGE="rebuilt → \`${IMAGE_TAG:0:7}\`"
            elif [[ "$APP_REBUILT" == "false" ]]; then
              APP_IMAGE="unchanged — infra/config only (app binary not rebuilt)"
            else
              # APP_REBUILT empty: the changes job was skipped/failed, so we
              # can't tell whether a new image shipped. Don't claim "unchanged"
              # (it could be wrong) — say so explicitly.
              APP_IMAGE="rebuild status unknown (changes job did not report)"
            fi
          fi

          # Build the blocks array with improved layout
          BLOCKS="[
            {
              \"type\": \"section\",
              \"text\": {
                \"type\": \"mrkdwn\",
                \"text\": \":$EMOJI: *$HEADER* $STATUS_TEXT\"
              }
            },
            {
              \"type\": \"section\",
              \"fields\": [
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Branch:*\n\`${{ github.ref_name }}\` ($SHORT_SHA)\"
                },
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Trigger:*\n$TRIGGER_TEXT by ${{ github.actor }}\"
                },
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Tests:*\n$(status_emoji "$TEST_RESULT")\"
                },
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Build (Server + AC):*\n$(status_emoji "$BUILD_RESULT")\"
                },
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \"*Packer AMI:*\n$(status_emoji "$PACKER_RESULT")\"
                }
              ]
            }"

          # Add sandbox component status if deployed
          if [[ "$SANDBOX_DEPLOYED" == "true" ]]; then
            BLOCKS="$BLOCKS,
            {
              \"type\": \"section\",
              \"text\": {
                \"type\": \"mrkdwn\",
                \"text\": \"*Sandbox:* $SANDBOX_STATUS\"
              }
            }"
          fi

          # Add the app-image line so a re-roll can't masquerade as a fresh ship
          if [[ -n "$APP_IMAGE" ]]; then
            BLOCKS="$BLOCKS,
            {
              \"type\": \"section\",
              \"text\": {
                \"type\": \"mrkdwn\",
                \"text\": \"*App image:* $APP_IMAGE\"
              }
            }"
          fi

          # Add commit message (first line, truncated to 100 chars, backticks escaped)
          COMMIT_FIRST_LINE=$(echo "$COMMIT_MESSAGE" | head -n1 | cut -c1-100 | sed 's/`/'"'"'/g')
          if [[ -n "$COMMIT_FIRST_LINE" ]]; then
            BLOCKS="$BLOCKS,
            {
              \"type\": \"section\",
              \"text\": {
                \"type\": \"mrkdwn\",
                \"text\": \"*Commit:* \`$COMMIT_FIRST_LINE\`\"
              }
            }"
          fi

          # Add footer with duration, commit link, and workflow link
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          BLOCKS="$BLOCKS,
            {
              \"type\": \"context\",
              \"elements\": [
                {
                  \"type\": \"mrkdwn\",
                  \"text\": \":stopwatch: $DURATION  |  <$COMMIT_URL|$SHORT_SHA>  |  <$WORKFLOW_URL|View workflow>\"
                }
              ]
            }
          ]"

          curl -sfS -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"blocks\": $BLOCKS
              }]
            }" || echo "Slack notification failed (non-critical)"
