name: Sandbox UDP Proof Readiness

# The attended UDP proof is slow, needs live AWS and a dedicated runner, and is
# gated on a human. A precondition that broke hours earlier is therefore found at
# the most expensive possible moment: six producer runs died one-at-a-time in a
# single day, each on something that had already been true for a while.
#
# This turns those into an alert minutes after they happen. It is READ-ONLY --
# it diagnoses and never mutates, so it is safe to run unattended.
on:
  schedule:
    - cron: '17 * * * *'   # hourly, offset off the hour to dodge scheduler pileups
  workflow_dispatch:

permissions: {}

concurrency:
  group: sandbox-proof-readiness
  cancel-in-progress: true  # A queued readiness check has no value; the next run re-reads live state.

jobs:
  readiness:
    name: Is sandbox ready for the UDP proof?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Check sandbox proof readiness
        run: bash .github/scripts/check-sandbox-proof-readiness.sh
