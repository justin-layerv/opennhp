name: UDP proof retirement aggregate (sandbox, attended)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type AGGREGATE_UDP_PROOF to authenticate the complete proof.'
        required: true
        type: string
      proof_phase:
        description: Exact HTTP-lifecycle retirement phase
        required: true
        type: choice
        options:
          - pre_removal
          - post_removal
      deployment_producer_run_id:
        description: Exact trusted-main deployment producer run ID
        required: true
        type: string
      connector_controller_run_id:
        description: Successful Connector controller run ID
        required: true
        type: string
      qurl_go_controller_run_id:
        description: Successful qurl-go controller run ID
        required: true
        type: string

concurrency:
  group: udp-proof-retirement-aggregate
  cancel-in-progress: false

permissions: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require an exact trusted-main aggregate dispatch
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "AGGREGATE_UDP_PROOF"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Authenticate Connector controller bundle
        id: connector
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.connector_controller_run_id }}
          PROOF_PHASE: ${{ inputs.proof_phase }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            >"${RUNNER_TEMP}/connector-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            >"${RUNNER_TEMP}/connector-artifacts.json"
          python3 .github/scripts/validate_udp_proof_controller_bundle.py metadata \
            --run-json "${RUNNER_TEMP}/connector-run.json" \
            --artifacts-json "${RUNNER_TEMP}/connector-artifacts.json" \
            --client connector \
            --proof-phase "$PROOF_PHASE" \
            --run-id "$RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Authenticate qurl-go controller bundle
        id: qurl_go
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qurl_go_controller_run_id }}
          PROOF_PHASE: ${{ inputs.proof_phase }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            >"${RUNNER_TEMP}/qurl-go-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            >"${RUNNER_TEMP}/qurl-go-artifacts.json"
          python3 .github/scripts/validate_udp_proof_controller_bundle.py metadata \
            --run-json "${RUNNER_TEMP}/qurl-go-run.json" \
            --artifacts-json "${RUNNER_TEMP}/qurl-go-artifacts.json" \
            --client qurl_go \
            --proof-phase "$PROOF_PHASE" \
            --run-id "$RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require independent controllers on one NHP revision
        env:
          CONNECTOR_RUN_ID: ${{ steps.connector.outputs.run_id }}
          CONNECTOR_HEAD_SHA: ${{ steps.connector.outputs.head_sha }}
          QURL_GO_RUN_ID: ${{ steps.qurl_go.outputs.run_id }}
          QURL_GO_HEAD_SHA: ${{ steps.qurl_go.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$CONNECTOR_RUN_ID" != "$QURL_GO_RUN_ID"
          test "$CONNECTOR_HEAD_SHA" = "$QURL_GO_HEAD_SHA"

      - name: Download exact Connector controller bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.connector.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.connector.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/connector-controller
          merge-multiple: true
          digest-mismatch: error

      - name: Download exact qurl-go controller bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.qurl_go.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.qurl_go.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qurl-go-controller
          merge-multiple: true
          digest-mismatch: error

      - name: Validate exact controller bundle files
        env:
          PROOF_PHASE: ${{ inputs.proof_phase }}
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_udp_proof_controller_bundle.py files \
            --directory "${RUNNER_TEMP}/connector-controller" \
            --client connector \
            --proof-phase "$PROOF_PHASE" \
            --run-id "${{ steps.connector.outputs.run_id }}" \
            --run-attempt "${{ steps.connector.outputs.run_attempt }}" \
            --head-sha "${{ steps.connector.outputs.head_sha }}" \
            --github-output "${RUNNER_TEMP}/connector-files.outputs"
          python3 .github/scripts/validate_udp_proof_controller_bundle.py files \
            --directory "${RUNNER_TEMP}/qurl-go-controller" \
            --client qurl_go \
            --proof-phase "$PROOF_PHASE" \
            --run-id "${{ steps.qurl_go.outputs.run_id }}" \
            --run-attempt "${{ steps.qurl_go.outputs.run_attempt }}" \
            --head-sha "${{ steps.qurl_go.outputs.head_sha }}" \
            --github-output "${RUNNER_TEMP}/qurl-go-files.outputs"

      - name: Authenticate deployment producer artifact
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.deployment_producer_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            >"${RUNNER_TEMP}/producer-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            >"${RUNNER_TEMP}/producer-artifacts.json"
          python3 .github/scripts/validate_udp_proof_producer_artifact.py metadata \
            --run-json "${RUNNER_TEMP}/producer-run.json" \
            --artifacts-json "${RUNNER_TEMP}/producer-artifacts.json" \
            --producer-run-id "$RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact deployment producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.producer.outputs.producer_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.producer.outputs.producer_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/producer
          merge-multiple: true
          digest-mismatch: error

      - name: Require controller attestations to bind the authenticated producer
        env:
          PRODUCER_RUN_ID: ${{ steps.producer.outputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ steps.producer.outputs.producer_run_attempt }}
          PRODUCER_HEAD_SHA: ${{ steps.producer.outputs.producer_head_sha }}
          PRODUCER_ARTIFACT_ID: ${{ steps.producer.outputs.producer_artifact_id }}
          PRODUCER_ARTIFACT_DIGEST: ${{ steps.producer.outputs.producer_artifact_digest }}
        run: |
          set -euo pipefail
          for client in connector qurl-go; do
            jq -e \
              --argjson run_id "$PRODUCER_RUN_ID" \
              --argjson run_attempt "$PRODUCER_RUN_ATTEMPT" \
              --arg head_sha "$PRODUCER_HEAD_SHA" \
              --argjson artifact_id "$PRODUCER_ARTIFACT_ID" \
              --arg artifact_digest "$PRODUCER_ARTIFACT_DIGEST" '
                .producer_artifact.run_id == $run_id and
                .producer_artifact.run_attempt == $run_attempt and
                .producer_artifact.head_sha == $head_sha and
                .producer_artifact.artifact_id == $artifact_id and
                .producer_artifact.artifact_digest == $artifact_digest
              ' "${RUNNER_TEMP}/${client}-controller/controller-attestation.json" \
              >/dev/null
          done

      - name: Assemble exact seven-row NHP runtime evidence
        env:
          PROOF_PHASE: ${{ inputs.proof_phase }}
        run: |
          set -euo pipefail
          python3 .github/scripts/collect_udp_proof_runtime_evidence.py \
            --connector-attestation \
              "${RUNNER_TEMP}/connector-controller/controller-attestation.json" \
            --qurl-go-attestation \
              "${RUNNER_TEMP}/qurl-go-controller/controller-attestation.json" \
            --proof-phase "$PROOF_PHASE" \
            --output "${RUNNER_TEMP}/orchestrator-runtime-evidence.json"

      - name: Require exact 46 + 11 + 11 owner coverage
        env:
          PROOF_PHASE: ${{ inputs.proof_phase }}
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_udp_proof_aggregate.py \
            --proof-phase "$PROOF_PHASE" \
            --qurl-go-inventory \
              "${RUNNER_TEMP}/qurl-go-controller/client-artifact/pre_retirement_scenarios.json" \
            --connector-inventory \
              "${RUNNER_TEMP}/connector-controller/client-artifact/strict-proof-scenarios.json" \
            --qurl-go-evidence \
              "${RUNNER_TEMP}/qurl-go-controller/client-artifact/native-udp-sandbox.evidence.json" \
            --connector-evidence \
              "${RUNNER_TEMP}/connector-controller/client-artifact/strict-sandbox-proof.evidence.json" \
            --static-nhp-evidence \
              "${RUNNER_TEMP}/producer/orchestrator-evidence.json" \
            --runtime-nhp-evidence \
              "${RUNNER_TEMP}/orchestrator-runtime-evidence.json" \
            --output "${RUNNER_TEMP}/udp-proof-aggregate.json"

      - name: Upload authenticated aggregate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: udp-proof-retirement-aggregate-${{ inputs.proof_phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/orchestrator-runtime-evidence.json
            ${{ runner.temp }}/udp-proof-aggregate.json
          if-no-files-found: error
          retention-days: 30

      - name: Record aggregate result
        run: |
          {
            echo "### UDP retirement aggregate"
            echo
            echo "- Phase: \`${{ inputs.proof_phase }}\`"
            echo "- Coverage: \`46 qurl-go + 11 Connector + 11 NHP = 68\`"
            echo "- Connector controller: \`${{ steps.connector.outputs.run_id }}\`"
            echo "- qurl-go controller: \`${{ steps.qurl_go.outputs.run_id }}\`"
            echo "- Deployment producer: \`${{ steps.producer.outputs.producer_run_id }}\`"
          } >>"$GITHUB_STEP_SUMMARY"
