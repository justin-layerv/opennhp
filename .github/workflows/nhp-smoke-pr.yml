name: NHP Smoke (PR)

# Runs the smoke harness at PR time, with NO AWS credentials and NO secrets:
#
#   1. smoke-build — compile + vet the smoke suite under -tags=smoke and run
#      the tier-filter coverage fence. The smoke module is otherwise never
#      built at PR time (codeql builds nhp/internalauth/endpoints only), so a
#      smoke test that doesn't compile currently only fails post-deploy on
#      main, where it blocks the deploy pipeline. This closes that gap.
#
#   2. smoke-local — bring up the self-contained local stack (nhp-server +
#      nhp-ac + dynamodb-local) via scripts/run-smoke.sh (TARGET=local) and run
#      the wire-contract `local` tier against the PR's freshly-built binaries.
#      This is the only smoke path that exercises a PR's OWN code:
#      the deployed sandbox/prod smoke (nhp-smoke-tests.yml) runs against
#      already-deployed binaries.
#
# Both jobs are safe for fork PRs — no OIDC role, no Secrets Manager, no
# deployed environment is touched.

on:
  pull_request:
    branches:
      - main
    paths:
      - "tests/smoke/**"
      # The restart-evidence decision table shared with the blue/green deploy
      # gate. A corpus-only edit changes what this suite must agree with, so it
      # has to re-run the drift fence even though no Go file moved.
      - "tests/fixtures/nhp-server-restart-evidence/**"
      # The journal corpus one level earlier, pinning the two COLLECTORS against
      # each other rather than the two decision tables.
      - "tests/fixtures/nhp-server-restart-journals/**"
      # The gate's on-instance collector itself. It is the thing this suite's
      # --grep probes and parsers have to agree with, so a change there has to
      # re-run TestRestartEvidenceJournalCorpus — the direction that actually
      # needs catching, since a smoke-side edit already trips these paths.
      - ".github/scripts/verify-knock-ready.sh"
      - "scripts/run-smoke.sh"
      - "scripts/smoke-local-stack.sh"
      - "scripts/check-smoke-tier-filter-coverage.sh"
      - "endpoints/server/**"
      - "endpoints/ac/**"
      - "endpoints/go.mod"
      - "endpoints/go.sum"
      - "nhp/**"
      - "internalauth/**"
      - "docker/nhp-server/templates/**"
      - ".github/workflows/nhp-smoke-pr.yml"

permissions: {}

concurrency:
  group: nhp-smoke-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke-build:
    name: Smoke build + vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/smoke/go.mod
          cache-dependency-path: tests/smoke/go.sum

      # go build + go vet under -tags=smoke, plus the tier-filter coverage
      # fence. Mirrors `make smoke-build` (kept as a shell step so the failure
      # output is inline rather than behind a make recipe).
      - name: Build + vet smoke suite
        working-directory: tests/smoke
        run: |
          set -euo pipefail
          go build -tags=smoke ./...
          go vet -tags=smoke ./...

      # The offline half of the suite. These need no AWS, no deployed
      # environment and no SSM (NHP_ENVIRONMENT=local short-circuits TestMain
      # before it builds any AWS client), so they belong on the credential-free
      # PR path — and they only run if something actually runs them: build+vet
      # above compiles a test without executing a single assertion.
      #
      # TestRestartEvidenceCorpus is the drift fence between this suite's
      # classifier and the blue/green deploy gate's shell one. The two answer
      # the same question — is a non-zero systemd NRestarts an application
      # crash, or a docker container-start failure that already self-healed? —
      # and cannot share code, so they share
      # tests/fixtures/nhp-server-restart-evidence/ and are each driven over
      # it. Changing one decision table without the other turns this red.
      # -v and the guard below are load-bearing, not verbosity for its own
      # sake: `go test -run` EXITS 0 when its pattern matches nothing, printing
      # "ok ... [no tests to run]". A future rename or a typo in that pattern
      # would turn this whole step into a green no-op, which is exactly the
      # kind of guard-that-cannot-fail this PR exists to remove. -v puts the
      # executed test names in the log; the grep turns the silent pass red.
      - name: Test restart-evidence classification (offline)
        working-directory: tests/smoke
        env:
          NHP_ENVIRONMENT: local
        run: |
          set -euo pipefail
          go test -tags=smoke -count=1 -v \
            -run 'TestRestartEvidence|TestSendJournalGrepMapsNoMatchesToEmpty|TestParseSystemdExitLines|TestLastMeaningfulDaemonError|TestParallelSubtestsDontInheritCanceledCtx' \
            ./... | tee test-output.txt
          if grep -q 'no tests to run' test-output.txt; then
            echo "::error::The -run pattern matched no tests — this step passed without asserting anything."
            exit 1
          fi
          rm -f test-output.txt

      - name: Check smoke tier filter coverage
        run: bash scripts/check-smoke-tier-filter-coverage.sh

  smoke-local:
    name: Smoke (local stack)
    needs: smoke-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/smoke/go.mod
          cache-dependency-path: tests/smoke/go.sum

      # Docker and the AWS CLI are preinstalled on ubuntu-latest; run-smoke.sh
      # uses them to bring up dynamodb-local + nhp-server and create the local
      # tables. No AWS credentials are needed (dynamodb-local ignores them).
      - name: Run local-stack smoke
        env:
          TARGET: local
        run: ./scripts/run-smoke.sh

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nhp-smoke-pr-local-output
          path: tests/smoke/test-output.txt
          retention-days: 7
