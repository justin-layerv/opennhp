name: Promote to Production

# Enterprise-grade promotion workflow. Deploys existing sandbox ECR images to prod
# using proven deployment mechanisms (canary for server/AC, ECS task def for QURL).
#
# Deployment flow:
#   manifest → preflight (approval) → terraform-plan (shows diff)
#           → terraform-apply (approval) → deploy-server (canary)
#           → deploy-ac (canary) → deploy-qurl (ECS)
#           → smoke-test → monitor → finalize
#
# Usage:
#   # Full promotion (all components)
#   gh workflow run promote-to-prod.yml --ref main \
#     -f image_tag=<commit-sha> -f deploy_server=true -f deploy_ac=true \
#     -f deploy_qurl=true -f run_terraform=true
#
#   # Terraform-only (no service restarts — default behavior)
#   gh workflow run promote-to-prod.yml --ref main \
#     -f image_tag=<commit-sha>
#
#   # Terraform + QURL (e.g., new env vars in task definition)
#   gh workflow run promote-to-prod.yml --ref main \
#     -f image_tag=<commit-sha> -f deploy_qurl=true
#
#   # QURL-only deployment
#   gh workflow run promote-to-prod.yml --ref main \
#     -f image_tag=<any-valid-sha> -f deploy_qurl=true \
#     -f qurl_image_tag=<qurl-tag>
#
#   # Rollback to previous known-good state
#   gh workflow run promote-to-prod.yml --ref main \
#     -f image_tag=<any-valid-sha> -f rollback=true
#
#   # Recommended: use the trigger script for automatic change detection
#   ./scripts/trigger-prod-deploy.sh

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Commit SHA for NHP Server + AC images in sandbox ECR'
        required: true
        type: string
      qurl_image_tag:
        description: 'QURL service image tag (reads from sandbox SSM if empty)'
        required: false
        default: ''
        type: string
      run_terraform:
        description: 'Run terraform apply (required for first deploy or infra changes)'
        required: false
        default: true
        type: boolean
      deploy_server:
        description: 'Deploy NHP Server via canary'
        required: false
        default: false
        type: boolean
      deploy_ac:
        description: 'Deploy Access Controller via canary'
        required: false
        default: false
        type: boolean
      deploy_qurl:
        description: 'Deploy QURL Service via ECS task definition'
        required: false
        default: false
        type: boolean
      cell_id:
        description: 'Target cell identifier'
        required: false
        default: 'cell0'
        type: string
      rollback:
        description: 'Rollback to previous deployed-commit from SSM'
        required: false
        default: false
        type: boolean
      force_unlock:
        description: 'Force-release a stale deployment lock (e.g., from a cancelled workflow)'
        required: false
        default: false
        type: boolean
      ami_max_age_days:
        description: 'Fail if the prod NHP Server AMI is older than this many days. Default targets the AMI rebuild cadence (every ~6 weeks); tighten if rebuilds become more frequent.'
        required: false
        default: '60'
        type: string
      force_stale_ami:
        description: 'Bypass the AMI age check (use only for intentional rollback to an older known-good image, or while a fresh AMI is rebuilding).'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  actions: write  # needed for gh workflow run dispatch

concurrency:
  group: promote-to-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.14.3'
  PROD_MGMT_ACCOUNT_ID: '165115313779'
  PROD_ACCOUNT_ID: '235500187906'
  SANDBOX_ACCOUNT_ID: '767397897469'
  ECR_SERVER_REPO: 'layerv/nhp-server'
  ECR_AC_REPO: 'layerv/nhp-ac'
  ECR_QURL_REPO: 'layerv/nhp-qurl'
  PROD_SSM_PREFIX: 'layerv-nhp-prod'

jobs:
  # =============================================================================
  # MANIFEST - Pre-approval promotion summary (NO environment gate)
  # =============================================================================
  manifest:
    name: Promotion Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      qurl_image_tag: ${{ steps.resolve-qurl-tag.outputs.qurl_image_tag }}
      current_prod_qurl_tag: ${{ steps.prod-state.outputs.qurl_tag }}
      effective_image_tag: ${{ steps.resolve-rollback.outputs.effective_image_tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Validate image_tag format
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! echo "$IMAGE_TAG" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "::error::image_tag must be a 7-40 character hex commit SHA, got: '$IMAGE_TAG'"
            exit 1
          fi
          if ! git rev-parse --verify "${IMAGE_TAG}^{commit}" > /dev/null 2>&1; then
            echo "::error::Commit $IMAGE_TAG not found in this repository"
            exit 1
          fi
          echo "Image tag valid: $IMAGE_TAG (commit exists in repo)"

      - name: Configure AWS credentials (sandbox - read-only)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve QURL image tag
        id: resolve-qurl-tag
        env:
          QURL_IMAGE_TAG_INPUT: ${{ inputs.qurl_image_tag }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          if [[ -n "$QURL_IMAGE_TAG_INPUT" ]]; then
            echo "Using provided QURL image tag: $QURL_IMAGE_TAG_INPUT"
            echo "qurl_image_tag=$QURL_IMAGE_TAG_INPUT" >> "$GITHUB_OUTPUT"
          elif [[ "$ROLLBACK" == "true" && "$DEPLOY_QURL" == "true" ]]; then
            echo "::error::rollback=true with deploy_qurl=true requires an explicit qurl_image_tag."
            echo "::error::QURL is not tracked by deployed-commit, so automatic rollback is not possible."
            echo "::error::Either provide qurl_image_tag or set deploy_qurl=false."
            exit 1
          else
            echo "No QURL image tag provided, reading from sandbox SSM..."
            QURL_TAG=$(aws ssm get-parameter \
              --name "/layerv-nhp-sandbox/qurl-api-image-tag" \
              --query "Parameter.Value" --output text 2>/dev/null || echo "")
            if [[ -z "$QURL_TAG" || "$QURL_TAG" == "latest" ]]; then
              echo "::warning::Could not resolve QURL image tag from sandbox SSM"
              echo "qurl_image_tag=" >> "$GITHUB_OUTPUT"
            else
              echo "Resolved QURL image tag from sandbox SSM: $QURL_TAG"
              echo "qurl_image_tag=$QURL_TAG" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Gather sandbox state
        id: sandbox-state
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          SANDBOX_ACTIVE_COLOR=$(aws ssm get-parameter \
            --name "/sandbox/nhp/server/active-color" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "unknown")
          SANDBOX_SERVER_TAG=$(aws ssm get-parameter \
            --name "/sandbox/nhp/server/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "unknown")
          SANDBOX_AC_TAG=$(aws ssm get-parameter \
            --name "/sandbox/nhp/ac/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "unknown")
          SANDBOX_QURL_TAG=$(aws ssm get-parameter \
            --name "/layerv-nhp-sandbox/qurl-api-image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "unknown")

          # Calculate soak duration
          SANDBOX_DEPLOYED_AT=$(aws ssm get-parameter \
            --name "/sandbox/nhp/deploy/deployed-at" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [[ -n "$SANDBOX_DEPLOYED_AT" && "$SANDBOX_DEPLOYED_AT" != "initial" ]]; then
            DEPLOYED_EPOCH=$(date -d "$SANDBOX_DEPLOYED_AT" +%s 2>/dev/null || echo "0")
            NOW_EPOCH=$(date +%s)
            if [[ "$DEPLOYED_EPOCH" -gt 0 ]]; then
              SOAK_SECONDS=$(( NOW_EPOCH - DEPLOYED_EPOCH ))
              SOAK_HOURS=$(( SOAK_SECONDS / 3600 ))
              if [[ "$SOAK_HOURS" -gt 0 ]]; then
                SOAK_DURATION="${SOAK_HOURS}h"
              else
                SOAK_MINUTES=$(( SOAK_SECONDS / 60 ))
                SOAK_DURATION="${SOAK_MINUTES}m"
              fi
            else
              SOAK_DURATION="unknown"
            fi
          else
            SOAK_DURATION="unknown"
          fi

          {
            echo "active_color=$SANDBOX_ACTIVE_COLOR"
            echo "server_tag=$SANDBOX_SERVER_TAG"
            echo "ac_tag=$SANDBOX_AC_TAG"
            echo "qurl_tag=$SANDBOX_QURL_TAG"
            echo "soak_duration=$SOAK_DURATION"
          } >> "$GITHUB_OUTPUT"

      - name: Get image metadata from ECR
        id: ecr-metadata
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          QURL_IMAGE_TAG: ${{ steps.resolve-qurl-tag.outputs.qurl_image_tag }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_AC: ${{ inputs.deploy_ac }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
        run: |
          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            SERVER_PUSHED=$(aws ecr describe-images \
              --repository-name "$ECR_SERVER_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" --output text 2>/dev/null || echo "N/A")
          else
            SERVER_PUSHED="N/A"
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            AC_PUSHED=$(aws ecr describe-images \
              --repository-name "$ECR_AC_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" --output text 2>/dev/null || echo "N/A")
          else
            AC_PUSHED="N/A"
          fi

          if [[ "$DEPLOY_QURL" == "true" && -n "$QURL_IMAGE_TAG" ]]; then
            QURL_PUSHED=$(aws ecr describe-images \
              --repository-name "$ECR_QURL_REPO" \
              --image-ids imageTag="$QURL_IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" --output text 2>/dev/null || echo "N/A")
          else
            QURL_PUSHED="N/A"
          fi

          {
            echo "server_pushed=$SERVER_PUSHED"
            echo "ac_pushed=$AC_PUSHED"
            echo "qurl_pushed=$QURL_PUSHED"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (prod - for state read)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read current prod state
        id: prod-state
        run: |
          PROD_SERVER_TAG=$(aws ssm get-parameter \
            --name "/prod/nhp/server/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "not deployed")
          PROD_AC_TAG=$(aws ssm get-parameter \
            --name "/prod/nhp/ac/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "not deployed")
          PROD_QURL_TAG=$(aws ssm get-parameter \
            --name "/${PROD_SSM_PREFIX}/qurl-api-image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "not deployed")
          PROD_DEPLOYED_COMMIT=$(aws ssm get-parameter \
            --name "/prod/nhp/deploy/deployed-commit" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "not deployed")

          {
            echo "server_tag=$PROD_SERVER_TAG"
            echo "ac_tag=$PROD_AC_TAG"
            echo "qurl_tag=$PROD_QURL_TAG"
            echo "deployed_commit=$PROD_DEPLOYED_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve rollback target
        id: resolve-rollback
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          if [[ "$ROLLBACK" == "true" ]]; then
            # Read deployed-commit-previous (the version before the current deploy),
            # NOT deployed-commit (which is the currently deployed — possibly broken — version)
            echo "Rollback mode: reading deployed-commit-previous from prod SSM..."
            PREV_COMMIT=$(aws ssm get-parameter \
              --name "/prod/nhp/deploy/deployed-commit-previous" \
              --query "Parameter.Value" --output text 2>/dev/null || echo "")
            if [[ -n "$PREV_COMMIT" && "$PREV_COMMIT" != "initial" ]]; then
              echo "Previous deployed-commit: $PREV_COMMIT"
              echo "effective_image_tag=$PREV_COMMIT" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::No deployed-commit-previous in SSM. Falling back to provided image_tag."
              echo "effective_image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "effective_image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PROD_DEPLOYED_COMMIT: ${{ steps.prod-state.outputs.deployed_commit }}
        run: |
          CHANGELOG=""
          if [[ -n "$PROD_DEPLOYED_COMMIT" && "$PROD_DEPLOYED_COMMIT" != "not deployed" && "$PROD_DEPLOYED_COMMIT" != "initial" ]]; then
            if git rev-parse --verify "${PROD_DEPLOYED_COMMIT}^{commit}" > /dev/null 2>&1; then
              CHANGELOG=$(git log --oneline "${PROD_DEPLOYED_COMMIT}..${IMAGE_TAG}" 2>/dev/null || echo "Unable to generate changelog")
            else
              CHANGELOG="Previous commit $PROD_DEPLOYED_COMMIT not found in local repo"
            fi
          else
            CHANGELOG="First deployment (no previous commit tracked)"
          fi

          # Store changelog in output (escape for multiline)
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write promotion manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          EFFECTIVE_TAG: ${{ steps.resolve-rollback.outputs.effective_image_tag }}
          QURL_IMAGE_TAG: ${{ steps.resolve-qurl-tag.outputs.qurl_image_tag }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_AC: ${{ inputs.deploy_ac }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
          RUN_TERRAFORM: ${{ inputs.run_terraform }}
          ROLLBACK: ${{ inputs.rollback }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          # Sandbox state
          SB_ACTIVE_COLOR: ${{ steps.sandbox-state.outputs.active_color }}
          SB_SERVER_TAG: ${{ steps.sandbox-state.outputs.server_tag }}
          SB_AC_TAG: ${{ steps.sandbox-state.outputs.ac_tag }}
          SB_QURL_TAG: ${{ steps.sandbox-state.outputs.qurl_tag }}
          SB_SOAK: ${{ steps.sandbox-state.outputs.soak_duration }}
          # ECR metadata
          SERVER_PUSHED: ${{ steps.ecr-metadata.outputs.server_pushed }}
          AC_PUSHED: ${{ steps.ecr-metadata.outputs.ac_pushed }}
          QURL_PUSHED: ${{ steps.ecr-metadata.outputs.qurl_pushed }}
          # Prod state
          PROD_SERVER_TAG: ${{ steps.prod-state.outputs.server_tag }}
          PROD_AC_TAG: ${{ steps.prod-state.outputs.ac_tag }}
          PROD_QURL_TAG: ${{ steps.prod-state.outputs.qurl_tag }}
          PROD_DEPLOYED_COMMIT: ${{ steps.prod-state.outputs.deployed_commit }}
        run: |
          # Get commit info
          COMMIT_MSG=$(git log -1 --format="%s" "$IMAGE_TAG" 2>/dev/null || echo "unknown")
          COMMIT_DATE=$(git log -1 --format="%ci" "$IMAGE_TAG" 2>/dev/null || echo "unknown")
          COMMIT_AUTHOR=$(git log -1 --format="%an" "$IMAGE_TAG" 2>/dev/null || echo "unknown")

          # Determine tag match
          if [[ "$SB_SERVER_TAG" == *"$IMAGE_TAG"* ]]; then
            TAG_MATCH="matches active sandbox ($SB_ACTIVE_COLOR)"
          else
            TAG_MATCH="does NOT match active sandbox (active=$SB_ACTIVE_COLOR, tag=$SB_SERVER_TAG)"
          fi

          {
            echo "## Promotion Manifest"
            echo ""

            # Rollback banner
            if [[ "$ROLLBACK" == "true" ]]; then
              echo "> :warning: **ROLLBACK MODE** — deploying previous known-good commit: \`$EFFECTIVE_TAG\`"
              if [[ "$DEPLOY_QURL" == "true" ]]; then
                echo "> :information_source: **Note:** QURL rollback is not automatic. The QURL service uses a separate image tag that is not tracked by \`deployed-commit\`. Provide \`qurl_image_tag\` explicitly to roll back QURL."
              fi
              echo ""
            fi

            # Artifacts table
            echo "### Artifacts"
            echo "| Component | Image | Tag | Built | Deploy |"
            echo "|-----------|-------|-----|-------|--------|"
            if [[ "$DEPLOY_SERVER" == "true" ]]; then
              echo "| NHP Server | \`$ECR_SERVER_REPO\` | \`$EFFECTIVE_TAG\` | $SERVER_PUSHED | :white_check_mark: |"
            else
              echo "| NHP Server | \`$ECR_SERVER_REPO\` | \`$EFFECTIVE_TAG\` | $SERVER_PUSHED | :no_entry_sign: skipped |"
            fi
            if [[ "$DEPLOY_AC" == "true" ]]; then
              echo "| Access Controller | \`$ECR_AC_REPO\` | \`$EFFECTIVE_TAG\` | $AC_PUSHED | :white_check_mark: |"
            else
              echo "| Access Controller | \`$ECR_AC_REPO\` | \`$EFFECTIVE_TAG\` | $AC_PUSHED | :no_entry_sign: skipped |"
            fi
            if [[ "$DEPLOY_QURL" == "true" && -n "$QURL_IMAGE_TAG" ]]; then
              echo "| QURL Service | \`$ECR_QURL_REPO\` | \`$QURL_IMAGE_TAG\` | $QURL_PUSHED | :white_check_mark: |"
            elif [[ "$DEPLOY_QURL" == "true" ]]; then
              echo "| QURL Service | \`$ECR_QURL_REPO\` | _(not resolved)_ | — | :warning: no tag |"
            else
              echo "| QURL Service | \`$ECR_QURL_REPO\` | \`${QURL_IMAGE_TAG:-N/A}\` | $QURL_PUSHED | :no_entry_sign: skipped |"
            fi
            echo ""

            # Commit details
            echo "### Commit"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| SHA | [\`$IMAGE_TAG\`](https://github.com/${{ github.repository }}/commit/$IMAGE_TAG) |"
            echo "| Message | $COMMIT_MSG |"
            echo "| Author | $COMMIT_AUTHOR |"
            echo "| Date | $COMMIT_DATE |"
            echo ""

            # Changelog
            echo "### Changelog"
            echo "<details><summary>Commits since last production deployment</summary>"
            echo ""
            echo "\`\`\`"
            echo "$CHANGELOG"
            echo "\`\`\`"
            echo ""
            echo "</details>"
            echo ""

            # Sandbox state
            echo "### Sandbox Validation"
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| Active color | **$SB_ACTIVE_COLOR** |"
            echo "| Server tag | \`$SB_SERVER_TAG\` |"
            echo "| AC tag | \`$SB_AC_TAG\` |"
            echo "| QURL tag | \`$SB_QURL_TAG\` |"
            echo "| Tag match | $TAG_MATCH |"
            echo "| Soak duration | $SB_SOAK |"
            echo ""

            # Current prod vs new
            echo "### Production State"
            echo "| Component | Current | Promoting To | Changed |"
            echo "|-----------|---------|--------------|---------|"

            if [[ "$PROD_SERVER_TAG" == *"$EFFECTIVE_TAG"* ]]; then
              SERVER_CHANGED="no change"
            else
              SERVER_CHANGED=":arrow_right: **updating**"
            fi
            echo "| NHP Server | \`$PROD_SERVER_TAG\` | \`$EFFECTIVE_TAG\` | $SERVER_CHANGED |"

            if [[ "$PROD_AC_TAG" == *"$EFFECTIVE_TAG"* ]]; then
              AC_CHANGED="no change"
            else
              AC_CHANGED=":arrow_right: **updating**"
            fi
            echo "| Access Controller | \`$PROD_AC_TAG\` | \`$EFFECTIVE_TAG\` | $AC_CHANGED |"

            QURL_PROMOTE_TAG="${QURL_IMAGE_TAG:-N/A}"
            if [[ "$PROD_QURL_TAG" == "$QURL_PROMOTE_TAG" ]]; then
              QURL_CHANGED="no change"
            else
              QURL_CHANGED=":arrow_right: **updating**"
            fi
            echo "| QURL Service | \`$PROD_QURL_TAG\` | \`$QURL_PROMOTE_TAG\` | $QURL_CHANGED |"
            echo ""

            # Configuration
            echo "### Configuration"
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Terraform Apply | $RUN_TERRAFORM |"
            echo "| Cell ID | ${{ inputs.cell_id }} |"
            echo "| Rollback | $ROLLBACK |"
            echo "| Source | \`$SANDBOX_ACCOUNT_ID\` (sandbox ECR) |"
            echo "| Target | \`$PROD_ACCOUNT_ID\` (prod) |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Print compact log summary
          echo "============================================="
          echo "  PROMOTION MANIFEST"
          echo "============================================="
          if [[ "$ROLLBACK" == "true" ]]; then
            echo "  MODE:        ROLLBACK"
          fi
          echo "  Commit:      $IMAGE_TAG ($COMMIT_MSG)"
          echo "  Author:      $COMMIT_AUTHOR ($COMMIT_DATE)"
          echo "  Effective:   $EFFECTIVE_TAG"
          echo ""
          echo "  Server:      deploy=$DEPLOY_SERVER"
          echo "  AC:          deploy=$DEPLOY_AC"
          echo "  QURL:        deploy=$DEPLOY_QURL (tag=${QURL_IMAGE_TAG:-N/A})"
          echo ""
          echo "  Sandbox:     active=$SB_ACTIVE_COLOR, soak=$SB_SOAK"
          echo "  Tag match:   $TAG_MATCH"
          echo "  Terraform:   $RUN_TERRAFORM"
          echo "============================================="

  # =============================================================================
  # PREFLIGHT - Approval gate + validation + deploy lock
  # =============================================================================
  preflight:
    name: Preflight Checks
    needs: [manifest]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials (sandbox - for ECR check)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify images exist in sandbox ECR
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_AC: ${{ inputs.deploy_ac }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
        run: |
          echo "Verifying images in sandbox ECR..."
          FAILED=0

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            echo "Checking $ECR_SERVER_REPO:$IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_SERVER_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found: $ECR_SERVER_REPO:$IMAGE_TAG"
            else
              echo "::error::Image $ECR_SERVER_REPO:$IMAGE_TAG not found in sandbox ECR"
              FAILED=1
            fi
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            echo "Checking $ECR_AC_REPO:$IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_AC_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found: $ECR_AC_REPO:$IMAGE_TAG"
            else
              echo "::error::Image $ECR_AC_REPO:$IMAGE_TAG not found in sandbox ECR"
              FAILED=1
            fi
          fi

          if [[ "$DEPLOY_QURL" == "true" && -n "$QURL_IMAGE_TAG" ]]; then
            echo "Checking $ECR_QURL_REPO:$QURL_IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_QURL_REPO" \
              --image-ids imageTag="$QURL_IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found: $ECR_QURL_REPO:$QURL_IMAGE_TAG"
            else
              echo "::error::Image $ECR_QURL_REPO:$QURL_IMAGE_TAG not found in sandbox ECR"
              FAILED=1
            fi
          elif [[ "$DEPLOY_QURL" == "true" ]]; then
            echo "::error::deploy_qurl=true but no QURL image tag available (provide qurl_image_tag or ensure sandbox SSM has a value)"
            FAILED=1
          fi

          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi
          echo "All required images verified."

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify images replicated from sandbox ECR to prod ECR.
      # ECR cross-account replication is asynchronous and can fail silently
      # (IAM drift, registry policy removal, AWS service issue). Without
      # this gate, broken replication is only discovered when a deploy
      # fails at image pull time.
      - name: Verify images replicated to prod ECR
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_AC: ${{ inputs.deploy_ac }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
        run: |
          set -euo pipefail
          echo "Verifying images in prod ECR (replicated from sandbox)..."
          FAILED=0

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            echo "Checking prod $ECR_SERVER_REPO:$IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_SERVER_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found in prod ECR: $ECR_SERVER_REPO:$IMAGE_TAG"
            else
              echo "::error::Image $ECR_SERVER_REPO:$IMAGE_TAG not found in prod ECR. ECR cross-account replication may have failed."
              echo "::error::See runbook: docs/runbooks/ecr-replication-failure.md"
              FAILED=1
            fi
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            echo "Checking prod $ECR_AC_REPO:$IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_AC_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found in prod ECR: $ECR_AC_REPO:$IMAGE_TAG"
            else
              echo "::error::Image $ECR_AC_REPO:$IMAGE_TAG not found in prod ECR. ECR cross-account replication may have failed."
              echo "::error::See runbook: docs/runbooks/ecr-replication-failure.md"
              FAILED=1
            fi
          fi

          if [[ "$DEPLOY_QURL" == "true" && -n "$QURL_IMAGE_TAG" ]]; then
            echo "Checking prod $ECR_QURL_REPO:$QURL_IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_QURL_REPO" \
              --image-ids imageTag="$QURL_IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found in prod ECR: $ECR_QURL_REPO:$QURL_IMAGE_TAG"
            else
              echo "::error::Image $ECR_QURL_REPO:$QURL_IMAGE_TAG not found in prod ECR. ECR cross-account replication may have failed."
              echo "::error::See runbook: docs/runbooks/ecr-replication-failure.md"
              FAILED=1
            fi
          elif [[ "$DEPLOY_QURL" == "true" ]]; then
            echo "::error::deploy_qurl=true but no QURL image tag available (provide qurl_image_tag or ensure sandbox SSM has a value)"
            FAILED=1
          fi

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "::error::One or more images missing from prod ECR. This usually means ECR cross-account replication is broken."
            echo "  Manual workaround: pull the image from sandbox ECR and push to prod ECR via docker CLI."
            echo "  See: docs/runbooks/ecr-replication-failure.md"
            exit 1
          fi
          echo "All required images verified in prod ECR."

      - name: Verify prod NHP Server AMI is published to SSM
        if: inputs.run_terraform || inputs.deploy_server
        env:
          AMI_MAX_AGE_DAYS: ${{ inputs.ami_max_age_days }}
          FORCE_STALE_AMI: ${{ inputs.force_stale_ami }}
        run: |
          set -euo pipefail
          # The compute module reads /prod/nhp/server/ami-id via
          # aws_ssm_parameter (see terraform/modules/compute/main.tf). If the
          # parameter is missing, terraform plan errors out partway through
          # with a generic "couldn't find resource" message. Catch it here
          # so the operator gets a clear, actionable error before approval.
          #
          # Note on the hardcoded "/prod/" path: this entire workflow is
          # prod-specific (job name promote-to-prod, role-to-assume uses
          # AWS_PROD_ROLE_ARN, account ID hardcoded as PROD_ACCOUNT_ID at
          # the top of the file). The hardcoded path is consistent with
          # the rest of the file's pattern. If anyone copies this workflow
          # to promote to a non-prod environment, they need to change the
          # env name in many other places too — search for "/prod/",
          # "prod_", and PROD_ACCOUNT_ID before reusing.
          AMI_PARAM="/prod/nhp/server/ami-id"
          if ! AMI_ID=$(aws ssm get-parameter --name "$AMI_PARAM" --query 'Parameter.Value' --output text 2>/tmp/ssm-err); then
            if grep -q "ParameterNotFound" /tmp/ssm-err; then
              echo "::error::Prod NHP Server AMI not published yet. Build the AMI first:"
              echo "  1. Confirm /sandbox/nhp/server/ami-id is populated in sandbox."
              echo "  2. Run packer build manually against prod credentials, OR"
              echo "  3. Copy the sandbox AMI to the prod account/region and publish it to $AMI_PARAM."
              echo "  See packer/README.md for the full bootstrap procedure."
              exit 1
            fi
            echo "::error::Unexpected SSM error reading $AMI_PARAM:"
            cat /tmp/ssm-err
            exit 1
          fi
          if ! echo "$AMI_ID" | grep -Eq '^ami-[0-9a-f]+$'; then
            echo "::error::Prod AMI parameter contains an invalid value: '$AMI_ID' (expected ami-<hex>)"
            exit 1
          fi
          # Verify the AMI still exists and is available — a deregistered AMI
          # would pass the SSM check but fail at launch_template apply time.
          AMI_JSON=$(aws ec2 describe-images --image-ids "$AMI_ID" \
            --query 'Images[0].{State:State,CreationDate:CreationDate}' \
            --output json 2>/dev/null || echo '{}')
          STATE=$(echo "$AMI_JSON" | jq -r '.State // ""')
          CREATION=$(echo "$AMI_JSON" | jq -r '.CreationDate // ""')
          if [[ "$STATE" != "available" ]]; then
            echo "::error::Prod AMI $AMI_ID is not available (state=$STATE). It may have been deregistered."
            exit 1
          fi
          # Stale AMI check. Stale AMIs may carry unpatched kernel/Docker
          # vulnerabilities, so we hard-fail past the threshold. Operators
          # have two escape valves:
          #   1. Set ami_max_age_days higher when launching the workflow (per
          #      run, no code change).
          #   2. Set force_stale_ami=true to bypass the check entirely (use
          #      for intentional rollback to an older known-good image, or
          #      while a fresh AMI is rebuilding).
          # The default threshold (60 days) is calibrated to the AMI rebuild
          # cadence; tighten if rebuilds become more frequent.
          AMI_AGE_THRESHOLD_DAYS="${AMI_MAX_AGE_DAYS:-60}"
          if [[ -n "$CREATION" ]]; then
            # `date -d` is GNU date syntax (Linux). This step always runs on
            # ubuntu-latest GitHub Actions runners so it works, but the same
            # command would fail on macOS BSD `date` (which uses `-j -f`).
            # If anyone ports this verify step to a self-hosted macOS runner
            # or a local debugging script, swap to:
            #   date -j -f "%Y-%m-%dT%H:%M:%S.%3NZ" "$CREATION" +%s
            # Or, more portably, use python -c 'import datetime; ...'.
            CREATION_EPOCH=$(date -d "$CREATION" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date -u +%s)
            AGE_DAYS=$(( (NOW_EPOCH - CREATION_EPOCH) / 86400 ))
            if (( CREATION_EPOCH > 0 && AGE_DAYS > AMI_AGE_THRESHOLD_DAYS )); then
              if [[ "$FORCE_STALE_AMI" == "true" ]]; then
                echo "::warning::Prod AMI $AMI_ID is $AGE_DAYS days old (threshold $AMI_AGE_THRESHOLD_DAYS). Bypass enabled via force_stale_ami=true — proceeding."
                {
                  echo "## :warning: AMI age check bypassed"
                  echo "Prod AMI \`$AMI_ID\` is **$AGE_DAYS days old** (threshold $AMI_AGE_THRESHOLD_DAYS). Operator passed \`force_stale_ami=true\` to bypass."
                } >> "$GITHUB_STEP_SUMMARY"
              else
                {
                  echo "## :x: AMI age check failed"
                  echo "Prod AMI \`$AMI_ID\` is **$AGE_DAYS days old**, exceeding the configured threshold of **$AMI_AGE_THRESHOLD_DAYS days**."
                  echo ""
                  echo "Stale AMIs may carry unpatched kernel/Docker security vulnerabilities. Two ways forward:"
                  echo ""
                  echo "1. **Rebuild the AMI** — re-run \`build-and-push.yml::packer-build\` against prod (or merge any \`packer/\`-touching change to \`main\`) and then re-run this promotion."
                  echo "2. **Bypass the check** — re-run this workflow with \`force_stale_ami=true\` if you are intentionally rolling back to a known-good older image."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::error::Prod AMI $AMI_ID is $AGE_DAYS days old, exceeding threshold $AMI_AGE_THRESHOLD_DAYS. Rebuild via packer-build or pass force_stale_ami=true to bypass."
                exit 1
              fi
            else
              echo "Prod AMI age: $AGE_DAYS days (threshold $AMI_AGE_THRESHOLD_DAYS) — OK"
            fi
          fi
          echo "Prod NHP Server AMI verified: $AMI_ID (available)"

      - name: Verify Secrets Manager secrets exist
        run: |
          echo "Verifying Secrets Manager secrets..."
          SECRETS=(
            "layerv-nhp-prod/qurl-jwt-secret"
            "layerv-nhp-prod/qurl-internal-service-token"
            "layerv-nhp-prod/grafana-cloud-otlp"
          )
          for secret in "${SECRETS[@]}"; do
            if aws secretsmanager describe-secret --secret-id "$secret" > /dev/null 2>&1; then
              echo "  Found: $secret"
            else
              echo "::error::Secret not found: $secret"
              exit 1
            fi
          done
          echo "All secrets verified."

      - name: Verify S3 buckets exist
        run: |
          echo "Verifying S3 buckets..."
          BUCKETS=(
            "layerv-terraform-state-${PROD_ACCOUNT_ID}"
            "layerv-nhp-prod-alb-logs"
          )
          for bucket in "${BUCKETS[@]}"; do
            if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              echo "  Found: $bucket"
            else
              echo "::error::S3 bucket not found: $bucket"
              exit 1
            fi
          done
          echo "All buckets verified."

      - name: Verify cross-account Route53 role
        run: |
          echo "Verifying cross-account Route53 role..."
          ROLE_ARN="arn:aws:iam::${PROD_MGMT_ACCOUNT_ID}:role/nhp-ac-route53-access"
          if aws sts assume-role \
            --role-arn "$ROLE_ARN" \
            --role-session-name "preflight-check" \
            --duration-seconds 900 \
            --query "Credentials.AccessKeyId" \
            --output text > /dev/null 2>&1; then
            echo "  Route53 cross-account role assumable"
          else
            echo "::warning::Cannot assume Route53 cross-account role: $ROLE_ARN"
            echo "  This may be expected if the role has not been created yet."
          fi

      - name: Verify GitHub secrets are set
        env:
          PROD_AUTH0_CLIENT_ID: ${{ secrets.PROD_AUTH0_CLIENT_ID }}
          PROD_AUTH0_CLIENT_SECRET: ${{ secrets.PROD_AUTH0_CLIENT_SECRET }}
          PROD_GRAFANA_AUTH: ${{ secrets.PROD_GRAFANA_AUTH }}
        run: |
          echo "Verifying GitHub secrets..."
          MISSING=0
          for var in PROD_AUTH0_CLIENT_ID PROD_AUTH0_CLIENT_SECRET PROD_GRAFANA_AUTH; do
            if [[ -z "${!var}" ]]; then
              echo "::error::GitHub secret $var is not set"
              MISSING=1
            else
              echo "  Found: $var"
            fi
          done
          if [[ $MISSING -eq 1 ]]; then
            exit 1
          fi
          echo "All GitHub secrets verified."

      - name: Check and acquire deployment lock
        env:
          FORCE_UNLOCK: ${{ inputs.force_unlock }}
        run: |
          echo "Checking deployment lock..."
          DEPLOY_STATE=$(aws ssm get-parameter \
            --name "/prod/nhp/deploy/state" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [[ "$DEPLOY_STATE" == "deploying" ]]; then
            if [[ "$FORCE_UNLOCK" == "true" ]]; then
              echo "::warning::Deployment lock is held, but force_unlock=true — overriding stale lock"
            else
              echo "::error::Deployment lock is held — another deployment is in progress."
              echo "::error::Wait for it to finish, or re-run with force_unlock=true to override a stale lock."
              exit 1
            fi
          else
            echo "  Deploy state: ${DEPLOY_STATE:-not set} (no lock held)"
          fi

          echo "Acquiring deployment lock..."
          aws ssm put-parameter \
            --name "/prod/nhp/deploy/state" \
            --value "deploying" \
            --type String \
            --overwrite
          echo "  Lock acquired: /prod/nhp/deploy/state = deploying"

  # =============================================================================
  # TERRAFORM PLAN - Show what will change (NO approval gate — runs automatically)
  # =============================================================================
  terraform-plan:
    name: Terraform Plan (prod)
    needs: [manifest, preflight]
    if: inputs.run_terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda Packages
        uses: ./.github/actions/build-lambda-packages

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          terraform init

      - name: Fetch Auth0 Token
        id: auth0
        env:
          AUTH0_CLIENT_ID: ${{ secrets.PROD_AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.PROD_AUTH0_CLIENT_SECRET }}
        run: ./.github/scripts/fetch-auth0-token.sh terraform/environments/prod/terraform.tfvars prod

      - name: Terraform change summary
        continue-on-error: true
        run: |
          set -euo pipefail

          # Read last successful prod terraform apply commit from SSM
          LAST_TF_SHA=$(aws ssm get-parameter \
            --name "/prod/nhp/deploy/last-terraform-apply-commit" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [[ -z "$LAST_TF_SHA" || "$LAST_TF_SHA" == "initial" ]]; then
            echo "::notice::No previous terraform apply commit tracked in SSM — skipping change summary"
            exit 0
          fi

          if ! git rev-parse --verify "${LAST_TF_SHA}^{commit}" > /dev/null 2>&1; then
            echo "::warning::Previous terraform apply commit $LAST_TF_SHA not found in repo history"
            exit 0
          fi

          CURRENT_SHA="${GITHUB_SHA}"
          echo "Comparing terraform changes: ${LAST_TF_SHA:0:8}..${CURRENT_SHA:0:8}"

          # Check for shared module changes
          MODULE_CHANGES=$(git diff --name-only "$LAST_TF_SHA..$CURRENT_SHA" -- terraform/modules/ || echo "")
          ENV_CHANGES=$(git diff --name-only "$LAST_TF_SHA..$CURRENT_SHA" -- terraform/environments/prod/ || echo "")
          MODULE_COMMITS=$(git log --oneline "$LAST_TF_SHA..$CURRENT_SHA" -- terraform/modules/ 2>/dev/null || echo "")
          ENV_COMMITS=$(git log --oneline "$LAST_TF_SHA..$CURRENT_SHA" -- terraform/environments/prod/ 2>/dev/null || echo "")

          if [[ -n "$MODULE_CHANGES" ]]; then
            MODULE_COUNT=$(printf '%s' "$MODULE_CHANGES" | grep -c . || echo "0")
            echo "::warning::Shared module changes detected: $MODULE_COUNT files changed in terraform/modules/ since last prod apply"
          fi

          {
            echo "## Terraform Changes Since Last Prod Apply"
            echo ""
            echo "Comparing [\`${LAST_TF_SHA:0:8}\`](https://github.com/${{ github.repository }}/commit/$LAST_TF_SHA) → [\`${CURRENT_SHA:0:8}\`](https://github.com/${{ github.repository }}/commit/$CURRENT_SHA)"
            echo ""

            if [[ -n "$MODULE_CHANGES" ]]; then
              echo "### :warning: Shared Module Changes"
              echo "These affect ALL environments, not just prod:"
              echo ""
              echo "<details><summary>Module commits (click to expand)</summary>"
              echo ""
              echo '```'
              echo "$MODULE_COMMITS"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              echo "<details><summary>Changed module files ($MODULE_COUNT files)</summary>"
              echo ""
              echo '```'
              echo "$MODULE_CHANGES"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            else
              echo "### :white_check_mark: No Shared Module Changes"
              echo ""
            fi

            if [[ -n "$ENV_CHANGES" ]]; then
              ENV_COUNT=$(printf '%s' "$ENV_CHANGES" | grep -c . || echo "0")
              echo "### Prod Environment Changes ($ENV_COUNT files)"
              echo ""
              echo "<details><summary>Environment commits</summary>"
              echo ""
              echo '```'
              echo "$ENV_COMMITS"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            else
              echo "### :white_check_mark: No Prod Environment Changes"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Plan
        working-directory: terraform/environments/prod
        env:
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          TF_VAR_ac_license_key: ${{ secrets.PROD_AC_LICENSE_KEY }}
          TF_VAR_grafana_auth: ${{ secrets.PROD_GRAFANA_AUTH }}
          TF_VAR_auth0_tf_client_id: ${{ secrets.PROD_AUTH0_CLIENT_ID }}
          TF_VAR_auth0_tf_client_secret: ${{ secrets.PROD_AUTH0_CLIENT_SECRET }}
          TF_VAR_auth0_api_token: ${{ steps.auth0.outputs.auth0_token }}
          TF_VAR_confirm_prod_deployment: "yes-deploy-to-production"
          TF_VAR_image_tag: ${{ needs.manifest.outputs.effective_image_tag }}
          TF_VAR_cell_id: ${{ inputs.cell_id }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan-output.txt

          # Write plan to step summary so reviewer can see it before approving apply
          {
            echo "## Terraform Plan — Production"
            echo ""
            echo "<details><summary>Full plan output (click to expand)</summary>"
            echo ""
            echo '```'
            cat plan-output.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            # Extract the summary line (e.g., "Plan: 2 to add, 1 to change, 0 to destroy.")
            SUMMARY=$(grep -E '^(Plan:|No changes\.)' plan-output.txt || echo "Unable to extract summary")
            echo "**$SUMMARY**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tfplan-prod
          path: terraform/environments/prod/tfplan
          retention-days: 1

      # Convert the binary plan to JSON for the qurl-schema-compat job to
      # consume. Doing the conversion here (where terraform is already set
      # up and the providers are already initialized) means the
      # qurl-schema-compat job stays slim — it just downloads the JSON,
      # pulls the qurl image, and runs the schema-check binary. No
      # terraform install in the gate.
      - name: Convert plan to JSON
        working-directory: terraform/environments/prod
        run: terraform show -json tfplan > tfplan.json

      - name: Upload plan JSON artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tfplan-prod-json
          path: terraform/environments/prod/tfplan.json
          retention-days: 1

      - name: Upload Lambda build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lambda-acme-cert
          path: terraform/modules/acme-cert/build/lambda-acme-cert.zip
          retention-days: 1

      - name: Upload canary orchestrator Lambda
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lambda-canary-orchestrator
          path: terraform/modules/canary-deployment/lambda/canary_orchestrator.zip
          retention-days: 1

      - name: Upload playground proxy Lambda
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lambda-playground-proxy
          path: terraform/modules/developer-portal/lambda/playground_proxy.zip
          retention-days: 1

      - name: Upload custom domain cert Lambda
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lambda-custom-domain-cert
          path: terraform/modules/custom-domain-cert/build/lambda-custom-domain-cert.zip
          retention-days: 1
          if-no-files-found: ignore

  # =============================================================================
  # QURL SCHEMA COMPAT - Refuse destructive terraform if the deployed
  # qurl-service code still depends on a GSI the plan would remove.
  # =============================================================================
  #
  # This is the gate that closes the 2026-03-24 incident class (nhp PR #877:
  # owner-target-index removed while the deployed qurl-service still queried
  # it; POST /v1/qurls returned 500 for >1 week before customers noticed).
  #
  # The job runs the qurl-schema-check binary (built into the same Docker
  # image as the qurl-api server in layervai/qurl-service#247) against the
  # terraform plan that terraform-apply is about to apply. The binary
  # compares the plan's post-apply DynamoDB schema against the deployed
  # binary's compiled-in registry of (table, GSI) pairs. If any registered
  # GSI would be missing in the post-apply state, the binary exits 1 and
  # this job fails, blocking terraform-apply.
  #
  # CRITICAL: the gate must validate the qurl image that will be RUNNING
  # IN PROD AFTER THE DEPLOY COMPLETES, not the latest sandbox build. The
  # 2026-03-24 incident's smoking gun was deploy_qurl=false with
  # run_terraform=true — terraform applied while prod kept running its old
  # image. So:
  #
  #   - if deploy_qurl == true: validate the new image being deployed
  #     (manifest.outputs.qurl_image_tag)
  #   - if deploy_qurl == false: validate the image already running in
  #     prod (manifest.outputs.current_prod_qurl_tag, read from SSM by
  #     the manifest job so this gate doesn't need prod credentials)
  #
  # Either way, the validation matches reality: whichever image will be
  # serving qurl-api requests after the apply is what gets checked.
  #
  # Tracked in #1013.
  qurl-schema-compat:
    name: QURL Schema Compatibility Check
    needs: [manifest, preflight, terraform-plan]
    if: inputs.run_terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download plan JSON artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-prod-json
          path: .

      - name: Resolve effective qurl image tag
        id: resolve
        env:
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
          NEW_QURL_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
          CURRENT_PROD_QURL_TAG: ${{ needs.manifest.outputs.current_prod_qurl_tag }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_QURL" == "true" ]]; then
            if [[ -z "$NEW_QURL_TAG" ]]; then
              echo "::error::deploy_qurl=true but manifest produced no qurl_image_tag — cannot validate schema."
              exit 1
            fi
            echo "Validating against new qurl image being deployed: $NEW_QURL_TAG"
            EFFECTIVE_TAG="$NEW_QURL_TAG"
          else
            # Use the currently-deployed prod tag already read by the
            # manifest job (from /${PROD_SSM_PREFIX}/qurl-api-image-tag).
            # This is the image that will continue to serve traffic after
            # the destructive terraform applies — it must NOT depend on
            # any GSI the plan removes.
            if [[ -z "$CURRENT_PROD_QURL_TAG" || "$CURRENT_PROD_QURL_TAG" == "not deployed" || "$CURRENT_PROD_QURL_TAG" == "latest" ]]; then
              echo "::error::deploy_qurl=false but the manifest could not resolve the current prod qurl image tag (got '${CURRENT_PROD_QURL_TAG:-<empty>}'). Without knowing what's running, schema compatibility cannot be verified — refusing to advance the deploy."
              exit 1
            fi
            echo "Validating against currently-deployed prod qurl image: $CURRENT_PROD_QURL_TAG"
            EFFECTIVE_TAG="$CURRENT_PROD_QURL_TAG"
          fi
          echo "effective_tag=$EFFECTIVE_TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (sandbox - ECR pull)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to sandbox ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Pull qurl-service image and run schema-check
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_QURL_REPO: ${{ env.ECR_QURL_REPO }}
          EFFECTIVE_TAG: ${{ steps.resolve.outputs.effective_tag }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_QURL_REPO:$EFFECTIVE_TAG"
          echo "Pulling $IMAGE..."
          docker pull "$IMAGE"

          echo ""
          echo "Running qurl-schema-check against the prod terraform plan..."
          echo "  Image:    $IMAGE"
          echo "  Plan:     tfplan.json"
          echo ""

          # The schema-check binary writes a precise (table, index, reason)
          # report to its own stderr on failure; surface its full output in
          # the workflow log so operators see exactly which GSI is missing
          # without having to re-run anything.
          set +e
          docker run --rm \
            -v "$PWD/tfplan.json:/tmp/tfplan.json:ro" \
            "$IMAGE" \
            /app/qurl-schema-check --plan /tmp/tfplan.json
          EXIT=$?
          set -e

          case "$EXIT" in
            0)
              echo ""
              echo "::notice::qurl-schema-check passed: every required GSI is present in the post-apply state."
              ;;
            1)
              echo ""
              echo "::error::qurl-schema-check failed: a registered GSI is missing in the post-apply terraform state. The deployed qurl-service code still queries that GSI; applying this plan would break production. See the diagnostic above for the exact (table, index) pair and remediation steps."
              exit 1
              ;;
            2)
              echo ""
              echo "::error::qurl-schema-check could not validate the plan (exit 2). This usually means the terraform plan JSON is malformed, an aws_dynamodb_table block is structurally broken, or two tables in the plan ambiguously map to the same logical name. Refusing to advance the deploy until the operator investigates."
              exit 1
              ;;
            126|127)
              # 126 = permission denied; 127 = binary not found. Most
              # likely the effective qurl image predates layervai/qurl-service#247
              # which added /app/qurl-schema-check to the Docker image.
              echo ""
              echo "::error::qurl-schema-check binary not found or not executable in image $IMAGE (exit $EXIT). The effective qurl image (tag $EFFECTIVE_TAG) likely predates qurl-service#247 which added the schema-check binary. Either deploy a newer qurl image (deploy_qurl=true with a post-#247 tag) or, if this is intentional, verify GSI compatibility manually before applying."
              exit 1
              ;;
            *)
              echo ""
              echo "::error::qurl-schema-check returned unexpected exit code $EXIT. Refusing to advance the deploy."
              exit 1
              ;;
          esac

  # =============================================================================
  # TERRAFORM APPLY - Apply reviewed plan (approval gate)
  # =============================================================================
  terraform-apply:
    name: Terraform Apply (prod)
    needs: [manifest, preflight, terraform-plan, qurl-schema-compat]
    if: inputs.run_terraform
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-prod
          path: terraform/environments/prod

      - name: Download Lambda build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-acme-cert
          path: terraform/modules/acme-cert/build

      - name: Download canary orchestrator Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-canary-orchestrator
          path: terraform/modules/canary-deployment/lambda

      - name: Download playground proxy Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-playground-proxy
          path: terraform/modules/developer-portal/lambda

      - name: Download custom domain cert Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: lambda-custom-domain-cert
          path: terraform/modules/custom-domain-cert/build

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          terraform init

      - name: Fetch Auth0 Token
        id: auth0
        env:
          AUTH0_CLIENT_ID: ${{ secrets.PROD_AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.PROD_AUTH0_CLIENT_SECRET }}
        run: ./.github/scripts/fetch-auth0-token.sh terraform/environments/prod/terraform.tfvars prod

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        env:
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          TF_VAR_ac_license_key: ${{ secrets.PROD_AC_LICENSE_KEY }}
          TF_VAR_grafana_auth: ${{ secrets.PROD_GRAFANA_AUTH }}
          TF_VAR_auth0_tf_client_id: ${{ secrets.PROD_AUTH0_CLIENT_ID }}
          TF_VAR_auth0_tf_client_secret: ${{ secrets.PROD_AUTH0_CLIENT_SECRET }}
          TF_VAR_auth0_api_token: ${{ steps.auth0.outputs.auth0_token }}
          TF_VAR_confirm_prod_deployment: "yes-deploy-to-production"
          TF_VAR_image_tag: ${{ needs.manifest.outputs.effective_image_tag }}
          TF_VAR_cell_id: ${{ inputs.cell_id }}
        run: terraform apply -auto-approve tfplan

  # =============================================================================
  # DEPLOY SERVER - Via canary (Step Functions) with first-deploy fallback
  # =============================================================================
  deploy-server:
    name: Deploy NHP Server
    needs: [manifest, preflight, terraform-plan, terraform-apply]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.terraform-plan.result == 'success' || needs.terraform-plan.result == 'skipped') &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') &&
      inputs.deploy_server
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
      CELL_ID: ${{ inputs.cell_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy server
        id: deploy-server-step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- Deploying NHP Server ---"
          START_TIME=$(date +%s)

          # Stream startup logs to the console in the background
          ./.github/scripts/tail-deploy-logs.sh server prod "$CELL_ID" &
          LOG_TAIL_PID=$!

          # Check if canary state machine exists (indicates mature infra)
          DEPLOY_EXIT=0
          STATE_MACHINE_ARN=$(aws ssm get-parameter \
            --name "/prod/nhp/${CELL_ID}/canary/server/state-machine-arn" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [[ -n "$STATE_MACHINE_ARN" && "$STATE_MACHINE_ARN" != "initial" ]]; then
            echo "deploy_method=canary" >> "$GITHUB_OUTPUT"
            ./.github/scripts/dispatch-and-poll-canary.sh server "$IMAGE_TAG" prod "$CELL_ID" || DEPLOY_EXIT=$?
          else
            echo "deploy_method=direct" >> "$GITHUB_OUTPUT"
            echo "::notice::No canary state machine — using direct SSM + instance refresh (first deploy)"
            ./.github/scripts/update-ssm-image-tag.sh prod server "$IMAGE_TAG" --refresh || DEPLOY_EXIT=$?
          fi

          # Stop log tailing and propagate the deploy exit code
          kill "$LOG_TAIL_PID" 2>/dev/null || true
          wait "$LOG_TAIL_PID" 2>/dev/null || true

          DURATION=$(( $(date +%s) - START_TIME ))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          exit "$DEPLOY_EXIT"

      - name: Server deploy summary
        if: always() && steps.deploy-server-step.outcome != 'skipped'
        env:
          DEPLOY_METHOD: ${{ steps.deploy-server-step.outputs.deploy_method }}
          RUN_URL: ${{ steps.deploy-server-step.outputs.run_url }}
          DURATION: ${{ steps.deploy-server-step.outputs.duration }}
          RESULT: ${{ steps.deploy-server-step.outcome }}
        run: |
          {
            echo "## Deploy Server"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Component | NHP Server |"
            echo "| Method | ${DEPLOY_METHOD:-unknown} |"
            echo "| Image | \`$IMAGE_TAG\` |"
            echo "| Duration | ${DURATION:-unknown} |"
            echo "| Result | **$RESULT** |"
            if [[ -n "$RUN_URL" ]]; then
              echo "| Canary Run | [View]($RUN_URL) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # DEPLOY AC - Via canary (Step Functions) with first-deploy fallback
  # =============================================================================
  deploy-ac:
    name: Deploy Access Controller
    needs: [manifest, preflight, terraform-plan, terraform-apply, deploy-server]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.terraform-plan.result == 'success' || needs.terraform-plan.result == 'skipped') &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      inputs.deploy_ac
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
      CELL_ID: ${{ inputs.cell_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy AC
        id: deploy-ac-step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- Deploying Access Controller ---"
          START_TIME=$(date +%s)

          # Stream startup logs to the console in the background
          # AC log group has no cell_id: /layerv/nhp/{env}/ac (unlike server which includes cell)
          ./.github/scripts/tail-deploy-logs.sh ac prod &
          LOG_TAIL_PID=$!

          DEPLOY_EXIT=0
          STATE_MACHINE_ARN=$(aws ssm get-parameter \
            --name "/prod/nhp/${CELL_ID}/canary/ac/state-machine-arn" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [[ -n "$STATE_MACHINE_ARN" && "$STATE_MACHINE_ARN" != "initial" ]]; then
            echo "deploy_method=canary" >> "$GITHUB_OUTPUT"
            ./.github/scripts/dispatch-and-poll-canary.sh ac "$IMAGE_TAG" prod "$CELL_ID" || DEPLOY_EXIT=$?
          else
            echo "deploy_method=direct" >> "$GITHUB_OUTPUT"
            echo "::notice::No canary state machine — using direct SSM + instance refresh (first deploy)"
            ./.github/scripts/update-ssm-image-tag.sh prod ac "$IMAGE_TAG" --refresh || DEPLOY_EXIT=$?
          fi

          # Stop log tailing and propagate the deploy exit code
          kill "$LOG_TAIL_PID" 2>/dev/null || true
          wait "$LOG_TAIL_PID" 2>/dev/null || true

          DURATION=$(( $(date +%s) - START_TIME ))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          exit "$DEPLOY_EXIT"

      - name: AC deploy summary
        if: always() && steps.deploy-ac-step.outcome != 'skipped'
        env:
          DEPLOY_METHOD: ${{ steps.deploy-ac-step.outputs.deploy_method }}
          RUN_URL: ${{ steps.deploy-ac-step.outputs.run_url }}
          DURATION: ${{ steps.deploy-ac-step.outputs.duration }}
          RESULT: ${{ steps.deploy-ac-step.outcome }}
        run: |
          {
            echo "## Deploy AC"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Component | Access Controller |"
            echo "| Method | ${DEPLOY_METHOD:-unknown} |"
            echo "| Image | \`$IMAGE_TAG\` |"
            echo "| Duration | ${DURATION:-unknown} |"
            echo "| Result | **$RESULT** |"
            if [[ -n "$RUN_URL" ]]; then
              echo "| Canary Run | [View]($RUN_URL) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # DEPLOY QURL - ECS task definition re-registration
  # =============================================================================
  deploy-qurl:
    name: Deploy QURL Service
    needs: [manifest, preflight, terraform-plan, terraform-apply, deploy-server, deploy-ac]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.terraform-plan.result == 'success' || needs.terraform-plan.result == 'skipped') &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped') &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      inputs.deploy_qurl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy QURL via ECS task def
        id: deploy-qurl-step
        env:
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
        run: |
          if [[ -z "$QURL_IMAGE_TAG" ]]; then
            echo "::error::QURL_IMAGE_TAG is empty, cannot deploy"
            exit 1
          fi
          START_TIME=$(date +%s)
          ./.github/scripts/deploy-ecs-service.sh "$PROD_SSM_PREFIX" "$QURL_IMAGE_TAG"
          DURATION=$(( $(date +%s) - START_TIME ))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"

      - name: QURL deploy summary
        if: always() && steps.deploy-qurl-step.outcome != 'skipped'
        env:
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
          DURATION: ${{ steps.deploy-qurl-step.outputs.duration }}
          RESULT: ${{ steps.deploy-qurl-step.outcome }}
        run: |
          {
            echo "## Deploy QURL"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Component | QURL Service |"
            echo "| Method | ECS task definition |"
            echo "| Image | \`$ECR_QURL_REPO:$QURL_IMAGE_TAG\` |"
            echo "| Duration | ${DURATION:-unknown} |"
            echo "| Result | **$RESULT** |"
            echo "| Rollback | ECS circuit breaker (automatic) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # SMOKE TEST - Application-level validation
  # =============================================================================
  smoke-test:
    name: Smoke Test
    needs: [manifest, preflight, deploy-server, deploy-ac, deploy-qurl]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      (needs.deploy-qurl.result == 'success' || needs.deploy-qurl.result == 'skipped') &&
      (needs.deploy-server.result == 'success' || needs.deploy-ac.result == 'success' || needs.deploy-qurl.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Infrastructure validation
        run: ./scripts/validate-deployment.sh prod

      - name: QURL health checks
        id: qurl-health
        if: needs.deploy-qurl.result == 'success'
        run: |
          echo "Running QURL health checks..."
          RETRIES=3
          RETRY_DELAY=10
          RESULTS=""

          for endpoint in "health/live" "health/ready"; do
            URL="https://api.layerv.ai/${endpoint}"
            echo "  Checking $URL..."
            SUCCESS=false
            FINAL_STATUS="000"
            for i in $(seq 1 $RETRIES); do
              HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
              FINAL_STATUS="$HTTP_STATUS"
              if [[ "$HTTP_STATUS" == "200" ]]; then
                echo "    $endpoint: OK (200)"
                SUCCESS=true
                break
              fi
              echo "    Attempt $i/$RETRIES: HTTP $HTTP_STATUS, retrying in ${RETRY_DELAY}s..."
              sleep "$RETRY_DELAY"
            done
            if [[ "$SUCCESS" == "true" ]]; then
              RESULTS="${RESULTS}| \`${endpoint}\` | $FINAL_STATUS | :white_check_mark: |"$'\n'
            else
              RESULTS="${RESULTS}| \`${endpoint}\` | $FINAL_STATUS | :x: |"$'\n'
              echo "::error::QURL health check failed: $URL (last status: $HTTP_STATUS)"
              # Write summary before exiting on failure
              {
                echo "## Smoke Test — QURL Health"
                echo ""
                echo "| Endpoint | HTTP Status | Result |"
                echo "|----------|-------------|--------|"
                echo "$RESULTS"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "All QURL health checks passed."

          {
            echo "## Smoke Test — QURL Health"
            echo ""
            echo "| Endpoint | HTTP Status | Result |"
            echo "|----------|-------------|--------|"
            echo "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # QURL SMOKE TESTS - Comprehensive Go test suite from qurl repo
  # =============================================================================
  qurl-smoke-tests:
    name: QURL Smoke Tests
    needs: [manifest, preflight, deploy-server, deploy-ac, deploy-qurl]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      (needs.deploy-qurl.result == 'success' || needs.deploy-qurl.result == 'skipped') &&
      (needs.deploy-server.result == 'success' || needs.deploy-ac.result == 'success' || needs.deploy-qurl.result == 'success')
    uses: layervai/qurl-service/.github/workflows/smoke-tests.yml@main
    with:
      environment: prod
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}
      REPO_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
      AUTH0_SMOKE_TEST_CLIENT_ID: ${{ secrets.AUTH0_SMOKE_TEST_CLIENT_ID }}
      AUTH0_SMOKE_TEST_CLIENT_SECRET: ${{ secrets.AUTH0_SMOKE_TEST_CLIENT_SECRET }}

  # =============================================================================
  # NHP SMOKE TESTS - Tier 1 regression guards against deployed prod
  #
  # Runs the nhp/tests/smoke suite against the freshly-deployed prod
  # environment. Sibling of qurl-smoke-tests.
  #
  # Rollout posture (matches build-and-push.yml nhp-smoke-sandbox):
  #   PR1: tier=tier1,            allow_ssm_probes=false (30d SSM burn-in)
  #   PR2: tier=tier1+tier2,      allow_ssm_probes=false
  #   PR3: tier=tier1+tier2+tier3-no-ssm, allow_ssm_probes=false
  #
  # After 30 days of green sandbox runs, smoke-burn-in-unlock.yml
  # auto-opens a PR flipping allow_ssm_probes to true for prod.
  # =============================================================================
  nhp-smoke-tests:
    name: NHP Smoke Tests
    needs: [manifest, preflight, deploy-server, deploy-ac, deploy-qurl]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      (needs.deploy-qurl.result == 'success' || needs.deploy-qurl.result == 'skipped') &&
      (needs.deploy-server.result == 'success' || needs.deploy-ac.result == 'success' || needs.deploy-qurl.result == 'success')
    uses: ./.github/workflows/nhp-smoke-tests.yml
    with:
      environment: prod
      # tier1+tier2 runs the Tier 2 HTTP-based tests (resolve,
      # plugins, internal-api negative fence) in prod. Tier 2's
      # SSM-dependent tests (knock per-instance) will skip
      # cleanly because allow_ssm_probes=false. Tier 3 lands in
      # PR3.
      tier: tier1+tier2
      allow_ssm_probes: false
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}

  # =============================================================================
  # MONITOR - Post-deploy CloudWatch alarm watch
  # =============================================================================
  monitor:
    name: Post-Deploy Monitor
    needs: [smoke-test, qurl-smoke-tests]
    if: |
      always() &&
      (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped') &&
      (needs.qurl-smoke-tests.result == 'success' || needs.qurl-smoke-tests.result == 'skipped') &&
      (needs.smoke-test.result == 'success' || needs.qurl-smoke-tests.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: List monitored alarms
        run: |
          echo "Discovering CloudWatch alarms with prefix 'layerv-nhp-prod'..."
          ALL_ALARMS=$(aws cloudwatch describe-alarms \
            --alarm-name-prefix "layerv-nhp-prod" \
            --query "MetricAlarms[*].{Name: AlarmName, State: StateValue, Metric: MetricName}" \
            --output table 2>/dev/null || echo "No alarms found")
          echo "$ALL_ALARMS"

          ALARM_COUNT=$(aws cloudwatch describe-alarms \
            --alarm-name-prefix "layerv-nhp-prod" \
            --query "length(MetricAlarms)" --output text 2>/dev/null || echo "0")
          echo "::notice::Monitoring $ALARM_COUNT alarm(s) for 5 minutes"

      - name: Monitor CloudWatch alarms (5 minutes)
        id: monitor-step
        run: |
          echo "Monitoring CloudWatch alarms for 5 minutes..."
          echo ""

          CHECKS=10
          INTERVAL=30

          for i in $(seq 1 $CHECKS); do
            ALARMS=$(aws cloudwatch describe-alarms \
              --alarm-name-prefix "layerv-nhp-prod" \
              --state-value ALARM \
              --query "MetricAlarms[*].AlarmName" --output text 2>/dev/null || echo "")

            ELAPSED=$(( i * INTERVAL ))

            if [[ -n "$ALARMS" && "$ALARMS" != "None" ]]; then
              echo "::error::CloudWatch alarm(s) in ALARM state after ${ELAPSED}s: $ALARMS"
              echo ""
              ALARM_DETAILS=$(aws cloudwatch describe-alarms \
                --alarm-name-prefix "layerv-nhp-prod" \
                --state-value ALARM \
                --query "MetricAlarms[*].{Name: AlarmName, Reason: StateReason}" \
                --output json 2>/dev/null || echo "[]")
              echo "$ALARM_DETAILS" | jq -r '.[] | "  \(.Name): \(.Reason)"' 2>/dev/null || true

              # Write failure details to step summary
              {
                echo "## Post-Deploy Monitor"
                echo ""
                echo "> :x: **Alarm(s) triggered** after ${ELAPSED}s"
                echo ""
                echo "| Alarm | Reason |"
                echo "|-------|--------|"
                echo "$ALARM_DETAILS" | jq -r '.[] | "| `\(.Name)` | \(.Reason | .[0:100]) |"' 2>/dev/null || echo "| (parse error) | — |"
                echo ""
                CW_URL="https://${AWS_REGION}.console.aws.amazon.com/cloudwatch/home?region=${AWS_REGION}#alarmsV2:?~(alarmStateFilter~'ALARM)"
                echo "[View alarms in CloudWatch Console]($CW_URL)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "  Check $i/$CHECKS (${ELAPSED}s): All alarms OK"
            if [[ $i -lt $CHECKS ]]; then
              sleep "$INTERVAL"
            fi
          done

          echo ""
          echo "::notice::No alarms triggered during 5-minute monitoring window"

          {
            echo "## Post-Deploy Monitor"
            echo ""
            echo "> :white_check_mark: **5-minute monitoring window passed** — no alarms triggered"
            echo ""
            echo "10 checks at 30s intervals. All \`layerv-nhp-prod*\` alarms remained in OK state."
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # FINALIZE - Tracking, metrics, notifications, summary
  # =============================================================================
  finalize:
    name: Finalize
    if: always()
    needs: [manifest, preflight, terraform-plan, terraform-apply, deploy-server, deploy-ac, deploy-qurl, smoke-test, qurl-smoke-tests, nhp-smoke-tests, monitor]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine deployment outcome
        id: outcome
        env:
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TF_PLAN_RESULT: ${{ needs.terraform-plan.result }}
          TF_RESULT: ${{ needs.terraform-apply.result }}
          SERVER_RESULT: ${{ needs.deploy-server.result }}
          AC_RESULT: ${{ needs.deploy-ac.result }}
          QURL_RESULT: ${{ needs.deploy-qurl.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          QURL_SMOKE_RESULT: ${{ needs.qurl-smoke-tests.result }}
          # NHP_SMOKE_RESULT is tracked for reporting but intentionally
          # not included in the FAILED loop below — PR1 ships smoke as
          # report-only. PR3 moves it into the FAILED loop once the
          # harness has burned in.
          NHP_SMOKE_RESULT: ${{ needs.nhp-smoke-tests.result }}
          MONITOR_RESULT: ${{ needs.monitor.result }}
        run: |
          # Check if any non-skipped job failed. nhp-smoke-tests is
          # deliberately excluded during the PR1/PR2 burn-in.
          FAILED=false
          for result in "$MANIFEST_RESULT" "$PREFLIGHT_RESULT" "$TF_PLAN_RESULT" "$TF_RESULT" "$SERVER_RESULT" "$AC_RESULT" "$QURL_RESULT" "$SMOKE_RESULT" "$QURL_SMOKE_RESULT" "$MONITOR_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              FAILED=true
              break
            fi
          done
          echo "NHP smoke (informational): $NHP_SMOKE_RESULT"

          if [[ "$FAILED" == "true" ]]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Release deployment lock
        if: always()
        env:
          DEPLOY_STATUS: ${{ steps.outcome.outputs.status }}
        run: |
          echo "Releasing deployment lock..."
          LOCK_VALUE="deployed"
          if [[ "$DEPLOY_STATUS" != "success" ]]; then
            LOCK_VALUE="failed"
          fi
          aws ssm put-parameter \
            --name "/prod/nhp/deploy/state" \
            --value "$LOCK_VALUE" \
            --type String \
            --overwrite || echo "::warning::Failed to release deployment lock"
          echo "  Lock released: /prod/nhp/deploy/state = $LOCK_VALUE"

      - name: Update deployment tracking
        if: steps.outcome.outputs.status == 'success'
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
        run: |
          echo "Updating deployment tracking..."

          # Save the current deployed-commit as previous before overwriting,
          # so rollback can target the actual previous version (not current)
          CURRENT=$(aws ssm get-parameter \
            --name "/prod/nhp/deploy/deployed-commit" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [[ -n "$CURRENT" && "$CURRENT" != "initial" && "$CURRENT" != "$IMAGE_TAG" ]]; then
            aws ssm put-parameter \
              --name "/prod/nhp/deploy/deployed-commit-previous" \
              --value "$CURRENT" --type String --overwrite \
              || echo "::warning::Failed to update deployed-commit-previous"
            echo "  Previous commit saved: deployed-commit-previous=$CURRENT"
          fi

          aws ssm put-parameter \
            --name "/prod/nhp/deploy/deployed-commit" \
            --value "$IMAGE_TAG" --type String --overwrite \
            || echo "::warning::Failed to update deployed-commit"
          aws ssm put-parameter \
            --name "/prod/nhp/deploy/deployed-at" \
            --value "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --type String --overwrite \
            || echo "::warning::Failed to update deployed-at"
          echo "  Tracking updated: deployed-commit=$IMAGE_TAG"

      - name: Update terraform apply tracking
        if: needs.terraform-apply.result == 'success'
        run: |
          echo "Recording last successful terraform apply commit..."
          aws ssm put-parameter \
            --name "/prod/nhp/deploy/last-terraform-apply-commit" \
            --value "${{ github.sha }}" --type String --overwrite \
            || echo "::warning::Failed to update last-terraform-apply-commit"
          aws ssm put-parameter \
            --name "/prod/nhp/deploy/last-terraform-apply-at" \
            --value "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --type String --overwrite \
            || echo "::warning::Failed to update last-terraform-apply-at"
          echo "  Terraform tracking: last-terraform-apply-commit=${{ github.sha }}"

      - name: Push CloudWatch deployment metric
        if: always()
        env:
          DEPLOY_STATUS: ${{ steps.outcome.outputs.status }}
        run: |
          aws cloudwatch put-metric-data \
            --namespace "LayerV/NHP" \
            --metric-name "DeploymentEvent" \
            --dimensions "Environment=prod,Strategy=promote,Status=$DEPLOY_STATUS" \
            --value 1 \
            --unit Count \
            || echo "::warning::Failed to push deployment metric"
          echo "  Deployment metric pushed: Status=$DEPLOY_STATUS"

      - name: Send SNS notification
        if: always()
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
          DEPLOY_STATUS: ${{ steps.outcome.outputs.status }}
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TF_PLAN_RESULT: ${{ needs.terraform-plan.result }}
          TF_RESULT: ${{ needs.terraform-apply.result }}
          SERVER_RESULT: ${{ needs.deploy-server.result }}
          AC_RESULT: ${{ needs.deploy-ac.result }}
          QURL_RESULT: ${{ needs.deploy-qurl.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          QURL_SMOKE_RESULT: ${{ needs.qurl-smoke-tests.result }}
          NHP_SMOKE_RESULT: ${{ needs.nhp-smoke-tests.result }}
          MONITOR_RESULT: ${{ needs.monitor.result }}
          ROLLBACK: ${{ inputs.rollback }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SNS_ARN=$(aws ssm get-parameter \
            --name "/prod/nhp/monitoring/sns-topic-arn" \
            --query 'Parameter.Value' --output text 2>/dev/null) || SNS_ARN=""

          if [[ -z "$SNS_ARN" || ! "$SNS_ARN" =~ ^arn:aws:sns: ]]; then
            echo "No valid SNS topic ARN found, skipping notification"
            exit 0
          fi

          STATUS_UPPER=$(echo "$DEPLOY_STATUS" | tr '[:lower:]' '[:upper:]')
          MODE=""
          if [[ "$ROLLBACK" == "true" ]]; then
            MODE=" (ROLLBACK)"
          fi

          SUBJECT="Promote to Prod: ${STATUS_UPPER}${MODE} - ${IMAGE_TAG:0:7}"

          result_icon() {
            case "$1" in
              success) echo "[OK]" ;;
              skipped) echo "[SKIP]" ;;
              failure) echo "[FAIL]" ;;
              cancelled) echo "[CANCEL]" ;;
              *) echo "[$1]" ;;
            esac
          }

          MSG="Production Promotion Notification${MODE}"
          MSG+="\n"
          MSG+="\n  Status:    ${STATUS_UPPER}"
          MSG+="\n  Image Tag: ${IMAGE_TAG}"
          MSG+="\n  Triggered: ${{ github.actor }}"
          MSG+="\n"
          MSG+="\n  Manifest:   $(result_icon "$MANIFEST_RESULT")"
          MSG+="\n  Preflight:  $(result_icon "$PREFLIGHT_RESULT")"
          MSG+="\n  TF Plan:    $(result_icon "$TF_PLAN_RESULT")"
          MSG+="\n  TF Apply:   $(result_icon "$TF_RESULT")"
          MSG+="\n  Server:     $(result_icon "$SERVER_RESULT")"
          MSG+="\n  AC:         $(result_icon "$AC_RESULT")"
          MSG+="\n  QURL:       $(result_icon "$QURL_RESULT")"
          MSG+="\n  Smoke Test: $(result_icon "$SMOKE_RESULT")"
          MSG+="\n  QURL Smoke: $(result_icon "$QURL_SMOKE_RESULT")"
          MSG+="\n  NHP Smoke:  $(result_icon "$NHP_SMOKE_RESULT")"
          MSG+="\n  Monitor:    $(result_icon "$MONITOR_RESULT")"
          MSG+="\n"
          MSG+="\n  Run: ${WORKFLOW_URL}"

          aws sns publish \
            --topic-arn "$SNS_ARN" \
            --subject "$SUBJECT" \
            --message "$(echo -e "$MSG")" \
            || echo "::warning::SNS notification failed"

      - name: Deployment summary
        if: always()
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
          DEPLOY_STATUS: ${{ steps.outcome.outputs.status }}
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TF_PLAN_RESULT: ${{ needs.terraform-plan.result }}
          TF_RESULT: ${{ needs.terraform-apply.result }}
          SERVER_RESULT: ${{ needs.deploy-server.result }}
          AC_RESULT: ${{ needs.deploy-ac.result }}
          QURL_RESULT: ${{ needs.deploy-qurl.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          QURL_SMOKE_RESULT: ${{ needs.qurl-smoke-tests.result }}
          NHP_SMOKE_RESULT: ${{ needs.nhp-smoke-tests.result }}
          MONITOR_RESULT: ${{ needs.monitor.result }}
          ROLLBACK: ${{ inputs.rollback }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result_emoji() {
            case "$1" in
              success) echo ":white_check_mark:" ;;
              skipped) echo ":fast_forward:" ;;
              failure) echo ":x:" ;;
              cancelled) echo ":stop_sign:" ;;
              *) echo ":grey_question:" ;;
            esac
          }

          {
            echo "---"
            echo "## Deployment Summary"
            echo ""
            if [[ "$DEPLOY_STATUS" == "success" ]]; then
              echo "> :white_check_mark: **Production deployment successful**"
            else
              echo "> :x: **Production deployment failed**"
            fi
            if [[ "$ROLLBACK" == "true" ]]; then
              echo "> :warning: This was a **ROLLBACK** deployment"
            fi
            echo ""
            echo "### Job Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Manifest | $(result_emoji "$MANIFEST_RESULT") $MANIFEST_RESULT |"
            echo "| Preflight | $(result_emoji "$PREFLIGHT_RESULT") $PREFLIGHT_RESULT |"
            echo "| Terraform Plan | $(result_emoji "$TF_PLAN_RESULT") $TF_PLAN_RESULT |"
            echo "| Terraform Apply | $(result_emoji "$TF_RESULT") $TF_RESULT |"
            echo "| Deploy Server | $(result_emoji "$SERVER_RESULT") $SERVER_RESULT |"
            echo "| Deploy AC | $(result_emoji "$AC_RESULT") $AC_RESULT |"
            echo "| Deploy QURL | $(result_emoji "$QURL_RESULT") $QURL_RESULT |"
            echo "| Smoke Test | $(result_emoji "$SMOKE_RESULT") $SMOKE_RESULT |"
            echo "| QURL Smoke Tests | $(result_emoji "$QURL_SMOKE_RESULT") $QURL_SMOKE_RESULT |"
            echo "| NHP Smoke Tests (report-only) | $(result_emoji "$NHP_SMOKE_RESULT") $NHP_SMOKE_RESULT |"
            echo "| Monitor | $(result_emoji "$MONITOR_RESULT") $MONITOR_RESULT |"
            echo ""
            echo "### Deployed Artifacts"
            echo "| Component | Image |"
            echo "|-----------|-------|"
            echo "| NHP Server | \`$ECR_SERVER_REPO:$IMAGE_TAG\` |"
            echo "| Access Controller | \`$ECR_AC_REPO:$IMAGE_TAG\` |"
            echo "| QURL Service | \`$ECR_QURL_REPO:${QURL_IMAGE_TAG:-N/A}\` |"
            echo ""
            echo "### Quick Links"
            echo "- [ECS Console](https://${AWS_REGION}.console.aws.amazon.com/ecs/v2/clusters?region=${AWS_REGION})"
            echo "- [CloudWatch Alarms](https://${AWS_REGION}.console.aws.amazon.com/cloudwatch/home?region=${AWS_REGION}#alarmsV2:)"
            echo "- [Step Functions](https://${AWS_REGION}.console.aws.amazon.com/states/home?region=${AWS_REGION}#/statemachines)"
            echo "- [This workflow run]($WORKFLOW_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
