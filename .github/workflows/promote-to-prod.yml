name: Promote to Production

# Enterprise-grade promotion workflow. Deploys existing sandbox ECR images to prod
# using proven deployment mechanisms (canary for server/AC, ECS task def for QURL).
#
# Deployment flow:
#   manifest → preflight (approval) → terraform-plan (shows diff)
#           → terraform-apply (approval) → deploy-server (canary)
#           → deploy-ac (canary) → deploy-qurl (ECS) → deploy-qrts (ASG)
#           → smoke-test / qurl-smoke-tests / qrts-smoke-tests → monitor
#           → nhp-smoke-tests and monitor → finalize
#
# Usage:
#   # Full promotion (all components)
#   gh workflow run promote-to-prod.yml --ref main \
#     -f image_tag=<commit-sha> -f deploy_server=true -f deploy_ac=true \
#     -f deploy_qurl=true -f run_terraform=true
#
#   # Terraform-only (no service restarts — default behavior)
#   gh workflow run promote-to-prod.yml --ref main \
#     -f image_tag=<commit-sha>
#
#   # Terraform + QURL (e.g., new env vars in task definition)
#   gh workflow run promote-to-prod.yml --ref main \
#     -f image_tag=<commit-sha> -f deploy_qurl=true
#
#   # QURL-only deployment
#   gh workflow run promote-to-prod.yml --ref main \
#     -f image_tag=<any-valid-sha> -f deploy_qurl=true \
#     -f qurl_image_tag=<qurl-tag>
#
#   # Rollback to previous known-good state
#   gh workflow run promote-to-prod.yml --ref main \
#     -f image_tag=<any-valid-sha> -f rollback=true
#
#   # Recommended: use the trigger script for automatic change detection
#   ./scripts/trigger-prod-deploy.sh

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Commit SHA for NHP Server + AC images in sandbox ECR'
        required: true
        type: string
      qurl_image_tag:
        description: 'QURL service image tag (reads from sandbox SSM if empty)'
        required: false
        default: ''
        type: string
      frps_image_tag:
        description: 'qurl-reverse-tunnel-server image tag for terraform deploy_frps precondition (reads from sandbox SSM if empty)'
        required: false
        default: ''
        type: string
      run_terraform:
        description: 'Run terraform apply (required for first deploy or infra changes)'
        required: false
        default: true
        type: boolean
      deploy_server:
        description: 'Deploy NHP Server via canary'
        required: false
        default: false
        type: boolean
      deploy_ac:
        description: 'Deploy Access Controller via canary'
        required: false
        default: false
        type: boolean
      deploy_qurl:
        description: 'Deploy QURL Service via ECS task definition'
        required: false
        default: false
        type: boolean
      deploy_qrts:
        description: 'Deploy qurl-reverse-tunnel-server (qrts): write prod image-tag SSM + ASG instance-refresh'
        required: false
        default: false
        type: boolean
      deploy_relay:
        description: 'Deploy NHP-Relay: write prod image-tag SSM + ASG instance-refresh. No-ops cleanly while deploy_relay=false in tfvars (asg-name param absent).'
        required: false
        default: false
        type: boolean
      cell_id:
        description: 'Target cell identifier'
        required: false
        default: 'cell0'
        type: string
      rollback:
        description: 'Rollback to previous deployed-commit from SSM. Auto-bypasses the stale-terraform check (rolling back app code typically wants existing infra; the diff is still emitted inline). Requires at least one deploy_*=true to confirm which artifact to roll back. See docs/runbooks/promote-to-prod-partial-deploy.md "Bypasses you should know about" for the runtime caveat (a pre-infra-change image against post-infra-change resources can still fail at runtime).'
        required: false
        default: false
        type: boolean
      force_unlock:
        description: 'Force-release a stale deployment lock (e.g., from a cancelled workflow)'
        required: false
        default: false
        type: boolean
      ami_max_age_days:
        description: 'Fail if the prod NHP Server AMI is older than this many days. Default targets the AMI rebuild cadence (every ~6 weeks); tighten if rebuilds become more frequent.'
        required: false
        default: '60'
        type: string
      force_stale_ami:
        description: 'Bypass the AMI age check (use only for intentional rollback to an older known-good image, or while a fresh AMI is rebuilding).'
        required: false
        default: false
        type: boolean
      allow_stale_terraform:
        description: 'Bypass the stale-terraform check that fails when run_terraform=false but terraform/** has changed since the last successful prod apply. ONLY consulted when run_terraform=false; a no-op otherwise (run_terraform=true runs terraform-plan + terraform-apply, which lands the diff). Use only for intentional rollbacks or when you have already verified the diff is benign.'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  actions: write  # needed for gh workflow run dispatch
  attestations: read  # gh attestation verify in the deploy-time image gate (#1334)
  # Note: the preflight force-push-protection check needs
  # `administration: read` to read branch-protection. That scope IS a
  # valid `permissions:` key (per GitHub docs), but two separate
  # constraints currently keep us from declaring it here:
  # (a) actionlint's permission whitelist (older versions) flags it,
  #     so a YAML grant would fail `make lint-workflows`;
  # (b) GITHUB_TOKEN scope elevation also requires the repo/org's
  #     "Workflow permissions" settings to allow elevated default-
  #     token scopes (Settings → Actions → General).
  # Until both are addressed (or a fine-grained PAT is provisioned),
  # the check downgrades to a ::warning:: + `protection_status:
  # unverified` SNS row when `gh api` returns 403. Operator path to
  # fail-loud: bump actionlint, then add `administration: read` here,
  # then ensure repo settings allow it. Tracked separately in #1362.

concurrency:
  group: promote-to-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.14.3'
  PROD_MGMT_ACCOUNT_ID: '165115313779'
  PROD_ACCOUNT_ID: '235500187906'
  SANDBOX_ACCOUNT_ID: '767397897469'
  ECR_SERVER_REPO: 'layerv/nhp-server'
  ECR_AC_REPO: 'layerv/nhp-ac'
  ECR_QURL_REPO: 'layerv/nhp-qurl'
  ECR_QRTS_REPO: 'layerv/qurl-reverse-tunnel-server'
  ECR_RELAY_REPO: 'layerv/nhp-relay'
  PROD_SSM_PREFIX: 'layerv-nhp-prod'
  # Table-name prefix for the qurl agent-identity tables the pre-deploy
  # inventory gate scans (qurl-service#1237). Prod runs a single cell; if a
  # second prod cell ever lands, the gate must run once per cell prefix —
  # a single-cell run would report PASS while the other cell went unchecked.
  PROD_QURL_TABLE_PREFIX: 'layerv-nhp-prod-cell0'

jobs:
  # =============================================================================
  # MANIFEST - Pre-approval promotion summary (NO environment gate)
  # =============================================================================
  manifest:
    name: Promotion Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      qurl_image_tag: ${{ steps.resolve-qurl-tag.outputs.qurl_image_tag }}
      frps_image_tag: ${{ steps.resolve-frps-tag.outputs.frps_image_tag }}
      current_prod_qurl_tag: ${{ steps.prod-state.outputs.qurl_tag }}
      current_prod_frps_tag: ${{ steps.prod-state.outputs.frps_tag }}
      effective_image_tag: ${{ steps.resolve-rollback.outputs.effective_image_tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate image_tag format
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! echo "$IMAGE_TAG" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "::error::image_tag must be a 7-40 character hex commit SHA, got: '$IMAGE_TAG'"
            exit 1
          fi
          if ! git rev-parse --verify "${IMAGE_TAG}^{commit}" > /dev/null 2>&1; then
            echo "::error::Commit $IMAGE_TAG not found in this repository"
            exit 1
          fi
          echo "Image tag valid: $IMAGE_TAG (commit exists in repo)"

      # Reject a no-op dispatch: run_terraform=false + every deploy_*=
      # false would proceed through preflight, skip every job, and
      # finalize would write LOCK_VALUE=deployed even though prod state
      # is unchanged. The runbook's lock-state table reads "deployed"
      # as "prod is now running the new artifacts," which would be a
      # lie. Reject at the earliest possible moment so the operator
      # gets a clear error rather than an inscrutable green checkmark.
      - name: Reject no-op dispatch
        env:
          RUN_TERRAFORM: ${{ inputs.run_terraform }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_AC: ${{ inputs.deploy_ac }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
          DEPLOY_QRTS: ${{ inputs.deploy_qrts }}
          ROLLBACK: ${{ inputs.rollback }}
          ALLOW_STALE_TERRAFORM: ${{ inputs.allow_stale_terraform }}
          FORCE_UNLOCK: ${{ inputs.force_unlock }}
        run: |
          if [[ "$RUN_TERRAFORM" != "true" \
             && "$DEPLOY_SERVER" != "true" \
             && "$DEPLOY_AC" != "true" \
             && "$DEPLOY_QURL" != "true" \
             && "$DEPLOY_QRTS" != "true" ]]; then
            # Compose: enumerate every set-but-meaningless flag so an
            # operator who set both rollback=true AND force_unlock=true
            # sees both diagnostics, not just the first matching elif.
            BYPASS_FLAGS=()
            [[ "$ROLLBACK" == "true" ]] && BYPASS_FLAGS+=("rollback=true (a rollback intent flag; needs at least one of run_terraform / deploy_*=true to specify which surface to roll back — terraform-only rollback is valid via run_terraform=true alone)")
            [[ "$ALLOW_STALE_TERRAFORM" == "true" ]] && BYPASS_FLAGS+=("allow_stale_terraform=true (a bypass for the stale-terraform check, not a deploy directive)")
            [[ "$FORCE_UNLOCK" == "true" ]] && BYPASS_FLAGS+=("force_unlock=true (a lock-bypass for clearing a stale 'deploying' state, not a deploy directive)")
            if (( ${#BYPASS_FLAGS[@]} > 0 )); then
              echo "::error::No-op dispatch: every deploy_*=false AND run_terraform=false, but the following bypass/intent flags are set without a deploy target:"
              for flag in "${BYPASS_FLAGS[@]}"; do
                echo "  - $flag"
              done
              echo "::error::Set at least one of run_terraform / deploy_server / deploy_ac / deploy_qurl / deploy_qrts to true (the bypass flags apply to the run that actually deploys, not on their own)."
              echo "::error::See docs/runbooks/promote-to-prod-partial-deploy.md \"Bypasses you should know about\" for the manual-SSM stuck-lock-clear path if you need to reset state without redeploying."
            else
              echo "::error::No-op dispatch: run_terraform=false AND every deploy_*=false. Set at least one to true (run_terraform=true is the typical full-promote default)."
            fi
            exit 1
          fi

      - name: Configure AWS credentials (sandbox - read-only)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve QURL image tag
        id: resolve-qurl-tag
        env:
          QURL_IMAGE_TAG_INPUT: ${{ inputs.qurl_image_tag }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          if [[ -n "$QURL_IMAGE_TAG_INPUT" ]]; then
            echo "Using provided QURL image tag: $QURL_IMAGE_TAG_INPUT"
            echo "qurl_image_tag=$QURL_IMAGE_TAG_INPUT" >> "$GITHUB_OUTPUT"
          elif [[ "$ROLLBACK" == "true" && "$DEPLOY_QURL" == "true" ]]; then
            echo "::error::rollback=true with deploy_qurl=true requires an explicit qurl_image_tag."
            echo "::error::QURL is not tracked by deployed-commit, so automatic rollback is not possible."
            echo "::error::Either provide qurl_image_tag or set deploy_qurl=false."
            exit 1
          else
            echo "No QURL image tag provided, reading from sandbox SSM..."
            QURL_TAG=$(aws ssm get-parameter \
              --name "/layerv-nhp-sandbox/qurl-api-image-tag" \
              --query "Parameter.Value" --output text 2>/dev/null || echo "")
            if [[ -z "$QURL_TAG" || "$QURL_TAG" == "latest" ]]; then
              echo "::warning::Could not resolve QURL image tag from sandbox SSM"
              echo "qurl_image_tag=" >> "$GITHUB_OUTPUT"
            else
              echo "Resolved QURL image tag from sandbox SSM: $QURL_TAG"
              echo "qurl_image_tag=$QURL_TAG" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Resolve FRPS image tag
        id: resolve-frps-tag
        env:
          FRPS_IMAGE_TAG_INPUT: ${{ inputs.frps_image_tag }}
          SSM_FRPS_PARAM: /sandbox/nhp/reverse-tunnel-server/image-tag
          DEPLOY_QRTS: ${{ inputs.deploy_qrts }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          # qurl-reverse-tunnel-server image tag for terraform's
          # `deploy_frps => non-bootstrap frps_image_tag` precondition and for
          # deploy-qrts's SSM image-tag + ASG instance-refresh step. Resolve the
          # sandbox-validated tag instead of baking a SHA in tfvars (mirrors the
          # qurl_image_tag flow above).
          #
          # Hardened beyond resolve-qurl-tag per cr on #2235 (the build-and-push
          # sibling's defensive shape, #1575): Docker TagRegexp validation so a
          # malformed SSM value can't smuggle metacharacters/newlines into
          # GITHUB_OUTPUT, region pin, and ParameterNotFound distinguished from
          # real AWS errors (IAM/creds/throttle) so a creds regression fails
          # loud rather than silently collapsing to the placeholder.
          #
          # On the benign "no real tag yet" path we emit the bootstrap
          # placeholder so the terraform precondition fails loud when
          # deploy_frps=true, and stays inert when deploy_frps=false.

          # Docker distribution TagRegexp: leading char restricted, then
          # [A-Za-z0-9._-], 1-128 chars total.
          TAG_RE='^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'
          QRTS_SHA_RE='^[0-9a-f]{40}$'

          if [[ -n "$FRPS_IMAGE_TAG_INPUT" ]]; then
            if [[ ! "$FRPS_IMAGE_TAG_INPUT" =~ $TAG_RE ]]; then
              echo "::error::Provided frps_image_tag is not a valid Docker tag: $(printf %q "$FRPS_IMAGE_TAG_INPUT")"
              exit 1
            fi
            if [[ "$DEPLOY_QRTS" == "true" && ! "$FRPS_IMAGE_TAG_INPUT" =~ $QRTS_SHA_RE ]]; then
              echo "::error::deploy_qrts=true requires frps_image_tag to be a full 40-character lowercase git SHA so QRtS smoke can verify the refreshed binary; got $(printf %q "$FRPS_IMAGE_TAG_INPUT")."
              exit 1
            fi
            echo "Using provided FRPS image tag: $FRPS_IMAGE_TAG_INPUT"
            echo "frps_image_tag=$FRPS_IMAGE_TAG_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rollback safety (symmetric with resolve-qurl-tag's guard above):
          # qrts isn't tracked by deployed-commit — the running tag lives in
          # SSM. A rollback that deploys qrts must pin frps_image_tag
          # explicitly, else resolving from sandbox SSM would "roll back" to
          # the CURRENT sandbox tag, not the prior prod one.
          if [[ "$ROLLBACK" == "true" && "$DEPLOY_QRTS" == "true" ]]; then
            echo "::error::rollback=true with deploy_qrts=true requires an explicit frps_image_tag (qrts isn't tracked by deployed-commit). Provide frps_image_tag or set deploy_qrts=false."
            exit 1
          fi

          # INVARIANT: the failure paths below MUST emit the literal
          # `v0.0.0-bootstrap`, never an empty string. TF_VAR_frps_image_tag=""
          # would OVERRIDE the variable's `v0.0.0-bootstrap` default to empty,
          # which slips past the `^v0\.0\.0-bootstrap` precondition regex and
          # silently bypasses the deploy_frps gate. Keep it non-empty so the
          # precondition fails loud when deploy_frps=true.
          echo "No FRPS image tag provided, reading from sandbox SSM ($SSM_FRPS_PARAM)..."
          SSM_ERR="$(mktemp)"
          trap 'rm -f "$SSM_ERR"' EXIT
          if FRPS_TAG="$(aws ssm get-parameter --region "$AWS_REGION" --name "$SSM_FRPS_PARAM" --query "Parameter.Value" --output text 2>"$SSM_ERR")"; then
            if [[ -z "$FRPS_TAG" || "$FRPS_TAG" == "None" || "$FRPS_TAG" =~ ^v0\.0\.0-bootstrap ]]; then
              echo "::warning::SSM $SSM_FRPS_PARAM holds no real tag (got '$FRPS_TAG'). deploy_frps=true (tfvars) will fail the terraform non-bootstrap precondition, and deploy_qrts=true will fail the deploy-qrts pre-check — provide frps_image_tag explicitly."
              echo "frps_image_tag=v0.0.0-bootstrap" >> "$GITHUB_OUTPUT"
            elif [[ ! "$FRPS_TAG" =~ $TAG_RE ]]; then
              echo "::error::SSM $SSM_FRPS_PARAM holds a value that is not a valid Docker tag: $(printf %q "$FRPS_TAG")"
              exit 1
            elif [[ "$DEPLOY_QRTS" == "true" && ! "$FRPS_TAG" =~ $QRTS_SHA_RE ]]; then
              echo "::error::SSM $SSM_FRPS_PARAM resolved $(printf %q "$FRPS_TAG"), but deploy_qrts=true requires a full 40-character lowercase git SHA so QRtS smoke can verify the refreshed binary."
              exit 1
            else
              echo "Resolved FRPS image tag from sandbox SSM: $FRPS_TAG"
              echo "frps_image_tag=$FRPS_TAG" >> "$GITHUB_OUTPUT"
            fi
          elif grep -q "ParameterNotFound" "$SSM_ERR"; then
            # Benign: sandbox rts CI hasn't published yet — placeholder, fail
            # loud only if deploy_frps=true downstream.
            echo "::warning::SSM $SSM_FRPS_PARAM not found (sandbox rts CI hasn't published). deploy_frps=true (tfvars) will fail the terraform non-bootstrap precondition, and deploy_qrts=true will fail the deploy-qrts pre-check — provide frps_image_tag explicitly."
            echo "frps_image_tag=v0.0.0-bootstrap" >> "$GITHUB_OUTPUT"
          else
            # Real error (IAM/creds/throttle/region) — do not mask as placeholder.
            echo "::error::Failed to read $SSM_FRPS_PARAM (not ParameterNotFound):"
            cat "$SSM_ERR" >&2
            exit 1
          fi

      - name: Gather sandbox state
        id: sandbox-state
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          SANDBOX_ACTIVE_COLOR=$(aws ssm get-parameter \
            --name "/sandbox/nhp/server/active-color" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "unknown")
          # Resolve via active-color → slot indirection (resolve-active-image-tag.sh).
          # Reading /sandbox/nhp/<component>/image-tag directly returns the blue-slot
          # tag, which is the active tag only when active-color=blue. Promote-to-prod
          # would otherwise surface (and potentially promote) a stale standby tag
          # any time a deploy ended with active=green.
          SANDBOX_SERVER_TAG=$(./.github/scripts/resolve-active-image-tag.sh sandbox server 2>/dev/null || echo "unknown")
          SANDBOX_AC_TAG=$(./.github/scripts/resolve-active-image-tag.sh sandbox ac 2>/dev/null || echo "unknown")
          SANDBOX_QURL_TAG=$(aws ssm get-parameter \
            --name "/layerv-nhp-sandbox/qurl-api-image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "unknown")

          # Calculate soak duration
          SANDBOX_DEPLOYED_AT=$(aws ssm get-parameter \
            --name "/sandbox/nhp/deploy/deployed-at" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [[ -n "$SANDBOX_DEPLOYED_AT" && "$SANDBOX_DEPLOYED_AT" != "initial" ]]; then
            DEPLOYED_EPOCH=$(date -d "$SANDBOX_DEPLOYED_AT" +%s 2>/dev/null || echo "0")
            NOW_EPOCH=$(date +%s)
            if [[ "$DEPLOYED_EPOCH" -gt 0 ]]; then
              SOAK_SECONDS=$(( NOW_EPOCH - DEPLOYED_EPOCH ))
              SOAK_HOURS=$(( SOAK_SECONDS / 3600 ))
              if [[ "$SOAK_HOURS" -gt 0 ]]; then
                SOAK_DURATION="${SOAK_HOURS}h"
              else
                SOAK_MINUTES=$(( SOAK_SECONDS / 60 ))
                SOAK_DURATION="${SOAK_MINUTES}m"
              fi
            else
              SOAK_DURATION="unknown"
            fi
          else
            SOAK_DURATION="unknown"
          fi

          {
            echo "active_color=$SANDBOX_ACTIVE_COLOR"
            echo "server_tag=$SANDBOX_SERVER_TAG"
            echo "ac_tag=$SANDBOX_AC_TAG"
            echo "qurl_tag=$SANDBOX_QURL_TAG"
            echo "soak_duration=$SOAK_DURATION"
          } >> "$GITHUB_OUTPUT"

      - name: Get image metadata from ECR
        id: ecr-metadata
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          QURL_IMAGE_TAG: ${{ steps.resolve-qurl-tag.outputs.qurl_image_tag }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_AC: ${{ inputs.deploy_ac }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
        run: |
          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            SERVER_PUSHED=$(aws ecr describe-images \
              --repository-name "$ECR_SERVER_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" --output text 2>/dev/null || echo "N/A")
          else
            SERVER_PUSHED="N/A"
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            AC_PUSHED=$(aws ecr describe-images \
              --repository-name "$ECR_AC_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" --output text 2>/dev/null || echo "N/A")
          else
            AC_PUSHED="N/A"
          fi

          if [[ "$DEPLOY_QURL" == "true" && -n "$QURL_IMAGE_TAG" ]]; then
            QURL_PUSHED=$(aws ecr describe-images \
              --repository-name "$ECR_QURL_REPO" \
              --image-ids imageTag="$QURL_IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" --output text 2>/dev/null || echo "N/A")
          else
            QURL_PUSHED="N/A"
          fi

          {
            echo "server_pushed=$SERVER_PUSHED"
            echo "ac_pushed=$AC_PUSHED"
            echo "qurl_pushed=$QURL_PUSHED"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (prod - for state read)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read current prod state
        id: prod-state
        run: |
          PROD_SERVER_TAG=$(aws ssm get-parameter \
            --name "/prod/nhp/server/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "not deployed")
          PROD_AC_TAG=$(aws ssm get-parameter \
            --name "/prod/nhp/ac/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "not deployed")
          PROD_QURL_TAG=$(aws ssm get-parameter \
            --name "/${PROD_SSM_PREFIX}/qurl-api-image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "not deployed")
          # QRtS image tags are owned by qurl-reverse-tunnel-server CI and live
          # in the /prod/nhp namespace, not the legacy layerv-nhp-prod prefix.
          # Empty means "no rollback hint" for qrts-smoke-tests. Do not forward
          # sentinels or bootstrap placeholders as rollback targets.
          QRTS_SHA_RE='^[0-9a-f]{40}$'
          PROD_FRPS_TAG=$(aws ssm get-parameter \
            --name "/prod/nhp/reverse-tunnel-server/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [[ -z "$PROD_FRPS_TAG" || "$PROD_FRPS_TAG" == "None" || "$PROD_FRPS_TAG" =~ ^v0\.0\.0-bootstrap ]]; then
            PROD_FRPS_TAG=""
          elif [[ ! "$PROD_FRPS_TAG" =~ $QRTS_SHA_RE ]]; then
            echo "::warning::Prod QRtS tag $(printf %q "$PROD_FRPS_TAG") is not a full 40-character lowercase git SHA; suppressing rollback hint because deploy_qrts=true would reject it."
            PROD_FRPS_TAG=""
          fi
          PROD_DEPLOYED_COMMIT=$(aws ssm get-parameter \
            --name "/prod/nhp/deploy/deployed-commit" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "not deployed")

          {
            echo "server_tag=$PROD_SERVER_TAG"
            echo "ac_tag=$PROD_AC_TAG"
            echo "qurl_tag=$PROD_QURL_TAG"
            echo "frps_tag=$PROD_FRPS_TAG"
            echo "deployed_commit=$PROD_DEPLOYED_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve rollback target
        id: resolve-rollback
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          if [[ "$ROLLBACK" == "true" ]]; then
            # Read deployed-commit-previous (the version before the current deploy),
            # NOT deployed-commit (which is the currently deployed — possibly broken — version)
            echo "Rollback mode: reading deployed-commit-previous from prod SSM..."
            PREV_COMMIT=$(aws ssm get-parameter \
              --name "/prod/nhp/deploy/deployed-commit-previous" \
              --query "Parameter.Value" --output text 2>/dev/null || echo "")
            # Triple-sentinel check matching the stale-tf guard +
            # `Update deployment tracking`: "" / "initial" / "None"
            # all map to "no real prior commit." Without the "None"
            # branch, an AWS-CLI null-text return (`Parameter.Value`
            # null → literal "None") would slip past `!= "initial"`
            # and hard-fail the SHA-shape regex below — surfacing as
            # a confusing rollback rejection where every other call
            # site warn-passes the same value.
            if [[ -n "$PREV_COMMIT" \
               && "$PREV_COMMIT" != "initial" \
               && "$PREV_COMMIT" != "None" ]]; then
              # SHA shape validation: /prod/nhp/deploy/* is operator-
              # writable (IAM-gated by AWS_PROD_ROLE_ARN, but a misuse
              # could land arbitrary text). Mirror the same regex
              # `manifest.Validate image_tag format` applies to
              # `inputs.image_tag` so a garbage SSM value fails here
              # with a clear diagnostic instead of cascading into a
              # confusing ECR-image-not-found at preflight.
              if ! [[ "$PREV_COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
                echo "::error::deployed-commit-previous in SSM does not look like a commit SHA: '$PREV_COMMIT'"
                echo "  Expected: 7-40 character hex (e.g., 89a6c6e4 or 89a6c6e4f0...)"
                echo "  Manually re-seed via: aws ssm put-parameter --name /prod/nhp/deploy/deployed-commit-previous --value <sha> --overwrite"
                exit 1
              fi
              echo "Previous deployed-commit: $PREV_COMMIT"
              echo "effective_image_tag=$PREV_COMMIT" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::No deployed-commit-previous in SSM (or sentinel value). Falling back to provided image_tag."
              echo "effective_image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "effective_image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          PROD_DEPLOYED_COMMIT: ${{ steps.prod-state.outputs.deployed_commit }}
        run: |
          CHANGELOG=""
          if [[ -n "$PROD_DEPLOYED_COMMIT" && "$PROD_DEPLOYED_COMMIT" != "not deployed" && "$PROD_DEPLOYED_COMMIT" != "initial" ]]; then
            if git rev-parse --verify "${PROD_DEPLOYED_COMMIT}^{commit}" > /dev/null 2>&1; then
              CHANGELOG=$(git log --oneline "${PROD_DEPLOYED_COMMIT}..${IMAGE_TAG}" 2>/dev/null || echo "Unable to generate changelog")
            else
              CHANGELOG="Previous commit $PROD_DEPLOYED_COMMIT not found in local repo"
            fi
          else
            CHANGELOG="First deployment (no previous commit tracked)"
          fi

          # Store changelog in output (escape for multiline)
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write promotion manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          EFFECTIVE_TAG: ${{ steps.resolve-rollback.outputs.effective_image_tag }}
          QURL_IMAGE_TAG: ${{ steps.resolve-qurl-tag.outputs.qurl_image_tag }}
          FRPS_IMAGE_TAG: ${{ steps.resolve-frps-tag.outputs.frps_image_tag }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_AC: ${{ inputs.deploy_ac }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
          DEPLOY_QRTS: ${{ inputs.deploy_qrts }}
          RUN_TERRAFORM: ${{ inputs.run_terraform }}
          ROLLBACK: ${{ inputs.rollback }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          # Sandbox state
          SB_ACTIVE_COLOR: ${{ steps.sandbox-state.outputs.active_color }}
          SB_SERVER_TAG: ${{ steps.sandbox-state.outputs.server_tag }}
          SB_AC_TAG: ${{ steps.sandbox-state.outputs.ac_tag }}
          SB_QURL_TAG: ${{ steps.sandbox-state.outputs.qurl_tag }}
          SB_SOAK: ${{ steps.sandbox-state.outputs.soak_duration }}
          # ECR metadata
          SERVER_PUSHED: ${{ steps.ecr-metadata.outputs.server_pushed }}
          AC_PUSHED: ${{ steps.ecr-metadata.outputs.ac_pushed }}
          QURL_PUSHED: ${{ steps.ecr-metadata.outputs.qurl_pushed }}
          # Prod state
          PROD_SERVER_TAG: ${{ steps.prod-state.outputs.server_tag }}
          PROD_AC_TAG: ${{ steps.prod-state.outputs.ac_tag }}
          PROD_QURL_TAG: ${{ steps.prod-state.outputs.qurl_tag }}
          PROD_FRPS_TAG: ${{ steps.prod-state.outputs.frps_tag }}
          PROD_DEPLOYED_COMMIT: ${{ steps.prod-state.outputs.deployed_commit }}
        run: |
          # Get commit info
          COMMIT_MSG=$(git log -1 --format="%s" "$IMAGE_TAG" 2>/dev/null || echo "unknown")
          COMMIT_DATE=$(git log -1 --format="%ci" "$IMAGE_TAG" 2>/dev/null || echo "unknown")
          COMMIT_AUTHOR=$(git log -1 --format="%an" "$IMAGE_TAG" 2>/dev/null || echo "unknown")

          # Determine tag match
          if [[ "$SB_SERVER_TAG" == *"$IMAGE_TAG"* ]]; then
            TAG_MATCH="matches active sandbox ($SB_ACTIVE_COLOR)"
          else
            TAG_MATCH="does NOT match active sandbox (active=$SB_ACTIVE_COLOR, tag=$SB_SERVER_TAG)"
          fi

          {
            echo "## Promotion Manifest"
            echo ""

            # Rollback banner
            if [[ "$ROLLBACK" == "true" ]]; then
              echo "> :warning: **ROLLBACK MODE** — deploying previous known-good commit: \`$EFFECTIVE_TAG\`"
              if [[ "$DEPLOY_QURL" == "true" ]]; then
                echo "> :information_source: **Note:** QURL rollback is not automatic. The QURL service uses a separate image tag that is not tracked by \`deployed-commit\`. Provide \`qurl_image_tag\` explicitly to roll back QURL."
              fi
              echo ""
            fi

            # Artifacts table
            echo "### Artifacts"
            echo "| Component | Image | Tag | Built | Deploy |"
            echo "|-----------|-------|-----|-------|--------|"
            if [[ "$DEPLOY_SERVER" == "true" ]]; then
              echo "| NHP Server | \`$ECR_SERVER_REPO\` | \`$EFFECTIVE_TAG\` | $SERVER_PUSHED | :white_check_mark: |"
            else
              echo "| NHP Server | \`$ECR_SERVER_REPO\` | \`$EFFECTIVE_TAG\` | $SERVER_PUSHED | :no_entry_sign: skipped |"
            fi
            if [[ "$DEPLOY_AC" == "true" ]]; then
              echo "| Access Controller | \`$ECR_AC_REPO\` | \`$EFFECTIVE_TAG\` | $AC_PUSHED | :white_check_mark: |"
            else
              echo "| Access Controller | \`$ECR_AC_REPO\` | \`$EFFECTIVE_TAG\` | $AC_PUSHED | :no_entry_sign: skipped |"
            fi
            if [[ "$DEPLOY_QURL" == "true" && -n "$QURL_IMAGE_TAG" ]]; then
              echo "| QURL Service | \`$ECR_QURL_REPO\` | \`$QURL_IMAGE_TAG\` | $QURL_PUSHED | :white_check_mark: |"
            elif [[ "$DEPLOY_QURL" == "true" ]]; then
              echo "| QURL Service | \`$ECR_QURL_REPO\` | _(not resolved)_ | — | :warning: no tag |"
            else
              echo "| QURL Service | \`$ECR_QURL_REPO\` | \`${QURL_IMAGE_TAG:-N/A}\` | $QURL_PUSHED | :no_entry_sign: skipped |"
            fi
            # qurl-reverse-tunnel-server: surfaced so the approver can see whether
            # the deploy_frps non-bootstrap precondition and deploy-qrts pre-check
            # will pass.
            FRPS_TAG_DISPLAY="$FRPS_IMAGE_TAG"
            FRPS_PUSHED="rts CI / SSM"
            FRPS_STATUS=":white_check_mark:"
            if [[ "$DEPLOY_QRTS" != "true" ]]; then
              FRPS_TAG_DISPLAY="${FRPS_IMAGE_TAG:-N/A}"
              FRPS_STATUS=":no_entry_sign: skipped"
            elif [[ "$FRPS_IMAGE_TAG" =~ ^v0\.0\.0-bootstrap ]]; then
              FRPS_PUSHED="—"
              FRPS_STATUS=":warning: no tag"
            fi
            echo "| qurl-reverse-tunnel-server | \`$ECR_QRTS_REPO\` | \`$FRPS_TAG_DISPLAY\` | $FRPS_PUSHED | $FRPS_STATUS |"
            echo ""

            # Commit details
            echo "### Commit"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| SHA | [\`$IMAGE_TAG\`](https://github.com/${{ github.repository }}/commit/$IMAGE_TAG) |"
            echo "| Message | $COMMIT_MSG |"
            echo "| Author | $COMMIT_AUTHOR |"
            echo "| Date | $COMMIT_DATE |"
            echo ""

            # Changelog
            echo "### Changelog"
            echo "<details><summary>Commits since last production deployment</summary>"
            echo ""
            echo "\`\`\`"
            echo "$CHANGELOG"
            echo "\`\`\`"
            echo ""
            echo "</details>"
            echo ""

            # Sandbox state
            echo "### Sandbox Validation"
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| Active color | **$SB_ACTIVE_COLOR** |"
            echo "| Server tag | \`$SB_SERVER_TAG\` |"
            echo "| AC tag | \`$SB_AC_TAG\` |"
            echo "| QURL tag | \`$SB_QURL_TAG\` |"
            echo "| Tag match | $TAG_MATCH |"
            echo "| Soak duration | $SB_SOAK |"
            echo ""

            # Current prod vs new
            echo "### Production State"
            echo "| Component | Current | Promoting To | Changed |"
            echo "|-----------|---------|--------------|---------|"

            if [[ "$PROD_SERVER_TAG" == *"$EFFECTIVE_TAG"* ]]; then
              SERVER_CHANGED="no change"
            else
              SERVER_CHANGED=":arrow_right: **updating**"
            fi
            echo "| NHP Server | \`$PROD_SERVER_TAG\` | \`$EFFECTIVE_TAG\` | $SERVER_CHANGED |"

            if [[ "$PROD_AC_TAG" == *"$EFFECTIVE_TAG"* ]]; then
              AC_CHANGED="no change"
            else
              AC_CHANGED=":arrow_right: **updating**"
            fi
            echo "| Access Controller | \`$PROD_AC_TAG\` | \`$EFFECTIVE_TAG\` | $AC_CHANGED |"

            QURL_PROMOTE_TAG="${QURL_IMAGE_TAG:-N/A}"
            if [[ "$PROD_QURL_TAG" == "$QURL_PROMOTE_TAG" ]]; then
              QURL_CHANGED="no change"
            else
              QURL_CHANGED=":arrow_right: **updating**"
            fi
            echo "| QURL Service | \`$PROD_QURL_TAG\` | \`$QURL_PROMOTE_TAG\` | $QURL_CHANGED |"

            QRTS_CURRENT_TAG="${PROD_FRPS_TAG:-not deployed}"
            if [[ "$DEPLOY_QRTS" != "true" ]]; then
              QRTS_PROMOTE_TAG="N/A"
              QRTS_CHANGED="skipped"
            else
              QRTS_PROMOTE_TAG="${FRPS_IMAGE_TAG:-N/A}"
              if [[ "$QRTS_CURRENT_TAG" == "$QRTS_PROMOTE_TAG" ]]; then
                QRTS_CHANGED="no change"
              else
                QRTS_CHANGED=":arrow_right: **updating**"
              fi
            fi
            echo "| qurl-reverse-tunnel-server | \`$QRTS_CURRENT_TAG\` | \`$QRTS_PROMOTE_TAG\` | $QRTS_CHANGED |"
            echo ""

            # Configuration
            echo "### Configuration"
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Terraform Apply | $RUN_TERRAFORM |"
            echo "| Cell ID | ${{ inputs.cell_id }} |"
            echo "| Rollback | $ROLLBACK |"
            echo "| Source | \`$SANDBOX_ACCOUNT_ID\` (sandbox ECR) |"
            echo "| Target | \`$PROD_ACCOUNT_ID\` (prod) |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Print compact log summary
          echo "============================================="
          echo "  PROMOTION MANIFEST"
          echo "============================================="
          if [[ "$ROLLBACK" == "true" ]]; then
            echo "  MODE:        ROLLBACK"
          fi
          echo "  Commit:      $IMAGE_TAG ($COMMIT_MSG)"
          echo "  Author:      $COMMIT_AUTHOR ($COMMIT_DATE)"
          echo "  Effective:   $EFFECTIVE_TAG"
          echo ""
          echo "  Server:      deploy=$DEPLOY_SERVER"
          echo "  AC:          deploy=$DEPLOY_AC"
          echo "  QURL:        deploy=$DEPLOY_QURL (tag=${QURL_IMAGE_TAG:-N/A})"
          echo ""
          echo "  Sandbox:     active=$SB_ACTIVE_COLOR, soak=$SB_SOAK"
          echo "  Tag match:   $TAG_MATCH"
          echo "  Terraform:   $RUN_TERRAFORM"
          echo "============================================="

  # =============================================================================
  # PREFLIGHT - Approval gate + validation + deploy lock
  # =============================================================================
  preflight:
    name: Preflight Checks
    needs: [manifest]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    # Expose force-push protection state to finalize so the SNS
    # notification surfaces it — without this, warn-and-proceed paths
    # are buried in step logs (round 44).
    outputs:
      protection_status: ${{ steps.verify-protection.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need full history so the stale-terraform guard can `git diff`
          # against the last applied SHA stored in SSM. Mirrors terraform-plan.
          fetch-depth: 0

      - name: Configure AWS credentials (sandbox - for ECR check)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify images exist in sandbox ECR
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_AC: ${{ inputs.deploy_ac }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
        run: |
          echo "Verifying images in sandbox ECR..."
          FAILED=0

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            echo "Checking $ECR_SERVER_REPO:$IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_SERVER_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found: $ECR_SERVER_REPO:$IMAGE_TAG"
            else
              echo "::error::Image $ECR_SERVER_REPO:$IMAGE_TAG not found in sandbox ECR"
              FAILED=1
            fi
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            echo "Checking $ECR_AC_REPO:$IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_AC_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found: $ECR_AC_REPO:$IMAGE_TAG"
            else
              echo "::error::Image $ECR_AC_REPO:$IMAGE_TAG not found in sandbox ECR"
              FAILED=1
            fi
          fi

          if [[ "$DEPLOY_QURL" == "true" && -n "$QURL_IMAGE_TAG" ]]; then
            echo "Checking $ECR_QURL_REPO:$QURL_IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_QURL_REPO" \
              --image-ids imageTag="$QURL_IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found: $ECR_QURL_REPO:$QURL_IMAGE_TAG"
            else
              echo "::error::Image $ECR_QURL_REPO:$QURL_IMAGE_TAG not found in sandbox ECR"
              FAILED=1
            fi
          elif [[ "$DEPLOY_QURL" == "true" ]]; then
            echo "::error::deploy_qurl=true but no QURL image tag available (provide qurl_image_tag or ensure sandbox SSM has a value)"
            FAILED=1
          fi

          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi
          echo "All required images verified."

      # Pipeline-side attestation gate (#1334 Phase 1). Verified against the
      # sandbox ECR digest (same digest replication carries to prod ECR), under
      # the sandbox creds above and before the prod switch below. audit by
      # default; flip fleet-wide via the IMAGE_ATTESTATION_VERIFY_MODE variable
      # after post-#2339 attested images have soaked. A failure here (enforce)
      # aborts the promotion before any prod image-tag is written.
      # Only server + AC are gated: the qurl image is built by qurl-service's CI,
      # not this repo's build-and-push.yml, so it carries no attestation from us
      # and is intentionally out of scope for this gate.
      # Trust note: this verifies the SANDBOX digest; the image actually rolled
      # is the prod-ECR copy for the same tag, which prod-ECR replication is
      # trusted to carry byte-for-byte (content-addressed digest, replication-
      # only registry). The post-apply prod-ECR existence check (below) is the
      # corroborating signal that the replicated copy is present.
      - name: Verify server image attestation
        if: inputs.deploy_server == 'true'
        uses: ./.github/actions/verify-image-attestation
        with:
          repository: ${{ env.ECR_SERVER_REPO }}
          image-tag: ${{ needs.manifest.outputs.effective_image_tag }}
          region: ${{ env.AWS_REGION }}
          mode: ${{ vars.IMAGE_ATTESTATION_VERIFY_MODE || 'audit' }}

      - name: Verify AC image attestation
        if: inputs.deploy_ac == 'true'
        uses: ./.github/actions/verify-image-attestation
        with:
          repository: ${{ env.ECR_AC_REPO }}
          image-tag: ${{ needs.manifest.outputs.effective_image_tag }}
          region: ${{ env.AWS_REGION }}
          mode: ${{ vars.IMAGE_ATTESTATION_VERIFY_MODE || 'audit' }}

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify images replicated from sandbox ECR to prod ECR.
      # ECR cross-account replication is asynchronous and can fail silently
      # (IAM drift, registry policy removal, AWS service issue). Without
      # this gate, broken replication is only discovered when a deploy
      # fails at image pull time.
      - name: Verify images replicated to prod ECR
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_AC: ${{ inputs.deploy_ac }}
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
          DEPLOY_RELAY: ${{ inputs.deploy_relay }}
        run: |
          set -euo pipefail
          echo "Verifying images in prod ECR (replicated from sandbox)..."
          FAILED=0

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            echo "Checking prod $ECR_SERVER_REPO:$IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_SERVER_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found in prod ECR: $ECR_SERVER_REPO:$IMAGE_TAG"
            else
              echo "::error::Image $ECR_SERVER_REPO:$IMAGE_TAG not found in prod ECR. ECR cross-account replication may have failed."
              echo "::error::See runbook: docs/runbooks/ecr-replication-failure.md"
              FAILED=1
            fi
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            echo "Checking prod $ECR_AC_REPO:$IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_AC_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found in prod ECR: $ECR_AC_REPO:$IMAGE_TAG"
            else
              echo "::error::Image $ECR_AC_REPO:$IMAGE_TAG not found in prod ECR. ECR cross-account replication may have failed."
              echo "::error::See runbook: docs/runbooks/ecr-replication-failure.md"
              FAILED=1
            fi
          fi

          # deploy-relay.sh advances the SSM image tag, and its contract only
          # permits that when the caller has verified the tag exists in ECR —
          # otherwise the instance refresh crash-loops on docker pull. This is
          # that verification.
          if [[ "$DEPLOY_RELAY" == "true" ]]; then
            echo "Checking prod $ECR_RELAY_REPO:$IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_RELAY_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query "imageDetails[0].imageDigest" \
              --output text > /dev/null 2>&1; then
              echo "  Found in prod ECR: $ECR_RELAY_REPO:$IMAGE_TAG"
            else
              echo "::error::Image $ECR_RELAY_REPO:$IMAGE_TAG not found in prod ECR. ECR cross-account replication may have failed."
              echo "::error::See runbook: docs/runbooks/ecr-replication-failure.md"
              FAILED=1
            fi
          fi

          if [[ "$DEPLOY_QURL" == "true" && -n "$QURL_IMAGE_TAG" ]]; then
            echo "Checking prod $ECR_QURL_REPO:$QURL_IMAGE_TAG..."
            if aws ecr describe-images \
              --repository-name "$ECR_QURL_REPO" \
              --image-ids imageTag="$QURL_IMAGE_TAG" \
              --query "imageDetails[0].imagePushedAt" \
              --output text > /dev/null 2>&1; then
              echo "  Found in prod ECR: $ECR_QURL_REPO:$QURL_IMAGE_TAG"
            else
              echo "::error::Image $ECR_QURL_REPO:$QURL_IMAGE_TAG not found in prod ECR. ECR cross-account replication may have failed."
              echo "::error::See runbook: docs/runbooks/ecr-replication-failure.md"
              FAILED=1
            fi
          elif [[ "$DEPLOY_QURL" == "true" ]]; then
            echo "::error::deploy_qurl=true but no QURL image tag available (provide qurl_image_tag or ensure sandbox SSM has a value)"
            FAILED=1
          fi

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "::error::One or more images missing from prod ECR. This usually means ECR cross-account replication is broken."
            echo "  Manual workaround: pull the image from sandbox ECR and push to prod ECR via docker CLI."
            echo "  See: docs/runbooks/ecr-replication-failure.md"
            exit 1
          fi
          echo "All required images verified in prod ECR."

      - name: Verify prod NHP AMIs are published to SSM
        if: inputs.run_terraform || inputs.deploy_server || inputs.deploy_ac
        env:
          AMI_MAX_AGE_DAYS: ${{ inputs.ami_max_age_days }}
          FORCE_STALE_AMI: ${{ inputs.force_stale_ami }}
          RUN_TERRAFORM: ${{ inputs.run_terraform }}
          DEPLOY_SERVER: ${{ inputs.deploy_server }}
          DEPLOY_AC: ${{ inputs.deploy_ac }}
        run: |
          set -euo pipefail
          # The compute and AC modules read /prod/nhp/{server,ac}/ami-id via
          # aws_ssm_parameter (see terraform/modules/{compute,ac}/main.tf). If
          # either parameter is missing, terraform plan errors out partway
          # through with a generic "couldn't find resource" message. Catch it
          # here so the operator gets a clear, actionable error before approval.
          #
          # Note on the hardcoded "/prod/" path: this entire workflow is
          # prod-specific (job name promote-to-prod, role-to-assume uses
          # AWS_PROD_ROLE_ARN, account ID hardcoded as PROD_ACCOUNT_ID at
          # the top of the file). The hardcoded path is consistent with
          # the rest of the file's pattern. If anyone copies this workflow
          # to promote to a non-prod environment, they need to change the
          # env name in many other places too — search for "/prod/",
          # "prod_", and PROD_ACCOUNT_ID before reusing.
          COMPONENTS=()
          if [[ "$RUN_TERRAFORM" == "true" || "$DEPLOY_SERVER" == "true" ]]; then
            COMPONENTS+=(server)
          fi
          if [[ "$RUN_TERRAFORM" == "true" || "$DEPLOY_AC" == "true" ]]; then
            COMPONENTS+=(ac)
          fi
          AMI_AGE_THRESHOLD_DAYS="${AMI_MAX_AGE_DAYS:-60}"

          for component in "${COMPONENTS[@]}"; do
            case "$component" in
              server) label="Server" ;;
              ac) label="AC" ;;
            esac

            AMI_PARAM="/prod/nhp/${component}/ami-id"
            ERR_FILE="/tmp/${component}-ami-ssm-err"
            if ! AMI_ID=$(aws ssm get-parameter --name "$AMI_PARAM" --query 'Parameter.Value' --output text 2>"$ERR_FILE"); then
              if grep -q "ParameterNotFound" "$ERR_FILE"; then
                echo "::error::Prod NHP ${label} AMI not published yet. Build the AMI first:"
                echo "  1. Confirm /sandbox/nhp/${component}/ami-id is populated in sandbox."
                echo "  2. Run packer build manually against prod credentials, OR"
                echo "  3. Copy the sandbox AMI to the prod account/region and publish it to $AMI_PARAM."
                echo "     Cross-account copy requires the source snapshot to use a customer-managed CMK shared with prod; default aws/ebs-encrypted snapshots cannot be shared."
                echo "  See packer/README.md for the full bootstrap procedure."
                exit 1
              fi
              echo "::error::Unexpected SSM error reading $AMI_PARAM:"
              cat "$ERR_FILE"
              exit 1
            fi
            if ! echo "$AMI_ID" | grep -Eq '^ami-[0-9a-f]+$'; then
              echo "::error::Prod ${label} AMI parameter contains an invalid value: '$AMI_ID' (expected ami-<hex>)"
              exit 1
            fi
            # Verify the AMI still exists and is available — a deregistered AMI
            # would pass the SSM check but fail at launch_template apply time.
            AMI_JSON=$(aws ec2 describe-images --image-ids "$AMI_ID" \
              --query 'Images[0].{State:State,CreationDate:CreationDate}' \
              --output json 2>/dev/null || echo '{}')
            STATE=$(echo "$AMI_JSON" | jq -r '.State // ""')
            CREATION=$(echo "$AMI_JSON" | jq -r '.CreationDate // ""')
            if [[ "$STATE" != "available" ]]; then
              echo "::error::Prod ${label} AMI $AMI_ID is not available (state=$STATE). It may have been deregistered."
              exit 1
            fi
            # Stale AMI check. Stale AMIs may carry unpatched kernel/Docker
            # vulnerabilities, so we hard-fail past the threshold. Operators
            # have two escape valves:
            #   1. Set ami_max_age_days higher when launching the workflow (per
            #      run, no code change).
            #   2. Set force_stale_ami=true to bypass the check entirely (use
            #      for intentional rollback to an older known-good image, or
            #      while a fresh AMI is rebuilding).
            # The default threshold (60 days) is calibrated to the AMI rebuild
            # cadence; tighten if rebuilds become more frequent.
            if [[ -n "$CREATION" ]]; then
              # `date -d` is GNU date syntax (Linux). This step always runs on
              # ubuntu-latest GitHub Actions runners so it works, but the same
              # command would fail on macOS BSD `date` (which uses `-j -f`).
              # If anyone ports this verify step to a self-hosted macOS runner
              # or a local debugging script, swap to:
              #   date -j -f "%Y-%m-%dT%H:%M:%S.%3NZ" "$CREATION" +%s
              # Or, more portably, use python -c 'import datetime; ...'.
              CREATION_EPOCH=$(date -d "$CREATION" +%s 2>/dev/null || echo 0)
              NOW_EPOCH=$(date -u +%s)
              AGE_DAYS=$(( (NOW_EPOCH - CREATION_EPOCH) / 86400 ))
              if (( CREATION_EPOCH > 0 && AGE_DAYS > AMI_AGE_THRESHOLD_DAYS )); then
                if [[ "$FORCE_STALE_AMI" == "true" ]]; then
                  echo "::warning::Prod ${label} AMI $AMI_ID is $AGE_DAYS days old (threshold $AMI_AGE_THRESHOLD_DAYS). Bypass enabled via force_stale_ami=true — proceeding."
                  {
                    echo "## :warning: ${label} AMI age check bypassed"
                    echo "Prod ${label} AMI \`$AMI_ID\` is **$AGE_DAYS days old** (threshold $AMI_AGE_THRESHOLD_DAYS). Operator passed \`force_stale_ami=true\` to bypass."
                  } >> "$GITHUB_STEP_SUMMARY"
                else
                  {
                    echo "## :x: ${label} AMI age check failed"
                    echo "Prod ${label} AMI \`$AMI_ID\` is **$AGE_DAYS days old**, exceeding the configured threshold of **$AMI_AGE_THRESHOLD_DAYS days**."
                    echo ""
                    echo "Stale AMIs may carry unpatched kernel/Docker security vulnerabilities. Two ways forward:"
                    echo ""
                    echo "1. **Rebuild the AMI** — re-run \`build-and-push.yml::packer-build\` against prod (or merge any \`packer/\`-touching change to \`main\`) and then re-run this promotion."
                    echo "2. **Bypass the check** — re-run this workflow with \`force_stale_ami=true\` if you are intentionally rolling back to a known-good older image."
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "::error::Prod ${label} AMI $AMI_ID is $AGE_DAYS days old, exceeding threshold $AMI_AGE_THRESHOLD_DAYS. Rebuild via packer-build or pass force_stale_ami=true to bypass."
                  exit 1
                fi
              else
                echo "Prod ${label} AMI age: $AGE_DAYS days (threshold $AMI_AGE_THRESHOLD_DAYS) — OK"
              fi
            fi
            echo "Prod NHP ${label} AMI verified: $AMI_ID (available)"
          done

      - name: Verify Secrets Manager secrets exist
        run: |
          echo "Verifying Secrets Manager secrets..."
          SECRETS=(
            "layerv-nhp-prod/qurl-jwt-secret"
            "layerv-nhp-prod/qurl-internal-service-token"
            "layerv-nhp-prod/grafana-cloud-otlp"
          )
          for secret in "${SECRETS[@]}"; do
            if aws secretsmanager describe-secret --secret-id "$secret" > /dev/null 2>&1; then
              echo "  Found: $secret"
            else
              echo "::error::Secret not found: $secret"
              exit 1
            fi
          done
          echo "All secrets verified."

      - name: Verify S3 buckets exist
        run: |
          echo "Verifying S3 buckets..."
          BUCKETS=(
            "layerv-terraform-state-${PROD_ACCOUNT_ID}"
            "layerv-nhp-prod-alb-logs"
          )
          for bucket in "${BUCKETS[@]}"; do
            if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              echo "  Found: $bucket"
            else
              echo "::error::S3 bucket not found: $bucket"
              exit 1
            fi
          done
          echo "All buckets verified."

      - name: Verify cross-account Route53 role
        run: |
          echo "Verifying cross-account Route53 role..."
          ROLE_ARN="arn:aws:iam::${PROD_MGMT_ACCOUNT_ID}:role/nhp-ac-route53-access"
          if aws sts assume-role \
            --role-arn "$ROLE_ARN" \
            --role-session-name "preflight-check" \
            --duration-seconds 900 \
            --query "Credentials.AccessKeyId" \
            --output text > /dev/null 2>&1; then
            echo "  Route53 cross-account role assumable"
          else
            echo "::warning::Cannot assume Route53 cross-account role: $ROLE_ARN"
            echo "  This may be expected if the role has not been created yet."
          fi

      # PROD_AUTH0_CLIENT_ID / PROD_AUTH0_CLIENT_SECRET were dropped from this
      # check with #3284: Terraform no longer configures the Auth0 provider, so
      # a prod apply neither needs nor receives an Auth0 credential. Delete the
      # repository secrets themselves once both environments have applied the
      # retirement — tracked in the #3284 rollout-ledger entry.
      - name: Verify GitHub secrets are set
        env:
          PROD_GRAFANA_AUTH: ${{ secrets.PROD_GRAFANA_AUTH }}
        run: |
          echo "Verifying GitHub secrets..."
          MISSING=0
          for var in PROD_GRAFANA_AUTH; do
            if [[ -z "${!var}" ]]; then
              echo "::error::GitHub secret $var is not set"
              MISSING=1
            else
              echo "  Found: $var"
            fi
          done
          if [[ $MISSING -eq 1 ]]; then
            exit 1
          fi
          echo "All GitHub secrets verified."

      # Force-push protection on prod main is a prod-deploy invariant
      # in its own right, not just a stale-tf prerequisite. We verify
      # it on every promote (regardless of `run_terraform`) so a quiet
      # GitHub-UI change to the protection settings surfaces here, not
      # as a partial-deploy two months later. The stale-terraform
      # OrphanedAncestor branch (below) is one specific consumer of
      # this invariant — it fails OPEN only because protection is
      # verified — but disabled protection on a `run_terraform=true`
      # run is also a deploy-class concern (force-push history
      # rewrites can break rollback semantics, audit trails, and the
      # `last-terraform-apply-commit` SSM anchor used for forensics).
      # Hard-failing early on `disabled` is correct on every dispatch.
      - name: Verify prod main has force-push protection
        id: verify-protection
        env:
          GH_TOKEN: ${{ github.token }}
          # Bind via env: for consistency with the rest of this file's
          # shell steps; `${{ github.repository }}` is trusted (no
          # injection risk) but mixing styles is a footgun.
          REPO: ${{ github.repository }}
        run: |
          # `set -uo pipefail` (NOT -e): the `if !` below explicitly
          # catches gh-api failure so we can warn-and-proceed on 403.
          # DO NOT add `-e` here — it would short-circuit the gh-api
          # capture and turn warn-pass into hard-fail on every
          # `administration:read` 403 (the common path until the scope
          # is granted). Other preflight steps use `-euo pipefail`
          # because they want -e behavior; this one explicitly does not.
          set -uo pipefail
          # Best-effort: needs `administration: read` which the default
          # GITHUB_TOKEN lacks (and actionlint's whitelist excludes from
          # `permissions:`). Operator can grant it via repo Settings →
          # Actions → General → Workflow permissions for fail-loud;
          # until then, warn-and-proceed and surface to SNS via the
          # `protection_status` output. Endpoint is the legacy branch-
          # protection model; on a future Rulesets migration it returns
          # 404 and we warn-pass — tracked in #1354.
          # Stderr to a temp file (NOT 2>&1) so a successful gh-api
          # call emitting a deprecation banner doesn't contaminate JSON.
          # Pre-declare empty + register trap BEFORE mktemp so a signal
          # between mktemp and trap registration can't leak the file
          # (mirrors the deploy-ecs-service.sh pattern).
          PROT_ERR_FILE=""
          # `EXIT INT TERM` matches deploy-ecs-service.sh's pattern —
          # CI runners rarely see signals, but symmetry prevents a
          # future maintainer from wondering which trap shape to use.
          trap 'rm -f "${PROT_ERR_FILE:-}"' EXIT INT TERM
          PROT_ERR_FILE=$(mktemp)
          # Helper so each exit point reads as `set_status X; exit N`
          # instead of duplicating the GITHUB_OUTPUT plumbing.
          set_status() { echo "status=$1" >> "$GITHUB_OUTPUT"; }
          if ! PROTECTION=$(gh api "repos/${REPO}/branches/main/protection" 2>"$PROT_ERR_FILE"); then
            echo "::warning::Could not read branch protection for main (missing administration:read scope, transient gh-api failure, or Rulesets migration). The stale-terraform OrphanedAncestor branch's fail-open assumption is unverified for this run — manually confirm via: gh api repos/${REPO}/branches/main/protection"
            if [[ -s "$PROT_ERR_FILE" ]]; then
              while IFS= read -r line; do
                printf '  %s\n' "$line"
              done < "$PROT_ERR_FILE"
            fi
            set_status unverified
            exit 0
          fi
          # Helper: a jq-extraction that distinguishes "field present
          # with value X" from "jq failed / field missing". We want
          # malformed-but-non-empty PROTECTION to map to unverified
          # (warn-path), not disabled (error-path) — the step is best-
          # effort, and a transient jq glitch shouldn't fail a deploy.
          jq_get() {
            local field="$1" out
            # `-n "$out"` guards against an empty $PROTECTION (jq exits
            # 0 with no output) so callers can't get a silent empty
            # success. JSON `null` is also treated as failure — both
            # map to the unverified warn-path, which is the intent.
            if out=$(jq -r "$field" <<< "$PROTECTION" 2>/dev/null) \
                 && [[ -n "$out" && "$out" != "null" ]]; then
              echo "$out"
              return 0
            fi
            return 1
          }
          if ! ALLOW_FP=$(jq_get '.allow_force_pushes.enabled'); then
            echo "::warning::Could not parse allow_force_pushes from branch protection JSON (malformed response or missing field — possible Rulesets migration, see #1354). Treating as unverified."
            set_status unverified
            exit 0
          fi
          if [[ "$ALLOW_FP" != "false" ]]; then
            echo "::error::Force-push protection on main is disabled (allow_force_pushes.enabled=$ALLOW_FP). The stale-terraform OrphanedAncestor branch fails OPEN under this assumption — re-enable force-push protection or flip the branch to fail-CLOSED before re-running this workflow. See docs/runbooks/promote-to-prod-partial-deploy.md."
            set_status disabled
            exit 1
          fi
          # `enforce_admins=false` is a soft signal: an admin can also
          # temporarily disable+re-enable protection without ever
          # tripping this check, so hard-failing would be
          # disproportionate. The SSM `last-terraform-apply-commit` is
          # the strong anchor; this just surfaces drift to SNS.
          if ! ENFORCE_ADMINS=$(jq_get '.enforce_admins.enabled'); then
            echo "::warning::Could not parse enforce_admins from branch protection JSON (malformed response or missing field). Treating as unverified."
            set_status unverified
            exit 0
          fi
          if [[ "$ENFORCE_ADMINS" != "true" ]]; then
            echo "::warning::Branch protection on main does not enforce admins (enforce_admins.enabled=$ENFORCE_ADMINS). An admin force-push could still orphan the last-applied SHA — for full confidence in the OrphanedAncestor fail-OPEN assumption, enable enforce_admins on main."
            set_status admin-bypass
            exit 0
          fi
          echo "Force-push protection on main: enabled (allow_force_pushes=false, enforce_admins=true)."
          set_status verified

      # When run_terraform=false but a deploy_* is true, refuse to roll new
      # app code onto stale infra (issue #1322). Skipped when run_terraform
      # =true (terraform-plan + terraform-apply will land any drift) or when
      # no deploy_* is true (terraform-only run).
      #
      # Runs BEFORE deployment-lock acquisition so a stale-tf failure does
      # not dirty the lock (the asymmetry with image/AMI/secret checks
      # would surprise operators reading the lock history). Lock release
      # by finalize.if-always() also handles cleanup.
      # deploy_qrts is intentionally gated here even though qrts rolls via its
      # own ASG instance-refresh (a separate path from the server/ac canary): the
      # qrts launch
      # template, user_data (which reads the image-tag SSM param at boot),
      # ASG, and asg-name param are all terraform-managed in this repo, so a
      # stale terraform state can mean a stale qrts launch config. A solo
      # deploy_qrts=true with !run_terraform must still prove terraform is
      # current — same rationale as server/ac/qurl. Operators with a known-
      # unrelated tf drift use the allow_stale_terraform bypass.
      - name: Verify terraform is current with deployed code
        if: |
          !inputs.run_terraform &&
          (inputs.deploy_server || inputs.deploy_ac || inputs.deploy_qurl || inputs.deploy_qrts)
        env:
          ALLOW_STALE_TERRAFORM: ${{ inputs.allow_stale_terraform }}
          ROLLBACK: ${{ inputs.rollback }}
          # Round-61 escalation: if the verify-protection step found
          # admin-bypass (enforce_admins=false) AND this step's
          # OrphanedAncestor branch fires, escalate to hard-fail.
          # An admin force-push could orphan last-terraform-apply-
          # commit; with admin-bypass + OrphanedAncestor coinciding,
          # the fail-OPEN assumption is genuinely violated and a
          # stale-tf deploy would silently land.
          PROTECTION_STATUS: ${{ steps.verify-protection.outputs.status }}
        run: |
          set -euo pipefail
          # Helper: emit a CloudWatch counter every time the stale-tf check
          # falls through to a "could not verify — proceeding" warning. If
          # this metric ever fires in prod, the operator wants to know —
          # the warning paths are escape hatches that should be vanishingly
          # rare on a force-push-protected main branch.
          # `--region` is explicit because this helper is a copy-paste
          # candidate; keeping it self-contained means callers don't
          # have to wire `AWS_REGION` separately. Inline AWS calls in
          # the same step body rely on the job-level env var.
          # TODO(#1346): a CloudWatch alarm on this metric is filed but
          # not yet wired; until then, the metric is observable only
          # from the metric explorer.
          #
          # IAM coverage: the prod role already has cloudwatch:PutMetricData
          # on the LayerV/NHP namespace via the terraform_apply_services
          # policy in terraform/modules/ecr/main.tf. The existing
          # LayerV/NHP::DeploymentEvent push in finalize.send-notification
          # exercises the same permission; if that ever stops working,
          # this helper will too — which is the right coupling.
          push_could_not_verify_metric() {
            local reason="${1:-Unspecified}"
            # `:-Unspecified` defends against a future caller passing
            # an empty string — a CloudWatch metric with a literal
            # empty Value dimension would silently break aggregation
            # alarms. Today's four call sites pass non-empty strings,
            # so the default never fires; it's defense-in-depth.
            # Best-effort: a metric-push failure must NOT fail the deploy
            # — that would block a real promote on a CloudWatch outage,
            # which trades the partial-deploy class (#1322) for a
            # CloudWatch-availability class. Once the alarm in #1346 is
            # wired, a missed metric is observable downstream (no fire +
            # the operator notices the workflow run log warning).
            # Consistent with the existing LayerV/NHP::DeploymentEvent
            # push in finalize.send-notification.
            #
            # put-metric-data --dimensions uses the AWS CLI's command-specific
            # Key=Value shorthand, not the Name=...,Value=... structure form
            # accepted by other CloudWatch commands. Keep Reason values simple;
            # if a future value can contain a comma, switch this call to
            # --metric-data JSON instead of reverting to the broken pair form.
            aws cloudwatch put-metric-data \
              --region "$AWS_REGION" \
              --namespace "LayerV/NHP" \
              --metric-name "StaleTerraformCheckCouldNotVerify" \
              --dimensions "Environment=prod,Reason=${reason}" \
              --value 1 \
              --unit Count \
              || echo "::warning::Failed to push StaleTerraformCheckCouldNotVerify metric (reason=$reason)"
          }

          # The SSM parameter is created+overwritten by the finalize job's
          # "Update terraform apply tracking" step (below), so it only
          # exists once a successful prod terraform-apply has run. On
          # greenfield envs the read returns ParameterNotFound. The
          # "initial" sentinel is a MANUAL escape hatch — the workflow
          # itself never writes "initial" anywhere; an operator can pre-
          # seed `aws ssm put-parameter --value initial` to suppress the
          # check during a planned bootstrap. Defensive code below treats
          # "initial" the same as ParameterNotFound for that reason
          # (consistent with the rest of this workflow — search for
          # `"initial"`).
          #
          # Fail-CLOSED on any other error (IAM denial, network, throttle):
          # silently skipping the check on a transient AWS error would
          # green-light the exact partial-deploy class #1322 is meant to
          # prevent. AWS_PROD_ROLE_ARN is already in scope from the
          # earlier preflight steps and has ssm:GetParameter on
          # /prod/nhp/* — if a future scope-down breaks this read, the
          # operator gets a loud error instead of a silent fail-open.
          #
          # Stderr is captured to a separate temp file (NOT 2>&1) so an
          # AWS-CLI warning written to stderr on a successful read does
          # not contaminate the parameter value — the value is otherwise
          # used directly in `git merge-base --is-ancestor`. GIT_ERR_FILE
          # is set later (in the merge-base block); cover it in the trap
          # via parameter-default expansion so a signal between mktemp
          # and the inner cleanup can't leak the temp file.
          #
          # AWS_REGION env contract: this inline `aws ssm get-parameter`
          # relies on the workflow-level AWS_REGION (set in env: at the
          # top of the file). The push_could_not_verify_metric helper
          # below passes --region explicitly because it's a copy-paste
          # candidate; this inline call is ergonomic. If a future
          # refactor runs preflight steps in a different shell context,
          # add explicit --region here too.
          # Pre-declare both tempfiles as empty BEFORE registering the
          # trap, then mktemp into SSM_ERR_FILE — mirrors the
          # deploy-ecs-service.sh pattern so a signal between mktemp
          # and trap registration can't leak the file. `${VAR:-}`
          # in the trap body handles the still-empty path safely.
          SSM_ERR_FILE=""
          GIT_ERR_FILE=""
          trap 'rm -f "${SSM_ERR_FILE:-}" "${GIT_ERR_FILE:-}"' EXIT INT TERM
          SSM_ERR_FILE=$(mktemp)
          LAST_TF_SHA=""
          if SSM_OUT=$(aws ssm get-parameter \
              --name "/prod/nhp/deploy/last-terraform-apply-commit" \
              --query "Parameter.Value" --output text 2>"$SSM_ERR_FILE"); then
            LAST_TF_SHA="$SSM_OUT"
          else
            SSM_ERR=$(cat "$SSM_ERR_FILE")
            if grep -q "ParameterNotFound" <<< "$SSM_ERR"; then
              echo "::warning::No previous terraform-apply commit recorded in SSM (ParameterNotFound — first-deploy environment). Cannot detect drift; proceeding."
              push_could_not_verify_metric "ParameterNotFound"
              exit 0
            fi
            echo "::error::Failed to read /prod/nhp/deploy/last-terraform-apply-commit from SSM. Refusing to fail-open on a transient AWS error."
            while IFS= read -r line; do
              printf '  %s\n' "$line"
            done <<< "$SSM_ERR"
            exit 1
          fi

          # Empty / "initial" / "None" all map to first-deploy sentinel.
          # "None" is the AWS-CLI literal when --output text encounters a
          # null field (asymmetric with our deploy-ecs-service.sh checks
          # for the same sentinel; safer to mirror).
          if [[ -z "$LAST_TF_SHA" || "$LAST_TF_SHA" == "initial" || "$LAST_TF_SHA" == "None" ]]; then
            echo "::warning::SSM parameter is empty / 'initial' / 'None' — first-deploy sentinel. Cannot detect drift; proceeding."
            push_could_not_verify_metric "FirstDeploySentinel"
            exit 0
          fi

          # SHA shape validation: the value comes from SSM (anyone with
          # ssm:PutParameter on /prod/nhp/deploy/* could write arbitrary
          # text). The workflow's tracking step always writes the full
          # 40-char `github.sha`, so this read accepts only 40-char
          # hex — tighter than the `image_tag` 7-40 regex (which has
          # to accept short SHAs from operator dispatch). A 7-char
          # operator re-seed would still be caught by this check;
          # operators should re-seed with the full 40-char SHA.
          if ! [[ "$LAST_TF_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SSM parameter /prod/nhp/deploy/last-terraform-apply-commit contains a value that doesn't look like a 40-char commit SHA: '$LAST_TF_SHA'"
            echo "  Expected: 40-character hex (the workflow always writes the full github.sha)"
            echo "  Manually re-seed via: aws ssm put-parameter --name /prod/nhp/deploy/last-terraform-apply-commit --value <40-char-sha> --overwrite"
            exit 1
          fi

          # `git merge-base --is-ancestor` checks BOTH presence in the
          # local repo AND reachability from CURRENT_SHA. A force-push
          # that orphaned the last-applied commit but kept it referenced
          # elsewhere (very unlikely on prod main, which has force-push
          # protection) would have failed `git rev-parse --verify` but
          # produced a misleadingly noisy `git diff A..B` since diff works
          # on disjoint trees. is-ancestor closes that gap.
          # Stderr is captured so git's actual error reaches the run log
          # instead of guessed text — avoids "why is this firing?" being
          # answerable only by re-running locally.
          #
          # Asymmetry note: this branch is fail-OPEN (warn + proceed +
          # metric) while every other not-verifiable branch is fail-
          # closed (e.g., a non-ParameterNotFound SSM error fails the
          # deploy). Rationale: an orphaned-ancestor state is operator-
          # caused (force-push or shallow checkout) rather than an AWS
          # outage, and the operator can re-trigger after fixing the
          # ref state. The CloudWatch counter on this branch surfaces
          # the asymmetry in telemetry. If force-push protection on
          # prod main were ever removed, flip to `exit 1` here and
          # direct the operator at allow_stale_terraform=true via the
          # runbook.
          # GIT_ERR_FILE is in the EXIT trap (set above) so an early-
          # exit between mktemp and the inner cleanup can't leak.
          GIT_ERR_FILE=$(mktemp)
          # `is-ancestor` is documented to use distinct exit codes:
          #   0   = is ancestor
          #   1   = NOT an ancestor (the OrphanedAncestor case)
          #   128 = git error (missing ref, repo corruption, etc.)
          # Use exit-code dispatch (NOT stderr-string matching) — exit
          # codes are stable contract; stderr text changes with git
          # version + locale, and grep alternatives like "fatal:" /
          # "bad object" are localization-fragile.
          # `set +e` around the call so $? survives `set -euo pipefail`
          # at the top of the step; restore -e immediately after.
          set +e
          git merge-base --is-ancestor "$LAST_TF_SHA" "$GITHUB_SHA" 2>"$GIT_ERR_FILE"
          GIT_RC=$?
          set -e
          if [[ $GIT_RC -ne 0 ]]; then
            GIT_ERR=$(cat "$GIT_ERR_FILE")
            if [[ $GIT_RC -eq 1 ]]; then
              # Conjunction escalation: OrphanedAncestor fail-OPEN is
              # justified by force-push protection. Two conjunctions
              # violate that justification — fail-CLOSED on either:
              #
              # - admin-bypass + OrphanedAncestor: enforce_admins=false
              #   means an admin force-push could legitimately orphan
              #   the SHA without tripping the hard-fail
              #   allow_force_pushes path.
              # - unverified + OrphanedAncestor: we don't KNOW whether
              #   protection is on (gh-api 403 / Rulesets migration /
              #   transient failure), so we can't justify the fail-OPEN.
              #   Operator can use allow_stale_terraform=true after
              #   manually verifying.
              if [[ "${PROTECTION_STATUS:-}" == "admin-bypass" \
                 || "${PROTECTION_STATUS:-}" == "unverified" ]]; then
                echo "::error::OrphanedAncestor + protection_status=${PROTECTION_STATUS}: $LAST_TF_SHA is not an ancestor of $GITHUB_SHA AND force-push protection is either bypassable (admin-bypass) or unverifiable (unverified). The fail-OPEN assumption is violated. Either fix the protection state, or use allow_stale_terraform=true after manually verifying the drift. See docs/runbooks/promote-to-prod-partial-deploy.md."
                push_could_not_verify_metric "OrphanedAncestor"
                exit 1
              fi
              echo "::warning::Last applied terraform commit $LAST_TF_SHA is not an ancestor of $GITHUB_SHA (force-pushed, orphaned, or branch rewritten). Cannot verify drift — proceeding."
              push_could_not_verify_metric "OrphanedAncestor"
            else
              # exit 128+ = git environment failure
              echo "::warning::git invocation failed (rc=$GIT_RC): $LAST_TF_SHA may be missing from local repo or there's a git environment issue. Cannot verify drift — proceeding."
              if [[ -n "$GIT_ERR" ]]; then
                echo "git stderr:"
                while IFS= read -r line; do
                  printf '  %s\n' "$line"
                done <<< "$GIT_ERR"
              fi
              push_could_not_verify_metric "GitError"
            fi
            exit 0
          fi

          # Compare against GITHUB_SHA (the workflow's checked-out ref)
          # rather than inputs.image_tag. An operator dispatching a
          # rollback (image_tag=<old SHA>, run_terraform=false, no
          # rollback=true) sees the diff for every prod-affecting tf
          # change since the last apply — which is correct: the binary
          # they're rolling to predates the applied infra, so they need
          # to read that diff before bypassing. The runbook (Case C)
          # documents this; rollback discipline > convenience here.
          CURRENT_SHA="$GITHUB_SHA"
          if [[ "$LAST_TF_SHA" == "$CURRENT_SHA" ]]; then
            echo "Terraform is current: last-apply == ${CURRENT_SHA:0:8}."
            exit 0
          fi

          # Scope to prod-affecting paths so a sandbox-only terraform
          # change does not trip the prod check; mirrors terraform-plan's
          # change-summary scope. (Dedupe tracked in #1343.)
          # Two-arg form `A B` for clarity. `git diff A..B` is equivalent
          # for `git diff` (the `..` is identical-to-space here, not the
          # git-log range form), but the bare two-arg form is unambiguous
          # at a glance with `A...B` (symmetric-diff).
          TF_DIFF=$(git diff --name-only "$LAST_TF_SHA" "$CURRENT_SHA" -- \
            terraform/environments/prod/ terraform/modules/)
          if [[ -z "$TF_DIFF" ]]; then
            echo "No prod-affecting terraform changes between ${LAST_TF_SHA:0:8} and ${CURRENT_SHA:0:8} — safe to deploy app code without re-applying."
            exit 0
          fi

          # awk 'NF' counts non-empty lines portably — `grep -c .` semantics
          # around no-trailing-newline are GNU-grep-version-dependent.
          DIFF_COUNT=$(awk 'NF' <<< "$TF_DIFF" | wc -l | tr -d ' ')

          # The shared diff body — every branch (bypass or fail) renders
          # this details block; only the leading header + footer differ
          # so the step summary visually matches the actual outcome.
          # The code fence uses ```text so any future TF_DIFF content
          # (even one containing literal triple-backticks, which would
          # be unusual but not impossible in a path) renders cleanly.
          # NOTE: this helper is defined inside the same `run:` block as
          # its callers because each step is a fresh shell. If a future
          # refactor splits the stale-tf check across multiple steps,
          # extract this to .github/scripts/ and source it.
          render_diff_details() {
            echo "Scope: \`terraform/environments/prod/\` + \`terraform/modules/\`. $DIFF_COUNT prod-affecting terraform file(s) changed between last applied commit \`${LAST_TF_SHA:0:8}\` and deploy SHA \`${CURRENT_SHA:0:8}\`."
            echo ""
            echo "<details><summary>Changed files</summary>"
            echo ""
            echo '```text'
            echo "$TF_DIFF"
            echo '```'
            echo ""
            echo "</details>"
          }

          if [[ "$ALLOW_STALE_TERRAFORM" == "true" ]]; then
            {
              echo "## :warning: Stale terraform — bypassed via allow_stale_terraform"
              echo ""
              render_diff_details
              echo ""
              echo "Operator passed \`allow_stale_terraform=true\` — proceeding without re-applying terraform."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Stale terraform detected ($DIFF_COUNT prod-affecting files changed since ${LAST_TF_SHA:0:8}) — bypass enabled via allow_stale_terraform=true. Proceeding."
            exit 0
          fi

          if [[ "$ROLLBACK" == "true" ]]; then
            # Rollback is auto-bypassed (rolling back app code typically
            # wants existing infra). Surface the diff inline so the operator
            # at least sees what they're bypassing — the runbook (Case C)
            # asks them to read it before proceeding, but if we never
            # show it they can't.
            #
            # Caveat the runbook also covers: a rollback to a pre-infra-
            # change image when post-infra-change resources have already
            # been created can still fail at runtime (e.g., new env var
            # the old binary doesn't read, or a missing secret reference
            # whose IAM was tightened by the infra change). The bypass
            # is convenience, not safety.
            #
            # The DIFF_PRINT_CAP below caps only the inline run-log echo —
            # the GITHUB_STEP_SUMMARY <details> block from
            # render_diff_details intentionally renders the full diff
            # (collapsed by default, so it does not flood visually) so an
            # operator verifying-then-bypassing has the complete file list.
            {
              echo "## :warning: Stale terraform — bypassed via rollback=true"
              echo ""
              render_diff_details
              echo ""
              echo "\`rollback=true\` auto-bypasses (rolling back app code typically wants existing infra)."
            } >> "$GITHUB_STEP_SUMMARY"
            DIFF_PRINT_CAP=50
            echo "::warning::Stale terraform detected ($DIFF_COUNT prod-affecting files changed since ${LAST_TF_SHA:0:8}) — rollback=true auto-bypasses. Diff (showing first $DIFF_PRINT_CAP):"
            head -n "$DIFF_PRINT_CAP" <<< "$TF_DIFF" | while IFS= read -r line; do
              printf '  %s\n' "$line"
            done
            if (( DIFF_COUNT > DIFF_PRINT_CAP )); then
              echo "  ... ($((DIFF_COUNT - DIFF_PRINT_CAP)) more file(s) — full list in the GITHUB_STEP_SUMMARY rendered above)"
            fi
            exit 0
          fi

          # Failure path — reaches here only when neither bypass applied.
          {
            echo "## :x: Stale terraform check"
            echo ""
            render_diff_details
            echo ""
            echo "Two ways forward:"
            echo "1. Re-run with \`run_terraform=true\` (recommended — applies the pending infra change before the deploy)."
            echo "2. Re-run with \`allow_stale_terraform=true\` if you have verified the diff is benign or you are intentionally rolling back app code."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Stale terraform: $DIFF_COUNT prod-affecting file(s) changed between last-apply ${LAST_TF_SHA:0:8} and deploy SHA ${CURRENT_SHA:0:8}. Re-run with run_terraform=true (preferred) or allow_stale_terraform=true to bypass."
          exit 1

      # Lock acquisition runs LAST in preflight so any failing earlier
      # check leaves the lock untouched (failures during preflight don't
      # ever flip /prod/nhp/deploy/state to "deploying"). The finalize
      # release step uses `put-parameter --overwrite`, which has no
      # acquired-lock precondition, so a failed-preflight run still
      # cleanly writes `failed` and never errors on a never-acquired lock.
      - name: Check and acquire deployment lock
        env:
          FORCE_UNLOCK: ${{ inputs.force_unlock }}
        run: |
          echo "Checking deployment lock..."
          DEPLOY_STATE=$(aws ssm get-parameter \
            --name "/prod/nhp/deploy/state" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [[ "$DEPLOY_STATE" == "deploying" ]]; then
            if [[ "$FORCE_UNLOCK" == "true" ]]; then
              echo "::warning::Deployment lock is held, but force_unlock=true — overriding stale lock"
            else
              echo "::error::Deployment lock is held — another deployment is in progress."
              echo "::error::Wait for it to finish, or re-run with force_unlock=true to override a stale lock."
              exit 1
            fi
          else
            echo "  Deploy state: ${DEPLOY_STATE:-not set} (no lock held)"
          fi

          echo "Acquiring deployment lock..."
          aws ssm put-parameter \
            --name "/prod/nhp/deploy/state" \
            --value "deploying" \
            --type String \
            --overwrite
          echo "  Lock acquired: /prod/nhp/deploy/state = deploying"

  # =============================================================================
  # TERRAFORM PLAN - Show what will change (NO approval gate — runs automatically)
  # =============================================================================
  terraform-plan:
    name: Terraform Plan (prod)
    needs: [manifest, preflight]
    if: inputs.run_terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      # Build/test before assuming prod credentials. The Lambda package action
      # runs Python unit tests, including paths that intentionally exercise
      # CloudWatch metric emitters; those tests must not inherit prod creds.
      - name: Build Lambda Packages
        uses: ./.github/actions/build-lambda-packages

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          # -reconfigure: backend.tf gained kms_key_id (#1128) — harmless no-op on
          # this fresh CI checkout, required for a local stale .terraform/. State
          # does not move (not -migrate-state). See tfstate-kms-migration runbook.
          terraform init -reconfigure

      - name: Terraform change summary
        continue-on-error: true
        run: |
          set -euo pipefail

          # Read last successful prod terraform apply commit from SSM
          LAST_TF_SHA=$(aws ssm get-parameter \
            --name "/prod/nhp/deploy/last-terraform-apply-commit" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [[ -z "$LAST_TF_SHA" || "$LAST_TF_SHA" == "initial" ]]; then
            echo "::notice::No previous terraform apply commit tracked in SSM — skipping change summary"
            exit 0
          fi

          if ! git rev-parse --verify "${LAST_TF_SHA}^{commit}" > /dev/null 2>&1; then
            echo "::warning::Previous terraform apply commit $LAST_TF_SHA not found in repo history"
            exit 0
          fi

          CURRENT_SHA="${GITHUB_SHA}"
          echo "Comparing terraform changes: ${LAST_TF_SHA:0:8}..${CURRENT_SHA:0:8}"

          # Check for shared module changes
          MODULE_CHANGES=$(git diff --name-only "$LAST_TF_SHA..$CURRENT_SHA" -- terraform/modules/ || echo "")
          ENV_CHANGES=$(git diff --name-only "$LAST_TF_SHA..$CURRENT_SHA" -- terraform/environments/prod/ || echo "")
          MODULE_COMMITS=$(git log --oneline "$LAST_TF_SHA..$CURRENT_SHA" -- terraform/modules/ 2>/dev/null || echo "")
          ENV_COMMITS=$(git log --oneline "$LAST_TF_SHA..$CURRENT_SHA" -- terraform/environments/prod/ 2>/dev/null || echo "")

          if [[ -n "$MODULE_CHANGES" ]]; then
            MODULE_COUNT=$(printf '%s' "$MODULE_CHANGES" | grep -c . || echo "0")
            echo "::warning::Shared module changes detected: $MODULE_COUNT files changed in terraform/modules/ since last prod apply"
          fi

          {
            echo "## Terraform Changes Since Last Prod Apply"
            echo ""
            echo "Comparing [\`${LAST_TF_SHA:0:8}\`](https://github.com/${{ github.repository }}/commit/$LAST_TF_SHA) → [\`${CURRENT_SHA:0:8}\`](https://github.com/${{ github.repository }}/commit/$CURRENT_SHA)"
            echo ""

            if [[ -n "$MODULE_CHANGES" ]]; then
              echo "### :warning: Shared Module Changes"
              echo "These affect ALL environments, not just prod:"
              echo ""
              echo "<details><summary>Module commits (click to expand)</summary>"
              echo ""
              echo '```'
              echo "$MODULE_COMMITS"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
              echo "<details><summary>Changed module files ($MODULE_COUNT files)</summary>"
              echo ""
              echo '```'
              echo "$MODULE_CHANGES"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            else
              echo "### :white_check_mark: No Shared Module Changes"
              echo ""
            fi

            if [[ -n "$ENV_CHANGES" ]]; then
              ENV_COUNT=$(printf '%s' "$ENV_CHANGES" | grep -c . || echo "0")
              echo "### Prod Environment Changes ($ENV_COUNT files)"
              echo ""
              echo "<details><summary>Environment commits</summary>"
              echo ""
              echo '```'
              echo "$ENV_COMMITS"
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            else
              echo "### :white_check_mark: No Prod Environment Changes"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Plan
        working-directory: terraform/environments/prod
        env:
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          TF_VAR_ac_license_key: ${{ secrets.PROD_AC_LICENSE_KEY }}
          TF_VAR_grafana_auth: ${{ secrets.PROD_GRAFANA_AUTH }}
          TF_VAR_confirm_prod_deployment: "yes-deploy-to-production"
          TF_VAR_image_tag: ${{ needs.manifest.outputs.effective_image_tag }}
          TF_VAR_frps_image_tag: ${{ needs.manifest.outputs.frps_image_tag }}
          TF_VAR_cell_id: ${{ inputs.cell_id }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan-output.txt
          terraform show -json tfplan > plan-show.json
          ../../../.github/scripts/check-internal-relay-migration-active-color.sh prod plan-show.json

          # Write plan to step summary so reviewer can see it before approving apply
          {
            echo "## Terraform Plan — Production"
            echo ""
            echo "<details><summary>Full plan output (click to expand)</summary>"
            echo ""
            echo '```'
            cat plan-output.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            # Extract the summary line (e.g., "Plan: 2 to add, 1 to change, 0 to destroy.")
            SUMMARY=$(grep -E '^(Plan:|No changes\.)' plan-output.txt || echo "Unable to extract summary")
            echo "**$SUMMARY**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-prod
          path: terraform/environments/prod/tfplan
          retention-days: 1

      # Convert the binary plan to JSON for the qurl-schema-compat job to
      # consume. Doing the conversion here (where terraform is already set
      # up and the providers are already initialized) means the
      # qurl-schema-compat job stays slim — it just downloads the JSON,
      # pulls the qurl image, and runs the schema-check binary. No
      # terraform install in the gate.
      - name: Convert plan to JSON
        working-directory: terraform/environments/prod
        run: terraform show -json tfplan > tfplan.json

      - name: Upload plan JSON artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-prod-json
          path: terraform/environments/prod/tfplan.json
          retention-days: 1

      # `lambda-*` upload policy: `error` by default; `ignore` only for
      # the deferred-to-apply set plus deprecated custom-domain-cert.
      # Full policy/class membership: docs/runbooks/promote-to-prod-lambda-
      # artifacts.md and tests/scripts/test_promote_to_prod_gating.py.
      # Module-level toggle: `var.centralized_cert_enabled`.
      - name: Upload acme-cert Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-acme-cert
          path: terraform/modules/acme-cert/build/lambda-acme-cert.zip
          retention-days: 1
          if-no-files-found: error

      # Module-level toggle: `var.enable_canary_deployment`.
      - name: Upload canary orchestrator Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-canary-orchestrator
          path: terraform/modules/canary-deployment/lambda/canary_orchestrator.zip
          retention-days: 1
          if-no-files-found: error

      # Deferred-to-apply: module "developer_portal" has a module-wide
      # depends_on. #2284.
      - name: Upload playground proxy Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-playground-proxy
          path: terraform/modules/developer-portal/lambda/playground_proxy.zip
          retention-days: 1
          if-no-files-found: ignore

      # Conditional toggle chain: `var.enable_stale_finding_watchdog &&
      # var.enable_guardduty && (alerts || email_alerts)`. Silent
      # disable defeats the security control (#1137); see the runbook's
      # "intentional disable" section for the legitimate-disable path.
      - name: Upload stale finding watchdog Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-stale-finding-watchdog
          path: terraform/modules/security/lambda/stale_finding_watchdog.zip
          retention-days: 1
          if-no-files-found: error

      # Strict plan-time artifact: the AC module's dependency is now scoped to
      # its launch template, so archive_file materializes during plan. This
      # restores the loud-fail half of #2284 for AC Lambdas.
      - name: Upload AC keygen Lambda
        if: inputs.deploy_ac
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-ac-keygen
          path: terraform/modules/ac/keygen_lambda.zip
          retention-days: 1
          if-no-files-found: error

      # Strict for the same narrowed AC dependency. The direct Terraform gate
      # remains `var.enable_secret_reconciliation`.
      - name: Upload AC secret reconciliation Lambda
        if: inputs.deploy_ac
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-ac-secret-reconciliation
          path: terraform/modules/ac/lambda/ac_secret_reconciliation.zip
          retention-days: 1
          if-no-files-found: error

      # Deferred-to-apply: module "compute" has a module-wide depends_on. #2284.
      # Always-on, so any missing plan-time zip is the deferral case.
      - name: Upload compute keygen Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-compute-keygen
          path: terraform/modules/compute/keygen_lambda.zip
          retention-days: 1
          if-no-files-found: ignore

      # Deferred-to-apply: same module "compute" depends_on. #2284.
      # Additionally gated by `var.enable_termination_cleanup`.
      - name: Upload compute termination cleanup Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-compute-termination-cleanup
          path: terraform/modules/compute/lambda/server_termination_cleanup.zip
          retention-days: 1
          if-no-files-found: ignore

      # Deferred-to-apply: same module "developer_portal" depends_on as
      # the playground-proxy upload above. #2284.
      - name: Upload developer portal auth0 cleanup Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-developer-portal-auth0-cleanup
          path: terraform/modules/developer-portal/lambda/auth0_cleanup.zip
          retention-days: 1
          if-no-files-found: ignore

      # Always-on (no toggle): `module "nhp_keypair"` has no module-wide
      # depends_on, so the archive_file materializes at plan time.
      - name: Upload nhp-keypair keygen Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-nhp-keypair-keygen
          path: terraform/modules/nhp-keypair/keygen_lambda.zip
          retention-days: 1
          if-no-files-found: error

      # Module-level toggle: `var.deploy_status_page`.
      - name: Upload status page aggregator Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-status-page-aggregator
          path: terraform/modules/status-page/lambda/status_aggregator.zip
          retention-days: 1
          if-no-files-found: error

      # Conditional toggle chain: `var.deploy_qurl_link && var.enable_resolve_cloudfront`.
      # This `archive_file` lives in the root terraform module (not a
      # sub-module under terraform/modules/) — easy to miss when sweeping
      # `terraform/modules/**` for `archive_file` blocks. The runbook's
      # "Currently covered Lambdas" table is the source of truth for
      # which paths to walk on a future audit.
      - name: Upload cloudfront CIDR drift Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-cloudfront-cidr-drift
          path: terraform/lambda/.build/cloudfront_cidr_drift.zip
          retention-days: 1
          if-no-files-found: error

      # Feature-gated by `var.deploy_custom_domain_cert` (currently true
      # in prod). Deprecated `ignore` escape hatch (#1383) — distinct
      # from the deferred-to-apply `ignore` class above; see the runbook's
      # "Loud-fail vs deferred-to-apply" section. #1382 tracks the
      # transient-failure masking trade-off `continue-on-error: true`
      # introduces.
      - name: Upload custom domain cert Lambda
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-custom-domain-cert
          path: terraform/modules/custom-domain-cert/build/lambda-custom-domain-cert.zip
          retention-days: 1
          if-no-files-found: ignore

  # =============================================================================
  # QURL SCHEMA COMPAT - Refuse destructive terraform if the deployed
  # qurl-service code still depends on a GSI the plan would remove.
  # =============================================================================
  #
  # This is the gate that closes the 2026-03-24 incident class (nhp PR #877:
  # owner-target-index removed while the deployed qurl-service still queried
  # it; POST /v1/qurls returned 500 for >1 week before customers noticed).
  #
  # The job runs the qurl-schema-check binary (built into the same Docker
  # image as the qurl-api server in layervai/qurl-service#247) against the
  # terraform plan that terraform-apply is about to apply. The binary
  # compares the plan's post-apply DynamoDB schema against the deployed
  # binary's compiled-in registry of (table, GSI) pairs. If any registered
  # GSI would be missing in the post-apply state, the binary exits 1 and
  # this job fails, blocking terraform-apply.
  #
  # CRITICAL: the gate must validate the qurl image that will be RUNNING
  # IN PROD AFTER THE DEPLOY COMPLETES, not the latest sandbox build. The
  # 2026-03-24 incident's smoking gun was deploy_qurl=false with
  # run_terraform=true — terraform applied while prod kept running its old
  # image. So:
  #
  #   - if deploy_qurl == true: validate the new image being deployed
  #     (manifest.outputs.qurl_image_tag)
  #   - if deploy_qurl == false: validate the image already running in
  #     prod (manifest.outputs.current_prod_qurl_tag, read from SSM by
  #     the manifest job so this gate doesn't need prod credentials)
  #
  # Either way, the validation matches reality: whichever image will be
  # serving qurl-api requests after the apply is what gets checked.
  #
  # Tracked in #1013.
  qurl-schema-compat:
    name: QURL Schema Compatibility Check
    needs: [manifest, preflight, terraform-plan]
    # Schema-compat is a guard for the *apply* — it asserts the post-
    # apply schema matches what the deployed qurl image expects. On a
    # `run_terraform=false` deploy, terraform isn't applying, so there
    # is no post-apply schema to compare against; the check would have
    # nothing to do. Operators wanting to deploy a new qurl image
    # against existing infra are responsible for confirming schema
    # compatibility ahead of time (the runbook's Case B step 1 spells
    # this out explicitly). The structural test pins this gate;
    # `_assert_terraform_apply_needs_schema_compat` asserts the intent.
    if: inputs.run_terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download plan JSON artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-prod-json
          path: .

      - name: Resolve effective qurl image tag
        id: resolve
        env:
          DEPLOY_QURL: ${{ inputs.deploy_qurl }}
          NEW_QURL_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
          CURRENT_PROD_QURL_TAG: ${{ needs.manifest.outputs.current_prod_qurl_tag }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_QURL" == "true" ]]; then
            if [[ -z "$NEW_QURL_TAG" ]]; then
              echo "::error::deploy_qurl=true but manifest produced no qurl_image_tag — cannot validate schema."
              exit 1
            fi
            echo "Validating against new qurl image being deployed: $NEW_QURL_TAG"
            EFFECTIVE_TAG="$NEW_QURL_TAG"
          else
            # Use the currently-deployed prod tag already read by the
            # manifest job (from /${PROD_SSM_PREFIX}/qurl-api-image-tag).
            # This is the image that will continue to serve traffic after
            # the destructive terraform applies — it must NOT depend on
            # any GSI the plan removes.
            if [[ -z "$CURRENT_PROD_QURL_TAG" || "$CURRENT_PROD_QURL_TAG" == "not deployed" || "$CURRENT_PROD_QURL_TAG" == "latest" ]]; then
              echo "::error::deploy_qurl=false but the manifest could not resolve the current prod qurl image tag (got '${CURRENT_PROD_QURL_TAG:-<empty>}'). Without knowing what's running, schema compatibility cannot be verified — refusing to advance the deploy."
              exit 1
            fi
            echo "Validating against currently-deployed prod qurl image: $CURRENT_PROD_QURL_TAG"
            EFFECTIVE_TAG="$CURRENT_PROD_QURL_TAG"
          fi
          echo "effective_tag=$EFFECTIVE_TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (sandbox - ECR pull)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to sandbox ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Pull qurl-service image and run schema-check
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_QURL_REPO: ${{ env.ECR_QURL_REPO }}
          EFFECTIVE_TAG: ${{ steps.resolve.outputs.effective_tag }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_QURL_REPO:$EFFECTIVE_TAG"
          echo "Pulling $IMAGE..."
          docker pull "$IMAGE"

          echo ""
          echo "Running qurl-schema-check against the prod terraform plan..."
          echo "  Image:    $IMAGE"
          echo "  Plan:     tfplan.json"
          echo ""

          # Pre-gate smoke + rationale for --entrypoint (shared by both
          # docker runs below): the qurl-service image ENTRYPOINT is a
          # wrapper that unconditionally execs qurl-api (see
          # qurl-service/docker/entrypoint-api.sh). Without the override,
          # `docker run $IMAGE /app/qurl-schema-check ...` becomes
          # `qurl-api /app/qurl-schema-check ...` — qurl-api silently
          # ignores the positional args and dies on "AWS_REGION is
          # required" from its own config validator. The binary we want
          # is a sibling in /app, reached via --entrypoint.
          #
          # The smoke catches the same class at an unambiguous exit code
          # (0 when the binary runs; 126/127 when it can't). On failure
          # we surface the captured output so operators see the real
          # error instead of the generic annotation. Without this pre-gate
          # the verdict step below misattributes an unrelated exit 1 to
          # "GSI missing" — the exact misdiagnosis that blocked today's
          # prod release until the Dockerfile bug was traced by hand.
          #
          # Runtime contract: `qurl-schema-check --version` must short-
          # circuit before AWS config / any framework init. If a future
          # qurl-service revision re-orders the binary's startup so
          # --version runs later, the smoke will false-fail and block
          # deploys on a healthy binary. qurl-service#247 and later
          # revisions to cmd/qurl-schema-check/main.go must preserve
          # this property. Structural follow-up tracked in #1318.
          SMOKE_OUT=$(docker run --rm --entrypoint /app/qurl-schema-check "$IMAGE" --version 2>&1) || {
            echo "::group::qurl-schema-check --version output"
            echo "$SMOKE_OUT"
            echo "::endgroup::"
            echo "::error::qurl-schema-check --version smoke failed in image $IMAGE. The binary is not runnable (missing, not executable, or crashes on startup) — see the grouped output above for the real error. The per-plan verdict step below is not trustworthy until this passes."
            exit 1
          }
          # Pin the binary build in the run log so a future incident can
          # correlate the verdict with a specific schema-check version.
          echo "qurl-schema-check smoke OK: $SMOKE_OUT"

          # The schema-check binary writes a precise (table, index, reason)
          # report to its own stderr on failure; surface its full output in
          # the workflow log so operators see exactly which GSI is missing
          # without having to re-run anything.
          set +e
          docker run --rm \
            -v "$PWD/tfplan.json:/tmp/tfplan.json:ro" \
            --entrypoint /app/qurl-schema-check \
            "$IMAGE" \
            --plan /tmp/tfplan.json
          EXIT=$?
          set -e

          case "$EXIT" in
            0)
              echo ""
              echo "::notice::qurl-schema-check passed: every required GSI is present in the post-apply state."
              ;;
            1)
              echo ""
              echo "::error::qurl-schema-check failed: a registered GSI is missing in the post-apply terraform state. The deployed qurl-service code still queries that GSI; applying this plan would break production. See the diagnostic above for the exact (table, index) pair and remediation steps."
              exit 1
              ;;
            2)
              echo ""
              echo "::error::qurl-schema-check could not validate the plan (exit 2). This usually means the terraform plan JSON is malformed, an aws_dynamodb_table block is structurally broken, or two tables in the plan ambiguously map to the same logical name. Refusing to advance the deploy until the operator investigates."
              exit 1
              ;;
            126|127)
              # 126 = permission denied; 127 = binary not found. Most
              # likely the effective qurl image predates layervai/qurl-service#247
              # which added /app/qurl-schema-check to the Docker image.
              # This case should normally be caught by the --version smoke
              # above — reaching here means either the smoke was removed
              # (investigate) or the image mutated between the smoke and
              # this run (effectively impossible on a single runner).
              echo ""
              echo "::error::qurl-schema-check binary not found or not executable in image $IMAGE (exit $EXIT). This should have been caught by the --version smoke above — investigate why it wasn't. The effective qurl image (tag $EFFECTIVE_TAG) likely predates qurl-service#247 which added the schema-check binary. Either deploy a newer qurl image (deploy_qurl=true with a post-#247 tag) or, if this is intentional, verify GSI compatibility manually before applying."
              exit 1
              ;;
            *)
              echo ""
              echo "::error::qurl-schema-check returned unexpected exit code $EXIT. Refusing to advance the deploy."
              exit 1
              ;;
          esac

  # =============================================================================
  # TERRAFORM APPLY - Apply reviewed plan (approval gate)
  # =============================================================================
  terraform-apply:
    name: Terraform Apply (prod)
    needs: [manifest, preflight, terraform-plan, qurl-schema-compat]
    if: inputs.run_terraform
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-prod
          path: terraform/environments/prod

      - name: Download acme-cert Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-acme-cert
          path: terraform/modules/acme-cert/build

      - name: Download canary orchestrator Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-canary-orchestrator
          path: terraform/modules/canary-deployment/lambda

      - name: Download playground proxy Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # deferred-to-apply (#2284)
        with:
          name: lambda-playground-proxy
          path: terraform/modules/developer-portal/lambda

      - name: Download stale finding watchdog Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-stale-finding-watchdog
          path: terraform/modules/security/lambda

      # Mirrors the upload gate above (`inputs.deploy_ac`).
      - name: Download AC keygen Lambda
        if: inputs.deploy_ac
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-ac-keygen
          path: terraform/modules/ac

      - name: Download AC secret reconciliation Lambda
        if: inputs.deploy_ac
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-ac-secret-reconciliation
          path: terraform/modules/ac/lambda

      - name: Download compute keygen Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # deferred-to-apply (#2284)
        with:
          name: lambda-compute-keygen
          path: terraform/modules/compute

      - name: Download compute termination cleanup Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # deferred-to-apply (#2284)
        with:
          name: lambda-compute-termination-cleanup
          path: terraform/modules/compute/lambda

      # Shares `terraform/modules/developer-portal/lambda` with playground-
      # proxy by design (see runbook's "Sibling Lambdas" callout).
      - name: Download developer portal auth0 cleanup Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # deferred-to-apply (#2284)
        with:
          name: lambda-developer-portal-auth0-cleanup
          path: terraform/modules/developer-portal/lambda

      - name: Download nhp-keypair keygen Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-nhp-keypair-keygen
          path: terraform/modules/nhp-keypair

      - name: Download status page aggregator Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-status-page-aggregator
          path: terraform/modules/status-page/lambda

      - name: Download cloudfront CIDR drift Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-cloudfront-cidr-drift
          path: terraform/lambda/.build

      # Deprecated `ignore` escape hatch (#1383), paired with upload-side
      # `ignore`; #1382 tracks the `continue-on-error` masking trade-off.
      - name: Download custom domain cert Lambda
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: lambda-custom-domain-cert
          path: terraform/modules/custom-domain-cert/build

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          # -reconfigure: backend.tf gained kms_key_id (#1128) — harmless no-op on
          # this fresh CI checkout, required for a local stale .terraform/. State
          # does not move (not -migrate-state). See tfstate-kms-migration runbook.
          terraform init -reconfigure

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        env:
          TF_VAR_auth_signing_key: ${{ secrets.NHP_AUTH_SIGNING_KEY }}
          TF_VAR_auth_aes_key: ${{ secrets.NHP_AUTH_AES_KEY }}
          TF_VAR_ac_license_key: ${{ secrets.PROD_AC_LICENSE_KEY }}
          TF_VAR_grafana_auth: ${{ secrets.PROD_GRAFANA_AUTH }}
          TF_VAR_confirm_prod_deployment: "yes-deploy-to-production"
          TF_VAR_image_tag: ${{ needs.manifest.outputs.effective_image_tag }}
          TF_VAR_frps_image_tag: ${{ needs.manifest.outputs.frps_image_tag }}
          TF_VAR_cell_id: ${{ inputs.cell_id }}
        # `-no-color` matches the plan step's flag so apply output stays
        # readable in `gh run view --log` (no embedded ANSI escapes).
        run: terraform apply -auto-approve -no-color tfplan

  # =============================================================================
  # DEPLOY SERVER - Via canary (Step Functions) with first-deploy fallback
  # =============================================================================
  deploy-server:
    name: Deploy NHP Server
    needs: [manifest, preflight, terraform-plan, terraform-apply, deploy-ac]
    # When run_terraform=true a skipped terraform-apply (e.g., qurl-schema-
    # compat blocked it) must NOT release new binaries onto stale infra —
    # only honor a skipped apply when the operator explicitly opted out
    # via run_terraform=false (issue #1322).
    # Asserted by tests/scripts/test_promote_to_prod_gating.py; update
    # that test's APPLY_SUCCESS_RE / APPLY_SKIPPED_RE / DEAD_PERMISSIVE_RE
    # constants if the gate phrasing here changes.
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (
        (inputs.run_terraform && needs.terraform-apply.result == 'success') ||
        (!inputs.run_terraform && needs.terraform-apply.result == 'skipped')
      ) &&
      (
        (inputs.deploy_ac && needs.deploy-ac.result == 'success') ||
        (!inputs.deploy_ac && needs.deploy-ac.result == 'skipped')
      ) &&
      inputs.deploy_server
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
      CELL_ID: ${{ inputs.cell_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The immediate mark intentionally overlaps with the parent canary poller
      # and child canary workflow heartbeats so dispatch gaps stay covered.
      - name: Mark Deployment Window
        uses: ./.github/actions/mark-deployment-window
        with:
          environment: prod
          cell_id: ${{ inputs.cell_id }}
          component: server
          strategy: promote

      - name: Deploy server
        id: deploy-server-step
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_WINDOW_ENVIRONMENT: prod
          DEPLOYMENT_WINDOW_CELL_ID: ${{ inputs.cell_id }}
          DEPLOYMENT_WINDOW_COMPONENT: server
          DEPLOYMENT_WINDOW_STRATEGY: promote-server
          DEPLOYMENT_WINDOW_EMIT_INTERVAL_SECONDS: '60'
        run: |
          echo "--- Deploying NHP Server ---"
          START_TIME=$(date +%s)

          # Stream startup logs to the console in the background
          ./.github/scripts/tail-deploy-logs.sh server prod "$CELL_ID" &
          LOG_TAIL_PID=$!

          # Check if canary state machine exists (indicates mature infra)
          DEPLOY_EXIT=0
          STATE_MACHINE_ARN=$(aws ssm get-parameter \
            --name "/prod/nhp/${CELL_ID}/canary/server/state-machine-arn" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [[ -n "$STATE_MACHINE_ARN" && "$STATE_MACHINE_ARN" != "initial" ]]; then
            echo "deploy_method=canary" >> "$GITHUB_OUTPUT"
            ./.github/scripts/dispatch-and-poll-canary.sh server "$IMAGE_TAG" prod "$CELL_ID" || DEPLOY_EXIT=$?
          else
            echo "deploy_method=direct" >> "$GITHUB_OUTPUT"
            echo "::notice::No canary state machine — using direct SSM + instance refresh (first deploy)"
            ./.github/scripts/update-ssm-image-tag.sh prod server "$IMAGE_TAG" --refresh || DEPLOY_EXIT=$?
          fi

          # Stop log tailing and propagate the deploy exit code
          kill "$LOG_TAIL_PID" 2>/dev/null || true
          wait "$LOG_TAIL_PID" 2>/dev/null || true

          DURATION=$(( $(date +%s) - START_TIME ))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          exit "$DEPLOY_EXIT"

      - name: Server deploy summary
        if: always() && steps.deploy-server-step.outcome != 'skipped'
        env:
          DEPLOY_METHOD: ${{ steps.deploy-server-step.outputs.deploy_method }}
          RUN_URL: ${{ steps.deploy-server-step.outputs.run_url }}
          DURATION: ${{ steps.deploy-server-step.outputs.duration }}
          RESULT: ${{ steps.deploy-server-step.outcome }}
        run: |
          {
            echo "## Deploy Server"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Component | NHP Server |"
            echo "| Method | ${DEPLOY_METHOD:-unknown} |"
            echo "| Image | \`$IMAGE_TAG\` |"
            echo "| Duration | ${DURATION:-unknown} |"
            echo "| Result | **$RESULT** |"
            if [[ -n "$RUN_URL" ]]; then
              echo "| Canary Run | [View]($RUN_URL) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # DEPLOY TRAEFIK PLUGINS - Push layervai/traefik-plugins HEAD to prod plugins S3
  # =============================================================================
  # AC user_data pulls Traefik plugins from layerv-nhp-prod-plugins/traefik/ on
  # boot. Without a fresh upload here, AC instances cycled by the canary below
  # would boot with stale plugins from the previous manual
  # traefik-plugins/deploy.yml dispatch — the silent-drift class this job
  # closes. Mirrors the NHP-bucket-upload half of that workflow; the SSM live
  # push to running AC instances is intentionally not mirrored (the canary
  # below cycles AC, fresh instances pull from S3 on boot).
  #
  # Sequenced before deploy-ac so every refreshed AC boots with the exact
  # plugin bytes validated by this release. deploy-server waits for deploy-ac:
  # durable session authority must never become an admitting producer before
  # the AC fleet can perform verified non-dry-run kernel teardown.
  deploy-traefik-plugins:
    name: Deploy Traefik Plugins
    # `manifest` is intentionally NOT in `needs:`: this job doesn't
    # consume `manifest.outputs.*`, and listing it would force a no-op
    # ordering wait. The other deploy-* jobs DO need manifest for
    # `effective_image_tag` etc.; this job's tag is the cross-repo
    # plugins SHA, captured locally below.
    needs: [preflight, terraform-plan, terraform-apply]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (
        (inputs.run_terraform && needs.terraform-apply.result == 'success') ||
        (!inputs.run_terraform && needs.terraform-apply.result == 'skipped')
      ) &&
      inputs.deploy_ac
    # Gated on `inputs.deploy_ac` (not a separate
    # `inputs.deploy_traefik_plugins` flag) by design: Traefik plugins
    # serve AC, so a promote that doesn't cycle AC has no instance to
    # pick up new plugins. For a plugin-only emergency rollout that
    # bypasses an AC cycle, dispatch
    # `layervai/traefik-plugins/.github/workflows/deploy.yml`
    # manually with `environment=prod` (kept as the escape hatch).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLUGIN_BUCKET: layerv-nhp-prod-plugins
      # Sub-path inside the workspace where traefik-plugins is cloned. Kept
      # in a sub-folder so the default workflow checkout (which provides
      # ./.github/actions/setup-deploy) is not overwritten.
      PLUGIN_REPO_PATH: traefik-plugins-src
      # Source of truth for the workflow's plugin path list. Both the
      # cross-repo sparse-checkout filter and the upload loop derive from
      # this var, so adding a plugin is a one-line change. Format: one
      # `plugins-local/src/<path>` line per plugin (the prefix is what
      # actions/checkout's sparse-checkout filter takes; the upload loop
      # strips it). Must mirror the keys in the `traefik_plugins` map of
      # `terraform/environments/prod/terraform.tfvars` — that map is the
      # ultimate source-of-truth for what AC user_data actually downloads.
      # Specifically: a tfvars entry MISSING from this list silently skips
      # its upload and AC user_data 404s when it tries to sync that plugin
      # from S3. The reverse (extra entry here, not in tfvars) is benign
      # (wasted S3 upload, AC never reads it). Structural lint of the
      # missing-from-sparse-paths direction is tracked in #1750.
      #
      # The full three-file invariant (this env, prod tfvars, traefik-
      # plugins repo directory) is documented in terraform/CLAUDE.md under
      # "AC Plugin Source-of-Truth Invariant".
      TRAEFIK_PLUGIN_SPARSE_PATHS: |
        plugins-local/src/github.com/traefik/qurl-router
      # Bound retry behavior for the s3 sync calls below. Default
      # (`legacy`, 4 attempts) is fine; bumping to adaptive + 5 makes a
      # transient S3 throttle blip self-heal instead of failing the
      # whole promote on a one-off.
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: '5'
    steps:
      # Default checkout of nhp so `./.github/actions/setup-deploy` resolves
      # and the prod tfvars are available for the version-pin preflight below.
      # Sparse-checkout limits the on-disk footprint to just those two paths;
      # the rest of nhp isn't read by this job.
      - name: Checkout nhp (sparse — composite action + prod tfvars)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            terraform/environments/prod/terraform.tfvars
          sparse-checkout-cone-mode: false
          # No git operations after checkout in this job (setup-deploy is
          # a thin wrapper around aws-actions/configure-aws-credentials —
          # no git access). Drop the GITHUB_TOKEN from .git/config so
          # it's not co-resident with the prod AWS creds the next steps
          # will hold. If setup-deploy ever grows a `git` step, that
          # change MUST also flip this back to default (or scope to a
          # narrower path).
          persist-credentials: false

      # Preflight: assert every entry in the prod traefik_plugins tfvars map
      # has `version = "latest"`. AC user_data downloads from
      # `traefik/<plugin>/<version>/`; this job uploads to the `latest/`
      # prefix specifically. If a future tfvars edit pins to a SHA (e.g., to
      # reduce blast radius during an incident), the latest/ uploads here
      # become no-ops AC never reads — re-introducing the silent-drift class
      # this job exists to close. Fail loud at preflight rather than ship
      # ghost uploads.
      - name: Preflight - assert prod tfvars pin to "latest"
        run: |
          set -euo pipefail
          TFVARS=terraform/environments/prod/terraform.tfvars
          # Extract entry-level `version = ...` inside traefik_plugins.
          # Load-bearing assumptions:
          #   - top-level `traefik_plugins = {` and its closing `}` are at
          #     column 1 (terraform fmt -recursive enforces this in CI)
          #   - entry-level keys (the per-plugin block's attributes) are
          #     at exactly 4 spaces (terraform fmt's 2-space indent step
          #     for nested levels)
          # The 4-space anchor avoids matching a nested `version` key
          # that could legally appear in `config = { "version" = "..." }`
          # — that would be at 8 spaces, not 4. Trailing whitespace and
          # `# comment` after the literal "latest" are tolerated.
          NON_LATEST=$(awk '
            /^traefik_plugins[[:space:]]*=[[:space:]]*\{/ { in_block = 1; next }
            in_block && /^\}/ { in_block = 0; next }
            in_block && /^    version[[:space:]]*=/ {
              v = $0
              sub(/^[^=]*=[[:space:]]*/, "", v)
              if (v !~ /^"latest"[[:space:]]*(#.*)?$/) print v
            }
          ' "$TFVARS")
          # Cross-check tfvars keys against TRAEFIK_PLUGIN_SPARSE_PATHS.
          # The dangerous direction is "tfvars has plugin X, sparse-paths
          # doesn't" — AC user_data would 404 on the missing S3 key.
          # The reverse (extra entry here, not in tfvars) is benign:
          # we upload to S3 keys AC never reads, wasting bandwidth but
          # not breaking anything. An empty `traefik_plugins` map in
          # tfvars passes silently because the comm output (one empty
          # line) gets trimmed by `$(...)` to "" and then `[ -n ]`
          # returns false — that's the correct behavior since "no
          # plugins configured" is a valid state. Don't add a `| grep
          # -v '^$'` filter to "fix" this; it would be redundant and
          # mask the actual flow.
          # Note: prod tfvars only uses quoted keys today; bare-key
          # support (sandbox-shape) is tracked in #1750 alongside the
          # full source-of-truth refactor.
          TFVARS_KEYS=$(awk '
            /^traefik_plugins[[:space:]]*=[[:space:]]*\{/ { in_block = 1; next }
            in_block && /^\}/ { in_block = 0; next }
            in_block && /^  "[^"]+"[[:space:]]*=[[:space:]]*\{/ {
              sub(/^  "/, "")
              sub(/".*/, "")
              print
            }
          ' "$TFVARS" | sort -u)
          SPARSE_KEYS=$(printf '%s\n' "$TRAEFIK_PLUGIN_SPARSE_PATHS" \
            | sed -e 's|^plugins-local/src/||' -e '/^$/d' \
            | sort -u)
          MISSING_FROM_SPARSE=$(comm -23 <(echo "$TFVARS_KEYS") <(echo "$SPARSE_KEYS"))
          # Defense-in-depth: count entry-opens vs version= lines. If
          # any entry lacks a version key, terraform's type system
          # rejects it at plan — but if the schema's ever loosened
          # (e.g., default `version = "latest"`), this preflight would
          # silently pass. Counting catches the gap independent of
          # what the schema says.
          ENTRY_COUNT=$(awk '
            /^traefik_plugins[[:space:]]*=[[:space:]]*\{/ { in_block = 1; next }
            in_block && /^\}/ { in_block = 0; next }
            in_block && /^  "[^"]+"[[:space:]]*=[[:space:]]*\{/ { c++ }
            END { print c + 0 }
          ' "$TFVARS")
          VERSION_COUNT=$(awk '
            /^traefik_plugins[[:space:]]*=[[:space:]]*\{/ { in_block = 1; next }
            in_block && /^\}/ { in_block = 0; next }
            in_block && /^    version[[:space:]]*=/ { c++ }
            END { print c + 0 }
          ' "$TFVARS")
          PREFLIGHT_FAILED=0
          if [ -n "$NON_LATEST" ]; then
            echo "::error::traefik_plugins[*].version in $TFVARS includes non-\"latest\" pins. This job uploads to s3://.../traefik/<plugin>/latest/, but AC user_data downloads from traefik/<plugin>/<version>/. Non-latest pins make latest/ uploads no-ops. Found:"
            while IFS= read -r line; do
              echo "  $line"
            done <<<"$NON_LATEST"
            PREFLIGHT_FAILED=1
          fi
          if [ -n "$MISSING_FROM_SPARSE" ]; then
            echo "::error::tfvars traefik_plugins entries missing from TRAEFIK_PLUGIN_SPARSE_PATHS. AC user_data would 404 trying to download these. Add them to the env at the top of this job:"
            while IFS= read -r line; do
              echo "  - plugins-local/src/$line"
            done <<<"$MISSING_FROM_SPARSE"
            PREFLIGHT_FAILED=1
          fi
          if [ "$ENTRY_COUNT" -ne "$VERSION_COUNT" ]; then
            echo "::error::traefik_plugins has $ENTRY_COUNT entries but only $VERSION_COUNT version= keys at entry-level indent. Every entry must declare version (today fenced by terraform's schema; this preflight is defense-in-depth against schema loosening)."
            PREFLIGHT_FAILED=1
          fi
          if [ "$PREFLIGHT_FAILED" -eq 1 ]; then
            exit 1
          fi
          echo "Preflight OK: all traefik_plugins versions pin to \"latest\"; tfvars keys all covered by TRAEFIK_PLUGIN_SPARSE_PATHS."

      # Surface a missing OR invalid secret as an actionable preflight
      # error rather than as an inscrutable `actions/checkout` 401/404.
      # Probes a `git/refs/heads/main` endpoint specifically — that one
      # requires the same Contents:Read permission `actions/checkout`
      # needs, so a Metadata-only PAT (a common scope-level
      # misconfiguration) is caught HERE rather than at checkout.
      # The PAT-vs-App migration in #1765 will retire this once the
      # App's auto-renewing tokens replace the human-issued PAT.
      - name: Verify TRAEFIK_PLUGINS_READ_TOKEN is set and valid
        env:
          GH_TOKEN: ${{ secrets.TRAEFIK_PLUGINS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TRAEFIK_PLUGINS_READ_TOKEN secret is not set on layervai/nhp. Set a fine-grained PAT with Contents:Read on layervai/traefik-plugins as that secret name. See terraform/CLAUDE.md 'AC Plugin Source-of-Truth Invariant' for the full setup contract."
            exit 1
          fi
          # Suppress the response body (we don't care about the SHA);
          # let stderr through so an operator can distinguish 401 from
          # 403 from 404 at preflight rather than guessing from
          # `actions/checkout`'s less-specific error. GitHub Actions
          # masks `secrets.*` values in workflow logs automatically,
          # so the token can't leak via gh's stderr.
          # Retry briefly on transient github.com 5xx so a single API
          # blip doesn't fail an in-flight prod promote with TF already
          # applied. AWS_RETRY_MODE handles the same class for the s3
          # sync side; gh api needs its own loop.
          ATTEMPTS=3
          for i in $(seq 1 $ATTEMPTS); do
            # `timeout 30s` so a hanging-but-not-erroring github.com
            # call can't occupy the whole job's timeout-minutes — the
            # retry loop only does its job if individual attempts fail
            # within a bounded window. Capture the exit code so the
            # final error message can distinguish 124 (timeout) from
            # gh's own auth/scope failures (1, 4) — the operator
            # remediation differs (wait-out-outage vs reissue-PAT).
            #
            # `|| last_rc=$?` is load-bearing: `set -e` is NOT
            # suppressed in `for` loop bodies (only in if/while/until
            # tests, ||/&& chains except final, and pipelines). A bare
            # `timeout 30s gh api ...; last_rc=$?` would exit the
            # script on the first failure and never iterate — exactly
            # the regression this loop exists to prevent. Belt-and-
            # suspenders: prepend `GH_DEBUG=` so a future gh release
            # turning on debug output by default can't leak auth
            # headers via stderr.
            last_rc=0
            # Clear all known gh debug-output env vars (GH_DEBUG / DEBUG /
            # GH_TRACE) so a future gh release defaulting any of them on
            # — or a future workflow refactor that exports one at job
            # level — can't surface auth headers via stderr.
            GH_DEBUG='' DEBUG='' GH_TRACE='' timeout 30s gh api repos/layervai/traefik-plugins/git/refs/heads/main --jq '.ref' >/dev/null || last_rc=$?
            if [ "$last_rc" -eq 0 ]; then
              break
            fi
            if [ "$i" -eq "$ATTEMPTS" ]; then
              if [ "$last_rc" -eq 124 ]; then
                echo "::error::TRAEFIK_PLUGINS_READ_TOKEN probe TIMED OUT (exit 124) after $ATTEMPTS attempts. github.com is likely having a sustained outage; wait it out and re-dispatch the promote. If timeouts continue past a status.github.com all-clear, escalate to the runbook for cross-repo PAT issues."
              else
                echo "::error::TRAEFIK_PLUGINS_READ_TOKEN cannot read layervai/traefik-plugins contents (exit $last_rc) after $ATTEMPTS attempts. The secret is set but invalid (expired, revoked, missing Contents:Read scope, wrong repo selection). See gh's error above for the specific HTTP status. Issue a new fine-grained PAT with Contents:Read on layervai/traefik-plugins; see terraform/CLAUDE.md 'AC Plugin Source-of-Truth Invariant' for the setup contract and follow-up #1765 (App-token migration)."
              fi
              exit 1
            fi
            echo "gh api probe attempt $i/$ATTEMPTS failed (exit $last_rc), retrying in 5s..."
            sleep 5
          done

          # The PAT is referenced step-scoped here (env: GH_TOKEN) and
          # again in the next step's `with: token:` parameter — not in
          # job-scoped env. Do NOT insert third-party actions between
          # this step and `Checkout traefik-plugins`, NOR between
          # `Checkout traefik-plugins` and `Configure AWS credentials`:
          # anything in between would still run on the same runner
          # with both the cross-repo PAT and the prod AWS creds
          # resolvable from the calling workflow context. The current
          # sequence (verify → checkout → SHA → AWS-creds) is the
          # minimum surface.

      # Cross-repo checkout. Uses TRAEFIK_PLUGINS_READ_TOKEN (a fine-grained
      # PAT scoped to layervai/traefik-plugins Contents:Read). Migration to
      # the qurl-deploy-dispatcher GitHub App for owner-rotation durability
      # is tracked in #1765.
      - name: Checkout traefik-plugins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: layervai/traefik-plugins
          ref: main
          token: ${{ secrets.TRAEFIK_PLUGINS_READ_TOKEN }}
          path: ${{ env.PLUGIN_REPO_PATH }}
          sparse-checkout: ${{ env.TRAEFIK_PLUGIN_SPARSE_PATHS }}
          sparse-checkout-cone-mode: false
          # The only downstream git use is `rev-parse HEAD` (a local
          # operation). Don't keep the PAT in .git/config — limits the
          # window where a hypothetical compromised step would have both
          # the cross-repo PAT and prod AWS creds in reach.
          persist-credentials: false

      - name: Capture plugin SHA
        id: sha
        run: |
          set -euo pipefail
          # Assign-then-write rather than `echo "sha=$(git rev-parse HEAD)" >>
          # $GITHUB_OUTPUT`: the latter pattern is silent on a rev-parse
          # failure because bash doesn't propagate a command-substitution
          # failure when its output is consumed by another command. Under
          # `set -e`, the assignment form exits on failure correctly.
          # `rev-parse HEAD` is purely local — no network. If a future
          # change ever inserts a `git fetch` (or any remote git op)
          # between the cross-repo checkout and this step, it WILL fail
          # because `persist-credentials: false` already dropped the
          # PAT from .git/config. Either re-introduce the token or
          # capture the SHA directly via actions/checkout's output.
          SHA=$(git -C "$PLUGIN_REPO_PATH" rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload plugins to S3
        env:
          PLUGIN_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # Iterate over TRAEFIK_PLUGIN_SPARSE_PATHS (the same list that
          # drives sparse-checkout above). The directory-existence check
          # catches rename/remove drift in traefik-plugins; the
          # tfvars→here drift is currently unguarded (tracked in #1750).
          # `--exclude` patterns hoisted to a single array so the SHA-keyed
          # and latest/ syncs cannot drift from each other. Mirrors the
          # source-of-truth list in upstream traefik-plugins/.github/
          # workflows/deploy.yml @ 962c830 — see #1773 for the cross-repo
          # parity lint that would catch upstream drift structurally.
          excludes=(
            --exclude "*.tar.gz"
            --exclude "__pycache__/*"
            --exclude "*.pyc"
            --exclude "coverage.out"
          )

          # Empty-list guard: a future YAML refactor that misformats the
          # block scalar would leave the env empty, the loop would no-op,
          # the job would report green, and AC would cycle with no plugin
          # update. Fail loud instead.
          if [ -z "${TRAEFIK_PLUGIN_SPARSE_PATHS//[[:space:]]/}" ]; then
            # An empty traefik_plugins map in tfvars is a valid state
            # (preflight passes) — but if you reach here with an empty
            # SPARSE_PATHS, you've lost the upstream→downstream
            # symmetry: tfvars may still expect plugins that this
            # workflow won't upload. Drop the whole deploy-traefik-
            # plugins job (and its gate clauses on deploy-ac /
            # deploy-qurl) rather than running an empty upload loop.
            echo "::error::TRAEFIK_PLUGIN_SPARSE_PATHS is empty. If the prod tfvars traefik_plugins map is also empty, remove this whole job and the deploy-traefik-plugins references from the deploy-ac / deploy-qurl gates. Otherwise, refill the env to mirror tfvars."
            exit 1
          fi
          while IFS= read -r SPARSE_PATH; do
            # Skip the trailing empty "line" the YAML `|` block scalar
            # leaves at the end (would otherwise hard-fail the prefix
            # guard below on a benign trailing newline).
            if [[ -z "$SPARSE_PATH" ]]; then
              continue
            fi
            # Validate the prefix BEFORE stripping it. If a future edit
            # lands an entry that doesn't start with `plugins-local/src/`
            # (typo or repo restructure), the strip below would no-op and
            # the upload would land at an S3 key AC user_data never reads
            # — exactly the silent-drift class this job closes.
            if [[ "$SPARSE_PATH" != plugins-local/src/* ]]; then
              echo "::error::TRAEFIK_PLUGIN_SPARSE_PATHS entry $SPARSE_PATH does not start with plugins-local/src/. AC user_data assumes that prefix; uploading without it puts plugins at an S3 key AC will never read."
              exit 1
            fi
            # Path-traversal reject. The vectors are: literal `..`,
            # leading `../`, middle `/../`, and trailing `/..`. A
            # `..` substring inside a directory name (e.g.,
            # `foo..bar`) is NOT a traversal and shouldn't false-
            # positive. The four glob shapes below cover the
            # traversal vectors precisely. Note the bare-`..` and
            # `../*` cases are belt-and-suspenders: the prefix check
            # immediately above already rejects anything that doesn't
            # start with `plugins-local/src/`, so neither can reach
            # this check. Kept anyway so the reject set reads as a
            # complete traversal-classification rather than relying
            # on the prefix check to do half the work implicitly.
            if [[ "$SPARSE_PATH" == ".." \
                || "$SPARSE_PATH" == ../* \
                || "$SPARSE_PATH" == */../* \
                || "$SPARSE_PATH" == */.. ]]; then
              echo "::error::TRAEFIK_PLUGIN_SPARSE_PATHS entry $SPARSE_PATH contains a '..' path-traversal segment — uploading would resolve outside plugins-local/src/."
              exit 1
            fi
            # SPARSE_PATH is `plugins-local/src/<plugin>`; strip the prefix
            # to get the S3-side plugin key.
            PLUGIN_PATH="${SPARSE_PATH#plugins-local/src/}"
            PLUGIN_DIR="$PLUGIN_REPO_PATH/$SPARSE_PATH"
            if [ ! -d "$PLUGIN_DIR" ]; then
              echo "::error::Plugin directory $PLUGIN_DIR not found in traefik-plugins repo. If a plugin was renamed/removed there, update TRAEFIK_PLUGIN_SPARSE_PATHS AND prod tfvars traefik_plugins map together."
              exit 1
            fi
            # Empty-directory guard. A real-but-empty plugin dir would
            # let `aws s3 sync` 0-file-sync to success, producing a
            # green job that uploaded nothing (silent-no-op). Same
            # failure shape as an empty TRAEFIK_PLUGIN_SPARSE_PATHS,
            # different root cause. Doesn't catch a directory with
            # only marker files (`.gitkeep` etc.) — those would still
            # sync, AC would still 404 on the missing real plugin
            # files. Treat as belt-and-suspenders for "no files at
            # all" rather than full content validation.
            # `find -mindepth 1 -print -quit` over `ls -A` so an
            # unreadable-but-existing dir (theoretical given the
            # checkout just succeeded into a runner-owned workspace,
            # but cheap defense) doesn't false-pass an empty result
            # the same way `ls`'s would.
            if [ -z "$(find "$PLUGIN_DIR" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
              echo "::error::Plugin directory $PLUGIN_DIR exists but contains zero files. The sparse-checkout pattern matched but the upstream plugin has no files at all — refusing to upload nothing."
              exit 1
            fi
            # Belt-and-suspenders: assert no .git inside the synced
            # subtree. actions/checkout writes .git at repo root today,
            # so this never trips — but a future actions/checkout
            # behavior change or workflow refactor that landed .git
            # inside the synced path would silently upload a 4MB+
            # plugin-bucket bloat. Cheap, name-anchored guard.
            if [ -d "$PLUGIN_DIR/.git" ]; then
              echo "::error::Plugin directory $PLUGIN_DIR contains a .git subdirectory. actions/checkout's sparse-mode normally writes .git at the repo root only; if it landed inside the synced subtree, the s3 sync would upload it. Investigate the checkout shape before re-running."
              exit 1
            fi

            # The SHA-keyed prefix is an immutable forensic archive: AC
            # user_data downloads from latest/ (asserted by the
            # version-pin preflight above), not from <SHA>/. Keeping
            # both lets an oncall trace "what plugin SHA shipped on
            # date X" by listing the SHA prefixes (e.g., for an
            # incident that emerges weeks after a regression landed).
            # `.git/*` is intentionally not in the exclude list:
            # `actions/checkout` writes `.git` at the repo root, NOT
            # inside `plugins-local/src/`, so it can't match anything
            # in the synced subtree (and the empty-dir guard above
            # also asserts no .git inside this path).
            echo "[plugin-upload] $PLUGIN_PATH -> s3://$PLUGIN_BUCKET/traefik/$PLUGIN_PATH/$PLUGIN_SHA/"
            aws s3 sync "$PLUGIN_DIR" "s3://$PLUGIN_BUCKET/traefik/$PLUGIN_PATH/$PLUGIN_SHA/" "${excludes[@]}"

            # `--delete` on the latest/ sync so a removed file in
            # traefik-plugins doesn't linger and re-appear on AC boot.
            # Safe during the SCHEDULED promote: deploy-ac depends on
            # this job's success, so no scheduled AC instance is
            # booting from latest/ during the sync.
            # Residual race windows (both tracked, narrow, accepted):
            #   - Manual traefik-plugins/deploy.yml workflow_dispatch
            #     could race the same prefix. → #1767.
            #   - An UNSCHEDULED ASG event (spot interrupt, scale-out)
            #     could land an AC pulling from latest/ during the
            #     few seconds aws s3 sync --delete is running. The
            #     atomic-via-staging fix tracked in #1752 closes this
            #     window.
            echo "[plugin-upload] $PLUGIN_PATH -> s3://$PLUGIN_BUCKET/traefik/$PLUGIN_PATH/latest/"
            aws s3 sync "$PLUGIN_DIR" "s3://$PLUGIN_BUCKET/traefik/$PLUGIN_PATH/latest/" --delete "${excludes[@]}"
          done <<< "$TRAEFIK_PLUGIN_SPARSE_PATHS"

      - name: Plugin deploy summary
        env:
          PLUGIN_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          # Strip the trailing newline left by the YAML `|` block scalar
          # before the comma-substitution; otherwise the rendered cell
          # ends with an empty backtick pair (`` `, ` ``).
          PATHS_CSV="${TRAEFIK_PLUGIN_SPARSE_PATHS%$'\n'}"
          PATHS_CSV="${PATHS_CSV//$'\n'/\`, \`}"
          {
            echo "## Deploy Traefik Plugins"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Source | layervai/traefik-plugins @ \`main\` (\`${PLUGIN_SHA:0:8}\`) |"
            echo "| Target | prod (\`s3://$PLUGIN_BUCKET/traefik/\`) |"
            echo "| Plugins | \`$PATHS_CSV\` |"
            echo "| Effect | AC canary instances boot with these plugins |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # DEPLOY AC - Via canary (Step Functions) with first-deploy fallback
  # =============================================================================
  deploy-ac:
    name: Deploy Access Controller
    needs: [manifest, preflight, terraform-plan, terraform-apply, deploy-traefik-plugins]
    # Same terraform-apply rule as deploy-server (issue #1322). The
    # The deploy-traefik-plugins clause closes the silent-drift gap
    # SPECIFICALLY for the canary AC cycle initiated by THIS promote.
    # Unscheduled AC boots (spot interrupt, scale-out) after a
    # `deploy_ac=false` promote can still land on stale plugins; that
    # gap is the manual `traefik-plugins/deploy.yml` workflow_dispatch's
    # responsibility, kept as the operator escape hatch.
    # Asserted by tests/scripts/test_promote_to_prod_gating.py. The
    # floor in _assert_image_deploys is `>= 3` (not `== 3`), so adding
    # a 4th/5th deploy-* job auto-passes — only structural REMOVAL
    # of an existing job needs a paired ratchet bump. A new deploy-*
    # job DOES still need to inherit the gate shape that
    # APPLY_SUCCESS_RE / APPLY_SKIPPED_RE match.
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (
        (inputs.run_terraform && needs.terraform-apply.result == 'success') ||
        (!inputs.run_terraform && needs.terraform-apply.result == 'skipped')
      ) &&
      needs.deploy-traefik-plugins.result == 'success' &&
      inputs.deploy_ac
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
      CELL_ID: ${{ inputs.cell_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The immediate mark intentionally overlaps with the parent canary poller
      # and child canary workflow heartbeats so dispatch gaps stay covered.
      - name: Mark Deployment Window
        uses: ./.github/actions/mark-deployment-window
        with:
          environment: prod
          cell_id: ${{ inputs.cell_id }}
          component: ac
          strategy: promote

      - name: Deploy AC
        id: deploy-ac-step
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_WINDOW_ENVIRONMENT: prod
          DEPLOYMENT_WINDOW_CELL_ID: ${{ inputs.cell_id }}
          DEPLOYMENT_WINDOW_COMPONENT: ac
          DEPLOYMENT_WINDOW_STRATEGY: promote-ac
          DEPLOYMENT_WINDOW_EMIT_INTERVAL_SECONDS: '60'
        run: |
          echo "--- Deploying Access Controller ---"
          START_TIME=$(date +%s)

          # Stream startup logs to the console in the background
          # AC log group has no cell_id: /layerv/nhp/{env}/ac (unlike server which includes cell)
          ./.github/scripts/tail-deploy-logs.sh ac prod &
          LOG_TAIL_PID=$!

          DEPLOY_EXIT=0
          STATE_MACHINE_ARN=$(aws ssm get-parameter \
            --name "/prod/nhp/${CELL_ID}/canary/ac/state-machine-arn" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [[ -n "$STATE_MACHINE_ARN" && "$STATE_MACHINE_ARN" != "initial" ]]; then
            echo "deploy_method=canary" >> "$GITHUB_OUTPUT"
            ./.github/scripts/dispatch-and-poll-canary.sh ac "$IMAGE_TAG" prod "$CELL_ID" || DEPLOY_EXIT=$?
          else
            echo "deploy_method=direct" >> "$GITHUB_OUTPUT"
            echo "::notice::No canary state machine — using direct SSM + instance refresh (first deploy)"
            ./.github/scripts/update-ssm-image-tag.sh prod ac "$IMAGE_TAG" --refresh || DEPLOY_EXIT=$?
          fi

          # Stop log tailing and propagate the deploy exit code
          kill "$LOG_TAIL_PID" 2>/dev/null || true
          wait "$LOG_TAIL_PID" 2>/dev/null || true

          DURATION=$(( $(date +%s) - START_TIME ))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          exit "$DEPLOY_EXIT"

      - name: AC deploy summary
        if: always() && steps.deploy-ac-step.outcome != 'skipped'
        env:
          DEPLOY_METHOD: ${{ steps.deploy-ac-step.outputs.deploy_method }}
          RUN_URL: ${{ steps.deploy-ac-step.outputs.run_url }}
          DURATION: ${{ steps.deploy-ac-step.outputs.duration }}
          RESULT: ${{ steps.deploy-ac-step.outcome }}
        run: |
          {
            echo "## Deploy AC"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Component | Access Controller |"
            echo "| Method | ${DEPLOY_METHOD:-unknown} |"
            echo "| Image | \`$IMAGE_TAG\` |"
            echo "| Duration | ${DURATION:-unknown} |"
            echo "| Result | **$RESULT** |"
            if [[ -n "$RUN_URL" ]]; then
              echo "| Canary Run | [View]($RUN_URL) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # DEPLOY QURL - ECS task definition re-registration
  # =============================================================================
  # Sandbox counterpart: deploy-sandbox-qurl in build-and-push.yml (#1634).
  # The two roll paths intentionally differ — prod takes the image tag from
  # needs.manifest.outputs.qurl_image_tag and always rolls on an operator-driven
  # promotion; sandbox sources the tag from the /<prefix>/qurl-api-image-tag SSM
  # param and adds a running-vs-latest idempotency guard (it runs on every push
  # to main). Both reuse deploy-ecs-service.sh, so a change to the shared
  # deployer / ECS contract should prompt a look at the other path.
  # =============================================================================
  # QURL AGENT-KEY INVENTORY GATE (qurl-service#1237)
  # =============================================================================
  # Hard pre-deploy control for the agent-identity contract. Runs immediately
  # before deploy-qurl and blocks it on any blocker.
  #
  # Why this is a deploy gate and not a post-deploy check: the qurl image
  # enforces an immutable agent_id during API-key authentication, and the
  # qurl-agent-keys table is read by nhp-server on the UDP knock path. A
  # pre-contract row therefore breaks credentials or knocks the moment the new
  # image serves traffic, and an ordinary revoke cannot clear its issued-device
  # sentinel. qurl-service#1240 found four such rows in sandbox on 2026-07-14;
  # the rollout ledger has required a complete strongly consistent zero-blocker
  # inventory before every promotion ever since. This job makes that
  # mechanically unskippable instead of a manual attestation.
  #
  # The binary ships in the same image as qurl-api (qurl-service#1324), so the
  # gate enforces the exact validators the server about to run is compiled
  # with — no version skew between gate and gated.
  #
  # It is read-only: the promotion role is granted dynamodb:Scan on exactly the
  # two qurl agent-identity tables and nothing else (see the
  # DynamoDBQurlAgentKeyInventoryGate statement in
  # terraform/modules/ecr/main.tf). That grant is on the CI principal and does
  # NOT relax nhp-server's reader role, which remains Scan-free per
  # docs/design/QURL_AGENT_KEYS_SCHEMA.md.
  qurl-agent-key-inventory:
    name: QURL Agent-Key Inventory Gate
    needs: [manifest, preflight, terraform-plan, terraform-apply, deploy-server, deploy-traefik-plugins, deploy-ac]
    # Mirrors deploy-qurl's gate exactly: this check exists to guard that
    # deploy, so it must run in precisely the cases that deploy runs and be
    # skipped in the rest. If the two conditions ever drift, the gate becomes
    # skippable — keep them in lockstep.
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (
        (inputs.run_terraform && needs.terraform-apply.result == 'success') ||
        (!inputs.run_terraform && needs.terraform-apply.result == 'skipped')
      ) &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-traefik-plugins.result == 'success' || needs.deploy-traefik-plugins.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      inputs.deploy_qurl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Sandbox credentials first: the image lives in sandbox ECR. Prod
      # credentials are configured afterwards so the scan itself runs against
      # prod — order is load-bearing, the second configure-aws-credentials
      # replaces the first.
      - name: Configure AWS credentials (sandbox - ECR pull)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to sandbox ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Pull qurl-service image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
        run: |
          set -euo pipefail
          if [[ -z "$QURL_IMAGE_TAG" ]]; then
            echo "::error::deploy_qurl=true but the manifest produced no qurl_image_tag — cannot gate the deploy."
            exit 1
          fi
          IMAGE="$ECR_REGISTRY/$ECR_QURL_REPO:$QURL_IMAGE_TAG"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker pull "$IMAGE"

          # Runtime contract: --version must short-circuit before any AWS call.
          # Proving the binary is runnable here means a later non-zero exit is a
          # real verdict rather than a missing/broken binary. An image predating
          # qurl-service#1324 fails at this step with a clear cause.
          if ! SMOKE=$(docker run --rm --entrypoint /app/qurl-agent-key-inventory "$IMAGE" --version 2>&1); then
            echo "::group::qurl-agent-key-inventory --version output"
            echo "$SMOKE"
            echo "::endgroup::"
            echo "::error::qurl-agent-key-inventory is not runnable in image $IMAGE. The image likely predates qurl-service#1324, which added the binary. The inventory verdict below cannot be trusted until this passes."
            exit 1
          fi
          echo "qurl-agent-key-inventory smoke OK: $SMOKE"

      - name: Configure AWS credentials (prod - DynamoDB read)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run agent-key inventory against prod
        run: |
          set -euo pipefail
          echo "Scanning $PROD_QURL_TABLE_PREFIX-qurl-{api,agent}-keys in $PROD_ACCOUNT_ID..."
          set +e
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_REGION="$AWS_REGION" \
            --entrypoint /app/qurl-agent-key-inventory "$IMAGE" \
            --table-prefix "$PROD_QURL_TABLE_PREFIX" \
            --expect-account "$PROD_ACCOUNT_ID" \
            --json > agent-key-inventory.json
          EXIT=$?
          set -e

          # Evidence is emitted even on a non-zero exit (partial runs are
          # marked INCOMPLETE), so publish it before deciding.
          echo "::group::inventory evidence"
          cat agent-key-inventory.json || true
          echo "::endgroup::"

          case $EXIT in
            0)
              echo "::notice::Agent-key inventory PASS — zero pre-contract blockers in $PROD_QURL_TABLE_PREFIX."
              ;;
            1)
              echo "::error::Agent-key inventory found contract blockers in prod. Deploying now would break those credentials or fail-close their knocks, and an ordinary revoke cannot clear an issued-device sentinel. Remediate under an explicitly authorized, condition-fenced repair (see qurl-service#1240) and re-run this gate before promoting."
              exit 1
              ;;
            130)
              echo "::error::Agent-key inventory was cancelled. A partial inventory never gates a deploy — re-run."
              exit 1
              ;;
            *)
              echo "::error::Agent-key inventory could not complete (exit $EXIT): AWS error, decode error, incomplete pagination, or a caller identity that is not $PROD_ACCOUNT_ID. Refusing to advance the deploy on unproven evidence."
              exit 1
              ;;
          esac

      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qurl-agent-key-inventory-prod
          path: agent-key-inventory.json
          retention-days: 90
          if-no-files-found: warn

  deploy-relay:
    name: Deploy NHP-Relay
    # Mirrors the sandbox leg's ordering rationale: the private relay/server wire
    # uses a versioned request-ID return envelope, so the server blue/green must
    # converge before relay nodes roll. A new relay expecting RelayReturnMsg
    # while an old server still emits the former raw inner reply is the failure
    # this ordering prevents.
    needs: [manifest, preflight, terraform-plan, terraform-apply, deploy-server, deploy-traefik-plugins, deploy-ac]
    # Same terraform-apply and chained-deploy shape as deploy-qurl below: relay
    # ships only if every upstream image-deploy either succeeded or was
    # operator-skipped.
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (
        (inputs.run_terraform && needs.terraform-apply.result == 'success') ||
        (!inputs.run_terraform && needs.terraform-apply.result == 'skipped')
      ) &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-traefik-plugins.result == 'success' || needs.deploy-traefik-plugins.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      inputs.deploy_relay
    runs-on: ubuntu-latest
    environment: production
    # deploy-relay.sh starts the instance refresh and POLLS it to completion —
    # it is not fire-and-forget. The sandbox leg budgets 45 min for the same
    # script (observed healthy 3-instance roll ~8m15s, script caps the refresh
    # poll at 15 min); prod carries the same bound so the script can emit its own
    # terminal error rather than being cut off by the job timeout.
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prod-relay
      cancel-in-progress: false # Never cancel an in-flight relay roll.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # app_changed is "true" here, which the script's contract explicitly
      # permits when "the caller has already verified the tag exists in ECR" —
      # preflight's ECR replication gate does exactly that for ECR_RELAY_REPO,
      # added in this change (it previously covered only server/ac/qurl/qrts, so
      # the relay tag was unverified). Passing false would refresh the fleet
      # without advancing the SSM tag, which is the wrong half of the deploy.
      #
      # The helper no-ops cleanly while the relay is dark (deploy_relay=false in
      # tfvars -> asg-name param absent -> ParameterNotFound -> skip), so this
      # job is safe to leave enabled across the activation boundary.
      - name: Deploy relay (SSM image-tag + ASG instance refresh)
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
        run: ./.github/scripts/deploy-relay.sh prod true "$IMAGE_TAG"

  deploy-qurl:
    name: Deploy QURL Service
    needs: [manifest, preflight, terraform-plan, terraform-apply, deploy-server, deploy-traefik-plugins, deploy-ac, qurl-agent-key-inventory]
    # Same terraform-apply rule as deploy-server (issue #1322). The
    # deploy-server / deploy-traefik-plugins / deploy-ac clauses
    # preserve the chained-deploy contract: QURL ships only if every
    # upstream image-deploy either succeeded or was operator-skipped.
    # Asserted by tests/scripts/test_promote_to_prod_gating.py — the
    # floor in _assert_image_deploys is `>= 3`, so additions auto-pass;
    # only structural removal needs a ratchet bump.
    #
    # The deploy-traefik-plugins clause is what keeps QURL from
    # shipping into a partial-deploy state when plugins fail — without
    # it, plugins-fail → AC-skipped → QURL-proceeds (because
    # AC.result='skipped' satisfies the AC clause), which silently
    # diverges from the operator-driven `deploy_ac=false,
    # deploy_qurl=true` workflow shape: in that case the operator
    # explicitly chose to skip AC; here the system did. Keep the
    # behavior implicit-but-symmetric with deploy-server's clause
    # rather than implicit-and-asymmetric.
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (
        (inputs.run_terraform && needs.terraform-apply.result == 'success') ||
        (!inputs.run_terraform && needs.terraform-apply.result == 'skipped')
      ) &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-traefik-plugins.result == 'success' || needs.deploy-traefik-plugins.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      needs.qurl-agent-key-inventory.result == 'success' &&
      inputs.deploy_qurl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy QURL via ECS task def
        id: deploy-qurl-step
        env:
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
        run: |
          if [[ -z "$QURL_IMAGE_TAG" ]]; then
            echo "::error::QURL_IMAGE_TAG is empty, cannot deploy"
            exit 1
          fi
          START_TIME=$(date +%s)
          ./.github/scripts/deploy-ecs-service.sh "$PROD_SSM_PREFIX" "$QURL_IMAGE_TAG"
          DURATION=$(( $(date +%s) - START_TIME ))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"

      - name: QURL deploy summary
        if: always() && steps.deploy-qurl-step.outcome != 'skipped'
        env:
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
          DURATION: ${{ steps.deploy-qurl-step.outputs.duration }}
          RESULT: ${{ steps.deploy-qurl-step.outcome }}
        run: |
          {
            echo "## Deploy QURL"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Component | QURL Service |"
            echo "| Method | ECS task definition |"
            echo "| Image | \`$ECR_QURL_REPO:$QURL_IMAGE_TAG\` |"
            echo "| Duration | ${DURATION:-unknown} |"
            echo "| Result | **$RESULT** |"
            echo "| Rollback | ECS circuit breaker (automatic) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # DEPLOY QRTS - qurl-reverse-tunnel-server image (via update-ssm-image-tag.sh)
  # =============================================================================
  # Deploys the qurl-reverse-tunnel-server (qrts) image in the SAME prod
  # promotion as server/ac/qurl, instead of a separate qurl-reverse-tunnel-
  # server-repo workflow — making qrts consistent with how nhp owns the
  # server/ac/qurl deploys. qrts runs on an EC2 ASG that terraform creates
  # (deploy_frps tfvars); user_data reads /prod/nhp/reverse-tunnel-server/
  # image-tag at boot. This job routes through the deployer-family helper
  # update-ssm-image-tag.sh (ECR verify -> SSM put -> cancel + start + wait
  # instance-refresh) — the same helper deploy-server/deploy-ac use and the only
  # allowlisted writer of the image-tag slot. Gated after terraform-apply (the
  # ASG + asg-name SSM param must exist first).
  #
  # NOTE: the qurl-reverse-tunnel-server repo's own promote-production.yml writes
  # the same SSM param + instance-refresh, so two prod deploy paths exist today.
  # It should be deprecated now that nhp owns the prod deploy — tracked in #2242.
  #
  # Sequencing: deploy-qrts chains AFTER the core control plane
  # (server -> traefik-plugins -> ac -> qurl) and gates on their
  # `success || skipped` results, mirroring deploy-qurl. The tunnel fleet
  # validates knock tokens against nhp-server and routes protected traffic
  # through the AC (Traefik plugins included), so it must not roll onto a
  # half-updated control plane — a FAILED core deploy skips qrts (#2298).
  # Smoke stays decoupled from qrts (PR #2241): qrts and the smoke suites are
  # siblings off deploy-qurl, so a qrts failure cannot skip smoke. Full gate
  # rationale on the job's `if:` below; manifest/preflight/terraform-plan in
  # `needs` are the standard pipeline-shape deps (terraform-apply already
  # transitively depends on terraform-plan).
  deploy-qrts:
    name: Deploy qurl-reverse-tunnel-server (qrts)
    needs: [manifest, preflight, terraform-plan, terraform-apply, deploy-server, deploy-traefik-plugins, deploy-ac, deploy-qurl]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (
        (inputs.run_terraform && needs.terraform-apply.result == 'success') ||
        (!inputs.run_terraform && needs.terraform-apply.result == 'skipped')
      ) &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-traefik-plugins.result == 'success' || needs.deploy-traefik-plugins.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      (needs.deploy-qurl.result == 'success' || needs.deploy-qurl.result == 'skipped') &&
      inputs.deploy_qrts
    runs-on: ubuntu-latest
    # 30 min floor for the fixed 3/3/3 ASG: cancel-existing + start + wait the
    # instance refresh, which rolls each of the 3 instances with a 180s warmup
    # (~9 min of warmup alone) plus refresh/poll overhead. Sized with headroom
    # above the wait-loop ceiling, not against a scaling fleet.
    timeout-minutes: 30
    env:
      # Legacy frps_* manifest output name (pre-qrts-rename); consumed here under
      # the QRTS_IMAGE_TAG env so the rest of the job uses current terminology.
      QRTS_IMAGE_TAG: ${{ needs.manifest.outputs.frps_image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy qrts (SSM image-tag + ASG instance-refresh)
        id: deploy-qrts-step
        run: |
          set -euo pipefail
          if [[ -z "$QRTS_IMAGE_TAG" || "$QRTS_IMAGE_TAG" =~ ^v0\.0\.0-bootstrap ]]; then
            echo "::error::qrts image tag unresolved ('${QRTS_IMAGE_TAG:-empty}') — provide frps_image_tag or ensure sandbox SSM holds a real tag."
            exit 1
          fi
          START_TIME=$(date +%s)
          # Route through the deployer-family helper (ECR verify -> SSM put ->
          # cancel-existing + start + wait instance-refresh). Same path
          # deploy-server/deploy-ac use, and required by the image-tag writer
          # allowlist (scripts/check-image-tag-writer-allowlist.sh) — the
          # workflow must not write /prod/nhp/<component>/image-tag directly.
          DEPLOY_EXIT=0
          ./.github/scripts/update-ssm-image-tag.sh prod reverse-tunnel-server "$QRTS_IMAGE_TAG" --refresh || DEPLOY_EXIT=$?
          echo "duration=$(( $(date +%s) - START_TIME ))s" >> "$GITHUB_OUTPUT"
          exit "$DEPLOY_EXIT"

      # Guarded on outcome != 'skipped' (mirrors deploy-ac/deploy-qurl): if an
      # earlier step in this job fails (e.g. Configure AWS credentials), Actions
      # auto-skips the deploy step, and a bare always() summary would otherwise
      # print the *intended* tag as though it deployed. The Result/Duration rows
      # report what actually happened, not just what was requested.
      - name: qrts deploy summary
        if: always() && steps.deploy-qrts-step.outcome != 'skipped'
        env:
          RESULT: ${{ steps.deploy-qrts-step.outcome }}
          DURATION: ${{ steps.deploy-qrts-step.outputs.duration }}
          # Single source of truth: the SSM slot path is emitted by the deploy
          # step's update-ssm-image-tag.sh (which derives it from env/component
          # and is the actual writer), not re-declared as a workflow literal.
          SSM_IMAGE_TAG_PARAM: ${{ steps.deploy-qrts-step.outputs.ssm_image_tag_param }}
        run: |
          {
            echo "## Deploy qurl-reverse-tunnel-server (qrts)"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Result | \`${RESULT:-unknown}\` |"
            # ${QRTS_IMAGE_TAG:-unresolved}: the summary also runs on a FAILED
            # deploy (outcome != skipped), and the bootstrap-placeholder fence can
            # fail the step before the tag is validated — so an empty tag reads
            # "unresolved" rather than a misleading bare "repo:" with no tag.
            echo "| Image | \`$ECR_QRTS_REPO:${QRTS_IMAGE_TAG:-unresolved}\` |"
            echo "| Method | SSM image-tag + ASG instance-refresh |"
            echo "| SSM param | \`${SSM_IMAGE_TAG_PARAM:-/prod/nhp/reverse-tunnel-server/image-tag}\` |"
            echo "| Duration | \`${DURATION:-n/a}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # SMOKE TEST - Application-level validation
  # =============================================================================
  # The control-plane smoke jobs stay decoupled from deploy-qrts — deploy-qrts
  # is neither in their `needs` nor their gate. The nhp/qurl smoke suites don't
  # exercise qrts, so a qrts failure must NOT skip them; otherwise we'd lose the
  # "did server/ac/qurl deploy cleanly?" signal that scopes a rollback. QRtS has
  # its own post-deploy smoke job below, gated only on deploy-qrts success.
  smoke-test:
    name: Smoke Test
    needs: [manifest, preflight, deploy-server, deploy-traefik-plugins, deploy-ac, deploy-relay, deploy-qurl]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-traefik-plugins.result == 'success' || needs.deploy-traefik-plugins.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      (needs.deploy-relay.result == 'success' || needs.deploy-relay.result == 'skipped') &&
      (needs.deploy-qurl.result == 'success' || needs.deploy-qurl.result == 'skipped') &&
      (needs.deploy-server.result == 'success' || needs.deploy-ac.result == 'success' || needs.deploy-relay.result == 'success' || needs.deploy-qurl.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Infrastructure validation
        run: ./scripts/validate-deployment.sh prod

      - name: QURL health checks
        id: qurl-health
        if: needs.deploy-qurl.result == 'success'
        run: |
          echo "Running QURL health checks..."
          RETRIES=3
          RETRY_DELAY=10
          RESULTS=""

          for endpoint in "health/live" "health/ready"; do
            URL="https://api.layerv.ai/${endpoint}"
            echo "  Checking $URL..."
            SUCCESS=false
            FINAL_STATUS="000"
            for i in $(seq 1 $RETRIES); do
              HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
              FINAL_STATUS="$HTTP_STATUS"
              if [[ "$HTTP_STATUS" == "200" ]]; then
                echo "    $endpoint: OK (200)"
                SUCCESS=true
                break
              fi
              echo "    Attempt $i/$RETRIES: HTTP $HTTP_STATUS, retrying in ${RETRY_DELAY}s..."
              sleep "$RETRY_DELAY"
            done
            if [[ "$SUCCESS" == "true" ]]; then
              RESULTS="${RESULTS}| \`${endpoint}\` | $FINAL_STATUS | :white_check_mark: |"$'\n'
            else
              RESULTS="${RESULTS}| \`${endpoint}\` | $FINAL_STATUS | :x: |"$'\n'
              echo "::error::QURL health check failed: $URL (last status: $HTTP_STATUS)"
              # Write summary before exiting on failure
              {
                echo "## Smoke Test — QURL Health"
                echo ""
                echo "| Endpoint | HTTP Status | Result |"
                echo "|----------|-------------|--------|"
                echo "$RESULTS"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "All QURL health checks passed."

          {
            echo "## Smoke Test — QURL Health"
            echo ""
            echo "| Endpoint | HTTP Status | Result |"
            echo "|----------|-------------|--------|"
            echo "$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # QURL SMOKE TESTS - Comprehensive Go test suite from qurl repo
  # =============================================================================
  qurl-smoke-tests:
    name: QURL Smoke Tests
    needs: [manifest, preflight, deploy-server, deploy-traefik-plugins, deploy-ac, deploy-relay, deploy-qurl]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-traefik-plugins.result == 'success' || needs.deploy-traefik-plugins.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      (needs.deploy-relay.result == 'success' || needs.deploy-relay.result == 'skipped') &&
      (needs.deploy-qurl.result == 'success' || needs.deploy-qurl.result == 'skipped') &&
      (needs.deploy-server.result == 'success' || needs.deploy-ac.result == 'success' || needs.deploy-relay.result == 'success' || needs.deploy-qurl.result == 'success')
    uses: layervai/qurl-service/.github/workflows/smoke-tests.yml@eafec9fe74f298e4ffee28411866d0432c6f5676 # main as of 2026-04-24
    with:
      environment: prod
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}
      REPO_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
      AUTH0_SMOKE_TEST_CLIENT_ID: ${{ secrets.AUTH0_SMOKE_TEST_CLIENT_ID }}
      AUTH0_SMOKE_TEST_CLIENT_SECRET: ${{ secrets.AUTH0_SMOKE_TEST_CLIENT_SECRET }}

  # =============================================================================
  # NHP SMOKE TESTS - Tier 1 regression guards against deployed prod
  #
  # Runs the nhp/tests/smoke suite against the freshly-deployed prod
  # environment. Sibling of qurl-smoke-tests.
  #
  # Rollout posture (matches build-and-push.yml nhp-smoke-sandbox):
  #   PR1: tier=tier1,       allow_ssm_probes=false (30d SSM burn-in)
  #   PR2: tier=tier1+tier2, allow_ssm_probes=false
  #   PR3: tier=all,         allow_ssm_probes=false (required check)
  #
  # After 30 days of green sandbox runs, smoke-burn-in-unlock.yml
  # auto-opens a PR flipping allow_ssm_probes to true for prod.
  # =============================================================================
  nhp-smoke-tests:
    name: NHP Smoke Tests
    needs: [manifest, preflight, deploy-server, deploy-traefik-plugins, deploy-ac, deploy-relay, deploy-qurl]
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped') &&
      (needs.deploy-traefik-plugins.result == 'success' || needs.deploy-traefik-plugins.result == 'skipped') &&
      (needs.deploy-ac.result == 'success' || needs.deploy-ac.result == 'skipped') &&
      (needs.deploy-relay.result == 'success' || needs.deploy-relay.result == 'skipped') &&
      (needs.deploy-qurl.result == 'success' || needs.deploy-qurl.result == 'skipped') &&
      (needs.deploy-server.result == 'success' || needs.deploy-ac.result == 'success' || needs.deploy-relay.result == 'success' || needs.deploy-qurl.result == 'success')
    uses: ./.github/workflows/nhp-smoke-tests.yml
    with:
      environment: prod
      # Tier 3 runs in prod with SSM probes disabled. SSM-dependent
      # tests (per-instance knock, docker image, ssm runbook) skip
      # cleanly. The 30-day burn-in unlock workflow will auto-open
      # a PR to flip allow_ssm_probes to true after 30 days of
      # green sandbox runs.
      tier: all
      allow_ssm_probes: false
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}

  # =============================================================================
  # QRTS SMOKE TESTS - qurl-reverse-tunnel-server post-deploy validation
  #
  # Runs the QRtS reusable smoke workflow after the prod ASG instance refresh
  # completes. This is a hard gate from day one because it only probes the
  # refreshed ASG instances for local service, binary, and dashboard health.
  # The job is separate from the NHP/qURL app smokes so their results stay
  # visible in mixed deploys; monitor still stays fail-closed if any smoke fails.
  # =============================================================================
  qrts-smoke-tests:
    name: qURL Reverse Tunnel Server Smoke Tests
    needs: [manifest, deploy-qrts]
    if: needs.deploy-qrts.result == 'success'
    uses: ./.github/workflows/qrts-smoke-tests.yml
    with:
      environment: prod
      # Keep in sync with terraform/modules/qurl-reverse-tunnel-server/variables.tf
      # var.frps_dashboard_port. Prod tfvars does not override that default today.
      dashboard_port: '7500'
      expected_image_tag: ${{ needs.manifest.outputs.frps_image_tag }}
      rollback_image_tag: ${{ needs.manifest.outputs.current_prod_frps_tag }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}

  # =============================================================================
  # MONITOR - Post-deploy CloudWatch alarm watch
  # =============================================================================
  monitor:
    name: Post-Deploy Monitor
    needs: [smoke-test, qurl-smoke-tests, qrts-smoke-tests]
    # Any smoke failure skips monitor and lets finalize fail immediately with
    # the failed smoke result, matching the existing control-plane behavior.
    if: |
      always() &&
      (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped') &&
      (needs.qurl-smoke-tests.result == 'success' || needs.qurl-smoke-tests.result == 'skipped') &&
      (needs.qrts-smoke-tests.result == 'success' || needs.qrts-smoke-tests.result == 'skipped') &&
      (needs.smoke-test.result == 'success' || needs.qurl-smoke-tests.result == 'success' || needs.qrts-smoke-tests.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALARM_PREFIX: layerv-nhp-prod
      IGNORED_ALARM_SUFFIX_RE: '-(revocation-aged-out|revocation-deploy-window|revocation-aged-out-suppressed)$'
      ALARM_CLASSIFIER_JQ: |
        [(.MetricAlarms // [])[], (.CompositeAlarms // [])[]] as $alarms
        | {
            actionable: ($alarms | map(select((.AlarmName | test($re)) | not))),
            ignored: ($alarms | map(select(.AlarmName | test($re))))
          }
    # QRtS alarms use the same prod name prefix (layerv-nhp-prod-frps-*),
    # so this shared post-deploy monitor includes tunnel-server alarms.
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: List monitored alarms
        run: |
          echo "Discovering actionable CloudWatch alarms with prefix '$ALARM_PREFIX'..."
          if ! ALARM_JSON=$(aws cloudwatch describe-alarms \
            --alarm-name-prefix "$ALARM_PREFIX" \
            --output json); then
            echo "::warning::CloudWatch describe-alarms failed while listing monitored alarms; treating alarm set as empty"
            ALARM_JSON='{}'
          fi
          ALARM_GROUPS=$(printf '%s\n' "$ALARM_JSON" | jq -c --arg re "$IGNORED_ALARM_SUFFIX_RE" "$ALARM_CLASSIFIER_JQ")

          ACTIONABLE_ALARMS=$(printf '%s\n' "$ALARM_GROUPS" | jq -r '
            .actionable[]
            | [.AlarmName, .StateValue, (if .AlarmRule then "Composite" else "Metric" end), (.MetricName // "-")]
            | @tsv
          ')

          if [[ -n "$ACTIONABLE_ALARMS" ]]; then
            printf 'Name\tState\tType\tMetric\n%s\n' "$ACTIONABLE_ALARMS"
          else
            echo "No actionable alarms found"
          fi

          ALARM_COUNT=$(printf '%s\n' "$ALARM_GROUPS" | jq -r '.actionable | length')
          IGNORED_COUNT=$(printf '%s\n' "$ALARM_GROUPS" | jq -r '.ignored | length')
          echo "::notice::Monitoring $ALARM_COUNT actionable alarm(s) for 5 minutes ($IGNORED_COUNT raw/suppressor/breadcrumb alarm(s) ignored by this post-deploy gate)"

      - name: Monitor CloudWatch alarms (5 minutes)
        id: monitor-step
        run: |
          echo "Monitoring actionable CloudWatch alarms for 5 minutes..."
          echo "Ignoring raw/suppressor/breadcrumb revocation alarms; the actionable page path is the revocation-aged-out-page composite."
          echo ""

          CHECKS=10
          INTERVAL=30

          for i in $(seq 1 $CHECKS); do
            if ! ALARM_JSON=$(aws cloudwatch describe-alarms \
              --alarm-name-prefix "$ALARM_PREFIX" \
              --state-value ALARM \
              --output json); then
              echo "::warning::CloudWatch describe-alarms failed on monitor check $i/$CHECKS; treating alarm set as empty for this check"
              ALARM_JSON='{}'
            fi
            ALARM_GROUPS=$(printf '%s\n' "$ALARM_JSON" | jq -c --arg re "$IGNORED_ALARM_SUFFIX_RE" "$ALARM_CLASSIFIER_JQ")

            ALARMS=$(printf '%s\n' "$ALARM_GROUPS" | jq -r '.actionable[].AlarmName' | xargs)
            IGNORED_ALARMS=$(printf '%s\n' "$ALARM_GROUPS" | jq -r '.ignored[].AlarmName' | xargs)

            ELAPSED=$(( i * INTERVAL ))

            if [[ -n "$ALARMS" ]]; then
              echo "::error::CloudWatch alarm(s) in ALARM state after ${ELAPSED}s: $ALARMS"
              echo ""
              ALARM_DETAILS=$(printf '%s\n' "$ALARM_GROUPS" | jq -c '
                .actionable
                | map({Name: .AlarmName, Reason: (.StateReason // "")})
              ')
              echo "$ALARM_DETAILS" | jq -r '.[] | "  \(.Name): \(.Reason)"' 2>/dev/null || true

              # Write failure details to step summary
              {
                echo "## Post-Deploy Monitor"
                echo ""
                echo "> :x: **Alarm(s) triggered** after ${ELAPSED}s"
                echo ""
                echo "| Alarm | Reason |"
                echo "|-------|--------|"
                echo "$ALARM_DETAILS" | jq -r '.[] | "| `\(.Name)` | \(.Reason | .[0:100]) |"' 2>/dev/null || echo "| (parse error) | — |"
                echo ""
                CW_URL="https://${AWS_REGION}.console.aws.amazon.com/cloudwatch/home?region=${AWS_REGION}#alarmsV2:?~(alarmStateFilter~'ALARM)"
                echo "[View alarms in CloudWatch Console]($CW_URL)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [[ -n "$IGNORED_ALARMS" ]]; then
              echo "  Check $i/$CHECKS (${ELAPSED}s): No actionable alarms in ALARM state (ignored: $IGNORED_ALARMS)"
            else
              echo "  Check $i/$CHECKS (${ELAPSED}s): No actionable alarms in ALARM state"
            fi
            if [[ $i -lt $CHECKS ]]; then
              sleep "$INTERVAL"
            fi
          done

          echo ""
          echo "::notice::No alarms triggered during 5-minute monitoring window"

          {
            echo "## Post-Deploy Monitor"
            echo ""
            echo "> :white_check_mark: **5-minute monitoring window passed** — no actionable alarms triggered"
            echo ""
            echo "10 checks at 30s intervals. All actionable \`layerv-nhp-prod*\` alarms remained out of ALARM state."
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # FINALIZE - Tracking, metrics, notifications, summary
  # =============================================================================
  finalize:
    name: Finalize
    if: always()
    needs: [manifest, preflight, terraform-plan, qurl-schema-compat, terraform-apply, deploy-server, deploy-traefik-plugins, deploy-ac, deploy-relay, deploy-qurl, deploy-qrts, smoke-test, qurl-smoke-tests, nhp-smoke-tests, qrts-smoke-tests, monitor]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The `id: outcome` and `SCHEMA_COMPAT_RESULT` env wiring are
      # asserted by tests/scripts/test_promote_to_prod_gating.py — renaming
      # either will fail that test until both sides update together.
      - name: Determine deployment outcome
        id: outcome
        env:
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TF_PLAN_RESULT: ${{ needs.terraform-plan.result }}
          SCHEMA_COMPAT_RESULT: ${{ needs.qurl-schema-compat.result }}
          TF_RESULT: ${{ needs.terraform-apply.result }}
          SERVER_RESULT: ${{ needs.deploy-server.result }}
          TRAEFIK_PLUGINS_RESULT: ${{ needs.deploy-traefik-plugins.result }}
          AC_RESULT: ${{ needs.deploy-ac.result }}
          QURL_RESULT: ${{ needs.deploy-qurl.result }}
          QRTS_RESULT: ${{ needs.deploy-qrts.result }}
          RELAY_RESULT: ${{ needs.deploy-relay.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          QURL_SMOKE_RESULT: ${{ needs.qurl-smoke-tests.result }}
          NHP_SMOKE_RESULT: ${{ needs.nhp-smoke-tests.result }}
          QRTS_SMOKE_RESULT: ${{ needs.qrts-smoke-tests.result }}
          MONITOR_RESULT: ${{ needs.monitor.result }}
        run: |
          # Check if any non-skipped job failed. As of PR3, nhp-smoke-tests
          # is included in the FAILED loop — no longer report-only. As of
          # issue #1322, qurl-schema-compat is also in the loop so a failed
          # schema check produces an unambiguous workflow failure (it would
          # otherwise cascade to skipped terraform-apply / skipped deploys
          # and finalize would silently report success).
          #
          # SCHEMA_COMPAT_RESULT=skipped is expected and benign when
          # run_terraform=false (qurl-schema-compat itself has
          # `if: inputs.run_terraform`); the FAILED loop only flags
          # `failure` / `cancelled`, so the skipped path is already
          # correct — no extra branch needed here. SCHEMA_COMPAT_RESULT=
          # cancelled (operator hit Cancel mid-run) IS caught: the
          # `cancelled` arm of the loop fails the workflow so a half-
          # cancelled run does not silently report success, matching the
          # treatment of every other job's cancelled state.
          FAILED=false
          for result in "$MANIFEST_RESULT" "$PREFLIGHT_RESULT" "$TF_PLAN_RESULT" "$SCHEMA_COMPAT_RESULT" "$TF_RESULT" "$SERVER_RESULT" "$TRAEFIK_PLUGINS_RESULT" "$AC_RESULT" "$QURL_RESULT" "$QRTS_RESULT" "$RELAY_RESULT" "$SMOKE_RESULT" "$QURL_SMOKE_RESULT" "$NHP_SMOKE_RESULT" "$QRTS_SMOKE_RESULT" "$MONITOR_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              FAILED=true
              break
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      # Tracking-write step runs BEFORE lock release so a tracking-put
      # failure cleanly propagates to the lock + SNS via the conditional
      # status expression `(tracking failed → 'failed' else outcome)`.
      # Pre-round-38, tracking ran AFTER lock release: a failed tracking
      # put left the lock saying "deployed" while the workflow conclusion
      # was "failure" — the runbook documented the recovery, but the
      # divergence was a real footgun on-call would hit.
      - name: Update terraform apply tracking
        id: tracking
        if: needs.terraform-apply.result == 'success'
        env:
          # Bind interpolated values via env: rather than splicing
          # ${{ ... }} directly into the script body. github.sha is
          # trusted (hex-only), so this is style consistency, not a
          # security concern — but every other shell step in this file
          # uses env-binding, and mixing styles is a footgun for the
          # next maintainer.
          COMMIT_SHA: ${{ github.sha }}
        # last-terraform-apply-commit feeds the next promote's stale-tf
        # gate (#1322). Fail the job on a silent put failure so the
        # operator notices on this deploy, not the next one.
        #
        # 3 retries with linear backoff (3s, 6s) absorb a transient
        # SSM throttle without softening the invariant.
        #
        # Backoff trade-off: a sustained throttle (rare; would need a
        # cross-region SSM degradation) won't be absorbed in 9s
        # worst-case. We accept that — recovery is the manual re-seed
        # documented in the runbook. Adding a 4th attempt with longer
        # backoff or jitter would help in the rare sustained-throttle
        # case, but we'd be optimizing for a failure mode that has
        # never been observed in this workflow's history; revisit if
        # CloudWatch ever shows sustained `RetryPut` patterns.
        #
        # Atomicity: write COMMIT first (load-bearing for the gate),
        # then the timestamp (informational). A throttled timestamp put
        # after a successful commit put fails finalize — accepted over
        # a silent partial-update because the gate consumes only the
        # commit, recovery is just re-dispatching the workflow, and
        # splitting into two steps loses the atomic invariant. Revisit
        # if AWS service degradation makes the false-failure routine.
        run: |
          set -euo pipefail
          echo "Recording last successful terraform apply commit..."

          retry_put() {
            local name="$1"
            local value="$2"
            local err_file
            err_file=$(mktemp)
            for attempt in 1 2 3; do
              : > "$err_file"
              if aws ssm put-parameter \
                  --name "$name" \
                  --value "$value" \
                  --type String \
                  --overwrite 2>"$err_file" >/dev/null; then
                rm -f "$err_file"
                return 0
              fi
              if [[ $attempt -lt 3 ]]; then
                local backoff=$((attempt * 3))
                echo "  put-parameter $name attempt $attempt failed, retrying in ${backoff}s..."
                sleep "$backoff"
              fi
            done
            echo "::error::Failed to update SSM parameter $name after 3 attempts:"
            while IFS= read -r line; do
              printf '  %s\n' "$line"
            done < "$err_file"
            rm -f "$err_file"
            return 1
          }

          # Order matters: write the COMMIT first (load-bearing for the
          # next run's gate) then the timestamp (informational). The
          # success log line below only prints if BOTH succeeded under
          # `set -e` — if the second put fails after retries, the
          # script exits before this echo, so the run log doesn't
          # falsely claim success.
          retry_put "/prod/nhp/deploy/last-terraform-apply-commit" "$COMMIT_SHA"
          retry_put "/prod/nhp/deploy/last-terraform-apply-at" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "  Terraform tracking: last-terraform-apply-commit=$COMMIT_SHA"

      # Resolve the final status ONCE so downstream steps (lock release,
      # metric, SNS, summary) can reference `steps.final_status.outputs.value`
      # instead of repeating the conditional expression at each callsite.
      # Pre-round-43, the conditional `tracking.outcome == 'failure' &&
      # 'failed' || outcome.outputs.status` was duplicated four times —
      # a refactor that demoted on a different signal would have needed
      # four updates.
      - name: Resolve final status
        id: final_status
        if: always()
        env:
          TRACKING_OUTCOME: ${{ steps.tracking.outcome }}
          OUTCOME_STATUS: ${{ steps.outcome.outputs.status }}
        run: |
          if [[ "$TRACKING_OUTCOME" == "failure" ]]; then
            echo "value=failed" >> "$GITHUB_OUTPUT"
          elif [[ -z "$OUTCOME_STATUS" ]]; then
            # Defensive: if `outcome` ever skips (e.g., a future
            # maintainer adds an `if:` to it), OUTCOME_STATUS arrives
            # empty and downstream consumers would write LOCK_VALUE=
            # (empty). Default to `failed` so the workflow conclusion,
            # SNS, lock, and metric stay aligned with "something went
            # wrong" rather than silently degrading to an empty string.
            echo "::warning::Resolve final status: outcome step did not produce a status; defaulting to failed."
            echo "value=failed" >> "$GITHUB_OUTPUT"
          else
            echo "value=$OUTCOME_STATUS" >> "$GITHUB_OUTPUT"
          fi

      - name: Release deployment lock
        if: always()
        env:
          # Conditional: if the tracking step failed (post-round-38
          # ordering puts it before this step), treat the run as failed
          # for lock-state purposes. Otherwise honor the outcome step's
          # status. `steps.tracking.outcome == 'skipped'` (terraform-apply
          # didn't run) returns the original outcome.status — no false
          # demotion.
          DEPLOY_STATUS: ${{ steps.final_status.outputs.value }}
          TF_RESULT: ${{ needs.terraform-apply.result }}
          SERVER_RESULT: ${{ needs.deploy-server.result }}
          TRAEFIK_PLUGINS_RESULT: ${{ needs.deploy-traefik-plugins.result }}
          AC_RESULT: ${{ needs.deploy-ac.result }}
          QURL_RESULT: ${{ needs.deploy-qurl.result }}
          QRTS_RESULT: ${{ needs.deploy-qrts.result }}
          RELAY_RESULT: ${{ needs.deploy-relay.result }}
        # Lock layering: the SSM `/prod/nhp/deploy/state` parameter is
        # informational/post-hoc. Real concurrency enforcement is the
        # workflow-level `concurrency: group: promote-to-prod, cancel-
        # in-progress: false` at the top of this file, which serializes
        # runs at the GHA scheduler. The SSM lock is for cross-tooling
        # observability (operator inspecting state outside a workflow
        # run) and the force_unlock input is for the rare case where
        # GHA's concurrency state diverges from SSM's. A finalize that
        # runs concurrently with another finalize would still both
        # write to SSM in some order — but cancel-in-progress=false
        # plus the deploy-state read in preflight prevent the race in
        # practice.
        run: |
          # State machine for /prod/nhp/deploy/state:
          # - success → "deployed"
          # - failure where terraform-apply OR any deploy-* job ran
          #   (success or failure) → "failed". This covers the case
          #   where terraform-apply failed mid-graph and left prod in
          #   a partially-converged state — labelling that "rejected"
          #   would be a lie since some resources DID land.
          # - failure where terraform-apply AND every deploy-* job
          #   were skipped (preflight reject / stale-tf reject /
          #   schema-compat block / schema-compat cancelled /
          #   terraform-plan failure cascading a skipped apply) →
          #   "rejected". The previous deploy-state remains the
          #   authoritative description of prod.
          #
          # Schema-compat cancellation note: an operator-cancelled
          # qurl-schema-compat job produces TF=skipped + deploys=
          # skipped (same shape as a schema-compat failure), so this
          # branch correctly maps to "rejected". The runbook's
          # vocabulary entry for "rejected" describes this state
          # accurately ("nothing landed").
          echo "Releasing deployment lock..."
          if [[ "$DEPLOY_STATUS" == "success" ]]; then
            LOCK_VALUE="deployed"
          elif [[ "$TF_RESULT" == "skipped" \
               && "$SERVER_RESULT" == "skipped" \
               && "$TRAEFIK_PLUGINS_RESULT" == "skipped" \
               && "$AC_RESULT" == "skipped" \
               && "$QURL_RESULT" == "skipped" \
               && "$QRTS_RESULT" == "skipped" \
               && "$RELAY_RESULT" == "skipped" ]]; then
            LOCK_VALUE="rejected"
          else
            LOCK_VALUE="failed"
          fi
          aws ssm put-parameter \
            --name "/prod/nhp/deploy/state" \
            --value "$LOCK_VALUE" \
            --type String \
            --overwrite || echo "::warning::Failed to release deployment lock"
          echo "  Lock released: /prod/nhp/deploy/state = $LOCK_VALUE"

      # Intentionally NOT demoted via final_status: this step writes
      # `deployed-commit` (what binary is currently running), and that
      # claim is true even if the tracking step (which writes
      # `last-terraform-apply-commit`) failed afterwards. Demoting on
      # tracking failure here would make the next rollback's
      # `deployed-commit-previous` resolution incorrect — prod IS
      # running the new binaries; only the side-tracking write failed.
      # The other 4 status-flow callsites (lock/metric/SNS/summary)
      # use final_status because they describe the run, not the
      # deployed binaries.
      - name: Update deployment tracking
        if: steps.outcome.outputs.status == 'success'
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
        run: |
          echo "Updating deployment tracking..."

          # Mirror the retry_put helper from `Update terraform apply tracking`
          # so transient SSM throttle on these writes degrades gracefully
          # (warn-only here — these are post-success informational writes,
          # not gate-relevant; the load-bearing tracking writes already
          # ran before lock release).
          retry_put_warn() {
            local name="$1"
            local value="$2"
            local err_file
            err_file=$(mktemp)
            for attempt in 1 2 3; do
              : > "$err_file"
              if aws ssm put-parameter \
                  --name "$name" \
                  --value "$value" \
                  --type String \
                  --overwrite 2>"$err_file" >/dev/null; then
                rm -f "$err_file"
                return 0
              fi
              if [[ $attempt -lt 3 ]]; then
                local backoff=$((attempt * 3))
                echo "  put-parameter $name attempt $attempt failed, retrying in ${backoff}s..."
                sleep "$backoff"
              fi
            done
            echo "::warning::Failed to update SSM parameter $name after 3 attempts:"
            while IFS= read -r line; do
              printf '  %s\n' "$line"
            done < "$err_file"
            rm -f "$err_file"
            return 0
          }

          # Save the current deployed-commit as previous before overwriting,
          # so rollback can target the actual previous version (not current)
          CURRENT=$(aws ssm get-parameter \
            --name "/prod/nhp/deploy/deployed-commit" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          # Triple-sentinel check matching the stale-tf guard: "" /
          # "initial" / "None" all map to "no real prior commit". The
          # AWS-CLI `--output text` literal `None` slips through a
          # bare `!= "initial"` check; mirror the stale-tf check at
          # line 1097 so the asymmetry can't produce a "deployed-
          # commit-previous=None" forensic landmine.
          if [[ -n "$CURRENT" \
             && "$CURRENT" != "initial" \
             && "$CURRENT" != "None" \
             && "$CURRENT" != "$IMAGE_TAG" ]]; then
            retry_put_warn "/prod/nhp/deploy/deployed-commit-previous" "$CURRENT"
            echo "  Previous commit saved: deployed-commit-previous=$CURRENT"
          fi

          retry_put_warn "/prod/nhp/deploy/deployed-commit" "$IMAGE_TAG"
          retry_put_warn "/prod/nhp/deploy/deployed-at" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "  Tracking updated: deployed-commit=$IMAGE_TAG"

      - name: Push CloudWatch deployment metric
        if: always()
        env:
          # Same conditional as Release deployment lock: a tracking
          # failure demotes status to "failed" so the metric reflects
          # the workflow's actual outcome.
          DEPLOY_STATUS: ${{ steps.final_status.outputs.value }}
          CELL_ID: ${{ inputs.cell_id }}
        run: |
          # put-metric-data --dimensions uses Key=Value shorthand. Today
          # $DEPLOY_STATUS is constrained to success/failed; if a future
          # Status value can contain a comma, use --metric-data JSON
          # instead of the unsupported Name=...,Value=... pair form.
          aws cloudwatch put-metric-data \
            --namespace "LayerV/NHP" \
            --metric-name "DeploymentEvent" \
            --dimensions "Environment=prod,Strategy=promote,Status=${DEPLOY_STATUS}" \
            --value 1 \
            --unit Count \
            || echo "::warning::Failed to push deployment metric"
          aws cloudwatch put-metric-data \
            --namespace "LayerV/NHP" \
            --metric-name "DeploymentEvent" \
            --dimensions "Environment=prod,Cell=$CELL_ID" \
            --value 1 \
            --unit Count \
            || echo "::warning::Failed to push cell-scoped deployment metric"
          echo "  Deployment metric pushed: Status=$DEPLOY_STATUS"

      - name: Send SNS notification
        if: always()
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
          # Same conditional as Release deployment lock + Push metric:
          # tracking failure demotes status so SNS reflects the
          # workflow's actual outcome (no false-success notification
          # while the workflow conclusion is failure).
          DEPLOY_STATUS: ${{ steps.final_status.outputs.value }}
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TF_PLAN_RESULT: ${{ needs.terraform-plan.result }}
          SCHEMA_COMPAT_RESULT: ${{ needs.qurl-schema-compat.result }}
          TF_RESULT: ${{ needs.terraform-apply.result }}
          SERVER_RESULT: ${{ needs.deploy-server.result }}
          TRAEFIK_PLUGINS_RESULT: ${{ needs.deploy-traefik-plugins.result }}
          AC_RESULT: ${{ needs.deploy-ac.result }}
          QURL_RESULT: ${{ needs.deploy-qurl.result }}
          QRTS_RESULT: ${{ needs.deploy-qrts.result }}
          RELAY_RESULT: ${{ needs.deploy-relay.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          QURL_SMOKE_RESULT: ${{ needs.qurl-smoke-tests.result }}
          NHP_SMOKE_RESULT: ${{ needs.nhp-smoke-tests.result }}
          QRTS_SMOKE_RESULT: ${{ needs.qrts-smoke-tests.result }}
          MONITOR_RESULT: ${{ needs.monitor.result }}
          # Force-push protection state surfaced from preflight so
          # operators see "Protection: unverified" in the notification
          # rather than relying on a buried ::warning::. Empty when
          # preflight is skipped (e.g., manifest rejected).
          PROTECTION_STATUS: ${{ needs.preflight.outputs.protection_status }}
          ROLLBACK: ${{ inputs.rollback }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          SNS_ARN=$(aws ssm get-parameter \
            --name "/prod/nhp/monitoring/sns-topic-arn" \
            --query 'Parameter.Value' --output text 2>/dev/null) || SNS_ARN=""

          if [[ -z "$SNS_ARN" || ! "$SNS_ARN" =~ ^arn:aws:sns: ]]; then
            echo "No valid SNS topic ARN found, skipping notification"
            exit 0
          fi

          STATUS_UPPER=$(echo "$DEPLOY_STATUS" | tr '[:lower:]' '[:upper:]')
          MODE=""
          if [[ "$ROLLBACK" == "true" ]]; then
            MODE=" (ROLLBACK)"
          fi

          SUBJECT="Promote to Prod: ${STATUS_UPPER}${MODE} - ${IMAGE_TAG:0:7}"

          result_icon() {
            case "$1" in
              success) echo "[OK]" ;;
              skipped) echo "[SKIP]" ;;
              failure) echo "[FAIL]" ;;
              cancelled) echo "[CANCEL]" ;;
              *) echo "[$1]" ;;
            esac
          }

          # Auto-pad the result rows so a future row addition longer than
          # the longest current label doesn't silently break alignment.
          # The literal space in the format string supplies the gap before
          # the icon — `%-Ns` left-pads the label to its own width, no
          # implicit margin. The structural test asserts every label-with-
          # colon fits within LABEL_WIDTH; bump LABEL_WIDTH if a future
          # row has a longer label.
          #
          # IMPORTANT: the format string has NO trailing newline. The
          # `\n` is at the START. Callers use `MSG+=$(row ...)`, and
          # `$()` strips trailing newlines — adding a trailing `\n` to
          # the format would silently swallow it and break alignment.
          # If you want a trailing newline, append `$'\n'` to the
          # caller, not the format.
          # 20 = 14 chars (longest current label "Schema Compat:") + 6
          # chars of headroom so a future row label like "Image
          # Replication:" (17 chars) lands without restructuring.
          # The structural test asserts every label-with-colon fits;
          # bumping further requires a paired test bump.
          LABEL_WIDTH=20
          row() {
            local label="$1"
            local result="$2"
            printf '\n  %-*s %s' "$LABEL_WIDTH" "$label:" "$(result_icon "$result")"
          }

          # Newline policy: every line below uses real newlines via
          # ANSI-C `$'\n'` to match the row() helper's `printf '\n...'`.
          # The earlier mixed `MSG+="\n..."` form interpreted via
          # `echo -e` worked, but mixing literal-backslash-n and real
          # newlines in the same buffer is a footgun for the next
          # maintainer.
          MSG="Production Promotion Notification${MODE}"
          MSG+=$'\n'
          MSG+=$'\n  Status:    '"${STATUS_UPPER}"
          MSG+=$'\n  Image Tag: '"${IMAGE_TAG}"
          MSG+=$'\n  Triggered: '"$TRIGGERED_BY"
          MSG+=$'\n'
          # Bumping a label here? Bump LABEL_WIDTH (above) and re-run
          # `make lint-workflows` — _assert_sns_row_widths fails loudly
          # if any label-with-colon exceeds the width.
          MSG+=$(row "Manifest"      "$MANIFEST_RESULT")
          MSG+=$(row "Preflight"     "$PREFLIGHT_RESULT")
          MSG+=$(row "TF Plan"       "$TF_PLAN_RESULT")
          MSG+=$(row "Schema Compat" "$SCHEMA_COMPAT_RESULT")
          MSG+=$(row "TF Apply"      "$TF_RESULT")
          MSG+=$(row "Server"        "$SERVER_RESULT")
          MSG+=$(row "Traefik Plugins" "$TRAEFIK_PLUGINS_RESULT")
          MSG+=$(row "AC"            "$AC_RESULT")
          MSG+=$(row "QURL"          "$QURL_RESULT")
          MSG+=$(row "QRTS"          "$QRTS_RESULT")
          MSG+=$(row "Relay"         "$RELAY_RESULT")
          MSG+=$(row "Smoke Test"    "$SMOKE_RESULT")
          MSG+=$(row "QURL Smoke"    "$QURL_SMOKE_RESULT")
          MSG+=$(row "NHP Smoke"     "$NHP_SMOKE_RESULT")
          MSG+=$(row "QRTS Smoke"    "$QRTS_SMOKE_RESULT")
          MSG+=$(row "Monitor"       "$MONITOR_RESULT")
          MSG+=$'\n'
          # Pull last-terraform-apply-at out of SSM so the notification
          # footer surfaces the value (would otherwise be dead-write).
          # Best-effort with silent fallback to "unknown" — this is the
          # ONE place in this PR where we accept a silent SSM read
          # failure, and the inconsistency is intentional. Rationale:
          # this is a footer enrichment for a notification that has
          # already correctly reported the deploy status. If SSM is
          # genuinely down here, the message degrades gracefully (the
          # operator sees "unknown" and knows to read the full SSM
          # parameter directly) — making it fail-loud would block the
          # SNS notification entirely, which is a worse failure mode
          # than degraded text.
          LAST_TF_APPLY_AT=$(aws ssm get-parameter \
            --name "/prod/nhp/deploy/last-terraform-apply-at" \
            --query "Parameter.Value" --output text 2>/dev/null \
            || echo "unknown")
          # Belt-and-suspenders: strip newlines that could break SNS
          # message formatting. The path is operator-writable (gated
          # by AWS_PROD_ROLE_ARN); a value with embedded \n would
          # corrupt the multi-line MSG layout below.
          LAST_TF_APPLY_AT="${LAST_TF_APPLY_AT//$'\n'/ }"
          MSG+=$'\n  Last TF Apply: '"$LAST_TF_APPLY_AT"
          # Empty when preflight was skipped (e.g., manifest rejected),
          # OR if verify-protection ever reaches a code path without
          # set_status (defense-in-depth — the step always sets one
          # today, but a future maintainer adding a branch could miss
          # the call). Show literal so on-call can distinguish the two
          # cases by job result: preflight=success + (unset) implies a
          # bug; preflight=skipped + (preflight skipped) is expected.
          if [[ "${PREFLIGHT_RESULT}" == "skipped" ]]; then
            PROTECTION_DISPLAY="(preflight skipped)"
          else
            PROTECTION_DISPLAY="${PROTECTION_STATUS:-(unset)}"
          fi
          MSG+=$'\n  Protection: '"$PROTECTION_DISPLAY"
          MSG+=$'\n  Run: '"${WORKFLOW_URL}"

          # MSG now contains real newlines throughout, so `--message`
          # passes it through directly — no `echo -e` interpretation
          # needed.
          aws sns publish \
            --topic-arn "$SNS_ARN" \
            --subject "$SUBJECT" \
            --message "$MSG" \
            || echo "::warning::SNS notification failed"

      - name: Deployment summary
        if: always()
        env:
          IMAGE_TAG: ${{ needs.manifest.outputs.effective_image_tag }}
          QURL_IMAGE_TAG: ${{ needs.manifest.outputs.qurl_image_tag }}
          QRTS_IMAGE_TAG: ${{ needs.manifest.outputs.frps_image_tag }}
          # Same conditional as the lock release + metric + SNS steps.
          DEPLOY_STATUS: ${{ steps.final_status.outputs.value }}
          MANIFEST_RESULT: ${{ needs.manifest.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TF_PLAN_RESULT: ${{ needs.terraform-plan.result }}
          SCHEMA_COMPAT_RESULT: ${{ needs.qurl-schema-compat.result }}
          TF_RESULT: ${{ needs.terraform-apply.result }}
          SERVER_RESULT: ${{ needs.deploy-server.result }}
          TRAEFIK_PLUGINS_RESULT: ${{ needs.deploy-traefik-plugins.result }}
          AC_RESULT: ${{ needs.deploy-ac.result }}
          QURL_RESULT: ${{ needs.deploy-qurl.result }}
          QRTS_RESULT: ${{ needs.deploy-qrts.result }}
          RELAY_RESULT: ${{ needs.deploy-relay.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          QURL_SMOKE_RESULT: ${{ needs.qurl-smoke-tests.result }}
          NHP_SMOKE_RESULT: ${{ needs.nhp-smoke-tests.result }}
          QRTS_SMOKE_RESULT: ${{ needs.qrts-smoke-tests.result }}
          MONITOR_RESULT: ${{ needs.monitor.result }}
          ROLLBACK: ${{ inputs.rollback }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result_emoji() {
            case "$1" in
              success) echo ":white_check_mark:" ;;
              skipped) echo ":fast_forward:" ;;
              failure) echo ":x:" ;;
              cancelled) echo ":stop_sign:" ;;
              *) echo ":grey_question:" ;;
            esac
          }

          {
            echo "---"
            echo "## Deployment Summary"
            echo ""
            if [[ "$DEPLOY_STATUS" == "success" ]]; then
              echo "> :white_check_mark: **Production deployment successful**"
            else
              echo "> :x: **Production deployment failed**"
            fi
            if [[ "$ROLLBACK" == "true" ]]; then
              echo "> :warning: This was a **ROLLBACK** deployment"
            fi
            echo ""
            echo "### Job Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Manifest | $(result_emoji "$MANIFEST_RESULT") $MANIFEST_RESULT |"
            echo "| Preflight | $(result_emoji "$PREFLIGHT_RESULT") $PREFLIGHT_RESULT |"
            echo "| Terraform Plan | $(result_emoji "$TF_PLAN_RESULT") $TF_PLAN_RESULT |"
            echo "| QURL Schema Compat | $(result_emoji "$SCHEMA_COMPAT_RESULT") $SCHEMA_COMPAT_RESULT |"
            echo "| Terraform Apply | $(result_emoji "$TF_RESULT") $TF_RESULT |"
            echo "| Deploy Server | $(result_emoji "$SERVER_RESULT") $SERVER_RESULT |"
            echo "| Deploy Traefik Plugins | $(result_emoji "$TRAEFIK_PLUGINS_RESULT") $TRAEFIK_PLUGINS_RESULT |"
            echo "| Deploy AC | $(result_emoji "$AC_RESULT") $AC_RESULT |"
            echo "| Deploy QURL | $(result_emoji "$QURL_RESULT") $QURL_RESULT |"
            echo "| Deploy qurl-reverse-tunnel-server | $(result_emoji "$QRTS_RESULT") $QRTS_RESULT |"
            echo "| Deploy NHP-Relay | $(result_emoji "$RELAY_RESULT") $RELAY_RESULT |"
            echo "| Smoke Test | $(result_emoji "$SMOKE_RESULT") $SMOKE_RESULT |"
            echo "| QURL Smoke Tests | $(result_emoji "$QURL_SMOKE_RESULT") $QURL_SMOKE_RESULT |"
            echo "| NHP Smoke Tests | $(result_emoji "$NHP_SMOKE_RESULT") $NHP_SMOKE_RESULT |"
            echo "| qURL Reverse Tunnel Server Smoke Tests | $(result_emoji "$QRTS_SMOKE_RESULT") $QRTS_SMOKE_RESULT |"
            echo "| Monitor | $(result_emoji "$MONITOR_RESULT") $MONITOR_RESULT |"
            echo ""
            echo "### Deployed Artifacts"
            echo "| Component | Image |"
            echo "|-----------|-------|"
            echo "| NHP Server | \`$ECR_SERVER_REPO:$IMAGE_TAG\` |"
            echo "| Access Controller | \`$ECR_AC_REPO:$IMAGE_TAG\` |"
            echo "| QURL Service | \`$ECR_QURL_REPO:${QURL_IMAGE_TAG:-N/A}\` |"
            echo "| qurl-reverse-tunnel-server | \`$ECR_QRTS_REPO:${QRTS_IMAGE_TAG:-N/A}\` |"
            echo ""
            echo "### Quick Links"
            echo "- [ECS Console](https://${AWS_REGION}.console.aws.amazon.com/ecs/v2/clusters?region=${AWS_REGION})"
            echo "- [CloudWatch Alarms](https://${AWS_REGION}.console.aws.amazon.com/cloudwatch/home?region=${AWS_REGION}#alarmsV2:)"
            echo "- [Step Functions](https://${AWS_REGION}.console.aws.amazon.com/states/home?region=${AWS_REGION}#/statemachines)"
            echo "- [This workflow run]($WORKFLOW_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
