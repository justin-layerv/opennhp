name: qURL Agent Transaction IAM (prod)

on:
  workflow_dispatch:
    inputs:
      confirm_policy_name:
        description: 'Type qurl-agent-keys-transact-write to plan the one-policy production grant'
        required: true
        type: string

# This staging write and the legacy production root must never race.
concurrency:
  group: promote-to-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.14.3'
  ROOT: terraform/staged/qurl-agent-transact-iam
  POLICY_NAME: qurl-agent-keys-transact-write
  ROLE_NAME: layerv-nhp-prod-cell0-qurl-api-task
  ROLE_ARN: arn:aws:iam::235500187906:role/layerv-nhp-prod-cell0-qurl-api-task
  TABLE_NAME: layerv-nhp-prod-cell0-qurl-agent-keys
  TABLE_ARN: arn:aws:dynamodb:us-east-2:235500187906:table/layerv-nhp-prod-cell0-qurl-agent-keys

jobs:
  guard:
    name: Require main and exact confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check dispatch boundary
        env:
          CONFIRM_POLICY_NAME: ${{ inputs.confirm_policy_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "::error::This production staging workflow runs only from refs/heads/main."
            exit 1
          fi
          if [[ "$CONFIRM_POLICY_NAME" != "$POLICY_NAME" ]]; then
            echo "::error::Confirmation must exactly equal $POLICY_NAME."
            exit 1
          fi

  plan:
    name: Plan one staged IAM create
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      plan_sha256: ${{ steps.metadata.outputs.plan_sha256 }}
      planned_at_epoch: ${{ steps.metadata.outputs.planned_at_epoch }}
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Configure read-only production planning session
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          role-session-name: qurl-agent-transact-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          # STS inline session policies are limited to 2,048 plaintext characters.
          # Terraform 1.14.3 probes non-default workspaces with ListObjectsV2
          # at env:/ and explicitly treats AccessDenied as default-workspace
          # only. Deliberately omit s3:ListBucket; revalidate on a TF bump.
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"StateBucketLocation","Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":"arn:aws:s3:::layerv-terraform-state-235500187906"},{"Sid":"StateObjectRead","Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::layerv-terraform-state-235500187906/nhp/prod/staged/qurl-agent-transact-iam/terraform.tfstate","arn:aws:s3:::layerv-terraform-state-235500187906/nhp/prod/staged/qurl-agent-transact-iam/terraform.tfstate.tflock"]},{"Sid":"StateKmsRead","Effect":"Allow","Action":["kms:Decrypt","kms:DescribeKey"],"Resource":"arn:aws:kms:us-east-2:235500187906:key/00a0e673-cef4-41f0-bfc0-5116a9ab3aa0"},{"Sid":"CallerIdentity","Effect":"Allow","Action":["sts:GetCallerIdentity"],"Resource":"*"},{"Sid":"TargetRoleRead","Effect":"Allow","Action":["iam:GetRole","iam:GetRolePolicy","iam:ListRolePolicies"],"Resource":"arn:aws:iam::235500187906:role/layerv-nhp-prod-cell0-qurl-api-task"},{"Sid":"TargetTableRead","Effect":"Allow","Action":["dynamodb:DescribeTable"],"Resource":"arn:aws:dynamodb:us-east-2:235500187906:table/layerv-nhp-prod-cell0-qurl-agent-keys"}]}

      - name: Verify live targets and absent policy
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          [[ "$account" == "235500187906" ]] || { echo "::error::Unexpected AWS account: $account"; exit 1; }

          role_arn=$(aws iam get-role --role-name "$ROLE_NAME" --query Role.Arn --output text)
          [[ "$role_arn" == "$ROLE_ARN" ]] || { echo "::error::Unexpected role ARN: $role_arn"; exit 1; }

          read -r table_status table_arn < <(aws dynamodb describe-table \
            --table-name "$TABLE_NAME" \
            --query '[Table.TableStatus,Table.TableArn]' \
            --output text)
          [[ "$table_status" == "ACTIVE" && "$table_arn" == "$TABLE_ARN" ]] || {
            echo "::error::Target table is not the reviewed ACTIVE table."; exit 1;
          }

          set +e
          aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" \
            >/tmp/existing-policy.json 2>/tmp/existing-policy.err
          policy_rc=$?
          set -e
          if [[ $policy_rc -eq 0 ]]; then
            echo "::error::$POLICY_NAME already exists; the create-only workflow refuses adoption or overwrite."
            exit 1
          fi
          grep -q 'NoSuchEntity' /tmp/existing-policy.err || {
            sed 's/^/AWS: /' /tmp/existing-policy.err >&2
            echo "::error::Could not prove the policy is absent."
            exit 1
          }

      - name: Initialize staged state
        working-directory: ${{ env.ROOT }}
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          terraform init -reconfigure -input=false

      - name: Create and check saved plan
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          rm -f tfplan tfplan.json tfplan.txt
          terraform plan -input=false -lock=false -no-color -out=tfplan | tee tfplan.txt
          terraform show -json tfplan > tfplan.json
          ../../../scripts/check-qurl-agent-transact-iam.py plan tfplan.json --expected-action create

      - name: Record immutable plan metadata
        id: metadata
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          commit_sha=$(git rev-parse HEAD)
          [[ "$commit_sha" == "${{ github.sha }}" ]] || { echo "::error::Checkout SHA drifted."; exit 1; }
          plan_sha256=$(sha256sum tfplan | awk '{print $1}')
          planned_at_epoch=$(date -u +%s)
          printf '%s\n' "$commit_sha" > commit-sha.txt
          printf '%s  %s\n' "$plan_sha256" tfplan > tfplan.sha256
          printf '%s\n' "$planned_at_epoch" > planned-at-epoch.txt
          {
            echo "commit_sha=$commit_sha"
            echo "plan_sha256=$plan_sha256"
            echo "planned_at_epoch=$planned_at_epoch"
          } >> "$GITHUB_OUTPUT"

      - name: Upload saved plan for protected apply
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qurl-agent-transact-iam-plan-${{ github.run_id }}
          path: |
            terraform/staged/qurl-agent-transact-iam/tfplan
            terraform/staged/qurl-agent-transact-iam/tfplan.json
            terraform/staged/qurl-agent-transact-iam/tfplan.txt
            terraform/staged/qurl-agent-transact-iam/tfplan.sha256
            terraform/staged/qurl-agent-transact-iam/commit-sha.txt
            terraform/staged/qurl-agent-transact-iam/planned-at-epoch.txt
          # Retention deliberately exceeds the enforced two-day approval
          # window so boundary-time approval fails clearly below rather than
          # racing artifact garbage collection.
          retention-days: 3
          if-no-files-found: error

      - name: Summarize approval boundary
        run: |
          {
            echo '## qURL agent transaction IAM plan'
            echo
            echo "- Commit: \`${{ steps.metadata.outputs.commit_sha }}\`"
            echo "- Plan SHA-256: \`${{ steps.metadata.outputs.plan_sha256 }}\`"
            echo "- Expected change: one create of \`aws_iam_role_policy.qurl_agent_keys_transact\`"
            echo
            echo '> Approve the protected apply within two days of plan creation. The artifact is retained for three days only to avoid boundary-time garbage collection. If the approval window expires, re-dispatch this workflow and review a fresh plan; do not re-upload or reuse the stale plan.'
            echo "> A pending approval holds the shared \`promote-to-prod\` concurrency slot and queues regular production promotions. Approve promptly or cancel the run and re-dispatch when ready."
            echo
            echo '**Policy installation is not effective-permission verification.** After apply, a separate privileged operator simulation must be linked on nhp#1952 before the transactional writer may deploy.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply reviewed staged IAM plan
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit_sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Enforce two-day approval window
        env:
          PLANNED_AT_EPOCH: ${{ needs.plan.outputs.planned_at_epoch }}
        run: |
          set -euo pipefail
          [[ "$PLANNED_AT_EPOCH" =~ ^[0-9]+$ ]] || {
            echo "::error::Saved plan creation time is malformed."
            exit 1
          }
          now_epoch=$(date -u +%s)
          plan_age_seconds=$((now_epoch - PLANNED_AT_EPOCH))
          if ((plan_age_seconds < 0 || plan_age_seconds > 172800)); then
            echo "::error::The two-day approval window expired; cancel and re-dispatch to review a fresh plan."
            exit 1
          fi

      - name: Configure narrowly-scoped production apply session
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          role-session-name: qurl-agent-transact-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          # STS inline session policies are limited to 2,048 plaintext characters.
          # Match the plan session's deliberate omission of s3:ListBucket.
          # IAM scopes PutRolePolicy to the role, not an inline-policy name. The
          # saved-plan contract and immediate absence check below constrain the
          # only write to qurl-agent-keys-transact-write.
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"StateBucketLocation","Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":"arn:aws:s3:::layerv-terraform-state-235500187906"},{"Sid":"StateObject","Effect":"Allow","Action":["s3:GetObject","s3:PutObject"],"Resource":["arn:aws:s3:::layerv-terraform-state-235500187906/nhp/prod/staged/qurl-agent-transact-iam/terraform.tfstate","arn:aws:s3:::layerv-terraform-state-235500187906/nhp/prod/staged/qurl-agent-transact-iam/terraform.tfstate.tflock"]},{"Sid":"StateLockDelete","Effect":"Allow","Action":["s3:DeleteObject"],"Resource":"arn:aws:s3:::layerv-terraform-state-235500187906/nhp/prod/staged/qurl-agent-transact-iam/terraform.tfstate.tflock"},{"Sid":"StateKms","Effect":"Allow","Action":["kms:Decrypt","kms:DescribeKey","kms:Encrypt","kms:GenerateDataKey"],"Resource":"arn:aws:kms:us-east-2:235500187906:key/00a0e673-cef4-41f0-bfc0-5116a9ab3aa0"},{"Sid":"CallerIdentity","Effect":"Allow","Action":["sts:GetCallerIdentity"],"Resource":"*"},{"Sid":"TargetRole","Effect":"Allow","Action":["iam:GetRole","iam:GetRolePolicy","iam:ListRolePolicies","iam:PutRolePolicy"],"Resource":"arn:aws:iam::235500187906:role/layerv-nhp-prod-cell0-qurl-api-task"},{"Sid":"TargetTableRead","Effect":"Allow","Action":["dynamodb:DescribeTable"],"Resource":"arn:aws:dynamodb:us-east-2:235500187906:table/layerv-nhp-prod-cell0-qurl-agent-keys"}]}

      - name: Download reviewed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qurl-agent-transact-iam-plan-${{ github.run_id }}
          path: ${{ env.ROOT }}

      - name: Verify commit, digest, and plan contract
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ needs.plan.outputs.commit_sha }}" ]] || {
            echo "::error::Apply checkout does not match planned commit."; exit 1;
          }
          [[ "$(cat commit-sha.txt)" == "${{ needs.plan.outputs.commit_sha }}" ]] || {
            echo "::error::Artifact commit does not match planned commit."; exit 1;
          }
          [[ "$(cat planned-at-epoch.txt)" == "${{ needs.plan.outputs.planned_at_epoch }}" ]] || {
            echo "::error::Artifact creation time does not match plan-job output."; exit 1;
          }
          sha256sum --check tfplan.sha256
          [[ "$(sha256sum tfplan | awk '{print $1}')" == "${{ needs.plan.outputs.plan_sha256 }}" ]] || {
            echo "::error::Saved plan digest does not match plan-job output."; exit 1;
          }
          # The binary plan is hash-pinned because terraform apply consumes it.
          # tfplan.json is the plan-job-derived contract view; it cannot alter apply.
          ../../../scripts/check-qurl-agent-transact-iam.py plan tfplan.json --expected-action create

      - name: Initialize staged state
        working-directory: ${{ env.ROOT }}
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          terraform init -reconfigure -input=false

      - name: Re-prove policy is absent and apply exact saved plan
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          # PutRolePolicy has no create-if-absent condition. Keep this check in
          # the same shell immediately before apply to minimize the unavoidable
          # IAM compare-and-swap gap; the workflow concurrency lock excludes the
          # normal production writer.
          role_arn=$(aws iam get-role --role-name "$ROLE_NAME" --query Role.Arn --output text)
          [[ "$role_arn" == "$ROLE_ARN" ]] || {
            echo "::error::Target role no longer matches the reviewed ARN."
            exit 1
          }

          read -r table_status table_arn < <(aws dynamodb describe-table \
            --table-name "$TABLE_NAME" \
            --query '[Table.TableStatus,Table.TableArn]' \
            --output text)
          [[ "$table_status" == "ACTIVE" && "$table_arn" == "$TABLE_ARN" ]] || {
            echo "::error::Target table is no longer the reviewed ACTIVE table."
            exit 1
          }

          set +e
          aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" \
            >/tmp/existing-policy.json 2>/tmp/existing-policy.err
          policy_rc=$?
          set -e
          if [[ $policy_rc -eq 0 ]]; then
            echo "::error::$POLICY_NAME appeared after planning; refusing overwrite."
            exit 1
          fi
          grep -q 'NoSuchEntity' /tmp/existing-policy.err || {
            sed 's/^/AWS: /' /tmp/existing-policy.err >&2
            echo "::error::Could not re-prove policy absence."
            exit 1
          }
          terraform apply -input=false -lock-timeout=5m -no-color tfplan

      - name: Verify live policy, state ownership, and convergence
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" \
            --query PolicyDocument --output json > live-policy.json
          ../../../scripts/check-qurl-agent-transact-iam.py policy live-policy.json | tee live-policy-summary.json

          terraform state list | tee state-list.txt
          [[ "$(cat state-list.txt)" == 'aws_iam_role_policy.qurl_agent_keys_transact' ]] || {
            echo "::error::Staging state does not contain exactly the reviewed policy resource."; exit 1;
          }

          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -no-color \
            -out=post-apply.tfplan | tee post-apply-plan.txt
          plan_rc=${PIPESTATUS[0]}
          set -e
          [[ $plan_rc -eq 0 ]] || { echo "::error::Post-apply plan was not a no-op (exit $plan_rc)."; exit 1; }
          terraform show -json post-apply.tfplan > post-apply-plan.json
          ../../../scripts/check-qurl-agent-transact-iam.py plan post-apply-plan.json --expected-action no-op

      - name: Upload sanitized convergence evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qurl-agent-transact-iam-evidence-${{ github.run_id }}
          path: |
            terraform/staged/qurl-agent-transact-iam/live-policy.json
            terraform/staged/qurl-agent-transact-iam/live-policy-summary.json
            terraform/staged/qurl-agent-transact-iam/state-list.txt
            terraform/staged/qurl-agent-transact-iam/post-apply-plan.txt
            terraform/staged/qurl-agent-transact-iam/post-apply-plan.json
          retention-days: 14
          if-no-files-found: error

      - name: Summarize remaining hard gate
        run: |
          {
            printf '%s\n' '## Staged IAM policy converged' ''
            printf -- "- Policy: \`%s\`\n" "$POLICY_NAME"
            printf -- "- Role: \`%s\`\n" "$ROLE_ARN"
            printf -- "- Table: \`%s\`\n" "$TABLE_ARN"
            printf '%s\n' '' '> Policy installed; effective-permission simulation pending; transactional writer NOT authorized for rollout.' ''
            printf '%s\n' 'A privileged operator must link the exact allow/deny simulation evidence on [nhp#1952](https://github.com/layervai/nhp/issues/1952) before [qurl-service#1037](https://github.com/layervai/qurl-service/pull/1037) may deploy.'
          } >> "$GITHUB_STEP_SUMMARY"
