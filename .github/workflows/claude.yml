name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@593d7a5c4e0073569f74772c2b7b64c30ec14707 # v1.0.141
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Keep comment-triggered analysis on the same proven model as the
          # automatic PR review. The action's implicit default may select the
          # 1M-context variant, which this repository credential cannot start.
          # scripts/check-claude-model-lockstep.py enforces this coupling.
          # Do not add extra allowed tools by default: the action's base GitHub
          # tools are sufficient here. Its contents, pull-request, and issue
          # permissions are read-only; id-token: write permits OIDC token
          # minting but does not grant repository writes. The automatic
          # review workflow adds its narrow gh command allowlist because its
          # explicit prompt needs PR inspection.
          claude_args: '--model claude-opus-4-8'
