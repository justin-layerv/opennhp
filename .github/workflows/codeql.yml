name: CodeQL

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6am UTC

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.5'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # Reference internalauth/go.mod (which exists today as a
          # pure-stdlib module) rather than internalauth/go.sum
          # (which is empty until a non-stdlib dep is added).
          # actions/setup-go can fail with "Some specified paths were
          # not resolved" when a literal cache path doesn't exist, so
          # pointing at go.mod keeps the cache key live for the
          # pure-stdlib state. CAVEAT: this catches direct-dep
          # changes (a `go get foo@v1.2.4` updates go.mod's require
          # line so the cache busts), but misses indirect/transitive-
          # only churn — a `go mod tidy` that promotes/demotes an
          # indirect dep updates only go.sum. The PR that adds the
          # first non-stdlib dep MUST flip both lines below from
          # go.mod to go.sum so indirect-dep churn busts the cache
          # too. Mirrors the same caveat in the dependabot-go-tidy.yml
          # block.
          cache-dependency-path: |
            nhp/go.sum
            internalauth/go.mod
            endpoints/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build Go code
        if: matrix.language == 'go'
        env:
          KBS_SKIP_INIT: "1"
        run: |
          cd nhp && go build ./...
          cd ../internalauth && go build ./...
          cd ../endpoints && go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/language:${{ matrix.language }}"
