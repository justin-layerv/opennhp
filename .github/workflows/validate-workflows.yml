name: Validate GitHub Actions Workflows

on:
  push:
    branches: [ "main" ]
    # ISSUE_TEMPLATE/** stays in the trigger set (though schema
    # validation moved to validate-issue-templates.yml) because
    # scripts/check-scope-drift.sh reads bug_report.yml's Component
    # dropdown — a rename there without a CLAUDE.md update must still
    # re-run scope-drift. validate-issue-templates.yml runs in parallel
    # on the same paths; the two checks are orthogonal.
    paths: &validate_paths
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/actions/sandbox-live-env-lock/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "CLAUDE.md"
      - "scripts/check-scope-drift.sh"
      - "scripts/check-go-version-drift.sh"
      - "scripts/check-traefik-grpc-pin.sh"
      - "scripts/check-claude-model-lockstep.py"
      - "scripts/check-disable-agent-validation.sh"
      - "scripts/check-smoke-tier-filter-coverage.sh"
      # run-smoke.sh now owns the tier -> RUN_FILTER mapping that
      # check-smoke-tier-filter-coverage.sh parses, so an edit to it must
      # re-run that fence.
      - "scripts/run-smoke.sh"
      - "scripts/check-cert-cleanup-log-gate-unique.sh"
      - "scripts/check-cleanup-event-type-lockstep.sh"
      # Base-image pebble purge (#2800/#2804): watch the lint so an edit to it
      # re-fires. Edits to ANY Dockerfile are caught by the docker/Dockerfile*
      # glob below — the same discovery the lint runs over, so a brand-new
      # ubuntu Dockerfile fires this on the PR that introduces it. The paired
      # fixture test rides tests/scripts/** below.
      - "scripts/check-base-image-pebble-purge.sh"
      # Ubuntu base digest lockstep (#2800): the pebble lint's sibling. Same
      # docker/Dockerfile* + tests/smoke/** discovery fires it on any Dockerfile
      # edit; watch the lint itself so an edit to it re-fires. Paired fixture
      # test rides tests/scripts/** below.
      - "scripts/check-ubuntu-base-digest-drift.sh"
      # Every application-image matrix runtime must use the same bounded
      # official-source -> Azure apt fallback. Watch the helper explicitly;
      # Dockerfiles and the fixture directory are covered below.
      - "scripts/check-ubuntu-apt-mirror-fallback.sh"
      - "docker/ubuntu-apt-install-with-fallback.sh"
      - "scripts/check-lockdown-body-drift.sh"
      - "scripts/check-paths-filter-coverage.py"
      - "scripts/print-dispatch-ref-error.sh"
      - "scripts/check-image-tag-writer-allowlist.sh"
      - "scripts/check-image-tag-writer-allowlist.py"
      - "scripts/check-control-global-routing.sh"
      - "scripts/check-control-vpc-cidr-overlap.sh"
      # Sandbox cell1 VPC relocation preflight: the script talks to live AWS, so
      # only its fixture test runs here — driven by the fake `aws` under
      # tests/fixtures/, which is watched so an edit to either side re-fires it.
      # The test itself rides tests/scripts/** below.
      - "scripts/check-sandbox-cell1-vpc-relocation-preflight.sh"
      - "tests/fixtures/sandbox-cell1-vpc-relocation/**"
      # build-and-push.yml's concurrency contract: a dispatch carrying a
      # correlation_id has a parent pipeline blocking on it, so it must not share
      # a cancellable lane with ad-hoc dispatches. The workflow it inspects rides
      # .github/workflows/** above and its fixture test rides tests/scripts/**
      # below, so only the lint itself needs an entry.
      - "scripts/check-dispatch-concurrency-isolation.sh"
      - "scripts/capture-control-update-state.sh"
      - "scripts/check-control-aws-identity.sh"
      - "scripts/check-live-main-ref.sh"
      - "scripts/check-no-checkout-credentials.sh"
      - "scripts/ensure-control-otp-pepper.sh"
      - "scripts/verify-control-otp-pepper.sh"
      - "scripts/verify-control-sandbox-first-apply.sh"
      - "scripts/verify-control-sandbox-live-boundary.sh"
      - "docs/evidence/connector-authority/v1/**"
      - "scripts/check-asp-and-ac-id-lockstep.sh"
      # qURL v2 revocation-latency SLO lockstep (#2817): trigger on the script
      # and on BOTH source-of-truth sites it compares so a one-sided edit to the
      # Go SLO const or the TF alarm threshold re-runs the check at PR time.
      # Neither source file is watched elsewhere in this anchor, so they must be
      # here or a Go-only / TF-only edit would skip the lint. The paired fixture
      # test rides tests/scripts/** below.
      - "scripts/check-revocation-slo-lockstep.sh"
      - "endpoints/server/revocation_retry.go"
      - "terraform/modules/monitoring/main.tf"
      # AC L3 netlink conntrack pool-size lockstep (#2940): trigger on the
      # script and on every Go/TF source it compares so worker/socket ratio
      # changes cannot leave stale operator-facing Terraform bounds/docs.
      - "scripts/check-l3-conntrack-pool-lockstep.sh"
      - "endpoints/ac/expiry_scheduler.go"
      - "endpoints/ac/expiry_conntrack_flusher.go"
      - "terraform/modules/ac/variables.tf"
      - "terraform/variables.tf"
      # Do NOT fold these two into the terraform/environments/<env>/** globs
      # below, even though those globs already match them. The L3 conntrack
      # pool-size lockstep asserts both are listed *by name* here
      # (tests/scripts/check-l3-conntrack-pool-lockstep_test.sh, "validate-workflows
      # trigger paths and step cover lockstep sources"), so that its trigger is
      # pinned to its own sources rather than inherited from a glob some other
      # lint owns and could later narrow. Deleting them as redundant turns that
      # fixture red — which is how this comment came to exist.
      - "terraform/environments/sandbox/variables.tf"
      - "terraform/environments/prod/variables.tf"
      - "terraform/modules/compute/variables.tf"
      - "terraform/modules/compute/main.tf"
      - "terraform/modules/compute/outputs.tf"
      - "terraform/modules/compute/lambda/keygen/**"
      - "terraform/modules/ecr/main.tf"
      # eBPF load-path + FilterMode lockstep (#2810, #2812, #2815): trigger on
      # the script and on the source-of-truth sites it compares that aren't
      # watched elsewhere: Go object-path consts (ebpfegine.go), Go FilterMode
      # enum (config.go), Makefile EBPF_OBJ_* paths, the local compose mount/load
      # shape, and the local AC bpffs startup helper. The Dockerfile guards ride the docker/Dockerfile* globs below,
      # and tests/smoke/ssm_probe.go rides tests/smoke/** below; the script
      # header inventories every site. Every eBPF fixture test in this group
      # rides tests/scripts/** below, so only the scripts are listed here.
      - "scripts/check-ebpf-load-path-lockstep.sh"
      # eBPF arch lockstep (#2816): the AC image build platform must stay
      # in lockstep with terraform/modules/ac/main.tf's launch-template
      # instance families. The fixture test mutates both sides so extractor
      # regressions do not silently green.
      - "scripts/check-ac-ebpf-arch-lockstep.sh"
      - "scripts/check-ebpf-toolchain-pin-lockstep.sh"
      - "scripts/install-ebpf-toolchain.sh"
      - "scripts/check-ebpf-committed-object-drift.sh"
      # eBPF required-check ruleset manager (#2861): re-run the fence when the
      # ruleset config-as-code it applies changes. Its script and test already
      # ride the .github/scripts/** and tests/scripts/** globs above.
      - ".github/rulesets/**"
      - "endpoints/ac/ebpf/ebpfegine.go"
      - "endpoints/ac/config.go"
      - "docker/docker-compose.yaml"
      - "docker/start-ac.sh"
      - "terraform/modules/ac/main.tf"
      - "Makefile"
      - "scripts/check-relay-dmz-live.py"
      - "scripts/verify-relay-dmz-flow-evidence.py"
      - "scripts/check-frps-az-suffixes-validation-drift.sh"
      - "scripts/check-packer-failure-surfaced.sh"
      - "scripts/check-control-leg-surfaced.sh"
      # The gate file is not a script, but it is the input every Control deploy
      # reads. An edit to it must re-fire the contract test here, because a gate
      # file that no longer validates is how an automatic apply reaches
      # Terraform with the dark defaults. Only the JSON needs listing — the
      # validator beside it rides .github/scripts/** above.
      - ".github/control-sandbox-runtime-gates.json"
      - "scripts/check-app-image-line-rendered.sh"
      - "scripts/ssm-read-optional.sh"
      - "scripts/check-golden-vectors.sh"
      # The conformance-parity check's fixture test runs in this workflow (the
      # script itself runs in qurl-v2-conformance-parity.yml, which needs a
      # Go/Node toolchain). Watch the script so an edit re-fires its shellcheck +
      # the fixture test here; the test file rides tests/scripts/** below.
      - "scripts/check-conformance-parity.sh"
      # The agent-reg upstream-drift check's fixture test runs in THIS workflow
      # (its live cross-repo fetch runs in agent-reg-vector-drift.yml). Watch the
      # script so an edit re-fires its shellcheck + the fixture test here; the
      # test file rides tests/scripts/** below.
      - "scripts/check-agent-reg-vector-drift.sh"
      # Same split for the Hub LST proof-KAT drift check: its fixture test runs
      # in THIS workflow, its live cross-repo fetch in hub-lst-kat-drift.yml.
      - "scripts/check-hub-lst-kat-drift.sh"
      # All cross-language golden-vector files are listed so a one-sided edit to
      # ANY of them fires the Go↔TS cross-check (scripts/check-golden-vectors.sh)
      # — including the Go-side files, which the path-scoped js-agent.yml never
      # sees. Keep these entries in sync with the PAIRS array in that script.
      - "endpoints/js-agent/test/fingerprint.test.ts"
      - "nhp/utils/crypto_fingerprint_test.go"
      - "endpoints/js-agent/test/kdf.test.ts"
      - "nhp/core/kdf_test.go"
      # Hub identity seeder: the Node test reads the Go-generated NHP knock
      # vector and fences the Lambda/Terraform boundary. Watch every input so
      # source, packaging, runtime, or vector drift cannot skip the test.
      - "endpoints/js-agent/test/testdata/knock.json"
      - "terraform/modules/connector-authority-foundation/hub_keygen.tf"
      - "terraform/modules/connector-authority-foundation/lambda/hub-keygen/**"
      - "terraform/modules/qurl-reverse-tunnel-server/variables.tf"
      - "terraform/modules/qurl-service/main.tf"
      - "terraform/modules/custom-domain-cert/lambda/**"
      - "tests/scripts/**"
      # Lambda boto3/botocore pin lockstep (#3320/#3323):
      # check-lambda-boto-pin-lockstep.sh fences that every boto3==/botocore==
      # pin across the terraform/modules/*/lambda requirement files — installed
      # into ONE shared env by build-and-push.yml's "Test Lambdas" job — stays on
      # a single version. Watch the lint itself and every requirements*.txt it
      # scans so a pin edit in ANY such module (including a brand-new one) re-runs
      # it. custom-domain-cert/lambda/** above already covers that module; this
      # glob widens coverage to acme-cert, status-page, and future modules. The
      # paired fixture test rides tests/scripts/** above.
      - "scripts/check-lambda-boto-pin-lockstep.sh"
      - "terraform/modules/*/lambda/requirements*.txt"
      # The relay plan checker imports this real-plan schema slice directly;
      # a fixture-only recapture must run the same contract tests.
      - "tests/fixtures/relay-dmz-plan/**"
      # The cell0 source-fence checker imports the exact Terraform 1.14.3
      # NLB/listener provider envelope; a fixture-only recapture must rerun it.
      - "tests/fixtures/cell0-udp-source-fence/**"
      # The Control source-fence checker imports the exact Terraform 1.14.3
      # NLB/listener provider envelope; a fixture-only recapture must rerun it.
      - "tests/fixtures/control-hub-source-fence/**"
      # Globs, not an enumerated list, so a brand-new Dockerfile fires
      # validate-workflows on the PR that introduces it — matching the recursive
      # discovery model of check-base-image-pebble-purge.sh and
      # check-go-version-drift.sh. The first entry covers top-level docker/
      # Dockerfiles (`*` doesn't cross `/`); the second covers nested ones (e.g. a
      # future docker/web-app/Dockerfile) so the lint's recursive find can't see a
      # Dockerfile this trigger doesn't. (tests/smoke/** below already recurses.)
      - "docker/Dockerfile*"
      - "docker/**/Dockerfile*"
      - "nhp/go.mod"
      - "internalauth/go.mod"
      - "endpoints/go.mod"
      - "examples/server_plugin/go.mod"
      - "tests/e2e/go.mod"
      - "tests/local/go.mod"
      - "tests/smoke/**"
      - "tests/lints/disable-agent-validation/**"
      # Offline golangci config validation (replaces the action's
      # network-fetching `config verify`). Watch every input: the config it
      # validates, the vendored schema it validates against, and the lint
      # plus its fixtures. The version pin it reads lives in
      # ubuntu-build.yml, and its pinned requirements file rides
      # .github/scripts/** — both already covered above.
      - ".golangci.yml"
      - ".github/schemas/**"
      - "scripts/check-golangci-config-schema.py"
      - "tests/lints/golangci-config-schema/**"
      - "tests/lints/paths-filter-coverage/**"
      - "tests/lints/dispatch-ref-error/**"
      - "tests/lints/smoke-tier-filter-coverage/**"
      # SIGPIPE-under-pipefail membership fences for the packer + eBPF lints:
      # watch each fixture dir so an edit re-fires its shellcheck + fixture
      # run in the job below.
      - "tests/lints/packer-failure-surfaced/**"
      - "tests/lints/ebpf-load-path-lockstep/**"
      - "tests/lints/ubuntu-apt-mirror-fallback/**"
      - "tests/lints/lockdown-body-drift/**"
      - "tests/lints/verify-image-attestation/**"
      # Blue/green post-switch restart classification. Both scripts it drives
      # ride .github/scripts/** above; the fixture dir needs its own entry
      # because no glob here reaches tests/lints/.
      - "tests/lints/blue-green-restart-classification/**"
      # ...and the corpus it shares with tests/smoke's Go classifier, so a
      # corpus-only edit re-runs this side of the drift fence too.
      - "tests/fixtures/nhp-server-restart-evidence/**"
      # Same again one level earlier: the journal corpus both COLLECTORS must
      # build the same report from (Part E here, TestRestartEvidenceJournalCorpus
      # in tests/smoke).
      - "tests/fixtures/nhp-server-restart-journals/**"
      - ".github/actions/verify-image-attestation/**"
      # The watchdog script itself rides .github/scripts/** above.
      - "tests/lints/attestation-verify-watchdog/**"
      # Two suites drive scripts/trigger-prod-deploy.sh: the absent-vs-unreadable
      # SSM split plus the --json failure contract, and the relay activation
      # decision. Only the script needs an entry — it has no other trigger here,
      # while the relay suite's fixture test rides tests/scripts/** below and the
      # resolver is already listed below for its own suite. The SSM fixtures do
      # need their own entry: they live under tests/lints/, which no glob reaches.
      - "tests/lints/ssm-read-failure/**"
      - "scripts/trigger-prod-deploy.sh"
      # Inputs of the Python fences wired into the job below. Each fence compares
      # two surfaces, so it has to fire when *either* moves — a fence watching
      # only its own file is a fence that never runs on the edit that breaks it.
      # The fences themselves ride tests/scripts/** above, and their workflow and
      # .github/scripts inputs ride the .github globs above; this is the remainder.
      #
      # This list came from *running* each fence under an audit hook that records
      # every file it opens, not from reading the source for quoted paths. The
      # reading missed six of them, including three Go files and two cell1
      # siblings reached via `path.parent / ...`, because a static scan cannot
      # resolve a path the test composes at runtime.
      #
      # UDP edge readiness metrics: the probe, the Go constants it measures
      # against, and the verifier scripts the readiness workflow runs.
      - "endpoints/cmd/udp-edge-probe/main.go"
      - "endpoints/server/constants.go"
      - "nhp/core/constants.go"
      - "scripts/udp-edge-flood.py"
      - "scripts/verify-udp-edge-overlap.py"
      - "scripts/verify-udp-edge-readiness.py"
      - "terraform/modules/compute/udp_edge_metrics.py"
      # The server and relay surfaces the UDP proof orchestrator contract reads.
      - "endpoints/relay/relay.go"
      - "endpoints/server/relay.go"
      - "endpoints/server/msghandler.go"
      - "endpoints/server/udpserver.go"
      - "nhp/core/packet.go"
      # Cell-registration parity reads every file in each cell root, not just
      # main.tf. sandbox and prod already ride their own /** globs above; cell1
      # gets the same treatment rather than an enumerated list that would go stale
      # the moment the fence reads one more sibling.
      - "terraform/environments/sandbox-cell1/**"
      # A glob, not a file list: the runtime-attestation fence exists to catch
      # drift in the SHA-256-pinned collector asset or the launch-template binding
      # beside it, and an enumerated list would miss a newly added file — the
      # thing it is looking for.
      - "terraform/modules/runtime-attestation-store/**"
      # The FRPS user-data template the same fence reads for its boot-capture
      # binding.
      - "terraform/modules/qurl-reverse-tunnel-server/user_data.sh.tpl"
      - "terraform/modules/compute/user_data.sh.tpl"
      - "terraform/environments/prod/**"
      - "terraform/environments/sandbox/**"
      - "terraform/modules/ac/variables.tf"
      - "terraform/variables.tf"
      - "terraform/main.tf"
      - "terraform/resources.tf"
      - "endpoints/server/staticplugins/agent/plugin.go"
      - "endpoints/server/resource_lookup.go"
      - "docker/nhp-server/etc/config.toml"
      - "endpoints/server/main/etc/config.toml"
  pull_request:
    # qurl-v2 carries the pre-E5 eBPF gates (#2810/#2816), so PRs against it
    # must run these workflow/Terraform lockstep checks before merge too.
    branches: [ "main", "qurl-v2" ]
    paths: *validate_paths

# Restrict default permissions for security
env:
  TF_VERSION: '1.14.3'

permissions:
  contents: read

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin actionlint to a specific release so CI is reproducible and the
      # step is not at the mercy of a third-party action's tag mutation.
      # shellcheck is pre-installed on ubuntu-latest runners.
      - name: Install actionlint
        env:
          # 1.7.12 is the minimum version that lifts the old "max 10 inputs
          # for workflow_dispatch" rule — GitHub raised that limit upstream
          # and actionlint tracked the change. Bumping if you bump this is
          # fine; just update the sha256 from the release's checksums file.
          ACTIONLINT_VERSION: "1.7.12"
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the official GitHub release
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -version
          shellcheck --version

      # Run actionlint directly (no reviewdog wrapper) so:
      #   1. We scan every workflow on every push/PR, not just the diff —
      #      accumulated drift in untouched files cannot hide.
      #   2. Any finding fails the job immediately with the exact file+line
      #      in the step log. There is no annotation cap (reviewdog hit
      #      GitHub's 50/run limit and failed the job on volume alone — see
      #      #987/#988 for the incident that prompted this).
      #   3. No third-party action in the path between "lint fails" and
      #      "CI fails".
      - name: Run actionlint with shellcheck
        run: |
          actionlint -color -shellcheck "$(command -v shellcheck)" .github/workflows/*.yml

      # Pin Python so PyYAML resolution is reproducible independent of
      # the runner image's default Python. scripts/check-scope-drift.sh
      # (below) parses both bug_report.yml and CLAUDE.md via PyYAML.
      # Issue-form schema validation moved to its own workflow
      # (.github/workflows/validate-issue-templates.yml) which shims
      # to the ops-routines-workflows reusable.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          set -euo pipefail
          python3 -m pip --version
          # Pinned: these back structural fences, and a fence whose verdict can
          # change without a code change is not a fence. jsonschema backs
          # check-golangci-config-schema.py, which replaced the
          # network-fetching `config verify`.
          python3 -m pip install --no-cache-dir \
            -r .github/scripts/validate-workflows-requirements.txt

      # golangci-lint-action's built-in `config verify` fetched its JSON
      # schema from golangci-lint.run on every run; a timeout there reds all
      # four `lint (...)` legs at once in 7-15s. The action now runs with
      # `verify: false` and this validates .golangci.yml against a vendored
      # schema offline instead — which is not merely equivalent but load
      # bearing: `golangci-lint run` silently ignores unknown top-level and
      # nested config keys, so a typo'd key reads as an enabled setting doing
      # nothing. Fixtures run first so a regex/validator regression surfaces
      # against known inputs before the real config.
      - name: Test + check golangci config against the vendored schema
        run: |
          shellcheck tests/lints/golangci-config-schema/run-fixtures.sh
          bash tests/lints/golangci-config-schema/run-fixtures.sh
          python3 scripts/check-golangci-config-schema.py

      # FIRST of the tests.scripts.* steps, deliberately. #3799 deleted seven
      # modules but left the step running them; #3801 removed that step after
      # main went red. A stale reference does not merely fail its own step —
      # unittest's loader turns the missing module into a failing test, the
      # step exits 1, and every LATER step in this job is skipped. So a fence
      # placed after another tests.scripts.* step could be preempted by the
      # very ModuleNotFoundError it exists to explain. It needs nothing but the
      # checkout and PyYAML above, so it goes here; the test asserts this
      # ordering so a future insertion cannot quietly undo it.
      - name: Fence workflow references to tests/scripts modules
        run: python3 -m unittest -v tests.scripts.test_workflow_python_modules_exist

      # Both Claude entry points must use the same proven action SHA and explicit
      # model. Automatic review must remain a default-branch-trusted
      # pull_request_target, same-repo, non-bot, ready-candidate terminal gate
      # with per-PR cancellation. PR-only `@claude` commands must enter through
      # the default-branch issue_comment event and fail closed before immutable
      # head checkout. Without this fence, a PR-merge-ref workflow can consume
      # secrets before any job guard or checkout preflight runs.
      # These steps follow
      # Install PyYAML because the guard uses the composed YAML node tree to
      # enforce action-step structure and scalar style without indentation
      # heuristics.
      - name: Test Claude workflow contract fixtures
        run: python3 tests/scripts/test_check_claude_model_lockstep.py

      - name: Check Claude workflow contracts
        run: python3 scripts/check-claude-model-lockstep.py

      # resolve-app-image-required_test.sh verifies that the relay image's
      # hand-maintained path list covers the actual Go import surface. Pin and
      # warm the endpoints module here so that regression fence does not depend
      # on ubuntu-latest's incidental preinstalled Go version or a cold cache.
      - name: Set up Go for relay dependency lockstep
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: endpoints/go.mod
          cache-dependency-path: endpoints/go.sum

      - name: Warm endpoints Go module cache
        working-directory: endpoints
        run: go mod download

      # Run the scope-drift fixture tests BEFORE the real check. If the
      # extractors regress in a way that parses both real files to a
      # matching empty set, the real check would pass false-positive
      # green. Running the fixture tests first catches parser
      # regressions against known inputs before the real inputs run.
      - name: Test check-scope-drift.sh
        run: bash tests/scripts/check-scope-drift_test.sh

      # Prevent drift between the Component dropdown in the bug-report
      # form and the Scopes table in CLAUDE.md. The bug form tells
      # reporters which component to pick; CLAUDE.md is the source of
      # truth for valid commit scopes. If they disagree, either the
      # form offers a scope that won't pass commit-convention
      # enforcement, or CLAUDE.md lists a scope reporters can't pick.
      - name: Check scope drift (bug form ↔ CLAUDE.md)
        run: bash scripts/check-scope-drift.sh

      - name: Test check-go-version-drift.sh
        run: bash tests/scripts/check-go-version-drift_test.sh

      - name: Check Go version drift
        run: bash scripts/check-go-version-drift.sh

      # Go dependency security fence: Dockerfile.ac.aws rebuilds the current
      # Traefik patch from checksum-pinned source with explicit grpc-go and
      # x/mod/x/text floors. Keep every literal non-overridable and prove the
      # produced binary is inspected.
