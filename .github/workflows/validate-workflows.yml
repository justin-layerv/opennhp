        run: python3 scripts/check-paths-filter-coverage.py

      # Contract tests for scripts/print-dispatch-ref-error.sh
      # (the message body of build-and-push.yml's dispatch-ref
      # guard). Pin the load-bearing strings — gh command,
      # refs/heads/main requirement, #1121 cross-reference — so
      # a regression that drops them silently degrades the
      # operator's first explanation of why the dispatch failed.
      - name: Test dispatch-ref-error fixtures
        run: bash tests/lints/dispatch-ref-error/run-fixtures.sh

      # Lock the #1334 Phase 1 attestation-gate composite action's bash
      # contract (audit never blocks; enforce blocks only on a real
      # no-attestation verdict; infra/tooling errors fail OPEN even under
      # enforce; mode normalization). The action can't be exercised pre-merge
      # via its `uses:`, so this stubbed-PATH fixture is the regression lock.
      - name: Test verify-image-attestation fixtures
        run: |
          shellcheck tests/lints/verify-image-attestation/run-fixtures.sh
          bash tests/lints/verify-image-attestation/run-fixtures.sh

      # Lock the parser half of the Attestation Verify Watchdog
      # (attestation-verify-watchdog.yml): the per-lane error/fail/pass
      # classification that decides whether the #1334 verify gate is silently
      # failing open. A miss means the watchdog stays quiet while the gate
      # verifies nothing under enforce — so this fixture pins the verdict against
      # the real captured ATTEST_RESULT marker wording. shellcheck the script too
      # (actionlint's -shellcheck only covers workflow-embedded scripts).
      - name: Test attestation-verify-watchdog fixtures
        run: |
          shellcheck .github/scripts/scan-attestation-soak.sh tests/lints/attestation-verify-watchdog/run-fixtures.sh
          bash tests/lints/attestation-verify-watchdog/run-fixtures.sh

      # Lock the absent-vs-unreadable split in scripts/trigger-prod-deploy.sh:
      # a read that errors is neither "absent" nor "corrupted", and reporting it
      # as either sends the release operator chasing a fault that isn't there.
      # These fixtures *execute* the failure paths against fake aws/gh shims,
      # because the first attempt at this fix recorded the failure inside a
      # command substitution — a subshell — so the gate was dead code that
      # `bash -n` and `shellcheck` both passed clean.
      - name: Test ssm-read-failure fixtures
        run: |
          shellcheck scripts/trigger-prod-deploy.sh tests/lints/ssm-read-failure/run-fixtures.sh
          bash tests/lints/ssm-read-failure/run-fixtures.sh

      # The blue/green post-switch crash gate's classification: what a non-zero
      # systemd NRestarts counter on an nhp-server instance is allowed to
      # conclude. It used to conclude "application crash" from the counter
      # alone and name the PR #1096 panic class unconditionally. Sandbox deploy
      # 31340465407 tripped it on `Main process exited, code=exited,
      # status=125/n/a` — docker's own exit code, the awslogs driver failing to
      # create a CloudWatch log stream, container never started, healthy again
      # 6 s later. There was no panic. The red run was the cheap part: the
      # failing `validate` job skipped `scale-down-previous` and left
      # `safe_to_release=false`, retaining the shared sandbox lock for its full
      # four-hour TTL.
      #
      # Wired HERE and not only in `make lint` — no CI workflow runs that
      # target, so a Makefile-only fixture never executes on a PR (the same gap
      # #2817 closed for the revocation-SLO lockstep). The suite drives the
      # classifier, then the real verify-knock-ready.sh end to end against a
      # fake AWS CLI, then the on-instance probe script against real systemd
      # journal text — a classifier the gate never consults would pass the
      # first of those three and fail the second.
      - name: Test blue/green restart-classification fixtures
        run: |
          shellcheck .github/scripts/verify-knock-ready.sh \
            .github/scripts/classify-nhp-server-restart-evidence.sh \
            tests/lints/blue-green-restart-classification/run-fixtures.sh
          bash tests/lints/blue-green-restart-classification/run-fixtures.sh

      # The relay activation decision in that same script (#3747, #3755). Prod's
      # relay SSM tag does not exist until the activating apply creates it, so
      # reading the live parameter alone cannot tell "relay is genuinely dark"
      # from "this promote is what activates it" — and the script once printed
      # `-f deploy_relay=false` on the very release that activates the relay,
      # which would create the parameter and never advance it: the relay ships
      # dark behind a green promote. The suite can't run the whole script offline
      # (SSM/ECR/STS), so it extracts the decision block verbatim and drives it
      # with controlled inputs, with a canary that fails loudly if the extraction
      # markers stop matching rather than passing on zero assertions.
      #
      # Wired here because it lived only in `make lint-prod-deploy-relay-activation`,
      # which no CI workflow runs — the same gap #2817 closed for the
      # revocation-SLO lockstep. Mirrors that Makefile target command-for-command
      # so the local and CI runs cannot drift; that is why the script's shellcheck
      # repeats the step above rather than relying on it.
      - name: Test prod-deploy relay activation fixtures
        run: |
          shellcheck scripts/trigger-prod-deploy.sh tests/scripts/trigger-prod-deploy-relay-activation_test.sh
          bash tests/scripts/trigger-prod-deploy-relay-activation_test.sh

      # build-and-push.yml's concurrency contract. A workflow_dispatch carrying a
      # correlation_id has a parent pipeline blocking on that exact run, so it
      # must not share a cancellable lane with ad-hoc dispatches: the group has to
      # be discriminated by correlation_id and cancel-in-progress must exclude it.
      # When both kinds shared one cancellable lane, any ad-hoc sandbox deploy
      # silently killed the scheduled-release build; the pipeline then failed
      # after a ~85-minute wait with no red build to point at, and prod stopped
      # receiving promotions for weeks. Nothing but this lint keeps the two
      # concurrency expressions honest — and it, like the two below, was reachable
      # only through a `make lint-*` target that no CI workflow runs.
      - name: Test + check dispatch concurrency isolation
        run: |
          shellcheck scripts/check-dispatch-concurrency-isolation.sh tests/scripts/check-dispatch-concurrency-isolation_test.sh
          bash tests/scripts/check-dispatch-concurrency-isolation_test.sh
          bash scripts/check-dispatch-concurrency-isolation.sh

      # Sandbox cell1 VPC relocation preflight. Only the fixture test runs here:
      # the script itself reads live AWS (EC2/ELB/ASG state for the source VPC),
      # so the suite drives it against the recorded `aws` responses under
      # tests/fixtures/sandbox-cell1-vpc-relocation/. That makes the fixture the
      # only automated check that the phase gating and the account/region/CIDR
      # guards still hold before an operator points this at a real relocation.
      - name: Test sandbox cell1 VPC relocation preflight fixtures
        run: |
          shellcheck scripts/check-sandbox-cell1-vpc-relocation-preflight.sh tests/scripts/check-sandbox-cell1-vpc-relocation-preflight_test.sh
          bash tests/scripts/check-sandbox-cell1-vpc-relocation-preflight_test.sh

      # Terraform-side source contracts. Each compares a Terraform surface against
      # the thing that must agree with it — the cell roots against what an assigned
      # agent needs on arrival, the cell0 publisher boundary against its module, the
      # first-apply checker's normalization kinds against the apply workflow's
      # `case` allow-list, and the runtime-attestation collector against the
      # launch-template binding that SHA-256 pins it.
      - name: Test Terraform source contracts
        run: >-
          python3 -m unittest -v
          tests.scripts.test_cell_registration_parity
          tests.scripts.test_sandbox_cell0_qurl_service_publisher
          tests.scripts.test_apply_admits_every_checker_kind
          tests.scripts.test_runtime_attestation_collector

      # The Auth0 Terraform fence is deliberately NOT here. It parses the whole
      # terraform tree, so its trigger would have to be `terraform/**` — every
      # terraform PR would run this entire job to serve one fence. It lives in
      # build-and-push.yml's terraform-prod-drift-lint job instead, which already
      # runs on every PR with python-hcl2 pinned and pip-cached. Same reason the
      # ErrorCodeToError fence sits in ubuntu-build.yml: a fence belongs wherever
      # it can actually fire.

      # `cmd | grep -q` under `set -o pipefail` is a false negative on large input:
      # grep -q exits at its first match, the writer takes EPIPE, and pipefail
      # promotes that to a failed pipeline — so the check "passes" only while its
      # input stays small. This fence scans the workflows and composite actions for
      # the pattern.
      - name: Fence pipefail grep -q pipelines
        run: python3 -m unittest -v tests.scripts.test_no_pipefail_grep_q_pipelines

      # UDP edge readiness metrics: the probe, the Go-side constants it measures
      # against, and the verifier scripts the readiness workflow runs must stay in
      # agreement, or the gate reports readiness it never checked.
      - name: Test UDP edge metric contracts
        run: python3 -m unittest -v tests.scripts.test_udp_edge_metrics

      # Every module above must contribute at least one test.
      #
      # `python3 -m unittest modA modB` exits 0 as long as the *combined* suite is
      # non-empty, so one module that stops being discovered — a renamed TestCase,
      # a class demoted to plain functions — contributes nothing while its step
      # stays green. That is the failure this whole line of work is about, one
      # level down: not a step that never runs, but a step that runs and asserts
      # nothing. (A module that is renamed or deleted outright is already loud:
      # unittest turns the load error into a _FailedTest.)
      #
      # The module list is parsed out of this workflow rather than restated here,
      # so adding a fence above cannot forget to register it below — a hand-kept
      # copy would be one more thing to drift. The floor is a canary: if a
      # refactor stops the regex matching, the count collapses and this fails
      # loudly instead of vacuously passing on an empty list.
      - name: Every Python fence must contribute at least one test
        run: |
          python3 - <<'GUARD'
          import os
          import re
          import sys
          import unittest
          from pathlib import Path

          # Put the repo root on sys.path explicitly. `python3 - <<EOF` already
          # puts cwd there, but `python3 some_file.py` puts the *script's*
          # directory there instead, and with tests/ an implicit namespace package
          # that difference decides whether the fence modules import at all. It
          # matters more than it looks: a module that fails to import still loads
          # as a single _FailedTest, so every module would count as "non-empty"
          # and this guard would pass while checking nothing — the exact failure
          # it exists to catch. Pin it here rather than depend on how someone
          # invokes it later.
          sys.path.insert(0, os.getcwd())

          workflow = Path(".github/workflows/validate-workflows.yml").read_text()
          # Only names with a file behind them. The regex sees the whole workflow,
          # comments included, so a prose mention of a module-shaped name would
          # otherwise be loaded as a phantom fence and fail this step. (It did,
          # while this guard was being written.) A step naming a module that does
          # not exist is already loud on its own.
          modules = sorted(
              name
              for name in set(re.findall(r"\btests\.scripts\.[A-Za-z0-9_]+", workflow))
              if Path("tests/scripts", name.split(".")[-1] + ".py").is_file()
          )

          # Lowered from 15 to 6 after #3799 removed the attended UDP proof.
          #
          # Note the arithmetic: `modules` is filtered by is_file(), so names of
          # already-deleted modules were NEVER counted -- deleting this step's
          # names does not move the number. The count fell because #3799 deleted
          # fence FILES that OTHER, surviving steps still name; those stopped
          # qualifying.
          #
          # This floor only guards against the regex above silently matching
          # nothing. It is not an assertion about how many fences the repo ought
          # to have, so it tracks reality rather than the other way round. 6 is
          # the true current count and still catches a collapse to 0.
          FLOOR = 6
          if len(modules) < FLOOR:
              sys.exit(
                  f"found only {len(modules)} fence modules in this workflow "
                  f"(expected at least {FLOOR}) — the parse above is broken, "
                  f"not the fences: {modules}"
              )

          empty = []
          broken = []
          for module in modules:
              # A fresh loader per module: loader.errors accumulates, and a load
              # error is the one case where countTestCases() lies (it reports the
              # _FailedTest as a test).
              loader = unittest.TestLoader()
              count = loader.loadTestsFromName(module).countTestCases()
              if loader.errors:
                  broken.append(module)
                  continue
              print(f"{count:5d}  {module}")
              if count == 0:
                  empty.append(module)

          if broken:
              sys.exit(
                  "these modules failed to load, so their test count proves "
                  "nothing: " + ", ".join(broken)
              )
          if empty:
              sys.exit(
                  "these modules contribute zero tests, so the step running them "
                  "cannot fail: " + ", ".join(empty)
              )
          print(f"\nok: {len(modules)} fence modules, all non-empty")
          GUARD

      # Two cross-module lockstep contracts that surfaced as #1976
      # cutover follow-ups (PR #2141): the Go-side
      # `staticplugins/agent.PluginID` must agree with every TF
      # surface setting `ac_auth_service_id` (drift → first knock
      # ErrAuthServiceProviderNotFound, no signal), and the AC
      # module's `var.ac_id` default must agree with every env's
      # `qurl_default_ac_id` (drift → first knock
      # ErrACConnectionNotFound). The fixture suite runs first so a
      # regression in the extractors surfaces against synthetic
      # inputs with known answers before the real tree runs.
      - name: Test check-asp-and-ac-id-lockstep.sh fixtures
        run: bash tests/scripts/check-asp-and-ac-id-lockstep_test.sh

      - name: Check asp+ac_id lockstep (TF ↔ Go)
        run: bash scripts/check-asp-and-ac-id-lockstep.sh

      # qURL v2 revocation-latency SLO lockstep (#2817): the Go source-of-truth
      # const RevocationDeliveryLatencyP99SLO (endpoints/server/revocation_retry.go)
      # and the CloudWatch alarm threshold
      # (terraform/modules/monitoring/main.tf::revocation_delivery_latency_high)
      # must agree — the alarm threshold is the millisecond projection of the Go
      # SLO (MetricRevocationDeliveryLatency is recorded in ms). A one-sided edit
      # would leave the p99 alarm firing at a bound that no longer matches the
      # documented SLO — a silent observability gap. This lint was wired only into
      # `make lint-workflows`, which no CI workflow runs, so it never ran in CI
      # (#2817). The fixture suite runs first so an extractor regression surfaces
      # against synthetic inputs before the real tree runs. shellcheck both —
      # actionlint's -shellcheck only covers workflow-embedded scripts.
      - name: Test + check revocation-latency SLO lockstep (Go ↔ Terraform, #2817)
        run: |
          shellcheck scripts/check-revocation-slo-lockstep.sh tests/scripts/check-revocation-slo-lockstep_test.sh
          bash tests/scripts/check-revocation-slo-lockstep_test.sh
          bash scripts/check-revocation-slo-lockstep.sh

      # AC L3 netlink conntrack pool-size lockstep (#2940): the Go
      # source-of-truth constants (defaultWorkerCount / workers-per-socket) and
      # the four Terraform bound/doc surfaces must agree. The fixture suite runs
      # first so an extractor regression surfaces against synthetic inputs before
      # the real tree runs. shellcheck both — actionlint's -shellcheck only covers
      # workflow-embedded scripts.
      - name: Test + check L3 conntrack pool-size lockstep (Go ↔ Terraform, #2940)
        run: |
          shellcheck scripts/check-l3-conntrack-pool-lockstep.sh tests/scripts/check-l3-conntrack-pool-lockstep_test.sh
          bash tests/scripts/check-l3-conntrack-pool-lockstep_test.sh
          bash scripts/check-l3-conntrack-pool-lockstep.sh

      # eBPF object load-path lockstep (#2810, #2812, #2815): the AC loads its
      # eBPF objects from a dir+filenames that are the runtime source of truth in
      # endpoints/ac/ebpf/ebpfegine.go (bpfDir / ebpfenginename / tcObjName).
      # The Makefile EBPF_OBJ_* output paths, both AC Dockerfile build guards,
      # local compose mount/load prerequisites, local bpffs startup helper, and
      # the smoke deployed-layout probe must stay aligned or FilterMode=EBPFXDP
      # can boot-fail. The fixture suite runs first so an extractor regression
      # surfaces against synthetic inputs before the real tree runs. shellcheck
      # the helper + both lint scripts — actionlint's -shellcheck only covers
      # workflow-embedded scripts.
      - name: Test + check eBPF load-path + FilterMode lockstep (Go ↔ Makefile ↔ Dockerfiles ↔ compose/startup ↔ smoke, #2810, #2812, #2815)
        run: |
          shellcheck docker/start-ac.sh scripts/check-ebpf-load-path-lockstep.sh tests/scripts/check-ebpf-load-path-lockstep_test.sh
          bash tests/scripts/check-ebpf-load-path-lockstep_test.sh
          bash scripts/check-ebpf-load-path-lockstep.sh

      # SIGPIPE-under-pipefail regression fence for the Dockerfile-path
      # membership test in the lint above: a `printf … | grep -qxF` pipe could
      # flip a MATCH into a spurious "guard is missing <path>" drift (full
      # derivation in the fixture header). The race can't be reproduced
      # reliably in a live run, so the fixture fences it structurally and
      # unit-tests the pure-bash lines_contain replacement. shellcheck the
      # fixture too (the lint itself is covered above).
      - name: Shellcheck + test eBPF load-path membership fixtures (SIGPIPE fence)
        run: |
          shellcheck tests/lints/ebpf-load-path-lockstep/run-fixtures.sh
          bash tests/lints/ebpf-load-path-lockstep/run-fixtures.sh

      # AC eBPF architecture lockstep (#2816): Dockerfile.ac.aws compiles the
      # eBPF objects inside the AC image build, so build-and-push.yml must build
      # that image for the same platform the AC launch template runs. Today this
      # is intentionally linux/amd64-only (prod c6i.xlarge, non-prod t3.medium).
      # A future arm64 or multi-arch AC path must add a real BPF load test before
      # relaxing this gate.
      - name: Test + check AC eBPF arch lockstep (workflow ↔ Terraform, #2816)
        run: |
          shellcheck scripts/check-ac-ebpf-arch-lockstep.sh tests/scripts/check-ac-ebpf-arch-lockstep_test.sh
          bash tests/scripts/check-ac-ebpf-arch-lockstep_test.sh
          bash scripts/check-ac-ebpf-arch-lockstep.sh

      # Fixture-test the committed-object freshness guard without requiring the
      # workflow-lint job to install clang/libbpf. The real eBPF workflow runs
      # the script against the actual object after installing the toolchain.
      - name: Test eBPF committed-object drift guard (#2823)
        run: |
          shellcheck scripts/check-ebpf-toolchain-pin-lockstep.sh tests/scripts/check-ebpf-toolchain-pin-lockstep_test.sh scripts/install-ebpf-toolchain.sh tests/scripts/install-ebpf-toolchain_test.sh scripts/check-ebpf-committed-object-drift.sh tests/scripts/check-ebpf-committed-object-drift_test.sh
          bash tests/scripts/check-ebpf-toolchain-pin-lockstep_test.sh
          bash scripts/check-ebpf-toolchain-pin-lockstep.sh
          bash tests/scripts/install-ebpf-toolchain_test.sh
          bash tests/scripts/check-ebpf-committed-object-drift_test.sh

      # Fence the eBPF required-check ruleset manager (#2861): shellcheck the
      # apply/check/remove script and run its fixture suite (mock gh) so a
      # regression in its idempotency, drift detection (incl. bypass/strict
      # posture), stale-#2779 scan, or fail-closed precondition surfaces at PR
      # time. The script applies .github/rulesets/ebpf-datapath-proof-required.json
      # to live branch protection. shellcheck both — actionlint's -shellcheck only
      # covers workflow-embedded scripts.
      - name: Test eBPF required-check ruleset manager (#2861)
        run: |
          shellcheck .github/scripts/require-ebpf-datapath-check.sh tests/scripts/require-ebpf-datapath-check_test.sh
          bash tests/scripts/require-ebpf-datapath-check_test.sh

      - name: Check frps_az_suffixes validation drift (root ↔ module ↔ env-roots)
        run: bash scripts/check-frps-az-suffixes-validation-drift.sh

      # SIGPIPE-under-pipefail regression fence for need()'s notify-block
      # membership test in the packer lint below: a `printf … | grep -qE` pipe
      # could flip a MATCH into a spurious "✗ <message>" failure (full
      # derivation in the fixture header). The race can't be reproduced
      # reliably in a live run, so the fixture fences it structurally and
      # unit-tests the extracted need(). shellcheck the lint too — it was not
      # covered before (actionlint's -shellcheck only sees workflow-embedded
      # scripts).
      - name: Shellcheck + test packer-failure-surfaced fixtures (SIGPIPE fence)
        run: |
          shellcheck scripts/check-packer-failure-surfaced.sh tests/lints/packer-failure-surfaced/run-fixtures.sh
          bash tests/lints/packer-failure-surfaced/run-fixtures.sh

      # Structural fence for the notify-job wiring that surfaces Packer Build
      # AMI failures (issue #2252). packer-build is not a required check (it's
      # skipped on PRs), so a post-merge bake failure's only signal is the
      # notify Slack alert. A bake failure also skips deploy-sandbox-infra,
      # which would otherwise render a green "NHP Build successful" — exactly
      # how the #2239 AC-AMI bug stayed silent for ~12h. This fence pins
      # packer-build ∈ notify.needs + PACKER_RESULT + the failure branch.
      # Fixtures run first so an extractor/assertion regression surfaces
      # against synthetic inputs before the real tree runs.
      - name: Test check-packer-failure-surfaced.sh fixtures (issue #2252)
        run: bash tests/scripts/check-packer-failure-surfaced_test.sh

      - name: Check Packer Build AMI failures are surfaced in notify (#2252)
        run: bash scripts/check-packer-failure-surfaced.sh

      # Same family as the packer fence above, for the sandbox Control leg. The
      # Control root carries the Authority foundation and the Hub, and until the
      # deploy-sandbox-control job existed it was reachable only by attended
      # dispatch and appeared in no Slack message — so it could sit behind main
      # indefinitely with every notification still green. Two of the assertions
      # guard things nothing else would catch: that the job shares the
      # deploy-sandbox-infra writer lock (Control and cell0 must never apply
      # concurrently), and that it sources its runtime gates from the committed
      # gate file rather than the dark Terraform defaults, which would tear the
      # Hub down rather than deploy it. Fixtures run first so an
      # extractor/assertion regression surfaces against synthetic inputs.
      - name: Shellcheck + test the Control leg fence fixtures
        run: |
          shellcheck scripts/check-control-leg-surfaced.sh tests/scripts/check-control-leg-surfaced_test.sh
          bash tests/scripts/check-control-leg-surfaced_test.sh

      - name: Check the sandbox Control leg is wired and surfaced in notify
        run: bash scripts/check-control-leg-surfaced.sh

      # The gate file is the single source of truth for both the unattended
      # deploy leg and the attended control-sandbox-update.yml dispatch. These
      # cover its validation rules (which mirror that workflow's own guard) and
      # the flag emission the deploy leg depends on.
      - name: Test the committed Control runtime gate contract
        run: python3 tests/scripts/test_control_sandbox_runtime_gates.py

      # Sibling of the packer fence above, different invariant family: that one
      # guards "a failure must surface"; this one guards "a success must be
      # labeled accurately" — the notify "App image" line must distinguish a
      # fresh app-image ship (rebuilt → <sha>) from a re-roll of the existing
      # image (unchanged …) so a stale binary can't look "live" (issue #2264 /
      # PR #2263). The fixture test's last case enforces the real tree.
      # shellcheck the script+test since actionlint's -shellcheck only covers
      # workflow-embedded scripts.
      - name: Test App-image line rendering fence (issue #2264)
        run: |
          shellcheck scripts/check-app-image-line-rendered.sh tests/scripts/check-app-image-line-rendered_test.sh
          bash tests/scripts/check-app-image-line-rendered_test.sh
