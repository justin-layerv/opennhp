name: Validate GitHub Actions Workflows

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"

# Restrict default permissions for security
permissions:
  contents: read

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Run actionlint
      uses: reviewdog/action-actionlint@0d952c597ef8459f634d7145b0b044a9699e5e43 # v1
      with:
        fail_on_error: true
