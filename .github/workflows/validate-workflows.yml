name: Validate GitHub Actions Workflows

on:
  push:
    branches: [ "main" ]
    # ISSUE_TEMPLATE/** stays in the trigger set (though schema
    # validation moved to validate-issue-templates.yml) because
    # scripts/check-scope-drift.sh reads bug_report.yml's Component
    # dropdown — a rename there without a CLAUDE.md update must still
    # re-run scope-drift. validate-issue-templates.yml runs in parallel
    # on the same paths; the two checks are orthogonal.
    paths: &validate_paths
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "CLAUDE.md"
      - "scripts/check-scope-drift.sh"
      - "scripts/check-go-version-drift.sh"
      - "scripts/check-disable-agent-validation.sh"
      - "scripts/check-smoke-tier-filter-coverage.sh"
      # run-smoke.sh now owns the tier -> RUN_FILTER mapping that
      # check-smoke-tier-filter-coverage.sh parses, so an edit to it must
      # re-run that fence.
      - "scripts/run-smoke.sh"
      - "scripts/check-cert-cleanup-log-gate-unique.sh"
      - "scripts/check-cleanup-event-type-lockstep.sh"
      - "scripts/check-lockdown-body-drift.sh"
      - "scripts/check-paths-filter-coverage.py"
      - "scripts/print-dispatch-ref-error.sh"
      - "scripts/check-image-tag-writer-allowlist.sh"
      - "scripts/check-image-tag-writer-allowlist.py"
      - "scripts/check-asp-and-ac-id-lockstep.sh"
      # eBPF load-path lockstep (#2810): trigger on the script itself and on all
      # three source-of-truth sites it compares so a drift in ANY of them
      # re-runs the check at PR time. Dockerfile.ac.aws is already listed below;
      # the Go source of truth + the Makefile are not watched elsewhere, so they
      # must be here or a Go-only/Makefile-only rename would skip the lint.
      - "scripts/check-ebpf-load-path-lockstep.sh"
      - "tests/scripts/check-ebpf-load-path-lockstep_test.sh"
      # eBPF arch lockstep (#2816): the AC image build platform must stay
      # in lockstep with terraform/modules/ac/main.tf's launch-template
      # instance families. The fixture test mutates both sides so extractor
      # regressions do not silently green.
      - "scripts/check-ac-ebpf-arch-lockstep.sh"
      - "tests/scripts/check-ac-ebpf-arch-lockstep_test.sh"
      - "scripts/check-ebpf-toolchain-pin-lockstep.sh"
      - "tests/scripts/check-ebpf-toolchain-pin-lockstep_test.sh"
      - "scripts/install-ebpf-toolchain.sh"
      - "tests/scripts/install-ebpf-toolchain_test.sh"
      - "scripts/check-ebpf-committed-object-drift.sh"
      - "tests/scripts/check-ebpf-committed-object-drift_test.sh"
      - "endpoints/ac/ebpf/ebpfegine.go"
      - "terraform/modules/ac/main.tf"
      - "Makefile"
      - "scripts/check-frps-az-suffixes-validation-drift.sh"
      - "scripts/check-packer-failure-surfaced.sh"
      - "scripts/check-app-image-line-rendered.sh"
      - "scripts/check-golden-vectors.sh"
      # The conformance-parity check's fixture test runs in this workflow (the
      # script itself runs in qurl-v2-conformance-parity.yml, which needs a
      # Go/Node toolchain). Watch the script so an edit re-fires its shellcheck +
      # the fixture test here; the test file rides tests/scripts/** below.
      - "scripts/check-conformance-parity.sh"
      # All cross-language golden-vector files are listed so a one-sided edit to
      # ANY of them fires the Go↔TS cross-check (scripts/check-golden-vectors.sh)
      # — including the Go-side files, which the path-scoped js-agent.yml never
      # sees. Keep these entries in sync with the PAIRS array in that script.
      - "endpoints/js-agent/test/fingerprint.test.ts"
      - "nhp/utils/crypto_fingerprint_test.go"
      - "endpoints/js-agent/test/kdf.test.ts"
      - "nhp/core/kdf_test.go"
      - "terraform/modules/qurl-reverse-tunnel-server/variables.tf"
      - "terraform/modules/qurl-service/main.tf"
      - "terraform/modules/custom-domain-cert/lambda/**"
      - "tests/scripts/**"
      - "docker/Dockerfile.server"
      - "docker/Dockerfile.ac"
      - "docker/Dockerfile.ac.aws"
      - "docker/Dockerfile.app"
      - "docker/Dockerfile.base"
      - "nhp/go.mod"
      - "internalauth/go.mod"
      - "endpoints/go.mod"
      - "examples/server_plugin/go.mod"
      - "tests/local/go.mod"
      - "tests/smoke/**"
      - "tests/lints/disable-agent-validation/**"
      - "tests/lints/paths-filter-coverage/**"
      - "tests/lints/dispatch-ref-error/**"
      - "tests/lints/lockdown-body-drift/**"
      - "tests/lints/verify-image-attestation/**"
      - ".github/actions/verify-image-attestation/**"
      - "tests/lints/attestation-verify-watchdog/**"
      - ".github/scripts/scan-attestation-soak.sh"
      - "terraform/modules/compute/user_data.sh.tpl"
      - "terraform/environments/prod/**"
      - "terraform/environments/sandbox/**"
      - "terraform/modules/ac/variables.tf"
      - "terraform/variables.tf"
      - "terraform/main.tf"
      - "terraform/resources.tf"
      - "endpoints/server/staticplugins/agent/plugin.go"
      - "endpoints/server/resource_lookup.go"
      - "docker/nhp-server/etc/config.toml"
      - "endpoints/server/main/etc/config.toml"
  pull_request:
    # qurl-v2 carries the pre-E5 eBPF gates (#2810/#2816), so PRs against it
    # must run these workflow/Terraform lockstep checks before merge too.
    branches: [ "main", "qurl-v2" ]
    paths: *validate_paths

# Restrict default permissions for security
permissions:
  contents: read

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pin actionlint to a specific release so CI is reproducible and the
      # step is not at the mercy of a third-party action's tag mutation.
      # shellcheck is pre-installed on ubuntu-latest runners.
      - name: Install actionlint
        env:
          # 1.7.12 is the minimum version that lifts the old "max 10 inputs
          # for workflow_dispatch" rule — GitHub raised that limit upstream
          # and actionlint tracked the change. Bumping if you bump this is
          # fine; just update the sha256 from the release's checksums file.
          ACTIONLINT_VERSION: "1.7.12"
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the official GitHub release
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -version
          shellcheck --version

      # Run actionlint directly (no reviewdog wrapper) so:
      #   1. We scan every workflow on every push/PR, not just the diff —
      #      accumulated drift in untouched files cannot hide.
      #   2. Any finding fails the job immediately with the exact file+line
      #      in the step log. There is no annotation cap (reviewdog hit
      #      GitHub's 50/run limit and failed the job on volume alone — see
      #      #987/#988 for the incident that prompted this).
      #   3. No third-party action in the path between "lint fails" and
      #      "CI fails".
      - name: Run actionlint with shellcheck
        run: |
          actionlint -color -shellcheck "$(command -v shellcheck)" .github/workflows/*.yml

      # Pin Python so PyYAML resolution is reproducible independent of
      # the runner image's default Python. scripts/check-scope-drift.sh
      # (below) parses both bug_report.yml and CLAUDE.md via PyYAML.
      # Issue-form schema validation moved to its own workflow
      # (.github/workflows/validate-issue-templates.yml) which shims
      # to the ops-routines-workflows reusable.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: |
          set -euo pipefail
          python3 -m pip --version
          python3 -m pip install --no-cache-dir pyyaml

      # Run the scope-drift fixture tests BEFORE the real check. If the
      # extractors regress in a way that parses both real files to a
      # matching empty set, the real check would pass false-positive
      # green. Running the fixture tests first catches parser
      # regressions against known inputs before the real inputs run.
      - name: Test check-scope-drift.sh
        run: bash tests/scripts/check-scope-drift_test.sh

      # Prevent drift between the Component dropdown in the bug-report
      # form and the Scopes table in CLAUDE.md. The bug form tells
      # reporters which component to pick; CLAUDE.md is the source of
      # truth for valid commit scopes. If they disagree, either the
      # form offers a scope that won't pass commit-convention
      # enforcement, or CLAUDE.md lists a scope reporters can't pick.
      - name: Check scope drift (bug form ↔ CLAUDE.md)
        run: bash scripts/check-scope-drift.sh

      - name: Test check-go-version-drift.sh
        run: bash tests/scripts/check-go-version-drift_test.sh

      - name: Check Go version drift
        run: bash scripts/check-go-version-drift.sh

      # Structural fence for the promote-to-prod gate logic that closed
      # issue #1322 (deploy-* must require terraform-apply success when
      # run_terraform=true; finalize must roll qurl-schema-compat into its
      # FAILED loop). actionlint can't catch a silent loosening of the
      # if-expressions, so this is the regression guard.
      - name: Test promote-to-prod gating (issue #1322)
        run: python3 tests/scripts/test_promote_to_prod_gating.py

      # Regression guard for #1634: build-and-push.yml's sandbox deploy must
      # roll qurl-service onto the latest TF-registered task def after apply
      # (aws_ecs_service.qurl ignores task_definition changes, so the service
      # never advances on its own). Fails if the deploy-sandbox-qurl job or its
      # idempotency guard / SSM-sourced image tag regress. actionlint can't
      # catch a silent removal; this asserts it against the real workflow.
      - name: Test sandbox qurl ECS roll (issue #1634)
        run: bash tests/scripts/check-sandbox-qurl-roll_test.sh

      # Behavioral fence for the shared ECS deploy helper used by sandbox and
      # prod qurl rolls. It must reject real rollbacks, while accepting a newer
      # same-family task def only when a concurrent qurl-service deploy has
      # advanced the service to the current SSM image tag.
      - name: Test ECS service deploy helper
        run: |
          shellcheck .github/scripts/deploy-ecs-service.sh tests/scripts/deploy-ecs-service_test.sh
          bash tests/scripts/deploy-ecs-service_test.sh

      # Fence against re-introducing per-build writes to the blue/green
      # image-tag SSM slots — see scripts/check-image-tag-writer-allowlist.sh
      # for the contract. The test's final case scans the real repo,
      # so this one invocation both unit-tests the detector and
      # enforces the allowlist on the actual tree.
      - name: Test + enforce image-tag writer allowlist
        run: bash tests/scripts/check-image-tag-writer-allowlist_test.sh

      # Regression fence for the NHP-Relay CD deploy helper. Mocked-AWS cases
      # cover dark skip, app-changed tag write, infra-only refresh, loud SSM
      # failure, and an already-running instance refresh.
      - name: Test deploy helper scripts
        run: |
          shellcheck \
            .github/scripts/prune-missing-asg-target-groups.sh \
            .github/scripts/wait-for-instance-refresh.sh \
            .github/scripts/deploy-relay.sh \
            .github/scripts/recover-relay-deposed-sg.sh \
            .github/scripts/check-relay-deposed-sg-clear.sh \
            tests/scripts/prune-missing-asg-target-groups_test.sh \
            tests/scripts/wait-for-instance-refresh_test.sh \
            tests/scripts/deploy-relay_test.sh \
            tests/scripts/recover-relay-deposed-sg_test.sh \
            tests/scripts/check-relay-deposed-sg-clear_test.sh
          bash tests/scripts/prune-missing-asg-target-groups_test.sh
          bash tests/scripts/wait-for-instance-refresh_test.sh
          bash tests/scripts/deploy-relay_test.sh
          bash tests/scripts/recover-relay-deposed-sg_test.sh
          bash tests/scripts/check-relay-deposed-sg-clear_test.sh

      # Fence the canonical active-color → slot resolver (shared by
      # build-and-push.yml, promote-to-prod.yml, blue-green-deploy.yml, and
      # trigger-prod-deploy.sh). green→green-image-tag / blue→image-tag, and
      # fail-closed on a read error / corrupt active-color / bad input. shellcheck
      # both since actionlint's -shellcheck only covers workflow-embedded scripts.
      - name: Test active-color image-tag resolver
        run: |
          shellcheck .github/scripts/resolve-active-image-tag.sh tests/scripts/resolve-active-image-tag_test.sh
          bash tests/scripts/resolve-active-image-tag_test.sh

      # Fence the blue/green dispatch planner (build-and-push.yml's infra-only
      # deploy path). Pins that drifted server/AC tags fan out to one dispatch
      # per component at its OWN tag — never one component at the other's tag —
      # and that a blank tag fails closed instead of dispatching an empty
      # image_tag. shellcheck both since actionlint's -shellcheck only covers
      # workflow-embedded scripts.
      - name: Test blue/green dispatch planner
        run: |
          shellcheck .github/scripts/plan-blue-green-dispatch.sh tests/scripts/plan-blue-green-dispatch_test.sh
          bash tests/scripts/plan-blue-green-dispatch_test.sh

      # Shared by the Server and AC Packer post-processors. This keeps
      # Packer's region:ami-* artifact_id parsing from drifting across both
      # callers.
      - name: Test AMI ID manifest parser
        run: bash tests/scripts/ami-id-from-manifest_test.sh

      # The Terraform Plan (PR) gate is requireable, so its change classifier
      # must not silently misclassify Terraform changes as docs-only or prod-only.
      - name: Test Terraform Plan PR change classifier
        run: |
          shellcheck .github/scripts/classify-terraform-plan-pr-changes.sh tests/scripts/classify-terraform-plan-pr-changes_test.sh
          bash tests/scripts/classify-terraform-plan-pr-changes_test.sh

      # Structural fence for the dependabot-go-tidy bot-identity preflight
      # (PR #1777). PR #1384 used `gh api /user`, which 403s on App
      # installation tokens; PR #1777 swapped to the action's `app-slug`
      # output. The bug stayed latent because no non-no-op tidy ever
      # exercised the path. actionlint can't catch a re-introduction.
      - name: Test dependabot-go-tidy preflight (PR #1777)
        run: bash tests/scripts/dependabot-go-tidy_test.sh

      # Structural fence against DisableAgentValidation=true creeping
      # into a deployable config (#1157 F9). The flag turns off agent
      # static-pubkey validation entirely; setting it true in any
      # prod path is a security regression with no runtime signal.
      # The check is string-grep based so it stays runnable without
      # parser deps.
      #
      # The fixture suite runs first so a regex regression (e.g., a
      # tightening that drops a covered case) surfaces before the
      # production paths run.
      - name: Test check-disable-agent-validation.sh (#1157 F9 fixtures)
        run: bash tests/lints/disable-agent-validation/run-fixtures.sh

      - name: Check DisableAgentValidation flag (#1157 F9)
        run: bash scripts/check-disable-agent-validation.sh

      # Two-way coverage check: every alternation token in
      # scripts/run-smoke.sh's RUN_FILTER must correspond to a real
      # `^func Test<Token>_` in tests/smoke/0X_*_test.go, and every
      # such Test<Prefix>_ must be in the alternation for the tier
      # the file's prefix routes to. Without this, a token without a
      # matching test (e.g., `Health` when all real tests are named
      # `TestHealthKnockReady_…` / `TestHealthLive_…`) silently
      # matches nothing — every Health* tier-1 fence skipped on every
      # CI run until the script was wired in.
      - name: Check smoke RUN_FILTER coverage
        run: bash scripts/check-smoke-tier-filter-coverage.sh

      # Lockstep fence for the cert-lambda smoke test (#2000): asserts
      # the lambda emits "Domain cleanup complete for" exactly once in
      # non-comment Python source. The smoke filter substring-matches
      # this prefix, so reusing it at an earlier lifecycle point would
      # let assertSSMParamsAbsent race the actual deletes.
      - name: Check cert-cleanup smoke gate uniqueness
        run: bash scripts/check-cert-cleanup-log-gate-unique.sh

      # Lockstep fence for the cleanup event-type wire-string between
      # the Go smoke test and the Python cert lambda dispatcher
      # (qurl-service publisher is in another repo and cannot be
      # checked here). Drift in either of these two sites is a
      # routing mismatch — the lambda dispatcher would no longer
      # match what the test publishes — and the smoke fence trips at
      # the 90s timeout with no specific signal that the wire-string
      # drifted.
      - name: Check cleanup event-type lockstep (Go ↔ Python)
        run: bash scripts/check-cleanup-event-type-lockstep.sh

      # Cross-language fence (#2556): NHP-custom golden vectors (the
      # pubKeyFingerprint routing id and the KDF/NoiseFactory transcript) are
      # hand-copied into both a Go test and the js-agent TS test and must not
      # drift. The fixture suite runs first so a marker extractor regression
      # (e.g. one that parses a file to an empty set and passes vacuously)
      # surfaces against known inputs before the real files run. shellcheck both
      # — actionlint's -shellcheck only covers workflow-embedded scripts.
      - name: Test + check golden vector lockstep (Go ↔ TS, #2556)
        run: |
          shellcheck scripts/check-golden-vectors.sh tests/scripts/check-golden-vectors_test.sh
          bash tests/scripts/check-golden-vectors_test.sh
          bash scripts/check-golden-vectors.sh

      # Fixture-test for the Go↔npm conformance-parity check's DECISION logic
      # (#2855): identical→0, differing→1+DRIFT, missing-file→1. The real
      # scripts/check-conformance-parity.sh resolves its two
      # issuer_signature_vectors.json copies via `go mod download` + `npm ci`,
      # so it needs a Go/Node toolchain and runs in its own workflow
      # (qurl-v2-conformance-parity.yml). This pure-shell job only shellchecks
      # both files and runs the network-free fixture test (which injects
      # GO_VECTOR/NPM_VECTOR to bypass resolution), guarding the compare/exit
      # logic against regressions here without a toolchain. Mirrors the
      # golden-vectors test wiring above.
      - name: Test conformance-parity decision logic (Go ↔ npm, #2855)
        run: |
          shellcheck scripts/check-conformance-parity.sh tests/scripts/check-conformance-parity_test.sh
          bash tests/scripts/check-conformance-parity_test.sh

      # Structural fence for the qurl-service /internal/* public-ALB
      # lockdown body contract (PR #1635; rearchitected by #1645). The
      # smoke fence no longer carries a Go body literal — it resolves its
      # expected body from the SSM parameter Terraform publishes, and
      # Terraform authors BOTH the rule's message_body AND that parameter
      # from one shared local (local.public_internal_lockdown_body). This
      # lint fences the invariants that keep that drift-free: rule
      # message_body and the SSM param value both reference the local, the
      # local stays jsonencode({...}) (a text/plain switch per #1642 must
      # also update the smoke resolver + Go type), no Go literal is
      # re-introduced, and Terraform + the smoke resolver name the same
      # SSM parameter. A one-sided edit fails here at PR time.
      - name: Check lockdown body shape drift (TF ↔ smoke)
        run: bash scripts/check-lockdown-body-drift.sh

      # Fixtures for the lockdown body drift lint: exercise its 3-arg override
      # against golden + broken TF/Go inputs so a regression in any of the five
      # invariants it enforces (or the count-gate awk extractor drifting after a
      # TF fmt change) surfaces here against known answers, not only when a real
      # drift coincides with the bug. shellcheck both scripts — actionlint's
      # -shellcheck only covers workflow-embedded scripts, and the lint itself
      # was previously unchecked.
      - name: Shellcheck + test lockdown-body-drift fixtures
        run: |
          shellcheck scripts/check-lockdown-body-drift.sh tests/lints/lockdown-body-drift/run-fixtures.sh
          bash tests/lints/lockdown-body-drift/run-fixtures.sh

      # Structural fence for the two-layer path filter pattern
      # (push.paths + dorny/paths-filter inside a job). Every
      # inner-filter pattern that gates a real job must be covered
      # by an on.push.paths pattern, otherwise a path-only merge
      # to main silently skips the workflow. Drove the gaps in
      # #1775/#1776 (.trivyignore) and #252/#980 (packer/**).
      #
      # Fixtures run first so a regression in covers() (e.g., an
      # accidental tightening that lets the real production gap
      # through) surfaces against synthetic inputs with known
      # answers, not against the real workflows whose state can
      # drift.
      - name: Test check-paths-filter-coverage.py fixtures
        run: bash tests/lints/paths-filter-coverage/run-fixtures.sh

      - name: Check path-filter coverage across all workflows
        run: python3 scripts/check-paths-filter-coverage.py

      # Contract tests for scripts/print-dispatch-ref-error.sh
      # (the message body of build-and-push.yml's dispatch-ref
      # guard). Pin the load-bearing strings — gh command,
      # refs/heads/main requirement, #1121 cross-reference — so
      # a regression that drops them silently degrades the
      # operator's first explanation of why the dispatch failed.
      - name: Test dispatch-ref-error fixtures
        run: bash tests/lints/dispatch-ref-error/run-fixtures.sh

      # Lock the #1334 Phase 1 attestation-gate composite action's bash
      # contract (audit never blocks; enforce blocks only on a real
      # no-attestation verdict; infra/tooling errors fail OPEN even under
      # enforce; mode normalization). The action can't be exercised pre-merge
      # via its `uses:`, so this stubbed-PATH fixture is the regression lock.
      - name: Test verify-image-attestation fixtures
        run: |
          shellcheck tests/lints/verify-image-attestation/run-fixtures.sh
          bash tests/lints/verify-image-attestation/run-fixtures.sh

      # Lock the parser half of the Attestation Verify Watchdog
      # (attestation-verify-watchdog.yml): the per-lane error/fail/pass
      # classification that decides whether the #1334 verify gate is silently
      # failing open. A miss means the watchdog stays quiet while the gate
      # verifies nothing under enforce — so this fixture pins the verdict against
      # the real captured ATTEST_RESULT marker wording. shellcheck the script too
      # (actionlint's -shellcheck only covers workflow-embedded scripts).
      - name: Test attestation-verify-watchdog fixtures
        run: |
          shellcheck .github/scripts/scan-attestation-soak.sh tests/lints/attestation-verify-watchdog/run-fixtures.sh
          bash tests/lints/attestation-verify-watchdog/run-fixtures.sh

      # Two cross-module lockstep contracts that surfaced as #1976
      # cutover follow-ups (PR #2141): the Go-side
      # `staticplugins/agent.PluginID` must agree with every TF
      # surface setting `ac_auth_service_id` (drift → first knock
      # ErrAuthServiceProviderNotFound, no signal), and the AC
      # module's `var.ac_id` default must agree with every env's
      # `qurl_default_ac_id` (drift → first knock
      # ErrACConnectionNotFound). The fixture suite runs first so a
      # regression in the extractors surfaces against synthetic
      # inputs with known answers before the real tree runs.
      - name: Test check-asp-and-ac-id-lockstep.sh fixtures
        run: bash tests/scripts/check-asp-and-ac-id-lockstep_test.sh

      - name: Check asp+ac_id lockstep (TF ↔ Go)
        run: bash scripts/check-asp-and-ac-id-lockstep.sh

      # eBPF object load-path lockstep (#2810): the AC loads its eBPF objects
      # from a dir+filenames that are the runtime source of truth in
      # endpoints/ac/ebpf/ebpfegine.go (bpfDir / ebpfenginename / tcObjName).
      # The Makefile EBPF_OBJ_* output paths and the docker/Dockerfile.ac.aws
      # build guard independently hardcode the same path; a Go-only rename
      # would pass the in-image build guard (which only compares
      # Makefile↔Dockerfile) yet boot-fail the AC under FilterMode=EBPFXDP.
      # The fixture suite runs first so an extractor regression surfaces
      # against synthetic inputs before the real tree runs. shellcheck both —
      # actionlint's -shellcheck only covers workflow-embedded scripts.
      - name: Test + check eBPF load-path lockstep (Go ↔ Makefile ↔ Dockerfile, #2810)
        run: |
          shellcheck scripts/check-ebpf-load-path-lockstep.sh tests/scripts/check-ebpf-load-path-lockstep_test.sh
          bash tests/scripts/check-ebpf-load-path-lockstep_test.sh
          bash scripts/check-ebpf-load-path-lockstep.sh

      # AC eBPF architecture lockstep (#2816): Dockerfile.ac.aws compiles the
      # eBPF objects inside the AC image build, so build-and-push.yml must build
      # that image for the same platform the AC launch template runs. Today this
      # is intentionally linux/amd64-only (prod c6i.xlarge, non-prod t3.medium).
      # A future arm64 or multi-arch AC path must add a real BPF load test before
      # relaxing this gate.
      - name: Test + check AC eBPF arch lockstep (workflow ↔ Terraform, #2816)
        run: |
          shellcheck scripts/check-ac-ebpf-arch-lockstep.sh tests/scripts/check-ac-ebpf-arch-lockstep_test.sh
          bash tests/scripts/check-ac-ebpf-arch-lockstep_test.sh
          bash scripts/check-ac-ebpf-arch-lockstep.sh

      # Fixture-test the committed-object freshness guard without requiring the
      # workflow-lint job to install clang/libbpf. The real eBPF workflow runs
      # the script against the actual object after installing the toolchain.
      - name: Test eBPF committed-object drift guard (#2823)
        run: |
          shellcheck scripts/check-ebpf-toolchain-pin-lockstep.sh tests/scripts/check-ebpf-toolchain-pin-lockstep_test.sh scripts/install-ebpf-toolchain.sh tests/scripts/install-ebpf-toolchain_test.sh scripts/check-ebpf-committed-object-drift.sh tests/scripts/check-ebpf-committed-object-drift_test.sh
          bash tests/scripts/check-ebpf-toolchain-pin-lockstep_test.sh
          bash scripts/check-ebpf-toolchain-pin-lockstep.sh
          bash tests/scripts/install-ebpf-toolchain_test.sh
          bash tests/scripts/check-ebpf-committed-object-drift_test.sh

      - name: Check frps_az_suffixes validation drift (root ↔ module ↔ env-roots)
        run: bash scripts/check-frps-az-suffixes-validation-drift.sh

      # Structural fence for the notify-job wiring that surfaces Packer Build
      # AMI failures (issue #2252). packer-build is not a required check (it's
      # skipped on PRs), so a post-merge bake failure's only signal is the
      # notify Slack alert. A bake failure also skips deploy-sandbox-infra,
      # which would otherwise render a green "NHP Build successful" — exactly
      # how the #2239 AC-AMI bug stayed silent for ~12h. This fence pins
      # packer-build ∈ notify.needs + PACKER_RESULT + the failure branch.
      # Fixtures run first so an extractor/assertion regression surfaces
      # against synthetic inputs before the real tree runs.
      - name: Test check-packer-failure-surfaced.sh fixtures (issue #2252)
        run: bash tests/scripts/check-packer-failure-surfaced_test.sh

      - name: Check Packer Build AMI failures are surfaced in notify (#2252)
        run: bash scripts/check-packer-failure-surfaced.sh

      # Sibling of the packer fence above, different invariant family: that one
      # guards "a failure must surface"; this one guards "a success must be
      # labeled accurately" — the notify "App image" line must distinguish a
      # fresh app-image ship (rebuilt → <sha>) from a re-roll of the existing
      # image (unchanged …) so a stale binary can't look "live" (issue #2264 /
      # PR #2263). The fixture test's last case enforces the real tree.
      # shellcheck the script+test since actionlint's -shellcheck only covers
      # workflow-embedded scripts.
      - name: Test App-image line rendering fence (issue #2264)
        run: |
          shellcheck scripts/check-app-image-line-rendered.sh tests/scripts/check-app-image-line-rendered_test.sh
          bash tests/scripts/check-app-image-line-rendered_test.sh
