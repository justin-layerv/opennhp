name: Validate GitHub Actions Workflows

on:
  push:
    branches: [ "main" ]
    # ISSUE_TEMPLATE/** stays in the trigger set (though schema
    # validation moved to validate-issue-templates.yml) because
    # scripts/check-scope-drift.sh reads bug_report.yml's Component
    # dropdown — a rename there without a CLAUDE.md update must still
    # re-run scope-drift. validate-issue-templates.yml runs in parallel
    # on the same paths; the two checks are orthogonal.
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "CLAUDE.md"
      - "scripts/check-scope-drift.sh"
      - "scripts/check-disable-agent-validation.sh"
      - "scripts/check-smoke-tier-filter-coverage.sh"
      - "scripts/check-cert-cleanup-log-gate-unique.sh"
      - "scripts/check-cleanup-event-type-lockstep.sh"
      - "scripts/check-lockdown-body-drift.sh"
      - "scripts/check-paths-filter-coverage.py"
      - "scripts/print-dispatch-ref-error.sh"
      - "scripts/check-image-tag-writer-allowlist.sh"
      - "scripts/check-image-tag-writer-allowlist.py"
      - "terraform/modules/qurl-service/main.tf"
      - "terraform/modules/custom-domain-cert/lambda/**"
      - "tests/scripts/**"
      - "tests/smoke/**"
      - "tests/lints/disable-agent-validation/**"
      - "tests/lints/paths-filter-coverage/**"
      - "tests/lints/dispatch-ref-error/**"
      - "terraform/modules/compute/user_data.sh.tpl"
      - "terraform/environments/prod/**"
      - "terraform/environments/sandbox/**"
      - "docker/nhp-server/etc/config.toml"
      - "endpoints/server/main/etc/config.toml"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "CLAUDE.md"
      - "scripts/check-scope-drift.sh"
      - "scripts/check-disable-agent-validation.sh"
      - "scripts/check-smoke-tier-filter-coverage.sh"
      - "scripts/check-cert-cleanup-log-gate-unique.sh"
      - "scripts/check-cleanup-event-type-lockstep.sh"
      - "scripts/check-lockdown-body-drift.sh"
      - "scripts/check-paths-filter-coverage.py"
      - "scripts/print-dispatch-ref-error.sh"
      - "scripts/check-image-tag-writer-allowlist.sh"
      - "scripts/check-image-tag-writer-allowlist.py"
      - "terraform/modules/qurl-service/main.tf"
      - "terraform/modules/custom-domain-cert/lambda/**"
      - "tests/scripts/**"
      - "tests/smoke/**"
      - "tests/lints/disable-agent-validation/**"
      - "tests/lints/paths-filter-coverage/**"
      - "tests/lints/dispatch-ref-error/**"
      - "terraform/modules/compute/user_data.sh.tpl"
      - "terraform/environments/prod/**"
      - "terraform/environments/sandbox/**"
      - "docker/nhp-server/etc/config.toml"
      - "endpoints/server/main/etc/config.toml"

# Restrict default permissions for security
permissions:
  contents: read

jobs:
  validate-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Pin actionlint to a specific release so CI is reproducible and the
      # step is not at the mercy of a third-party action's tag mutation.
      # shellcheck is pre-installed on ubuntu-latest runners.
      - name: Install actionlint
        env:
          # 1.7.12 is the minimum version that lifts the old "max 10 inputs
          # for workflow_dispatch" rule — GitHub raised that limit upstream
          # and actionlint tracked the change. Bumping if you bump this is
          # fine; just update the sha256 from the release's checksums file.
          ACTIONLINT_VERSION: "1.7.12"
          # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the official GitHub release
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -version
          shellcheck --version

      # Run actionlint directly (no reviewdog wrapper) so:
      #   1. We scan every workflow on every push/PR, not just the diff —
      #      accumulated drift in untouched files cannot hide.
      #   2. Any finding fails the job immediately with the exact file+line
      #      in the step log. There is no annotation cap (reviewdog hit
      #      GitHub's 50/run limit and failed the job on volume alone — see
      #      #987/#988 for the incident that prompted this).
      #   3. No third-party action in the path between "lint fails" and
      #      "CI fails".
      - name: Run actionlint with shellcheck
        run: |
          actionlint -color -shellcheck "$(command -v shellcheck)" .github/workflows/*.yml

      # Pin Python so PyYAML resolution is reproducible independent of
      # the runner image's default Python. scripts/check-scope-drift.sh
      # (below) parses both bug_report.yml and CLAUDE.md via PyYAML.
      # Issue-form schema validation moved to its own workflow
      # (.github/workflows/validate-issue-templates.yml) which shims
      # to the ops-routines-workflows reusable.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: |
          set -euo pipefail
          python3 -m pip --version
          python3 -m pip install --no-cache-dir pyyaml

      # Run the scope-drift fixture tests BEFORE the real check. If the
      # extractors regress in a way that parses both real files to a
      # matching empty set, the real check would pass false-positive
      # green. Running the fixture tests first catches parser
      # regressions against known inputs before the real inputs run.
      - name: Test check-scope-drift.sh
        run: bash tests/scripts/check-scope-drift_test.sh

      # Prevent drift between the Component dropdown in the bug-report
      # form and the Scopes table in CLAUDE.md. The bug form tells
      # reporters which component to pick; CLAUDE.md is the source of
      # truth for valid commit scopes. If they disagree, either the
      # form offers a scope that won't pass commit-convention
      # enforcement, or CLAUDE.md lists a scope reporters can't pick.
      - name: Check scope drift (bug form ↔ CLAUDE.md)
        run: bash scripts/check-scope-drift.sh

      # Structural fence for the promote-to-prod gate logic that closed
      # issue #1322 (deploy-* must require terraform-apply success when
      # run_terraform=true; finalize must roll qurl-schema-compat into its
      # FAILED loop). actionlint can't catch a silent loosening of the
      # if-expressions, so this is the regression guard.
      - name: Test promote-to-prod gating (issue #1322)
        run: python3 tests/scripts/test_promote_to_prod_gating.py

      # Fence against re-introducing per-build writes to the blue/green
      # image-tag SSM slots — see scripts/check-image-tag-writer-allowlist.sh
      # for the contract. The test's final case scans the real repo,
      # so this one invocation both unit-tests the detector and
      # enforces the allowlist on the actual tree.
      - name: Test + enforce image-tag writer allowlist
        run: bash tests/scripts/check-image-tag-writer-allowlist_test.sh

      # Structural fence for the dependabot-go-tidy bot-identity preflight
      # (PR #1777). PR #1384 used `gh api /user`, which 403s on App
      # installation tokens; PR #1777 swapped to the action's `app-slug`
      # output. The bug stayed latent because no non-no-op tidy ever
      # exercised the path. actionlint can't catch a re-introduction.
      - name: Test dependabot-go-tidy preflight (PR #1777)
        run: bash tests/scripts/dependabot-go-tidy_test.sh

      # Structural fence against DisableAgentValidation=true creeping
      # into a deployable config (#1157 F9). The flag turns off agent
      # static-pubkey validation entirely; setting it true in any
      # prod path is a security regression with no runtime signal.
      # The check is string-grep based so it stays runnable without
      # parser deps.
      #
      # The fixture suite runs first so a regex regression (e.g., a
      # tightening that drops a covered case) surfaces before the
      # production paths run.
      - name: Test check-disable-agent-validation.sh (#1157 F9 fixtures)
        run: bash tests/lints/disable-agent-validation/run-fixtures.sh

      - name: Check DisableAgentValidation flag (#1157 F9)
        run: bash scripts/check-disable-agent-validation.sh

      # Two-way coverage check: every alternation token in
      # nhp-smoke-tests.yml's RUN_FILTER must correspond to a real
      # `^func Test<Token>_` in tests/smoke/0X_*_test.go, and every
      # such Test<Prefix>_ must be in the alternation for the tier
      # the file's prefix routes to. Without this, a token without a
      # matching test (e.g., `Health` when all real tests are named
      # `TestHealthKnockReady_…` / `TestHealthLive_…`) silently
      # matches nothing — every Health* tier-1 fence skipped on every
      # CI run until the script was wired in.
      - name: Check smoke RUN_FILTER coverage
        run: bash scripts/check-smoke-tier-filter-coverage.sh

      # Lockstep fence for the cert-lambda smoke test (#2000): asserts
      # the lambda emits "Domain cleanup complete for" exactly once in
      # non-comment Python source. The smoke filter substring-matches
      # this prefix, so reusing it at an earlier lifecycle point would
      # let assertSSMParamsAbsent race the actual deletes.
      - name: Check cert-cleanup smoke gate uniqueness
        run: bash scripts/check-cert-cleanup-log-gate-unique.sh

      # Lockstep fence for the cleanup event-type wire-string between
      # the Go smoke test and the Python cert lambda dispatcher
      # (qurl-service publisher is in another repo and cannot be
      # checked here). Drift in either of these two sites is a
      # routing mismatch — the lambda dispatcher would no longer
      # match what the test publishes — and the smoke fence trips at
      # the 90s timeout with no specific signal that the wire-string
      # drifted.
      - name: Check cleanup event-type lockstep (Go ↔ Python)
        run: bash scripts/check-cleanup-event-type-lockstep.sh

      # Structural fence for the qurl-service /internal/* public-ALB
      # lockdown body shape (PR #1635). The fixed-response body in
      # terraform/modules/qurl-service/main.tf (jsonencode({error="not found"}))
      # is duplicated in tests/smoke/09_public_alb_internal_lockdown_test.go
      # as publicALBLockdownExpectedBody. The smoke suite is a separate
      # Go module with no `replace` line back to terraform-rendered
      # output, so the duplication is structural. A one-sided edit
      # (e.g., switching to gin's text/plain to close the body-shape
      # fingerprint leak) would leave the smoke fence asserting on the
      # prior shape — silently false-positive — until the next live
      # smoke run flagged it. This lint catches the drift at PR time.
      - name: Check lockdown body shape drift (TF ↔ smoke)
        run: bash scripts/check-lockdown-body-drift.sh

      # Structural fence for the two-layer path filter pattern
      # (push.paths + dorny/paths-filter inside a job). Every
      # inner-filter pattern that gates a real job must be covered
      # by an on.push.paths pattern, otherwise a path-only merge
      # to main silently skips the workflow. Drove the gaps in
      # #1775/#1776 (.trivyignore) and #252/#980 (packer/**).
      #
      # Fixtures run first so a regression in covers() (e.g., an
      # accidental tightening that lets the real production gap
      # through) surfaces against synthetic inputs with known
      # answers, not against the real workflows whose state can
      # drift.
      - name: Test check-paths-filter-coverage.py fixtures
        run: bash tests/lints/paths-filter-coverage/run-fixtures.sh

      - name: Check path-filter coverage across all workflows
        run: python3 scripts/check-paths-filter-coverage.py

      # Contract tests for scripts/print-dispatch-ref-error.sh
      # (the message body of build-and-push.yml's dispatch-ref
      # guard). Pin the load-bearing strings — gh command,
      # refs/heads/main requirement, #1121 cross-reference — so
      # a regression that drops them silently degrades the
      # operator's first explanation of why the dispatch failed.
      - name: Test dispatch-ref-error fixtures
        run: bash tests/lints/dispatch-ref-error/run-fixtures.sh
