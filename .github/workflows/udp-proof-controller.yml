# Attended, dispatch-only controller for one native-UDP client proof.
#
# One controller run mints one JIT configuration, launches one EIP-pinned
# one-job runner, dispatches one exact client candidate, verifies that external
# run, and always asks the broker to reap the runner. Run Connector first, then
# start a distinct attended qurl-go controller run. This preserves the
# one-secret/one-runner contract and gives each client independent controller
# provenance.
#
# The operator supplies only one successful trusted-main producer run ID. The
# gate authenticates that exact run and its unique current-attempt artifact,
# downloads the artifact by immutable ID with digest enforcement, and fails
# closed on the complete canonical deployment/provenance/runtime contract. The
# controller never accepts operator-authored topology, keys, image digests,
# repository SHAs, or candidate refs. It binds the producer-selected branches
# to exact manifest commits through runner-group pinning and the external run's
# head SHA.

name: UDP proof controller (sandbox, attended)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_UDP_PROOF to launch the attended proof.'
        required: true
        type: string
      client:
        description: Client whose single JIT proof job this run controls
        required: true
        type: choice
        options:
          - connector
          - qurl_go
      proof_phase:
        description: Exact HTTP-lifecycle retirement phase
        required: true
        type: choice
        options:
          - pre_removal
          - post_removal
      deployment_producer_run_id:
        description: Successful trusted-main deployment-manifest producer run ID
        required: true
        type: string
      pre_removal_run_id:
        description: Required for post_removal; selected client's successful pre-removal run ID
        required: false
        type: string

permissions: {}

env:
  AWS_REGION: us-east-2
  CONTROLLER_ROLE_ARN: arn:aws:iam::767397897469:role/layerv-nhp-sandbox-udp-proof-controller
  BROKER_FUNCTION: layerv-nhp-sandbox-udp-proof-runner-broker
  JIT_SECRET_PREFIX: layerv-nhp-sandbox/udp-proof/jit/
  RECOVERY_REQUEST_PREFIX: layerv-nhp-sandbox/udp-proof/recovery/request/
  RECOVERY_RESPONSE_PREFIX: layerv-nhp-sandbox/udp-proof/recovery/response/
  JIT_KMS_KEY_ARN: arn:aws:kms:us-east-2:767397897469:key/2dc8590c-cf7e-4427-bf48-ea442a3f79d6
  PROOF_ACCOUNT_SOURCE_SECRET: layerv-nhp-sandbox/udp-proof-account/credential
  PROOF_ACCOUNT_SHA_PARAMETER: /sandbox/nhp/udp-proof/account-credential-sha256
  PROOF_ACCOUNT_KEY_TABLE: layerv-nhp-sandbox-control-qurl-api-keys
  PROOF_ACCOUNT_CUSTOMER_TABLE: layerv-nhp-sandbox-control-qurl-customers
  PROOF_ACCOUNT_OWNER_ID: layerv-nhp-sandbox-udp-proof
  PROOF_ACCOUNT_KEY_ID: key_UdpProofOtp1
  PROOF_ACCOUNT_EMAIL: qurl-go@proof.notify.layerv.xyz
  PROOF_ACCOUNT_JIT_SECRET_PREFIX: layerv-nhp-sandbox/udp-proof/jit/credential/
  # Frozen client candidate heads. These MUST equal the live head SHAs of the
  # open qurl-connector/qurl-go candidate PRs at the moment the trusted-main
  # producer runs, because the producer resolves `repositories.qurl_connector`
  # and `repositories.qurl_go` from those live PR heads and the gate below
  # rejects any producer artifact that binds a different head. If either head
  # moves, re-run the producer and update both pins plus runner-group 5.
  PINNED_CONNECTOR_SHA: 60263c5b01aae129663cf316da86e6ea6736ba29
  PINNED_QURL_GO_SHA: 064f9b6f024cf18ce70ce1243a8e698c08019806

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      connector_workflow_identity: ${{ steps.files.outputs.connector_workflow_identity }}
      qurl_go_workflow_identity: ${{ steps.files.outputs.qurl_go_workflow_identity }}
      connector_workflow_group_identity: ${{ steps.files.outputs.connector_workflow_group_identity }}
      qurl_go_workflow_group_identity: ${{ steps.files.outputs.qurl_go_workflow_group_identity }}
      client_repository: ${{ steps.files.outputs.client_repository }}
      client_workflow: ${{ steps.files.outputs.client_workflow }}
      client_ref: ${{ steps.files.outputs.client_ref }}
      client_sha: ${{ steps.files.outputs.client_sha }}
      deployment_manifest_b64: ${{ steps.files.outputs.deployment_manifest_b64 }}
      deployment_runtime_inputs_b64: ${{ steps.files.outputs.deployment_runtime_inputs_b64 }}
      deployment_provenance_b64: ${{ steps.files.outputs.deployment_provenance_b64 }}
      deployment_provenance_sha256: ${{ steps.files.outputs.deployment_provenance_sha256 }}
      retirement_probe_targets_b64: ${{ steps.files.outputs.retirement_probe_targets_b64 }}
      deployment_manifest_sha256: ${{ steps.files.outputs.deployment_manifest_sha256 }}
      deployment_runtime_inputs_sha256: ${{ steps.files.outputs.deployment_runtime_inputs_sha256 }}
      retirement_probe_targets_sha256: ${{ steps.files.outputs.retirement_probe_targets_sha256 }}
      proof_recovery_alias_arn: ${{ steps.files.outputs.proof_recovery_alias_arn }}
      producer_run_id: ${{ steps.metadata.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.metadata.outputs.producer_run_attempt }}
      producer_head_sha: ${{ steps.metadata.outputs.producer_head_sha }}
      producer_artifact_id: ${{ steps.metadata.outputs.producer_artifact_id }}
      producer_artifact_digest: ${{ steps.metadata.outputs.producer_artifact_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate the exact trusted-main producer artifact
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
          PRODUCER_RUN_ID: ${{ inputs.deployment_producer_run_id }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "RUN_UDP_PROOF" || {
            echo "::error::confirmation phrase not exact"
            exit 1
          }
          [[ "$PRODUCER_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || {
            echo "::error::deployment producer run ID must be a positive integer"
            exit 1
          }

          retry_gh_api_to_file() {
            local destination="$1"
            shift
            local attempt
            for attempt in 1 2 3; do
              if timeout 30s gh api "$@" >"${destination}.tmp"; then
                mv "${destination}.tmp" "$destination"
                return 0
              fi
              rm -f "${destination}.tmp"
              echo "::warning::producer API read failed on attempt ${attempt}/3; retrying" >&2
              if (( attempt < 3 )); then
                sleep 5
              fi
            done
            return 1
          }

          retry_gh_api_to_file \
            /tmp/udp-proof-producer-run.json \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}" || {
            echo "::error::could not authenticate the producer run after bounded retries"
            exit 1
          }
          retry_gh_api_to_file \
            /tmp/udp-proof-producer-artifacts.json \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/artifacts?per_page=100" || {
            echo "::error::could not authenticate the producer artifact after bounded retries"
            exit 1
          }
          python3 .github/scripts/validate_udp_proof_producer_artifact.py metadata \
            --run-json /tmp/udp-proof-producer-run.json \
            --artifacts-json /tmp/udp-proof-producer-artifacts.json \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download the authenticated producer artifact by immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.metadata.outputs.producer_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.metadata.outputs.producer_run_id }}
          github-token: ${{ github.token }}
          path: udp-proof-producer-artifact
          merge-multiple: true
          digest-mismatch: error

      - name: Validate exact producer files and derive candidate dispatch
        id: files
        env:
          CLIENT: ${{ inputs.client }}
          PROOF_PHASE: ${{ inputs.proof_phase }}
          PRE_REMOVAL_RUN_ID: ${{ inputs.pre_removal_run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_udp_proof_producer_artifact.py files \
            --directory udp-proof-producer-artifact \
            --client "$CLIENT" \
            --proof-phase "$PROOF_PHASE" \
            --producer-run-id "${{ steps.metadata.outputs.producer_run_id }}" \
            --producer-run-attempt "${{ steps.metadata.outputs.producer_run_attempt }}" \
            --producer-head-sha "${{ steps.metadata.outputs.producer_head_sha }}" \
            --pre-removal-run-id "$PRE_REMOVAL_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require the frozen client candidate heads
        env:
          CONNECTOR_WORKFLOW: ${{ steps.files.outputs.connector_workflow_identity }}
          QURL_GO_WORKFLOW: ${{ steps.files.outputs.qurl_go_workflow_identity }}
        run: |
          set -euo pipefail
          test "$CONNECTOR_WORKFLOW" = \
            "layervai/qurl-connector/.github/workflows/sandbox-smoke.yml@${PINNED_CONNECTOR_SHA}" || {
            echo "::error::producer artifact does not bind the frozen Connector head"
            exit 1
          }
          test "$QURL_GO_WORKFLOW" = \
            "layervai/qurl-go/.github/workflows/native-udp-sandbox.yml@${PINNED_QURL_GO_SHA}" || {
            echo "::error::producer artifact does not bind the frozen qurl-go head"
            exit 1
          }

  proof:
    needs: gate
    name: ${{ inputs.client }} / ${{ inputs.proof_phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 165
    # Let both client gates authenticate the same still-fresh producer artifact
    # in parallel. Serialize only the jobs that consume the singleton EIP and
    # broker-managed one-use runner.
    concurrency:
      group: udp-proof-controller
      cancel-in-progress: false
    environment: udp-proof-sandbox
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint the runner-management App installation token
        id: app_runner
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UDP_PROOF_JIT_APP_ID }}
          private-key: ${{ secrets.UDP_PROOF_JIT_APP_PRIVATE_KEY }}
          owner: layervai
          repositories: |
            qurl-connector
            qurl-go
          permission-organization-self-hosted-runners: write

      - name: Verify exact runner-group controls
        env:
          GH_TOKEN: ${{ steps.app_runner.outputs.token }}
          RUNNER_GROUP_ID: ${{ vars.UDP_PROOF_RUNNER_GROUP_ID }}
          CONNECTOR_WORKFLOW: ${{ needs.gate.outputs.connector_workflow_identity }}
          QURL_GO_WORKFLOW: ${{ needs.gate.outputs.qurl_go_workflow_identity }}
          CONNECTOR_GROUP_WORKFLOW: ${{ needs.gate.outputs.connector_workflow_group_identity }}
          QURL_GO_GROUP_WORKFLOW: ${{ needs.gate.outputs.qurl_go_workflow_group_identity }}
        run: |
          set -euo pipefail

          retry_gh_api() {
            local attempt output
            for attempt in 1 2 3; do
              if output="$(gh api "$@")"; then
                printf '%s' "$output"
                return 0
              fi
              echo "::warning::runner-group API read failed on attempt ${attempt}/3; retrying" >&2
              if (( attempt < 3 )); then
                sleep 5
              fi
            done
            return 1
          }

          group="$(
            retry_gh_api \
              "orgs/layervai/actions/runner-groups/${RUNNER_GROUP_ID}"
          )" || {
            echo "::error::could not read runner-group controls after bounded retries"
            exit 1
          }
          jq -e '
            .visibility == "selected" and
            .allows_public_repositories == true and
            .restricted_to_workflows == true
          ' <<<"$group" >/dev/null || {
            echo "::error::runner-group visibility/public/restricted control drift"
            exit 1
          }
          # Assert the identities GitHub actually MATCHES, which are branch
          # refs. A client proof run is dispatched by branch, so its recorded
          # workflow ref is refs/heads/<branch> and never the commit SHA -- a
          # SHA-pinned group matches nothing and the job queues forever beside
          # an idle, correctly-labelled runner.
          #
          # The frozen-head guarantee is NOT weakened: the "Require the frozen
          # client candidate heads" step above independently binds the producer
          # artifact's SHA-form workflow identity to PINNED_CONNECTOR_SHA and
          # PINNED_QURL_GO_SHA. This assertion only scopes WHICH workflow may
          # claim these runners, and it is still exact -- both entries, nothing
          # else.
          jq -e \
            --arg connector "$CONNECTOR_GROUP_WORKFLOW" \
            --arg qurl_go "$QURL_GO_GROUP_WORKFLOW" \
            '(.selected_workflows | sort) == ([$connector, $qurl_go] | sort)' \
            <<<"$group" >/dev/null || {
            echo "::error::runner-group workflows do not pin both candidate head branches"
            exit 1
          }

          repository_lines="$(
            retry_gh_api --paginate \
              "orgs/layervai/actions/runner-groups/${RUNNER_GROUP_ID}/repositories?per_page=100" \
              --jq '.repositories[].full_name'
          )" || {
            echo "::error::could not read runner-group repositories after bounded retries"
            exit 1
          }
          mapfile -t repositories < <(
            printf '%s\n' "$repository_lines" |
              sed '/^$/d' |
              sort
          )
          if (( ${#repositories[@]} != 2 )) ||
            [[ "${repositories[0]:-}" != "layervai/qurl-connector" ]] ||
            [[ "${repositories[1]:-}" != "layervai/qurl-go" ]]; then
            echo "::error::runner-group repository allowlist is not exactly qurl-connector and qurl-go"
            exit 1
          fi

      - id: aws
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.CONTROLLER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare the run-bound qurl-go proof account
        if: inputs.client == 'qurl_go'
        run: |
          set -euo pipefail
          bash .github/scripts/manage_udp_proof_account.sh \
            prepare "${{ github.run_id }}" "${{ github.run_attempt }}"

      - name: Mint the one-use JIT config
        id: jit
        env:
          GH_TOKEN: ${{ steps.app_runner.outputs.token }}
          CLIENT: ${{ inputs.client }}
          RUNNER_GROUP_ID: ${{ vars.UDP_PROOF_RUNNER_GROUP_ID }}
        run: |
          set -euo pipefail
          label="run-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          config="$(gh api -X POST "orgs/layervai/actions/runners/generate-jitconfig" \
            -f "name=udp-proof-${CLIENT}-${{ github.run_id }}-${{ github.run_attempt }}" \
            -F "runner_group_id=${RUNNER_GROUP_ID}" \
            -f "labels[]=self-hosted" -f "labels[]=Linux" -f "labels[]=X64" \
            -f "labels[]=udp-proof" -f "labels[]=sandbox" -f "labels[]=$label" \
            -f "work_folder=_work" --jq '.encoded_jit_config')"
          if (( ${#config} < 32 || ${#config} > 32768 )); then
            echo "::error::JIT configuration length is outside the expected bounds"
            exit 1
          fi
          if [[ ! "$config" =~ ^[A-Za-z0-9_+/=-]+$ ]]; then
            echo "::error::JIT configuration contains unexpected characters"
            exit 1
          fi
          echo "::add-mask::$config"
          echo "config=$config" >>"$GITHUB_OUTPUT"

      # This first token also ages while the JIT secret is written, the broker
      # starts, and the correlated run is resolved. Those bounded pre-wait
      # steps plus the 155-poll first window remain below its one-hour life.
      - name: Mint the narrow proof-dispatch App installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UDP_PROOF_JIT_APP_ID }}
          private-key: ${{ secrets.UDP_PROOF_JIT_APP_PRIVATE_KEY }}
          owner: layervai
          repositories: ${{ inputs.client == 'connector' && 'qurl-connector' || 'qurl-go' }}
          permission-actions: write

      - name: Write the one-use JIT secret
        env:
          JIT_CONFIG: ${{ steps.jit.outputs.config }}
        run: |
          set -euo pipefail
          aws secretsmanager create-secret \
            --name "${JIT_SECRET_PREFIX}${{ github.run_id }}/${{ github.run_attempt }}" \
            --kms-key-id "$JIT_KMS_KEY_ARN" \
            --secret-string "$JIT_CONFIG" \
            --tags Key=Environment,Value=sandbox Key=Purpose,Value=udp-proof \
                   Key=GitHubRunId,Value=${{ github.run_id }} \
                   Key=GitHubRunAttempt,Value=${{ github.run_attempt }} \
            --region "$AWS_REGION" >/dev/null

      - name: Start the broker
        id: broker
        run: |
          set -euo pipefail
          bash .github/scripts/invoke_udp_proof_broker.sh \
            start "${{ github.run_id }}" "${{ github.run_attempt }}" \
            "$GITHUB_OUTPUT"

      - name: Open qurl-go Authority evidence window
        id: authority_window
        if: inputs.client == 'qurl_go'
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - name: Arm qurl-go assignment proof before dispatch
        id: assignment
        if: inputs.client == 'qurl_go'
        env:
          DEPLOYMENT_PROVENANCE_B64: ${{ needs.gate.outputs.deployment_provenance_b64 }}
          PROOF_PHASE: ${{ inputs.proof_phase }}
        run: |
          set -euo pipefail
          python3 .github/scripts/udp_proof_assignment_handshake.py prepare \
            --controller-run-id "${{ github.run_id }}" \
            --controller-run-attempt "${{ github.run_attempt }}" \
            --proof-phase "$PROOF_PHASE" \
            --deployment-provenance-b64 "$DEPLOYMENT_PROVENANCE_B64" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch exact client candidate and resolve run
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLIENT: ${{ inputs.client }}
          PROOF_PHASE: ${{ inputs.proof_phase }}
          DEPLOYMENT_MANIFEST_B64: ${{ needs.gate.outputs.deployment_manifest_b64 }}
          DEPLOYMENT_RUNTIME_INPUTS_B64: ${{ needs.gate.outputs.deployment_runtime_inputs_b64 }}
          RETIREMENT_PROBE_TARGETS_B64: ${{ needs.gate.outputs.retirement_probe_targets_b64 }}
          DEPLOYMENT_PRODUCER_RUN_ID: ${{ needs.gate.outputs.producer_run_id }}
          DEPLOYMENT_PRODUCER_RUN_ATTEMPT: ${{ needs.gate.outputs.producer_run_attempt }}
          DEPLOYMENT_PRODUCER_HEAD_SHA: ${{ needs.gate.outputs.producer_head_sha }}
          DEPLOYMENT_ARTIFACT_ID: ${{ needs.gate.outputs.producer_artifact_id }}
          DEPLOYMENT_ARTIFACT_DIGEST: ${{ needs.gate.outputs.producer_artifact_digest }}
          CLIENT_REPOSITORY: ${{ needs.gate.outputs.client_repository }}
          CLIENT_WORKFLOW: ${{ needs.gate.outputs.client_workflow }}
          CLIENT_REF: ${{ needs.gate.outputs.client_ref }}
          CLIENT_SHA: ${{ needs.gate.outputs.client_sha }}
          PRE_REMOVAL_RUN_ID: ${{ inputs.pre_removal_run_id }}
          ASSIGNMENT_HANDSHAKE_B64: ${{ steps.assignment.outputs.handshake_b64 }}
          ASSIGNMENT_CORRELATION_ID: ${{ steps.assignment.outputs.correlation_id }}
        run: |
          set -euo pipefail
          correlation_id="$ASSIGNMENT_CORRELATION_ID"
          if [[ "$CLIENT" != "qurl_go" ]]; then
            nonce="$(openssl rand -hex 16)"
            [[ "$nonce" =~ ^[0-9a-f]{32}$ ]] || {
              echo "::error::could not generate an exact dispatch correlation nonce"
              exit 1
            }
            correlation_id="$(
              printf 'nhp-%s-%s-%s-%s-%s' \
                "${{ github.run_id }}" \
                "${{ github.run_attempt }}" \
                "$CLIENT" \
                "$PROOF_PHASE" \
                "$nonce"
            )"
          fi
          [[ "$correlation_id" =~ ^nhp-[1-9][0-9]*-[1-9][0-9]*-(connector|qurl_go)-(pre_removal|post_removal)-[0-9a-f]{32}$ ]] || {
            echo "::error::dispatch correlation is not controller-bound"
            exit 1
          }
          expected_title="UDP proof [corr:${correlation_id}]"
          # Persist the exact lookup envelope before dispatch. If GitHub accepts
          # the dispatch but its list API does not surface the run within the
          # bounded resolution window, the always-run cleanup step can still
          # find and cancel that uniquely correlated run.
          {
            echo "client_repository=$CLIENT_REPOSITORY"
            echo "client_workflow=$CLIENT_WORKFLOW"
            echo "client_ref=$CLIENT_REF"
            echo "client_sha=$CLIENT_SHA"
            echo "client_run_title=$expected_title"
            echo "dispatch_correlation_id=$correlation_id"
          } >>"$GITHUB_OUTPUT"
          dispatch_args=(
            -f "proof_phase=$PROOF_PHASE"
            -f "deployment_manifest_b64=$DEPLOYMENT_MANIFEST_B64"
            -f "deployment_runtime_inputs_b64=$DEPLOYMENT_RUNTIME_INPUTS_B64"
            -f "deployment_producer_run_id=$DEPLOYMENT_PRODUCER_RUN_ID"
            -f "deployment_producer_run_attempt=$DEPLOYMENT_PRODUCER_RUN_ATTEMPT"
            -f "deployment_producer_head_sha=$DEPLOYMENT_PRODUCER_HEAD_SHA"
            -f "deployment_artifact_id=$DEPLOYMENT_ARTIFACT_ID"
            -f "deployment_artifact_digest=$DEPLOYMENT_ARTIFACT_DIGEST"
            -f "nhp_controller_run_id=${{ github.run_id }}"
            -f "nhp_controller_run_attempt=${{ github.run_attempt }}"
            -f "dispatch_correlation_id=$correlation_id"
          )
          if [[ -n "$PRE_REMOVAL_RUN_ID" ]]; then
            dispatch_args+=(-f "pre_removal_run_id=$PRE_REMOVAL_RUN_ID")
          fi
          if [[ "$CLIENT" == "qurl_go" ]]; then
            dispatch_args+=(
              -f "assignment_handshake_b64=$ASSIGNMENT_HANDSHAKE_B64"
              -f "retirement_probe_targets_b64=$RETIREMENT_PROBE_TARGETS_B64"
            )
          fi

          gh workflow run "$CLIENT_WORKFLOW" \
            --repo "$CLIENT_REPOSITORY" \
            --ref "$CLIENT_REF" \
            "${dispatch_args[@]}"

          run_id=""
          for attempt in $(seq 1 24); do
            if ! runs="$(
              gh run list \
                --repo "$CLIENT_REPOSITORY" \
                --workflow "$CLIENT_WORKFLOW" \
                --branch "$CLIENT_REF" \
                --event workflow_dispatch \
                --limit 100 \
                --json databaseId,displayTitle,headBranch,headSha
            )"; then
              echo "::warning::client run discovery API failed on attempt ${attempt}/24; retrying"
              if (( attempt < 24 )); then
                sleep 5
              fi
              continue
            fi
            mapfile -t matching_runs < <(
              jq -r \
                --arg title "$expected_title" \
                --arg ref "$CLIENT_REF" \
                --arg sha "$CLIENT_SHA" '
                .[] |
                select(
                  .displayTitle == $title and
                  .headBranch == $ref and
                  .headSha == $sha
                ) |
                .databaseId
              ' <<<"$runs"
            )
            if (( ${#matching_runs[@]} > 1 )); then
              echo "::error::multiple client runs share the supposedly unique dispatch correlation"
              exit 1
            fi
            if (( ${#matching_runs[@]} == 1 )); then
              run_id="${matching_runs[0]}"
              break
            fi
            if (( attempt < 24 )); then
              sleep 5
            fi
          done
          test -n "$run_id" || {
            echo "::error::could not resolve the exact dispatched client run; confirm the candidate branch still points at the manifest SHA and renders the required UDP proof correlation run name"
            exit 1
          }
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::resolved client run ID is not a positive integer"
            exit 1
          }
          echo "client_run_id=$run_id" >>"$GITHUB_OUTPUT"

      - name: Serve exact qurl-go device recovery control
        if: inputs.client == 'qurl_go'
        env:
          DISPATCH_CORRELATION_ID: ${{ steps.dispatch.outputs.dispatch_correlation_id }}
          EXPECTED_AGENT_ID: qurl-go-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          PROOF_RECOVERY_ALIAS_ARN: ${{ needs.gate.outputs.proof_recovery_alias_arn }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${PROOF_RECOVERY_ALIAS_ARN}" =~ ^arn:aws:lambda:us-east-2:767397897469:function:layerv-nhp-sandbox-ca-pcr:(blue|green)$ ]] || {
            echo "::error::producer did not attest the exact selected recovery-control alias"
            exit 1
          }
          request_secret="${RECOVERY_REQUEST_PREFIX}${{ github.run_id }}/${{ github.run_attempt }}"
          response_secret="${RECOVERY_RESPONSE_PREFIX}${{ github.run_id }}/${{ github.run_attempt }}"
          request_file="${RUNNER_TEMP}/proof-recovery-request.json"
          response_file="${RUNNER_TEMP}/proof-recovery-response.json"
          metadata_file="${RUNNER_TEMP}/proof-recovery-invoke.json"
          owner_file="${RUNNER_TEMP}/proof-recovery-owner.json"
          trap 'rm -f "${request_file}" "${response_file}" "${metadata_file}" "${owner_file}"' EXIT

          request_read=false
          for _attempt in $(seq 1 240); do
            if aws secretsmanager get-secret-value \
              --secret-id "${request_secret}" \
              --query SecretString --output text \
              --region "${AWS_REGION}" >"${request_file}" 2>/dev/null; then
              chmod 0600 "${request_file}"
              request_read=true
              break
            fi
            sleep 5
          done
          "${request_read}" || {
            echo "::error::qurl-go did not publish its private recovery checkpoint in time"
            exit 1
          }
          jq -e \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg correlation "${DISPATCH_CORRELATION_ID}" \
            --arg agent_id "${EXPECTED_AGENT_ID}" '
            (keys | sort) == [
              "agent_id", "assignment_generation", "cell_id",
              "controller_run_attempt", "controller_run_id",
              "device_api_key_id", "grant_correlation_id", "version"
            ] and
            .version == 1 and
            .controller_run_id == $run_id and
            .controller_run_attempt == $run_attempt and
            .grant_correlation_id == $correlation and
            .agent_id == $agent_id and
            (.device_api_key_id | type == "string" and test("^key_[A-Za-z0-9]{12}$")) and
            (.cell_id | type == "string" and test("^[a-z0-9]+(?:-[a-z0-9]+)*$")) and
            (.assignment_generation | type == "string" and test("^[1-9][0-9]{0,19}$"))
          ' "${request_file}" >/dev/null || {
            echo "::error::qurl-go recovery checkpoint was not bound to this controller run"
            exit 1
          }

          owner_id="layerv-nhp-sandbox-udp-proof"
          customers_table="layerv-nhp-sandbox-control-qurl-customers"
          owner_now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          aws dynamodb update-item \
            --table-name "${customers_table}" \
            --key '{"auth0_subject":{"S":"layerv-nhp-sandbox-udp-proof"}}' \
            --update-expression 'SET #tier = :system, #updated = :now' \
            --condition-expression \
              'auth0_subject = :owner AND attribute_type(email, :type_s) AND size(email) > :zero AND attribute_type(#tier, :type_s) AND attribute_type(frozen, :type_bool) AND attribute_type(frozen_reason, :type_s) AND attribute_type(created_at, :type_s) AND attribute_type(#updated, :type_s) AND attribute_type(current_period_usage, :type_n) AND attribute_type(spending_cap_cents, :type_n) AND attribute_type(unit_price_cents, :type_n)' \
            --expression-attribute-names \
              '{"#tier":"tier","#updated":"updated_at"}' \
            --expression-attribute-values \
              "{\":system\":{\"S\":\"system\"},\":now\":{\"S\":\"${owner_now}\"},\":owner\":{\"S\":\"${owner_id}\"},\":type_s\":{\"S\":\"S\"},\":type_bool\":{\"S\":\"BOOL\"},\":type_n\":{\"S\":\"N\"},\":zero\":{\"N\":\"0\"}}" \
            --return-values ALL_NEW \
            --region "${AWS_REGION}" >"${owner_file}"
          chmod 0600 "${owner_file}"
          jq -e --arg owner "${owner_id}" --arg now "${owner_now}" '
            .Attributes.auth0_subject.S == $owner and
            (.Attributes.email.S | type == "string" and length > 0) and
            .Attributes.tier.S == "system" and
            .Attributes.frozen.BOOL == false and
            (.Attributes.frozen_reason.S | type == "string") and
            (.Attributes.created_at.S | type == "string" and length > 0) and
            .Attributes.updated_at.S == $now and
            (.Attributes.current_period_usage.N | test("^-?[0-9]+$")) and
            (.Attributes.spending_cap_cents.N | test("^-?[0-9]+$")) and
            (.Attributes.unit_price_cents.N | test("^-?[0-9]+$"))
          ' "${owner_file}" >/dev/null || {
            echo "::error::dedicated proof owner was not read back as a complete system tenant"
            exit 1
          }

          if ! aws lambda invoke \
            --function-name "${PROOF_RECOVERY_ALIAS_ARN}" \
            --cli-binary-format raw-in-base64-out \
            --payload "fileb://${request_file}" \
            --region "${AWS_REGION}" \
            "${response_file}" >"${metadata_file}" 2>/dev/null ||
            ! jq -e '.StatusCode == 200 and (has("FunctionError") | not)' "${metadata_file}" >/dev/null; then
            echo "::error::could not invoke the selected private recovery-control alias"
            exit 1
          fi
          chmod 0600 "${response_file}"
          jq -e --slurpfile request "${request_file}" '
            (keys | sort) == ["result", "version"] and
            .version == 1 and
            (.result | keys | sort) == [
              "agent_id", "assignment_generation", "cell_id",
              "controller_run_attempt", "controller_run_id",
              "grant_correlation_id", "recovery_credential",
              "recovery_credential_key_id", "revoked_at",
              "revoked_device_api_key_id"
            ] and
            .result.controller_run_id == $request[0].controller_run_id and
            .result.controller_run_attempt == $request[0].controller_run_attempt and
            .result.grant_correlation_id == $request[0].grant_correlation_id and
            .result.agent_id == $request[0].agent_id and
            .result.revoked_device_api_key_id == $request[0].device_api_key_id and
            .result.cell_id == $request[0].cell_id and
            .result.assignment_generation == $request[0].assignment_generation and
            (.result.recovery_credential | type == "string" and
              test("^lv_(live|test)_[A-Za-z0-9_-]{43}$")) and
            (.result.recovery_credential_key_id | type == "string" and
              test("^key_[A-Za-z0-9]{12}$")) and
            (.result.revoked_at | type == "string" and
              test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
          ' "${response_file}" >/dev/null || {
            echo "::error::private recovery control returned an invalid or mismatched receipt"
            exit 1
          }
          aws secretsmanager create-secret \
            --name "${response_secret}" \
            --kms-key-id "${JIT_KMS_KEY_ARN}" \
            --secret-string "file://${response_file}" \
            --tags \
              Key=Environment,Value=sandbox \
              Key=Purpose,Value=udp-proof-recovery-response \
              Key=GitHubRunId,Value=${{ github.run_id }} \
              Key=GitHubRunAttempt,Value=${{ github.run_attempt }} \
            --region "${AWS_REGION}" >/dev/null
          aws secretsmanager delete-secret \
            --secret-id "${request_secret}" \
            --force-delete-without-recovery \
            --region "${AWS_REGION}" >/dev/null

      - name: Refresh AWS credentials after recovery checkpoint
        if: inputs.client == 'qurl_go'
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.CONTROLLER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Complete qurl-go assignment mutation after authenticated checkpoint
        if: inputs.client == 'qurl_go'
        env:
          ASSIGNMENT_HANDSHAKE_B64: ${{ steps.assignment.outputs.handshake_b64 }}
        run: |
          set -euo pipefail
          python3 .github/scripts/udp_proof_assignment_handshake.py complete \
            --handshake-b64 "$ASSIGNMENT_HANDSHAKE_B64" \
            --client-run-id "${{ steps.dispatch.outputs.client_run_id }}" \
            --client-sha "${{ steps.dispatch.outputs.client_sha }}" \
            --assignment-receipt-output \
              "${RUNNER_TEMP}/assignment-receipt.json" \
            --transport-receipt-output \
              "${RUNNER_TEMP}/transport-receipt.json" \
            --timeout-seconds 1800

      - name: Refresh proof token after assignment and recovery checkpoints
        id: app_wait1
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UDP_PROOF_JIT_APP_ID }}
          private-key: ${{ secrets.UDP_PROOF_JIT_APP_PRIVATE_KEY }}
          owner: layervai
          repositories: ${{ inputs.client == 'connector' && 'qurl-connector' || 'qurl-go' }}
          permission-actions: write

      # Installation tokens expire after one hour, while the longest client
      # proof has a 90-minute job budget that starts only after its JIT runner
      # accepts the job. Assignment checkpointing is separately capped at
      # 30 minutes under its 35-minute arm lease. Mint the first wait token only
      # after that checkpoint, then use three independent 155-poll windows so
      # the remaining client work and artifact finalization have about 115.5
      # minutes of sleep intervals without any token nearing expiry. Together,
      # those bounds remain below the 165-minute controller cap.
      # A failure-only cancellation step mints another token below instead of
      # spending the final verification token's tail.
      - name: Wait for client proof (first token window)
        env:
          GH_TOKEN: ${{ steps.app_wait1.outputs.token }}
          CLIENT_RUN_ID: ${{ steps.dispatch.outputs.client_run_id }}
          CLIENT_REPOSITORY: ${{ steps.dispatch.outputs.client_repository }}
        run: |
          set -euo pipefail
          rm -f /tmp/udp-proof-client-run.json
          bash .github/scripts/wait_for_action_run.sh \
            "$CLIENT_REPOSITORY" "$CLIENT_RUN_ID" 155 allow \
            /tmp/udp-proof-client-run.json

      - name: Refresh the narrow JIT App token for the second wait window
        id: app_wait2
        if: always() && steps.dispatch.outcome == 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UDP_PROOF_JIT_APP_ID }}
          private-key: ${{ secrets.UDP_PROOF_JIT_APP_PRIVATE_KEY }}
          owner: layervai
          repositories: ${{ inputs.client == 'connector' && 'qurl-connector' || 'qurl-go' }}
          permission-actions: read

      - name: Wait for client proof (second token window)
        if: always() && steps.app_wait2.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app_wait2.outputs.token }}
          CLIENT_RUN_ID: ${{ steps.dispatch.outputs.client_run_id }}
          CLIENT_REPOSITORY: ${{ steps.dispatch.outputs.client_repository }}
        run: |
          set -euo pipefail
          bash .github/scripts/wait_for_action_run.sh \
            "$CLIENT_REPOSITORY" "$CLIENT_RUN_ID" 155 allow \
            /tmp/udp-proof-client-run.json

      - name: Refresh the final narrow JIT App token for verification
        id: app_final
        if: always() && steps.app_wait2.outcome == 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UDP_PROOF_JIT_APP_ID }}
          private-key: ${{ secrets.UDP_PROOF_JIT_APP_PRIVATE_KEY }}
          owner: layervai
          repositories: ${{ inputs.client == 'connector' && 'qurl-connector' || 'qurl-go' }}
          permission-actions: write

      - name: Verify exact client run
        id: verify
        if: always() && steps.app_final.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app_final.outputs.token }}
          CLIENT_RUN_ID: ${{ steps.dispatch.outputs.client_run_id }}
          CLIENT_REPOSITORY: ${{ steps.dispatch.outputs.client_repository }}
          CLIENT_WORKFLOW: ${{ steps.dispatch.outputs.client_workflow }}
          CLIENT_REF: ${{ steps.dispatch.outputs.client_ref }}
          CLIENT_SHA: ${{ steps.dispatch.outputs.client_sha }}
          CLIENT_RUN_TITLE: ${{ steps.dispatch.outputs.client_run_title }}
          CLIENT: ${{ inputs.client }}
          PROOF_PHASE: ${{ inputs.proof_phase }}
        run: |
          set -euo pipefail
          bash .github/scripts/wait_for_action_run.sh \
            "$CLIENT_REPOSITORY" "$CLIENT_RUN_ID" 155 fail \
            /tmp/udp-proof-client-run.json
          run="$(</tmp/udp-proof-client-run.json)"
          jq -e \
            --arg repository "$CLIENT_REPOSITORY" \
            --arg workflow_path ".github/workflows/$CLIENT_WORKFLOW" \
            --arg ref "$CLIENT_REF" \
            --arg sha "$CLIENT_SHA" \
            --arg title "$CLIENT_RUN_TITLE" '
            .status == "completed" and
            .conclusion == "success" and
            .event == "workflow_dispatch" and
            .run_attempt == 1 and
            .repository.full_name == $repository and
            .path == $workflow_path and
            .head_branch == $ref and
            .head_sha == $sha and
            .display_title == $title
          ' <<<"$run" >/dev/null || {
            echo "::error::client proof run did not preserve exact dispatch provenance"
            exit 1
          }

          runner_label="run-${{ github.run_id }}-attempt-${{ github.run_attempt }}"
          jobs="$(
            gh api --paginate --slurp \
              "repos/${CLIENT_REPOSITORY}/actions/runs/${CLIENT_RUN_ID}/jobs?filter=all&per_page=100" |
              jq '{
                total_count: (.[0].total_count // 0),
                jobs: [.[].jobs[]]
              }'
          )"
          # The jobs API reports labels declared by each client's `runs-on`,
          # not every label registered on the JIT runner. Both pinned client
          # workflows deliberately compose this exact controller-bound label
          # from the dispatched run-id and attempt inputs.
          jq -e --arg runner_label "$runner_label" '
            .total_count == (.jobs | length) and
            ([.jobs[] | select((.labels // []) | index($runner_label))] | length == 1)
          ' <<<"$jobs" >/dev/null || {
            echo "::error::client proof did not use exactly one controller-bound JIT runner job"
            exit 1
          }

          artifact_metadata_read=false
          for attempt in 1 2 3; do
            if timeout 30s gh api \
              "repos/${CLIENT_REPOSITORY}/actions/runs/${CLIENT_RUN_ID}/artifacts?per_page=100" \
              > /tmp/udp-proof-client-artifacts.json.tmp; then
              mv /tmp/udp-proof-client-artifacts.json.tmp /tmp/udp-proof-client-artifacts.json
              artifact_metadata_read=true
              break
            fi
            rm -f /tmp/udp-proof-client-artifacts.json.tmp
            echo "::warning::client artifact metadata read failed on attempt ${attempt}/3; retrying" >&2
            if (( attempt < 3 )); then
              sleep 5
            fi
          done
          "$artifact_metadata_read" || {
            echo "::error::could not authenticate the client artifact after bounded retries"
            exit 1
          }
          python3 .github/scripts/validate_udp_proof_client_artifact.py metadata \
            --run-json /tmp/udp-proof-client-run.json \
            --artifacts-json /tmp/udp-proof-client-artifacts.json \
            --client "$CLIENT" \
            --proof-phase "$PROOF_PHASE" \
            --client-run-id "$CLIENT_RUN_ID" \
            --client-repository "$CLIENT_REPOSITORY" \
            --client-ref "$CLIENT_REF" \
            --client-sha "$CLIENT_SHA" \
            --client-run-title "$CLIENT_RUN_TITLE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download and validate exact client proof artifact
        id: result
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app_final.outputs.token }}
          CLIENT: ${{ inputs.client }}
          PROOF_PHASE: ${{ inputs.proof_phase }}
          CLIENT_RUN_ID: ${{ steps.dispatch.outputs.client_run_id }}
          CLIENT_RUN_ATTEMPT: ${{ steps.verify.outputs.client_run_attempt }}
          CLIENT_REPOSITORY: ${{ steps.dispatch.outputs.client_repository }}
          CLIENT_SHA: ${{ steps.dispatch.outputs.client_sha }}
          DISPATCH_CORRELATION_ID: ${{ steps.dispatch.outputs.dispatch_correlation_id }}
          CLIENT_ARTIFACT_ID: ${{ steps.verify.outputs.client_artifact_id }}
          CLIENT_ARTIFACT_DIGEST: ${{ steps.verify.outputs.client_artifact_digest }}
          DEPLOYMENT_MANIFEST_SHA256: ${{ needs.gate.outputs.deployment_manifest_sha256 }}
          DEPLOYMENT_RUNTIME_INPUTS_SHA256: ${{ needs.gate.outputs.deployment_runtime_inputs_sha256 }}
          DEPLOYMENT_PROVENANCE_SHA256: ${{ needs.gate.outputs.deployment_provenance_sha256 }}
          RETIREMENT_PROBE_TARGETS_SHA256: ${{ needs.gate.outputs.retirement_probe_targets_sha256 }}
          RETIREMENT_PROBE_TARGETS_B64: ${{ needs.gate.outputs.retirement_probe_targets_b64 }}
          PRODUCER_RUN_ID: ${{ needs.gate.outputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.gate.outputs.producer_run_attempt }}
          PRODUCER_HEAD_SHA: ${{ needs.gate.outputs.producer_head_sha }}
          PRODUCER_ARTIFACT_ID: ${{ needs.gate.outputs.producer_artifact_id }}
          PRODUCER_ARTIFACT_DIGEST: ${{ needs.gate.outputs.producer_artifact_digest }}
          PRE_REMOVAL_RUN_ID: ${{ inputs.pre_removal_run_id }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/udp-proof-client-artifact.zip"
          directory="${RUNNER_TEMP}/udp-proof-client-artifact"
          rm -f "$archive" "${archive}.tmp"
          rm -rf "$directory"
          downloaded=false
          for attempt in 1 2 3; do
            if timeout 30s gh api \
              "repos/${CLIENT_REPOSITORY}/actions/artifacts/${CLIENT_ARTIFACT_ID}/zip" \
              > "${archive}.tmp"; then
              mv "${archive}.tmp" "$archive"
              downloaded=true
              break
            fi
            rm -f "${archive}.tmp"
            echo "::warning::client artifact download failed on attempt ${attempt}/3; retrying" >&2
            if (( attempt < 3 )); then
              sleep 5
            fi
          done
          "$downloaded" || {
            echo "::error::could not download the exact client artifact after bounded retries"
            exit 1
          }

          python3 .github/scripts/validate_udp_proof_client_artifact.py archive \
            --archive "$archive" \
            --directory "$directory" \
            --client "$CLIENT" \
            --expected-digest "$CLIENT_ARTIFACT_DIGEST"
          python3 .github/scripts/validate_udp_proof_client_artifact.py files \
            --directory "$directory" \
            --client "$CLIENT" \
            --proof-phase "$PROOF_PHASE" \
            --client-repository "$CLIENT_REPOSITORY" \
            --client-sha "$CLIENT_SHA" \
            --client-run-id "$CLIENT_RUN_ID" \
            --client-run-attempt "$CLIENT_RUN_ATTEMPT" \
            --dispatch-correlation-id "$DISPATCH_CORRELATION_ID" \
            --controller-run-id "${{ github.run_id }}" \
            --controller-run-attempt "${{ github.run_attempt }}" \
            --deployment-manifest-sha256 "$DEPLOYMENT_MANIFEST_SHA256" \
            --deployment-runtime-inputs-sha256 "$DEPLOYMENT_RUNTIME_INPUTS_SHA256" \
            --deployment-provenance-sha256 "$DEPLOYMENT_PROVENANCE_SHA256" \
            --retirement-probe-targets-sha256 "$RETIREMENT_PROBE_TARGETS_SHA256" \
            --retirement-probe-targets-b64 "$RETIREMENT_PROBE_TARGETS_B64" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --producer-head-sha "$PRODUCER_HEAD_SHA" \
            --producer-artifact-id "$PRODUCER_ARTIFACT_ID" \
            --producer-artifact-digest "$PRODUCER_ARTIFACT_DIGEST" \
            --pre-removal-run-id "$PRE_REMOVAL_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

          {
            echo "### UDP proof dispatch"
            echo
            echo "- Client: \`${{ inputs.client }}\`"
            echo "- Phase: \`${{ inputs.proof_phase }}\`"
            echo "- Candidate: \`${CLIENT_SHA}\`"
            echo "- Deployment producer: [run ${{ needs.gate.outputs.producer_run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ needs.gate.outputs.producer_run_id }})"
            echo "- Deployment artifact: \`${{ needs.gate.outputs.producer_artifact_id }}\` / \`${{ needs.gate.outputs.producer_artifact_digest }}\`"
            echo "- Client run: [${CLIENT_RUN_ID}](https://github.com/${CLIENT_REPOSITORY}/actions/runs/${CLIENT_RUN_ID})"
            echo "- Client artifact: \`${CLIENT_ARTIFACT_ID}\` / \`${CLIENT_ARTIFACT_DIGEST}\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Refresh AWS credentials for qurl-go Authority evidence
        if: inputs.client == 'qurl_go' && steps.result.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.CONTROLLER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Collect exact post-probe server receipt
        id: server_receipt
        if: inputs.client == 'qurl_go' && steps.result.outcome == 'success'
        env:
          ASSIGNMENT_HANDSHAKE_B64: ${{ steps.assignment.outputs.handshake_b64 }}
          RETIREMENT_PROBE_TARGETS_B64: ${{ needs.gate.outputs.retirement_probe_targets_b64 }}
          RETIREMENT_PROBE_TARGETS_SHA256: ${{ needs.gate.outputs.retirement_probe_targets_sha256 }}
        run: |
          set -euo pipefail
          python3 .github/scripts/collect_udp_proof_server_receipt.py \
            --handshake-b64 "$ASSIGNMENT_HANDSHAKE_B64" \
            --retirement-probe-targets-b64 "$RETIREMENT_PROBE_TARGETS_B64" \
            --targets-sha256 "$RETIREMENT_PROBE_TARGETS_SHA256" \
            --runtime-probe \
              "${RUNNER_TEMP}/udp-proof-client-artifact/runtime-probe-observations.json" \
            --client-run-id "${{ steps.dispatch.outputs.client_run_id }}" \
            --client-run-attempt "${{ steps.verify.outputs.client_run_attempt }}" \
            --client-sha "${{ steps.dispatch.outputs.client_sha }}" \
            --output "${RUNNER_TEMP}/post-probe-server-receipt.json"

      - name: Verify qurl-go Authority executed version and zero spill
        if: inputs.client == 'qurl_go' && steps.result.outcome == 'success'
        env:
          DEPLOYMENT_PROVENANCE_B64: ${{ needs.gate.outputs.deployment_provenance_b64 }}
          PROOF_STARTED_AT: ${{ steps.authority_window.outputs.started_at }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_udp_proof_authority_evidence.py evidence \
            --deployment-provenance-b64 "$DEPLOYMENT_PROVENANCE_B64" \
            --proof-start-time "$PROOF_STARTED_AT" \
            >"${RUNNER_TEMP}/qurl-go-authority-evidence.json"
          {
            echo "- Authority proof: selected ExecutedVersion exact; blue/green pools READY; spillover/errors/throttles zero"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Build current-attempt controller attestation
        if: >-
          success() &&
          steps.result.outcome == 'success' &&
          (inputs.client == 'connector' || steps.server_receipt.outcome == 'success')
        env:
          CLIENT: ${{ inputs.client }}
          PROOF_PHASE: ${{ inputs.proof_phase }}
          CONTROLLER_HEAD_SHA: ${{ github.sha }}
          PRODUCER_RUN_ID: ${{ needs.gate.outputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ needs.gate.outputs.producer_run_attempt }}
          PRODUCER_HEAD_SHA: ${{ needs.gate.outputs.producer_head_sha }}
          PRODUCER_ARTIFACT_ID: ${{ needs.gate.outputs.producer_artifact_id }}
          PRODUCER_ARTIFACT_DIGEST: ${{ needs.gate.outputs.producer_artifact_digest }}
          CLIENT_RUN_ID: ${{ steps.dispatch.outputs.client_run_id }}
          CLIENT_RUN_ATTEMPT: ${{ steps.verify.outputs.client_run_attempt }}
          CLIENT_HEAD_SHA: ${{ steps.dispatch.outputs.client_sha }}
          CLIENT_ARTIFACT_ID: ${{ steps.verify.outputs.client_artifact_id }}
          CLIENT_ARTIFACT_DIGEST: ${{ steps.verify.outputs.client_artifact_digest }}
          CLIENT_EVIDENCE_SHA256: ${{ steps.result.outputs.client_evidence_sha256 }}
          CLIENT_TYPED_EVIDENCE_SHA256: ${{ steps.result.outputs.client_typed_evidence_sha256 }}
          CLIENT_PACKET_CAPTURE_SHA256: ${{ steps.result.outputs.client_packet_capture_sha256 }}
          RUNNER_INSTANCE_ID: ${{ steps.broker.outputs.instance_id }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/udp-proof-controller-attestation"
          rm -rf "$bundle"
          mkdir -p "$bundle/client-artifact"
          cp -R "${RUNNER_TEMP}/udp-proof-client-artifact/." \
            "$bundle/client-artifact/"
          runtime_args=()
          if [[ "$CLIENT" == "qurl_go" ]]; then
            runtime_args=(
              --assignment-receipt "${RUNNER_TEMP}/assignment-receipt.json"
              --transport-receipt "${RUNNER_TEMP}/transport-receipt.json"
              --runtime-probe \
                "${RUNNER_TEMP}/udp-proof-client-artifact/runtime-probe-observations.json"
              --server-receipt "${RUNNER_TEMP}/post-probe-server-receipt.json"
            )
          fi
          python3 .github/scripts/collect_udp_proof_controller_attestation.py \
            --client "$CLIENT" \
            --proof-phase "$PROOF_PHASE" \
            --producer-directory udp-proof-producer-artifact \
            --client-directory "${RUNNER_TEMP}/udp-proof-client-artifact" \
            --controller-run-id "${{ github.run_id }}" \
            --controller-run-attempt "${{ github.run_attempt }}" \
            --controller-head-sha "$CONTROLLER_HEAD_SHA" \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --producer-run-attempt "$PRODUCER_RUN_ATTEMPT" \
            --producer-head-sha "$PRODUCER_HEAD_SHA" \
            --producer-artifact-id "$PRODUCER_ARTIFACT_ID" \
            --producer-artifact-digest "$PRODUCER_ARTIFACT_DIGEST" \
            --client-run-id "$CLIENT_RUN_ID" \
            --client-run-attempt "$CLIENT_RUN_ATTEMPT" \
            --client-head-sha "$CLIENT_HEAD_SHA" \
            --client-artifact-id "$CLIENT_ARTIFACT_ID" \
            --client-artifact-digest "$CLIENT_ARTIFACT_DIGEST" \
            --client-evidence-sha256 "$CLIENT_EVIDENCE_SHA256" \
            --client-typed-evidence-sha256 "$CLIENT_TYPED_EVIDENCE_SHA256" \
            --packet-capture-sha256 "$CLIENT_PACKET_CAPTURE_SHA256" \
            --runner-instance-id "$RUNNER_INSTANCE_ID" \
            "${runtime_args[@]}" \
            --output "$bundle/controller-attestation.json"

      - name: Upload current-attempt controller attestation
        if: >-
          success() &&
          steps.result.outcome == 'success' &&
          (inputs.client == 'connector' || steps.server_receipt.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: udp-proof-controller-attestation-${{ inputs.client }}-${{ inputs.proof_phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/udp-proof-controller-attestation
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

      - name: Upload qurl-go Authority evidence
        if: inputs.client == 'qurl_go' && steps.result.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qurl-go-authority-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qurl-go-authority-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload post-probe server receipt
        if: inputs.client == 'qurl_go' && steps.result.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-probe-server-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-probe-server-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Refresh the narrow App token for failure cancellation
        id: app_cancel
        if: >-
          always() &&
          steps.dispatch.outputs.client_run_title != '' &&
          steps.result.outcome != 'success'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UDP_PROOF_JIT_APP_ID }}
          private-key: ${{ secrets.UDP_PROOF_JIT_APP_PRIVATE_KEY }}
          owner: layervai
          repositories: ${{ inputs.client == 'connector' && 'qurl-connector' || 'qurl-go' }}
          permission-actions: write

      - name: Cancel unfinished client run after controller failure
        if: >-
          always() &&
          steps.dispatch.outputs.client_run_title != '' &&
          steps.result.outcome != 'success'
        env:
          # app_final is at most one 155-poll window old here. Earlier tokens
          # may be expired after a full proof and are intentionally not fallbacks.
          GH_TOKEN: ${{ steps.app_cancel.outputs.token || steps.app_final.outputs.token }}
          CLIENT_RUN_ID: ${{ steps.dispatch.outputs.client_run_id }}
          CLIENT_REPOSITORY: ${{ steps.dispatch.outputs.client_repository }}
          CLIENT_WORKFLOW: ${{ steps.dispatch.outputs.client_workflow }}
          CLIENT_REF: ${{ steps.dispatch.outputs.client_ref }}
          CLIENT_SHA: ${{ steps.dispatch.outputs.client_sha }}
          CLIENT_RUN_TITLE: ${{ steps.dispatch.outputs.client_run_title }}
        run: |
          set -euo pipefail
          if [[ -z "$CLIENT_RUN_ID" ]]; then
            last_lookup_succeeded=false
            for attempt in $(seq 1 12); do
              if ! runs="$(
                gh run list \
                  --repo "$CLIENT_REPOSITORY" \
                  --workflow "$CLIENT_WORKFLOW" \
                  --branch "$CLIENT_REF" \
                  --event workflow_dispatch \
                  --limit 100 \
                  --json databaseId,displayTitle,headBranch,headSha
              )"; then
                last_lookup_succeeded=false
                echo "::warning::unresolved-run cleanup lookup failed on attempt ${attempt}/12; retrying"
              else
                last_lookup_succeeded=true
                mapfile -t matching_runs < <(
                  jq -r \
                    --arg title "$CLIENT_RUN_TITLE" \
                    --arg ref "$CLIENT_REF" '
                    .[] |
                    select(
                      .displayTitle == $title and
                      .headBranch == $ref
                    ) |
                    [.databaseId, .headSha] |
                    @tsv
                  ' <<<"$runs"
                )
                if (( ${#matching_runs[@]} > 1 )); then
                  echo "::error::multiple unresolved client runs share the supposedly unique dispatch correlation"
                  exit 1
                fi
                if (( ${#matching_runs[@]} == 1 )); then
                  IFS=$'\t' read -r CLIENT_RUN_ID resolved_client_sha \
                    <<<"${matching_runs[0]}"
                  if [[ "$resolved_client_sha" != "$CLIENT_SHA" ]]; then
                    echo "::warning::cancelling the uniquely correlated client run after candidate branch SHA movement"
                  fi
                  break
                fi
              fi
              if (( attempt < 12 )); then
                sleep 5
              fi
            done
            "$last_lookup_succeeded" || {
              echo "::error::could not complete a trustworthy unresolved-run cleanup lookup"
              exit 1
            }
            # A dispatch rejected before creating a run needs no cancellation.
            [[ -n "$CLIENT_RUN_ID" ]] || exit 0
          fi
          [[ "$CLIENT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::client run ID selected for cancellation is not a positive integer"
            exit 1
          }
          status=""
          for attempt in $(seq 1 3); do
            if status="$(gh api \
              "repos/${CLIENT_REPOSITORY}/actions/runs/${CLIENT_RUN_ID}" \
              --jq '.status')"; then
              break
            fi
            echo "::warning::client run status lookup failed on attempt ${attempt}/3; retrying"
            if (( attempt < 3 )); then
              sleep 5
            fi
          done
          [[ "$status" =~ ^(queued|in_progress|completed|requested|waiting|pending)$ ]] || {
            echo "::error::could not read a trustworthy client run status before cancellation"
            exit 1
          }
          if [[ "$status" != "completed" ]]; then
            cancel_requested=false
            for attempt in $(seq 1 3); do
              if gh run cancel "$CLIENT_RUN_ID" --repo "$CLIENT_REPOSITORY"; then
                cancel_requested=true
                break
              fi
              # The run can complete between the status read and cancellation
              # request. Treat that exact terminal state as successful cleanup;
              # every other cancellation error remains inside the retry budget.
              if status="$(gh api \
                "repos/${CLIENT_REPOSITORY}/actions/runs/${CLIENT_RUN_ID}" \
                --jq '.status')" &&
                [[ "$status" == "completed" ]]; then
                exit 0
              fi
              echo "::warning::client run cancellation request failed on attempt ${attempt}/3; retrying"
              if (( attempt < 3 )); then
                sleep 5
              fi
            done
            "$cancel_requested" || {
              echo "::error::could not submit client run cancellation"
              exit 1
            }
            # Give GitHub up to five minutes to converge the accepted
            # cancellation while the broker's independent reapers remain active.
            for attempt in $(seq 1 60); do
              if ! status="$(gh api \
                "repos/${CLIENT_REPOSITORY}/actions/runs/${CLIENT_RUN_ID}" \
                --jq '.status')"; then
                echo "::warning::cancellation confirmation lookup failed on attempt ${attempt}/60; retrying"
                sleep 5
                continue
              fi
              [[ "$status" == "completed" ]] && exit 0
              sleep 5
            done
            echo "::error::client proof run did not confirm cancellation"
            exit 1
          fi

      # The controller role is capped at a one-hour session, while an attended
      # client proof may consume the full 90-minute wait budget. Refresh via
      # OIDC immediately before cleanup so expiry cannot strand the runner or
      # its one-use JIT secret. The stop step still runs and reports failure if
      # this refresh itself fails.
      - name: Refresh AWS credentials for broker cleanup
        if: always() && steps.aws.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ env.CONTROLLER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove the run-bound qurl-go proof account
        if: always() && inputs.client == 'qurl_go' && steps.aws.outcome == 'success'
        run: |
          set -euo pipefail
          bash .github/scripts/manage_udp_proof_account.sh \
            cleanup "${{ github.run_id }}" "${{ github.run_attempt }}"

      - name: Stop the broker (always)
        if: always() && steps.aws.outcome == 'success'
        run: |
          set -euo pipefail
          # The broker owns JIT and both recovery mailboxes. Its helper retries
          # five times and fails this always() step loudly if cleanup cannot be
          # confirmed; the independent five-minute sweep remains the backstop.
          bash .github/scripts/invoke_udp_proof_broker.sh \
            stop "${{ github.run_id }}" "${{ github.run_attempt }}"
