name: Blue/Green Deploy

# Blue/Green deployment for NHP Server and/or AC with instant traffic switching
#
# This workflow enables:
# - Deploy new image to standby ASG
# - Instant traffic switch via NLB listener modification (<1 second)
# - Sub-second rollback capability
# - Warm standby (1 instance) for previous color
#
# Prerequisites:
# - enable_blue_green = true (server) or enable_ac_blue_green = true (ac) in terraform.tfvars
# - Green ASG and target groups created via terraform apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - sandbox
      component:
        description: 'Component to deploy'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - ac
          - both
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy      # Deploy new image to standby, switch traffic
          - rollback    # Switch traffic back to previous color
          - switch-only # Just switch traffic (no image update)
      image_tag:
        description: 'Image tag to deploy (required for deploy action)'
        required: false
        type: string
      skip_validation:
        description: 'Skip post-switch validation'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run mode - show what would be done without executing'
        required: false
        default: false
        type: boolean
      refresh_timeout_minutes:
        description: 'Instance refresh timeout in minutes (5-60, default: 10)'
        required: false
        default: 10
        type: number
      health_check_timeout_minutes:
        description: 'Target group health check timeout in minutes (2-30, default: 5)'
        required: false
        default: 5
        type: number

permissions:
  id-token: write
  contents: read

# Only one blue/green deployment per environment+component at a time
concurrency:
  group: blue-green-${{ inputs.environment }}-${{ inputs.component }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  # =============================================================================
  # PREPARE - Read SSM state and determine active/standby colors
  # =============================================================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    outputs:
      # Server outputs
      server_active_color: ${{ steps.server-state.outputs.active_color }}
      server_standby_color: ${{ steps.server-state.outputs.standby_color }}
      server_active_asg: ${{ steps.server-state.outputs.active_asg }}
      server_standby_asg: ${{ steps.server-state.outputs.standby_asg }}
      server_active_image_tag: ${{ steps.server-state.outputs.active_image_tag }}
      server_standby_image_tag: ${{ steps.server-state.outputs.standby_image_tag }}
      server_primary_listener_arn: ${{ steps.server-state.outputs.primary_listener_arn }}
      server_blue_primary_tg_arn: ${{ steps.server-state.outputs.blue_primary_tg_arn }}
      server_green_primary_tg_arn: ${{ steps.server-state.outputs.green_primary_tg_arn }}
      server_secondary_listener_arn: ${{ steps.server-state.outputs.secondary_listener_arn }}
      server_blue_secondary_tg_arn: ${{ steps.server-state.outputs.blue_secondary_tg_arn }}
      server_green_secondary_tg_arn: ${{ steps.server-state.outputs.green_secondary_tg_arn }}
      server_target_image_tag: ${{ steps.validate.outputs.server_target_image_tag }}
      # AC outputs
      ac_active_color: ${{ steps.ac-state.outputs.active_color }}
      ac_standby_color: ${{ steps.ac-state.outputs.standby_color }}
      ac_active_asg: ${{ steps.ac-state.outputs.active_asg }}
      ac_standby_asg: ${{ steps.ac-state.outputs.standby_asg }}
      ac_active_image_tag: ${{ steps.ac-state.outputs.active_image_tag }}
      ac_standby_image_tag: ${{ steps.ac-state.outputs.standby_image_tag }}
      ac_primary_listener_arn: ${{ steps.ac-state.outputs.primary_listener_arn }}
      ac_blue_primary_tg_arn: ${{ steps.ac-state.outputs.blue_primary_tg_arn }}
      ac_green_primary_tg_arn: ${{ steps.ac-state.outputs.green_primary_tg_arn }}
      ac_target_image_tag: ${{ steps.validate.outputs.ac_target_image_tag }}
      # Flags - reconciled after SSM state reads (handles component=both with only one enabled)
      deploy_server: ${{ steps.reconcile.outputs.deploy_server }}
      deploy_ac: ${{ steps.reconcile.outputs.deploy_ac }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Components
        id: components
        run: |
          COMPONENT="${{ inputs.component }}"
          if [[ "$COMPONENT" == "server" || "$COMPONENT" == "both" ]]; then
            echo "deploy_server=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_server=false" >> $GITHUB_OUTPUT
          fi
          if [[ "$COMPONENT" == "ac" || "$COMPONENT" == "both" ]]; then
            echo "deploy_ac=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_ac=false" >> $GITHUB_OUTPUT
          fi

      - name: Read Server SSM State
        id: server-state
        if: steps.components.outputs.deploy_server == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
        run: |
          SSM_BASE="/${ENVIRONMENT}/nhp/server"
          echo "Reading server blue/green state from SSM..."

          # Read active color
          ACTIVE_COLOR=$(aws ssm get-parameter \
            --name "${SSM_BASE}/active-color" \
            --query "Parameter.Value" --output text 2>/dev/null) || ACTIVE_COLOR=""

          if [[ -z "$ACTIVE_COLOR" ]]; then
            if [[ "$COMPONENT" == "both" ]]; then
              echo "::warning::Server blue/green not enabled - skipping server deployment"
              echo "enabled=false" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "::error::Server blue/green not enabled - SSM parameter ${SSM_BASE}/active-color not found"
              echo "Run 'terraform apply' with enable_blue_green=true first"
              exit 1
            fi
          fi
          echo "enabled=true" >> $GITHUB_OUTPUT

          echo "Server active color: $ACTIVE_COLOR"
          echo "active_color=$ACTIVE_COLOR" >> $GITHUB_OUTPUT

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "standby_color=green" >> $GITHUB_OUTPUT
          else
            echo "standby_color=blue" >> $GITHUB_OUTPUT
          fi

          # Read ASG names
          BLUE_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/asg-name" \
            --query "Parameter.Value" --output text)
          GREEN_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-asg-name" \
            --query "Parameter.Value" --output text)

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_asg=$BLUE_ASG" >> $GITHUB_OUTPUT
            echo "standby_asg=$GREEN_ASG" >> $GITHUB_OUTPUT
          else
            echo "active_asg=$GREEN_ASG" >> $GITHUB_OUTPUT
            echo "standby_asg=$BLUE_ASG" >> $GITHUB_OUTPUT
          fi

          # Read current image tags
          BLUE_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || BLUE_TAG="unknown"
          GREEN_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || GREEN_TAG="unknown"

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_image_tag=$BLUE_TAG" >> $GITHUB_OUTPUT
            echo "standby_image_tag=$GREEN_TAG" >> $GITHUB_OUTPUT
          else
            echo "active_image_tag=$GREEN_TAG" >> $GITHUB_OUTPUT
            echo "standby_image_tag=$BLUE_TAG" >> $GITHUB_OUTPUT
          fi

          # Server listeners: primary=UDP, secondary=HTTPS (optional)
          echo "primary_listener_arn=$(aws ssm get-parameter \
            --name "${SSM_BASE}/udp-listener-arn" \
            --query "Parameter.Value" --output text)" >> $GITHUB_OUTPUT

          echo "blue_primary_tg_arn=$(aws ssm get-parameter \
            --name "${SSM_BASE}/blue-udp-tg-arn" \
            --query "Parameter.Value" --output text)" >> $GITHUB_OUTPUT

          echo "green_primary_tg_arn=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-udp-tg-arn" \
            --query "Parameter.Value" --output text)" >> $GITHUB_OUTPUT

          # HTTPS listener/TGs are optional (only exist if QURL resolve endpoint is enabled)
          HTTPS_LISTENER=$(aws ssm get-parameter \
            --name "${SSM_BASE}/https-listener-arn" \
            --query "Parameter.Value" --output text 2>/dev/null) || HTTPS_LISTENER=""
          echo "secondary_listener_arn=$HTTPS_LISTENER" >> $GITHUB_OUTPUT

          if [[ -n "$HTTPS_LISTENER" ]]; then
            echo "blue_secondary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/blue-https-tg-arn" \
              --query "Parameter.Value" --output text)" >> $GITHUB_OUTPUT

            echo "green_secondary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/green-https-tg-arn" \
              --query "Parameter.Value" --output text)" >> $GITHUB_OUTPUT
          fi

      - name: Read AC SSM State
        id: ac-state
        if: steps.components.outputs.deploy_ac == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
        run: |
          SSM_BASE="/${ENVIRONMENT}/nhp/ac"
          echo "Reading AC blue/green state from SSM..."

          # Read active color
          ACTIVE_COLOR=$(aws ssm get-parameter \
            --name "${SSM_BASE}/active-color" \
            --query "Parameter.Value" --output text 2>/dev/null) || ACTIVE_COLOR=""

          if [[ -z "$ACTIVE_COLOR" ]]; then
            if [[ "$COMPONENT" == "both" ]]; then
              echo "::warning::AC blue/green not enabled - skipping AC deployment"
              echo "enabled=false" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "::error::AC blue/green not enabled - SSM parameter ${SSM_BASE}/active-color not found"
              echo "Run 'terraform apply' with enable_ac_blue_green=true first"
              exit 1
            fi
          fi
          echo "enabled=true" >> $GITHUB_OUTPUT

          echo "AC active color: $ACTIVE_COLOR"
          echo "active_color=$ACTIVE_COLOR" >> $GITHUB_OUTPUT

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "standby_color=green" >> $GITHUB_OUTPUT
          else
            echo "standby_color=blue" >> $GITHUB_OUTPUT
          fi

          # Read ASG names
          BLUE_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/asg-name" \
            --query "Parameter.Value" --output text)
          GREEN_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-asg-name" \
            --query "Parameter.Value" --output text)

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_asg=$BLUE_ASG" >> $GITHUB_OUTPUT
            echo "standby_asg=$GREEN_ASG" >> $GITHUB_OUTPUT
          else
            echo "active_asg=$GREEN_ASG" >> $GITHUB_OUTPUT
            echo "standby_asg=$BLUE_ASG" >> $GITHUB_OUTPUT
          fi

          # Read current image tags
          BLUE_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || BLUE_TAG="unknown"
          GREEN_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || GREEN_TAG="unknown"

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_image_tag=$BLUE_TAG" >> $GITHUB_OUTPUT
            echo "standby_image_tag=$GREEN_TAG" >> $GITHUB_OUTPUT
          else
            echo "active_image_tag=$GREEN_TAG" >> $GITHUB_OUTPUT
            echo "standby_image_tag=$BLUE_TAG" >> $GITHUB_OUTPUT
          fi

          # AC listeners: primary=TCP only (no secondary)
          echo "primary_listener_arn=$(aws ssm get-parameter \
            --name "${SSM_BASE}/tcp-listener-arn" \
            --query "Parameter.Value" --output text)" >> $GITHUB_OUTPUT

          echo "blue_primary_tg_arn=$(aws ssm get-parameter \
            --name "${SSM_BASE}/blue-tcp-tg-arn" \
            --query "Parameter.Value" --output text)" >> $GITHUB_OUTPUT

          echo "green_primary_tg_arn=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-tcp-tg-arn" \
            --query "Parameter.Value" --output text)" >> $GITHUB_OUTPUT

      - name: Reconcile Component Flags
        id: reconcile
        run: |
          # When component=both, a component may not have blue/green enabled.
          # Downgrade deploy flags based on actual SSM state availability.
          WANT_SERVER="${{ steps.components.outputs.deploy_server }}"
          WANT_AC="${{ steps.components.outputs.deploy_ac }}"
          SERVER_ENABLED="${{ steps.server-state.outputs.enabled }}"
          AC_ENABLED="${{ steps.ac-state.outputs.enabled }}"

          # If we wanted to deploy but SSM state wasn't found, downgrade
          FINAL_SERVER="$WANT_SERVER"
          FINAL_AC="$WANT_AC"

          if [[ "$WANT_SERVER" == "true" && "$SERVER_ENABLED" == "false" ]]; then
            FINAL_SERVER="false"
            echo "::warning::Server blue/green not available, excluding from deployment"
          fi

          if [[ "$WANT_AC" == "true" && "$AC_ENABLED" == "false" ]]; then
            FINAL_AC="false"
            echo "::warning::AC blue/green not available, excluding from deployment"
          fi

          # Fail if neither component is deployable
          if [[ "$FINAL_SERVER" != "true" && "$FINAL_AC" != "true" ]]; then
            echo "::error::No components available for blue/green deployment"
            exit 1
          fi

          echo "deploy_server=$FINAL_SERVER" >> $GITHUB_OUTPUT
          echo "deploy_ac=$FINAL_AC" >> $GITHUB_OUTPUT

      - name: Validate Inputs
        id: validate
        env:
          ACTION: ${{ inputs.action }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_SERVER: ${{ steps.reconcile.outputs.deploy_server }}
          DEPLOY_AC: ${{ steps.reconcile.outputs.deploy_ac }}
          SERVER_ACTIVE_TAG: ${{ steps.server-state.outputs.active_image_tag }}
          SERVER_STANDBY_TAG: ${{ steps.server-state.outputs.standby_image_tag }}
          AC_ACTIVE_TAG: ${{ steps.ac-state.outputs.active_image_tag }}
          AC_STANDBY_TAG: ${{ steps.ac-state.outputs.standby_image_tag }}
          REFRESH_TIMEOUT: ${{ inputs.refresh_timeout_minutes }}
          HEALTH_TIMEOUT: ${{ inputs.health_check_timeout_minutes }}
        run: |
          # Validate timeout bounds
          if [[ "$REFRESH_TIMEOUT" -lt 5 || "$REFRESH_TIMEOUT" -gt 60 ]]; then
            echo "::error::refresh_timeout_minutes must be between 5 and 60 (got: $REFRESH_TIMEOUT)"
            exit 1
          fi
          if [[ "$HEALTH_TIMEOUT" -lt 2 || "$HEALTH_TIMEOUT" -gt 30 ]]; then
            echo "::error::health_check_timeout_minutes must be between 2 and 30 (got: $HEALTH_TIMEOUT)"
            exit 1
          fi

          if [[ "$ACTION" == "deploy" ]]; then
            if [[ -z "$IMAGE_TAG" ]]; then
              echo "::error::image_tag is required for deploy action"
              exit 1
            fi
            # Server validation
            if [[ "$DEPLOY_SERVER" == "true" ]]; then
              if [[ "$IMAGE_TAG" == "$SERVER_ACTIVE_TAG" ]]; then
                echo "::warning::Server: Deploying same image tag ($IMAGE_TAG) that is already active."
              fi
              echo "server_target_image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
            fi
            # AC validation
            if [[ "$DEPLOY_AC" == "true" ]]; then
              if [[ "$IMAGE_TAG" == "$AC_ACTIVE_TAG" ]]; then
                echo "::warning::AC: Deploying same image tag ($IMAGE_TAG) that is already active."
              fi
              echo "ac_target_image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
            fi
          elif [[ "$ACTION" == "rollback" || "$ACTION" == "switch-only" ]]; then
            # Server
            if [[ "$DEPLOY_SERVER" == "true" ]]; then
              if [[ "$SERVER_STANDBY_TAG" == "unknown" || -z "$SERVER_STANDBY_TAG" ]]; then
                echo "::error::Cannot $ACTION server: standby image tag is unknown"
                echo "::error::Use 'deploy' action with an image_tag to initialize the standby first."
                exit 1
              fi
              echo "server_target_image_tag=$SERVER_STANDBY_TAG" >> $GITHUB_OUTPUT
            fi
            # AC
            if [[ "$DEPLOY_AC" == "true" ]]; then
              if [[ "$AC_STANDBY_TAG" == "unknown" || -z "$AC_STANDBY_TAG" ]]; then
                echo "::error::Cannot $ACTION AC: standby image tag is unknown"
                echo "::error::Use 'deploy' action with an image_tag to initialize the standby first."
                exit 1
              fi
              echo "ac_target_image_tag=$AC_STANDBY_TAG" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Summary
        env:
          ACTION: ${{ inputs.action }}
          COMPONENT: ${{ inputs.component }}
          DEPLOY_SERVER: ${{ steps.reconcile.outputs.deploy_server }}
          DEPLOY_AC: ${{ steps.reconcile.outputs.deploy_ac }}
          SERVER_ACTIVE_COLOR: ${{ steps.server-state.outputs.active_color }}
          SERVER_STANDBY_COLOR: ${{ steps.server-state.outputs.standby_color }}
          SERVER_ACTIVE_TAG: ${{ steps.server-state.outputs.active_image_tag }}
          SERVER_TARGET_TAG: ${{ steps.validate.outputs.server_target_image_tag }}
          AC_ACTIVE_COLOR: ${{ steps.ac-state.outputs.active_color }}
          AC_STANDBY_COLOR: ${{ steps.ac-state.outputs.standby_color }}
          AC_ACTIVE_TAG: ${{ steps.ac-state.outputs.active_image_tag }}
          AC_TARGET_TAG: ${{ steps.validate.outputs.ac_target_image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "## Blue/Green State" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "> **DRY RUN MODE** - No changes will be made" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | $ACTION |" >> $GITHUB_STEP_SUMMARY
          echo "| Component | $COMPONENT |" >> $GITHUB_STEP_SUMMARY

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Server" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Active Color | **$SERVER_ACTIVE_COLOR** |" >> $GITHUB_STEP_SUMMARY
            echo "| Standby Color | $SERVER_STANDBY_COLOR |" >> $GITHUB_STEP_SUMMARY
            echo "| Active Image | \`$SERVER_ACTIVE_TAG\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Target Image | \`$SERVER_TARGET_TAG\` |" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### AC" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Active Color | **$AC_ACTIVE_COLOR** |" >> $GITHUB_STEP_SUMMARY
            echo "| Standby Color | $AC_STANDBY_COLOR |" >> $GITHUB_STEP_SUMMARY
            echo "| Active Image | \`$AC_ACTIVE_TAG\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Target Image | \`$AC_TARGET_TAG\` |" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # DEPLOY TO STANDBY - Update standby ASG with new image
  # =============================================================================
  deploy-to-standby:
    name: Deploy to Standby
    needs: prepare
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Steps run sequentially even for component=both.
    # Timeout: refresh (max 60m) + health check (max 30m) + buffer (5m) = 95m.
    # Health checks use a shorter range (2-30m) than refresh (5-60m) because target
    # group registration should be faster than a full instance refresh cycle.
    timeout-minutes: 95
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---- Server Deploy Steps ----
      - name: "[Server] Validate Image Exists in ECR"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          REPO_NAME=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/server/ecr-repo-name" \
            --query "Parameter.Value" --output text 2>/dev/null) || REPO_NAME=""
          if [[ -z "$REPO_NAME" ]]; then
            REPO_NAME="layerv/nhp-server"
            echo "::warning::SSM parameter /${ENVIRONMENT}/nhp/server/ecr-repo-name not found, using default: $REPO_NAME"
          fi
          echo "Verifying image $REPO_NAME:$IMAGE_TAG exists in ECR..."
          if ! aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query "imageDetails[0].imageTags" \
            --output text > /dev/null 2>&1; then
            echo "::error::Image $REPO_NAME:$IMAGE_TAG not found in ECR"
            exit 1
          fi
          echo "Image verified: $REPO_NAME:$IMAGE_TAG exists"

      - name: "[Server] Update Standby Image Tag"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          IMAGE_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$STANDBY_COLOR" == "green" ]]; then
            SSM_PARAM="/${ENVIRONMENT}/nhp/server/green-image-tag"
          else
            SSM_PARAM="/${ENVIRONMENT}/nhp/server/image-tag"
          fi
          echo "Updating $SSM_PARAM to $IMAGE_TAG"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would update SSM parameter: $SSM_PARAM = $IMAGE_TAG"
          else
            aws ssm put-parameter --name "$SSM_PARAM" --value "$IMAGE_TAG" --type String --overwrite
          fi

      - name: "[Server] Scale Up Standby ASG"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          STANDBY_ASG: ${{ needs.prepare.outputs.server_standby_asg }}
          ACTIVE_ASG: ${{ needs.prepare.outputs.server_active_asg }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ACTIVE_CAPACITY=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ACTIVE_ASG" \
            --query "AutoScalingGroups[0].DesiredCapacity" --output text)
          echo "Server active ASG capacity: $ACTIVE_CAPACITY"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would scale $STANDBY_ASG to min=$ACTIVE_CAPACITY, desired=$ACTIVE_CAPACITY"
          else
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$STANDBY_ASG" \
              --min-size "$ACTIVE_CAPACITY" --desired-capacity "$ACTIVE_CAPACITY"
          fi

      - name: "[Server] Instance Refresh on Standby"
        if: needs.prepare.outputs.deploy_server == 'true' && inputs.dry_run != true
        env:
          STANDBY_ASG: ${{ needs.prepare.outputs.server_standby_asg }}
          REFRESH_TIMEOUT_MINUTES: ${{ inputs.refresh_timeout_minutes }}
        run: |
          echo "Starting instance refresh on server standby ASG: $STANDBY_ASG"
          EXISTING=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$STANDBY_ASG" \
            --query "InstanceRefreshes[?Status=='InProgress' || Status=='Pending'].InstanceRefreshId" \
            --output text 2>/dev/null) || true
          if [[ -n "$EXISTING" ]]; then
            echo "Cancelling existing refresh: $EXISTING"
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$STANDBY_ASG" || true
            sleep 10
          fi
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$STANDBY_ASG" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180, "SkipMatching": false}' \
            --query "InstanceRefreshId" --output text)
          echo "Instance refresh started: $REFRESH_ID"
          DEADLINE=$(($(date +%s) + REFRESH_TIMEOUT_MINUTES * 60))
          ITERATION=0
          while [[ $(date +%s) -lt $DEADLINE ]]; do
            ITERATION=$((ITERATION + 1))
            REMAINING=$(( (DEADLINE - $(date +%s)) / 60 ))
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$STANDBY_ASG" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" --output text)
            echo "[Server] [iter $ITERATION, ${REMAINING}m remaining] Refresh status: $STATUS"
            case "$STATUS" in
              Successful) echo "Server instance refresh completed successfully"; break ;;
              Failed|Cancelled) echo "::error::Server instance refresh $STATUS"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          if [[ "$STATUS" != "Successful" ]]; then
            echo "::error::Server instance refresh timed out after ${REFRESH_TIMEOUT_MINUTES} minutes (status: $STATUS)"
            exit 1
          fi

      - name: "[Server] Verify Standby Health"
        if: needs.prepare.outputs.deploy_server == 'true' && inputs.dry_run != true
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.server_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.server_blue_primary_tg_arn }}
          GREEN_SECONDARY_TG: ${{ needs.prepare.outputs.server_green_secondary_tg_arn }}
          BLUE_SECONDARY_TG: ${{ needs.prepare.outputs.server_blue_secondary_tg_arn }}
          HEALTH_CHECK_TIMEOUT_MINUTES: ${{ inputs.health_check_timeout_minutes }}
        run: |
          verify_tg_health() {
            local TG_ARN="$1" TG_NAME="$2" RESULT_FILE="$3"
            local DEADLINE=$(($(date +%s) + HEALTH_CHECK_TIMEOUT_MINUTES * 60))
            echo "[$TG_NAME] Verifying target group health: $TG_ARN"
            local ITERATION=0
            while [[ $(date +%s) -lt $DEADLINE ]]; do
              ITERATION=$((ITERATION + 1))
              local REMAINING=$(( (DEADLINE - $(date +%s)) / 60 ))
              if ! HEALTH=$(aws elbv2 describe-target-health \
                --target-group-arn "$TG_ARN" \
                --query "TargetHealthDescriptions[*].TargetHealth.State" --output text 2>&1); then
                echo "[$TG_NAME] Warning: Failed to get health: $HEALTH"; sleep 10; continue
              fi
              if [[ -z "$HEALTH" ]]; then HEALTHY_COUNT=0; TOTAL_COUNT=0
              else
                HEALTHY_COUNT=$(echo "$HEALTH" | awk '{for(i=1;i<=NF;i++) if($i=="healthy") c++} END{print c+0}')
                TOTAL_COUNT=$(echo "$HEALTH" | awk '{print NF}')
              fi
              echo "[$TG_NAME] [iter $ITERATION, ${REMAINING}m left] $HEALTHY_COUNT/$TOTAL_COUNT healthy"
              if [[ "$TOTAL_COUNT" -gt 0 && "$HEALTHY_COUNT" -eq "$TOTAL_COUNT" ]]; then
                echo "[$TG_NAME] All targets healthy"
                [[ -n "$RESULT_FILE" ]] && echo "success" > "$RESULT_FILE"
                return 0
              fi
              sleep 10
            done
            echo "::error::[$TG_NAME] Targets not healthy after ${HEALTH_CHECK_TIMEOUT_MINUTES} minutes"
            [[ -n "$RESULT_FILE" ]] && echo "failed" > "$RESULT_FILE"
            return 1
          }
          if [[ "$STANDBY_COLOR" == "green" ]]; then
            PRIMARY_TG="$GREEN_PRIMARY_TG"; SECONDARY_TG="$GREEN_SECONDARY_TG"
          else
            PRIMARY_TG="$BLUE_PRIMARY_TG"; SECONDARY_TG="$BLUE_SECONDARY_TG"
          fi
          if [[ -n "$SECONDARY_TG" ]]; then
            echo "Running UDP and HTTPS health checks in parallel..."
            UDP_RESULT=$(mktemp); HTTPS_RESULT=$(mktemp)
            trap "rm -f $UDP_RESULT $HTTPS_RESULT" EXIT INT TERM
            verify_tg_health "$PRIMARY_TG" "UDP" "$UDP_RESULT" &
            UDP_PID=$!
            verify_tg_health "$SECONDARY_TG" "HTTPS" "$HTTPS_RESULT" &
            HTTPS_PID=$!
            UDP_EXIT=0; HTTPS_EXIT=0
            wait $UDP_PID || UDP_EXIT=$?
            wait $HTTPS_PID || HTTPS_EXIT=$?
            if [[ $UDP_EXIT -ne 0 ]]; then echo "::error::Server UDP health check failed"; exit 1; fi
            if [[ $HTTPS_EXIT -ne 0 ]]; then echo "::error::Server HTTPS health check failed"; exit 1; fi
          else
            verify_tg_health "$PRIMARY_TG" "Server-UDP" "" || exit 1
          fi

      # ---- AC Deploy Steps ----
      - name: "[AC] Validate Image Exists in ECR"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          REPO_NAME=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/ac/ecr-repo-name" \
            --query "Parameter.Value" --output text 2>/dev/null) || REPO_NAME=""
          if [[ -z "$REPO_NAME" ]]; then
            REPO_NAME="layerv/nhp-ac"
            echo "::warning::SSM parameter /${ENVIRONMENT}/nhp/ac/ecr-repo-name not found, using default: $REPO_NAME"
          fi
          echo "Verifying image $REPO_NAME:$IMAGE_TAG exists in ECR..."
          if ! aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query "imageDetails[0].imageTags" \
            --output text > /dev/null 2>&1; then
            echo "::error::Image $REPO_NAME:$IMAGE_TAG not found in ECR"
            exit 1
          fi
          echo "Image verified: $REPO_NAME:$IMAGE_TAG exists"

      - name: "[AC] Update Standby Image Tag"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STANDBY_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          IMAGE_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$STANDBY_COLOR" == "green" ]]; then
            SSM_PARAM="/${ENVIRONMENT}/nhp/ac/green-image-tag"
          else
            SSM_PARAM="/${ENVIRONMENT}/nhp/ac/image-tag"
          fi
          echo "Updating $SSM_PARAM to $IMAGE_TAG"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would update SSM parameter: $SSM_PARAM = $IMAGE_TAG"
          else
            aws ssm put-parameter --name "$SSM_PARAM" --value "$IMAGE_TAG" --type String --overwrite
          fi

      - name: "[AC] Scale Up Standby ASG"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          STANDBY_ASG: ${{ needs.prepare.outputs.ac_standby_asg }}
          ACTIVE_ASG: ${{ needs.prepare.outputs.ac_active_asg }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ACTIVE_CAPACITY=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ACTIVE_ASG" \
            --query "AutoScalingGroups[0].DesiredCapacity" --output text)
          echo "AC active ASG capacity: $ACTIVE_CAPACITY"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would scale $STANDBY_ASG to min=$ACTIVE_CAPACITY, desired=$ACTIVE_CAPACITY"
          else
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$STANDBY_ASG" \
              --min-size "$ACTIVE_CAPACITY" --desired-capacity "$ACTIVE_CAPACITY"
          fi

      - name: "[AC] Instance Refresh on Standby"
        if: needs.prepare.outputs.deploy_ac == 'true' && inputs.dry_run != true
        env:
          STANDBY_ASG: ${{ needs.prepare.outputs.ac_standby_asg }}
          REFRESH_TIMEOUT_MINUTES: ${{ inputs.refresh_timeout_minutes }}
        run: |
          echo "Starting instance refresh on AC standby ASG: $STANDBY_ASG"
          EXISTING=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$STANDBY_ASG" \
            --query "InstanceRefreshes[?Status=='InProgress' || Status=='Pending'].InstanceRefreshId" \
            --output text 2>/dev/null) || true
          if [[ -n "$EXISTING" ]]; then
            echo "Cancelling existing refresh: $EXISTING"
            aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$STANDBY_ASG" || true
            sleep 10
          fi
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$STANDBY_ASG" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180, "SkipMatching": false}' \
            --query "InstanceRefreshId" --output text)
          echo "Instance refresh started: $REFRESH_ID"
          DEADLINE=$(($(date +%s) + REFRESH_TIMEOUT_MINUTES * 60))
          ITERATION=0
          while [[ $(date +%s) -lt $DEADLINE ]]; do
            ITERATION=$((ITERATION + 1))
            REMAINING=$(( (DEADLINE - $(date +%s)) / 60 ))
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$STANDBY_ASG" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query "InstanceRefreshes[0].Status" --output text)
            echo "[AC] [iter $ITERATION, ${REMAINING}m remaining] Refresh status: $STATUS"
            case "$STATUS" in
              Successful) echo "AC instance refresh completed successfully"; break ;;
              Failed|Cancelled) echo "::error::AC instance refresh $STATUS"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          if [[ "$STATUS" != "Successful" ]]; then
            echo "::error::AC instance refresh timed out after ${REFRESH_TIMEOUT_MINUTES} minutes (status: $STATUS)"
            exit 1
          fi

      - name: "[AC] Verify Standby Health"
        if: needs.prepare.outputs.deploy_ac == 'true' && inputs.dry_run != true
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.ac_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.ac_blue_primary_tg_arn }}
          HEALTH_CHECK_TIMEOUT_MINUTES: ${{ inputs.health_check_timeout_minutes }}
        run: |
          if [[ "$STANDBY_COLOR" == "green" ]]; then
            TG_ARN="$GREEN_PRIMARY_TG"
          else
            TG_ARN="$BLUE_PRIMARY_TG"
          fi
          echo "Verifying AC target group health: $TG_ARN"
          DEADLINE=$(($(date +%s) + HEALTH_CHECK_TIMEOUT_MINUTES * 60))
          ITERATION=0
          while [[ $(date +%s) -lt $DEADLINE ]]; do
            ITERATION=$((ITERATION + 1))
            REMAINING=$(( (DEADLINE - $(date +%s)) / 60 ))
            if ! HEALTH=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --query "TargetHealthDescriptions[*].TargetHealth.State" --output text 2>&1); then
              echo "[AC-TCP] Warning: Failed to get health: $HEALTH"; sleep 10; continue
            fi
            if [[ -z "$HEALTH" ]]; then HEALTHY_COUNT=0; TOTAL_COUNT=0
            else
              HEALTHY_COUNT=$(echo "$HEALTH" | awk '{for(i=1;i<=NF;i++) if($i=="healthy") c++} END{print c+0}')
              TOTAL_COUNT=$(echo "$HEALTH" | awk '{print NF}')
            fi
            echo "[AC-TCP] [iter $ITERATION, ${REMAINING}m left] $HEALTHY_COUNT/$TOTAL_COUNT healthy"
            if [[ "$TOTAL_COUNT" -gt 0 && "$HEALTHY_COUNT" -eq "$TOTAL_COUNT" ]]; then
              echo "[AC-TCP] All targets healthy"
              break
            fi
            sleep 10
          done
          if [[ "$TOTAL_COUNT" -eq 0 || "$HEALTHY_COUNT" -ne "$TOTAL_COUNT" ]]; then
            echo "::error::[AC-TCP] Targets not healthy after ${HEALTH_CHECK_TIMEOUT_MINUTES} minutes"
            exit 1
          fi

      - name: "[Server] Dry Run Notice"
        if: needs.prepare.outputs.deploy_server == 'true' && inputs.dry_run == true
        run: |
          echo "[DRY RUN] [Server] Would start instance refresh and wait for completion"
          echo "[DRY RUN] [Server] Would verify target group health"

      - name: "[AC] Dry Run Notice"
        if: needs.prepare.outputs.deploy_ac == 'true' && inputs.dry_run == true
        run: |
          echo "[DRY RUN] [AC] Would start instance refresh and wait for completion"
          echo "[DRY RUN] [AC] Would verify target group health"

  # =============================================================================
  # SWITCH TRAFFIC - Modify NLB listeners (instant, <1 second)
  # =============================================================================
  switch-traffic:
    name: Switch Traffic
    needs: [prepare, deploy-to-standby]
    if: always() && needs.prepare.result == 'success' && (needs.deploy-to-standby.result == 'success' || needs.deploy-to-standby.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "[Server] Switch NLB Listeners"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          ACTIVE_COLOR: ${{ needs.prepare.outputs.server_active_color }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would switch server traffic to $STANDBY_COLOR"
            exit 0
          fi
          chmod +x .github/scripts/blue-green-switch.sh
          .github/scripts/blue-green-switch.sh "$ENVIRONMENT" "$STANDBY_COLOR" server

      - name: "[AC] Switch NLB Listener"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          ACTIVE_COLOR: ${{ needs.prepare.outputs.ac_active_color }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would switch AC traffic to $STANDBY_COLOR"
            exit 0
          fi
          chmod +x .github/scripts/blue-green-switch.sh
          .github/scripts/blue-green-switch.sh "$ENVIRONMENT" "$STANDBY_COLOR" ac

  # =============================================================================
  # SCALE DOWN PREVIOUS - Reduce previous active to warm standby
  # =============================================================================
  scale-down-previous:
    name: Scale Down Previous
    needs: [prepare, switch-traffic]
    if: always() && needs.switch-traffic.result == 'success' && inputs.action == 'deploy' && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "[Server] Scale Down Previous Active"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          PREVIOUS_ASG: ${{ needs.prepare.outputs.server_active_asg }}
        run: |
          echo "Scaling down previous server active ASG to warm standby: $PREVIOUS_ASG"
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$PREVIOUS_ASG" \
            --min-size 1 --desired-capacity 1
          echo "Previous server ASG scaled down to 1 instance"

      - name: "[AC] Scale Down Previous Active"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          PREVIOUS_ASG: ${{ needs.prepare.outputs.ac_active_asg }}
        run: |
          echo "Scaling down previous AC active ASG to warm standby: $PREVIOUS_ASG"
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$PREVIOUS_ASG" \
            --min-size 1 --desired-capacity 1
          echo "Previous AC ASG scaled down to 1 instance"

  # =============================================================================
  # VALIDATE - Post-switch validation
  # =============================================================================
  validate:
    name: Validate
    needs: [prepare, switch-traffic]
    if: always() && needs.switch-traffic.result == 'success' && inputs.skip_validation != true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "[Server] Verify Traffic Switch"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.server_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.server_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.server_blue_primary_tg_arn }}
        run: |
          CURRENT_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$STANDBY_COLOR" == "green" ]]; then EXPECTED_TG="$GREEN_PRIMARY_TG"
          else EXPECTED_TG="$BLUE_PRIMARY_TG"; fi
          if [[ "$CURRENT_TG" == "$EXPECTED_TG" ]]; then
            echo "Server traffic verified: UDP listener pointing to $STANDBY_COLOR target group"
          else
            echo "::error::Server traffic mismatch! Expected $EXPECTED_TG but got $CURRENT_TG"
            exit 1
          fi

      - name: "[Server] Reconcile Listener and SSM State"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.server_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.server_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.server_blue_primary_tg_arn }}
        run: |
          echo "Running server listener/SSM state reconciliation check..."
          SSM_COLOR=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/server/active-color" \
            --query "Parameter.Value" --output text)
          LISTENER_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$LISTENER_TG" == "$BLUE_PRIMARY_TG" ]]; then LISTENER_COLOR="blue"
          elif [[ "$LISTENER_TG" == "$GREEN_PRIMARY_TG" ]]; then LISTENER_COLOR="green"
          else echo "::error::Server listener pointing to unknown TG: $LISTENER_TG"; exit 1; fi
          if [[ "$SSM_COLOR" == "$LISTENER_COLOR" ]]; then
            echo "Server reconciliation passed: SSM ($SSM_COLOR) matches listener ($LISTENER_COLOR)"
          else
            echo "::error::Server state inconsistency! SSM=$SSM_COLOR, listener=$LISTENER_COLOR"
            exit 1
          fi

      - name: "[AC] Verify Traffic Switch"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.ac_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.ac_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.ac_blue_primary_tg_arn }}
        run: |
          CURRENT_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$STANDBY_COLOR" == "green" ]]; then EXPECTED_TG="$GREEN_PRIMARY_TG"
          else EXPECTED_TG="$BLUE_PRIMARY_TG"; fi
          if [[ "$CURRENT_TG" == "$EXPECTED_TG" ]]; then
            echo "AC traffic verified: TCP listener pointing to $STANDBY_COLOR target group"
          else
            echo "::error::AC traffic mismatch! Expected $EXPECTED_TG but got $CURRENT_TG"
            exit 1
          fi

      - name: "[AC] Reconcile Listener and SSM State"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.ac_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.ac_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.ac_blue_primary_tg_arn }}
        run: |
          echo "Running AC listener/SSM state reconciliation check..."
          SSM_COLOR=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/ac/active-color" \
            --query "Parameter.Value" --output text)
          LISTENER_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$LISTENER_TG" == "$BLUE_PRIMARY_TG" ]]; then LISTENER_COLOR="blue"
          elif [[ "$LISTENER_TG" == "$GREEN_PRIMARY_TG" ]]; then LISTENER_COLOR="green"
          else echo "::error::AC listener pointing to unknown TG: $LISTENER_TG"; exit 1; fi
          if [[ "$SSM_COLOR" == "$LISTENER_COLOR" ]]; then
            echo "AC reconciliation passed: SSM ($SSM_COLOR) matches listener ($LISTENER_COLOR)"
          else
            echo "::error::AC state inconsistency! SSM=$SSM_COLOR, listener=$LISTENER_COLOR"
            exit 1
          fi

      - name: Run Validation Script
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ -f scripts/validate-deployment.sh ]]; then
            chmod +x scripts/validate-deployment.sh
            ./scripts/validate-deployment.sh "$ENVIRONMENT" || {
              echo "::warning::Some validation checks failed"
            }
          else
            echo "No validation script found, skipping"
          fi

      - name: Push Deployment Metric
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
        run: |
          # Push deployment count metric for stale deployment detection
          # Emit with Environment-only dimension for backward compatibility with
          # existing server stale-deployment alarm, plus Environment+Component
          # for per-component tracking
          aws cloudwatch put-metric-data \
            --namespace "NHP/BlueGreen" \
            --metric-name "DeploymentCount" \
            --dimensions "Environment=$ENVIRONMENT" \
            --value 1 \
            --unit Count
          aws cloudwatch put-metric-data \
            --namespace "NHP/BlueGreen" \
            --metric-name "DeploymentCount" \
            --dimensions "Environment=$ENVIRONMENT,Component=$COMPONENT" \
            --value 1 \
            --unit Count
          echo "Deployment metric pushed to CloudWatch (both dimension sets)"

      - name: Deployment Summary
        env:
          ACTION: ${{ inputs.action }}
          COMPONENT: ${{ inputs.component }}
          DEPLOY_SERVER: ${{ needs.prepare.outputs.deploy_server }}
          DEPLOY_AC: ${{ needs.prepare.outputs.deploy_ac }}
          SERVER_NEW_ACTIVE: ${{ needs.prepare.outputs.server_standby_color }}
          SERVER_PREVIOUS_ACTIVE: ${{ needs.prepare.outputs.server_active_color }}
          SERVER_NEW_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
          SERVER_PREVIOUS_TAG: ${{ needs.prepare.outputs.server_active_image_tag }}
          AC_NEW_ACTIVE: ${{ needs.prepare.outputs.ac_standby_color }}
          AC_PREVIOUS_ACTIVE: ${{ needs.prepare.outputs.ac_active_color }}
          AC_NEW_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
          AC_PREVIOUS_TAG: ${{ needs.prepare.outputs.ac_active_image_tag }}
        run: |
          echo "## Blue/Green Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** $ACTION | **Component:** $COMPONENT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            echo "### Server" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Before | After |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Active Color | $SERVER_PREVIOUS_ACTIVE | **$SERVER_NEW_ACTIVE** |" >> $GITHUB_STEP_SUMMARY
            echo "| Active Image | \`$SERVER_PREVIOUS_TAG\` | \`$SERVER_NEW_TAG\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            echo "### AC" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Before | After |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Active Color | $AC_PREVIOUS_ACTIVE | **$AC_NEW_ACTIVE** |" >> $GITHUB_STEP_SUMMARY
            echo "| Active Image | \`$AC_PREVIOUS_TAG\` | \`$AC_NEW_TAG\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Rollback" >> $GITHUB_STEP_SUMMARY
          echo "To rollback, run this workflow with:" >> $GITHUB_STEP_SUMMARY
          echo "- **action:** \`rollback\`" >> $GITHUB_STEP_SUMMARY
