name: Blue/Green Deploy

# Blue/Green deployment for NHP Server and/or AC with instant traffic switching
#
# This workflow enables:
# - Deploy new image to standby ASG
# - Instant traffic switch via NLB listener modification (<1 second)
# - Sub-second rollback capability
# - Warm standby (1 instance) for previous color
#
# Prerequisites:
# - enable_blue_green = true (server) or enable_ac_blue_green = true (ac) in terraform.tfvars
# - Green ASG and target groups created via terraform apply

# run-name embeds an optional correlation_id so a parent workflow
# dispatching this one can find its specific run via
# `find-dispatched-run.sh` even if other dispatches land in the same
# time window, or if the run is held by the concurrency group /
# environment approval and reported as status=waiting. Shows up in
# the GitHub UI as the run's title and in `gh run list --json displayTitle`.
run-name: "Blue/Green ${{ inputs.environment }} ${{ inputs.cell_id }} ${{ inputs.component }} ${{ inputs.action }}${{ inputs.correlation_id && format(' [corr:{0}]', inputs.correlation_id) || '' }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - sandbox
      component:
        description: 'Component to deploy'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - ac
          - both
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy      # Deploy new image to standby, switch traffic
          - rollback    # Switch traffic back to previous color
          - switch-only # Just switch traffic (no image update)
      image_tag:
        description: 'Image tag to deploy (required for deploy action)'
        required: false
        type: string
      cell_id:
        description: 'Cell identifier for deploy-window markers and AC assignment cleanup'
        required: false
        default: 'cell0'
        type: string
      skip_validation:
        description: 'Skip post-switch validation'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run mode - show what would be done without executing'
        required: false
        default: false
        type: boolean
      refresh_timeout_minutes:
        description: 'Instance refresh timeout in minutes (5-60, default: 15)'
        required: false
        # 3-instance refresh with per-instance warmup consistently takes
        # 9-10 minutes in sandbox (one-at-a-time replacement + warmup +
        # health-check grace). A 10-minute deadline was tipping over by
        # 1 second, so CI marked the step failed even though the refresh
        # itself was healthy and completed seconds later. 15 minutes
        # gives a ~5-minute safety margin without bloating deploy time
        # for the happy path.
        default: 15
        type: number
      # Timeout budgets below fall into three categories (boot / convergence /
      # regression-detection). Full rationale, distribution, and follow-up in
      # docs/deploy-timeouts.md — update that file when changing defaults.
      standby_health_timeout_minutes:
        description: 'Standby SSM probe (/ping) timeout in minutes (2-60, default: 15)'
        required: false
        # Boot budget — covers standby user_data + service bind.
        # Upper bound mirrors refresh_timeout_minutes (60) rather than
        # the probe ceiling (30) because this is a boot budget, not a
        # convergence/regression budget. See docs/deploy-timeouts.md.
        default: 15
        type: number
      pre_switch_knock_ready_timeout_minutes:
        description: 'Pre-switch knock-ready timeout in minutes (2-30, default: 5)'
        required: false
        # Convergence budget — standby is already up; gate is waiting
        # on NHP-AOL/NHP-AAK settling on the active server fleet.
        default: 5
        type: number
      post_switch_knock_ready_timeout_minutes:
        description: 'Post-switch knock-ready timeout in minutes (3-30, default: 5)'
        required: false
        # Regression-detection budget — traffic is live; keep tight.
        # Mirrors blueGreenDeployGateWindow (5 min default) and
        # blueGreenDeployGateMinimum (3 min) in
        # endpoints/ac/registration_resilience_test.go; tracked in
        # #1729 (scripts/check-deploy-gate-drift.sh, not yet landed)
        # for a script-based fence on this duplication. The 3 min
        # lower bound (raised from 2) fits the AC NLB safety net's
        # worst-case fire interval (112.5s) plus the gate's own
        # convergence cost (~12-20s) inside the budget — see PR #1726.
        default: 5
        type: number
      correlation_id:
        description: 'Optional unique ID set by the parent dispatcher so it can reliably find this run (see find-dispatched-run.sh).'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read
  attestations: read  # gh attestation verify in the deploy-time image gate (#1334)

# Serialize ALL blue/green deploys per environment. Using environment-only
# concurrency ensures component=both conflicts with component=server and
# component=ac, preventing dangerous overlapping deploys (see #340).
concurrency:
  group: blue-green-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  # Infrastructure namespace for the cell being deployed. This is a SEPARATE
  # axis from `environment`, and conflating the two is what left cell1 without
  # a deploy lane.
  #
  #   environment  — the GitHub deployment environment (secrets, protection
  #                  rules) and the NHP/Authority protocol environment. Stays
  #                  `sandbox` for BOTH sandbox cells; tickets bind
  #                  {environment=sandbox, cell_id=cellN}.
  #   INFRA_ENVIRONMENT — what terraform keys resource names and SSM paths on:
  #                  cell0 -> "sandbox"       -> /sandbox/nhp/...
  #                  cell1 -> "sandbox-cell1" -> /sandbox-cell1/nhp/...
  #
  # terraform/environments/sandbox-cell1/variables.tf pins `environment` to
  # "sandbox-cell1" (validated != "sandbox") while `protocol_environment`
  # stays "sandbox" — this expression is the CI-side mirror of that split.
  #
  # Before this, every SSM read was /${inputs.environment}/nhp/... and the
  # cell_id input only labelled deploy-window markers, AC-assignment cleanup
  # and CloudWatch dimensions. A dispatch with cell_id=cell1 therefore read
  # cell0's parameters and would have rolled cell0's fleet under cell1's
  # labels — silently wrong rather than merely unsupported.
  #
  # cell0 keeps `sandbox` verbatim, so this is a no-op for the existing lane.
  INFRA_ENVIRONMENT: ${{ inputs.cell_id == 'cell0' && inputs.environment || format('{0}-{1}', inputs.environment, inputs.cell_id) }}

jobs:
  # =============================================================================
  # SANDBOX LIVE-ENVIRONMENT LOCK - Exclude exact-image qv2 proofs
  # =============================================================================
  # A blue/green roll temporarily runs both server/AC colors and then switches
  # the public NHP boundary. qurl-service's exact-image pre-merge qv2 smoke
  # depends on that boundary remaining stable for the whole proof. The normal
  # blue-green concurrency group is repository-local, so it cannot serialize
  # against qurl-service. Hold the shared SSM mutex from before any blue/green
  # state read/mutation until post-switch validation and scale-down complete.
  acquire-qurl-live-env-lock:
    name: Acquire qURL Live-Environment Lock
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 180
    steps:
      # Fence the cell_id BEFORE the lock is taken. INFRA_ENVIRONMENT is built
      # by string concatenation, so an unknown value (a typo like "cel1")
      # would otherwise resolve to a plausible-looking namespace such as
      # /sandbox-cel1/nhp/... and only blow up several jobs later — while
      # holding the shared live-environment mutex on its 4h TTL. Failing here
      # costs seconds and never acquires the lock.
      #
      # Allowlist rather than a regex: only cells that actually have a
      # blue/green server fleet belong here. cell0 is terraform/ (root) and
      # cell1 is terraform/environments/sandbox-cell1/. Add a cell to this
      # list only once its /<infra-env>/nhp/server/* parameters exist.
      - name: Validate Cell Identifier
        env:
          CELL_ID: ${{ inputs.cell_id }}
        run: |
          set -euo pipefail
          case "$CELL_ID" in
            cell0|cell1) ;;
            *)
              echo "::error::Unknown cell_id '$CELL_ID' (expected cell0 or cell1). The infrastructure namespace is derived from this value, so an unrecognised cell would address a non-existent SSM namespace." >&2
              exit 1
              ;;
          esac
          echo "cell_id=$CELL_ID -> infrastructure namespace /${INFRA_ENVIRONMENT}/nhp/..."

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 10800
          aws-region: ${{ env.AWS_REGION }}

      - name: Acquire sandbox live-environment lock
        id: acquire-sandbox-live-env-lock
        uses: ./.github/actions/sandbox-live-env-lock
        with:
          action: acquire
          owner: nhp:${{ github.run_id }}:${{ github.run_attempt }}:blue-green
          ssm-parameter-name: /layerv-nhp-sandbox/qurl-live-env-lock
          aws-region: ${{ env.AWS_REGION }}
          ttl-seconds: '14400'
          wait-seconds: '7200'

  # =============================================================================
  # PREPARE - Read SSM state and determine active/standby colors
  # =============================================================================
  prepare:
    name: Prepare
    needs: acquire-qurl-live-env-lock
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    outputs:
      # Server outputs
      server_active_color: ${{ steps.server-state.outputs.active_color }}
      server_standby_color: ${{ steps.server-state.outputs.standby_color }}
      server_active_asg: ${{ steps.server-state.outputs.active_asg }}
      server_standby_asg: ${{ steps.server-state.outputs.standby_asg }}
      server_active_image_tag: ${{ steps.server-state.outputs.active_image_tag }}
      server_standby_image_tag: ${{ steps.server-state.outputs.standby_image_tag }}
      server_primary_listener_arn: ${{ steps.server-state.outputs.primary_listener_arn }}
      server_blue_primary_tg_arn: ${{ steps.server-state.outputs.blue_primary_tg_arn }}
      server_green_primary_tg_arn: ${{ steps.server-state.outputs.green_primary_tg_arn }}
      server_internal_listener_arn: ${{ steps.server-state.outputs.internal_listener_arn }}
      server_blue_internal_tg_arn: ${{ steps.server-state.outputs.blue_internal_tg_arn }}
      server_green_internal_tg_arn: ${{ steps.server-state.outputs.green_internal_tg_arn }}
      server_secondary_listener_arn: ${{ steps.server-state.outputs.secondary_listener_arn }}
      server_blue_secondary_tg_arn: ${{ steps.server-state.outputs.blue_secondary_tg_arn }}
      server_green_secondary_tg_arn: ${{ steps.server-state.outputs.green_secondary_tg_arn }}
      server_target_image_tag: ${{ steps.validate.outputs.server_target_image_tag }}
      # AC outputs
      ac_active_color: ${{ steps.ac-state.outputs.active_color }}
      ac_standby_color: ${{ steps.ac-state.outputs.standby_color }}
      ac_active_asg: ${{ steps.ac-state.outputs.active_asg }}
      ac_standby_asg: ${{ steps.ac-state.outputs.standby_asg }}
      ac_active_image_tag: ${{ steps.ac-state.outputs.active_image_tag }}
      ac_standby_image_tag: ${{ steps.ac-state.outputs.standby_image_tag }}
      ac_primary_listener_arn: ${{ steps.ac-state.outputs.primary_listener_arn }}
      ac_blue_primary_tg_arn: ${{ steps.ac-state.outputs.blue_primary_tg_arn }}
      ac_green_primary_tg_arn: ${{ steps.ac-state.outputs.green_primary_tg_arn }}
      ac_target_image_tag: ${{ steps.validate.outputs.ac_target_image_tag }}
      # Flags - reconciled after SSM state reads (handles component=both with only one enabled)
      deploy_server: ${{ steps.reconcile.outputs.deploy_server }}
      deploy_ac: ${{ steps.reconcile.outputs.deploy_ac }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Components
        id: components
        run: |
          COMPONENT="${{ inputs.component }}"
          if [[ "$COMPONENT" == "server" || "$COMPONENT" == "both" ]]; then
            echo "deploy_server=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_server=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$COMPONENT" == "ac" || "$COMPONENT" == "both" ]]; then
            echo "deploy_ac=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_ac=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Server SSM State
        id: server-state
        if: steps.components.outputs.deploy_server == 'true'
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          COMPONENT: ${{ inputs.component }}
        run: |
          SSM_BASE="/${ENVIRONMENT}/nhp/server"
          echo "Reading server blue/green state from SSM..."

          # Read active color
          ACTIVE_COLOR=$(aws ssm get-parameter \
            --name "${SSM_BASE}/active-color" \
            --query "Parameter.Value" --output text 2>/dev/null) || ACTIVE_COLOR=""

          if [[ -z "$ACTIVE_COLOR" ]]; then
            if [[ "$COMPONENT" == "both" ]]; then
              echo "::warning::Server blue/green not enabled - skipping server deployment"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "::error::Server blue/green not enabled - SSM parameter ${SSM_BASE}/active-color not found"
              echo "Run 'terraform apply' with enable_blue_green=true first"
              exit 1
            fi
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          echo "Server active color: $ACTIVE_COLOR"
          echo "active_color=$ACTIVE_COLOR" >> "$GITHUB_OUTPUT"

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "standby_color=green" >> "$GITHUB_OUTPUT"
          else
            echo "standby_color=blue" >> "$GITHUB_OUTPUT"
          fi

          # Read ASG names
          BLUE_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/asg-name" \
            --query "Parameter.Value" --output text)
          GREEN_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-asg-name" \
            --query "Parameter.Value" --output text)

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_asg=$BLUE_ASG" >> "$GITHUB_OUTPUT"
            echo "standby_asg=$GREEN_ASG" >> "$GITHUB_OUTPUT"
          else
            echo "active_asg=$GREEN_ASG" >> "$GITHUB_OUTPUT"
            echo "standby_asg=$BLUE_ASG" >> "$GITHUB_OUTPUT"
          fi

          # Read current image tags
          BLUE_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || BLUE_TAG="unknown"
          GREEN_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || GREEN_TAG="unknown"

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_image_tag=$BLUE_TAG" >> "$GITHUB_OUTPUT"
            echo "standby_image_tag=$GREEN_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "active_image_tag=$GREEN_TAG" >> "$GITHUB_OUTPUT"
            echo "standby_image_tag=$BLUE_TAG" >> "$GITHUB_OUTPUT"
          fi

          # Server listeners: primary=required public SDK UDP, internal=browser-relay
          # UDP, secondary=HTTPS. The public UDP 443 listener must remain present.
          PRIMARY_LISTENER=$(aws ssm get-parameter \
            --name "${SSM_BASE}/udp-listener-arn" \
            --query "Parameter.Value" --output text 2>/dev/null) || PRIMARY_LISTENER=""
          if [[ -z "$PRIMARY_LISTENER" ]]; then
            echo "::error::Required assigned-cell public UDP listener is missing from ${SSM_BASE}/udp-listener-arn"
            exit 1
          fi
          {
            echo "primary_listener_arn=$PRIMARY_LISTENER"
            echo "blue_primary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/blue-udp-tg-arn" \
              --query "Parameter.Value" --output text)"
            echo "green_primary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/green-udp-tg-arn" \
              --query "Parameter.Value" --output text)"
          } >> "$GITHUB_OUTPUT"

          INTERNAL_LISTENER=$(aws ssm get-parameter \
            --name "${SSM_BASE}/internal-udp-listener-arn" \
            --query "Parameter.Value" --output text 2>/dev/null) || INTERNAL_LISTENER=""
          RELAY_ASG=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/relay/asg-name" \
            --query "Parameter.Value" --output text 2>/dev/null) || RELAY_ASG=""
          if [[ -n "$RELAY_ASG" && -z "$INTERNAL_LISTENER" ]]; then
            echo "::error::Relay ASG $RELAY_ASG is deployed but ${SSM_BASE}/internal-udp-listener-arn is missing"
            exit 1
          fi
          echo "internal_listener_arn=$INTERNAL_LISTENER" >> "$GITHUB_OUTPUT"

          if [[ -n "$INTERNAL_LISTENER" ]]; then
            echo "blue_internal_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/blue-internal-udp-tg-arn" \
              --query "Parameter.Value" --output text)" >> "$GITHUB_OUTPUT"
            echo "green_internal_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/green-internal-udp-tg-arn" \
              --query "Parameter.Value" --output text)" >> "$GITHUB_OUTPUT"
          fi

          # HTTPS listener/TGs are optional (only exist if QURL resolve endpoint is enabled)
          HTTPS_LISTENER=$(aws ssm get-parameter \
            --name "${SSM_BASE}/https-listener-arn" \
            --query "Parameter.Value" --output text 2>/dev/null) || HTTPS_LISTENER=""
          echo "secondary_listener_arn=$HTTPS_LISTENER" >> "$GITHUB_OUTPUT"

          if [[ -n "$HTTPS_LISTENER" ]]; then
            echo "blue_secondary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/blue-https-tg-arn" \
              --query "Parameter.Value" --output text)" >> "$GITHUB_OUTPUT"

            echo "green_secondary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/green-https-tg-arn" \
              --query "Parameter.Value" --output text)" >> "$GITHUB_OUTPUT"
          fi

      - name: Read AC SSM State
        id: ac-state
        if: steps.components.outputs.deploy_ac == 'true'
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          COMPONENT: ${{ inputs.component }}
        run: |
          SSM_BASE="/${ENVIRONMENT}/nhp/ac"
          echo "Reading AC blue/green state from SSM..."

          # Read active color
          ACTIVE_COLOR=$(aws ssm get-parameter \
            --name "${SSM_BASE}/active-color" \
            --query "Parameter.Value" --output text 2>/dev/null) || ACTIVE_COLOR=""

          if [[ -z "$ACTIVE_COLOR" ]]; then
            if [[ "$COMPONENT" == "both" ]]; then
              echo "::warning::AC blue/green not enabled - skipping AC deployment"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "::error::AC blue/green not enabled - SSM parameter ${SSM_BASE}/active-color not found"
              echo "Run 'terraform apply' with enable_ac_blue_green=true first"
              exit 1
            fi
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          echo "AC active color: $ACTIVE_COLOR"
          echo "active_color=$ACTIVE_COLOR" >> "$GITHUB_OUTPUT"

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "standby_color=green" >> "$GITHUB_OUTPUT"
          else
            echo "standby_color=blue" >> "$GITHUB_OUTPUT"
          fi

          # Read ASG names
          BLUE_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/asg-name" \
            --query "Parameter.Value" --output text)
          GREEN_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-asg-name" \
            --query "Parameter.Value" --output text)

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_asg=$BLUE_ASG" >> "$GITHUB_OUTPUT"
            echo "standby_asg=$GREEN_ASG" >> "$GITHUB_OUTPUT"
          else
            echo "active_asg=$GREEN_ASG" >> "$GITHUB_OUTPUT"
            echo "standby_asg=$BLUE_ASG" >> "$GITHUB_OUTPUT"
          fi

          # Read current image tags
          BLUE_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || BLUE_TAG="unknown"
          GREEN_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || GREEN_TAG="unknown"

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_image_tag=$BLUE_TAG" >> "$GITHUB_OUTPUT"
            echo "standby_image_tag=$GREEN_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "active_image_tag=$GREEN_TAG" >> "$GITHUB_OUTPUT"
            echo "standby_image_tag=$BLUE_TAG" >> "$GITHUB_OUTPUT"
          fi

          # AC listeners: primary=TCP only (no secondary)
          {
            echo "primary_listener_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/tcp-listener-arn" \
              --query "Parameter.Value" --output text)"
            echo "blue_primary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/blue-tcp-tg-arn" \
              --query "Parameter.Value" --output text)"
            echo "green_primary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/green-tcp-tg-arn" \
              --query "Parameter.Value" --output text)"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile Component Flags
        id: reconcile
        run: |
          # When component=both, a component may not have blue/green enabled.
          # Downgrade deploy flags based on actual SSM state availability.
          WANT_SERVER="${{ steps.components.outputs.deploy_server }}"
          WANT_AC="${{ steps.components.outputs.deploy_ac }}"
          SERVER_ENABLED="${{ steps.server-state.outputs.enabled }}"
          AC_ENABLED="${{ steps.ac-state.outputs.enabled }}"

          # If we wanted to deploy but SSM state wasn't found, downgrade
          FINAL_SERVER="$WANT_SERVER"
          FINAL_AC="$WANT_AC"

          if [[ "$WANT_SERVER" == "true" && "$SERVER_ENABLED" == "false" ]]; then
            FINAL_SERVER="false"
            echo "::warning::Server blue/green not available, excluding from deployment"
          fi

          if [[ "$WANT_AC" == "true" && "$AC_ENABLED" == "false" ]]; then
            FINAL_AC="false"
            echo "::warning::AC blue/green not available, excluding from deployment"
          fi

          # Fail if neither component is deployable
          if [[ "$FINAL_SERVER" != "true" && "$FINAL_AC" != "true" ]]; then
            echo "::error::No components available for blue/green deployment"
            exit 1
          fi

          echo "deploy_server=$FINAL_SERVER" >> "$GITHUB_OUTPUT"
          echo "deploy_ac=$FINAL_AC" >> "$GITHUB_OUTPUT"

      - name: Validate Inputs
        id: validate
        env:
          ACTION: ${{ inputs.action }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_SERVER: ${{ steps.reconcile.outputs.deploy_server }}
          DEPLOY_AC: ${{ steps.reconcile.outputs.deploy_ac }}
          SERVER_ACTIVE_TAG: ${{ steps.server-state.outputs.active_image_tag }}
          SERVER_STANDBY_TAG: ${{ steps.server-state.outputs.standby_image_tag }}
          AC_ACTIVE_TAG: ${{ steps.ac-state.outputs.active_image_tag }}
          AC_STANDBY_TAG: ${{ steps.ac-state.outputs.standby_image_tag }}
          REFRESH_TIMEOUT_MINUTES: ${{ inputs.refresh_timeout_minutes }}
          STANDBY_HEALTH_TIMEOUT_MINUTES: ${{ inputs.standby_health_timeout_minutes }}
          PRE_SWITCH_KNOCK_READY_TIMEOUT_MINUTES: ${{ inputs.pre_switch_knock_ready_timeout_minutes }}
          POST_SWITCH_KNOCK_READY_TIMEOUT_MINUTES: ${{ inputs.post_switch_knock_ready_timeout_minutes }}
        run: |
          # Validate timeout bounds. Env var names are upper-case of their
          # workflow input names so ::error:: messages can lower-case and
          # tell a dispatcher exactly which input to fix. Boot-budget
          # inputs (refresh, standby_health) share a 2-60 / 5-60 window;
          # knock-ready probes (convergence, regression-detection) share
          # a tighter 2-30 window. See docs/deploy-timeouts.md.
          check_bounds() {
            local var="$1" min="$2" max="$3"
            local val="${!var:-}"
            if ! [[ "$val" =~ ^[0-9]+$ ]] || (( val < min || val > max )); then
              echo "::error::${var,,} must be between $min and $max (got: '$val')"
              exit 1
            fi
          }
          check_bounds REFRESH_TIMEOUT_MINUTES 5 60
          check_bounds STANDBY_HEALTH_TIMEOUT_MINUTES 2 60
          check_bounds PRE_SWITCH_KNOCK_READY_TIMEOUT_MINUTES 2 30
          # post_switch lower bound is 3 (not 2): the AC NLB safety net's
          # 112.5s worst-case fire interval plus the gate's own ~12-20s
          # convergence cost fits inside 3 min but not 2. See PR #1726.
          check_bounds POST_SWITCH_KNOCK_READY_TIMEOUT_MINUTES 3 30

          if [[ "$ACTION" == "deploy" ]]; then
            if [[ -z "$IMAGE_TAG" ]]; then
              echo "::error::image_tag is required for deploy action"
              exit 1
            fi
            # Server validation
            if [[ "$DEPLOY_SERVER" == "true" ]]; then
              if [[ "$IMAGE_TAG" == "$SERVER_ACTIVE_TAG" ]]; then
                echo "::warning::Server: Deploying same image tag ($IMAGE_TAG) that is already active."
              fi
              echo "server_target_image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            fi
            # AC validation
            if [[ "$DEPLOY_AC" == "true" ]]; then
              if [[ "$IMAGE_TAG" == "$AC_ACTIVE_TAG" ]]; then
                echo "::warning::AC: Deploying same image tag ($IMAGE_TAG) that is already active."
              fi
              echo "ac_target_image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$ACTION" == "rollback" || "$ACTION" == "switch-only" ]]; then
            # Server
            if [[ "$DEPLOY_SERVER" == "true" ]]; then
              if [[ "$SERVER_STANDBY_TAG" == "unknown" || -z "$SERVER_STANDBY_TAG" ]]; then
                echo "::error::Cannot $ACTION server: standby image tag is unknown"
                echo "::error::Use 'deploy' action with an image_tag to initialize the standby first."
                exit 1
              fi
              echo "server_target_image_tag=$SERVER_STANDBY_TAG" >> "$GITHUB_OUTPUT"
            fi
            # AC
            if [[ "$DEPLOY_AC" == "true" ]]; then
              if [[ "$AC_STANDBY_TAG" == "unknown" || -z "$AC_STANDBY_TAG" ]]; then
                echo "::error::Cannot $ACTION AC: standby image tag is unknown"
                echo "::error::Use 'deploy' action with an image_tag to initialize the standby first."
                exit 1
              fi
              echo "ac_target_image_tag=$AC_STANDBY_TAG" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Summary
        env:
          ACTION: ${{ inputs.action }}
          COMPONENT: ${{ inputs.component }}
          DEPLOY_SERVER: ${{ steps.reconcile.outputs.deploy_server }}
          DEPLOY_AC: ${{ steps.reconcile.outputs.deploy_ac }}
          SERVER_ACTIVE_COLOR: ${{ steps.server-state.outputs.active_color }}
          SERVER_STANDBY_COLOR: ${{ steps.server-state.outputs.standby_color }}
          SERVER_ACTIVE_TAG: ${{ steps.server-state.outputs.active_image_tag }}
          SERVER_TARGET_TAG: ${{ steps.validate.outputs.server_target_image_tag }}
          AC_ACTIVE_COLOR: ${{ steps.ac-state.outputs.active_color }}
          AC_STANDBY_COLOR: ${{ steps.ac-state.outputs.standby_color }}
          AC_ACTIVE_TAG: ${{ steps.ac-state.outputs.active_image_tag }}
          AC_TARGET_TAG: ${{ steps.validate.outputs.ac_target_image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Blue/Green State"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DRY_RUN" == "true" ]]; then
            {
              echo "> **DRY RUN MODE** - No changes will be made"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Action | $ACTION |"
            echo "| Component | $COMPONENT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            {
              echo ""
              echo "### Server"
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| Active Color | **$SERVER_ACTIVE_COLOR** |"
              echo "| Standby Color | $SERVER_STANDBY_COLOR |"
              echo "| Active Image | \`$SERVER_ACTIVE_TAG\` |"
              echo "| Target Image | \`$SERVER_TARGET_TAG\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            {
              echo ""
              echo "### AC"
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| Active Color | **$AC_ACTIVE_COLOR** |"
              echo "| Standby Color | $AC_STANDBY_COLOR |"
              echo "| Active Image | \`$AC_ACTIVE_TAG\` |"
              echo "| Target Image | \`$AC_TARGET_TAG\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # =============================================================================
  # DEPLOY TO STANDBY - Update standby ASG with new image
  # =============================================================================
  deploy-to-standby:
    name: Deploy to Standby
    needs: prepare
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Server and AC instance refreshes run in parallel when component=both.
    # Per-component timeout: refresh (max 60m) + health check (max 30m) + buffer (5m) = 95m.
    timeout-minutes: 95
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mark Deployment Window
        if: (needs.prepare.outputs.deploy_server == 'true' || needs.prepare.outputs.deploy_ac == 'true') && inputs.dry_run != true
        uses: ./.github/actions/mark-deployment-window
        with:
          # Same DeploymentWindow metric as the instance-refresh heartbeat
          # below, so it must carry the same Environment dimension.
          environment: ${{ env.INFRA_ENVIRONMENT }}
          cell_id: ${{ inputs.cell_id }}
          component: ${{ inputs.component }}
          strategy: blue-green-standby

      # ---- Server Deploy Steps ----
      - name: "[Server] Validate Image Exists in ECR"
        id: server-image
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
        run: |
          REPO_NAME=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/server/ecr-repo-name" \
            --query "Parameter.Value" --output text 2>/dev/null) || REPO_NAME=""
          if [[ -z "$REPO_NAME" ]]; then
            REPO_NAME="layerv/nhp-server"
            echo "::warning::SSM parameter /${ENVIRONMENT}/nhp/server/ecr-repo-name not found, using default: $REPO_NAME"
          fi
          echo "Verifying image $REPO_NAME:$IMAGE_TAG exists in ECR..."
          if ! aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query "imageDetails[0].imageTags" \
            --output text > /dev/null 2>&1; then
            echo "::error::Image $REPO_NAME:$IMAGE_TAG not found in ECR"
            exit 1
          fi
          echo "Image verified: $REPO_NAME:$IMAGE_TAG exists"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      # Pipeline-side attestation gate (#1334 Phase 1). audit by default; flip
      # to enforce fleet-wide via the IMAGE_ATTESTATION_VERIFY_MODE variable
      # after post-#2339 attested images have soaked.
      - name: "[Server] Verify Image Attestation"
        if: needs.prepare.outputs.deploy_server == 'true'
        uses: ./.github/actions/verify-image-attestation
        with:
          repository: ${{ steps.server-image.outputs.repo_name }}
          image-tag: ${{ needs.prepare.outputs.server_target_image_tag }}
          region: ${{ env.AWS_REGION }}
          mode: ${{ vars.IMAGE_ATTESTATION_VERIFY_MODE || 'audit' }}

      - name: "[Server] Update Standby Image Tag"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          IMAGE_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$STANDBY_COLOR" == "green" ]]; then
            SSM_PARAM="/${ENVIRONMENT}/nhp/server/green-image-tag"
          else
            SSM_PARAM="/${ENVIRONMENT}/nhp/server/image-tag"
          fi
          echo "Updating $SSM_PARAM to $IMAGE_TAG"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would update SSM parameter: $SSM_PARAM = $IMAGE_TAG"
          else
            aws ssm put-parameter --name "$SSM_PARAM" --value "$IMAGE_TAG" --type String --overwrite
          fi

      - name: "[Server] Prune Missing Standby Target Groups"
        if: needs.prepare.outputs.deploy_server == 'true'
        timeout-minutes: 5
        env:
          STANDBY_ASG: ${{ needs.prepare.outputs.server_standby_asg }}
          DRY_RUN: ${{ inputs.dry_run }}
        # Prune repairs stale ASG target-group associations before Auto Scaling's
        # capacity reconciliation, scale-up, and refresh try to launch instances.
        run: ./.github/scripts/prune-missing-asg-target-groups.sh "$STANDBY_ASG"

      - name: "[Server] Scale Up Standby ASG"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          STANDBY_ASG: ${{ needs.prepare.outputs.server_standby_asg }}
          ACTIVE_ASG: ${{ needs.prepare.outputs.server_active_asg }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Same boot budget as the standby health probe: reaching InService
          # costs a user_data boot plus the ASG health-check grace.
          STANDBY_HEALTH_TIMEOUT_MINUTES: ${{ inputs.standby_health_timeout_minutes }}
        run: |
          set -euo pipefail
          ACTIVE_CAPACITY=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ACTIVE_ASG" \
            --query "AutoScalingGroups[0].DesiredCapacity" --output text)
          echo "Server active ASG capacity: $ACTIVE_CAPACITY"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would scale $STANDBY_ASG to min=$ACTIVE_CAPACITY, desired=$ACTIVE_CAPACITY"
          else
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$STANDBY_ASG" \
              --min-size "$ACTIVE_CAPACITY" --desired-capacity "$ACTIVE_CAPACITY"

            # Wait for the standby to actually reach capacity before the next
            # steps observe it.
            #
            # A WARM standby (cell0 keeps both colours at 3) is already there,
            # so this returns on the first poll and the step is unchanged for
            # the existing lane. A COLD standby is the new case: cell1's green
            # ASG sits at DesiredCapacity 0 until its first deploy. Without
            # this wait, start-instance-refresh can run against a still-empty
            # ASG and complete instantly as a no-op, after which
            # verify-asg-instances-healthy.sh hard-fails with "No InService
            # instances found" — a red deploy on a perfectly healthy rollout.
            # Fall back to the input's declared default if the value ever
            # arrives non-numeric: arithmetic treats a blank as 0, which would
            # trip the deadline on the first iteration and fail a healthy
            # rollout. dispatch-and-poll-blue-green.sh does not pass this
            # input, so cell1 deploys ride on the workflow default.
            WAIT_MINUTES="$STANDBY_HEALTH_TIMEOUT_MINUTES"
            if [[ ! "$WAIT_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
              echo "::warning::standby_health_timeout_minutes='$WAIT_MINUTES' is not a positive integer; using 15"
              WAIT_MINUTES=15
            fi
            DEADLINE=$(($(date +%s) + WAIT_MINUTES * 60))
            while :; do
              # Tolerate a transient DescribeAutoScalingGroups failure
              # (throttling, eventual consistency). A cold standby can take
              # minutes, and one blip must not abort an otherwise-healthy
              # rollout under `set -e` — DEADLINE below is the real bound.
              # Same posture as the transient-tolerant polling in
              # dispatch-and-poll-blue-green.sh.
              INSERVICE=$(aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "$STANDBY_ASG" \
                --query "length(AutoScalingGroups[0].Instances[?LifecycleState=='InService'])" \
                --output text 2>/dev/null) || INSERVICE=""
              if [[ "$INSERVICE" =~ ^[0-9]+$ ]]; then
                if ((INSERVICE >= ACTIVE_CAPACITY)); then
                  echo "Standby ASG $STANDBY_ASG reached $INSERVICE/$ACTIVE_CAPACITY InService"
                  break
                fi
                PROGRESS="$INSERVICE/$ACTIVE_CAPACITY InService"
              else
                PROGRESS="capacity read failed (transient), retrying"
              fi
              if (($(date +%s) >= DEADLINE)); then
                echo "::error::Standby ASG $STANDBY_ASG did not reach $ACTIVE_CAPACITY InService instance(s) within ${WAIT_MINUTES}m (last observation: $PROGRESS)" >&2
                exit 1
              fi
              echo "  Standby at $PROGRESS, waiting..."
              sleep 15
            done
          fi

      # ---- AC Setup Steps (moved before refresh to enable parallel refresh) ----
      - name: "[AC] Validate Image Exists in ECR"
        id: ac-image
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
        run: |
          REPO_NAME=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/ac/ecr-repo-name" \
            --query "Parameter.Value" --output text 2>/dev/null) || REPO_NAME=""
          if [[ -z "$REPO_NAME" ]]; then
            REPO_NAME="layerv/nhp-ac"
            echo "::warning::SSM parameter /${ENVIRONMENT}/nhp/ac/ecr-repo-name not found, using default: $REPO_NAME"
          fi
          echo "Verifying image $REPO_NAME:$IMAGE_TAG exists in ECR..."
          if ! aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query "imageDetails[0].imageTags" \
            --output text > /dev/null 2>&1; then
            echo "::error::Image $REPO_NAME:$IMAGE_TAG not found in ECR"
            exit 1
          fi
          echo "Image verified: $REPO_NAME:$IMAGE_TAG exists"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: "[AC] Verify Image Attestation"
        if: needs.prepare.outputs.deploy_ac == 'true'
        uses: ./.github/actions/verify-image-attestation
        with:
          repository: ${{ steps.ac-image.outputs.repo_name }}
          image-tag: ${{ needs.prepare.outputs.ac_target_image_tag }}
          region: ${{ env.AWS_REGION }}
          mode: ${{ vars.IMAGE_ATTESTATION_VERIFY_MODE || 'audit' }}

      - name: "[AC] Update Standby Image Tag"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          STANDBY_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          IMAGE_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$STANDBY_COLOR" == "green" ]]; then
            SSM_PARAM="/${ENVIRONMENT}/nhp/ac/green-image-tag"
          else
            SSM_PARAM="/${ENVIRONMENT}/nhp/ac/image-tag"
          fi
          echo "Updating $SSM_PARAM to $IMAGE_TAG"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would update SSM parameter: $SSM_PARAM = $IMAGE_TAG"
          else
            aws ssm put-parameter --name "$SSM_PARAM" --value "$IMAGE_TAG" --type String --overwrite
          fi

      - name: "[AC] Prune Missing Standby Target Groups"
        if: needs.prepare.outputs.deploy_ac == 'true'
        timeout-minutes: 5
        env:
          STANDBY_ASG: ${{ needs.prepare.outputs.ac_standby_asg }}
          DRY_RUN: ${{ inputs.dry_run }}
        # Prune repairs stale ASG target-group associations before Auto Scaling's
        # capacity reconciliation, scale-up, and refresh try to launch instances.
        run: ./.github/scripts/prune-missing-asg-target-groups.sh "$STANDBY_ASG"

      - name: "[AC] Scale Up Standby ASG"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          STANDBY_ASG: ${{ needs.prepare.outputs.ac_standby_asg }}
          ACTIVE_ASG: ${{ needs.prepare.outputs.ac_active_asg }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ACTIVE_CAPACITY=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ACTIVE_ASG" \
            --query "AutoScalingGroups[0].DesiredCapacity" --output text)
          echo "AC active ASG capacity: $ACTIVE_CAPACITY"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would scale $STANDBY_ASG to min=$ACTIVE_CAPACITY, desired=$ACTIVE_CAPACITY"
          else
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$STANDBY_ASG" \
              --min-size "$ACTIVE_CAPACITY" --desired-capacity "$ACTIVE_CAPACITY"
          fi

      # ---- Parallel Instance Refresh ----
      # Server and AC standby refreshes run in parallel because neither
      # serves traffic during refresh. AC standby instances connect to the
      # ACTIVE server (not the standby being refreshed), so there is no
      # ordering dependency between the two refreshes.
      - name: "[Parallel] Instance Refresh on Standby (Server + AC)"
        if: (needs.prepare.outputs.deploy_server == 'true' || needs.prepare.outputs.deploy_ac == 'true') && inputs.dry_run != true
        env:
          SERVER_STANDBY_ASG: ${{ needs.prepare.outputs.server_standby_asg }}
          AC_STANDBY_ASG: ${{ needs.prepare.outputs.ac_standby_asg }}
          DEPLOY_SERVER: ${{ needs.prepare.outputs.deploy_server }}
          DEPLOY_AC: ${{ needs.prepare.outputs.deploy_ac }}
          REFRESH_TIMEOUT_MINUTES: ${{ inputs.refresh_timeout_minutes }}
          DEPLOYMENT_WINDOW_ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          DEPLOYMENT_WINDOW_CELL_ID: ${{ inputs.cell_id }}
          DEPLOYMENT_WINDOW_COMPONENT: ${{ inputs.component }}
          DEPLOYMENT_WINDOW_STRATEGY: blue-green-standby-refresh
          DEPLOYMENT_WINDOW_EMIT_INTERVAL_SECONDS: '60'
        run: |
          set -euo pipefail
          # shellcheck source=.github/scripts/wait-for-instance-refresh.sh
          source .github/scripts/wait-for-instance-refresh.sh

          start_refresh() {
            local asg=$1 label=$2
            echo "Starting instance refresh on $label standby ASG: $asg" >&2
            EXISTING=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$asg" \
              --query "InstanceRefreshes[?Status=='InProgress' || Status=='Pending'].InstanceRefreshId" \
              --output text 2>/dev/null) || true
            if [[ -n "$EXISTING" ]]; then
              echo "Cancelling existing refresh on $asg: $EXISTING" >&2
              aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$asg" || true
              sleep 10
            fi
            aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$asg" \
              --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60, "SkipMatching": false}' \
              --query "InstanceRefreshId" --output text
          }

          poll_refresh() {
            local asg=$1 refresh_id=$2 label=$3 deadline=$4
            local now remaining_seconds max_iterations
            now=$(date +%s)
            if ((now >= deadline)); then
              echo "::error::$label instance refresh timed out before polling could start"
              return 1
            fi
            remaining_seconds=$((deadline - now))
            # Give the helper both an iteration budget and the shared deadline;
            # the enclosing job timeout remains the hard wall-clock cap. The
            # helper intentionally tolerates brief describe-instance-refreshes
            # blips here and fails loud after 3 consecutive describe errors.
            max_iterations=$(((remaining_seconds + 9) / 10))
            wait_for_instance_refresh "$asg" "$refresh_id" "" "$max_iterations" "$label" 10 3 "$deadline"
          }

          DEADLINE=$(($(date +%s) + REFRESH_TIMEOUT_MINUTES * 60))
          echo "Starting parallel refresh: server=$DEPLOY_SERVER ac=$DEPLOY_AC"

          # Start refreshes
          SERVER_REFRESH_ID=""
          AC_REFRESH_ID=""
          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            SERVER_REFRESH_ID=$(start_refresh "$SERVER_STANDBY_ASG" "Server")
            echo "Server refresh started: $SERVER_REFRESH_ID" >&2
          fi
          if [[ "$DEPLOY_AC" == "true" ]]; then
            AC_REFRESH_ID=$(start_refresh "$AC_STANDBY_ASG" "AC")
            echo "AC refresh started: $AC_REFRESH_ID" >&2
          fi

          # Poll in parallel using background processes
          SERVER_PID=""
          AC_PID=""
          if [[ -n "$SERVER_REFRESH_ID" ]]; then
            poll_refresh "$SERVER_STANDBY_ASG" "$SERVER_REFRESH_ID" "Server" "$DEADLINE" &
            SERVER_PID=$!
          fi
          if [[ -n "$AC_REFRESH_ID" ]]; then
            poll_refresh "$AC_STANDBY_ASG" "$AC_REFRESH_ID" "AC" "$DEADLINE" &
            AC_PID=$!
          fi

          # Wait for both to complete
          FAILED=false
          if [[ -n "$SERVER_PID" ]]; then
            if ! wait "$SERVER_PID"; then FAILED=true; echo "::error::Server refresh failed"; fi
          fi
          if [[ -n "$AC_PID" ]]; then
            if ! wait "$AC_PID"; then FAILED=true; echo "::error::AC refresh failed"; fi
          fi
          if [[ "$FAILED" == "true" ]]; then exit 1; fi

      # ---- Parallel Standby Health Verification ----
      # Verify newly-refreshed standby instances via SSM (not NLB target
      # health, which reports "unused" for standby TGs with no listener).
      # Server and AC verifications run in parallel for the same reason
      # as the refresh: neither serves traffic during standby.
      - name: "[Parallel] Verify Standby Health (Server + AC)"
        if: (needs.prepare.outputs.deploy_server == 'true' || needs.prepare.outputs.deploy_ac == 'true') && inputs.dry_run != true
        env:
          SERVER_STANDBY_ASG: ${{ needs.prepare.outputs.server_standby_asg }}
          AC_STANDBY_ASG: ${{ needs.prepare.outputs.ac_standby_asg }}
          DEPLOY_SERVER: ${{ needs.prepare.outputs.deploy_server }}
          DEPLOY_AC: ${{ needs.prepare.outputs.deploy_ac }}
          # Boot budget — covers standby instance user_data + service
          # bind. See docs/deploy-timeouts.md.
          STANDBY_HEALTH_TIMEOUT_MINUTES: ${{ inputs.standby_health_timeout_minutes }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/verify-asg-instances-healthy.sh
          FAILED=false
          SERVER_PID=""
          AC_PID=""

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            # nhp-server runs with --net=host, so /health/live is on 127.0.0.1:8888
            .github/scripts/verify-asg-instances-healthy.sh \
              "$SERVER_STANDBY_ASG" "Server-Standby" "$STANDBY_HEALTH_TIMEOUT_MINUTES" \
              'curl -sfS -o /dev/null http://127.0.0.1:8888/health/live' &
            SERVER_PID=$!
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            # Traefik admin ping on port 8080
            .github/scripts/verify-asg-instances-healthy.sh \
              "$AC_STANDBY_ASG" "AC-Standby" "$STANDBY_HEALTH_TIMEOUT_MINUTES" \
              'curl -sfS -o /dev/null http://127.0.0.1:8080/ping' &
            AC_PID=$!
          fi

          if [[ -n "$SERVER_PID" ]]; then
            if ! wait "$SERVER_PID"; then FAILED=true; echo "::error::Server standby health check failed"; fi
          fi
          if [[ -n "$AC_PID" ]]; then
            if ! wait "$AC_PID"; then FAILED=true; echo "::error::AC standby health check failed"; fi
          fi
          if [[ "$FAILED" == "true" ]]; then exit 1; fi

      # Knock-readiness gate: verify EVERY active server instance reports
      # AC peers connected before switching traffic. During blue/green AC
      # deploy, new AC instances must establish NHP UDP connections to the
      # server. NLB target health only checks TCP — it doesn't verify the
      # NHP UDP registration. Without this gate, traffic can switch to new
      # ACs before some servers have knocked them, causing
      # "failed to find ac connection" errors for QURL resolve requests
      # routed to those servers.
      #
      # We require ALL InService instances in the active server ASG to
      # report healthy because the NLB will round-robin to all of them; if
      # even one server lacks AC peers, requests routed there will fail.
      - name: "[Server] Verify Knock Readiness (AC Peers Connected)"
        if: needs.prepare.outputs.deploy_ac == 'true' && inputs.dry_run != true
        env:
          SERVER_ACTIVE_ASG: ${{ needs.prepare.outputs.server_active_asg }}
          # Convergence budget — standby is already up, waiting on knock
          # protocol convergence on the active server fleet.
          KNOCK_READY_TIMEOUT_MINUTES: ${{ inputs.pre_switch_knock_ready_timeout_minutes }}
        run: |
          # check-nrestarts=false: SERVER_ACTIVE_ASG is the long-lived
          # active color; its NRestarts counter accumulates across
          # historical incidents that aren't part of this deploy.
          # Post-switch verification below passes check-nrestarts=true
          # against the freshly-refreshed fleet where NRestarts=0 at
          # launch is the right invariant.
          .github/scripts/verify-knock-ready.sh \
            "$SERVER_ACTIVE_ASG" "pre-switch" "$KNOCK_READY_TIMEOUT_MINUTES" "false"

      - name: "[Server] Dry Run Notice"
        if: needs.prepare.outputs.deploy_server == 'true' && inputs.dry_run == true
        run: |
          echo "[DRY RUN] [Server] Would start instance refresh and wait for completion"
          echo "[DRY RUN] [Server] Would verify target group health"

      - name: "[AC] Dry Run Notice"
        if: needs.prepare.outputs.deploy_ac == 'true' && inputs.dry_run == true
        run: |
          echo "[DRY RUN] [AC] Would start instance refresh and wait for completion"
          echo "[DRY RUN] [AC] Would verify target group health"
          echo "[DRY RUN] [AC] Would verify server knock readiness (AC peers connected)"

  # =============================================================================
  # SWITCH TRAFFIC - Modify NLB listeners (instant, <1 second)
  # =============================================================================
  switch-traffic:
    name: Switch Traffic
    needs: [prepare, deploy-to-standby]
    if: always() && needs.prepare.result == 'success' && (needs.deploy-to-standby.result == 'success' || needs.deploy-to-standby.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mark Deployment Window
        if: (needs.prepare.outputs.deploy_server == 'true' || needs.prepare.outputs.deploy_ac == 'true') && inputs.dry_run != true
        uses: ./.github/actions/mark-deployment-window
        with:
          # Same DeploymentWindow metric as the instance-refresh heartbeat
          # below, so it must carry the same Environment dimension.
          environment: ${{ env.INFRA_ENVIRONMENT }}
          cell_id: ${{ inputs.cell_id }}
          component: ${{ inputs.component }}
          strategy: blue-green-switch

      # Pre-switch target-slot proof catches stale app bytes before traffic
      # moves. The post-switch active-slot proof below still runs to verify
      # active-color -> slot convergence before the child workflow reports
      # success to the parent deploy tracker.
      - name: "[Server] Assert Standby Image Tag Matches Target"
        if: needs.prepare.outputs.deploy_server == 'true' && inputs.dry_run != true
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
        run: |
          ./.github/scripts/assert-blue-green-image-tag.sh "$ENVIRONMENT" server standby "$EXPECTED_TAG"

      - name: "[AC] Assert Standby Image Tag Matches Target"
        if: needs.prepare.outputs.deploy_ac == 'true' && inputs.dry_run != true
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
        run: |
          ./.github/scripts/assert-blue-green-image-tag.sh "$ENVIRONMENT" ac standby "$EXPECTED_TAG"

      - name: "[Server] Switch NLB Listeners"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          ACTIVE_COLOR: ${{ needs.prepare.outputs.server_active_color }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          ACTION: ${{ inputs.action }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would switch server traffic to $STANDBY_COLOR"
            exit 0
          fi
          chmod +x .github/scripts/blue-green-switch.sh
          .github/scripts/blue-green-switch.sh "$ENVIRONMENT" "$STANDBY_COLOR" server

      - name: "[AC] Switch NLB Listener"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          ACTIVE_COLOR: ${{ needs.prepare.outputs.ac_active_color }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          ACTION: ${{ inputs.action }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would switch AC traffic to $STANDBY_COLOR"
            exit 0
          fi
          chmod +x .github/scripts/blue-green-switch.sh
          .github/scripts/blue-green-switch.sh "$ENVIRONMENT" "$STANDBY_COLOR" ac

      # Active-tag proof is deploy correctness, not optional post-switch smoke.
      # Keep it in switch-traffic so a dispatched blue/green run cannot report
      # success when the listener/active-color moved but the active slot still
      # resolves to stale app bytes. build-and-push.yml depends on this child
      # workflow returning failure before it can advance to deployment tracking.
      - name: "[Server] Assert Active Image Tag Matches Target"
        if: needs.prepare.outputs.deploy_server == 'true' && inputs.dry_run != true
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
        run: |
          ./.github/scripts/assert-blue-green-image-tag.sh "$ENVIRONMENT" server active "$EXPECTED_TAG"

      - name: "[AC] Assert Active Image Tag Matches Target"
        if: needs.prepare.outputs.deploy_ac == 'true' && inputs.dry_run != true
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          EXPECTED_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
        run: |
          ./.github/scripts/assert-blue-green-image-tag.sh "$ENVIRONMENT" ac active "$EXPECTED_TAG"

      # After the server NLB switch, ACs are still connected to the OLD
      # servers via existing UDP sessions. NLB doesn't break existing UDP
      # flows when the target group changes. Restarting nhp-acd on the
      # active AC instances drops the old sessions and forces reconnection
      # through the NLB, which now routes to the NEW servers.
      #
      # Without this, the new servers report "no AC peers connected" until
      # the old servers are terminated (which could be minutes later),
      # causing a user-facing outage window for knock requests.
      # Runs whenever servers were deployed, regardless of whether ACs were
      # also deployed. Server-only deploys still switch the server NLB,
      # leaving ACs connected to old servers via stale UDP sessions.
      # Clear stale AC-to-server assignments from DynamoDB before restarting
      # ACs. Without this, the restarted AC process retains its old
      # assignedServers state (pointing to blue server private IPs) and
      # never reconnects through the NLB to green servers. This caused
      # 7 consecutive deploy failures between 2026-04-11 and 2026-04-16.
      - name: "[AC] Clear DynamoDB AC Assignments (stale server IPs)"
        if: needs.prepare.outputs.deploy_server == 'true' && inputs.dry_run != true
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          CELL_ID: ${{ inputs.cell_id }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/clear-ac-assignments.sh
          .github/scripts/clear-ac-assignments.sh "$ENVIRONMENT" "$CELL_ID"

      - name: "[AC] Restart nhp-acd to Reconnect to New Servers"
        if: needs.prepare.outputs.deploy_server == 'true' && inputs.dry_run != true
        env:
          # When ACs were also deployed, standby became active after the switch.
          # When server-only, the current active AC ASG is unchanged.
          DEPLOY_AC: ${{ needs.prepare.outputs.deploy_ac }}
          AC_STANDBY_ASG: ${{ needs.prepare.outputs.ac_standby_asg }}
          AC_ACTIVE_ASG: ${{ needs.prepare.outputs.ac_active_asg }}
        run: |
          set -euo pipefail

          # Determine which AC ASG to restart: if ACs were deployed, the
          # standby became active after the AC NLB switch. If server-only,
          # the existing active AC ASG is unchanged.
          if [[ "$DEPLOY_AC" == "true" ]]; then
            TARGET_ASG="$AC_STANDBY_ASG"
          else
            TARGET_ASG="$AC_ACTIVE_ASG"
          fi
          echo "Restarting nhp-acd on AC ASG: $TARGET_ASG (deploy_ac=$DEPLOY_AC)"

          mapfile -t AC_INSTANCES < <(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$TARGET_ASG" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text | tr '\t' '\n' | grep -v '^$' | sort)

          if [[ ${#AC_INSTANCES[@]} -eq 0 ]]; then
            echo "::warning::No InService AC instances found in $TARGET_ASG — skipping restart"
            exit 0
          fi
          echo "Restarting nhp-acd on ${#AC_INSTANCES[@]} AC instance(s): ${AC_INSTANCES[*]}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${AC_INSTANCES[@]}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 30 \
            --max-errors "100%" \
            --parameters 'commands=["systemctl restart nhp-acd && echo RESTART_OK"]' \
            --query "Command.CommandId" --output text)
          echo "SSM command sent: $CMD_ID"

          # Wait for all instances to complete
          sleep 5
          FAILED=false
          for inst in "${AC_INSTANCES[@]}"; do
            STATUS="Pending"
            for attempt in 1 2 3 4; do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$CMD_ID" --instance-id "$inst" \
                --query "Status" --output text 2>/dev/null) || STATUS="Pending"
              case "$STATUS" in
                Success) echo "[ac-restart] $inst: restarted successfully"; break ;;
                Failed|TimedOut|Cancelled) echo "::error::[ac-restart] $inst: $STATUS"; FAILED=true; break ;;
                *) echo "[ac-restart] $inst: attempt $attempt, status=$STATUS, retrying..."; sleep 3 ;;
              esac
            done
            # If loop exhausted without terminal status, treat as failure
            if [[ "$STATUS" != "Success" && "$STATUS" != "Failed" && "$STATUS" != "TimedOut" && "$STATUS" != "Cancelled" ]]; then
              echo "::error::[ac-restart] $inst: timed out polling (last status: $STATUS)"
              FAILED=true
            fi
          done
          if [[ "$FAILED" == "true" ]]; then
            echo "::error::Some AC instances failed to restart nhp-acd"
            exit 1
          fi
          echo "All AC instances restarted — ACs will reconnect to new servers via NLB"
          # AC peer registration typically completes in 5-10s (observed in
          # sandbox). 15s provides a buffer so the knock-ready check in
          # validate passes on the first iteration rather than polling.
          echo "Waiting 15s for AC peer registration..."
          sleep 15

  # =============================================================================
  # SCALE DOWN PREVIOUS - Reduce previous active to warm standby
  # =============================================================================
  scale-down-previous:
    name: Scale Down Previous
    needs: [prepare, switch-traffic, validate]
    # Wait for validate (knock-ready confirmed) before scaling down. The
    # AC restart in switch-traffic makes this pass quickly (~seconds), but
    # keeping validate as a gate ensures we never scale down old servers
    # before confirming ACs are connected to the new ones.
    if: always() && needs.switch-traffic.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && inputs.action == 'deploy' && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "[Server] Scale Down Previous Active"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          PREVIOUS_ASG: ${{ needs.prepare.outputs.server_active_asg }}
        run: |
          echo "Scaling down previous server active ASG to warm standby: $PREVIOUS_ASG"
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$PREVIOUS_ASG" \
            --min-size 1 --desired-capacity 1
          echo "Previous server ASG scaled down to 1 instance"

      - name: "[AC] Scale Down Previous Active"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          PREVIOUS_ASG: ${{ needs.prepare.outputs.ac_active_asg }}
        run: |
          echo "Scaling down previous AC active ASG to warm standby: $PREVIOUS_ASG"
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$PREVIOUS_ASG" \
            --min-size 1 --desired-capacity 1
          echo "Previous AC ASG scaled down to 1 instance"

      - name: Wait for Previous Colors to Reach Warm Standby
        env:
          DEPLOY_SERVER: ${{ needs.prepare.outputs.deploy_server }}
          SERVER_PREVIOUS_ASG: ${{ needs.prepare.outputs.server_active_asg }}
          DEPLOY_AC: ${{ needs.prepare.outputs.deploy_ac }}
          AC_PREVIOUS_ASG: ${{ needs.prepare.outputs.ac_active_asg }}
        run: |
          set -euo pipefail

          labels=()
          asgs=()
          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            labels+=(server)
            asgs+=("$SERVER_PREVIOUS_ASG")
          fi
          if [[ "$DEPLOY_AC" == "true" ]]; then
            labels+=(AC)
            asgs+=("$AC_PREVIOUS_ASG")
          fi

          deadline=$((SECONDS + 300))
          while true; do
            all_converged=true
            for index in "${!asgs[@]}"; do
              label=${labels[$index]}
              asg=${asgs[$index]}
              # in_service, NOT length(Instances). An instance the ASG is
              # terminating stays in the Instances list while it sits in
              # Terminating:Wait, and this ASG carries
              # layerv-nhp-sandbox-termination-hook with a 300 s heartbeat
              # timeout — exactly the deadline below. Requiring the list to
              # drain to one therefore waited on a hook that could hold an
              # instance for the entire budget.
              #
              # Run 31425138552 failed that way: for the full 300 s it read
              # `desired=1 total=2 healthy-in-service=1`, i.e. warm standby had
              # been reached immediately and the gate was blocked solely by a
              # second instance already out of service. The failure retained the
              # sandbox live-env lock for its four-hour TTL — the same
              # converged-state-read-as-failure class as the post-switch crash
              # gate (#3800, #3808).
              #
              # Warm standby is a statement about SERVING capacity: desired 1,
              # exactly one InService instance, and it is healthy. Draining
              # instances do not serve and are reconciled by the next run's
              # Prepare, so they are not part of the condition.
              # Backticks are JMESPath literals, not shell substitutions.
              # shellcheck disable=SC2016
              read -r desired in_service healthy_in_service < <(
                aws autoscaling describe-auto-scaling-groups \
                  --auto-scaling-group-names "$asg" \
                  --query 'AutoScalingGroups[0].[DesiredCapacity,length(Instances[?LifecycleState==`InService`]),length(Instances[?LifecycleState==`InService` && HealthStatus==`Healthy`])]' \
                  --output text
              )

              if [[ ! "$desired" =~ ^[0-9]+$ || ! "$in_service" =~ ^[0-9]+$ || ! "$healthy_in_service" =~ ^[0-9]+$ ]]; then
                echo "::error::Could not read $label previous-color ASG convergence state for $asg: desired=$desired in-service=$in_service healthy-in-service=$healthy_in_service"
                exit 1
              fi
              if [[ "$desired" == "1" && "$in_service" == "1" && "$healthy_in_service" == "1" ]]; then
                echo "$label previous-color ASG is at warm standby: $asg (desired=1 in-service=1 healthy-in-service=1)"
              else
                echo "$label previous-color ASG is still converging: $asg (desired=$desired in-service=$in_service healthy-in-service=$healthy_in_service)"
                all_converged=false
              fi
            done

            if [[ "$all_converged" == "true" ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Previous-color ASGs did not reach one healthy InService warm-standby instance within 300 seconds (desired=1, exactly one InService instance, healthy)"
              exit 1
            fi
            sleep 10
          done

  # =============================================================================
  # VALIDATE - Post-switch validation
  # =============================================================================
  validate:
    name: Validate
    needs: [prepare, switch-traffic]
    if: always() && needs.switch-traffic.result == 'success' && inputs.skip_validation != true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify the required public SDK UDP listener. The internal browser-relay
      # UDP listener has its own verification below.
      - name: "[Server] Verify Traffic Switch"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.server_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.server_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.server_blue_primary_tg_arn }}
        run: |
          CURRENT_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$STANDBY_COLOR" == "green" ]]; then EXPECTED_TG="$GREEN_PRIMARY_TG"
          else EXPECTED_TG="$BLUE_PRIMARY_TG"; fi
          if [[ "$CURRENT_TG" == "$EXPECTED_TG" ]]; then
            echo "Server traffic verified: UDP listener pointing to $STANDBY_COLOR target group"
          else
            echo "::error::Server traffic mismatch! Expected $EXPECTED_TG but got $CURRENT_TG"
            exit 1
          fi

      # Public UDP reconciliation is mandatory. The internal relay listener has
      # its own reconciliation below whenever the relay is deployed.
      - name: "[Server] Reconcile Listener and SSM State"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.server_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.server_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.server_blue_primary_tg_arn }}
        run: |
          echo "Running server listener/SSM state reconciliation check..."
          SSM_COLOR=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/server/active-color" \
            --query "Parameter.Value" --output text)
          LISTENER_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$LISTENER_TG" == "$BLUE_PRIMARY_TG" ]]; then LISTENER_COLOR="blue"
          elif [[ "$LISTENER_TG" == "$GREEN_PRIMARY_TG" ]]; then LISTENER_COLOR="green"
          else echo "::error::Server listener pointing to unknown TG: $LISTENER_TG"; exit 1; fi
          if [[ "$SSM_COLOR" == "$LISTENER_COLOR" ]]; then
            echo "Server reconciliation passed: SSM ($SSM_COLOR) matches listener ($LISTENER_COLOR)"
          else
            echo "::error::Server state inconsistency! SSM=$SSM_COLOR, listener=$LISTENER_COLOR"
            exit 1
          fi

      - name: "[Server] Verify Internal Relay Traffic Switch"
        if: needs.prepare.outputs.deploy_server == 'true' && needs.prepare.outputs.server_internal_listener_arn != ''
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          INTERNAL_LISTENER: ${{ needs.prepare.outputs.server_internal_listener_arn }}
          GREEN_INTERNAL_TG: ${{ needs.prepare.outputs.server_green_internal_tg_arn }}
          BLUE_INTERNAL_TG: ${{ needs.prepare.outputs.server_blue_internal_tg_arn }}
        run: |
          CURRENT_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$INTERNAL_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$STANDBY_COLOR" == "green" ]]; then EXPECTED_TG="$GREEN_INTERNAL_TG"
          else EXPECTED_TG="$BLUE_INTERNAL_TG"; fi
          if [[ "$CURRENT_TG" == "$EXPECTED_TG" ]]; then
            echo "Server internal relay traffic verified: UDP listener pointing to $STANDBY_COLOR target group"
          else
            echo "::error::Server internal relay traffic mismatch! Expected $EXPECTED_TG but got $CURRENT_TG"
            exit 1
          fi

      - name: "[Server] Reconcile Internal Relay Listener and SSM State"
        if: needs.prepare.outputs.deploy_server == 'true' && needs.prepare.outputs.server_internal_listener_arn != ''
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          INTERNAL_LISTENER: ${{ needs.prepare.outputs.server_internal_listener_arn }}
          GREEN_INTERNAL_TG: ${{ needs.prepare.outputs.server_green_internal_tg_arn }}
          BLUE_INTERNAL_TG: ${{ needs.prepare.outputs.server_blue_internal_tg_arn }}
        run: |
          echo "Running server internal relay listener/SSM state reconciliation check..."
          SSM_COLOR=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/server/active-color" \
            --query "Parameter.Value" --output text)
          LISTENER_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$INTERNAL_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$LISTENER_TG" == "$BLUE_INTERNAL_TG" ]]; then LISTENER_COLOR="blue"
          elif [[ "$LISTENER_TG" == "$GREEN_INTERNAL_TG" ]]; then LISTENER_COLOR="green"
          else echo "::error::Server internal relay listener pointing to unknown TG: $LISTENER_TG"; exit 1; fi
          if [[ "$SSM_COLOR" == "$LISTENER_COLOR" ]]; then
            echo "Server internal relay reconciliation passed: SSM ($SSM_COLOR) matches listener ($LISTENER_COLOR)"
          else
            echo "::error::Server internal relay state inconsistency! SSM=$SSM_COLOR, listener=$LISTENER_COLOR"
            exit 1
          fi

      - name: "[AC] Verify Traffic Switch"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.ac_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.ac_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.ac_blue_primary_tg_arn }}
        run: |
          CURRENT_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$STANDBY_COLOR" == "green" ]]; then EXPECTED_TG="$GREEN_PRIMARY_TG"
          else EXPECTED_TG="$BLUE_PRIMARY_TG"; fi
          if [[ "$CURRENT_TG" == "$EXPECTED_TG" ]]; then
            echo "AC traffic verified: TCP listener pointing to $STANDBY_COLOR target group"
          else
            echo "::error::AC traffic mismatch! Expected $EXPECTED_TG but got $CURRENT_TG"
            exit 1
          fi

      - name: "[AC] Reconcile Listener and SSM State"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.ac_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.ac_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.ac_blue_primary_tg_arn }}
        run: |
          echo "Running AC listener/SSM state reconciliation check..."
          SSM_COLOR=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/ac/active-color" \
            --query "Parameter.Value" --output text)
          LISTENER_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$LISTENER_TG" == "$BLUE_PRIMARY_TG" ]]; then LISTENER_COLOR="blue"
          elif [[ "$LISTENER_TG" == "$GREEN_PRIMARY_TG" ]]; then LISTENER_COLOR="green"
          else echo "::error::AC listener pointing to unknown TG: $LISTENER_TG"; exit 1; fi
          if [[ "$SSM_COLOR" == "$LISTENER_COLOR" ]]; then
            echo "AC reconciliation passed: SSM ($SSM_COLOR) matches listener ($LISTENER_COLOR)"
          else
            echo "::error::AC state inconsistency! SSM=$SSM_COLOR, listener=$LISTENER_COLOR"
            exit 1
          fi

      # After the traffic switch, the AC restart step forces ACs to
      # reconnect to the new servers. Verify every newly-active server
      # instance has AC peers connected before downstream consumers
      # (smoke tests, build-and-push validation) start.
      # Require this after every server switch in a topology with an AC fleet,
      # including a server-only deploy such as cell0. AC-less transport-canary
      # cells cannot satisfy an AC-peer gate; using the prepared topology output
      # makes a future provisioned cell inherit the gate when it adds ACs.
      - name: "[Server] Verify Post-Switch Knock Readiness"
        if: needs.prepare.outputs.deploy_server == 'true' && needs.prepare.outputs.ac_active_asg != '' && inputs.dry_run != true
        env:
          NEW_ACTIVE_ASG: ${{ needs.prepare.outputs.server_standby_asg }}
          # Regression-detection budget — traffic is already live here.
          # See docs/deploy-timeouts.md.
          KNOCK_READY_TIMEOUT_MINUTES: ${{ inputs.post_switch_knock_ready_timeout_minutes }}
        run: |
          .github/scripts/verify-knock-ready.sh "$NEW_ACTIVE_ASG" "post-switch" "$KNOCK_READY_TIMEOUT_MINUTES"

      - name: Run Validation Script
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
        run: |
          if [[ -f scripts/validate-deployment.sh ]]; then
            chmod +x scripts/validate-deployment.sh
            ./scripts/validate-deployment.sh "$ENVIRONMENT" || {
              echo "::warning::Some validation checks failed"
            }
          else
            echo "No validation script found, skipping"
          fi

      - name: Push Deployment Metric
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          CELL_ID: ${{ inputs.cell_id }}
          COMPONENT: ${{ inputs.component }}
        run: |
          # Push deployment count metric for stale deployment detection
          # Emit with Environment-only dimension for backward compatibility with
          # existing server stale-deployment alarm, plus Environment+Component
          # for per-component tracking
          aws cloudwatch put-metric-data \
            --namespace "NHP/BlueGreen" \
            --metric-name "DeploymentCount" \
            --dimensions "Environment=$ENVIRONMENT" \
            --value 1 \
            --unit Count
          aws cloudwatch put-metric-data \
            --namespace "NHP/BlueGreen" \
            --metric-name "DeploymentCount" \
            --dimensions "Environment=$ENVIRONMENT,Component=$COMPONENT" \
            --value 1 \
            --unit Count
          echo "Deployment metric pushed to CloudWatch (both dimension sets)"

          # Push deployment event for Grafana annotations
          aws cloudwatch put-metric-data \
            --namespace "LayerV/NHP" \
            --metric-name "DeploymentEvent" \
            --dimensions "Environment=$ENVIRONMENT,Component=$COMPONENT,Strategy=blue-green" \
            --value 1 \
            --unit Count \
            || echo "::warning::Failed to push deployment metric"
          aws cloudwatch put-metric-data \
            --namespace "LayerV/NHP" \
            --metric-name "DeploymentEvent" \
            --dimensions "Environment=$ENVIRONMENT,Cell=$CELL_ID" \
            --value 1 \
            --unit Count \
            || echo "::warning::Failed to push cell-scoped deployment metric"
          echo "Deployment event pushed to LayerV/NHP namespace"

      - name: Deployment Summary
        env:
          ACTION: ${{ inputs.action }}
          COMPONENT: ${{ inputs.component }}
          DEPLOY_SERVER: ${{ needs.prepare.outputs.deploy_server }}
          DEPLOY_AC: ${{ needs.prepare.outputs.deploy_ac }}
          SERVER_NEW_ACTIVE: ${{ needs.prepare.outputs.server_standby_color }}
          SERVER_PREVIOUS_ACTIVE: ${{ needs.prepare.outputs.server_active_color }}
          SERVER_NEW_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
          SERVER_PREVIOUS_TAG: ${{ needs.prepare.outputs.server_active_image_tag }}
          AC_NEW_ACTIVE: ${{ needs.prepare.outputs.ac_standby_color }}
          AC_PREVIOUS_ACTIVE: ${{ needs.prepare.outputs.ac_active_color }}
          AC_NEW_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
          AC_PREVIOUS_TAG: ${{ needs.prepare.outputs.ac_active_image_tag }}
        run: |
          {
            echo "## Blue/Green Deployment Complete"
            echo ""
            echo "**Action:** $ACTION | **Component:** $COMPONENT"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            {
              echo "### Server"
              echo "| Property | Before | After |"
              echo "|----------|--------|-------|"
              echo "| Active Color | $SERVER_PREVIOUS_ACTIVE | **$SERVER_NEW_ACTIVE** |"
              echo "| Active Image | \`$SERVER_PREVIOUS_TAG\` | \`$SERVER_NEW_TAG\` |"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            {
              echo "### AC"
              echo "| Property | Before | After |"
              echo "|----------|--------|-------|"
              echo "| Active Color | $AC_PREVIOUS_ACTIVE | **$AC_NEW_ACTIVE** |"
              echo "| Active Image | \`$AC_PREVIOUS_TAG\` | \`$AC_NEW_TAG\` |"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### Rollback"
            echo "To rollback, run this workflow with:"
            echo "- **action:** \`rollback\`"
            echo "- **component:** \`$COMPONENT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # FINALIZE SANDBOX LIVE-ENVIRONMENT LOCK
  # =============================================================================
  # Release once the run can no longer move the live boundary. A mutation that
  # actually reached the listeners and then failed may leave a half-switched
  # boundary or an unconverged active color requiring operator reconciliation,
  # so retain the lock fail-closed there instead of admitting an unrelated qv2
  # proof into it. A run that failed before switch-traffic never touched the
  # customer path and releases; classify-blue-green-lock-release.sh draws that
  # line and is the tested contract.
  #
  # Gated on always() alone, NOT on the acquire job's result: the acquire step
  # writes the SSM parameter and then still has post-steps to run, so a
  # cancellation in that window leaves the lock held by a job whose result is
  # 'cancelled'. Gating on 'success' skipped finalize there and leaked the lock
  # for the full TTL. Reaching the release unconditionally is safe because the
  # vendored helper deletes only after re-reading and matching this run's exact
  # owner token, and no-ops when the lock is absent or owned by anyone else.
  finalize-qurl-live-env-lock:
    name: Finalize qURL Live-Environment Lock
    if: always()
    needs:
      - acquire-qurl-live-env-lock
      - prepare
      - deploy-to-standby
      - switch-traffic
      - validate
      - scale-down-previous
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Classify blue/green terminal state
        id: terminal-state
        env:
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          DEPLOY_RESULT: ${{ needs.deploy-to-standby.result }}
          SWITCH_RESULT: ${{ needs.switch-traffic.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SCALE_DOWN_RESULT: ${{ needs.scale-down-previous.result }}
          DEPLOY_SERVER: ${{ needs.prepare.outputs.deploy_server }}
          DEPLOY_AC: ${{ needs.prepare.outputs.deploy_ac }}
        run: |
          set -euo pipefail
          safe_to_release=$(bash .github/scripts/classify-blue-green-lock-release.sh \
            "$ACTION" "$DRY_RUN" "$PREPARE_RESULT" "$DEPLOY_RESULT" \
            "$SWITCH_RESULT" "$VALIDATE_RESULT" "$SCALE_DOWN_RESULT" \
            "$DEPLOY_SERVER" "$DEPLOY_AC")

          echo "safe_to_release=$safe_to_release" >> "$GITHUB_OUTPUT"
          echo "Blue/green terminal state: action=$ACTION prepare=$PREPARE_RESULT deploy=$DEPLOY_RESULT switch=$SWITCH_RESULT validate=$VALIDATE_RESULT scale-down=$SCALE_DOWN_RESULT deploy-server=$DEPLOY_SERVER deploy-ac=$DEPLOY_AC safe-to-release=$safe_to_release"

      - name: Release sandbox live-environment lock
        if: steps.terminal-state.outputs.safe_to_release == 'true'
        uses: ./.github/actions/sandbox-live-env-lock
        with:
          action: release
          owner: nhp:${{ github.run_id }}:${{ github.run_attempt }}:blue-green
          ssm-parameter-name: /layerv-nhp-sandbox/qurl-live-env-lock
          aws-region: ${{ env.AWS_REGION }}
          ttl-seconds: '14400'
          wait-seconds: '7200'

      - name: Retain sandbox live-environment lock after blue/green failure
        if: always() && steps.terminal-state.outputs.safe_to_release != 'true'
        run: |
          echo "::error title=Sandbox blue/green failed - lock retained::Not releasing /layerv-nhp-sandbox/qurl-live-env-lock because the blue/green deployment did not reach a verified terminal state. Reconcile the server and AC colors, instance refreshes, listeners, and readiness before exact-owner release; follow docs/runbooks/sandbox-live-env-lock.md."
          bash .github/scripts/emit-sandbox-lock-failure-metric.sh RollFailedRetained release
          exit 1

  # =============================================================================
  # NOTIFY - Send deployment notification to SNS (Slack via AWS Chatbot)
  # =============================================================================
  #
  # Gated to main because the OIDC role's trust policy scopes
  # sts:AssumeRoleWithWebIdentity to refs/heads/main. Notify publishes
  # to the shared deploy-signal Slack channel — feature-branch
  # dispatches shouldn't post there.
  notify:
    name: Notify
    if: always() && github.ref == 'refs/heads/main'
    needs: [prepare, deploy-to-standby, switch-traffic, scale-down-previous, validate, finalize-qurl-live-env-lock]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deployment notification
        env:
          ENVIRONMENT: ${{ env.INFRA_ENVIRONMENT }}
          COMPONENT: ${{ inputs.component }}
          ACTION: ${{ inputs.action }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          DEPLOY_RESULT: ${{ needs.deploy-to-standby.result }}
          SWITCH_RESULT: ${{ needs.switch-traffic.result }}
          SCALEDOWN_RESULT: ${{ needs.scale-down-previous.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LOCK_RESULT: ${{ needs.finalize-qurl-live-env-lock.result }}
          SERVER_ACTIVE_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          AC_ACTIVE_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Read SNS topic ARN from SSM
          SNS_ARN=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/monitoring/sns-topic-arn" \
            --query 'Parameter.Value' --output text 2>/dev/null) || SNS_ARN=""

          if [ -z "$SNS_ARN" ] || [[ ! "$SNS_ARN" =~ ^arn:aws:sns: ]]; then
            echo "No valid SNS topic ARN found at /${ENVIRONMENT}/nhp/monitoring/sns-topic-arn, skipping notification"
            exit 0
          fi

          # Determine overall status
          if [[ "$LOCK_RESULT" != "success" ]]; then
            STATUS="FAILED (sandbox live-environment lock)"
          elif [[ "$VALIDATE_RESULT" == "success" || ("$SWITCH_RESULT" == "success" && "$VALIDATE_RESULT" == "skipped") ]]; then
            STATUS="SUCCESS"
          elif [[ "$PREPARE_RESULT" != "success" ]]; then
            STATUS="FAILED (prepare)"
          elif [[ "$DEPLOY_RESULT" == "failure" ]]; then
            STATUS="FAILED (deploy-to-standby)"
          elif [[ "$SWITCH_RESULT" == "failure" ]]; then
            STATUS="FAILED (switch-traffic)"
          else
            STATUS="FAILED"
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            STATUS="DRY RUN - $STATUS"
          fi

          SUBJECT="Blue/Green Deploy: ${STATUS} - ${COMPONENT} (${ENVIRONMENT})"

          MSG="Blue/Green Deployment Notification"
          MSG+="\n"
          MSG+="\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          MSG+="\n  Status:      ${STATUS}"
          MSG+="\n  Environment: ${ENVIRONMENT}"
          MSG+="\n  Component:   ${COMPONENT}"
          MSG+="\n  Action:      ${ACTION}"
          MSG+="\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ -n "$IMAGE_TAG" ]; then
            MSG+="\n  Image Tag:   ${IMAGE_TAG}"
          fi

          if [ -n "$SERVER_ACTIVE_COLOR" ]; then
            MSG+="\n  Server:      ${SERVER_ACTIVE_COLOR} (active)"
          fi
          if [ -n "$AC_ACTIVE_COLOR" ]; then
            MSG+="\n  AC:          ${AC_ACTIVE_COLOR} (active)"
          fi

          MSG+="\n"
          MSG+="\n┌─ Stage Results ─────────────────"
          MSG+="\n│ Prepare:        $([ "$PREPARE_RESULT" = "success" ] && echo "[OK]" || echo "[FAILED]") ${PREPARE_RESULT}"
          MSG+="\n│ Deploy Standby: $([ "$DEPLOY_RESULT" = "success" ] && echo "[OK]" || [ "$DEPLOY_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${DEPLOY_RESULT}"
          MSG+="\n│ Switch Traffic: $([ "$SWITCH_RESULT" = "success" ] && echo "[OK]" || [ "$SWITCH_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${SWITCH_RESULT}"
          MSG+="\n│ Scale Down:     $([ "$SCALEDOWN_RESULT" = "success" ] && echo "[OK]" || [ "$SCALEDOWN_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${SCALEDOWN_RESULT}"
          MSG+="\n│ Validate:       $([ "$VALIDATE_RESULT" = "success" ] && echo "[OK]" || [ "$VALIDATE_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${VALIDATE_RESULT}"
          MSG+="\n└─────────────────────────────────"

          if [[ "$STATUS" == *"FAILED"* ]]; then
            MSG+="\n"
            MSG+="\n⚠ Recovery:"
            MSG+="\n  • To rollback: re-run with action=rollback"
            MSG+="\n  • Check logs: ${WORKFLOW_URL}"
          fi

          MSG+="\n"
          MSG+="\nTriggered by: ${{ github.actor }}"
          MSG+="\nRun: ${WORKFLOW_URL}"

          aws sns publish \
            --topic-arn "$SNS_ARN" \
            --subject "$SUBJECT" \
            --message "$(echo -e "$MSG")" || echo "::warning::SNS notification failed - check IAM permissions or topic existence"
