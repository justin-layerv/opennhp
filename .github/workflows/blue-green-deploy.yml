name: Blue/Green Deploy

# Blue/Green deployment for NHP Server and/or AC with instant traffic switching
#
# This workflow enables:
# - Deploy new image to standby ASG
# - Instant traffic switch via NLB listener modification (<1 second)
# - Sub-second rollback capability
# - Warm standby (1 instance) for previous color
#
# Prerequisites:
# - enable_blue_green = true (server) or enable_ac_blue_green = true (ac) in terraform.tfvars
# - Green ASG and target groups created via terraform apply

# run-name embeds an optional correlation_id so a parent workflow
# dispatching this one can find its specific run via
# `find-dispatched-run.sh` even if other dispatches land in the same
# time window, or if the run is held by the concurrency group /
# environment approval and reported as status=waiting. Shows up in
# the GitHub UI as the run's title and in `gh run list --json displayTitle`.
run-name: "Blue/Green ${{ inputs.environment }} ${{ inputs.component }} ${{ inputs.action }}${{ inputs.correlation_id && format(' [corr:{0}]', inputs.correlation_id) || '' }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'sandbox'
        type: choice
        options:
          - sandbox
      component:
        description: 'Component to deploy'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - ac
          - both
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy      # Deploy new image to standby, switch traffic
          - rollback    # Switch traffic back to previous color
          - switch-only # Just switch traffic (no image update)
      image_tag:
        description: 'Image tag to deploy (required for deploy action)'
        required: false
        type: string
      skip_validation:
        description: 'Skip post-switch validation'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run mode - show what would be done without executing'
        required: false
        default: false
        type: boolean
      refresh_timeout_minutes:
        description: 'Instance refresh timeout in minutes (5-60, default: 15)'
        required: false
        # 3-instance refresh with per-instance warmup consistently takes
        # 9-10 minutes in sandbox (one-at-a-time replacement + warmup +
        # health-check grace). A 10-minute deadline was tipping over by
        # 1 second, so CI marked the step failed even though the refresh
        # itself was healthy and completed seconds later. 15 minutes
        # gives a ~5-minute safety margin without bloating deploy time
        # for the happy path.
        default: 15
        type: number
      health_check_timeout_minutes:
        description: 'Target group health check timeout in minutes (2-30, default: 5)'
        required: false
        default: 5
        type: number
      correlation_id:
        description: 'Optional unique ID set by the parent dispatcher so it can reliably find this run (see find-dispatched-run.sh).'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

# Serialize ALL blue/green deploys per environment. Using environment-only
# concurrency ensures component=both conflicts with component=server and
# component=ac, preventing dangerous overlapping deploys (see #340).
concurrency:
  group: blue-green-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  # =============================================================================
  # PREPARE - Read SSM state and determine active/standby colors
  # =============================================================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    outputs:
      # Server outputs
      server_active_color: ${{ steps.server-state.outputs.active_color }}
      server_standby_color: ${{ steps.server-state.outputs.standby_color }}
      server_active_asg: ${{ steps.server-state.outputs.active_asg }}
      server_standby_asg: ${{ steps.server-state.outputs.standby_asg }}
      server_active_image_tag: ${{ steps.server-state.outputs.active_image_tag }}
      server_standby_image_tag: ${{ steps.server-state.outputs.standby_image_tag }}
      server_primary_listener_arn: ${{ steps.server-state.outputs.primary_listener_arn }}
      server_blue_primary_tg_arn: ${{ steps.server-state.outputs.blue_primary_tg_arn }}
      server_green_primary_tg_arn: ${{ steps.server-state.outputs.green_primary_tg_arn }}
      server_secondary_listener_arn: ${{ steps.server-state.outputs.secondary_listener_arn }}
      server_blue_secondary_tg_arn: ${{ steps.server-state.outputs.blue_secondary_tg_arn }}
      server_green_secondary_tg_arn: ${{ steps.server-state.outputs.green_secondary_tg_arn }}
      server_target_image_tag: ${{ steps.validate.outputs.server_target_image_tag }}
      # AC outputs
      ac_active_color: ${{ steps.ac-state.outputs.active_color }}
      ac_standby_color: ${{ steps.ac-state.outputs.standby_color }}
      ac_active_asg: ${{ steps.ac-state.outputs.active_asg }}
      ac_standby_asg: ${{ steps.ac-state.outputs.standby_asg }}
      ac_active_image_tag: ${{ steps.ac-state.outputs.active_image_tag }}
      ac_standby_image_tag: ${{ steps.ac-state.outputs.standby_image_tag }}
      ac_primary_listener_arn: ${{ steps.ac-state.outputs.primary_listener_arn }}
      ac_blue_primary_tg_arn: ${{ steps.ac-state.outputs.blue_primary_tg_arn }}
      ac_green_primary_tg_arn: ${{ steps.ac-state.outputs.green_primary_tg_arn }}
      ac_target_image_tag: ${{ steps.validate.outputs.ac_target_image_tag }}
      # Flags - reconciled after SSM state reads (handles component=both with only one enabled)
      deploy_server: ${{ steps.reconcile.outputs.deploy_server }}
      deploy_ac: ${{ steps.reconcile.outputs.deploy_ac }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Components
        id: components
        run: |
          COMPONENT="${{ inputs.component }}"
          if [[ "$COMPONENT" == "server" || "$COMPONENT" == "both" ]]; then
            echo "deploy_server=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_server=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$COMPONENT" == "ac" || "$COMPONENT" == "both" ]]; then
            echo "deploy_ac=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_ac=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Server SSM State
        id: server-state
        if: steps.components.outputs.deploy_server == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
        run: |
          SSM_BASE="/${ENVIRONMENT}/nhp/server"
          echo "Reading server blue/green state from SSM..."

          # Read active color
          ACTIVE_COLOR=$(aws ssm get-parameter \
            --name "${SSM_BASE}/active-color" \
            --query "Parameter.Value" --output text 2>/dev/null) || ACTIVE_COLOR=""

          if [[ -z "$ACTIVE_COLOR" ]]; then
            if [[ "$COMPONENT" == "both" ]]; then
              echo "::warning::Server blue/green not enabled - skipping server deployment"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "::error::Server blue/green not enabled - SSM parameter ${SSM_BASE}/active-color not found"
              echo "Run 'terraform apply' with enable_blue_green=true first"
              exit 1
            fi
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          echo "Server active color: $ACTIVE_COLOR"
          echo "active_color=$ACTIVE_COLOR" >> "$GITHUB_OUTPUT"

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "standby_color=green" >> "$GITHUB_OUTPUT"
          else
            echo "standby_color=blue" >> "$GITHUB_OUTPUT"
          fi

          # Read ASG names
          BLUE_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/asg-name" \
            --query "Parameter.Value" --output text)
          GREEN_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-asg-name" \
            --query "Parameter.Value" --output text)

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_asg=$BLUE_ASG" >> "$GITHUB_OUTPUT"
            echo "standby_asg=$GREEN_ASG" >> "$GITHUB_OUTPUT"
          else
            echo "active_asg=$GREEN_ASG" >> "$GITHUB_OUTPUT"
            echo "standby_asg=$BLUE_ASG" >> "$GITHUB_OUTPUT"
          fi

          # Read current image tags
          BLUE_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || BLUE_TAG="unknown"
          GREEN_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || GREEN_TAG="unknown"

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_image_tag=$BLUE_TAG" >> "$GITHUB_OUTPUT"
            echo "standby_image_tag=$GREEN_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "active_image_tag=$GREEN_TAG" >> "$GITHUB_OUTPUT"
            echo "standby_image_tag=$BLUE_TAG" >> "$GITHUB_OUTPUT"
          fi

          # Server listeners: primary=UDP, secondary=HTTPS (optional)
          {
            echo "primary_listener_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/udp-listener-arn" \
              --query "Parameter.Value" --output text)"
            echo "blue_primary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/blue-udp-tg-arn" \
              --query "Parameter.Value" --output text)"
            echo "green_primary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/green-udp-tg-arn" \
              --query "Parameter.Value" --output text)"
          } >> "$GITHUB_OUTPUT"

          # HTTPS listener/TGs are optional (only exist if QURL resolve endpoint is enabled)
          HTTPS_LISTENER=$(aws ssm get-parameter \
            --name "${SSM_BASE}/https-listener-arn" \
            --query "Parameter.Value" --output text 2>/dev/null) || HTTPS_LISTENER=""
          echo "secondary_listener_arn=$HTTPS_LISTENER" >> "$GITHUB_OUTPUT"

          if [[ -n "$HTTPS_LISTENER" ]]; then
            echo "blue_secondary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/blue-https-tg-arn" \
              --query "Parameter.Value" --output text)" >> "$GITHUB_OUTPUT"

            echo "green_secondary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/green-https-tg-arn" \
              --query "Parameter.Value" --output text)" >> "$GITHUB_OUTPUT"
          fi

      - name: Read AC SSM State
        id: ac-state
        if: steps.components.outputs.deploy_ac == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
        run: |
          SSM_BASE="/${ENVIRONMENT}/nhp/ac"
          echo "Reading AC blue/green state from SSM..."

          # Read active color
          ACTIVE_COLOR=$(aws ssm get-parameter \
            --name "${SSM_BASE}/active-color" \
            --query "Parameter.Value" --output text 2>/dev/null) || ACTIVE_COLOR=""

          if [[ -z "$ACTIVE_COLOR" ]]; then
            if [[ "$COMPONENT" == "both" ]]; then
              echo "::warning::AC blue/green not enabled - skipping AC deployment"
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "::error::AC blue/green not enabled - SSM parameter ${SSM_BASE}/active-color not found"
              echo "Run 'terraform apply' with enable_ac_blue_green=true first"
              exit 1
            fi
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          echo "AC active color: $ACTIVE_COLOR"
          echo "active_color=$ACTIVE_COLOR" >> "$GITHUB_OUTPUT"

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "standby_color=green" >> "$GITHUB_OUTPUT"
          else
            echo "standby_color=blue" >> "$GITHUB_OUTPUT"
          fi

          # Read ASG names
          BLUE_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/asg-name" \
            --query "Parameter.Value" --output text)
          GREEN_ASG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-asg-name" \
            --query "Parameter.Value" --output text)

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_asg=$BLUE_ASG" >> "$GITHUB_OUTPUT"
            echo "standby_asg=$GREEN_ASG" >> "$GITHUB_OUTPUT"
          else
            echo "active_asg=$GREEN_ASG" >> "$GITHUB_OUTPUT"
            echo "standby_asg=$BLUE_ASG" >> "$GITHUB_OUTPUT"
          fi

          # Read current image tags
          BLUE_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || BLUE_TAG="unknown"
          GREEN_TAG=$(aws ssm get-parameter \
            --name "${SSM_BASE}/green-image-tag" \
            --query "Parameter.Value" --output text 2>/dev/null) || GREEN_TAG="unknown"

          if [[ "$ACTIVE_COLOR" == "blue" ]]; then
            echo "active_image_tag=$BLUE_TAG" >> "$GITHUB_OUTPUT"
            echo "standby_image_tag=$GREEN_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "active_image_tag=$GREEN_TAG" >> "$GITHUB_OUTPUT"
            echo "standby_image_tag=$BLUE_TAG" >> "$GITHUB_OUTPUT"
          fi

          # AC listeners: primary=TCP only (no secondary)
          {
            echo "primary_listener_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/tcp-listener-arn" \
              --query "Parameter.Value" --output text)"
            echo "blue_primary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/blue-tcp-tg-arn" \
              --query "Parameter.Value" --output text)"
            echo "green_primary_tg_arn=$(aws ssm get-parameter \
              --name "${SSM_BASE}/green-tcp-tg-arn" \
              --query "Parameter.Value" --output text)"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile Component Flags
        id: reconcile
        run: |
          # When component=both, a component may not have blue/green enabled.
          # Downgrade deploy flags based on actual SSM state availability.
          WANT_SERVER="${{ steps.components.outputs.deploy_server }}"
          WANT_AC="${{ steps.components.outputs.deploy_ac }}"
          SERVER_ENABLED="${{ steps.server-state.outputs.enabled }}"
          AC_ENABLED="${{ steps.ac-state.outputs.enabled }}"

          # If we wanted to deploy but SSM state wasn't found, downgrade
          FINAL_SERVER="$WANT_SERVER"
          FINAL_AC="$WANT_AC"

          if [[ "$WANT_SERVER" == "true" && "$SERVER_ENABLED" == "false" ]]; then
            FINAL_SERVER="false"
            echo "::warning::Server blue/green not available, excluding from deployment"
          fi

          if [[ "$WANT_AC" == "true" && "$AC_ENABLED" == "false" ]]; then
            FINAL_AC="false"
            echo "::warning::AC blue/green not available, excluding from deployment"
          fi

          # Fail if neither component is deployable
          if [[ "$FINAL_SERVER" != "true" && "$FINAL_AC" != "true" ]]; then
            echo "::error::No components available for blue/green deployment"
            exit 1
          fi

          echo "deploy_server=$FINAL_SERVER" >> "$GITHUB_OUTPUT"
          echo "deploy_ac=$FINAL_AC" >> "$GITHUB_OUTPUT"

      - name: Validate Inputs
        id: validate
        env:
          ACTION: ${{ inputs.action }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_SERVER: ${{ steps.reconcile.outputs.deploy_server }}
          DEPLOY_AC: ${{ steps.reconcile.outputs.deploy_ac }}
          SERVER_ACTIVE_TAG: ${{ steps.server-state.outputs.active_image_tag }}
          SERVER_STANDBY_TAG: ${{ steps.server-state.outputs.standby_image_tag }}
          AC_ACTIVE_TAG: ${{ steps.ac-state.outputs.active_image_tag }}
          AC_STANDBY_TAG: ${{ steps.ac-state.outputs.standby_image_tag }}
          REFRESH_TIMEOUT: ${{ inputs.refresh_timeout_minutes }}
          HEALTH_TIMEOUT: ${{ inputs.health_check_timeout_minutes }}
        run: |
          # Validate timeout bounds
          if [[ "$REFRESH_TIMEOUT" -lt 5 || "$REFRESH_TIMEOUT" -gt 60 ]]; then
            echo "::error::refresh_timeout_minutes must be between 5 and 60 (got: $REFRESH_TIMEOUT)"
            exit 1
          fi
          if [[ "$HEALTH_TIMEOUT" -lt 2 || "$HEALTH_TIMEOUT" -gt 30 ]]; then
            echo "::error::health_check_timeout_minutes must be between 2 and 30 (got: $HEALTH_TIMEOUT)"
            exit 1
          fi

          if [[ "$ACTION" == "deploy" ]]; then
            if [[ -z "$IMAGE_TAG" ]]; then
              echo "::error::image_tag is required for deploy action"
              exit 1
            fi
            # Server validation
            if [[ "$DEPLOY_SERVER" == "true" ]]; then
              if [[ "$IMAGE_TAG" == "$SERVER_ACTIVE_TAG" ]]; then
                echo "::warning::Server: Deploying same image tag ($IMAGE_TAG) that is already active."
              fi
              echo "server_target_image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            fi
            # AC validation
            if [[ "$DEPLOY_AC" == "true" ]]; then
              if [[ "$IMAGE_TAG" == "$AC_ACTIVE_TAG" ]]; then
                echo "::warning::AC: Deploying same image tag ($IMAGE_TAG) that is already active."
              fi
              echo "ac_target_image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$ACTION" == "rollback" || "$ACTION" == "switch-only" ]]; then
            # Server
            if [[ "$DEPLOY_SERVER" == "true" ]]; then
              if [[ "$SERVER_STANDBY_TAG" == "unknown" || -z "$SERVER_STANDBY_TAG" ]]; then
                echo "::error::Cannot $ACTION server: standby image tag is unknown"
                echo "::error::Use 'deploy' action with an image_tag to initialize the standby first."
                exit 1
              fi
              echo "server_target_image_tag=$SERVER_STANDBY_TAG" >> "$GITHUB_OUTPUT"
            fi
            # AC
            if [[ "$DEPLOY_AC" == "true" ]]; then
              if [[ "$AC_STANDBY_TAG" == "unknown" || -z "$AC_STANDBY_TAG" ]]; then
                echo "::error::Cannot $ACTION AC: standby image tag is unknown"
                echo "::error::Use 'deploy' action with an image_tag to initialize the standby first."
                exit 1
              fi
              echo "ac_target_image_tag=$AC_STANDBY_TAG" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Summary
        env:
          ACTION: ${{ inputs.action }}
          COMPONENT: ${{ inputs.component }}
          DEPLOY_SERVER: ${{ steps.reconcile.outputs.deploy_server }}
          DEPLOY_AC: ${{ steps.reconcile.outputs.deploy_ac }}
          SERVER_ACTIVE_COLOR: ${{ steps.server-state.outputs.active_color }}
          SERVER_STANDBY_COLOR: ${{ steps.server-state.outputs.standby_color }}
          SERVER_ACTIVE_TAG: ${{ steps.server-state.outputs.active_image_tag }}
          SERVER_TARGET_TAG: ${{ steps.validate.outputs.server_target_image_tag }}
          AC_ACTIVE_COLOR: ${{ steps.ac-state.outputs.active_color }}
          AC_STANDBY_COLOR: ${{ steps.ac-state.outputs.standby_color }}
          AC_ACTIVE_TAG: ${{ steps.ac-state.outputs.active_image_tag }}
          AC_TARGET_TAG: ${{ steps.validate.outputs.ac_target_image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Blue/Green State"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DRY_RUN" == "true" ]]; then
            {
              echo "> **DRY RUN MODE** - No changes will be made"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Action | $ACTION |"
            echo "| Component | $COMPONENT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            {
              echo ""
              echo "### Server"
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| Active Color | **$SERVER_ACTIVE_COLOR** |"
              echo "| Standby Color | $SERVER_STANDBY_COLOR |"
              echo "| Active Image | \`$SERVER_ACTIVE_TAG\` |"
              echo "| Target Image | \`$SERVER_TARGET_TAG\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            {
              echo ""
              echo "### AC"
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| Active Color | **$AC_ACTIVE_COLOR** |"
              echo "| Standby Color | $AC_STANDBY_COLOR |"
              echo "| Active Image | \`$AC_ACTIVE_TAG\` |"
              echo "| Target Image | \`$AC_TARGET_TAG\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # =============================================================================
  # DEPLOY TO STANDBY - Update standby ASG with new image
  # =============================================================================
  deploy-to-standby:
    name: Deploy to Standby
    needs: prepare
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Server and AC instance refreshes run in parallel when component=both.
    # Per-component timeout: refresh (max 60m) + health check (max 30m) + buffer (5m) = 95m.
    timeout-minutes: 95
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---- Server Deploy Steps ----
      - name: "[Server] Validate Image Exists in ECR"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          REPO_NAME=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/server/ecr-repo-name" \
            --query "Parameter.Value" --output text 2>/dev/null) || REPO_NAME=""
          if [[ -z "$REPO_NAME" ]]; then
            REPO_NAME="layerv/nhp-server"
            echo "::warning::SSM parameter /${ENVIRONMENT}/nhp/server/ecr-repo-name not found, using default: $REPO_NAME"
          fi
          echo "Verifying image $REPO_NAME:$IMAGE_TAG exists in ECR..."
          if ! aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query "imageDetails[0].imageTags" \
            --output text > /dev/null 2>&1; then
            echo "::error::Image $REPO_NAME:$IMAGE_TAG not found in ECR"
            exit 1
          fi
          echo "Image verified: $REPO_NAME:$IMAGE_TAG exists"

      - name: "[Server] Update Standby Image Tag"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          IMAGE_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$STANDBY_COLOR" == "green" ]]; then
            SSM_PARAM="/${ENVIRONMENT}/nhp/server/green-image-tag"
          else
            SSM_PARAM="/${ENVIRONMENT}/nhp/server/image-tag"
          fi
          echo "Updating $SSM_PARAM to $IMAGE_TAG"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would update SSM parameter: $SSM_PARAM = $IMAGE_TAG"
          else
            aws ssm put-parameter --name "$SSM_PARAM" --value "$IMAGE_TAG" --type String --overwrite
          fi

      - name: "[Server] Scale Up Standby ASG"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          STANDBY_ASG: ${{ needs.prepare.outputs.server_standby_asg }}
          ACTIVE_ASG: ${{ needs.prepare.outputs.server_active_asg }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ACTIVE_CAPACITY=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ACTIVE_ASG" \
            --query "AutoScalingGroups[0].DesiredCapacity" --output text)
          echo "Server active ASG capacity: $ACTIVE_CAPACITY"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would scale $STANDBY_ASG to min=$ACTIVE_CAPACITY, desired=$ACTIVE_CAPACITY"
          else
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$STANDBY_ASG" \
              --min-size "$ACTIVE_CAPACITY" --desired-capacity "$ACTIVE_CAPACITY"
          fi

      # ---- AC Setup Steps (moved before refresh to enable parallel refresh) ----
      - name: "[AC] Validate Image Exists in ECR"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          REPO_NAME=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/ac/ecr-repo-name" \
            --query "Parameter.Value" --output text 2>/dev/null) || REPO_NAME=""
          if [[ -z "$REPO_NAME" ]]; then
            REPO_NAME="layerv/nhp-ac"
            echo "::warning::SSM parameter /${ENVIRONMENT}/nhp/ac/ecr-repo-name not found, using default: $REPO_NAME"
          fi
          echo "Verifying image $REPO_NAME:$IMAGE_TAG exists in ECR..."
          if ! aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query "imageDetails[0].imageTags" \
            --output text > /dev/null 2>&1; then
            echo "::error::Image $REPO_NAME:$IMAGE_TAG not found in ECR"
            exit 1
          fi
          echo "Image verified: $REPO_NAME:$IMAGE_TAG exists"

      - name: "[AC] Update Standby Image Tag"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STANDBY_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          IMAGE_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$STANDBY_COLOR" == "green" ]]; then
            SSM_PARAM="/${ENVIRONMENT}/nhp/ac/green-image-tag"
          else
            SSM_PARAM="/${ENVIRONMENT}/nhp/ac/image-tag"
          fi
          echo "Updating $SSM_PARAM to $IMAGE_TAG"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would update SSM parameter: $SSM_PARAM = $IMAGE_TAG"
          else
            aws ssm put-parameter --name "$SSM_PARAM" --value "$IMAGE_TAG" --type String --overwrite
          fi

      - name: "[AC] Scale Up Standby ASG"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          STANDBY_ASG: ${{ needs.prepare.outputs.ac_standby_asg }}
          ACTIVE_ASG: ${{ needs.prepare.outputs.ac_active_asg }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ACTIVE_CAPACITY=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ACTIVE_ASG" \
            --query "AutoScalingGroups[0].DesiredCapacity" --output text)
          echo "AC active ASG capacity: $ACTIVE_CAPACITY"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would scale $STANDBY_ASG to min=$ACTIVE_CAPACITY, desired=$ACTIVE_CAPACITY"
          else
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$STANDBY_ASG" \
              --min-size "$ACTIVE_CAPACITY" --desired-capacity "$ACTIVE_CAPACITY"
          fi

      # ---- Parallel Instance Refresh ----
      # Server and AC standby refreshes run in parallel because neither
      # serves traffic during refresh. AC standby instances connect to the
      # ACTIVE server (not the standby being refreshed), so there is no
      # ordering dependency between the two refreshes.
      - name: "[Parallel] Instance Refresh on Standby (Server + AC)"
        if: (needs.prepare.outputs.deploy_server == 'true' || needs.prepare.outputs.deploy_ac == 'true') && inputs.dry_run != true
        env:
          SERVER_STANDBY_ASG: ${{ needs.prepare.outputs.server_standby_asg }}
          AC_STANDBY_ASG: ${{ needs.prepare.outputs.ac_standby_asg }}
          DEPLOY_SERVER: ${{ needs.prepare.outputs.deploy_server }}
          DEPLOY_AC: ${{ needs.prepare.outputs.deploy_ac }}
          REFRESH_TIMEOUT_MINUTES: ${{ inputs.refresh_timeout_minutes }}
        run: |
          set -euo pipefail

          start_refresh() {
            local asg=$1 label=$2
            echo "Starting instance refresh on $label standby ASG: $asg" >&2
            EXISTING=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$asg" \
              --query "InstanceRefreshes[?Status=='InProgress' || Status=='Pending'].InstanceRefreshId" \
              --output text 2>/dev/null) || true
            if [[ -n "$EXISTING" ]]; then
              echo "Cancelling existing refresh on $asg: $EXISTING" >&2
              aws autoscaling cancel-instance-refresh --auto-scaling-group-name "$asg" || true
              sleep 10
            fi
            aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$asg" \
              --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60, "SkipMatching": false}' \
              --query "InstanceRefreshId" --output text
          }

          poll_refresh() {
            local asg=$1 refresh_id=$2 label=$3 deadline=$4
            local iteration=0
            while [[ $(date +%s) -lt $deadline ]]; do
              iteration=$((iteration + 1))
              remaining=$(( (deadline - $(date +%s)) / 60 ))
              status=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$asg" \
                --instance-refresh-ids "$refresh_id" \
                --query "InstanceRefreshes[0].Status" --output text)
              echo "[$label] [iter $iteration, ${remaining}m remaining] Refresh status: $status"
              case "$status" in
                Successful) echo "$label instance refresh completed successfully"; return 0 ;;
                Failed|Cancelled) echo "::error::$label instance refresh $status"; return 1 ;;
                *) sleep 10 ;;
              esac
            done
            echo "::error::$label instance refresh timed out after ${REFRESH_TIMEOUT_MINUTES} minutes"
            return 1
          }

          DEADLINE=$(($(date +%s) + REFRESH_TIMEOUT_MINUTES * 60))
          echo "Starting parallel refresh: server=$DEPLOY_SERVER ac=$DEPLOY_AC"

          # Start refreshes
          SERVER_REFRESH_ID=""
          AC_REFRESH_ID=""
          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            SERVER_REFRESH_ID=$(start_refresh "$SERVER_STANDBY_ASG" "Server")
            echo "Server refresh started: $SERVER_REFRESH_ID" >&2
          fi
          if [[ "$DEPLOY_AC" == "true" ]]; then
            AC_REFRESH_ID=$(start_refresh "$AC_STANDBY_ASG" "AC")
            echo "AC refresh started: $AC_REFRESH_ID" >&2
          fi

          # Poll in parallel using background processes
          SERVER_PID=""
          AC_PID=""
          if [[ -n "$SERVER_REFRESH_ID" ]]; then
            poll_refresh "$SERVER_STANDBY_ASG" "$SERVER_REFRESH_ID" "Server" "$DEADLINE" &
            SERVER_PID=$!
          fi
          if [[ -n "$AC_REFRESH_ID" ]]; then
            poll_refresh "$AC_STANDBY_ASG" "$AC_REFRESH_ID" "AC" "$DEADLINE" &
            AC_PID=$!
          fi

          # Wait for both to complete
          FAILED=false
          if [[ -n "$SERVER_PID" ]]; then
            if ! wait "$SERVER_PID"; then FAILED=true; echo "::error::Server refresh failed"; fi
          fi
          if [[ -n "$AC_PID" ]]; then
            if ! wait "$AC_PID"; then FAILED=true; echo "::error::AC refresh failed"; fi
          fi
          if [[ "$FAILED" == "true" ]]; then exit 1; fi

      # ---- Parallel Standby Health Verification ----
      # Verify newly-refreshed standby instances via SSM (not NLB target
      # health, which reports "unused" for standby TGs with no listener).
      # Server and AC verifications run in parallel for the same reason
      # as the refresh: neither serves traffic during standby.
      - name: "[Parallel] Verify Standby Health (Server + AC)"
        if: (needs.prepare.outputs.deploy_server == 'true' || needs.prepare.outputs.deploy_ac == 'true') && inputs.dry_run != true
        env:
          SERVER_STANDBY_ASG: ${{ needs.prepare.outputs.server_standby_asg }}
          AC_STANDBY_ASG: ${{ needs.prepare.outputs.ac_standby_asg }}
          DEPLOY_SERVER: ${{ needs.prepare.outputs.deploy_server }}
          DEPLOY_AC: ${{ needs.prepare.outputs.deploy_ac }}
          HEALTH_CHECK_TIMEOUT_MINUTES: ${{ inputs.health_check_timeout_minutes }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/verify-asg-instances-healthy.sh
          FAILED=false
          SERVER_PID=""
          AC_PID=""

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            # nhp-server runs with --net=host, so /health/live is on 127.0.0.1:8888
            .github/scripts/verify-asg-instances-healthy.sh \
              "$SERVER_STANDBY_ASG" "Server-Standby" "$HEALTH_CHECK_TIMEOUT_MINUTES" \
              'curl -sfS -o /dev/null http://127.0.0.1:8888/health/live' &
            SERVER_PID=$!
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            # Traefik admin ping on port 8080
            .github/scripts/verify-asg-instances-healthy.sh \
              "$AC_STANDBY_ASG" "AC-Standby" "$HEALTH_CHECK_TIMEOUT_MINUTES" \
              'curl -sfS -o /dev/null http://127.0.0.1:8080/ping' &
            AC_PID=$!
          fi

          if [[ -n "$SERVER_PID" ]]; then
            if ! wait "$SERVER_PID"; then FAILED=true; echo "::error::Server standby health check failed"; fi
          fi
          if [[ -n "$AC_PID" ]]; then
            if ! wait "$AC_PID"; then FAILED=true; echo "::error::AC standby health check failed"; fi
          fi
          if [[ "$FAILED" == "true" ]]; then exit 1; fi

      # Knock-readiness gate: verify EVERY active server instance reports
      # AC peers connected before switching traffic. During blue/green AC
      # deploy, new AC instances must establish NHP UDP connections to the
      # server. NLB target health only checks TCP — it doesn't verify the
      # NHP UDP registration. Without this gate, traffic can switch to new
      # ACs before some servers have knocked them, causing
      # "failed to find ac connection" errors for QURL resolve requests
      # routed to those servers.
      #
      # We require ALL InService instances in the active server ASG to
      # report healthy because the NLB will round-robin to all of them; if
      # even one server lacks AC peers, requests routed there will fail.
      - name: "[Server] Verify Knock Readiness (AC Peers Connected)"
        if: needs.prepare.outputs.deploy_ac == 'true' && inputs.dry_run != true
        env:
          SERVER_ACTIVE_ASG: ${{ needs.prepare.outputs.server_active_asg }}
          HEALTH_CHECK_TIMEOUT_MINUTES: ${{ inputs.health_check_timeout_minutes }}
        run: |
          set -euo pipefail
          echo "Verifying ALL active server instances see AC peers before switching traffic..."

          # Pull the full set of InService instances; we need quorum, not
          # the first one we find. Sorting by instance id keeps log order
          # stable across re-runs. The `grep -v '^$'` is required because
          # AWS CLI emits a single empty line when the query returns no
          # results — without the filter, mapfile creates a 1-element
          # array containing "" and the count check below would pass with
          # an invalid instance id.
          mapfile -t INSTANCE_IDS < <(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$SERVER_ACTIVE_ASG" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text | tr '\t' '\n' | grep -v '^$' | sort)

          if [[ ${#INSTANCE_IDS[@]} -eq 0 ]]; then
            echo "::error::No InService server instances found in ASG $SERVER_ACTIVE_ASG"
            exit 1
          fi
          echo "Checking knock readiness on ${#INSTANCE_IDS[@]} server instance(s): ${INSTANCE_IDS[*]}"

          # check_one INSTANCE_ID → echoes "ready <detail>"
          #                                  / "not_ready <detail>"
          #                                  / "ssm_failed <detail>"
          # Detail is a short diagnostic string appended to the log line
          # so operators can tell apart "ACs not yet connected" from
          # "curl: (7) Failed to connect" from "ssm send-command:
          # ParamValidation: ..." without digging into logs.
          check_one() {
            local instance_id="$1"
            local cmd_id status output stderr_file captured_err

            # Capture stderr from AWS CLI calls so real errors surface
            # in the log line instead of being swallowed by 2>/dev/null.
            # The hard-to-diagnose half of today's outage was an
            # AWS API-level ParamValidation error on --timeout-seconds
            # that the old code threw away, then misreported as "SSM
            # unreachable" — make that class of bug impossible to hide
            # the next time.
            stderr_file=$(mktemp)

            # --timeout-seconds 30 is the SSM API minimum. 15 is
            # rejected at the AWS API boundary before the command ever
            # reaches the instance.
            #
            # Command: curl on the host (not `docker exec nhp-server
            # wget`). nhp-server runs with --net=host so
            # /health/knock-ready is reachable on 127.0.0.1:8888 from
            # the instance itself, and the container image ships
            # neither wget nor curl. `curl -sS` without -f is
            # deliberate: /health/knock-ready returns 503 with a
            # not-ready-status JSON body when ACs aren't connected,
            # and we want jq below to parse BOTH the 200 and 503
            # bodies so the log line can surface `ac_peers.message`.
            # With -f, curl would exit non-zero on 503 and the
            # `|| echo KNOCK_NOT_READY` fallback would clobber the
            # body we wanted.
            #
            # `2>&1` merges curl's own stderr (e.g. "curl: (7) Failed
            # to connect...") into stdout so the fallback branch below
            # can surface the real reason in the "not_ready" log line.
            if ! cmd_id=$(aws ssm send-command \
                --instance-ids "$instance_id" \
                --document-name "AWS-RunShellScript" \
                --timeout-seconds 30 \
                --parameters 'commands=["curl -sS http://127.0.0.1:8888/health/knock-ready 2>&1 || echo KNOCK_NOT_READY"]' \
                --query "Command.CommandId" --output text 2>"$stderr_file"); then
              captured_err=$(tr '\n' ' ' < "$stderr_file")
              rm -f "$stderr_file"
              # Trim to keep the per-iteration log line readable;
              # the full error is still in the job log if needed.
              echo "ssm_failed send-command: ${captured_err:0:200}"
              return
            fi

            # Wait up to 15s for SSM command completion. Treat any
            # terminal SSM status (Success, Failed, TimedOut, Cancelled)
            # as "stop polling".
            sleep 3
            status="Pending"
            for _ in 1 2 3 4; do
              status=$(aws ssm get-command-invocation \
                --command-id "$cmd_id" --instance-id "$instance_id" \
                --query "Status" --output text 2>"$stderr_file") || status="Pending"
              case "$status" in
                Success|Failed|TimedOut|Cancelled) break ;;
              esac
              sleep 3
            done

            if [[ "$status" != "Success" ]]; then
              captured_err=$(tr '\n' ' ' < "$stderr_file")
              rm -f "$stderr_file"
              if [[ -n "$captured_err" ]]; then
                echo "ssm_failed status=$status: ${captured_err:0:200}"
              else
                echo "ssm_failed status=$status"
              fi
              return
            fi

            output=$(aws ssm get-command-invocation \
              --command-id "$cmd_id" --instance-id "$instance_id" \
              --query "StandardOutputContent" --output text 2>/dev/null) || output=""
            rm -f "$stderr_file"

            # Fast path: the curl wrapper above echoes KNOCK_NOT_READY
            # when curl itself fails (connection refused / timeout /
            # instance not yet listening). `2>&1` on the curl means
            # curl's error message is also in $output, so surface it
            # in the detail string — otherwise a hung deploy shows
            # nothing diagnosable in the log.
            if [[ "$output" == *"KNOCK_NOT_READY"* ]]; then
              local curl_err
              curl_err=$(printf '%s' "$output" \
                | grep -v '^KNOCK_NOT_READY$' \
                | tr '\n' ' ' \
                | head -c 200)
              if [[ -n "$curl_err" ]]; then
                echo "not_ready ${curl_err}"
              else
                echo "not_ready"
              fi
              return
            fi

            # Use jq to parse the ReadinessResponse JSON in a single pass.
            # This is robust to field ordering and (unlike a regex) won't
            # break if a future CheckResult gains nested objects in the
            # Message field. Output is "<status>|<message>" so we can
            # split it with bash parameter expansion below.
            local parsed body_status ac_msg
            parsed=$(echo "$output" | jq -r '"\(.status // "")|\(.checks.ac_peers.message // "no message")"' 2>/dev/null) || parsed=""
            if [[ -z "$parsed" ]]; then
              echo "not_ready"
              return
            fi
            body_status="${parsed%%|*}"
            ac_msg="${parsed#*|}"
            if [[ "$body_status" == "healthy" ]]; then
              echo "ready ${ac_msg}"
              return
            fi
            echo "not_ready ${ac_msg}"
          }

          DEADLINE=$(($(date +%s) + HEALTH_CHECK_TIMEOUT_MINUTES * 60))
          ITERATION=0
          while [[ $(date +%s) -lt $DEADLINE ]]; do
            ITERATION=$((ITERATION + 1))
            REMAINING=$(( (DEADLINE - $(date +%s)) / 60 ))

            ALL_READY=true
            for inst in "${INSTANCE_IDS[@]}"; do
              result=$(check_one "$inst")
              kind="${result%% *}"
              detail="${result#* }"
              [[ "$kind" == "$detail" ]] && detail=""
              case "$kind" in
                ready)
                  echo "[knock-ready] [iter $ITERATION, ${REMAINING}m left] $inst: ready ($detail)"
                  ;;
                not_ready)
                  echo "[knock-ready] [iter $ITERATION, ${REMAINING}m left] $inst: not yet ($detail)"
                  ALL_READY=false
                  ;;
                ssm_failed)
                  # Use the actual failure detail from check_one
                  # instead of the previous hardcoded "SSM unreachable"
                  # message — the latter was actively misleading when
                  # the real failure was a ParamValidation error or a
                  # `docker exec: wget not found` that never reached
                  # the SSM transport at all.
                  if [[ -n "$detail" ]]; then
                    echo "[knock-ready] [iter $ITERATION, ${REMAINING}m left] $inst: SSM failed ($detail), retrying"
                  else
                    echo "[knock-ready] [iter $ITERATION, ${REMAINING}m left] $inst: SSM failed, retrying"
                  fi
                  ALL_READY=false
                  ;;
                *)
                  echo "[knock-ready] [iter $ITERATION, ${REMAINING}m left] $inst: unknown result '$result'"
                  ALL_READY=false
                  ;;
              esac
            done

            if [[ "$ALL_READY" == "true" ]]; then
              echo "[knock-ready] All ${#INSTANCE_IDS[@]} server instance(s) report AC peers connected — proceeding"
              exit 0
            fi
            sleep 10
          done
          echo "::error::[knock-ready] Not all server instances reported AC peers connected after ${HEALTH_CHECK_TIMEOUT_MINUTES} minutes"
          exit 1

      - name: "[Server] Dry Run Notice"
        if: needs.prepare.outputs.deploy_server == 'true' && inputs.dry_run == true
        run: |
          echo "[DRY RUN] [Server] Would start instance refresh and wait for completion"
          echo "[DRY RUN] [Server] Would verify target group health"

      - name: "[AC] Dry Run Notice"
        if: needs.prepare.outputs.deploy_ac == 'true' && inputs.dry_run == true
        run: |
          echo "[DRY RUN] [AC] Would start instance refresh and wait for completion"
          echo "[DRY RUN] [AC] Would verify target group health"
          echo "[DRY RUN] [AC] Would verify server knock readiness (AC peers connected)"

  # =============================================================================
  # SWITCH TRAFFIC - Modify NLB listeners (instant, <1 second)
  # =============================================================================
  switch-traffic:
    name: Switch Traffic
    needs: [prepare, deploy-to-standby]
    if: always() && needs.prepare.result == 'success' && (needs.deploy-to-standby.result == 'success' || needs.deploy-to-standby.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "[Server] Switch NLB Listeners"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          ACTIVE_COLOR: ${{ needs.prepare.outputs.server_active_color }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would switch server traffic to $STANDBY_COLOR"
            exit 0
          fi
          chmod +x .github/scripts/blue-green-switch.sh
          .github/scripts/blue-green-switch.sh "$ENVIRONMENT" "$STANDBY_COLOR" server

      - name: "[AC] Switch NLB Listener"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          ACTIVE_COLOR: ${{ needs.prepare.outputs.ac_active_color }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "[DRY RUN] Would switch AC traffic to $STANDBY_COLOR"
            exit 0
          fi
          chmod +x .github/scripts/blue-green-switch.sh
          .github/scripts/blue-green-switch.sh "$ENVIRONMENT" "$STANDBY_COLOR" ac

  # =============================================================================
  # SCALE DOWN PREVIOUS - Reduce previous active to warm standby
  # =============================================================================
  scale-down-previous:
    name: Scale Down Previous
    needs: [prepare, switch-traffic]
    if: always() && needs.switch-traffic.result == 'success' && inputs.action == 'deploy' && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "[Server] Scale Down Previous Active"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          PREVIOUS_ASG: ${{ needs.prepare.outputs.server_active_asg }}
        run: |
          echo "Scaling down previous server active ASG to warm standby: $PREVIOUS_ASG"
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$PREVIOUS_ASG" \
            --min-size 1 --desired-capacity 1
          echo "Previous server ASG scaled down to 1 instance"

      - name: "[AC] Scale Down Previous Active"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          PREVIOUS_ASG: ${{ needs.prepare.outputs.ac_active_asg }}
        run: |
          echo "Scaling down previous AC active ASG to warm standby: $PREVIOUS_ASG"
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "$PREVIOUS_ASG" \
            --min-size 1 --desired-capacity 1
          echo "Previous AC ASG scaled down to 1 instance"

  # =============================================================================
  # VALIDATE - Post-switch validation
  # =============================================================================
  validate:
    name: Validate
    needs: [prepare, switch-traffic]
    if: always() && needs.switch-traffic.result == 'success' && inputs.skip_validation != true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "[Server] Verify Traffic Switch"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.server_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.server_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.server_blue_primary_tg_arn }}
        run: |
          CURRENT_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$STANDBY_COLOR" == "green" ]]; then EXPECTED_TG="$GREEN_PRIMARY_TG"
          else EXPECTED_TG="$BLUE_PRIMARY_TG"; fi
          if [[ "$CURRENT_TG" == "$EXPECTED_TG" ]]; then
            echo "Server traffic verified: UDP listener pointing to $STANDBY_COLOR target group"
          else
            echo "::error::Server traffic mismatch! Expected $EXPECTED_TG but got $CURRENT_TG"
            exit 1
          fi

      - name: "[Server] Reconcile Listener and SSM State"
        if: needs.prepare.outputs.deploy_server == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.server_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.server_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.server_blue_primary_tg_arn }}
        run: |
          echo "Running server listener/SSM state reconciliation check..."
          SSM_COLOR=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/server/active-color" \
            --query "Parameter.Value" --output text)
          LISTENER_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$LISTENER_TG" == "$BLUE_PRIMARY_TG" ]]; then LISTENER_COLOR="blue"
          elif [[ "$LISTENER_TG" == "$GREEN_PRIMARY_TG" ]]; then LISTENER_COLOR="green"
          else echo "::error::Server listener pointing to unknown TG: $LISTENER_TG"; exit 1; fi
          if [[ "$SSM_COLOR" == "$LISTENER_COLOR" ]]; then
            echo "Server reconciliation passed: SSM ($SSM_COLOR) matches listener ($LISTENER_COLOR)"
          else
            echo "::error::Server state inconsistency! SSM=$SSM_COLOR, listener=$LISTENER_COLOR"
            exit 1
          fi

      - name: "[AC] Verify Traffic Switch"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          STANDBY_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.ac_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.ac_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.ac_blue_primary_tg_arn }}
        run: |
          CURRENT_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$STANDBY_COLOR" == "green" ]]; then EXPECTED_TG="$GREEN_PRIMARY_TG"
          else EXPECTED_TG="$BLUE_PRIMARY_TG"; fi
          if [[ "$CURRENT_TG" == "$EXPECTED_TG" ]]; then
            echo "AC traffic verified: TCP listener pointing to $STANDBY_COLOR target group"
          else
            echo "::error::AC traffic mismatch! Expected $EXPECTED_TG but got $CURRENT_TG"
            exit 1
          fi

      - name: "[AC] Reconcile Listener and SSM State"
        if: needs.prepare.outputs.deploy_ac == 'true'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PRIMARY_LISTENER: ${{ needs.prepare.outputs.ac_primary_listener_arn }}
          GREEN_PRIMARY_TG: ${{ needs.prepare.outputs.ac_green_primary_tg_arn }}
          BLUE_PRIMARY_TG: ${{ needs.prepare.outputs.ac_blue_primary_tg_arn }}
        run: |
          echo "Running AC listener/SSM state reconciliation check..."
          SSM_COLOR=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/ac/active-color" \
            --query "Parameter.Value" --output text)
          LISTENER_TG=$(aws elbv2 describe-listeners \
            --listener-arns "$PRIMARY_LISTENER" \
            --query "Listeners[0].DefaultActions[0].TargetGroupArn" --output text)
          if [[ "$LISTENER_TG" == "$BLUE_PRIMARY_TG" ]]; then LISTENER_COLOR="blue"
          elif [[ "$LISTENER_TG" == "$GREEN_PRIMARY_TG" ]]; then LISTENER_COLOR="green"
          else echo "::error::AC listener pointing to unknown TG: $LISTENER_TG"; exit 1; fi
          if [[ "$SSM_COLOR" == "$LISTENER_COLOR" ]]; then
            echo "AC reconciliation passed: SSM ($SSM_COLOR) matches listener ($LISTENER_COLOR)"
          else
            echo "::error::AC state inconsistency! SSM=$SSM_COLOR, listener=$LISTENER_COLOR"
            exit 1
          fi

      - name: Run Validation Script
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ -f scripts/validate-deployment.sh ]]; then
            chmod +x scripts/validate-deployment.sh
            ./scripts/validate-deployment.sh "$ENVIRONMENT" || {
              echo "::warning::Some validation checks failed"
            }
          else
            echo "No validation script found, skipping"
          fi

      - name: Push Deployment Metric
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
        run: |
          # Push deployment count metric for stale deployment detection
          # Emit with Environment-only dimension for backward compatibility with
          # existing server stale-deployment alarm, plus Environment+Component
          # for per-component tracking
          aws cloudwatch put-metric-data \
            --namespace "NHP/BlueGreen" \
            --metric-name "DeploymentCount" \
            --dimensions "Environment=$ENVIRONMENT" \
            --value 1 \
            --unit Count
          aws cloudwatch put-metric-data \
            --namespace "NHP/BlueGreen" \
            --metric-name "DeploymentCount" \
            --dimensions "Environment=$ENVIRONMENT,Component=$COMPONENT" \
            --value 1 \
            --unit Count
          echo "Deployment metric pushed to CloudWatch (both dimension sets)"

          # Push deployment event for Grafana annotations
          aws cloudwatch put-metric-data \
            --namespace "LayerV/NHP" \
            --metric-name "DeploymentEvent" \
            --dimensions "Environment=$ENVIRONMENT,Component=$COMPONENT,Strategy=blue-green" \
            --value 1 \
            --unit Count
          echo "Deployment event pushed to LayerV/NHP namespace"

      - name: Deployment Summary
        env:
          ACTION: ${{ inputs.action }}
          COMPONENT: ${{ inputs.component }}
          DEPLOY_SERVER: ${{ needs.prepare.outputs.deploy_server }}
          DEPLOY_AC: ${{ needs.prepare.outputs.deploy_ac }}
          SERVER_NEW_ACTIVE: ${{ needs.prepare.outputs.server_standby_color }}
          SERVER_PREVIOUS_ACTIVE: ${{ needs.prepare.outputs.server_active_color }}
          SERVER_NEW_TAG: ${{ needs.prepare.outputs.server_target_image_tag }}
          SERVER_PREVIOUS_TAG: ${{ needs.prepare.outputs.server_active_image_tag }}
          AC_NEW_ACTIVE: ${{ needs.prepare.outputs.ac_standby_color }}
          AC_PREVIOUS_ACTIVE: ${{ needs.prepare.outputs.ac_active_color }}
          AC_NEW_TAG: ${{ needs.prepare.outputs.ac_target_image_tag }}
          AC_PREVIOUS_TAG: ${{ needs.prepare.outputs.ac_active_image_tag }}
        run: |
          {
            echo "## Blue/Green Deployment Complete"
            echo ""
            echo "**Action:** $ACTION | **Component:** $COMPONENT"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DEPLOY_SERVER" == "true" ]]; then
            {
              echo "### Server"
              echo "| Property | Before | After |"
              echo "|----------|--------|-------|"
              echo "| Active Color | $SERVER_PREVIOUS_ACTIVE | **$SERVER_NEW_ACTIVE** |"
              echo "| Active Image | \`$SERVER_PREVIOUS_TAG\` | \`$SERVER_NEW_TAG\` |"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$DEPLOY_AC" == "true" ]]; then
            {
              echo "### AC"
              echo "| Property | Before | After |"
              echo "|----------|--------|-------|"
              echo "| Active Color | $AC_PREVIOUS_ACTIVE | **$AC_NEW_ACTIVE** |"
              echo "| Active Image | \`$AC_PREVIOUS_TAG\` | \`$AC_NEW_TAG\` |"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### Rollback"
            echo "To rollback, run this workflow with:"
            echo "- **action:** \`rollback\`"
            echo "- **component:** \`$COMPONENT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # NOTIFY - Send deployment notification to SNS (Slack via AWS Chatbot)
  # =============================================================================
  notify:
    name: Notify
    if: always()
    needs: [prepare, deploy-to-standby, switch-traffic, scale-down-previous, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deployment notification
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
          ACTION: ${{ inputs.action }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          DEPLOY_RESULT: ${{ needs.deploy-to-standby.result }}
          SWITCH_RESULT: ${{ needs.switch-traffic.result }}
          SCALEDOWN_RESULT: ${{ needs.scale-down-previous.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SERVER_ACTIVE_COLOR: ${{ needs.prepare.outputs.server_standby_color }}
          AC_ACTIVE_COLOR: ${{ needs.prepare.outputs.ac_standby_color }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Read SNS topic ARN from SSM
          SNS_ARN=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/monitoring/sns-topic-arn" \
            --query 'Parameter.Value' --output text 2>/dev/null) || SNS_ARN=""

          if [ -z "$SNS_ARN" ] || [[ ! "$SNS_ARN" =~ ^arn:aws:sns: ]]; then
            echo "No valid SNS topic ARN found at /${ENVIRONMENT}/nhp/monitoring/sns-topic-arn, skipping notification"
            exit 0
          fi

          # Determine overall status
          if [[ "$VALIDATE_RESULT" == "success" || ("$SWITCH_RESULT" == "success" && "$VALIDATE_RESULT" == "skipped") ]]; then
            STATUS="SUCCESS"
          elif [[ "$PREPARE_RESULT" != "success" ]]; then
            STATUS="FAILED (prepare)"
          elif [[ "$DEPLOY_RESULT" == "failure" ]]; then
            STATUS="FAILED (deploy-to-standby)"
          elif [[ "$SWITCH_RESULT" == "failure" ]]; then
            STATUS="FAILED (switch-traffic)"
          else
            STATUS="FAILED"
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            STATUS="DRY RUN - $STATUS"
          fi

          SUBJECT="Blue/Green Deploy: ${STATUS} - ${COMPONENT} (${ENVIRONMENT})"

          MSG="Blue/Green Deployment Notification"
          MSG+="\n"
          MSG+="\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          MSG+="\n  Status:      ${STATUS}"
          MSG+="\n  Environment: ${ENVIRONMENT}"
          MSG+="\n  Component:   ${COMPONENT}"
          MSG+="\n  Action:      ${ACTION}"
          MSG+="\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ -n "$IMAGE_TAG" ]; then
            MSG+="\n  Image Tag:   ${IMAGE_TAG}"
          fi

          if [ -n "$SERVER_ACTIVE_COLOR" ]; then
            MSG+="\n  Server:      ${SERVER_ACTIVE_COLOR} (active)"
          fi
          if [ -n "$AC_ACTIVE_COLOR" ]; then
            MSG+="\n  AC:          ${AC_ACTIVE_COLOR} (active)"
          fi

          MSG+="\n"
          MSG+="\n┌─ Stage Results ─────────────────"
          MSG+="\n│ Prepare:        $([ "$PREPARE_RESULT" = "success" ] && echo "[OK]" || echo "[FAILED]") ${PREPARE_RESULT}"
          MSG+="\n│ Deploy Standby: $([ "$DEPLOY_RESULT" = "success" ] && echo "[OK]" || [ "$DEPLOY_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${DEPLOY_RESULT}"
          MSG+="\n│ Switch Traffic: $([ "$SWITCH_RESULT" = "success" ] && echo "[OK]" || [ "$SWITCH_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${SWITCH_RESULT}"
          MSG+="\n│ Scale Down:     $([ "$SCALEDOWN_RESULT" = "success" ] && echo "[OK]" || [ "$SCALEDOWN_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${SCALEDOWN_RESULT}"
          MSG+="\n│ Validate:       $([ "$VALIDATE_RESULT" = "success" ] && echo "[OK]" || [ "$VALIDATE_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${VALIDATE_RESULT}"
          MSG+="\n└─────────────────────────────────"

          if [[ "$STATUS" == *"FAILED"* ]]; then
            MSG+="\n"
            MSG+="\n⚠ Recovery:"
            MSG+="\n  • To rollback: re-run with action=rollback"
            MSG+="\n  • Check logs: ${WORKFLOW_URL}"
          fi

          MSG+="\n"
          MSG+="\nTriggered by: ${{ github.actor }}"
          MSG+="\nRun: ${WORKFLOW_URL}"

          aws sns publish \
            --topic-arn "$SNS_ARN" \
            --subject "$SUBJECT" \
            --message "$(echo -e "$MSG")" || echo "::warning::SNS notification failed - check IAM permissions or topic existence"
