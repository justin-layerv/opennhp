name: Production Hub DNS Update

# Governed apply path for the isolated prod-hub-dns state. One dispatch builds
# and displays the exact saved plan; plan-and-apply then waits at the existing
# production environment before consuming that same binary plan. The Terraform
# source lock remains the authority for whether any record may exist.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan-and-apply runs the protected saved plan; plan-only renders it and stops'
        required: true
        type: choice
        options:
          - plan-only
          - plan-and-apply
      confirmation:
        description: 'PLAN_PROD_HUB_DNS or APPLY_PROD_HUB_DNS, matching the operation'
        required: true
        default: PLAN_PROD_HUB_DNS
        type: string

# The Hub DNS lookup depends on Control's Hub NLB. Share Control's production
# lane so an NLB transition cannot race DNS planning or application.
concurrency:
  group: deploy-prod-control
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  TF_VERSION: '1.14.3'
  ROOT: terraform/environments/prod-hub-dns
  PLAN_ARTIFACT: prod-hub-dns-plan-${{ github.run_id }}

permissions:
  contents: read

jobs:
  guard:
    name: Require live main and exact confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check dispatch boundary
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Production Hub DNS updates run only from refs/heads/main.'
            exit 1
          fi
          case "$OPERATION" in
            plan-only)
              [[ "$CONFIRMATION" == 'PLAN_PROD_HUB_DNS' ]] || {
                echo '::error::plan-only confirmation must be exactly PLAN_PROD_HUB_DNS.'
                exit 1
              }
              ;;
            plan-and-apply)
              [[ "$CONFIRMATION" == 'APPLY_PROD_HUB_DNS' ]] || {
                echo '::error::plan-and-apply confirmation must be exactly APPLY_PROD_HUB_DNS.'
                exit 1
              }
              [[ "$GITHUB_RUN_ATTEMPT" == '1' ]] || {
                echo '::error::Apply reruns are forbidden; dispatch a fresh run and review a fresh plan.'
                exit 1
              }
              ;;
            *)
              echo '::error::Unknown operation.'
              exit 1
              ;;
          esac

  plan:
    name: Plan exact production Hub alias
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      plan_sha256: ${{ steps.metadata.outputs.plan_sha256 }}
      planned_at_epoch: ${{ steps.metadata.outputs.planned_at_epoch }}
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Re-read live main before AWS access
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-live-main-ref.sh "$GITHUB_SHA"

      - name: Prove checkout credentials are absent before Terraform
        run: scripts/check-no-checkout-credentials.sh

      - name: Configure narrowly scoped production planning session
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          role-session-name: prod-hub-dns-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"StateBucketLocation","Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":"arn:aws:s3:::layerv-terraform-state-235500187906"},{"Sid":"StatePrefixList","Effect":"Allow","Action":["s3:ListBucket"],"Resource":"arn:aws:s3:::layerv-terraform-state-235500187906","Condition":{"StringLike":{"s3:prefix":["nhp/prod-hub-dns/*","env:/","env:/*/nhp/prod-hub-dns/*"]}}},{"Sid":"StateObjectRead","Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::layerv-terraform-state-235500187906/nhp/prod-hub-dns/terraform.tfstate","arn:aws:s3:::layerv-terraform-state-235500187906/nhp/prod-hub-dns/terraform.tfstate.tflock"]},{"Sid":"StateKmsRead","Effect":"Allow","Action":["kms:Decrypt","kms:DescribeKey"],"Resource":"arn:aws:kms:us-east-2:235500187906:key/00a0e673-cef4-41f0-bfc0-5116a9ab3aa0"},{"Sid":"CallerIdentity","Effect":"Allow","Action":["sts:GetCallerIdentity"],"Resource":"*"},{"Sid":"HubNlbRead","Effect":"Allow","Action":["elasticloadbalancing:DescribeLoadBalancers","elasticloadbalancing:DescribeLoadBalancerAttributes","elasticloadbalancing:DescribeTags"],"Resource":"*"},{"Sid":"ManagementDnsAssume","Effect":"Allow","Action":["sts:AssumeRole"],"Resource":"arn:aws:iam::165115313779:role/nhp-ac-route53-access"}]}

      - name: Prove exact production planning identity
        run: scripts/check-control-aws-identity.sh prod "prod-hub-dns-plan-${GITHUB_RUN_ID}"

      - name: Initialize isolated production Hub DNS state
        working-directory: ${{ env.ROOT }}
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          terraform init -reconfigure -input=false -lockfile=readonly

      - name: Build and check saved plan
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          rm -f tfplan tfplan.json tfplan.txt
          # The plan session is read-only for state. Workflow concurrency
          # excludes the only governed writer, and Terraform binds the binary
          # plan to the state lineage/serial that apply later re-checks.
          terraform plan -input=false -lock=false -no-color -out=tfplan | tee tfplan.txt
          terraform show -json tfplan >tfplan.json
          ../../../scripts/check-prod-hub-dns-plan.py tfplan.json

      - name: Record immutable plan metadata
        id: metadata
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          commit_sha=$(git rev-parse HEAD)
          [[ "$commit_sha" == "${{ github.sha }}" ]] || {
            echo '::error::Checkout SHA drifted.'
            exit 1
          }
          plan_sha256=$(sha256sum tfplan | awk '{print $1}')
          planned_at_epoch=$(date -u +%s)
          printf '%s\n' "$commit_sha" >commit-sha.txt
          printf '%s  %s\n' "$plan_sha256" tfplan >tfplan.sha256
          printf '%s\n' "$planned_at_epoch" >planned-at-epoch.txt
          {
            echo "commit_sha=$commit_sha"
            echo "plan_sha256=$plan_sha256"
            echo "planned_at_epoch=$planned_at_epoch"
          } >>"$GITHUB_OUTPUT"

      - name: Upload immutable saved plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: |
            terraform/environments/prod-hub-dns/tfplan
            terraform/environments/prod-hub-dns/tfplan.json
            terraform/environments/prod-hub-dns/tfplan.txt
            terraform/environments/prod-hub-dns/tfplan.sha256
            terraform/environments/prod-hub-dns/commit-sha.txt
            terraform/environments/prod-hub-dns/planned-at-epoch.txt
          retention-days: 3
          if-no-files-found: error

      - name: Summarize protected plan
        working-directory: ${{ env.ROOT }}
        run: |
          {
            echo '## Production Hub DNS saved plan'
            echo
            echo "- Commit: \`${{ steps.metadata.outputs.commit_sha }}\`"
            echo "- Plan SHA-256: \`${{ steps.metadata.outputs.plan_sha256 }}\`"
            echo
            echo '```terraform'
            head -c 60000 tfplan.txt
            echo '```'
            echo
            echo '> plan-and-apply waits for production approval and consumes this exact plan within two days. If main or live state advances, dispatch a fresh run.'
          } >>"$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply exact production Hub DNS plan
    if: inputs.operation == 'plan-and-apply'
    needs: [guard, plan]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Forbid replaying the apply job
        run: |
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]] || {
            echo '::error::Apply reruns are forbidden; dispatch a fresh run and review a fresh plan.'
            exit 1
          }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Cache Terraform plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-

      - name: Re-read live main before AWS access
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-live-main-ref.sh "${{ needs.plan.outputs.commit_sha }}"

      - name: Enforce two-day approval window
        env:
          PLANNED_AT_EPOCH: ${{ needs.plan.outputs.planned_at_epoch }}
        run: |
          set -euo pipefail
          [[ "$PLANNED_AT_EPOCH" =~ ^[0-9]+$ ]] || {
            echo '::error::Saved plan creation time is malformed.'
            exit 1
          }
          now_epoch=$(date -u +%s)
          plan_age_seconds=$((now_epoch - PLANNED_AT_EPOCH))
          if ((plan_age_seconds < 0 || plan_age_seconds > 172800)); then
            echo '::error::The two-day approval window expired; dispatch and review a fresh plan.'
            exit 1
          fi

      - name: Download reviewed saved plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: ${{ env.ROOT }}

      - name: Verify commit, plan bytes, and reviewed contract
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ needs.plan.outputs.commit_sha }}" ]] || {
            echo '::error::Apply checkout does not match planned commit.'
            exit 1
          }
          [[ "$(cat commit-sha.txt)" == "${{ needs.plan.outputs.commit_sha }}" ]] || {
            echo '::error::Artifact commit does not match planned commit.'
            exit 1
          }
          [[ "$(cat planned-at-epoch.txt)" == "${{ needs.plan.outputs.planned_at_epoch }}" ]] || {
            echo '::error::Artifact creation time does not match plan output.'
            exit 1
          }
          sha256sum --check tfplan.sha256
          [[ "$(sha256sum tfplan | awk '{print $1}')" == "${{ needs.plan.outputs.plan_sha256 }}" ]] || {
            echo '::error::Saved plan digest does not match plan output.'
            exit 1
          }
          ../../../scripts/check-prod-hub-dns-plan.py tfplan.json

      - name: Prove checkout credentials are absent before Terraform
        run: scripts/check-no-checkout-credentials.sh

      - name: Configure narrowly scoped production apply session
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PROD_ROLE_ARN }}
          role-session-name: prod-hub-dns-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"StateBucketLocation","Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":"arn:aws:s3:::layerv-terraform-state-235500187906"},{"Sid":"StatePrefixList","Effect":"Allow","Action":["s3:ListBucket"],"Resource":"arn:aws:s3:::layerv-terraform-state-235500187906","Condition":{"StringLike":{"s3:prefix":["nhp/prod-hub-dns/*","env:/","env:/*/nhp/prod-hub-dns/*"]}}},{"Sid":"StateObject","Effect":"Allow","Action":["s3:GetObject","s3:PutObject"],"Resource":["arn:aws:s3:::layerv-terraform-state-235500187906/nhp/prod-hub-dns/terraform.tfstate","arn:aws:s3:::layerv-terraform-state-235500187906/nhp/prod-hub-dns/terraform.tfstate.tflock"]},{"Sid":"StateLockDelete","Effect":"Allow","Action":["s3:DeleteObject"],"Resource":"arn:aws:s3:::layerv-terraform-state-235500187906/nhp/prod-hub-dns/terraform.tfstate.tflock"},{"Sid":"StateKms","Effect":"Allow","Action":["kms:Decrypt","kms:DescribeKey","kms:Encrypt","kms:GenerateDataKey"],"Resource":"arn:aws:kms:us-east-2:235500187906:key/00a0e673-cef4-41f0-bfc0-5116a9ab3aa0"},{"Sid":"CallerIdentity","Effect":"Allow","Action":["sts:GetCallerIdentity"],"Resource":"*"},{"Sid":"HubNlbRead","Effect":"Allow","Action":["elasticloadbalancing:DescribeLoadBalancers","elasticloadbalancing:DescribeLoadBalancerAttributes","elasticloadbalancing:DescribeTags"],"Resource":"*"},{"Sid":"ManagementDnsAssume","Effect":"Allow","Action":["sts:AssumeRole"],"Resource":"arn:aws:iam::165115313779:role/nhp-ac-route53-access"}]}

      - name: Prove exact production apply identity
        run: scripts/check-control-aws-identity.sh prod "prod-hub-dns-apply-${GITHUB_RUN_ID}"

      - name: Initialize isolated production Hub DNS state
        working-directory: ${{ env.ROOT }}
        run: |
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          terraform init -reconfigure -input=false -lockfile=readonly

      - name: Re-render and re-check the exact saved plan
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          terraform show -json tfplan >"$RUNNER_TEMP/apply-tfplan.json"
          cmp tfplan.json "$RUNNER_TEMP/apply-tfplan.json" || {
            echo '::error::Saved plan no longer renders to the reviewed JSON.'
            exit 1
          }
          ../../../scripts/check-prod-hub-dns-plan.py "$RUNNER_TEMP/apply-tfplan.json"

      - name: Apply exact reviewed plan
        working-directory: ${{ env.ROOT }}
        run: terraform apply -input=false -lock-timeout=5m -no-color tfplan

      - name: Prove the isolated root converged
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode \
            -no-color -out=post-apply.tfplan && rc=0 || rc=$?
          [[ "$rc" -eq 0 ]] || {
            echo "::error::Production Hub DNS did not converge to a no-op (exit $rc)."
            exit 1
          }
          terraform show -json post-apply.tfplan >post-apply-plan.json
          ../../../scripts/check-prod-hub-dns-plan.py post-apply-plan.json
