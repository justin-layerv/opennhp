name: "Canary Deploy (Production)"

# Canary deployment using AWS Step Functions for automated rollout.
#
# This workflow:
# 1. Validates the image exists in ECR and canary state is idle
# 2. Updates the SSM image tag parameter
# 3. Starts a Step Functions execution for the canary rollout
# 4. Polls execution status until completion
#
# The Step Functions state machine handles:
# - Launching canary instance(s)
# - Health checks and metric evaluation
# - Gradual traffic shifting
# - Automatic rollback on failure

# run-name embeds an optional correlation_id so promote-to-prod.yml
# (the only non-manual dispatcher) can reliably find this run via
# find-dispatched-run.sh. See the blue-green-deploy.yml counterpart
# for the full rationale.
run-name: "Canary ${{ inputs.environment }} ${{ inputs.component }} ${{ inputs.cell_id }}${{ inputs.correlation_id && format(' [corr:{0}]', inputs.correlation_id) || '' }}"

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - ac
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
      cell_id:
        description: 'Cell identifier for multi-cell deployments'
        required: false
        default: 'cell0'
        type: string
      correlation_id:
        description: 'Optional unique ID set by the parent dispatcher so it can reliably find this run (see find-dispatched-run.sh).'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read
  attestations: read  # gh attestation verify in the deploy-time image gate (#1334)

concurrency:
  group: canary-deploy-${{ inputs.environment }}-${{ inputs.component }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  SANDBOX_ACCOUNT_ID: '767397897469'

jobs:
  # =============================================================================
  # VALIDATE - Verify prerequisites before starting canary deployment
  # =============================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # No environment gate — this workflow is dispatched from promote-to-prod.yml
    # which already has the production approval gate. Adding one here would block
    # the dispatched run in "waiting" status, causing the parent to time out.
    timeout-minutes: 5
    outputs:
      state_machine_arn: ${{ steps.state-machine.outputs.arn }}
      account_id: ${{ steps.aws-info.outputs.account_id }}
      ecr_repo: ${{ steps.ecr-info.outputs.repo_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account Info
        id: aws-info
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "AWS Account: $ACCOUNT_ID"

      - name: Verify Image Exists in ECR
        id: ecr-info
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
        run: |
          REPO_NAME=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/${COMPONENT}/ecr-repo-name" \
            --query "Parameter.Value" --output text 2>/dev/null) || REPO_NAME=""

          if [[ -z "$REPO_NAME" ]]; then
            if [[ "$COMPONENT" == "server" ]]; then
              REPO_NAME="layerv/nhp-server"
            else
              REPO_NAME="layerv/nhp-ac"
            fi
            echo "::warning::SSM parameter /${ENVIRONMENT}/nhp/${COMPONENT}/ecr-repo-name not found, using default: $REPO_NAME"
          fi

          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

          # Prod pulls images from sandbox ECR (cross-account).
          # The ECR resource policy includes ecr:DescribeImages for secondary accounts.
          # Use an array so each flag is passed as a separate argv entry — a
          # quoted scalar would be parsed as one positional arg.
          ECR_REGISTRY_ARGS=()
          if [[ "$ENVIRONMENT" == "prod" ]]; then
            ECR_REGISTRY_ARGS=(--registry-id "$SANDBOX_ACCOUNT_ID")
          fi

          echo "Verifying image $REPO_NAME:$IMAGE_TAG exists in ECR..."
          if ! aws ecr describe-images \
            "${ECR_REGISTRY_ARGS[@]}" \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query "imageDetails[0].imageTags" \
            --output text > /dev/null 2>&1; then
            echo "::error::Image $REPO_NAME:$IMAGE_TAG not found in ECR"
            exit 1
          fi
          echo "Image verified: $REPO_NAME:$IMAGE_TAG exists"

      # Pipeline-side attestation gate (#1334 Phase 1). Prod canary pulls from
      # the sandbox account's ECR, so verification is cross-account via
      # registry-id. audit by default; flip fleet-wide via the
      # IMAGE_ATTESTATION_VERIFY_MODE variable after soak.
      - name: Verify Image Attestation
        uses: ./.github/actions/verify-image-attestation
        with:
          repository: ${{ steps.ecr-info.outputs.repo_name }}
          image-tag: ${{ inputs.image_tag }}
          region: ${{ env.AWS_REGION }}
          registry-id: ${{ inputs.environment == 'prod' && env.SANDBOX_ACCOUNT_ID || '' }}
          mode: ${{ vars.IMAGE_ATTESTATION_VERIFY_MODE || 'audit' }}

      - name: Check Canary State is Idle
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CELL_ID: ${{ inputs.cell_id }}
          STALE_THRESHOLD_SECONDS: '3900' # 65 minutes (state machine timeout is 60 min + 5 min buffer)
        run: |
          SSM_PARAM="/${ENVIRONMENT}/nhp/${CELL_ID}/canary/${{ inputs.component }}/state"
          echo "Checking canary state: $SSM_PARAM"

          STATE=$(aws ssm get-parameter \
            --name "$SSM_PARAM" \
            --query "Parameter.Value" --output text 2>/dev/null) || STATE=""

          if [[ -z "$STATE" || "$STATE" == "idle" ]]; then
            if [[ -z "$STATE" ]]; then
              echo "::warning::Canary state parameter not found - assuming idle (first deployment)"
            fi
            echo "Canary state: idle (ready for deployment)"
            exit 0
          fi

          # State is not idle — check if it's a stale lock.
          # Format: "deploying:<ISO timestamp>" (set by canary_orchestrator.py handle_prepare)
          # or legacy "deploying" (no timestamp).
          # Note: This is a best-effort check (TOCTOU race between read and reset).
          # The GitHub Actions concurrency group is the primary lock preventing concurrent deploys.
          if [[ "$STATE" == deploying:* ]]; then
            TIMESTAMP="${STATE#deploying:}"
            DEPLOY_EPOCH=$(date -d "$TIMESTAMP" +%s 2>/dev/null) || DEPLOY_EPOCH=0
            NOW_EPOCH=$(date +%s)
            AGE_SECONDS=$((NOW_EPOCH - DEPLOY_EPOCH))
            AGE_MINUTES=$((AGE_SECONDS / 60))

            if [[ $AGE_SECONDS -gt $STALE_THRESHOLD_SECONDS ]]; then
              echo "::warning::Canary state is '$STATE' but is ${AGE_MINUTES}m old (threshold: $((STALE_THRESHOLD_SECONDS / 60))m). Auto-resetting stale lock."
              aws ssm put-parameter \
                --name "$SSM_PARAM" \
                --value "idle" \
                --type String \
                --overwrite
              echo "Canary state: reset to idle (stale lock cleared)"
              exit 0
            else
              echo "::error::Canary state is '$STATE' (${AGE_MINUTES}m old). Another deployment is in progress."
              echo "::error::Wait for it to complete or manually set $SSM_PARAM to 'idle' if stuck."
              exit 1
            fi
          fi

          # Legacy format (no timestamp) or other non-idle state — hard fail.
          echo "::error::Canary state is '$STATE', expected 'idle'. Another deployment may be in progress."
          echo "::error::Wait for the current deployment to complete or manually reset the state."
          exit 1

      - name: Read Step Functions State Machine ARN
        id: state-machine
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CELL_ID: ${{ inputs.cell_id }}
        run: |
          SSM_PARAM="/${ENVIRONMENT}/nhp/${CELL_ID}/canary/${{ inputs.component }}/state-machine-arn"
          echo "Reading state machine ARN from: $SSM_PARAM"

          ARN=$(aws ssm get-parameter \
            --name "$SSM_PARAM" \
            --query "Parameter.Value" --output text 2>/dev/null) || ARN=""

          if [[ -z "$ARN" ]]; then
            echo "::error::State machine ARN not found in SSM parameter $SSM_PARAM"
            echo "::error::Ensure the canary infrastructure has been deployed via Terraform"
            exit 1
          fi

          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "State machine ARN: $ARN"

      - name: Validation Summary
        env:
          COMPONENT: ${{ inputs.component }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          STATE_MACHINE_ARN: ${{ steps.state-machine.outputs.arn }}
          ECR_REPO: ${{ steps.ecr-info.outputs.repo_name }}
        run: |
          # Wrap consecutive >> $GITHUB_STEP_SUMMARY redirects in a single
          # block to satisfy shellcheck SC2129 (the validate-workflows job
          # has been failing on every push touching .github/workflows for
          # ~24h+ until this commit). Functionally identical, lints clean.
          {
            echo "## Canary Deployment - Validation"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Component | $COMPONENT |"
            echo "| Environment | $ENVIRONMENT |"
            echo "| Image | \`$ECR_REPO:$IMAGE_TAG\` |"
            echo "| State Machine | \`${STATE_MACHINE_ARN##*:}\` |"
            echo ""
            echo "All validation checks passed."
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================================
  # DEPLOY - Update SSM and execute Step Functions canary rollout
  # =============================================================================
  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    # No environment gate — this workflow is dispatched from promote-to-prod.yml
    # which already has the production approval gate. Adding one here would block
    # the dispatched run in "waiting" status, causing the parent to time out.
    timeout-minutes: 45
    outputs:
      execution_arn: ${{ steps.start-execution.outputs.execution_arn }}
      status: ${{ steps.poll-execution.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mark Deployment Window
        uses: ./.github/actions/mark-deployment-window
        with:
          environment: ${{ inputs.environment }}
          cell_id: ${{ inputs.cell_id }}
          component: ${{ inputs.component }}
          strategy: canary

      - name: Update SSM Image Tag
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          SSM_PARAM="/${ENVIRONMENT}/nhp/${COMPONENT}/image-tag"
          echo "Updating SSM parameter: $SSM_PARAM = $IMAGE_TAG"
          aws ssm put-parameter \
            --name "$SSM_PARAM" \
            --value "$IMAGE_TAG" \
            --type String \
            --overwrite
          echo "SSM parameter updated successfully"

      - name: Start Step Functions Execution
        id: start-execution
        env:
          STATE_MACHINE_ARN: ${{ needs.validate.outputs.state_machine_arn }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          COMPONENT: ${{ inputs.component }}
          ENVIRONMENT: ${{ inputs.environment }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "Starting Step Functions execution..."
          EXECUTION_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "$STATE_MACHINE_ARN" \
            --input "{\"image_tag\":\"$IMAGE_TAG\",\"component\":\"$COMPONENT\",\"environment\":\"$ENVIRONMENT\",\"triggered_by\":\"github-actions-$RUN_ID\"}" \
            --query 'executionArn' --output text)

          echo "execution_arn=$EXECUTION_ARN" >> "$GITHUB_OUTPUT"
          echo "Execution started: $EXECUTION_ARN"

      - name: Poll Execution Status
        id: poll-execution
        env:
          EXECUTION_ARN: ${{ steps.start-execution.outputs.execution_arn }}
          DEPLOYMENT_WINDOW_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_WINDOW_CELL_ID: ${{ inputs.cell_id }}
          DEPLOYMENT_WINDOW_COMPONENT: ${{ inputs.component }}
          DEPLOYMENT_WINDOW_STRATEGY: canary-poll
          DEPLOYMENT_WINDOW_EMIT_INTERVAL_SECONDS: '60'
        run: |
          echo "Polling execution status every 30s..."
          echo "Execution: $EXECUTION_ARN"
          echo ""

          ITERATION=0
          START_TIME=$(date +%s)
          # shellcheck source=.github/scripts/emit-deployment-window-metric.sh
          source .github/scripts/emit-deployment-window-metric.sh

          while true; do
            # Keep the deploy suppressor fresh while Step Functions rolls traffic.
            emit_deployment_window_metric_throttled

            ITERATION=$((ITERATION + 1))
            ELAPSED=$(( ($(date +%s) - START_TIME) / 60 ))

            STATUS=$(aws stepfunctions describe-execution \
              --execution-arn "$EXECUTION_ARN" \
              --query 'status' --output text)

            echo "[iter $ITERATION, ${ELAPSED}m elapsed] Status: $STATUS"

            case "$STATUS" in
              RUNNING)
                sleep 30
                ;;
              SUCCEEDED)
                echo "Canary deployment succeeded!"
                echo "status=SUCCEEDED" >> "$GITHUB_OUTPUT"
                break
                ;;
              FAILED)
                echo "::error::Canary deployment FAILED"
                OUTPUT=$(aws stepfunctions describe-execution \
                  --execution-arn "$EXECUTION_ARN" \
                  --query 'output' --output text 2>/dev/null) || OUTPUT=""
                CAUSE=$(aws stepfunctions describe-execution \
                  --execution-arn "$EXECUTION_ARN" \
                  --query 'error' --output text 2>/dev/null) || CAUSE=""
                if [[ -n "$CAUSE" && "$CAUSE" != "None" ]]; then
                  echo "Error: $CAUSE"
                fi
                if [[ -n "$OUTPUT" && "$OUTPUT" != "None" ]]; then
                  echo "Output: $OUTPUT"
                fi
                echo "status=FAILED" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
              TIMED_OUT)
                echo "::error::Canary deployment TIMED OUT"
                echo "status=TIMED_OUT" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
              ABORTED)
                echo "::error::Canary deployment was ABORTED"
                echo "status=ABORTED" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
              *)
                echo "::warning::Unknown status: $STATUS"
                sleep 30
                ;;
            esac
          done

      - name: Push Deployment Metric
        if: steps.poll-execution.outputs.status == 'SUCCEEDED'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CELL_ID: ${{ inputs.cell_id }}
          COMPONENT: ${{ inputs.component }}
        run: |
          aws cloudwatch put-metric-data \
            --namespace "LayerV/NHP" \
            --metric-name "DeploymentEvent" \
            --dimensions "Environment=$ENVIRONMENT,Component=$COMPONENT,Strategy=canary" \
            --value 1 \
            --unit Count \
            || echo "::warning::Failed to push deployment metric"
          aws cloudwatch put-metric-data \
            --namespace "LayerV/NHP" \
            --metric-name "DeploymentEvent" \
            --dimensions "Environment=$ENVIRONMENT,Cell=$CELL_ID" \
            --value 1 \
            --unit Count \
            || echo "::warning::Failed to push cell-scoped deployment metric"
          echo "Deployment event pushed to LayerV/NHP namespace"

  # =============================================================================
  # NOTIFY - Send deployment notification to SNS (Slack via AWS Chatbot)
  # =============================================================================
  notify:
    name: Notify
    if: always()
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deployment notification
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMPONENT: ${{ inputs.component }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_STATUS: ${{ needs.deploy.outputs.status }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Read SNS topic ARN from SSM
          SNS_ARN=$(aws ssm get-parameter \
            --name "/${ENVIRONMENT}/nhp/monitoring/sns-topic-arn" \
            --query 'Parameter.Value' --output text 2>/dev/null) || SNS_ARN=""

          if [ -z "$SNS_ARN" ] || [[ ! "$SNS_ARN" =~ ^arn:aws:sns: ]]; then
            echo "No valid SNS topic ARN found at /${ENVIRONMENT}/nhp/monitoring/sns-topic-arn, skipping notification"
            exit 0
          fi

          # Determine overall status
          if [[ "$DEPLOY_RESULT" == "success" ]]; then
            STATUS="SUCCESS"
          elif [[ "$VALIDATE_RESULT" != "success" ]]; then
            STATUS="FAILED (validation)"
          elif [[ "$DEPLOY_RESULT" == "failure" ]]; then
            STATUS="FAILED (${DEPLOY_STATUS:-deploy})"
          else
            STATUS="FAILED"
          fi

          # Build message
          SUBJECT="Canary Deploy: ${STATUS} - ${COMPONENT} (${ENVIRONMENT})"

          MSG="Canary Deployment Notification"
          MSG+="\n"
          MSG+="\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          MSG+="\n  Status:      ${STATUS}"
          MSG+="\n  Environment: ${ENVIRONMENT}"
          MSG+="\n  Component:   ${COMPONENT}"
          MSG+="\n  Image Tag:   ${IMAGE_TAG}"
          MSG+="\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          MSG+="\n"
          MSG+="\n┌─ Stage Results ─────────────────"
          MSG+="\n│ Validation: $([ "$VALIDATE_RESULT" = "success" ] && echo "[OK]" || echo "[FAILED]") ${VALIDATE_RESULT}"
          MSG+="\n│ Deployment: $([ "$DEPLOY_RESULT" = "success" ] && echo "[OK]" || [ "$DEPLOY_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${DEPLOY_RESULT}"
          MSG+="\n└─────────────────────────────────"

          if [[ "$STATUS" == *"FAILED"* ]]; then
            MSG+="\n"
            MSG+="\n⚠ Recovery:"
            MSG+="\n  • Check Step Functions execution in AWS Console"
            MSG+="\n  • Verify canary state is reset to 'idle' before retry"
            MSG+="\n  • Check logs: ${WORKFLOW_URL}"
          fi

          MSG+="\n"
          MSG+="\nTriggered by: ${{ github.actor }}"
          MSG+="\nRun: ${WORKFLOW_URL}"

          aws sns publish \
            --topic-arn "$SNS_ARN" \
            --subject "$SUBJECT" \
            --message "$(echo -e "$MSG")" || echo "::warning::SNS notification failed - check IAM permissions or topic existence"

  # =============================================================================
  # CLEANUP - Reset canary state on failure to prevent stale locks
  # =============================================================================
  cleanup:
    name: Cleanup
    if: always() && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled')
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && secrets.AWS_PROD_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reset canary state to idle
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CELL_ID: ${{ inputs.cell_id }}
        run: |
          SSM_PARAM="/${ENVIRONMENT}/nhp/${CELL_ID}/canary/${{ inputs.component }}/state"
          CURRENT=$(aws ssm get-parameter \
            --name "$SSM_PARAM" \
            --query "Parameter.Value" --output text 2>/dev/null) || CURRENT=""

          # Only reset if still in a deploying state (don't clobber a concurrent deploy
          # or a state that was already cleaned up by the state machine).
          if [[ "$CURRENT" == deploying* ]]; then
            echo "::notice::Resetting canary state from '$CURRENT' to 'idle' after deployment failure"
            aws ssm put-parameter \
              --name "$SSM_PARAM" \
              --value "idle" \
              --type String \
              --overwrite
          else
            echo "Canary state is '$CURRENT' — no reset needed"
          fi

  # =============================================================================
  # SUMMARY - Generate deployment summary (runs even on failure)
  # =============================================================================
  summary:
    name: Summary
    if: always()
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Deployment Summary
        env:
          COMPONENT: ${{ inputs.component }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          EXECUTION_ARN: ${{ needs.deploy.outputs.execution_arn }}
          DEPLOY_STATUS: ${{ needs.deploy.outputs.status }}
          ECR_REPO: ${{ needs.validate.outputs.ecr_repo }}
          ACCOUNT_ID: ${{ needs.validate.outputs.account_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Wrap consecutive >> $GITHUB_STEP_SUMMARY redirects in a single
          # block to satisfy shellcheck SC2129. The execution-name and SFN
          # URL variables are computed before the block so they can be
          # referenced inside it without losing the redirect grouping.
          if [[ -n "$EXECUTION_ARN" ]]; then
            # Extract execution name from ARN for display
            EXECUTION_NAME="${EXECUTION_ARN##*:}"
            # Build Step Functions console URL
            REGION="${AWS_REGION}"
            SFN_URL="https://${REGION}.console.aws.amazon.com/states/home?region=${REGION}#/v2/executions/details/${EXECUTION_ARN}"
          fi

          {
            echo "## Canary Deployment Summary"
            echo ""

            # Determine overall outcome
            if [[ "$DEPLOY_RESULT" == "success" ]]; then
              echo "> **Status: SUCCEEDED**"
            elif [[ "$VALIDATE_RESULT" != "success" ]]; then
              echo "> **Status: VALIDATION FAILED**"
            elif [[ "$DEPLOY_RESULT" == "failure" ]]; then
              echo "> **Status: DEPLOYMENT FAILED** ($DEPLOY_STATUS)"
            elif [[ "$DEPLOY_RESULT" == "cancelled" ]]; then
              echo "> **Status: CANCELLED**"
            else
              echo "> **Status: UNKNOWN** ($DEPLOY_RESULT)"
            fi

            echo ""
            echo "### Configuration"
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Component | **$COMPONENT** |"
            echo "| Environment | **$ENVIRONMENT** |"
            echo "| Image Tag | \`$IMAGE_TAG\` |"
            if [[ -n "$ECR_REPO" ]]; then
              echo "| ECR Repository | \`$ECR_REPO\` |"
            fi
            echo "| Triggered By | \`${{ github.actor }}\` |"
            echo ""

            echo "### Execution"
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Validation | $VALIDATE_RESULT |"
            echo "| Deployment | $DEPLOY_RESULT |"

            if [[ -n "$EXECUTION_ARN" ]]; then
              echo "| Execution | [${EXECUTION_NAME}](${SFN_URL}) |"
            fi
            echo ""

            if [[ "$DEPLOY_RESULT" == "failure" ]]; then
              echo "### Troubleshooting"
              echo "1. Check the [Step Functions execution](${SFN_URL}) for detailed error information"
              echo "2. Review CloudWatch logs for the canary Lambda functions"
              echo "3. Verify the canary state has been reset to \`idle\` before retrying"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
