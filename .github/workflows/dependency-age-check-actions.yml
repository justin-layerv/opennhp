# Dependency Age Check (Actions)
# Thin shim calling shared reusable workflow.
# Source: https://github.com/layervai/ops-routines-workflows/blob/main/.github/workflows/age-check-actions.yml
#
# Bypass label (apply to PR; rationale required in PR description):
#   age-check-bypass          — skip ALL ecosystems (docker, go, actions)
#
# `age-check-bypass-actions` exists as a label but is NOT yet enforced
# anywhere. Per-ecosystem bypass requires upstream reusable support.
name: Dependency Age Check (Actions)

# Fires on every PR (no path filter) so the status check always reports.
# This lets branch protection require it without the path-filtered-
# required-check footgun. The reusable's script exits 0 quickly when
# no relevant changes are in the diff.
on:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same PR branch.
concurrency:
  group: dep-age-actions-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  age-check:
    # Bypass is handled INSIDE the reusable workflow's job-level `if:`
    # (it honors `age-check-bypass`). This shim must always invoke the
    # reusable — if the shim's `if:` short-circuits before invoking, the
    # reusable's `Check GitHub Actions pin ages` job never materializes,
    # and branch protection's required check
    # `age-check / Check GitHub Actions pin ages` reports as
    # Expected/missing rather than Skipped, blocking merge.
    #
    # The per-ecosystem `age-check-bypass-actions` label is aspirational:
    # it exists in the repo but is NOT yet honored anywhere — the
    # reusable doesn't know about it, and we can't enforce it at the
    # shim level without breaking the required-check name. Tracked for
    # upstream support in layervai/ops-routines-workflows.
    # Note: `timeout-minutes` is intentionally NOT set here. Per GH
    # docs (https://docs.github.com/en/actions/using-workflows/reusing-workflows#supported-keywords-for-jobs-that-call-a-reusable-workflow)
    # only if/name/needs/permissions/secrets/strategy/uses/with/concurrency
    # are valid on a job that calls a reusable workflow. The reusable
    # workflow itself sets `timeout-minutes: 5` internally.
    uses: layervai/ops-routines-workflows/.github/workflows/age-check-actions.yml@39fcb54fc36ea7b6032e138bd8b57647f2bb32f0 # v0.4.0
    with:
      min_age_days: 7
    permissions:
      contents: read
