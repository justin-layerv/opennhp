name: js-agent

# Build + test the browser NHP agent (endpoints/js-agent, #2208). Path-scoped to
# that directory so it does not run on unrelated Go/Terraform changes. The
# fingerprint test asserts the same golden vectors as the Go test in
# nhp/utils/crypto_fingerprint_test.go, so it catches a regression in the
# TypeScript wire-addressing; the two vector copies are kept in sync by hand
# (this job never runs Go — see that test's comment).
#
# Branch-protection note: because this workflow is path-filtered, do NOT make it
# a *required* status check as-is — GitHub leaves a required path-filtered check
# "pending" forever on PRs that don't touch endpoints/js-agent/**. Keep it
# non-required, or pair it with a path-aware always-green shim.
on:
  push:
    branches: [main]
    paths:
      - 'endpoints/js-agent/**'
      - '.github/workflows/js-agent.yml'
  pull_request:
    paths:
      - 'endpoints/js-agent/**'
      - '.github/workflows/js-agent.yml'

permissions:
  contents: read

concurrency:
  group: js-agent-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: js-agent build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: endpoints/js-agent
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: endpoints/js-agent/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit (production deps)
        # Gate the shipped browser surface — runtime deps only. The dev
        # toolchain (vitest/esbuild/tsc) never reaches users, and pinning the
        # build to dev-only advisories that often have no fix would flap this
        # job; the runtime surface is what must stay clean. --audit-level=high
        # fails on high + critical.
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run build
      - name: Test
        run: npm test
