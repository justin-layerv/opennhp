name: js-agent

# Build, lint, and test the browser NHP agent (endpoints/js-agent, #2208).
# Path-scoped to that directory plus the committed qurl.link bundle copy, so it
# does not run on unrelated Go/Terraform changes but still catches asset-only
# drift in the Terraform-served bundle.
#
# Two jobs:
#   test    — runs the vitest suite on every supported Node: the declared
#             engines.node floor (20) and the toolchain pin (22), so a
#             version-specific regression is actually caught.
#   quality — runs the version-independent gates once (npm audit, ESLint,
#             Prettier, tsc typecheck).
#
# The Go↔TS golden-vector parity check (fingerprint + KDF) is intentionally NOT
# here: it lives in validate-workflows.yml (scripts/check-golden-vectors.sh),
# which triggers on edits to any of the vector files — including the Go-side
# ones, which this path-scoped workflow never sees.
#
# Branch-protection note: because this workflow is path-filtered, do NOT make
# its checks *required* as-is — GitHub leaves a required path-filtered check
# "pending" forever on PRs that don't touch endpoints/js-agent/**. Keep them
# non-required, or pair with a path-aware always-green shim.
on:
  push:
    branches: [main]
    paths:
      - 'endpoints/js-agent/**'
      - 'terraform/modules/qurl-link/frontend/nhp-agent.min.js'
      - 'terraform/modules/qurl-link/frontend/nhp-agent.min.js.sri'
      - '.github/workflows/js-agent.yml'
  pull_request:
    paths:
      - 'endpoints/js-agent/**'
      - 'terraform/modules/qurl-link/frontend/nhp-agent.min.js'
      - 'terraform/modules/qurl-link/frontend/nhp-agent.min.js.sri'
      - '.github/workflows/js-agent.yml'

permissions:
  contents: read

concurrency:
  group: js-agent-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: js-agent test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel the 22 run if 20 fails (or vice versa) — a floor-only
      # regression is exactly what this matrix exists to surface, so show both.
      fail-fast: false
      matrix:
        # Keep to the even LTS lines vitest 4 supports
        # (^20 || ^22 || >=24). '20' is the engines.node floor; '22' is the pin.
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: endpoints/js-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: endpoints/js-agent/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test

  quality:
    name: js-agent quality (lint + typecheck + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: endpoints/js-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: endpoints/js-agent/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit (production deps)
        # Gate the shipped browser surface — runtime deps only. The dev
        # toolchain (vitest/esbuild/tsc/eslint/prettier) never reaches users,
        # and pinning the build to dev-only advisories that often have no fix
        # would flap this job; the runtime surface is what must stay clean.
        # --audit-level=high fails on high + critical.
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Typecheck
        run: npm run build
      - name: Bundle (size budget)
        # Build the real dist/ artifact and fail if it exceeds the gzip budget.
        # bundle.test.ts checks the same via the shared options in-memory, but the
        # script's own disk-write + process.exit(1) gate path runs only here in CI.
        run: npm run bundle
