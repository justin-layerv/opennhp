name: Scheduled Release Pipeline

# Deploys accumulated main branch changes on a schedule.
#
# Pipeline flow:
#   check-pending-changes → ensure-sandbox-deployed (blue/green) → soak → promote-to-prod (canary) → tag-and-track → notify
#
# Sandbox uses blue/green deployment (instant traffic switch via NLB listener).
# Production uses canary deployment (Step Functions gradual rollout with auto-rollback).
#
# The auto-deploy on push-to-main (build-and-push.yml) remains intact.
# This pipeline detects "already deployed" and skips redundant work.

on:
  schedule:
    # Weekdays at 7am UTC (2am EST) - before US business hours
    - cron: '0 7 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - hotfix
          - sandbox-only
      skip_soak:
        description: 'Skip soak period'
        required: false
        default: false
        type: boolean
      soak_minutes:
        description: 'Soak period duration (minutes)'
        required: false
        default: '30'
        type: string
      force_redeploy:
        description: 'Force redeploy even if already deployed'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: write
  actions: write

concurrency:
  group: scheduled-release
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2

jobs:
  # ============================================================================
  # CHECK PENDING CHANGES - Determine if there are changes to deploy
  # ============================================================================
  check-pending-changes:
    name: Check Pending Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      head_sha_short: ${{ steps.check.outputs.head_sha_short }}
      sandbox_deployed_commit: ${{ steps.check.outputs.sandbox_deployed_commit }}
      prod_deployed_commit: ${{ steps.check.outputs.prod_deployed_commit }}
      sandbox_already: ${{ steps.check.outputs.sandbox_already }}
      change_summary: ${{ steps.check.outputs.change_summary }}
      mode: ${{ steps.params.outputs.mode }}
      skip_soak: ${{ steps.params.outputs.skip_soak }}
      soak_minutes: ${{ steps.params.outputs.soak_minutes }}
      force_redeploy: ${{ steps.params.outputs.force_redeploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Resolve parameters
        id: params
        run: |
          # Use explicit defaults — inputs.* is empty string on schedule trigger,
          # and GitHub coerces booleans to 'true'/'false' strings on dispatch.
          MODE="${{ inputs.mode }}"
          MODE="${MODE:-standard}"
          SKIP_SOAK="${{ inputs.skip_soak }}"
          SKIP_SOAK="${SKIP_SOAK:-false}"
          SOAK_MINUTES="${{ inputs.soak_minutes }}"
          SOAK_MINUTES="${SOAK_MINUTES:-30}"
          FORCE="${{ inputs.force_redeploy }}"
          FORCE="${FORCE:-false}"

          # Hotfix mode always skips soak
          if [[ "$MODE" == "hotfix" ]]; then
            SKIP_SOAK="true"
          fi

          {
            echo "mode=$MODE"
            echo "skip_soak=$SKIP_SOAK"
            echo "soak_minutes=$SOAK_MINUTES"
            echo "force_redeploy=$FORCE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Parameters"
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| Mode | $MODE |"
            echo "| Skip Soak | $SKIP_SOAK |"
            echo "| Soak Minutes | $SOAK_MINUTES |"
            echo "| Force Redeploy | $FORCE |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (sandbox)
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read sandbox deployment state
        id: sandbox-ssm
        run: |
          SANDBOX_COMMIT=$(aws ssm get-parameter \
            --name "/sandbox/nhp/deploy/deployed-commit" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" --output text 2>/dev/null) || SANDBOX_COMMIT=""
          echo "commit=${SANDBOX_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (prod)
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read prod deployment state
        id: prod-ssm
        run: |
          PROD_COMMIT=$(aws ssm get-parameter \
            --name "/prod/nhp/deploy/deployed-commit" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" --output text 2>/dev/null) || PROD_COMMIT=""
          echo "commit=${PROD_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Check for pending changes
        id: check
        env:
          SANDBOX_COMMIT: ${{ steps.sandbox-ssm.outputs.commit }}
          PROD_COMMIT: ${{ steps.prod-ssm.outputs.commit }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          HEAD_SHA_SHORT="${HEAD_SHA:0:7}"

          {
            echo "head_sha=$HEAD_SHA"
            echo "head_sha_short=$HEAD_SHA_SHORT"
            echo "sandbox_deployed_commit=${SANDBOX_COMMIT}"
            echo "prod_deployed_commit=${PROD_COMMIT}"
          } >> "$GITHUB_OUTPUT"

          echo "HEAD SHA:               $HEAD_SHA"
          echo "Sandbox deployed:       ${SANDBOX_COMMIT:-never}"
          echo "Prod deployed:          ${PROD_COMMIT:-never}"

          # Check if sandbox already has HEAD
          SANDBOX_ALREADY="false"
          if [[ "$SANDBOX_COMMIT" == "$HEAD_SHA" ]]; then
            SANDBOX_ALREADY="true"
          fi
          echo "sandbox_already=$SANDBOX_ALREADY" >> "$GITHUB_OUTPUT"

          # Determine if there are changes to deploy
          FORCE="${{ steps.params.outputs.force_redeploy }}"
          MODE="${{ steps.params.outputs.mode }}"
          HAS_CHANGES="false"

          if [[ "$FORCE" == "true" ]]; then
            HAS_CHANGES="true"
            echo "Force redeploy requested."
          elif [[ "$MODE" == "sandbox-only" ]]; then
            # For sandbox-only, check if sandbox needs updating
            if [[ "$SANDBOX_COMMIT" != "$HEAD_SHA" ]]; then
              HAS_CHANGES="true"
            fi
          else
            # For standard/hotfix, check if prod needs updating
            if [[ "$PROD_COMMIT" != "$HEAD_SHA" ]]; then
              HAS_CHANGES="true"
            fi
          fi
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"

          # Build change summary (commits since last prod deploy)
          CHANGE_SUMMARY=""
          if [[ -n "$PROD_COMMIT" && "$PROD_COMMIT" != "initial" && "$PROD_COMMIT" != "never" ]]; then
            if git cat-file -t "$PROD_COMMIT" > /dev/null 2>&1; then
              CHANGE_SUMMARY=$(git log --oneline "${PROD_COMMIT}..HEAD" | head -20)
            fi
          fi
          # Use delimiter syntax for multiline output
          {
            echo "change_summary<<SUMMARY_EOF"
            echo "${CHANGE_SUMMARY:-No previous deployment found}"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

          # Annotate summary
          if [[ "$HAS_CHANGES" == "false" ]]; then
            echo "::notice::No pending changes to deploy. HEAD ($HEAD_SHA_SHORT) matches deployed state."
            {
              echo ""
              echo "### Result: No Changes"
              echo "HEAD \`$HEAD_SHA_SHORT\` is already deployed. Pipeline will skip."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo ""
              echo "### Pending Changes"
              echo "\`\`\`"
              echo "${CHANGE_SUMMARY:-No previous deployment found}"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================================
  # ENSURE SANDBOX DEPLOYED - Make sure sandbox has HEAD
  # ============================================================================
  ensure-sandbox-deployed:
    name: Ensure Sandbox Deployed
    needs: [check-pending-changes]
    if: needs.check-pending-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_tag: ${{ steps.deploy.outputs.image_tag }}
      method: ${{ steps.deploy.outputs.method }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure sandbox deployment
        id: deploy
        env:
          HEAD_SHA: ${{ needs.check-pending-changes.outputs.head_sha }}
          SANDBOX_ALREADY: ${{ needs.check-pending-changes.outputs.sandbox_already }}
          GH_TOKEN: ${{ github.token }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          chmod +x .github/scripts/ensure-sandbox-deployed.sh
          .github/scripts/ensure-sandbox-deployed.sh

      - name: Deployment Summary
        run: |
          {
            echo "### Sandbox Deployment"
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Image Tag | \`${{ steps.deploy.outputs.image_tag }}\` |"
            echo "| Method | ${{ steps.deploy.outputs.method }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # SOAK - Monitor sandbox health for configured duration
  # ============================================================================
  soak:
    name: Soak Period
    needs: [check-pending-changes, ensure-sandbox-deployed]
    if: needs.check-pending-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run soak period
        env:
          ENVIRONMENT: sandbox
          SOAK_MINUTES: ${{ needs.check-pending-changes.outputs.soak_minutes }}
          SKIP_SOAK: ${{ needs.check-pending-changes.outputs.skip_soak }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          chmod +x .github/scripts/soak-period.sh
          .github/scripts/soak-period.sh

      - name: Soak Summary
        run: |
          echo "### Soak Period" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.check-pending-changes.outputs.skip_soak }}" == "true" ]]; then
            echo "Soak period was **skipped**." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Soak period completed: **${{ needs.check-pending-changes.outputs.soak_minutes }} minutes** of health checks passed." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================================
  # PROMOTE TO PROD - Deploy to production (requires approval)
  # ============================================================================
  promote-to-prod:
    name: Promote to Production
    needs: [check-pending-changes, ensure-sandbox-deployed, soak]
    if: |
      needs.check-pending-changes.outputs.has_changes == 'true' &&
      needs.check-pending-changes.outputs.mode != 'sandbox-only'
    runs-on: ubuntu-latest
    environment: production-scheduled
    timeout-minutes: 60
    outputs:
      method: ${{ steps.promote.outputs.method }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure AWS credentials (prod)
        uses: ./.github/actions/setup-deploy
        with:
          aws-role-arn: ${{ secrets.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote to production
        id: promote
        env:
          IMAGE_TAG: ${{ needs.ensure-sandbox-deployed.outputs.image_tag }}
          GH_TOKEN: ${{ github.token }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          chmod +x .github/scripts/promote-to-prod.sh
          .github/scripts/promote-to-prod.sh

      - name: Promotion Summary
        run: |
          {
            echo "### Production Promotion"
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Image Tag | \`${{ needs.ensure-sandbox-deployed.outputs.image_tag }}\` |"
            echo "| Method | ${{ steps.promote.outputs.method }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # TAG AND TRACK - Create git tags and update deployment tracking
  # ============================================================================
  tag-and-track:
    name: Tag and Track
    needs: [check-pending-changes, ensure-sandbox-deployed, soak, promote-to-prod]
    if: |
      always() &&
      needs.check-pending-changes.outputs.has_changes == 'true' &&
      needs.ensure-sandbox-deployed.result == 'success' &&
      needs.soak.result == 'success' &&
      (needs.promote-to-prod.result == 'success' || needs.promote-to-prod.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Create deployment tags
        env:
          HEAD_SHA: ${{ needs.check-pending-changes.outputs.head_sha }}
          HEAD_SHA_SHORT: ${{ needs.check-pending-changes.outputs.head_sha_short }}
          MODE: ${{ needs.check-pending-changes.outputs.mode }}
        run: |
          DATE=$(date -u +%Y-%m-%d)

          # Always tag sandbox
          SANDBOX_TAG="deploy/sandbox/${DATE}-${HEAD_SHA_SHORT}"
          git tag "$SANDBOX_TAG" "$HEAD_SHA" || true
          echo "Created tag: $SANDBOX_TAG"

          # Tag prod if promoted
          if [[ "$MODE" != "sandbox-only" ]]; then
            PROD_TAG="deploy/prod/${DATE}-${HEAD_SHA_SHORT}"
            git tag "$PROD_TAG" "$HEAD_SHA" || true
            echo "Created tag: $PROD_TAG"
          fi

          if ! git push origin --tags; then
            echo "::warning::Failed to push deployment tags to remote"
          fi

      - name: Tag Summary
        env:
          HEAD_SHA_SHORT: ${{ needs.check-pending-changes.outputs.head_sha_short }}
          MODE: ${{ needs.check-pending-changes.outputs.mode }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          {
            echo "### Deployment Tags"
            echo "- \`deploy/sandbox/${DATE}-${HEAD_SHA_SHORT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MODE" != "sandbox-only" ]]; then
            echo "- \`deploy/prod/${DATE}-${HEAD_SHA_SHORT}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ============================================================================
  # NOTIFY - Send Slack notification with pipeline results
  # ============================================================================
  notify:
    name: Notify
    needs: [check-pending-changes, ensure-sandbox-deployed, soak, promote-to-prod, tag-and-track]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send SNS notification
        env:
          HAS_CHANGES: ${{ needs.check-pending-changes.outputs.has_changes }}
          HEAD_SHA_SHORT: ${{ needs.check-pending-changes.outputs.head_sha_short }}
          MODE: ${{ needs.check-pending-changes.outputs.mode }}
          SANDBOX_RESULT: ${{ needs.ensure-sandbox-deployed.result }}
          SOAK_RESULT: ${{ needs.soak.result }}
          PROD_RESULT: ${{ needs.promote-to-prod.result }}
          TAG_RESULT: ${{ needs.tag-and-track.result }}
          IMAGE_TAG: ${{ needs.ensure-sandbox-deployed.outputs.image_tag }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Try sandbox first, then prod for SNS topic
          SNS_ARN=$(aws ssm get-parameter \
            --name "/sandbox/nhp/monitoring/sns-topic-arn" \
            --query 'Parameter.Value' --output text 2>/dev/null) || SNS_ARN=""

          if [ -z "$SNS_ARN" ] || [[ ! "$SNS_ARN" =~ ^arn:aws:sns: ]]; then
            echo "No valid SNS topic ARN found at /sandbox/nhp/monitoring/sns-topic-arn, skipping SNS notification"
          else
            # Determine overall status
            if [[ "$HAS_CHANGES" == "false" ]]; then
              STATUS="SKIPPED (no changes)"
            elif [[ "$PROD_RESULT" == "success" || ("$MODE" == "sandbox-only" && "$SOAK_RESULT" == "success") ]]; then
              STATUS="SUCCESS"
            else
              STATUS="FAILED"
            fi

            SUBJECT="Scheduled Release: ${STATUS} (${MODE})"

            MSG="Scheduled Release Notification"
            MSG+="\n"
            MSG+="\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            MSG+="\n  Status:  ${STATUS}"
            MSG+="\n  Mode:    ${MODE}"
            MSG+="\n  Commit:  ${HEAD_SHA_SHORT:-unknown}"
            MSG+="\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if [ -n "$IMAGE_TAG" ]; then
              MSG+="\n  Image:   ${IMAGE_TAG}"
            fi

            MSG+="\n"
            MSG+="\n┌─ Pipeline Stages ──────────────"
            MSG+="\n│ Sandbox:    $([ "$SANDBOX_RESULT" = "success" ] && echo "[OK]" || [ "$SANDBOX_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${SANDBOX_RESULT:-skipped}"
            MSG+="\n│ Soak:       $([ "$SOAK_RESULT" = "success" ] && echo "[OK]" || [ "$SOAK_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${SOAK_RESULT:-skipped}"
            MSG+="\n│ Production: $([ "$PROD_RESULT" = "success" ] && echo "[OK]" || [ "$PROD_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${PROD_RESULT:-skipped}"
            MSG+="\n│ Tags:       $([ "$TAG_RESULT" = "success" ] && echo "[OK]" || [ "$TAG_RESULT" = "skipped" ] && echo "[SKIP]" || echo "[FAILED]") ${TAG_RESULT:-skipped}"
            MSG+="\n└─────────────────────────────────"

            if [[ "$STATUS" == "FAILED" ]]; then
              MSG+="\n"
              MSG+="\n⚠ Recovery:"
              MSG+="\n  • Check failed stage in workflow run"
              MSG+="\n  • Re-run with force_redeploy=true if needed"
              MSG+="\n  • Check logs: ${WORKFLOW_URL}"
            fi

            MSG+="\nRun: ${WORKFLOW_URL}"

            aws sns publish \
              --topic-arn "$SNS_ARN" \
              --subject "$SUBJECT" \
              --message "$(echo -e "$MSG")" || echo "::warning::SNS notification failed - check IAM permissions or topic existence"
          fi

      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          HAS_CHANGES: ${{ needs.check-pending-changes.outputs.has_changes }}
          HEAD_SHA: ${{ needs.check-pending-changes.outputs.head_sha }}
          HEAD_SHA_SHORT: ${{ needs.check-pending-changes.outputs.head_sha_short }}
          MODE: ${{ needs.check-pending-changes.outputs.mode }}
          CHANGE_SUMMARY: ${{ needs.check-pending-changes.outputs.change_summary }}
          SANDBOX_RESULT: ${{ needs.ensure-sandbox-deployed.result }}
          SOAK_RESULT: ${{ needs.soak.result }}
          PROD_RESULT: ${{ needs.promote-to-prod.result }}
          TAG_RESULT: ${{ needs.tag-and-track.result }}
        run: |
          if [[ -z "$SLACK_WEBHOOK" ]]; then
            echo "SLACK_WEBHOOK_URL not configured, skipping notification"
            exit 0
          fi

          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Determine overall status. The Slack payload below uses COLOR,
          # TITLE, and TEXT — the visual status ("Success"/"Failed"/...) is
          # encoded in the title and colour, so there is no separate STATUS
          # field to track here.
          if [[ "$HAS_CHANGES" == "false" ]]; then
            COLOR="#808080"
            TITLE="Scheduled Release - No Changes"
            TEXT="No pending changes to deploy. HEAD \`${HEAD_SHA_SHORT}\` is already deployed."
          elif [[ "$PROD_RESULT" == "success" || ("$MODE" == "sandbox-only" && "$SOAK_RESULT" == "success") ]]; then
            COLOR="#36a64f"
            TITLE="Scheduled Release - Success"
            TEXT="Deployment completed successfully."
          else
            COLOR="#cc0000"
            TITLE="Scheduled Release - Failed"
            TEXT="Pipeline failed. Check workflow run for details."
          fi

          curl -sfS -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"title\": \"$TITLE\",
                \"title_link\": \"$WORKFLOW_URL\",
                \"text\": \"$TEXT\",
                \"fields\": [
                  {\"title\": \"Mode\", \"value\": \"$MODE\", \"short\": true},
                  {\"title\": \"Commit\", \"value\": \"${HEAD_SHA_SHORT:-unknown}\", \"short\": true},
                  {\"title\": \"Sandbox\", \"value\": \"${SANDBOX_RESULT:-skipped}\", \"short\": true},
                  {\"title\": \"Soak\", \"value\": \"${SOAK_RESULT:-skipped}\", \"short\": true},
                  {\"title\": \"Production\", \"value\": \"${PROD_RESULT:-skipped}\", \"short\": true},
                  {\"title\": \"Tags\", \"value\": \"${TAG_RESULT:-skipped}\", \"short\": true}
                ],
                \"footer\": \"Scheduled Release Pipeline\"
              }]
            }" || echo "Slack notification failed (non-critical)"

      - name: Pipeline Summary
        env:
          HAS_CHANGES: ${{ needs.check-pending-changes.outputs.has_changes }}
          HEAD_SHA_SHORT: ${{ needs.check-pending-changes.outputs.head_sha_short }}
          MODE: ${{ needs.check-pending-changes.outputs.mode }}
          CHANGE_SUMMARY: ${{ needs.check-pending-changes.outputs.change_summary }}
          SANDBOX_RESULT: ${{ needs.ensure-sandbox-deployed.result }}
          SANDBOX_METHOD: ${{ needs.ensure-sandbox-deployed.outputs.method }}
          SOAK_RESULT: ${{ needs.soak.result }}
          PROD_RESULT: ${{ needs.promote-to-prod.result }}
          PROD_METHOD: ${{ needs.promote-to-prod.outputs.method }}
          TAG_RESULT: ${{ needs.tag-and-track.result }}
        run: |
          {
            echo "## Scheduled Release Summary"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$HAS_CHANGES" == "false" ]]; then
            echo "**No pending changes.** HEAD \`${HEAD_SHA_SHORT}\` is already deployed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "| Stage | Result | Details |"
            echo "|-------|--------|---------|"
            echo "| Sandbox Deploy | ${SANDBOX_RESULT:-skipped} | ${SANDBOX_METHOD:-n/a} |"
            echo "| Soak Period | ${SOAK_RESULT:-skipped} | |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$MODE" != "sandbox-only" ]]; then
            echo "| Prod Promotion | ${PROD_RESULT:-skipped} | ${PROD_METHOD:-n/a} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "| Tag & Track | ${TAG_RESULT:-skipped} | |" >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$CHANGE_SUMMARY" ]]; then
            {
              echo ""
              echo "### Changes Deployed"
              echo "\`\`\`"
              echo "$CHANGE_SUMMARY"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
