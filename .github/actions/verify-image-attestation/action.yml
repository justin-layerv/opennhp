name: Verify image attestation
description: >-
  Verify a server/AC image's SLSA build-provenance attestation (produced by
  build-and-push.yml in #2339, advancing #1335) before a deploy rolls it. This
  is the pipeline-side
  half of #1334 Phase 1: it gates the deploy *job*, not instance boot, so a
  misconfiguration aborts a deploy rather than crash-looping a running fleet.

  Modes (value is trimmed + lowercased; an unrecognized value -> audit + warn,
  so a typo can't wedge every deploy):
    audit   - run the verification, log the outcome, NEVER fail the step. The
              default, and the only safe default until enough attested images
              (post-#2339) have soaked: pre-#2339 images have no attestation and
              would all fail an enforcing gate.
    enforce - fail the step (block the deploy) on ANY verify failure that is not a
              recognized transient/permission infra error — i.e. fail-CLOSED by
              default. An image that is unattested, signed by the wrong
              workflow/ref, or genuinely absent all block. Only a recognized infra
              signal (AWS throttle, docker-login blip, gh API 401/403/408/429/5xx,
              network/DNS/TLS/credential error) fails OPEN with a warning even
              under enforce — a transient error must not block a prod promotion the
              way a real verdict does. Flip fleet-wide via the
              IMAGE_ATTESTATION_VERIFY_MODE repo/env variable after soak. Each run
              emits ATTEST_RESULT=pass|fail|error.

inputs:
  repository:
    description: ECR repository name (e.g. layerv/nhp-server).
    required: true
  image-tag:
    description: Image tag being deployed; its immutable digest is resolved and verified.
    required: true
  region:
    description: AWS region of the ECR registry.
    required: false
    default: us-east-2
  registry-id:
    description: >-
      ECR registry account ID. Set for cross-account verification — prod deploys
      pull images from the sandbox account's ECR. Empty = the caller's account.
    required: false
    default: ""
  mode:
    description: >-
      audit (log only, never blocks) | enforce (fail-closed by default — block on
      any verify failure that is not a recognized transient/permission infra
      error). Trimmed + lowercased; unrecognized -> audit.
    required: false
    default: audit
  github-repository:
    description: owner/repo whose CI is the expected attestation source.
    required: false
    default: ${{ github.repository }}
  signer-workflow:
    description: >-
      Repo-relative workflow path that must have signed the attestation. Used to
      build a `gh attestation verify --cert-identity-regex` pinning the signer to
      this workflow on the `main` ref, so a different workflow (or a non-main
      ref) can't satisfy the gate.
    required: false
    default: .github/workflows/build-and-push.yml

runs:
  using: composite
  steps:
    - name: Verify image attestation (${{ inputs.mode }})
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        REGION: ${{ inputs.region }}
        REGISTRY_ID: ${{ inputs.registry-id }}
        MODE: ${{ inputs.mode }}
        GH_REPO: ${{ inputs.github-repository }}
        SIGNER_WORKFLOW: ${{ inputs.signer-workflow }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # set -e is also supplied by GitHub's composite-shell default
        # (bash --noprofile --norc -eo pipefail {0}); we set it explicitly so the
        # EXIT-trap safety net below doesn't silently weaken if that default ever
        # changes or the script is reused. The script is written to be -e-safe
        # (if-guards, `|| true`, `|| VRC=$?`), and the fixture runs it under -e.
        set -euo pipefail

        # Arm the audit safety net FIRST — before mode normalization — so even a
        # failure in that early block can't bypass it (closes the pre-trap
        # window). It fails OPEN unless the mode is unambiguously 'enforce',
        # re-normalizing MODE itself (trim + lowercase) so a raw 'Enforce' /
        # ' audit ' / typo present this early is still judged correctly. Under
        # enforce an unforeseen non-zero propagates (fail-closed is safe there).
        # shellcheck disable=SC2154  # _rc/_m are assigned inside the single-quoted trap string
        trap '_rc=$?; if [[ $_rc -ne 0 ]]; then _m="$(printf "%s" "${MODE:-}" | tr -d "[:space:]" | tr "[:upper:]" "[:lower:]")"; if [[ "$_m" != enforce ]]; then echo "::warning::verify-image-attestation exited $_rc; treating as non-blocking (mode=${_m:-audit})"; exit 0; fi; fi' EXIT

        DIGEST=""

        # Normalize the human-set mode variable (trim whitespace + lowercase) so
        # a stray capital or space ('Enforce', ' audit ') can't wedge a deploy.
        MODE="$(printf '%s' "${MODE:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
        case "$MODE" in
          audit|enforce) ;;
          *)
            # Fail SAFE for availability: an unrecognized mode must never block
            # deploys. Default to audit and shout — a typo during an enforce-flip
            # is then a loud, greppable warning rather than a wedged promotion.
            echo "::warning::verify-image-attestation: unrecognized mode '${MODE}'; defaulting to audit (non-blocking). Set IMAGE_ATTESTATION_VERIFY_MODE to exactly 'audit' or 'enforce'."
            MODE=audit
            ;;
        esac

        # One greppable marker per run so a soak-readiness check can assert
        # "N clean PASSes across server/AC/canary/promote" mechanically before an
        # enforce-flip. kind: pass | fail | error.
        emit() { echo "::notice::ATTEST_RESULT=$1 repo=${REPOSITORY} tag=${IMAGE_TAG} digest=${DIGEST:-none} mode=${MODE}"; }

        # INFRASTRUCTURE error — we could not complete the check (missing creds,
        # AWS throttle, docker-login blip, gh API 403/5xx/network). Fail OPEN even
        # under enforce: a transient tooling/permission error must not block a
        # prod promotion the way a genuine missing-attestation verdict does.
        fail_infra() {
          emit error
          echo "::warning::Attestation verify could not complete (${MODE}; NON-blocking even under enforce): $1"
          exit 0
        }

        # VERDICT failure — the check ran and the image has no valid provenance
        # from our CI. Fail CLOSED under enforce; warn under audit.
        fail_verdict() {
          emit fail
          if [[ "$MODE" == "enforce" ]]; then
            echo "::error::Attestation verify FAILED (enforce): $1"
            exit 1
          fi
          echo "::warning::Attestation verify FAILED (audit, not blocking): $1"
          echo "::warning::This WILL block once IMAGE_ATTESTATION_VERIFY_MODE=enforce. Expected for images built before SBOM/provenance (#2339) shipped."
          exit 0
        }

        # Recognized-infra allowlist — the ONLY signals that fail OPEN even under
        # enforce. Everything NOT matched here fails CLOSED (fail-closed-by-default):
        # an image that is unattested, signed by the wrong workflow/ref, or
        # genuinely absent is a verdict, not infra. One regex covers the
        # transient/permission errors of BOTH layers this gate touches (aws ecr
        # describe + gh attestation verify): HTTP 401/403/408/429/5xx (and the
        # registry's "HTTP status: 5xx" phrasing), AWS throttle/limit/timeout/5xx,
        # network/DNS, TLS *handshake* (transport, before any attestation logic),
        # and AWS auth/permission (expired/invalid/unrecognized token, sigv4
        # signature, AccessDenied, AuthFailure, missing creds). Grounded in observed
        # aws/gh wording — the
        # fixtures in tests/lints/verify-image-attestation/run-fixtures.sh assert
        # real captured strings classify correctly.
        #
        # Every token here must UNAMBIGUOUSLY mean "could not complete the check."
        # Deliberately EXCLUDED, because each is (or can be) a VERDICT that must fail
        # CLOSED — adding any of them back opens a silent hole under enforce:
        #   - 'http 404', ImageNotFound/RepositoryNotFound, MANIFEST_UNKNOWN
        #     -> "no attestation" / "no image" is a verdict.
        #   - x509 / "unknown authority" / certificate-chain wording -> a signing
        #     cert that doesn't chain to a trusted root is a BAD ATTESTATION
        #     (verification is intrinsically a cert-chain check), and that wording
        #     is indistinguishable from a transport cert error — so it fails closed.
        #     A genuine transport cert failure then blocks the deploy and surfaces
        #     in soak (the safe direction). 'tls handshake' IS transport-only.
        #   - bare 'credential' -> too broad, and 'unable to locate' already covers
        #     "Unable to locate credentials".
        # Matched case-insensitively (grep -i); patterns kept specific so a genuine
        # verdict cannot match one. The INFRA side stays coupled to gh/aws
        # human-readable wording, so re-validate after a gh/runner-image or aws-CLI
        # bump (mirrors the run-fuzz.sh deadline-race caveat in CLAUDE.md). A wording
        # drift here fails CLOSED (safe), never silently open.
        INFRA_RE='http (401|403|408|429|5[0-9][0-9])|http status: 5[0-9][0-9]|too many requests|rate.?limit|throttl|requestlimitexceeded|slow ?down|serverexception|internal(error| server error)|service unavailable|bad gateway|gateway time|timeout|timed out|deadline exceeded|connection (refused|reset|aborted)|broken pipe|unexpected eof|no such host|name resolution|temporary failure|network is unreachable|no route to host|dial (tcp|udp)|endpointconnection|could not connect|unable to (locate|connect)|expiredtoken|invalidclienttoken|unrecognizedclient|invalidsignature|incompletesignature|signaturedoesnotmatch|authfailure|access ?denied|tls[: ]+handshake'

        # Genuinely-absent-image markers from `aws ecr describe-images`. One source
        # for the retry-break and the describe-path classifier, which matches this
        # BEFORE INFRA_RE (see there for why "no image to verify" must fail closed
        # first), so the two can't drift.
        ABSENT_RE='ImageNotFound|RepositoryNotFound'

        # Resolve registry host + cross-account describe args. The cross-account
        # path (prod creds -> sandbox registry, for prod canary/promote) relies on
        # the sandbox ECR repo policy granting the prod account
        # ecr:BatchGetImage/GetDownloadUrlForLayer (verified present), not just
        # DescribeImages — gh fetches the manifest, which needs pull, not describe.
        REG_ARGS=()
        if [[ -n "$REGISTRY_ID" ]]; then
          ACCOUNT="$REGISTRY_ID"
          REG_ARGS=(--registry-id "$REGISTRY_ID")
        else
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
        fi
        if [[ -z "$ACCOUNT" ]]; then fail_infra "could not determine ECR account id (AWS creds?)"; fi
        REGISTRY="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com"

        # Resolve the tag to its immutable digest, retrying transient AWS errors
        # (up to 3 attempts, linear backoff). Inlined rather than a helper-by-name
        # so every shellcheck version sees the aws call as reached (an indirectly-
        # invoked function trips SC2329/SC2317). Capture stdout+stderr together
        # (2>&1) and extract the digest with an anchored, whole-line match, so an
        # aws stderr warning can't be mistaken for the digest AND the error text is
        # retained (DESCRIBE_OUT) to classify a failure WITHOUT a second describe
        # call. The retry ::notice:: goes to the STEP's stderr (>&2), a separate
        # stream from this $() capture, so it never lands in DESCRIBE_OUT.
        # ${REG_ARGS[@]+"${REG_ARGS[@]}"} is the safe-empty-array expansion (set -u).
        DIGEST=""
        DESCRIBE_OUT=""
        for attempt in 1 2 3; do
          DESCRIBE_OUT="$(aws ecr describe-images ${REG_ARGS[@]+"${REG_ARGS[@]}"} \
            --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" \
            --region "$REGION" --query 'imageDetails[0].imageDigest' --output text 2>&1 || true)"
          DIGEST="$(printf '%s\n' "$DESCRIBE_OUT" | grep -m1 -iE '^sha256:[0-9a-f]+$' || true)"
          if [[ -n "$DIGEST" ]]; then break; fi
          # A genuinely-absent tag/repo is a verdict, not a transient blip — stop
          # retrying; the classifier below fails it CLOSED under enforce.
          if grep -qiE "$ABSENT_RE" <<<"$DESCRIBE_OUT"; then break; fi
          if [[ "$attempt" -lt 3 ]]; then
            echo "::notice::verify-image-attestation: describe attempt ${attempt}/3 failed; retrying in $(( attempt * 3 ))s" >&2
            sleep "$(( attempt * 3 ))"
          fi
        done
        if [[ -z "$DIGEST" ]]; then
          # No digest. Classify the retained error text, FAIL-CLOSED by default.
          # aws echoes the requested image TAG back in some errors (e.g.
          # ImageNotFound's imageTag:'<tag>'), and the deploy tag is operator/
          # dispatch-settable (canary-deploy.yml passes a workflow_dispatch input;
          # ECR tags permit ._-). Scrub the tag before the INFRA_RE grep so a tag
          # like 'rate-limit-fix' / 'timeout-debug' can't match an infra token and
          # flip a verdict to fail-OPEN — the describe-side analogue of the gh-side
          # Error:-line scoping, so the classification depends only on aws's error
          # semantics, never on operator input. (Quoting "$IMAGE_TAG" makes // a
          # literal, glob-safe replacement.) The genuinely-absent verdict
          # (ABSENT_RE) is checked FIRST, on the raw text — an exception name, never
          # the tag — so "no image to verify" (#1334) fails closed regardless. Only
          # THEN fail OPEN on a recognized transient/permission signal; anything
          # else fails CLOSED. Inert under audit (every fail_* path exits 0).
          if grep -qiE "$ABSENT_RE" <<<"$DESCRIBE_OUT"; then
            fail_verdict "no image to verify for ${REPOSITORY}:${IMAGE_TAG} (absent tag/repo): ${DESCRIBE_OUT}"
          fi
          SCRUBBED_OUT="${DESCRIBE_OUT//"$IMAGE_TAG"/<image-tag>}"
          if grep -qiE "$INFRA_RE" <<<"$SCRUBBED_OUT"; then
            fail_infra "could not resolve digest for ${REPOSITORY}:${IMAGE_TAG} (transient AWS/permission error): ${DESCRIBE_OUT}"
          fi
          fail_verdict "no image to verify for ${REPOSITORY}:${IMAGE_TAG} (unrecognized describe error): ${DESCRIBE_OUT}"
        fi
        REF="oci://${REGISTRY}/${REPOSITORY}@${DIGEST}"

        # gh fetches the OCI manifest, so ECR needs docker auth (cross-account-
        # capable: caller creds against the sandbox registry, like the instance
        # pull path in compute/user_data.sh.tpl).
        if ! aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY" >/dev/null 2>&1; then
          fail_infra "docker login to $REGISTRY failed (cannot fetch manifest to verify)"
        fi

        # cert-identity-regex pins BOTH the signer workflow path AND the ref to
        # main (defense in depth atop the OIDC main-only restriction in #1121),
        # so only an attestation minted by build-and-push.yml on main passes.
        # Escape EVERY regex metacharacter in the interpolated path (whitelist
        # the literal-safe chars; escape the rest), so the anchored identity is
        # an exact match even if a caller passes a path containing + * ( etc. —
        # not just dots. build-and-push.yml, never build-and-pushXyml.
        # '#' delimiter (not '/') so the '/' inside the bracket expression is
        # unambiguous on any sed (GNU and BSD/macOS), not just GNU's.
        ESC_REPO="$(printf '%s' "$GH_REPO" | sed 's#[^a-zA-Z0-9/_@:-]#\\&#g')"
        ESC_WF="$(printf '%s' "$SIGNER_WORKFLOW" | sed 's#[^a-zA-Z0-9/_@:-]#\\&#g')"
        IDENTITY="^https://github\\.com/${ESC_REPO}/${ESC_WF}@refs/heads/main\$"
        echo "Verifying $REF"
        echo "  expected signer : ${GH_REPO}/${SIGNER_WORKFLOW} @ refs/heads/main"
        echo "  identity-regex  : ${IDENTITY}"
        # NB: the flag is gh's --cert-identity-regex (cosign spells the same
        # concept with a trailing 'p' — that name makes gh error on an unknown
        # flag before it ever checks attestations, so every image would classify
        # as an infra error and the gate would silently never verify). The exact
        # spelling is locked by run-fixtures.sh.
        VRC=0
        VOUT="$(gh attestation verify "$REF" --repo "$GH_REPO" \
                  --cert-identity-regex "$IDENTITY" \
                  --cert-oidc-issuer "https://token.actions.githubusercontent.com" 2>&1)" || VRC=$?
        printf '%s\n' "$VOUT"
        if [[ "$VRC" -eq 0 ]]; then
          emit pass
          echo "::notice::Attestation verify OK (${MODE}): ${REPOSITORY}@${DIGEST}"
          exit 0
        fi
        # Classify the failure. Fail CLOSED by default: an image that is unattested,
        # signed by the wrong workflow/ref, or whose manifest is gone has no valid
        # provenance from our CI and MUST block under enforce. Fail OPEN only on a
        # RECOGNIZED transient/permission infra signal (INFRA_RE) — a transient must
        # not block a prod promotion the way a real verdict does. This inverts the
        # old "match the no-attestation wording, else infra" logic, under which an
        # identity/ref mismatch fell through to fail-OPEN (the #1334 gap). Grounded
        # in observed gh 2.92.0 wording (complete output, locked by run-fixtures.sh):
        #   - identity/ref/workflow mismatch -> 'Error: verifying with issuer "GitHub, Inc."'
        #     -> no INFRA_RE match -> verdict (fail-closed). THIS is the gap, fixed.
        #   - no attestation at all          -> 'Error: HTTP 404 ... /attestations/...'
        #     (404 deliberately NOT in INFRA_RE) -> verdict (fail-closed).
        #   - manifest gone                  -> 'Error: ... MANIFEST_UNKNOWN ...' -> verdict.
        #   - permission/throttle/5xx/network-> 'Error: HTTP 401/403/408/429/5xx',
        #     'Error: failed to fetch ... dial tcp ... no such host' -> INFRA -> infra.
        #
        # Match INFRA_RE only against gh's terminal error line(s) — gh emits its
        # failure as a single `Error: <...>` line (confirmed for every case above),
        # so the candidate attestation's identity, if a future gh prints it, lands
        # on a separate INFORMATIONAL line that we do NOT scan. That identity is an
        # attacker-influenceable branch/workflow ref (e.g. a branch named
        # 'fix-503-timeout'); scanning the whole blob would let such echoed text
        # flip a verdict to fail-OPEN — the exact hole this PR closes. A gh failure
        # we can't see an `Error:` line for fails CLOSED (the safe direction). The
        # describe layer greps its full output because aws only ever echoes OUR
        # inputs (repo/tag), never attacker-controlled attestation identity.
        # Inert under audit (every fail_* path exits 0).
        GH_ERR="$(printf '%s\n' "$VOUT" | grep -iE '^[[:space:]]*Error:' || true)"
        if grep -qiE "$INFRA_RE" <<<"$GH_ERR"; then
          fail_infra "could not complete attestation verify for ${REPOSITORY}:${IMAGE_TAG} (${DIGEST}) — transient/permission error (see output above)"
        fi
        fail_verdict "no valid SLSA provenance from ${GH_REPO}/${SIGNER_WORKFLOW}@main for ${REPOSITORY}:${IMAGE_TAG} (${DIGEST}) — unattested, or signed by a different workflow/ref"
