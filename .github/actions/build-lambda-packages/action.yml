name: 'Build Lambda Packages'
description: 'Builds Lambda packages with Python dependencies for Terraform'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip packages
      uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
      with:
        path: ~/.cache/pip
        key: lambda-pip-${{ runner.os }}-${{ hashFiles('terraform/modules/acme-cert/lambda/requirements.txt', 'terraform/modules/custom-domain-cert/lambda/requirements.txt') }}
        restore-keys: |
          lambda-pip-${{ runner.os }}-

    - name: Build ACME Certificate Lambda
      shell: bash
      run: |
        echo "::group::Building ACME Certificate Manager Lambda"
        bash terraform/modules/acme-cert/lambda/build.sh
        echo "::endgroup::"

    - name: Build Custom Domain Certificate Lambda
      shell: bash
      run: |
        echo "::group::Building Custom Domain Certificate Manager Lambda"
        bash terraform/modules/custom-domain-cert/lambda/build.sh
        echo "::endgroup::"

    - name: Verify Build
      shell: bash
      run: |
        echo "::group::Verifying Lambda Build"
        bash terraform/modules/acme-cert/lambda/test_build.sh
        echo "Verifying custom-domain-cert Lambda build..."
        test -f terraform/modules/custom-domain-cert/build/package/custom_domain_cert_manager.py \
          || (echo "ERROR: custom-domain-cert Lambda build output missing" && exit 1)
        echo "  [OK] custom_domain_cert_manager.py exists"
        echo "::endgroup::"

    - name: Run Python Unit Tests
      shell: bash
      env:
        # Keep Lambda unit tests hermetic even when the caller has already
        # configured deploy credentials. Tests must mock AWS side effects, not
        # publish metrics or mutate resources in the active account.
        AWS_ACCESS_KEY_ID: unit-test
        AWS_SECRET_ACCESS_KEY: unit-test
        AWS_SESSION_TOKEN: unit-test
        AWS_DEFAULT_REGION: us-east-2
        AWS_REGION: us-east-2
        AWS_EC2_METADATA_DISABLED: "true"
      run: |
        echo "::group::Running Python Unit Tests"
        pip install -q -r terraform/modules/acme-cert/lambda/requirements-dev.txt
        pip install -q -r terraform/modules/custom-domain-cert/lambda/requirements-test.txt
        pytest terraform/modules/acme-cert/lambda/test_acme_cert_manager.py -v
        pytest terraform/modules/custom-domain-cert/lambda/test_cert_manager.py -v
        echo "::endgroup::"
